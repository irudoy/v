summary = """
Active diagnostic response transmission mode copied from the TXM byte of SID \
0x21. The service accepts only 0x04 and 0x06. The transmit-complete \
interrupt counts finite mode 0x04 and routes continuous mode 0x06 through \
the response-completion state-machine path."""
note = [
    """
Mode 0x06 remains active across responses; its NRS byte does not terminate \
the stream.""",
]
level = "code"
unit = "diagnostic mode"

