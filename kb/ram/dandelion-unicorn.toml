summary = """
Intake-air-temperature PID byte. FUN 0003d832 copies lane 0 of the pair \
ffff3f42 here at 0003d8c4, where FUN 0003d4a8 writes max(lookup(00012dea, \
uint8(ffff1d58 >> 2)) - 10, 0); FUN 00035856 returns the byte unchanged for \
J1979 Mode 01 PID 0x0F at 00035daa."""
note = [
    """
J1979 defines PID 0x0F as A-40 deg C, so the ECU declares the 00012dea \
transfer code as deg C+50 and AN1 lane 0 as the intake-air-temperature \
channel. DID 0x1106 byte ffff2837 is the same transfer code of the filtered \
lane-0 sample.""",
]
level = "code"
unit = "degC+40"

