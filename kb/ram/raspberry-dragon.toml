summary = """
Scheduler snapshot of exact raw engine-coolant-temperature byte ffff1079. \
FUN 0004afdc maintains timing-transition warm latch ffff41de.bit5; FUN \
0007584e maintains its independent alternate-threshold latch ffff249e.bit0; \
additional consumers implement misfire readiness, ignition correction \
hysteresis, and diagnostic warm latches."""
note = [
    """
Exact DID 0x1101 uses deg C = raw-50. The limiter latch sets at raw 255, \
retains through raw 239, and clears at 238, corresponding to theoretical \
205, 189, and 188 deg C boundaries rather than an ordinary warm-engine \
transition. Other consumer thresholds remain independently documented.""",
]
level = "code"
unit = "raw coolant byte"

