summary = """
Scheduler snapshot of selected raw-temperature byte ffff1076, the engine \
coolant temperature latched at engine start. It equals raw coolant ffff1079 \
during a computed START SIGNAL interval with battery-voltage raw below 100 \
and holds the value of the last selection afterwards. P030 readiness \
requires at least 40, while FUN 000804ce latches ffff422f.bit4 when raw \
coolant snapshot ffff1071 exceeds this byte by at least 20."""
note = [
    """
The byte has the raw-coolant scale deg C = raw-50. The P030 threshold of 40 \
is a start temperature of -10 deg C, and the rise of 20 counts is the \
coolant rise of 20 deg C after engine start in factory driving pattern A.""",
]
level = "code"
unit = "degC+50"

