summary = """
Second byte of the centered two-bank intake-cam timing pair. FUN_000bd9f0 \
writes clamp_u8(0x80 + ffff479a - ffff22cd), or neutral 0x80 under the \
hardware-control mask."""
note = [
    """
One count is 0.5 crank degrees through edge phase ffff22cd of capture \
handler 0002a36a, the same unit and sign as ffff2442; the crank-wheel origin \
of the absolute angle remains open.""",
]
level = "code"
width = 8
unit = "degCA"
scale = "x*0.5-64"

