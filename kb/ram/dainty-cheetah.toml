summary = """
Multipurpose status byte. Bit 7 gates dynamic-threshold movement in \
rotational-speed request limiter 0007584e: a set bit permits calibrated \
down/up steps 0x9430 and 0x9436. Bit 6 independently gates debounce counter \
ffff1846 in DTC monitor 000aacc0 and permits the ffff2b73 >= 5 P030 inhibit \
branch in misfire coordinator 00082c8a. Scheduler 00020dfe copies tick-flag \
byte ffff84c4 into it at 00020ee6 and reloads ffff84c4 from ffff84bb at \
00020ef0; base-tick handler 0002040c ORs 0x80 into ffff84c4 at 00020734 \
every 1.024 ms, so bit 7 is set on every scheduler pass, and FUN 000904c2 \
counts ffff1998+b once per 10.24 ms pass while it is set."""
note = [
    """
Stock limiter rates are zero, so bit 7 cannot move the stock threshold. The \
wave 2 claim that bit 6 selects the base mode in 00055098 is refuted. Bit 7 \
is the scheduler-pass tick; the physical meaning of bit 6 remains unresolved \
and must not be merged with it.""",
]
level = "code"
unit = "bitfield"

