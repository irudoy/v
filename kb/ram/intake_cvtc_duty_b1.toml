summary = """
First cell of the live two-cell intake-VTC solenoid duty pair. FUN 000be814 \
writes it for channel 0 at offset 0x84 of base ffff23bc. FUN 000bdee4 reads \
it at offset 0x84 of base ffff23bc and requires both cells to be zero while \
intake target ffff2326 is neutral 0x80 before it lets delay counter ffff2534 \
expire and set bit 5 of ffff246b."""
note = [
    """
CAN telemetry schema 2 streams the pair as CVTC duty B1 and B2. The block \
copy of FUN 00020dfe at 00021318 latches the pair into command cells \
ffff23b4/ffff23b5, so the ATU-II conversion raw*39/100 percent applies to \
both pairs. The eleven 2026-09-21 profile-5 captures hold both pairs equal \
in all 279,130 records that carry them, 112,598 of them nonzero.""",
]
