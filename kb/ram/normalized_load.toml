summary = """
Scheduler snapshot of the Q7 normalized Base Fuel Schedule byte ffff1048. \
FUN 00020dfe copies ffff1048..ffff1063 to ffff102c..ffff1047 before periodic \
tasks produce the next values. The exact representation is \
min(255,floor(uint16[ffff1026]*128/ROM16[00009534])), with stock reference \
0x6a5a; normalized percentage is raw*100/128. It is the column coordinate \
for ignition and intake-cam target maps, the shifted coordinate and \
threshold input in FUN 0004d2a6, and the normal Y input for exhaust-CVTC \
target accessor 000bfdc0."""
note = [
    """
The percentage is relative to the Base Fuel Schedule reference and saturates \
at raw 255.""",
    """
The fixed-reference ratio, Q7 encoding, snapshot direction, and operational \
consumers are exact. The HR catalog calls the ratio Cylinder Filling Up \
Efficiency; that physical name remains a candidate and is not required for \
the normalized-BFS percentage. J1979 Calculated Load ffff413e uses a \
different RPM-dependent denominator and 100*A/255 encoding.""",
    """
Independent 7mfk execution binds the exact 28-byte snapshot call, \
length-table selection, seven descending longword stores, and the \
normalized-load byte at offset zero. The dispatcher JMP delay slot loads \
source offset 24; its selected tail returns through the stock RTS and R3-pop \
delay slot. The byte view preserves the existing percent conversion without \
a direct MOV.B store, whole-scheduler execution, or hardware atomicity \
claim.""",
]
level = "code"
width = 8
unit = "percent"
scale = "x*100/128"

