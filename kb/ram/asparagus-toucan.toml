summary = """
Common-gain factor byte written by alternating-pass builder 00053698 as \
min(255, floor((uint8(ffff17ee)*5259 + 0x128500)/10000)). The affine map \
sends 256 to 256 and, before the integer floor, stays within 0.4 count of \
256*sqrt(x/256) over the reachable input range 198..255. The builder then \
writes ffff165e = floor(ffff160d*ROM16[0x9332]/256)."""
note = [
    """
The reachable range is 225..255. Read with ffff17ee, the byte approximates \
256*sqrt(C/(C+V)), the square-root flow correction of an injector whose \
differential pressure rises from reference C by manifold depression V; this \
physical reading is a candidate.""",
]
level = "code"
unit = "ratio_q8"

