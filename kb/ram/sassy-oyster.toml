summary = """
Previous-pass snapshot of engine-oil-temperature byte ffff2876, the DID \
0x111f source. Scheduler 00020dfe copies it through the 0x104-byte block \
ffff277e..ffff2881 -> ffff267a..ffff277d at 00020fcc. FUN 000c1dec reads it \
at 000c1ece as the coordinate of exhaust-VTC gain curve 0001205a over axis \
00012850, enable coordinator 000bf630 forms hysteresis flag ffff246c bit 3 \
from it against ROM8[00008dff]=110 at 000bf73e, and FUN 000bfe88 with eleven \
further functions read it. With ROM8[00008616] bit 0 set, as in stock JK08A, \
FUN 0003eb84 publishes the converted oil-temperature sample in ffff2876, so \
the coordinate follows the engine oil temperature and the gain is 102 up to \
raw 100 (50 degC) and 128 from raw 135 (85 degC)."""
note = [
    """
Readers: 000658a4, 00099efe, 0009a0d4, 000bd20a, 000bdb66, 000bdc66, \
000be32a, 000be5bc, 000be8f8, 000bec52, 000befb0, 000bf630, 000bfe88, \
000c1dec. The representation follows ffff2876: deg C = raw-50, established \
by code on that row.""",
]
level = "code"
unit = "degC+50"

