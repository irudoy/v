summary = """
Per-bank judgement timer of the exhaust-VTC position-sensor monitors \
(ffff43be + b). FUN 00090086 reloads it with ROM8[00008e23]=100 at 0009016a \
and 0009017a while indicator ffff850d bit 6 + b is clear or its enable is \
clear, reads it at 0009010e, and sets judged latch ffff3580 bit b at \
0009011c when it has reached zero with the indicator set; FUN 0009018c \
applies the same rules with ffff850d bit 4 + b and ffff3581."""
note = [
    """
The timer lies in the 102.4 ms byte block ffff42d3..ffff43c6 of base-tick \
handler 0002040c, so the reload of 100 is 10.24 s.""",
]
level = "code"
unit = "102.4 ms counts"

