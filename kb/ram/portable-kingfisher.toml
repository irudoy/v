summary = """
Unsigned common additive and masked-channel override word. FUN_00056fc0 \
writes clamp_u16(max(0, arithmetic_shift7((175-uint8(ffff1108))*92)+70)). \
FUN_0004ead4 adds it to both normal bank bases, FUN_0004eba2 selects it \
directly when the current channel bit is set in ffff22e0, and FUN_00051a98 \
adds it to every mask-gated channel word."""
note = [
    """
The word is the injector opening time in 10 us counts: 70 counts, 0.70 ms, \
at battery snapshot ffff1108 = 175, moving 92/128 counts per byte, and \
spanning 0.66..0.82 ms over the recorded byte range 157..180 under the \
source-bound 0.08 V/count conversion. Scheduler 0002c13c substitutes its \
snapshot ffff23aa for an inhibited channel and subtracts it when a pulse is \
already in flight.""",
]
level = "code"
unit = "ms*100"

