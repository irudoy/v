summary = """
Selected raw-temperature byte, the engine coolant temperature latched at \
engine start. FUN 000394b8 writes raw coolant ffff1079 while selector \
0003967a returns 1 and previous-pass image ffff107e while it returns 0, \
which holds the last selection; scheduler 00020dfe snapshots it to ffff106e. \
FUN 0003d702 also uses it in its offset-selection condition."""
note = [
    """
RAM initialization clears transition latch ffff24be.bit6, so the first pass \
after it selects coolant once. A computed START SIGNAL interval with battery \
voltage below 8.00 V tracks coolant and ends with one more selection. The \
scale is raw coolant deg C = raw-50.""",
]
level = "code"
unit = "degC+50"

