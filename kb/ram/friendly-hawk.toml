summary = """
Bit 5 is the projected phase of five-state machine ffff39d8: FUN 00027530 \
sets it for states 2..4 and clears it for states 0/1; scheduler 00020dfe \
also refreshes the byte from ffff2451. In the P030 count-readiness path, bit \
5 controls whether ffff42a8 is refreshed or retained and is mandatory for \
setting ffff41d2.bit1. Bit 2 must be clear for 0004afdc to select warm \
transition timing table 0001219e; the same bit selects the 00011f0a versus \
00011f12 correction and must be set for fuel-output inhibit state machine \
0004f324. Bit 1 selects curve A or B in FUN 0004569c. Bit 2 is P/N position \
switch ON, the scheduler copy of ffff2451 bit 2, and is a term of the \
standstill exhaust-override predicate ffff246c bit 1."""
note = [
    """
The bit-5 state relation, timing-table gate, P030 latch role, and bit-1 \
curve selection are exact. The bit-2 identity follows from FUN 00038618 and \
the DID 0x1302 P/N POSI SW chain. On the 2026-09-17 captures the override \
fires with the selector in D as well as in P, so the ECM input of the \
recorded car reads ON in D. The physical mode represented by ffff39d8 and \
curve selection remains unresolved.""",
]
level = "code"
unit = "bitfield"

