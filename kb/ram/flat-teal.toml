summary = """
Scheduler copy of ffff417f, taken by 00020dfe before its periodic loop after \
the previous value moves to ffff4180. Bit 3 gates the latch of Q16 \
blend-weight input 0x1488a (ffff10d2 -> ffff1a78) in 00070e4c. Bit 6 selects \
the timing or the idle request of automatic work-support selector 000682f6, \
and 000682a2 counts its changes."""
note = ["FUN 00027530 also writes bit 5 directly at 00027654."]
level = "code"
unit = "bitfield"

