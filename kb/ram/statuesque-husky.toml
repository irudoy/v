summary = """
Interval-derived engine-speed byte. FUN 0003df2c divides 41666 by interval \
quotient ffff22bc through signed divider 00021bbc, saturates the quotient to \
255, keeps the last three results in ffff3e34..ffff3e36, and publishes their \
median; when diagnostic-mode snapshot ffff24c9 bit 5 is set it copies \
saturated engine-speed byte ffff11ea instead. The substitute fixes the \
representation as rpm/12.5; the dividend corresponds to 120-degree crank \
events on a 3.2 us timer tick. Scheduler 00020dfe copies it to ffff2700."""
note = [
    """
The rpm/12.5 representation is code through the ffff11ea substitute; the \
timer tick and event angle are the consistent candidate.""",
]
level = "code"
unit = "rpm/12.5"

