summary = """
Interval-derived engine-speed byte. With ffff24c9.bit5 clear, FUN 0003df2c \
shifts ffff3e34 into ffff3e35 and ffff3e35 into ffff3e36 before inserting \
min(255,floor(41666/ffff22bc)) at ffff3e34. The 16-bit unsigned input \
ffff22bc is a 10-degree tooth period; the call uses signed divider 00021bbc \
with positive operands. A zero period inserts zero and records 0x44e at \
ffff9818; the median can remain nonzero. The producer publishes \
median(ffff3e34,ffff3e35,ffff3e36) at ffff2804. Bit 5 set copies ffff11ea \
and preserves history. Scheduler 00020dfe copies the result to ffff2700."""
note = [
    """
The ffff11ea substitute binds the byte representation to rpm/12.5. For a \
10-degree period on a nominal 3.2 us tick, 60/(36*3.2e-6*12.5) is \
41666.666..., whose integer numerator is ROM32[0003e150]=41666.""",
]
level = "code"
unit = "rpm/12.5"

