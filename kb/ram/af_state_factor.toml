summary = """
Commanded mixture word: Q14 fuel-multiplier command against the \
stoichiometric base schedule, 0x4000 = closed-loop stoichiometric target, \
commanded equivalence ratio = x/16384. Stage 0005594a of coordinator \
00057608 is the sole stock runtime writer: it takes max(ffff123a, ffff123c), \
forces 0x4000 while engine-speed byte ffff2700 < 32 or countdown ffff2531 is \
nonzero, and caps the word at ROM16[000094ec] when ffff4252 bit 1 is set. \
FUN 000556ec scales min(65535, ffff231a + ffff240a) by this word over 16384, \
and 0004ead4 selects the open-loop branch when published product ffff22e6 \
exceeds 0x4000. Alternate writer 00055596 is excluded by stock \
ROM8[00008b42] bit 0 = 0 and ROM8[00008b34] bit 4 = 0. The exact \
service-0x22 table publishes the high byte as DID 0x1134."""
note = [
    """
Three 2026-08-26 vehicle recordings agree with the code: the streamed word \
is always a multiple of 128 within 16384..19072, settled values match the \
0000a9aa lookup in 98.3..100 percent of records, and both STFT words stay at \
neutral 0x6400 in every record with a command above 0x4000. Commanded lambda \
= 16384/x. The gasoline AFR scale 1881.6/(x/128) of the public HR A2L is a \
candidate.""",
]
