summary = """
Signed recovery envelope of rotational-speed request limiter 0007584e. It \
tracks a lower request immediately only when that request is also below APP \
and ffff1083 > ffff1082. Otherwise it advances toward 0x7fff by 0x943a or \
0x943c according to ffff1083 > ffff1064. Output is the signed minimum of the \
request and this envelope."""
note = [
    """
When this envelope is more restrictive, the function restores ramp ffff19da \
to its entry value. The physical context and request scale remain \
unresolved.""",
]
level = "code"
unit = "signed raw"

