summary = """
Bits 0 and 1 are the per-bank judged flags of FUN 00090d54, the P1080/P1086 \
path (descriptor records 0x88 and 0x89). With ffff4184 bit 7 and ffff24ab \
bit 3 set, the function sets bit b once timer ffff25f0 + b has expired while \
cam edge phase snapshot ffff11c8 + b is at or below ROM8[00008e32]=254, and \
then reports the record through 0007d8b8 once timer ffff25f2 + b has \
expired. FUN 00090e02 clears both bits. Either bit blocks exhaust-VTC \
operating enable ffff248b bit 2 in 000bf630."""
note = [
    """
Family entry 00090e5e calls 00090d54 only under ROM8[000186f2] bits 5 and 4; \
stock JK08A holds 0x07, so the function never runs and both bits stay \
clear.""",
]
level = "code"
unit = "bitfield"

