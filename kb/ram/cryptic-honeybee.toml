summary = """
Work-support timing adjustment (CONSULT TARGET IGN TIM ADJ), published as \
DID 0x112d. Scheduler 00020dfe copies it from ffff56b2 as part of a \
0x66-byte block, and final timing-coordinate builder 0004dbe8 consumes it."""
note = [
    """
This byte is not a copy of ffff1513. FUN 0004dbe8 adds it to ffff12d6 only \
while ffff5b31 bits 1..5 are clear (warm coolant, RPM/25 within \
ROM8[0x8897]..ROM8[0x8896]=48..128, load ffff1048 within \
ROM8[0x8768]..ROM8[0x8767]=64..96); the value is bounded to \
ROM8[0x821d]..ROM8[0x821c]=-5..0 crank degrees at its source 0004aad0. The \
homologous P32M profile names DID 0x112d CRRCTD IGN TIM; \
JK08A.work-support.md specifies the service-0x3b path.""",
]
level = "code"
width = 8
unit = "deg"

[[diagnostic]]
id = "ignition-timing-adjustment-did-112d"
kind = "runtime_value"
label = "DiagnosticParameter"
key = "diagnostic-parameter:semantic:cid-112dh-crrctd-ign-tim"
claim = {label = "ParameterDefinition", id = "ecudocs-p32m-997c5a9:data:cid-112dh-crrctd-ign-tim-f2c3d2db"}
applicability = "nissan_family_candidate"
scope = "exact-code"
priority = 100
level = "code"
note = """
FUN 0004aad0 writes the work-support timing adjustment to ffff56b2 within \
ROM8[0x821d]..ROM8[0x821c]=-5..0 from service-0x3b LID-1 slot ffff99dc, \
stored record 0x74, or the automatic step, and scheduler 00020dfe copies it \
to ffff564c. The exact JK08A service-0x22 table publishes ffff564c as DID \
0x112d, and FUN 0004dbe8 adds it to the final timing coordinate with \
coefficient 1 in crank degrees inside the ffff5b31 window. A structured \
Nissan profile names DID 0x112d CRRCTD IGN TIM and its write request 3b 01 \
DataWrite.ADVADJ, and the factory manuals list the matching work-support \
item TARGET IGN TIM ADJ."""

