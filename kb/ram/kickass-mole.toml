summary = """
Current Base Fuel Schedule sample. Its high byte serves as the load-axis \
input of the 16x16 accessor families 00082c8a and 000befb0 and enters the \
five-level rotational-irregularity classifier. The full unsigned word is the \
numerator of calculated-load producer 0008083c: \
floor((ffff1024<<8)/lookup(0x1491a)). Scheduler 00020dfe copies the previous \
value to ffff1028 before refreshing ffff1024 from ffff1026."""
note = [
    """
Exact DID 0x1208 returns producer word ffff1026 as Base Fuel Schedule. One \
count is 1/2048 ms in the time base of the injection-pulse words, which \
makes the high byte raw/8 ms; the derivation is recorded at ffff1026. Pulse \
precursor 0004e974 and common-gain builder 00053698 read this sample.""",
]
level = "code"
unit = "ms*2048"

