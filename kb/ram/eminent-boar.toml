summary = """
Result bits of the P0014/P0024 target-tracking pair. FUN 000904c2 sets the \
bank bit at 000905fc together with ffff3583; FUN 0008f168 sets the stored \
fault of index 0xd2 or 0xd3 through 0008c2d2 while the bit is set and clears \
it through 0008c348 otherwise. A latched pass instead clears the stored \
fault directly from FUN 000904c2."""
