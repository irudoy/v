summary = """
Accumulator of the MAF coefficient calibration sequence. FUN 000662f6 adds \
eight ffff1a3e samples into it, each required to lie within \
ROM8[0x8d3e]*4=856..ROM8[0x8d3f]*4=944 counts."""
note = [
    """
FUN 0006635c divides ROM8[0x8d40]=225 shifted left by twenty by this sum, so \
the sequence returns stock coefficient 0x8000 at an average of 900 counts, \
which is 4.50 V at 5 mV per count and the centre of the 856..944 acceptance \
window.""",
]
level = "code"
unit = "ADC counts sum"

