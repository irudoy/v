summary = """
Start-latched fuel-temperature byte. FUN 00039788 writes current \
fuel-temperature byte ffff1074 at 000397d8 while gate 00039902 returns 1 and \
previous-pass image ffff107b while it returns 0, which holds the last \
selection; scheduler 00020dfe snapshots it to ffff106b."""
note = [
    """
Gate 00039902 repeats the state machine of coolant selector 0003967a with \
latch ffff24bd.bit5: a computed START SIGNAL interval with battery-voltage \
raw below 100 tracks the current byte, and the first pass outside it selects \
the current byte once.""",
]
level = "code"
unit = "degC+50"

