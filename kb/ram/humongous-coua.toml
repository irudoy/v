summary = """
Exhaust-VTC active-test offset. FUN 0002e466 stores clamp(int8(ffff9940), \
ROM8[0000873e]=-20..ROM8[0000873f]=20) at 0002e612 while it sets request bit \
ffff249c bit 6; FUN 000bfe88 reads it at 000c04da while the bit is set and \
adds it to the exhaust target."""
note = [
    """
ffff9940 is the value byte of service-0x30 Output Control IOLID 0x1d \
(ffff9923 + n in handler 00030c4c). The unit of the offset follows the \
exhaust target byte.""",
]
level = "code"
unit = "signed raw"

