summary = """
Flag byte of the exhaust-VTC coordinators. FUN 000bf630 maintains bits 4 and \
2 as the 900 RPM engine-speed flags with 700 RPM release. FUN 000bf9b0 \
writes bit 7 as the rest-edge learning gate: set at 000bfa3c while \
electrical enable ffff248b bit 0, coolant flags ffff24a9 bits 3 and 6, and \
engine-speed flag ffff24aa bit 0 (ffff11b2 at most ROM8[00008e1b]=80, 1000 \
RPM with release above 1200 RPM) are set and driver status ffff850c bits 5 \
and 6, predicate 00025e4e, and inhibit ffff41be bit 6 are clear, and cleared \
at 000bfa8a otherwise. Learner 000bfad4 requires bits 7 and 4 to store the \
learned edges."""
note = [
    "Bits 5 and 3 are inputs of the target-tracking pair of monitor 0008f168.",
]
level = "code"
unit = "bitfield"

