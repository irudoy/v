summary = """
Injection-end delay after the reference engine event of the scheduled \
cylinder, 2 crank degrees per count. FUN 00056bd0 writes 2*min(y, 209) from \
table 00012302 plus add-on ffff340c or from table 0001230a, and FUN 00056e70 \
writes the alternate value. FUN 000521a8 is the only reader found: it \
subtracts the pulse angle and splits the result into lead ffff23f0 and start \
angle ffff23bf."""
note = [
    """
Sequencer 00054a44 places the reference tooth of the scheduled channel 130 \
crank degrees after intake TDC of the injected cylinder, so the pulse ends \
x*2 - 590 crank degrees after the following intake TDC. The channel order \
rests on the Power Balance bit assignment of the Nissan-family diagnostic \
profile, and the offset between the crank sensor and the signal plate \
remains a hardware boundary.""",
    """
A whole-ROM scan finds window offset 0x06a2 only in 000521a8, 00056bd0, and \
00056e70. The stock base table gives 266 counts, 532 crank degrees.""",
]
level = "code"
width = 16
unit = "degCA"
scale = "x*2-590"

