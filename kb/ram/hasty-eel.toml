summary = """
Previous-cycle normalized engine-coolant-temperature index. Scheduler \
00020dfe copies ffff1077 to ffff106f. In the linear range it is \
floor(1.6*(DID 0x1101 raw-10)), so lookup nodes 0,16,...240 represent \
-40,-30,...110 deg C."""
note = [
    """
DID 0x1101 returns ffff1079 and homologous diagnostic definitions identify \
it as engine coolant temperature with deg C = raw-50. FUN 00039634 performs \
the exact normalization and saturation.""",
]
level = "code"
unit = "normalized coolant index"

[logparam]
id = "X_VQ_Coolant_Temperature"
static_axis_name = "Coolant Temperature [deg C]"

