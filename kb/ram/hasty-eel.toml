applicability = "homologous_community"
scope = "exact-code"
priority = 95
level = "code"
note = """
The exact JK08A UDS table maps DID 0x1101 to byte ffff1079. Homologous \
measured diagnostic data identifies DID 0x1101 as engine coolant temperature \
with deg C = raw-50. FUN 00039634 converts this byte to current normalized \
index ffff1077, and scheduler 00020dfe copies it to previous-cycle \
calibration index ffff106f."""

