summary = """
Base of the common three-byte runtime diagnostic-record array. FUN 0007ebec \
initializes 0x157 records. Exact ROM descriptors occupy indices through \
0x128; extension record 0x129 contains the byte1/byte2 OR summary of \
P0101/P0102/P0103 and P010B/P010C/P010D produced by 00097eb4. FUN 000259e4 \
tests bits 5 and 6 of a record third byte, 00025e20 tests byte1.bit7, and \
0007c3b4 applies the critical-record predicate."""
note = [
    """
The bit operations and predicate polarities are exact. Internal status bits \
are not assigned UDS status-bit names.""",
]
level = "code"
unit = "diagnostic status array"

