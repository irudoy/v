summary = """
Delayed injection-start angle inside the engine event, 4 crank degrees per \
count. FUN 000521a8 forms the start delay 2*uint16[ffff192e] minus the pulse \
angle in crank degrees, subtracts ROM8[000083ea] = 30 while P0335 fallback \
snapshot ffff24c9.bit5 is set, divides by 120, clamps the remainder to \
4..116, and stores remainder/4 here. Scheduler copier 00020dfe snapshots the \
byte to ffff2333, which sequencer 00054a44 multiplies by four for \
delayed-start programmer 0002b64a."""
note = [
    """
The pulse angle is the longest of the six transformed pulse words, so the \
start is exact for that channel. The crank angle of the reference event \
relative to TDC of the scheduled cylinder remains unresolved.""",
]
level = "code"
unit = "4 degCA"

