summary = """
Current crank/cam position-diagnostic mode byte. FUN 00099a48 can set bit 6 \
from the P0335 runtime-record pair when the P0340 and P0345 pairs do not \
select companion modes. Scheduler 00020dfe copies this byte to ffff24c9."""
note = [
    """
Other functions maintain independent bits. Bit 6 selects alternate behavior \
in both APC compare schedulers.""",
]
