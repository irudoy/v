summary = """
Bank-2 intake-cam edge phase byte. Capture handler 0002a36a copies running \
phase ffff22d3 here at 0002a496 while event state ffff13c8 is 1, 3, or 5. \
The running phase is 20*ffff13b2 + floor(20*interval / ffff22bc) - 60 \
(selector below 8) or - 20 (selector 8 and above) through signed divider \
00021bbc, clamped at zero, where interval is the 16-bit difference between \
GR1E capture fffff44c and crank reference count ffff158a stored at ffff22ca. \
The pass requires ffff84ff bit 7 set, ffff8504 bit 7 clear, and edge count \
ffff1390 equal to 1, and first shifts the previous values into ffff22cf and \
ffff22d1. FUN_000bd9f0 subtracts the byte from rest reference ffff479a to \
form actual position ffff2443."""
note = [
    """
One count is 0.5 crank degrees: ffff22bc is 10 crank degrees and the \
selector step is 20 counts, the same arithmetic as exhaust edge phase \
ffff1200. The selector offsets differ from the exhaust segment mapping, so \
the intake phase axis has its own origin; the stock rest value \
ROM8[00008321]=140 is the phase of selector 8 at zero interval. The SH7059 \
hardware manual identifies 0xFFFFF44C as ATU-II channel 1A GR1E.""",
]
level = "code"
unit = "edge phase raw"

