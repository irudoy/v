summary = """
Current unsigned Q7 Fuel Compensation Main byte. Init routine 0002c648 and \
runtime coordinator 0003bd74 write a table result or a gated bounded bypass \
value. The 7mfk Base Fuel Schedule producer multiplies cached quarter BFS by \
this byte modulo 32 bits, shifts right seven, and caps ffff1062 at 65535."""
note = [
    """
Raw 128 is neutral 1.0 or 100 percent. Runtime gates can bypass the lookup, \
so not every write is necessarily a table result.""",
    """
The 7mfk main-surface arm uses coherent cached unsigned RPM/12.5 from \
ffff11f4 and byte ffff1170. Byte row-axis points are multiplied by four; \
column-axis points are direct bytes. Both kernels clamp outside their \
endpoint range and derive Q0.16 fractions by unsigned truncating division. \
The unsigned byte finisher interpolates columns in each active row before \
interpolating the rows, with separately truncated directional increments. An \
exact cell can return sign-extended; byte publication makes it unsigned. The \
chain interpolate expression denotes this specific column-first contract, \
not a weighted-average or floating-point interpolation.""",
    """
The lookup arm is selected when mode-A bit 5 is set, mode-B bit 4 is clear, \
or mode-A bit 0 is clear and mode-B bit 1 is set. Otherwise mode-A bit 0 \
selects the first bypass: source-mode bit 1 selects ROM8[0000851a] or \
RAM8[ffff5625]. The second bypass uses RAM8[ffff2836]. Each bypass clamps to \
64..192 and bypasses the surface. The independent slice executes these \
selectors and byte publication; preceding state writers and physical mode \
identities remain separate.""",
]
level = "code"
unit = "ratio_q7"

