summary = """
Exact UDS DID 0x1210 runtime word and bank 1 throttle-position sensor 2 \
value. Pointer table 0x2289c maps the DID to this address; FUN 000a75c0 \
accepts ROM16[0x9550]=60..ROM16[0x954e]=964 counts and dispatches \
P0123/P0122 outside that window."""
note = [
    """
The factory documentation states that the sensor 2 signal is converted \
inside the ECM, and bank 2 stage 0003e4cc performs that conversion as 0x0400 \
minus the ten-bit sample, so the published word rises with throttle opening \
like sensor 1. The diagnostic display unit is V at 5 mV per count; \
JK08A.diagnostics.md derives that scale.""",
]
level = "code"
width = 16
unit = "V"
scale = "x/200"

