bit 1 in 00056bd0: when set, the accessor writes neutral 0x80 instead of \
interpolation from map 0x1233a or special path 0x1230a."""
note = [
    """
Bit 0 is an inhibit term of exhaust-VTC operating enable ffff248b bit 2 in \
000bf630; no instruction in the image sets it, so the term is inert. Bits 4 \
and 5 are written by 000a40f4 and 000a454e, bit 6 by 000a2094, 000a2254, and \
000a3ba8, and bit 7 by 000a3f96 and 000a407a.""",
]
