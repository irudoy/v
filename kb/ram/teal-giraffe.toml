summary = """
Scheduled positive RPM-drop class. Scheduler FUN 00020dfe copies current \
publication byte ffff1072 here; DFCO and other consumers classify it at \
breakpoints 4, 8, and 12."""
note = [
    """
The fourth adjacent ROM byte 32 is not compared by the four-class loops. FUN \
00050018 uses class indices 0..3 to select RPM/25 floors 36, 48, 54, and \
62.""",
]
