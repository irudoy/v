summary = """
Bit 3 is the wide-open-throttle latch of stage 0005594a: set when \
throttle-opening byte ffff3528, plus 8 while already set, is >= the flat 200 \
of map 0001214e, which is 78.4 percent of throttle opening. While set, \
0005594a and 000bfdc0 force 0xff onto the upper load axis instead of normal \
source ffff102c (000bfdc0 additionally requires ffff5773 bit 0), and request \
byte ffff1411 takes its wide-open branches. Bit 4 selects column 0 or 1 of \
engine-speed fuel-cut table 0000934e in 0004f282."""
note = [
    """
The percentage follows the code scale of axis 000155a0 through ffff40c6 and \
00054eb8: byte 200 of 255 is 78.4 percent on the same gradient 0006f236 \
publishes as J1979 PID 0x11. The public HR A2L catalog labels the two \
fuel-cut columns Normal and Reverse; exact code proves the two-way selection \
but not those physical mode labels.""",
]
level = "code"
unit = "bitfield"

