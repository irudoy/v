summary = """
Unsigned blend weight for inverse coordinates ffff1f60 and ffff1e7a. FUN \
00076ad0 calculates floor((w*ffff1f60+(255-w)*ffff1e7a)/255) and writes \
ffff1f5e."""
note = [
    """
Raw 0 selects ffff1e7a and raw 255 selects ffff1f60. The producer and \
physical mode represented by the weight remain unresolved.""",
]
