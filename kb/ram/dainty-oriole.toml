Bank-0 injection-pulse precursor written by FUN 0004e974. It applies bank \
multiplier ffff40b6 over 0x6400 to the selected BFS-derived term, adds \
signed transient word ffff2300, applies Q14 gain ffff165e, clamps to uint16, \
and lower-bounds the result at 170. FUN 0004ead4 consumes it for parity base \
ffff191c."""
note = [
    """
The unit is inherited from the pulse words it feeds: one count is 10 us, so \
the ROM16[000094e8] floor of 170 is 1.70 ms. The code proves bank indexing \
but not physical bank-to-cylinder ordering.""",
]
