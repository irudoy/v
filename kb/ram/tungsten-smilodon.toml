summary = """
Multipurpose bitfield. Bit 7 is the hysteretic engine-speed readiness state \
for P030 qualification. FUN 0007c4e0 sets it when saturated RPM/12.5 byte \
ffff11b2 is at least stock ROM8[00008bda] = 32 and, once set, retains it \
while the byte is at least 28. FUN 000593ac writes the same byte only to OR \
bit 6."""
note = [
    """
The thresholds correspond to setting at 400 RPM and clearing below 350 RPM. \
A whole-program p-code pass over all 2315 functions found four exact \
accesses, no unresolved candidates, and no other bit-7 writer.""",
]
level = "code"
unit = "bitfield"

