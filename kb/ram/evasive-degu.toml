summary = """
Bank-1 intake-cam edge phase byte. Capture handler 0002a5cc copies running \
phase ffff22d2 here at 0002a75e while event state ffff13c8 is 2, 4, or 6. \
The running phase is 20*ffff13b2 + floor(20*interval / ffff22bc) - 60 \
(selector below 8) or - 20 (selector 8 and above) through signed divider \
00021bbc, clamped at zero, where interval is the 16-bit difference between \
GR1F capture fffff44e and crank reference count ffff158a stored at ffff22c8. \
The pass requires ffff84ff bit 7 set and edge count ffff1391 equal to 1 and \
first shifts the previous values into ffff22ce and ffff22d0. FUN_000bd9f0 \
subtracts the byte from rest reference ffff4799 to form actual position \
ffff2442."""
note = [
    """
One count is 0.5 crank degrees: ffff22bc is 10 crank degrees and the \
selector step is 20 counts, the same arithmetic as exhaust edge phase \
ffff1200. The selector offsets differ from the exhaust segment mapping, so \
the intake phase axis has its own origin; the stock rest value \
ROM8[0000831c]=140 is the phase of selector 8 at zero interval. The SH7059 \
hardware manual identifies 0xFFFFF44E as ATU-II channel 1A GR1F.""",
]
level = "code"
unit = "edge phase raw"

