summary = """
Multipurpose state byte. FUN 00068270 sets bit 1 while raw coolant snapshot \
ffff1071 is at least ROM8[0x8cc8]=110, the work-support coolant gate. FUN \
0007f870 sets bit 5 while its state ffff3131 is 4 and countdown ffff42e5 \
lies within 1..100 and clears it when the countdown reaches 0. On the \
stock-selected FUN 00077892 path, bit 3 is recomputed before the \
0x942c-derived candidate is built: it is set when ffff4252.bit1 is set or \
ffff4413 is nonzero, and cleared otherwise. Common completion FUN 000777fa \
uses bit 3 to select ffff4162 into request bounds ffff3480 and ffff3484."""
note = [
    """
Startup clears ffff4413. FUN 00077892 loads it with ROM8[0x8b07]=0x1e on \
each pass with ffff4252.bit1 set, and FUN 0002040c decrements it with its \
10.24 ms byte block, so bit 3 stays set for 307.2 ms after the last pass in \
which ffff418f.bit4 (scheduler latch of TCM field ffff3a2e == 3) enabled bit \
1. Other bits and earlier writers are independent. Work-support statuses \
0xa3 and 0x10 read bits 1 and 5, and scheduler 00020dfe copies the byte to \
previous-pass copy ffff41a8 before its periodic loop.""",
]
level = "code"
unit = "bitfield"

