summary = """
Multipurpose phase-mask byte. Within the AN1-derived component, FUN 0003d258 \
alternates bits 0 and 1 for indices 0 and 1; a set bit marks an admitted \
fresh filter update, and FUN 0003d45c requires that same bit before lowering \
the corresponding running minimum. Startup and conditional recovery ranges \
clear the byte."""
note = [
    """
The claim is limited to bits 0 and 1 in this component. One admitted update \
occurs every other FUN 0003d832 invocation; the physical time per invocation \
remains unresolved.""",
]
