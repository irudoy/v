summary = """
Periodic scheduler pending flags. Interrupt handler 0002040c sets bit 7 \
every invocation, bit 6 every second invocation, bit 5 every fourth, and \
bits 4 and 2 every tenth. Dispatcher 000209d8 drains the corresponding task \
tables; main loop 00027e24 waits for bit 2 before running scheduler \
00020dfe."""
note = [
    """
The relative divisors are exact. The hardware interrupt source and base \
frequency remain unresolved.""",
]
