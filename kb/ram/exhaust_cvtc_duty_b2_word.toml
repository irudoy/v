claim = {label = "ParameterDefinition", id = "ecudocs-p32m-997c5a9:data:cid-1230h-vtc-dty-ex-b2-a95ea907"}
applicability = "nissan_family_candidate"
scope = "exact-code"
priority = 100
level = "code"
note = """
The exact JK08A service-0x22 table maps DID 0x1230 to big-endian word \
ffff1aae. Structured Nissan diagnostics identify it as bank-2 exhaust-VTC \
duty and define percent = raw*100/1024. The conversion remains homologous \
pending target measurement."""

