note = """
VQ37 removes the exhaust valve timing magnet retarder: the ATU-II channel-7 \
buffer registers BFR7C and BFR7D, which the JK08A output stage drives from \
the two duty words, have no writer besides the ATU-II initializer, and the \
inherited DID 0x122F and 0x1230 slots name words without a resolved access \
in the image"""

