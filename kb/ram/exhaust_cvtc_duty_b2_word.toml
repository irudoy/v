summary = """
Bank-2 exhaust-VTC duty word. FUN 000c2040 writes it at window offset 0x820 \
of base ffff128c with the bank index in r4, after copying the previous value \
to ffff1ab4+2*b. FUN 000c2152 converts it into ATU-II channel-7 buffer \
register fffff594. The exact service-0x22 pointer table publishes the same \
word as DID 0x1230."""
note = [
    """
Structured Nissan diagnostics name DID 0x1230 VTC DTY EX B2. The output \
stage divides raw*ROM8[00008dfd]*125/1024 into a cycle register of \
125*ROM8[00008dfd], so percent = raw*100/1024 is code-proven rather than \
homologous.""",
]
level = "code"
block = "cvtc_exhaust/block"
width = 16
unit = "percent"
scale = "x*100/1024"

