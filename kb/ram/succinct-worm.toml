summary = """
Event byte of DTC attribute bit 10. FUN 0008c2d2 writes 1 at 0008c326 when \
the record it stores has attribute bit 10 set; stage 3 of summary pass \
0008c65c writes 0 once FUN 0008c396(0x0400) finds no record of the class \
with byte 1 bit 7 set. FUN 0008c272 projects a nonzero value onto ffff41d1 \
bits 7, 2, and 0."""
note = [
    """
Attribute bit 10 is carried by the six mass-airflow records P0101, P0102, \
P0103 (indices 0xba..0xbc) and P010B, P010C, P010D (indices 0x07..0x09).""",
]
