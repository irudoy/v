summary = """
First byte of the centered two-bank intake-cam timing pair. FUN_000bd9f0 \
writes clamp_u8(0x80 + ffff4799 - ffff22cc), or neutral 0x80 under the \
hardware-control mask. UDS DID 0x1135 returns this byte directly."""
note = [
    """
Homologous VQ35HR sources identify DID 0x1135 as intake valve timing bank 1. \
One count is 0.5 crank degrees: edge phase ffff22cc carries the intake \
edge-phase unit of capture handler 0002a5cc, and the difference is signed so \
that an edge earlier than the rest edge reads above 0x80 (advance positive). \
The conversion raw*0.5-64 degCA is exact in the code unit; the crank-wheel \
origin of the absolute angle remains open.""",
]
level = "code"
width = 8
unit = "degCA"
scale = "x*0.5-64"

[[diagnostic]]
id = "intake-valve-timing-bank-1"
kind = "runtime_value"
label = "DiagnosticParameter"
key = "diagnostic-parameter:semantic:int-v-tim-b1"
claim = {label = "ParameterDefinition", id = "nissan-esm-2007-g35-sedan-v1:engine-control-system:p0118:data_monitor:int-v-tim-b1-f9d4ea4d"}
applicability = "homologous_vq35hr"
scope = "exact-code"
priority = 95
level = "code"
note = """
Exact code maps UDS DID 0x1135 to ffff2442. FUN 000bd9f0 writes the centered \
runtime value as clamp_u8(0x80 + reference - capture), with a control path \
that forces neutral 0x80. Homologous VQ35HR sources identify intake camshaft \
advance bank 1. Community diagnostic definitions support candidate \
conversion raw*0.5-64 degCA; exact code does not establish the physical \
scale."""

