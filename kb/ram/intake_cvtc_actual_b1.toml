summary = """
First byte of the centered two-bank intake-cam timing pair. FUN_000bd9f0 \
writes clamp_u8(0x80 + ffff4799 - ffff22cc), or neutral 0x80 under the \
hardware-control mask. UDS DID 0x1135 returns this byte directly."""
note = [
    """
Homologous VQ35HR sources identify DID 0x1135 as intake valve timing bank 1. \
One count is 0.5 crank degrees: edge phase ffff22cc carries the intake \
edge-phase unit of capture handler 0002a5cc, and the difference is signed so \
that an edge earlier than the rest edge reads above 0x80 (advance positive). \
The conversion raw*0.5-64 degCA is exact in the code unit; the crank-wheel \
origin of the absolute angle remains open.""",
]
level = "code"
block = "cvtc_intake/block"
width = 8
unit = "degCA"
scale = "x*0.5-64"

[[diagnostic]]
id = "intake-valve-timing-bank-1"
kind = "runtime_value"
