summary = """
Inter-cycle latch for P030 counting-readiness bit ffff41d2.bit1. Let F = \
ffff244f.bit5. In stock JK08A, ROM8[00008afc].bit3 is set: while F is clear, \
FUN 00082c8a refreshes the latch with ROM8[00008499] = 0xb4 when \
ffff422d.bit4 is set or with the all-zero map 0x12026 result when it is \
clear, and clears bit 1. While F is set, the latch is retained and bit 1 is \
set exactly when the retained value is zero. Normal startup clears both this \
latch and ffff422d.bit4; all seven direct runtime writers of ffff422d \
preserve bit 4, so the latch remains zero throughout the stock \
application-code lifecycle."""
note = [
    """
The descriptor-driven startup and recovery clears establish a zero value \
before normal service. An exhaustive exact-address scan found only the two \
writes and one read in FUN 00082c8a. The 0xb4 branch remains structurally \
present but is not reached under the proven stock application-code \
lifecycle.""",
]
level = "code"
unit = "raw latch"

