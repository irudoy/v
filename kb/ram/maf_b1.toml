summary = """
Bank 1 MAF sensor diagnostic word. On 7mfk, FUN 0003c408 checks or bypasses \
coefficient ffff4970 according to ffff4252.bit3, scales unsigned sample \
ffff1d62 through 000671d8, and adds one after scaling when the original raw \
word equals 0x03ff. UDS DID 0x1204 returns word ffff101c in big-endian \
order."""
note = [
    """
With ffff4252.bit3 clear, coefficient values outside inclusive \
0x7900..0x8700 reset to 0x8000; bit3 set leaves any word unchanged. At \
0x8000, samples 0..1022 are unchanged and 1023 produces 1024. The diagnostic \
display scale is raw/200 V at 5 mV per count; the homologous display \
conversion lacks synchronized live validation.""",
]
level = "code"
block = "airflow_load/block"
width = 16
unit = "V"
scale = "x/200"

