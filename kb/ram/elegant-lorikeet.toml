summary = """
EVAP vent-control result byte. FUN 000aab54 sets bit 6 for path-A P0447; FUN \
000aacc0 sets bit 7 for P0448. FUN 000abca2 dispatches descriptor indices \
0x31 and 0x2f from those bits and clears each bit after handling."""
note = [
    """
The descriptor identities are exact. The stock configuration skips both \
vent-control producers and their exact P0447 path-A and P0448 dispatch \
branches. The physical valve command and feedback paths remain unresolved.""",
]
level = "code"
unit = "bitfield"

[[diagnostic]]
id = "evap-vent-open-a-state-p0447"
kind = "monitor"
label = "DtcCode"
key = "P0447"
claim = {label = "RomDtcDescriptor", id = "jk08a:000195ac"}
applicability = "exact_rom"
scope = "exact-rom"
priority = 98
level = "code"
note = """
Bit 6 is the one-shot status consumed in the exact path-A P0447 path, which \
is configuration-disabled in stock JK08A."""

