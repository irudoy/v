summary = """
Pressure-ratio byte written by builder 00053698 as min(255, floor((K << \
18)/((K << 10) + V))) with K = ROM8[0x8AE7] = 175 and V = uint16(ffff31d8); \
it is 256*C/(C+V) for C = K << 10 = 179200, and zero when the denominator is \
zero."""
note = [
    """
With V bounded by stock pressure word 51865 the byte spans 198..255. If one \
count of C and V is 1/512 kPa, C is 350.0 kPa, the factory fuel-pressure \
specification of the homologous VQ35HR service manual, and 51865 is 101.30 \
kPa; this unit reading is a candidate.""",
]
level = "code"
unit = "ratio_q8"

