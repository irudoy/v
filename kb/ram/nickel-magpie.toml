claim = {label = "ParameterDefinition", id = "ecudocs-p32m-997c5a9:data:cid-1305h-bit2-brake-sw-80d80f33"}
applicability = "nissan_family_candidate"
scope = "exact-code"
priority = 100
level = "code"
note = """
FUN 00038618 copies SH7058 PHDR bit 1 (PH1DR) with direct polarity to \
ffff2451.bit7. FUN 0002e0d4 packs that bit into ffff3345.bit2, and the exact \
JK08A service-0x22 table publishes ffff3345 as DID 0x1305 with support mask \
0x44. A structured Nissan profile names bit 2 BRAKE SW. The factory manuals \
define BRAKE SW as the condition of the stop lamp switch signal and place \
that signal on ECM terminal 122 in their VQ25HR, VQ35HR, and VQ37VHR \
sections. PH1 is MCU pin 64 and a terminal 122 candidate by signal identity; \
JK08A.rpm-drop-state.md gives the bench check."""

