summary = """
Bit 7 directly mirrors SH7058 PHDR bit 1 (PH1DR) and participates in the \
0001202e RPM-drop publication gate; FUN 0002e0d4 publishes it as bit 2 of \
DID 0x1305 response byte ffff3345. Bit 5 is set by FUN 00027530 for state \
ffff39d8 values 2..4 and cleared for states 0/1; scheduler 00020dfe copies \
this current byte to ffff244f. Bit 1 gates the differential-term \
contribution in 000413cc and helps select the map-read path in 0003c4a0 and \
0002c59c. Bit 2 is P/N position switch ON: FUN 00038618 sets it while \
ROM8[00008b3f] bit 7 is clear and battery-voltage raw ffff1188 is at most \
100, and otherwise stores the inverse of ffff1164 bit 2, the active-low PHDR \
bit 4 input."""
note = [
    """
PH1 is MCU pin 64. A structured Nissan profile names DID 0x1305 bit 2 BRAKE \
SW, and the factory manuals define BRAKE SW as the condition of the stop \
lamp switch signal on ECM terminal 122, so PH1 is a terminal 122 candidate \
by signal identity; JK08A.rpm-drop-state.md gives the bench check. Exact DID \
0x1103 identifies ffff1188 as battery voltage; the source-bound conversion \
maps raw 100 to 8.00 V. The physical mode represented by bit 5 remains \
unresolved. FUN 0002e0d4 publishes the same input as DID 0x1302 bit 2, which \
the profile names P/N POSI SW.""",
]
level = "code"
unit = "bitfield"

[[diagnostic]]
id = "brake-switch-did-1305-bit2"
kind = "runtime_value"
label = "DiagnosticParameter"
