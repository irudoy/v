summary = """
Signed net engine-torque state. FUN 00065cd8 writes \
sat_i16(trunc0(s16[ffff18ce]*(6-n)/6)-u16[ffff2408]-u16[ffff14e2]), where n \
is the byte returned by FUN 00065d42 and stored at ffff16a2."""
note = [
    """
FUN 00065d42 returns 6 when fuel-output inhibit mask ffff22e0 equals 0x3f \
and at least 3 when it equals 0x15, so n counts inhibited cylinders and \
(6-n)/6 is the contributing fraction. Subtracting base term ffff2408 and \
correction ffff14e2 converts the map-side state to a net value.""",
]
level = "code"
unit = "signed torque raw"

