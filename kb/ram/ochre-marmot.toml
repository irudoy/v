summary = """
Base of the first two-byte bank-indexed working array in the alternate \
P0138/P0158 monitor. FUN 0008a258 reloads each bank byte from ROM8[0x8bce]=5 \
under reset conditions and sets the path-B fault condition when this or \
ffff42b2 is zero."""
note = [
    """
The decrement cadence and physical timing represented by one count remain \
unresolved.""",
]
level = "code"
unit = "countdown state"

