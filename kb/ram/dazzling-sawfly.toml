summary = """
Published main-fuel control multiplier. FUN 000556ec writes working value \
ffff18e4 here unless aggregate six-channel inhibit mask ffff22e0 equals \
0x3f, in which case it writes zero. FUN 0004e974 scales current BFS or \
alternate schedule by this word over 131072 before forming common and \
bank-specific pulse precursors; FUN 0005727a independently uses it with a \
right shift of 15."""
note = [
    """
Its exact arithmetic roles and full-inhibit zero publication are \
established. A single universal engineering scale and physical control name \
are not assigned.""",
]
