summary = """
Multipurpose diagnostic state byte. Within reporter 00084cd0, bit 7 selects \
exact descriptor index 0x0a for P0306 and bit 6 forces the exact P0300 \
descriptor index 0x10. Coordinator 00082c8a builds, tests, and clears these \
bits."""
note = [
    """
The claim is limited to bits 6 and 7 in the misfire component. Other bits \
and external uses remain unassigned.""",
]
level = "code"
unit = "bitfield"

