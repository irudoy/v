title = "Ignition secondary interval offset"
summary = """
The event task subtracts the interval input from 120. When the trim branch \
is selected it subtracts the ROM trim and clamps below zero. The task stores \
the low byte and adds its zero-extended value to the APC command for the \
tail call."""
