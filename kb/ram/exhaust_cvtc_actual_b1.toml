level = "code"
note = """
The exact JK08A service-0x22 table maps DID 0x1164 to ffff2324. Structured \
Nissan diagnostics identify the DID as bank-1 actual exhaust-cam timing. The \
structured profile's raw*2-256 conversion conflicts with the HR A2L and \
measured community raw*0.5-64 conversion, so this binding establishes \
identity and bank but does not promote either engineering scale to \
target-code confidence."""

