Current pre-snapshot saturated engine-speed byte. FUN 000384fe writes \
ffff11e8 = ffff1196>>3, and FUN 0003846e writes this byte as min(255, \
ffff11e8>>3), equivalent to min(255, ffff1196>>6). Scheduler 00020dfe copies \
it to ffff11b2."""
note = [
    """
The unsaturated companion word ffff11f4 uses the same ffff1196>>6 \
expression, which establishes the count scale.""",
]
