summary = """
Exact UDS DID 0x130b runtime status byte. FUN 0002e2e8 maps ffff2377 bit 0 \
to output bit 1 and maps ffff2377 bit 1 to output bit 0 when ROM8[0x8b2a] \
bit 2 is clear. The exact DID record supplies support mask 0x03."""
note = [
    """
A homologous structured Nissan profile identifies output bits 1 and 0 as \
HO2S2 heater states for banks 1 and 2. The exact code proves the packed \
states but not physical output pins.""",
]
level = "code"
unit = "bitfield"

