summary = """
ICI0A byte-cell ratio action for independent unsigned interval operands: \
while ffff8505.bit7 is set, write 255 for zero current interval or min(255, \
floor(64 * previous / current)) through divider 00021bbc; otherwise retain \
the cell. Handler 00028ea2 reads the unsigned byte at 0002927c and compares \
it against ROM8[00008c89] = 118. The divider is an arithmetic dependency, \
not a direct cell reader."""
note = [
    """
Placement is ffff128c + 0x6e0; MOV.B writer 000290cc and reader 0002927c \
belong to entry 00028ea2. The bounded proof excludes the interval measuring \
producer, complete ISR execution, physical tooth/time units, and hardware \
behavior; see defs/JK08A.ici0a-ratio.md.""",
]
level = "code"
unit = "ratio*64"

