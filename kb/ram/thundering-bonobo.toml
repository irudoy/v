summary = """
Bounded ICI0A unsigned ratio byte produced from independent incoming R12/R13 \
contexts. Sampled ffff8505.bit7 enables a 255 write for zero current, or \
min(255, floor(64 * previous / current)) through divider 00021bbc for \
nonzero current; a clear bit retains the cell. Handler 00028ea2 reads the \
unsigned byte at 0002927c and strictly compares it with the scalar at \
00008c89 when independent incoming reader R0.bit7 is clear. The divider is \
an arithmetic dependency, not a direct cell reader."""
note = [
    """
Placement is ffff128c + 0x6e0; MOV.B writer 000290cc and reader 0002927c \
belong to entry 00028ea2. At bounded writer entry 0002909a, the arithmetic \
aliases prev and x denote independent incoming R12 and R13, each narrowed by \
uint16; they do not identify RAM producers. G samples ffff8505.bit7 before \
the gate-clear skip tail can arm a later event, and C is the incoming \
retained cell byte. The bounded proof excludes the interval measuring \
producer, complete ISR execution, physical tooth/time units, and hardware \
behavior; see defs/analysis/arithmetic/JK08A.ici0a-ratio.md.""",
]
