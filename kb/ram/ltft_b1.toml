note = """
The exact JK08A service 0x22 table maps DID 0x1125 to the high byte of \
Q8.8-percent word ffff2302. Exact Mode 01 code maps the same word to \
standard PID 0x07, proving long-term fuel trim bank 1. The runtime producer \
combines the selected cell of a learned 8x8 bank table with a bank \
adjustment around neutral 0x6400, applies calibrated limits or fail-safe \
neutralization, and writes this diagnostic word."""

