summary = """
Bank 1 long-term fuel-trim diagnostic word in Q8.8 percent representation. \
FUN 00057b26 combines selected learned cell ffff2306 with adjustment \
ffff5648 around neutral 0x6400, applies limits and fail-safe neutralization, \
and writes this word. UDS DID 0x1125 returns its high byte; J1979 PID 0x07 \
converts the complete word."""
note = [
    """
The stock normal-path clamp is 90..110 percent from ROM bytes 0x8e5b and \
0x8e5a. Other gates may bypass this clamp or force 100 percent.""",
]
level = "code"
width = 16
unit = "percent"
scale = "x/256-100"

