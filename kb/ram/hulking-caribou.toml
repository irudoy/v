summary = """
Current coarse vehicle-speed byte written by FUN 0003a254 as min(255, \
ffff115e/20) and copied by scheduler 00020dfe to ffff110e. FUN 00035856 \
returns min(255, 2*ffff118e) for J1979 Mode 01 PID 0x0D at 00035d44."""
note = [
    """
J1979 defines PID 0x0D as km/h, so one count is 2 km/h. The exact firmware \
source is CAN 0x280 bytes 4 and 5 through ffff113c and ffff115e: the receive \
path divides the km/h*100 word by 10, the filter keeps km/h*10, and this \
producer divides by 20. Homologous Z34 CAN data identifies the field as \
vehicle speed.""",
]
level = "code"
unit = "km/h/2"

