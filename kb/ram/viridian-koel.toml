summary = """
Signed timing correction written by 0004d99c as \
clamp_s8(ffff1ff8+ffff2356-ffff1ff6), where ffff1ff8=ffff2378+ffff11d6 on \
the normal path, and combined by 0004dbe8 with the gated snapshot ffff564c \
while forming ffff11da and ffff11d4. Its terms are the previous-pass timing \
state ffff2378, the negated retard request ffff11d6, the bounded correction \
ffff2356, and the scaled 0x147da subtraction ffff1ff6."""
note = [
    """
All terms are crank degrees with coefficient 1 relative to the J1979 PID \
0x0E coordinate. The operating qualifier of map 0x147da remains \
unresolved.""",
]
level = "code"
unit = "deg"

