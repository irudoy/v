summary = """
Unsigned blended speed threshold written by FUN 0007584e as \
clamp_u16(S_entry+floor(ROM16[0x9424]*(ffff1796-S_entry)/1024)). First-pass \
initialization uses the newly initialized filter value; later passes use \
ffff1794 from function entry."""
note = [
    """
All request-rate terms subtract the newly stored ffff1794 from this word. At \
steady speed, stock gain 76 gives a 13-count lower-side deadband and an \
immediate one-count response above the threshold because negative arithmetic \
shifts round down.""",
]
level = "code"
unit = "raw speed x4"

