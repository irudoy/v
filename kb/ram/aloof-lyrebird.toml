summary = """
State byte in FUN 0004d2a6. Bit 3 is coolant hysteresis: it sets at raw \
ffff1071>=107 from ROM8[00008e03]=106 and clears at ffff1071<=103 using \
offset 3. Bit 6 is inverse coolant hysteresis through FUN 000259d0: it sets \
at ffff1071<=170 from ROM8[00008e00]=170 and clears at ffff1071>=174 using \
the same offset. Coordinator 00090a84 maintains bit 2 as raw coolant \
ffff1071, plus 3 while set, above ROM8[00008e03]=106 and bit 5 through \
comparator 000259d0 as raw coolant at most ROM8[00008e00]=170 with release \
offset 3; both gate the exhaust cam reference learning."""
note = [
    """
The raw coolant thresholds are exact. Conversion of ffff1071 to an \
engineering temperature remains outside this claim.""",
]
level = "code"
unit = "bitfield"

