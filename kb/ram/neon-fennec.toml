summary = """
Bank-1 exhaust-VTC controller state longword at window offset 0x818 of base \
ffff128c. FUN 000c1dec stores it at 000c1ff4 as zero in mode 0 or as the \
gain-scaled, 0..0x04000000 clamped error product; FUN 000c2040 reads it at \
000c205e and divides the upper bytes by battery byte ffff1108 to form duty \
request ffff1c70."""
note = [
    """
Stock branch: P = floor(floor(u16[ffff1b18]*0x22a2)*gain*2/625) with gain \
from curve 0001205a.""",
]
level = "code"
unit = "fixed-point raw"

