summary = """
Five-state selector in the crankshaft rotational-irregularity component. \
Four boundaries from maps 0x1265A..0x1268A classify the high byte of current \
Base Fuel Schedule word ffff1024 into state 0..4. FUN 00085a70 uses the \
state as the only index into ROM byte table 0x11A28 and adds the selected \
byte to accumulators ffff36e8 and ffff36ec."""
note = [
    """
Stock JK03A and JK08A have byte-identical thresholds 255, 254, 253, and 252 \
and byte-identical active table entries ROM[0x11A28..0x11A2C] = ff ff ff ff \
ff. The state therefore varies structurally, but its downstream increment is \
invariant at 255 in both stock ROMs.""",
]
level = "code"
unit = "state"

