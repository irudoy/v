summary = """
Saturated signed engine-torque state from FUN 000659ae after adding ffff2408 \
to centered map result ffff18ca and applying Q14 and Q8 calibrated \
multipliers."""
note = [
    """
A signed gross state in the ECU torque-model raw domain, before the recorded \
net-state deductions. Engineering conversion is unestablished. Retained \
hypothesis: Candidate x*0.1 Nm for the internal modeled state, with x*0.08 \
still compatible for the evaluated net torque chain. A candidate \
modeled-torque label is not measured flywheel torque. The gross and net \
terms remain distinct. Unverified propositions: One internal raw count \
equals 0.1 Nm rather than 0.08 Nm. Gross state ffff18cc directly represents \
flywheel torque. The tracked road result explicitly does not support that \
interpretation. The physical multiplier and reference location remain valid \
across all target layouts without target validation. Source references: \
defs/JK08A.can.md:211-295, defs/JK08A.tuning-telemetry.md:107-113.""",
    """
Stock ROM8[000087ee]=0 and flat-zero map 0001245a make both multipliers \
unity. The chain 00065b08, 00065cd8, 00065de4, 00065e2c carries this state \
to net torque ffff240c, which CAN packer 00079e70 divides by five and \
offsets by 800 for frame 0x180. The candidate physical conversion is x*0.1 \
Nm, equal to 0.5 Nm per CAN count with zero at count 800; a moving-load \
capture then spans -73.5..226 Nm.""",
]
level = "code"
width = 16

