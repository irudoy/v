summary = """
Stationary-limiter readiness countdown. FUN 0004f324 loads 100 on first \
eligible entry and after every readiness-accumulator update. Interrupt \
handler 0002040c decrements it as part of byte range ffff256a..ffff25f3 \
every tenth base interrupt."""
note = [
    """
One count is exactly 204800/Pphi seconds. Passive target-CAN timestamps \
establish Pphi=20 MHz, so 100 counts are 1.024 seconds and the three \
high-RPM expiries needed for readiness total 3.072 seconds.""",
]
level = "code"
unit = "tenth-phase counts"

