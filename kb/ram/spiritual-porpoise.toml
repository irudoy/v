summary = """
Unused slot of the four-slot exhaust-VTC duty word array at ffff1aac. FUN \
000c2040 is the only writer of that array and indexes it with the bank \
argument in r4; dispatcher 000c2220 is its only caller and passes 0 and 1. \
No ROM code reads or writes this word."""
note = [
    """
The service-0x22 pointer table publishes the slot as DID 0x122d, named VTC \
DTY IN B1 by structured Nissan diagnostics, so the DID returns the RAM \
initialization value for the life of the image. The live intake duty command \
is ffff23b4/ffff23b5 and its diagnostic companion pair is \
ffff2440/ffff2441.""",
]
level = "code"
width = 16
unit = "unused"

