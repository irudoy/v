summary = """
Multipurpose state byte. FUN 0004f050 maintains bit 5 as the 4500/5000 RPM \
gate for vehicle-speed fuel cut; FUN 0004f19c uses bit 7 as its speed-entry \
arming state. FUN 000bd20a writes bit 1 as the intake idle-source condition: \
set only with intake electrical enable ffff248b bit 1, CLSD THL POS copy \
ffff2458 bit 5, vehicle-speed byte ffff110e at most ROM8[0000871d]=2, engine \
speed of 1500 RPM (1400 RPM to hold), the raw coolant, oil, intake-air, and \
normalized BFS flags, and a set of inhibit bits and stored-fault records \
clear, and held clear after the first activation while re-arm countdown \
ffff2527 is nonzero; a set bit also sets intake operating bit ffff246b bit \
6; while it is set, FUN 000bdc66 conditions idle source byte ffff1553 into \
intake target ffff2326 in place of the coolant-selected map byte. FUN \
000bfe88 maintains bit 3 as the exhaust-VTC demand flag: set while \
coolant-selected target ffff1c90, plus hysteresis ROM8[000086f4] once set, \
reaches ROM8[00008dcb]+128, and cleared otherwise. A set bit 3 ORs bits 0 \
and 1 into bank-enable byte ffff1246. Coordinator 00090a84 maintains bit 4 \
through comparator 000259d0 as engine-speed byte ffff11b2 at most \
ROM8[00008dca]=0 with release offset 16, the stopped-engine condition of the \
exhaust cam reference learning and of FUN 00090bd2."""
note = [
    """
Bit 5 gates the ffff24a6.bit0 active state; bit 7 records speed-threshold \
entry while the stock activation delay runs.""",
]
level = "code"
unit = "bitfield"

