kind = "rom-bytes"
supports = "role"
at = "7mfk:000d01f0"
value = "cb80"
note = """
or #0x80,r0 in the delay slot of the branch to the store 000d0200 sets the \
bit while bit 0 of [[button_state/ram]] is set"""

