summary = """
Multipurpose state byte. FUN 00050a60 uses bit 7 for the CAN-derived \
requested-RPM-ceiling hysteresis state. Bit 6 is the exhaust-VTC active-test \
request: FUN 0002e466 sets it at 0002e5ec while service-0x30 Output Control \
IOLID 0x1d active flag ffff99c7 bit 4, ffff248b bit 0, and ffff244f bit 1 \
are set, vehicle-speed byte ffff110e is at most ROM8[000089f1]=2, and raw \
coolant ffff1071 lies in ROM8[000089f3]=110..ROM8[000089f2]=170, storing the \
requested offset ffff1706 = clamp(int8(ffff9940), \
ROM8[0000873e]=-20..ROM8[0000873f]=20) at 0002e612; it clears the bit at \
0002e61c otherwise. Enable coordinator 000bf630 reads it at 000bf8dc as the \
bypass of the coolant-window term of ffff248b bit 2, and FUN 000bfe88 reads \
it at 000c04ca to add ffff1706 to the exhaust target."""
note = [
    """
Other bits belong to independent state machines. ffff9940 is the IOLID 0x1d \
value byte of service-0x30 handler 00030c4c (ffff9923 + n) and ffff99c7 bit \
4 its active flag (array ffff99c4, bit n-1).""",
]
level = "code"
unit = "bitfield"

