[[symbol]]
layout = "7mfk"
address = "ffff16c2"
name = "amphibian-panda"
width = 16
signed = false
note = [
    """
Bounded 7mfk entry 0002b6d4 reads unsigned period word ffff22bc and unsigned \
remainder byte ffff193b, computes M=P*R, and executes the real helper \
00028e7c with word output ffff16c2 and byte output ffff166c. The outputs are \
Q=floor(uint32(6554*M)/65536) and uint8(M-10*Q). MACL contains M after the \
helper restores it. P=8192,R=4 gives Q=3277 rather than floor(M/10)=3276; \
P=25000,R=8 gives Q=20001 and residue byte 246. Product wrap seams make the \
full consumer-domain sign none. The preceding zero-count decision, physical \
timer scale, compare programming and hardware remain separate evidence.""",
    """
The complete natural 0002b64a invocation wraps its argument to uint8. Normal \
mode splits by10, adjusts count/remainder through the actual00028dc8 \
normalizer and explicit positionffff13b2; modeffff24c9.bit6 instead splits \
at120. Nonzero count retains compare/status/control raw words and incoming \
offset. Zero count publishes \
q=floor(uint32(6554*RAM16[ffff22bc]*rem)/65536). For \
delta=(TCNT-capture)&65535, delta+2>q selects TCNT+2, otherwise capture+q; \
the selected compare wraps to16bits, status ANDsfffe and control ORs1. The \
zero-count path sets interrupt maskI8. All I/O is synthetic raw storage; \
hardware compare delivery and peripheral timing retain separate evidence.""",
]

