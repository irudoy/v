summary = """
Shared unsigned APC compare-offset word used by GR11A and GR11B schedulers. \
The bounded 7mfk delayed injection-start writer computes \
M=uint16(ffff22bc)*uint8(ffff193b) and Q=floor(uint32(6554*M)/65536), stores \
Q here and a raw residue byte at ffff166c. This path has no saturating cap. \
Other writer paths, physical timer scale and hardware behavior retain \
separate evidence."""
note = ["The arithmetic is exact; physical angular units are unresolved."]
level = "code"
unit = "timer count"

