summary = """
Service-0x3b LID 1 value slot, the requested work-support timing adjustment. \
Handler 00034194 writes request VALUE here for controls 0x00 and 0x55 and \
zeroes it for control 0xff. While ffff424c.bit4 is set, 0004aad0 writes \
clamp_s8(ffff99dc, -5, 0) to ffff56b2."""
note = [
    """
The value slot of LID n is ffff99db+n. One count is one crank degree of the \
final timing coordinate inside the ffff5b31 window.""",
]
level = "code"
unit = "deg"

