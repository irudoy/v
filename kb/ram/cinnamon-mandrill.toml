summary = """
Derived quarter-coordinate opening monitor written by 0003e548 as the \
coordinate of the averaged opening area of both throttle-position channels, \
divided by four. FUN 0006f236 subtracts idle base ffff28f8, applies gradient \
0x505b and publishes the saturated byte as absolute throttle ffff1075."""
note = [
    """
It shares the quarter-coordinate domain of ffff40c6 and ffff28f8, so one \
count is 137140/1114112 percent of throttle opening. ROM byte 0x8b2c is \
0x02, so this image takes the branch that subtracts the idle base; the \
alternative branch applies the same gradient to the word alone.""",
]
level = "code"
unit = "raw opening coordinate"

