summary = """
Pressure word of builder 00053698, saturated to uint16. The normal path \
forms ROM16[0x93C6] + arithmetic_shift7(ROM8[0x89FE]*uint16(ffff4524)); a \
nonzero result of 00025e20(-1) selects literal 51865 instead. The builder \
also forms ratio clamp(floor(P*256/51865), ROM8[0x83C4], 256) from the \
unsaturated value."""
note = [
    """
Stock ROM16[0x93C6] = 51865 equals the literal divisor and stock slope \
ROM8[0x89FE] = 0, so the word is the constant 51865 and the ratio is 256.""",
]
level = "code"
unit = "raw_u16"

