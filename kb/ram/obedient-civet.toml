summary = """
Bounded timing-state byte produced by 0004bdc2 in crank degrees. The normal \
branch is \
clamp_s8(ffff23f1+ffff23bd-ffff23c5-ffff12dc-ffff15ea-128+ffff1a7d+ffff134a), \
which is base angle ffff23f1 plus (low7-64) plus (ffff1a7d-64) minus the \
unsigned retard terms; the alternate branch is \
clamp_s8(ffff1a7d+ffff23ee-ffff23c5-64). FUN 0004c136 can latch it into \
ffff2404."""
note = [
    """
One count is one crank degree of the J1979 PID 0x0E coordinate ffff11d4; \
every downstream coefficient is 1.""",
]
