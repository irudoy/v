summary = """
Dwell channel: the cylinder number whose PULS pin receives the next GR11B \
reset edge. Continuation 0002ab24 writes the successor ROM8[00022680 + \
ffff13c9] of the current cylinder, the first tooth-4 identification writes \
ROM8[00022672 + ffff11de], and 0002af38 converts it to dwell mask ffff13d1 = \
ROM8[00022687 + ffff13d3]."""
note = [
    """
The dwell of cylinder c + 1 starts after the spark of cylinder c, which \
fixes the firing order of the event index as 1-2-3-4-5-6.""",
]
level = "code"
unit = "cylinder number 1..6"

