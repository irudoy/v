summary = """
Per-bank exhaust cam reference word (ffff5578 + 2b). Default initializer \
0007f5b0 loads ROM8[0000831d + b] << 8; FUN 00090884 stores the first \
learned reference and afterwards filters it as min(0xffff, phase * 8 + \
((word * 31) >> 5)) toward 256 times cam edge phase snapshot ffff11c8 + b. \
FUN 00090bd2 compares the phase with its high byte."""
note = ["Stock JK08A never runs 00090bd2, so the reference has no effect."]
level = "code"
unit = "phase counts * 256"

