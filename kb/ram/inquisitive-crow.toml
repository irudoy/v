summary = """
Current target mixture byte, Q7 fuel-multiplier command with 128 = \
closed-loop stoichiometric target. Stage 0005594a writes the 0000a9aa \
lookup, scaled around 128 by 00012552 when ffff2466 bit 6 selects the \
high-detonation surface, then forces 128 unless enrichment latch ffff24a2 \
bit 7 holds (set at value >= ROM8[00008b9b] = 130, held while value + \
ROM8[00008b9b] - ROM8[00008b9f] >= 130). The same stage ramps ffff123a \
toward this byte << 7 and reports the arrival in ffff2485 bit 5. 0004bbee \
and 000659ae also read it."""
note = [
    """
Stock bytes 128..149 of 0000a9aa give 1.00..1.16 commanded equivalence \
ratio.""",
]
level = "code"
unit = "ratio_q7"

