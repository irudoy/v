summary = """
Current Q8 filtered four-sample engine-speed drop written by FUN 0003e1da. \
On the enabled non-fault path, rising current speed resets the word to zero; \
equal or falling speed gives \
min(65535,64*(uint16[ffff1f76]-uint16[ffff114a])+floor(192*uint16[ffff1e58]/256))."""
note = [
    """
A nonzero crank/cam fault predicate 00025e4e selects ROM8[0x84a3]<<8, stock \
0xff00. With a zero predicate result and ffff24b8.bit6 clear, the producer \
writes zero. Both mode paths initialize the current sample and four \
preceding history words to current engine speed. Its high byte is the \
publication candidate for ffff1072.""",
]
level = "code"
unit = "RPM/12.5 drop Q8"

