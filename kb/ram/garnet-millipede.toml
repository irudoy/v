summary = """
Bank-1 previous-pass snapshot of exhaust-cam edge phase byte ffff1200. \
Scheduler 00020dfe copies it through the 0x38-byte block ffff11d4..ffff120b \
-> ffff119c..ffff11d3 at 00020f6c. Monitor 0008f168 forms rest-position byte \
ffff16ba = clamp_u8(ffff11c8 - ROM8[0000831d] + 128) from it at 0008f4ec, \
FUN 000bfc2e reads it per bank at 000bfc78, FUN 00090bd2 at 00090c36, and \
FUN 000bfad4 and FUN 00090884 read it directly. FUN 000bfad4 forms rest-edge \
deviation ffff1376 = 128 + clamp(ROM8[0000831d] - ffff11c8, -40..40) from it \
at 000bfb4a and learns rest edge ffff479b from that, and FUN 000bfc2e forms \
deviation d0 = clamp_u8(ffff11c8 - ffff479b + 128) at 000bfcaa."""
note = [
    """
One unit is 0.5 crank degrees: 000c2d76 forms the byte as 20*segment + \
20*interval/ffff22bc, where ffff22bc is 10 crank degrees. The bank \
assignment follows monitor index 0, which routes to descriptor 0xd2 (P0014, \
bank 1).""",
]
level = "code"
unit = "edge phase raw"

