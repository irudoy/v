summary = """
Previous-cycle snapshot of battery-voltage response byte ffff1188. Scheduler \
00020dfe copies it through the 128-byte ffff1114..ffff1193 -> \
ffff1094..ffff1113 block. Misfire coordinator 00082c8a requires the unsigned \
value to be at least 0x89 before setting ffff4251.bits6/7. The DTC monitors \
read this snapshot for their battery-voltage windows: FUN 000995c4 (P0011, \
P0021) accepts ROM8[0x8e0a]=125 < byte <= ROM8[0x8e07]=200, FUN 00093c40 \
(P0031, P0051, P0052) accepts ROM8[0x82b4]=131 <= byte < 200, and FUN \
0009426e (P0130, P0150), FUN 0009678c (P2A00), and FUN 000ac0d4 (P0462, \
P0463) accept 137 <= byte < 200."""
note = [
    """
At 0.08 V per count the windows are 10.00..16.00 V, 10.48..16.00 V, and \
10.96..16.00 V against factory test conditions of between 10 V and 16 V, \
between 10.5 V and 16 V, and more than 11 V; raw 0x89 is 10.96 V. A scale of \
20 V over 255 counts puts the same limits at 9.80, 10.27, 10.75, and 15.69 \
V. The scale is established from ROM constants and factory specifications, \
not from firmware arithmetic; JK08A.diagnostics.md derives it.""",
]
level = "code"
unit = "V*12.5"

