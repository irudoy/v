summary = """
Bank-1 exhaust-VTC error word at window offset 0x88c of base ffff128c. FUN \
000c1152 writes it at 000c1dac as the 0..65535 clamp of saturating sum \
000265c4, only while bit 0 of ffff1246 is set. FUN 000c1dec multiplies it by \
ROM16[00009212] on the stock ROM8[00008615] bit-3 branch."""
note = [
    """
The bank-2 word ffff1b1a shares the writer and the reader with coefficient \
ROM16[00009214].""",
]
