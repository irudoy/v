summary = """
Multipurpose diagnostic summary byte. In FUN 0008042c, bit 3 summarizes the \
ordered P0306..P0300 runtime-record scan. It is set when the first \
encountered record with either third-byte bit 5 or bit 6 reaches the \
terminator and is cleared while records contain neither bit. Third-byte bit \
6 has priority over bit 5 because it is tested first."""
note = [
    """
The summary rule is exact; its external diagnostic presentation and physical \
phase name remain unresolved.""",
    """
On 7mfk, bit5 selects the bank-indexed MAF filter: clear copies the working \
word; set executes the previous-output update with ROM8[0x870a]. The filter \
reads this byte without modifying any bit. This code association leaves the \
physical state of bit5 unresolved.""",
]
level = "code"
unit = "bitfield"

