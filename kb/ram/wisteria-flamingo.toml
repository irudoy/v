Scheduler snapshot of AN1-derived source byte ffff283a. The 0x104-byte FUN \
00022558 call copies ffff277e..ffff2881 to ffff267a..ffff277d, so source \
offset 0xbc maps ffff283a to ffff2736. P030 counting readiness requires \
ffff2736 >= ROM8[00008b50] = 40; this is equivalent to ffff3f4c >= 40 on the \
zero-offset branch and ffff3f4c >= 55 on the 15-count branch."""
