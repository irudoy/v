summary = """
Previous-cycle snapshot of EVAP fuel-level coordinate/sentinel result \
ffff282e. Scheduler FUN 00020dfe copies it through the 0x104-byte runtime \
block. Four EVAP functions read it at seven sites: signed high-byte checks \
use 0xffff as -1 sentinel, while FUN 000b2096 uses unsigned high byte 255 as \
the coordinate of coefficient maps 0001259a/000125a2/000125aa."""
note = [
    """
Whole-program p-code analysis completed all 2315 functions with zero \
failures and found exactly these seven reads. In stock JK03A and JK08A the \
value is always 0xffff.""",
]
level = "code"
unit = "EVAP fuel-level sentinel raw"

