summary = """
Exhaust-VTC driver status byte maintained by edge-count monitor 000c22dc \
from engine-event driver 00028ea2. Bits 5 and 6 are the per-bank edge-count \
anomaly flags: set while the bank-1 (bank-2) edge count ffff4072 (ffff4073) \
of the last capture window is zero with arm byte ffff4120 bit 0 (1) set or \
at least two with arm byte ffff4121 bit 0 (1) set, and cleared on a count of \
one or while both arm bits are clear. Bits 3 and 1 (bank 1) and 4 and 2 \
(bank 2) are the ten-window results: set when no-edge counters \
ffff408c/ffff408d or extra-edge counters ffff408e/ffff408f reach \
ROM8[00008e21]=10. Bit 7 is the reset request raised by monitors 00090086 \
and 0009018c when a bank is armed and cleared by 000c22dc at 000c23f6 after \
it zeroes the counters. Bits 5 and 6 inhibit the bank-1 and bank-2 \
edge-phase updates in capture handlers 000c2de0 and 000c2c58 and the \
actual-position update in 000bfc2e, and enable coordinator 000bf630 requires \
both clear for ffff248b bit 0. Writers in the export are 0000284e, 0008fc6a, \
00090086, 0009018c, and 000c22dc."""
note = [
    """
Bank-1 counts are judged while cylinder index ffff11de is 2, 4, or 6 and \
bank-2 counts while it is 1, 3, or 5, after the corresponding capture window \
has closed. Monitors 00090086 and 0009018c judge P1078/P1084 from the \
indicator byte ffff850d rather than from the result bits.""",
]
level = "code"
unit = "bitfield"

