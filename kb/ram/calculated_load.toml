summary = """
Calculated-load response byte written by FUN_0008083c. FUN_00035856 returns \
it for J1979 Mode 01 PID 0x04. Misfire reporter 00084cd0 retains it in three \
operating-point snapshot bytes, and matcher 000847dc accepts current load \
from floor(0.8*snapshot) inclusive to floor(1.2*snapshot) exclusive."""
note = [
    """
Physical percent is 100*A/255. Entry gates in the producer can force code 0 \
or 255.""",
]
level = "code"
width = 8
unit = "percent"
scale = "x*100/255"

