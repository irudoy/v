applicability = "homologous_vq35hr"
scope = "exact-code"
priority = 90
level = "code"
note = """
Exact code routes ffff413e through the Mode 01 handler for PID 0x04. The \
stock normal path divides current Base Fuel Schedule ffff1024 by the \
RPM-dependent reference map 0001491a and publishes 100*A/255 percent. It is \
distinct from internal Q7 map coordinate ffff102c, which divides Base Fuel \
Schedule by fixed reference 00009534 and uses 100*A/128 percent. The factory \
CAL/LD VALUE name and behavior come from the homologous VQ35HR manual; the \
exact JK08A path establishes the runtime quantity and byte representation."""

