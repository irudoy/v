summary = """
Bank-2 exhaust-cam edge count of the current capture window. IMI4C handler \
000c2c58 increments it with saturation at 000c2d5a while arm byte ffff4120 \
bit 1 or ffff4121 bit 1 is set; edge-count monitor 000c22dc judges it while \
cylinder index ffff11de is 1, 3, or 5 (one edge is normal, zero or two or \
more raise ffff850c bit 6) and zeroes it at 000c28ce outside that window and \
at 000c23f0 on reset request."""
