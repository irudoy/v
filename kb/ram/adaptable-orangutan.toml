summary = """
CAN actual-torque word for frame 0x180 byte 2 and byte 3 bits 7..4. FUN \
00079e70 writes 4095 while ffff4221.bit2 is set and otherwise \
clamp(trunc0(s16[ffff2380]/5)+800, 0, 4094), where ffff2380 is the scheduler \
latch of ffff240c."""
note = [
    """
One CAN count is five raw torque counts and count 800 is zero torque. A \
moving-load vehicle capture spans 653..1252 with an idle median of 820.""",
]
level = "code"
unit = "CAN torque count"

