summary = """
Dynamic rotational-speed threshold in FUN 0007584e. Init routine 0002c648 \
copies ROM16[0x942c]. Coolant latch ffff249e.bit0 selects \
min(0x942c,0x9434); ffff84c3.bit7 gates down/up rates 0x9430 and 0x9436; \
ffff4188.bit1 applies optional cap 0x942e. Equality holds the current \
value."""
note = [
    """
Stock rates are zero and both alternate caps are 0xffff, so the normal-path \
value remains 0x2580. The physical x*0.78125 RPM interpretation remains \
catalog-supported rather than code-proven.""",
]
level = "code"
unit = "raw speed x4"

