summary = """
Exact one-byte response source for UDS DID 0x1101. FUN 0002c4f8 writes the \
converted sensor byte and then calls FUN 00039634 to form the normalized \
coolant lookup index. J1979 Mode 01 PID 0x05 in FUN 00035856 returns \
snapshot ffff3fa4, the same 00012dea lookup minus 10."""
note = [
    """
Homologous diagnostic definitions identify DID 0x1101 as engine coolant \
temperature and define deg C = raw-50; J1979 defines PID 0x05 as A-40 deg C \
and the PID byte is this lookup result minus 10, so raw-50 is the conversion \
the ECU declares. The exact JK08A response pointer is ROM32[0x226b0] = \
ffff1079. The ECM terminal and sensor hardware remain hardware items.""",
]
