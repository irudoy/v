summary = """
Bank-1 exhaust-VTC control-mode byte at window offset 0x890 of base \
ffff128c. FUN 000c1dec moves it between 0 (off), 1 (active), and 2 \
(ramp-down) under ffff248b bits 0/2 and bit 0 of ffff1246; FUN 000c2040 \
selects the duty output by it. Mode 2 returns to 0 when published duty word \
ffff1aac reaches zero or ffff248b bit 0 clears."""
note = [
    """
Mode 0 forces controller state ffff1aa4 to zero; mode 2 ramps the published \
duty word down by ROM8[00008de1]/256 of the previous word per pass.""",
]
level = "code"
unit = "mode"

