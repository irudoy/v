summary = """
Exhaust-cam edge-count indicator byte of 000c22dc: bit 6 (bank 1) and bit 7 \
(bank 2) mark a capture window with no edge, bit 4 and bit 5 a window with \
two or more edges. The monitor sets them together with ffff850c bits 5 and 6 \
and clears them on a normal window or reset request (000c231c, 000c2344, \
000c239c, 000c23c4). Monitors 00090086 and 0009018c read bits 6/7 and 4/5 to \
reload or run down timer ffff43be + b and judge P1078/P1084."""
