summary = """
Crank tooth interval. On the normal path the ICI0A handler prologue writes \
the difference between consecutive OSBR1 captures ffff158a on every tooth, \
0xffff on the first capture; the previous value is the numerator of gap \
ratio ffff196c. In P0335 fallback 0002b768 writes the quotient \
uint16(floor(event_interval/12))."""
note = [
    """
One count is 3.2 us. The interval spans 10 crank degrees, and 30 degrees on \
tooth 8.""",
    """
With ffff24c9.bit6 clear and ffff24c1.bit6 set, both ffff2294 and ffff22ba \
receive uint16(current OSBR1 minus the previous stored capture). Bit 6 clear \
selects 0xffff in both words, sets that bit, and still refreshes ffff158a. \
The former ffff22ba word is loaded into R12 for later gap-ratio \
processing.""",
]
level = "code"
width = 16
signed = false
unit = "timer count per tooth interval"

