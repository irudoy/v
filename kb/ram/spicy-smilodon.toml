summary = """
Signed request-bound word published by common transmission completion FUN \
000777fa. When ffff41a6.bit3 is set under stock ROM8[0x89c5].bit0, it \
receives ffff4162; otherwise it receives the ordinary preselected word \
ffff3488. FUN 00079030 applies it as an upper signed bound before publishing \
ffff19c6."""
note = [
    """
ffff41a6.bit3 is set during a gear change with TCM status 3 and for the \
307.2 ms hold after it; the 2026-09-22 road captures show the resulting \
bound in 4-3 and 3-2 downshifts.""",
]
level = "code"
unit = "signed raw"

