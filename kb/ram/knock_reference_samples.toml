[[link]]
type = "input"
to = "knock_normalization_bins/ram"
via = ["knock_slice_evaluator/fn"]
layouts = ["7mfk"]
relies = "structure"
supports = "identity"
note = """
i=x in 0..7; X is the independently seeded unsigned input word. i = x; B = \
uint8(ffff2154); P = uint16(ffff2152); F = min(1,uint8(ffff87e1)); Z = \
min(1,B); X = uint16(RAM16[0xffff2132+2*i]); q = floor(X*P/(32*max(1,B))); \
to = (1-Z)*65535+Z*((1-F)*uint16(q)+F*min(65535,8*q)). The full \
ordinary/weighted/B-zero domain has sign none."""

