summary = "Eight-word 7mfk RAM input vector consumed by bounded reference learning."
block = "knock/block"

[[symbol]]
layout = "7mfk"
address = "ffff20c2"
level = "code"
width = 16
signed = false
note = """
The normal learner reads eight words from ffff20c2+2*i for i in 0..7, then \
EXTU.W supplies each unsigned sample before multiplication. The 16-byte \
consumer footprint is preserved in every case. Forced reset does not consume \
these samples. The earlier acquisition and digital-bin producer are not \
executed; no sensor, scale or hardware identity is inferred."""

