summary = """
Current rotational-speed coordinate in RPM/3.125 representation. FUN \
000384fe writes source word ffff11ee = ffff1196>>4, and scheduler 00020dfe \
copies it here through the 56-byte snapshot block. FUN 00065928 passes it as \
the row input of Engine Torque Map 00010b8e, and the throttle-rev limiter \
FUN 0007584e multiplies it by four and compares/rate-limits the result in \
the same raw domain as ROM16[0x942c]."""
note = [
    """
With ffff1196 = RPM*5.12, the shift by four makes one count 16/5.12 = 3.125 \
RPM. The limiter multiplies the coordinate by four before comparison with \
the 0.78125 RPM/count scalar 0x942c, which gives the same count. The \
2026-09-21 vehicle comparison of limiter slot values 0x1900 and 0x2580, \
which engage at 5000 and 7466..7488 RPM, confirms that conversion.""",
]
level = "code"
unit = "rpm/3.125"

