summary = """
Multipurpose retained status byte. Bit 3 is the exhaust valve timing control \
learning status, set for YET: default initializer 000bccf0 and service 0x31 \
routine 0x0c (000340c2) set it, and FUN 000bfe88 clears it at 000c0ca4 once \
both banks have stored their first learning. Scheduler 00020dfe copies the \
byte to ffff5b32 at 0002135e."""
note = [
    """
FUN 0002e2e8 publishes bit 3 of the copy as DID 0x1311 bit 3, which a \
structured Nissan profile names EXH V/T LEARN with 0 = DONE and 1 = YET. \
Functions 0007d84c, 0007dc32, 0007dddc, 0007dfc0, 0007e1d6, 0007e334, and \
00080b54 write other bits of the byte.""",
]
level = "code"
unit = "bitfield"

