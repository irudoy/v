address = "ffff23c8"
former = ["chocolate-hound/ram/7mfk-ffff23c8"]
note = [
    """
The bounded 7mfk channel builder admits uint8(R4) in 0..5 and retains \
independent higher argument bits. It selects parity-0 base ffff191c or \
parity-1 base ffff191e, adds signed16 ffff1396+2*i and subtracts signed16 \
ffff1466+2*i only when ROM8[8d92] bit3 is set. A set aggregate mask bit i \
bypasses these inputs and both helpers: the unsigned opening word ffff2436 \
is published to both output words. Otherwise a positive intermediate is \
multiplied by unsigned ROM8[129c0+i], shifted through the actual 000224f8 \
fall-through path and its natural RTS/delay slot, then capped at 65535; a \
nonpositive intermediate gives zero. The complete natural builder publishes \
that compensated word at ffff23c8+2*i and the helper result at ffff23d4+2*i. \
The actual affine helper at 0005b7ec returns the maximum of its unsigned \
input and two independent saturated affine branches, each using \
uint32(a*x+100*b)>>14. Exact original instructions, every saved/local byte, \
all GPRs, complete SR/PR/SP/MACH/MACL/GBR, input context, outer ABI, all 64k \
RAM and all declared ROM inputs are observed. Artificial scalar calibrations \
are explicit test contexts. No producer physical decomposition, operating \
cadence, hardware actuation or live validation follows from this numeric \
contract.""",
]

