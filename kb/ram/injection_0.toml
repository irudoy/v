note = """
Exact code maps UDS DID 0x1206 to the first word of the six-channel \
compensated injection-pulse output at ffff23c8. FUN 0004eba2 writes the \
value through Q1.7 channel multiplier 000129c0. The factory VQ35HR manual \
defines INJ PULSE-B1 as actual compensated injection pulse width, and the \
ATU-II one-shot programming in 0002c13c establishes the raw/100 ms scale in \
code, matching the homologous structured profile."""

