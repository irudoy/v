summary = """
First word of the six-channel compensated injection-pulse output written by \
FUN_0004eba2. UDS DID 0x1206 returns this word in big-endian order. Each \
element also passes through FUN_0005b7ec into transformed array ffff23d4, \
which reaches the ATU-II one-shot outputs through scheduler snapshot \
ffff2348 and duration array ffff224e."""
note = [
    """
The VQ35HR factory manual identifies the corresponding monitor as actual \
compensated injection pulse width for bank 1. One count is 10 us: scheduler \
0002c13c adds 800*raw/256 steps to a channel-8 down-counter clocked at \
Pphi/64, so ms = raw/100 and full scale is 655.35 ms.""",
]
