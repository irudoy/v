summary = """
Bank-1 intake-cam running edge phase byte. Capture handler 0002a5cc writes \
it at 0002a746 on every processed GR1F capture as 20*ffff13b2 + \
floor(20*ffff22c8 / ffff22bc) - 60 (selector below 8) or - 20 (selector 8 \
and above), clamped at zero, and copies it to ffff22cc at 0002a75e only \
while event state ffff13c8 is 2, 4, or 6."""
note = ["One count is 0.5 crank degrees; see ffff22cc."]
level = "code"
unit = "edge phase raw"

