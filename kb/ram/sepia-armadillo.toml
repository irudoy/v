summary = """
Signed net engine torque of the parallel channel. FUN 00065860 runs FUN \
000655b4, FUN 0006570c, and FUN 00065764, then writes \
sat_i16(s16[ffff18d8]-u16[ffff2410]). Its scheduler latch ffff2382 feeds \
word ffff3f98 of frame 0x160."""
note = [
    """
The channel evaluates the spark-efficiency factor at latched timing-state \
byte ffff2404 instead of live timing latch ffff11a2. In a vehicle capture it \
stays level through gear changes while ffff240c dips.""",
]
level = "code"
unit = "signed torque raw"

