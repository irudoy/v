summary = """
Multipurpose state byte. FUN 0007584e uses bit 0 as coolant-indexed \
alternate-threshold hysteresis: clear sets at raw ffff1071 >= 255; set adds \
16 before the same comparison, retaining through raw 239 and clearing at \
238."""
note = [
    """
Exact DID conversion raw-50 gives theoretical 205/189/188 deg C boundaries. \
The stock alternate threshold 0x9434 is 0xffff, so this latch does not \
change the normal stock limiter threshold. Other bits and consumers remain \
independent.""",
]
level = "code"
unit = "bitfield"

