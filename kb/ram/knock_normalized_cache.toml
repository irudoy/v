layouts = ["7mfk"]
relies = "structure"
supports = "identity"
note = """
For i=x in 0..7, the separate normalization entry publishes eight sample \
words and the selected cache row using i = x; B = uint8(ffff2154); P = \
uint16(ffff2152); F = min(1,uint8(ffff87e1)); Z = min(1,B); X = \
uint16(RAM16[0xffff2132+2*i]); q = floor(X*P/(32*max(1,B))); to = \
(1-Z)*65535+Z*((1-F)*uint16(q)+F*min(65535,8*q)). Both stores consume the \
same live register, with no sample RAM readback. B=0 publishes ffff without \
reading F, bins or P. With B>0 the reader consumes unsigned words X/P and \
divisor 32*B. Ordinary word wrap forbids a joint positive sign; weighted \
clamping is separate. The fixture ends before subtraction; metric execution \
is an independent contract."""

