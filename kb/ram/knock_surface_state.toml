summary = """
Multipurpose state byte. Bit 6 selects active hot timing surface 0x9A1A when \
clear and 0x9B1A when set in 0004e1c0; reference sample ffff1610 remains \
based on 0x9A1A. Coordinator 000493e8 updates the selector through several \
gates. One hysteresis branch sets it at signed Q8 ffff1382 <= -1792 and \
clears it only above 8192. Bit 6 also selects the high-detonation scaling of \
the target mixture in 0005594a: when set, the deviation of the 0000a9aa \
result from 128 is scaled by 00012552."""
note = [
    """
Bit-6 feedback forms the knock/high-detonation surface-selection loop. Other \
coordinator gates can force either state.""",
]
level = "code"
width = 8
unit = "bitfield"

