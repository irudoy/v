summary = """
State byte shared by several writers; enable coordinator 000bf630 owns bits \
2 and 3. Bit 2 is the coolant window, set at 000bf864 while ffff24a9 bits 3 \
and 6 are both set. Bit 3 is the oil-temperature hysteresis flag: \
oil-temperature snapshot ffff2772, plus 3 while the bit is set, is at least \
ROM8[00008dff]=110, stored at 000bf758 and 000bf75a. Scheduler 00020dfe \
copies ffff246a..ffff246c to prior-cycle ffff246d..ffff246f at 0002105a. Bit \
1 is the standstill exhaust-override predicate written by FUN 000bfe88 at \
000c017e: operational enable ffff248b bit 2, engine-speed window flags \
ffff24ab bits 0 and 1 (1800..4000 RPM), standstill flag ffff24ac bit 7 \
(coarse speed ffff110e at or below ROM8[00008e3c]=2), and ffff244f bit 2 all \
set. While it is set and cancel latch ffff2478 bit 4 is clear, the \
conditioner replaces the map target with ROM8[00008e36]+128=168 (+20 degCA) \
at 000c019e..000c01b8 independently of surfaces 0000b33a, 0000b2fa, and \
0000ab4a."""
note = [
    """
Other bits are written by 00043aee, 00048400, 00048754, 000556ec, and \
000bfe88. Bit 3 sets once the oil temperature reaches raw 110 (60 degC) and \
is a required term of the operating enable ffff248b bit 2 together with \
latch ffff248c bit 7 clear.""",
]
level = "code"
unit = "bitfield"

