summary = """
Coolant-conversion input byte. FUN 0002c4f8 obtains a 16-bit analog result \
through FUN 00028668(0), stores it at ffff1d60, shifts it right by two, and \
writes the low byte here. Calibration 00012dea converts this value into \
exact raw coolant response byte ffff1079; FUN 0008092e repeats the lookup \
for coolant snapshot byte ffff3fa4."""
note = [
    """
The coolant identity follows from the exact ffff1079 diagnostic response \
path, not from table shape.""",
]
level = "code"
unit = "raw sensor input"

