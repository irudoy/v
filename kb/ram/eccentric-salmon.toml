summary = """
Critical-diagnostic qualification counter produced by FUN 0007d856 and \
consumed by 00050920. A clear ffff41ea.bit5 resets it; with that aggregate \
set, ffff422e.bit7 and ffff422f.bits4/5 permit saturating increment while \
loss of any readiness latch holds the prior count."""
note = [
    """
The fuel-inhibit branch qualifies when the counter is greater than stock \
threshold four and the critical aggregate remains set.""",
]
