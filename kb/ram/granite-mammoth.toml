summary = """
Latch byte of enable coordinator 000bf630. Bit 6 sets at 000bf880 on the \
rising edge of coolant-window bit ffff246c bit 2 against prior-cycle \
ffff246f while ffff2458 bit 5 is clear, and clears at 000bf884 while that \
bit is set. Bit 7 sets at 000bf8c6 on the rising edge of oil-temperature \
flag ffff246c bit 3 against ffff246f bit 3, and clears at 000bf894 while \
ffff2458 bit 5 and low-speed flag ffff24aa bit 7 are both set. Bit 6 blocks \
the coolant-window term of ffff248b bit 2, and bit 7 clear is a required \
term of that bit while ROM8[00008616] bit 0 is set, as in stock JK08A."""
note = [
    """
FUN 000bf630 is the only writer of bits 6 and 7: 0004c4cc and 0004c9d2 write \
bits 4 and 5, 0004c536 bits 0 to 2, and 0004c6ba bit 3. Bit 6 stays set from \
the rising edge of the coolant window until ffff2458 bit 5 clears it; that \
bit is the scheduled copy of ffff2459 bit 5, the CLSD THL POS status of DID \
0x1302 bit 0, so the latch releases on the first pass with the accelerator \
pedal at its idle position.""",
]
level = "code"
unit = "bitfield"

