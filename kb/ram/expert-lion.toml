summary = """
Timing-adjustment route byte. FUN 000683cc sets bit 4 while service-0x3b LID \
1 is active and the status is accepted, and FUN 000685f2 copies automatic \
timing request ffff41aa.bit0 to bit 5 under the session checks. FUN 0004aad0 \
selects LID-1 slot ffff99dc with bit 4 and the automatic step of ffff10da \
with bit 5."""
note = ["Other bits are not characterized."]
