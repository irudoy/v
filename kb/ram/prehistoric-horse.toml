summary = """
Multipurpose state byte and per-pass latch of ffff419b. Scheduler FUN \
00020dfe copies the twelve bytes ffff4194..ffff419f to ffff4188..ffff4193 \
through block copier 00022558 at 00021096, so bit 4 is the previous-pass \
value of ffff419b.bit4, which FUN 0007724c sets exactly when TCM field \
ffff3a2e (CAN 0x174 byte 4 bits 5..7) equals 3. FUN 00077892 reads bit 4 as \
the first prerequisite for setting transmission-transition neutralizer \
ffff4252.bit1. Primary startup clears this byte, and the direct writers FUN \
00027530 and FUN 00027838 change bits 0 and 1 while preserving bit 4."""
note = [
    """
Exact-address censuses see only the direct writers because the block copy \
addresses the byte through the copier's registers. Bit 4 follows the TCM \
field one scheduler pass later; the 2026-09-22 road captures carry value 3 \
in 4-3 and 3-2 downshifts, so the transition-neutralizer path acts during \
those gear changes.""",
]
level = "code"
unit = "bitfield"

