summary = """
Runtime column coordinate for Engine Torque Map 00010b8e. FUN 00065928 \
writes min(65535,floor(u16[ffff1024]*40960/ROM16[00009534])) here and passes \
the same value to the stack-copied axis from ROM 0002378c."""
note = [
    """
It is the ratio that the feed publishes from the Q7 byte \
[[normalized_load/ram]] at a finer resolution; the coordinate saturates at \
160 percent and the byte at 199.2 percent.""",
    """
Multiplication by 100/40960 makes the exact representation 100*BFS/scaler \
percent of the fixed BFS reference. The HR catalog calls this ratio Cylinder \
Filling Up Efficiency; that physical name remains a candidate.""",
]
level = "code"
unit = "normalized BFS coordinate"

