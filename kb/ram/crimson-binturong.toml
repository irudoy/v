summary = """
Timing-state transition countdown. FUN 0004afdc reloads it from \
ROM8[000086a3]=85 whenever current upstream DFCO bit ffff2458.bit5 is clear; \
the periodic timer handler decrements it. Warm transition table 0001219e \
requires the bit set and this timer nonzero."""
note = [
    """
One count is exactly 204800/Pphi seconds. Passive target-CAN timestamps \
establish Pphi=20 MHz, so the maximum 85-count selection window is 870.4 \
ms.""",
]
level = "code"
unit = "scheduler counts"

