summary = """
Bank 1 MAF transfer output from the 64-point word curve 0x00014274 on 7mfk. \
FUN 0003a904 passes uint16(uint16(ffff1e48)<<4) to wrapper 00026410 and \
stores its low word in ffff1054. The wrapper interpolates adjacent unsigned \
words below coordinate 0x3f00 and returns the sign-extended last word at or \
above it. FUN 0003a982 copies the stored unsigned output to the working \
filtering input; FUN 0003b520 uses the two bank outputs for contribution \
fractions."""
note = [
    """
Exact DID 0x1204 and the continuous AN4-to-DID-to-map-to-DID 0x1209 trace \
establish the MAF and bank-1 identity.""",
    """
The input retains only the low 12 bits before lookup. Each implicit cell \
spans 16 input counts; its low four input bits form a Q0.16 fraction in \
multiples of 4096. Last-cell sign extension affects the function return \
register, not the unsigned published word. Software execution preserves the \
existing engineering-unit interpretation without validating it on \
hardware.""",
]
level = "code"
unit = "raw MAF quantity"

