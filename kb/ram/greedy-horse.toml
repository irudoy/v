summary = """
Bank-1 intake-cam edge interval word. Capture handler 0002a5cc stores GR1F \
capture fffff44e minus crank reference count ffff158a at 0002a6d0 and \
divides 20 times the same difference by ffff22bc for running phase \
ffff22d2."""
note = [
    """
Channel 1A counts phi'/32 = 3.2 us (TCR1A = 5 in 0002718a, PSCR1 = 1 in \
000274ac), so the word is a time between the crank reference and the \
intake-cam edge.""",
]
