summary = """
Two-lane unfiltered temperature PID pair. FUN 0003d4a8 writes element[lane] \
= max(lookup(00012dea, uint8(ffff1d58[lane] >> 2)) - 10, 0) through \
implicit-axis primitive 000263a0 at 0003d4da, or zero at 0003d4e6; FUN \
0003d832 copies element 0 into PID byte ffff3f41."""
note = [
    """
The pair follows the lane layout of ffff1d58: element 0 for phase 1 and \
element 1 for phase 3. Only element 0 reaches J1979 PID 0x0F; element 1 has \
no found consumer.""",
]
