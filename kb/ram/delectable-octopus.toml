summary = """
Latched copy of ASCD display state ffff4128. Scheduler FUN 00020dfe copies \
the 0x58 bytes ffff4124..ffff417b to ffff40cc..ffff4123 through block copier \
00022038 at 0002132c. CAN 0x551 serializer FUN 000c5372 reads the low three \
bits at 000c53d2 and places them in payload byte 5 bits 4 through 6."""
note = [
    """
The 0x551 serializer transmits the display state and does not read SET-lamp \
flag ffff4252 bit 0. The delayed SET lamp observed on the target vehicle \
while an injected field holds 6 is consistent with a blink timer in the \
meter; the meter firmware is not analyzed. The saved target-vehicle captures \
contain only 0 in the stock field.""",
]
level = "code"
unit = "enumerated state"

