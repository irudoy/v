applicability = "nissan_family_candidate"
scope = "exact-code"
priority = 100
level = "code"
note = """
The exact JK08A UDS table maps DID 0x1208 to the two-byte big-endian word \
ffff1026. Runtime producer 0003b75c and init routine 0002c648 are its only \
whole-program p-code writers; scheduler 00020dfe rolls it into ffff1024. A \
structured homologous Nissan profile names DID 0x1208 B/FUEL SCHDL and \
defines raw/2048 ms. The homologous VQ35HR factory ESM independently defines \
Base Fuel Schedule as the pre-learned fuel-injection pulse width. Identity \
is exact for the JK08A response path, and the JK08A pulse chain fixes the \
same conversion: the stage normalizers between the schedule and the 10 us \
injection-pulse words, 0x4000/131072 in 0004e974 and 0x6400/65536 in \
0004ead4, multiply to exactly 100/2048."""

