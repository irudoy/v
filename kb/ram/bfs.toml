summary = """
Newest Base Fuel Schedule word. Init routine 0002c648 and runtime producer \
0003b75c are its only whole-program p-code writers; scheduler 00020dfe \
copies it to current sample ffff1024. UDS DID 0x1208 returns this word in \
big-endian order."""
note = [
    """
A whole-program p-code scan found no other resolved or computed-address \
writers. One count is 1/2048 ms in the time base of the injection-pulse \
words. The stage normalizers between this word and the 10 us pulse words \
multiply to exactly 100/2048: FUN 0004e974 scales the schedule by multiplier \
ffff22e6 over 131072 with unity 0x4000, and FUN 0004ead4 scales the \
precursor by the trim sum over 65536 with neutral 0x6400. At unity bank \
multiplier, unity common gain, and neutral trims the pulse before injector \
opening time is floor(raw*100/2048) counts of 10 us. Common Q14 gain \
ffff165e stays within 12280..13917 of 16384, so the delivered pulse is \
0.7495..0.8494 of the schedule; the adjacent power-of-two scales would need \
a gain of 0.39 or 1.57, outside that range. Replaying the chain over three \
2026-09-17 vehicle recordings reproduces both bank pulse words at a median \
ratio of 1.000, with 87 to 98 percent of steady records within 2 percent. \
The raw/2048 ms conversion of the homologous structured Nissan profile for \
DID 0x1208 agrees with this arithmetic.""",
    """
On 7mfk, the Q7 normalization consumer reads this word unsigned, shifts its \
value left by seven without overflowing 32 bits, and divides by an unsigned \
reference word. Its first saturation test uses the unsigned word cached at \
0003bcc0; the unsaturated path explicitly rereads the word at 0003bd3a. \
These cases preserve the existing physical conversion and do not execute the \
complete BFS producer.""",
    """
On 7mfk with ffff2449.bit7 clear, the limiting slice adds cached signed \
correction R7 to the unsigned working word selected by ROM8[0x8d92].bit4, \
clamps the candidate at zero, looks up the implicit 16-point upper-limit \
byte, and caps at byte*256 before word publication. Static pre-entry binding \
identifies the correction as the word also stored at ffff1060 and the mode \
as the masked ROM bit. Incoming selected contexts execute both source paths \
without executing their preceding writers. With bit7 set, the independent \
branch uses saturated RPM/12.5 byte and absolute-throttle byte to select the \
direct 3x4 grid; speed byte >=192 publishes zero. This branch preserves the \
upper-limit byte and does not add correction or invoke the limit curve. \
Existing time scale and history/normalization contracts remain \
independent.""",
]
