summary = """
Bit 5 is the timing-transition warm hysteresis latch maintained by 0004afdc \
from raw coolant snapshot ffff1071. It sets at raw 110 or above; when \
already set, adding four before the same comparison retains it through raw \
106 and clears it below 106. The bit must be set for warm transition table \
0001219e."""
note = [
    """
The exact DID 0x1101 conversion raw-50 gives a 60 deg C set boundary and a \
56 deg C retention boundary.""",
]
level = "code"
unit = "bitfield"

