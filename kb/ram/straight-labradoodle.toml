summary = """
Six-channel pulse/update eligibility mask, addressed as ffff120e+0x12. In \
stock ROM8[00008d92].bit3=1 mode, 00052034 sets or clears each channel from \
ffff22e0, signed difference ffff142e, calibration 000087fe, and ffff16ff. \
FUN 00051a98 reads the prepared bit for a per-channel calculation, and \
00051f1e passes the mask to one-shot scheduler 0002c13c."""
note = [
    """
This mask is not a standalone global fuel-enable state. Its exact physical \
pulse or update event remains unresolved.""",
]
