summary = """
Exhaust-VTC neutral-target timer. FUN 0008f168 reloads it with \
ROM8[00008e40] at 0008f39e while it is non-zero and ffff4184 bit 7 is clear \
or common target ffff2327 equals 0x80; FUN 00090256 evaluates rest position \
only while it is zero, and the target-tracking enable also requires zero. \
Initializer FUN 0007ebec and reset helper FUN 0008fc6a write it."""
note = [
    """
The timer lies in the 102.4 ms byte block of base-tick handler 0002040c, so \
the reload of 60 is 6.14 s.""",
]
level = "code"
unit = "102.4 ms counts"

