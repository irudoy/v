summary = """
Base of the six-element transformed injection-pulse array. FUN_0004eba2 \
passes each raw ffff23c8 element through FUN_0005b7ec and writes the result \
at index 2*i. With stock coefficients the transform is \
max(x,sat_u16(floor((13656*x+425000)/16384))). Scheduler copier 00020dfe \
snapshots the array to ffff2348, from which FUN_00054d3e fills \
scheduled-duration array ffff224e. FUN_000521a8 takes the maximum across all \
six elements."""
note = [
    """
The numeric transform is exact and is the final minimum-pulse floor before \
the hardware. One count is 10 us, the same unit as ffff23c8.""",
]
level = "code"
unit = "ms*100"

