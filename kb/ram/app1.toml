summary = """
Exact JK08A UDS DID 0x120D source and first accelerator-pedal sensor \
diagnostic value. FUN 000a7040 accepts ROM16[0x8ffc]=60..ROM16[0x8ff8]=964 \
counts and dispatches P2123/P2122 outside that window."""
note = [
    """
The acceptance window is 0.30..4.82 V at 5 mV per count and brackets the \
factory band of 0.5..1.0 V released and 4.2..4.8 V depressed. Target \
recordings hold the released word near 151 counts and reach 940 counts at \
full stroke. The diagnostic display unit is V at 5 mV per count; \
JK08A.diagnostics.md derives that scale.""",
]
