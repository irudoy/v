summary = """
Bank-2 intake-cam running edge phase byte. Capture handler 0002a36a writes \
it at 0002a47e on every processed GR1E capture as 20*ffff13b2 + \
floor(20*ffff22ca / ffff22bc) - 60 (selector below 8) or - 20 (selector 8 \
and above), clamped at zero, and copies it to ffff22cd at 0002a496 only \
while event state ffff13c8 is 1, 3, or 5."""
note = ["One count is 0.5 crank degrees; see ffff22cd."]
