summary = """
Unsigned stationary-limiter readiness accumulator. Every expiry of ffff258a \
adds lookup(000124d2)-128 with saturation to 0..65535. Readiness bit 4 of \
ffff247f is set at accumulator >= ROM16[0000911c] when its secondary gate \
passes."""
note = [
    """
The stock threshold is 381. The high-RPM table step is 127, so three timer \
expiries reach readiness. At or below 2000 RPM the stock step is zero and \
readiness cannot build from reset.""",
]
level = "code"
unit = "accumulator counts"

