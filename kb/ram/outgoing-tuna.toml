summary = """
Multipurpose diagnostic status byte. FUN 0004f494 uses bit 3 as the \
1900/1700 RPM hysteresis state for the P1217 engine-overtemperature fuel \
inhibit. FUN 000683cc writes bit 0 as the one-pass rising edge of \
service-0x3b LID-2 store bit ffff99f4.bit3 against previous level \
ffff41ef.bit7."""
note = [
    """
Other bits and consumers belong to independent diagnostic state machines.""",
]
level = "code"
unit = "bitfield"

