summary = """
Shared uint16 lookup coordinate for both parallel endpoint-curve channels \
and their trim curves. It is passed without rescaling to axes 00014f82 and \
00018f76. FUN 00079a98 normally copies it to first-channel override source \
ffff3026; both channel calculations pass values at or above 800 into their \
final-bound stage."""
note = [
    """
The stock breakpoint domain is 0..840 raw. Catalog concepts do not identify \
the physical quantity or unit.""",
]
level = "code"
unit = "raw coordinate"

