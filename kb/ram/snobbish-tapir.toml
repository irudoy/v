summary = """
Signed rotational-speed request-limit output written by FUN 0007584e under \
periodic-table index 12. ROM16[0x942c]=0xffff writes neutral 0x7fff and \
returns. Otherwise active/inactive ramp selection, the independent final \
rate, recovery envelope ffff19dc, and optional ffff4252.bit1 neutral \
override determine the value. Index-18 arbiter 00071508 takes its signed \
minimum with other controller limits."""
note = [
    """
Engagement requires previous signed output < APP request ffff243c; equality \
takes the inactive/reset path. This candidate reaches the throttle target \
chain but never enters independent six-channel fuel mask ffff22e0.""",
]
