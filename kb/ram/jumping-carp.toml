summary = """
Multipurpose misfire status byte. Reporter 00084cd0 sets bit 7 when group 2 \
is captured and clears it when the odd-argument path removes group 2. Before \
each reporter call, coordinator 00082c8a sets selector bit 6, 5, or 4 for \
even group 0, 1, or 2 respectively; odd paths clear all three bits. Handler \
0007dc32 tests the combined mask 0x70: a nonzero selector uses the \
record-bits3/6 branch, while zero uses the record-bits4/5 branch and sets \
ffff5b2c.bit3."""
note = [
    """
The operational selector mapping is exact. Code does not identify either \
polarity as a physical pass or fail phase and does not name groups 0..2.""",
]
level = "code"
unit = "bitfield"

