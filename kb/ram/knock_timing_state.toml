summary = """
Signed Q8 timing-state word written by knock/high-detonation coordinator \
000493e8. In the direct branch it is \
int16(ffff1380+((low7(0x9A1A)-low7(0x9B1A))<<8)); alternate branches \
slew-limit a selected Q8 state, apply a lower bound, and clamp positive \
output to zero."""
note = [
    """
The direct branch shifts the difference of the cells of \
[[high_octane_timing_state/tbl]] and [[high_detonation_timing_state/tbl]], \
one degree per count, left by 8, so one count of the word is 1/256 degree.""",
    """
The direct formula requires ffff2469.bit7 clear and ffff2467.bit6 set. It is \
not a universal interpretation of this word.""",
]
level = "code"
width = 16
unit = "deg"
scale = "x/256"

