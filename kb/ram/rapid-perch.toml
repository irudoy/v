summary = """
Base of the five-byte decoded ASCD steering-switch sample window \
ffff2701..ffff2705, the scheduler latch of ffff2805..ffff2809. While bit 0 \
of ROM8[0x8B28] is set, 000d0f44 moves ffff2805..ffff2808 up by one byte on \
each run and stores the decoded code ffff36d8 in ffff2805; FUN 000cf020 \
accepts a new stable code only when all five latched bytes are equal."""
note = [
    """
No instruction stores into the window directly: the 0x104-byte FUN 00022558 \
call at 00020fcc in 00020dfe copies ffff277e..ffff2881 to \
ffff267a..ffff277d. FUN 000d185c decodes word ffff3630 against a threshold \
table and accepts the one-hot result in ffff36d8 when two consecutive \
decodes agree; the ADC channel and MCU pin behind ffff3630 are not traced.""",
]
level = "code"
unit = "one-hot switch code"

