summary = """
Previous ATU-II channel 0A input-capture value of crank tooth 9. FUN \
00028ea2 subtracts it from current ICR0A, takes the absolute value, then \
refreshes it from fffff434 on the same selector mode because ROM8[00008bdc] \
and ROM8[00008bdd] both equal 9."""
note = [
    """
The first tooth-9 capture initializes the reference. Every later tooth-9 \
invocation produces an interval over 120 crank degrees between consecutive \
ICR0A captures before refreshing it.""",
]
level = "code"
unit = "timer counts"

