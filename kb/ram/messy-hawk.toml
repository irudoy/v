summary = """
Base of the six-element mask-gated injection-pulse array written by \
FUN_00051a98. For channel i the stock branch forms base = \
arithmetic_shift6(uint8(ffff152c)*uint8(ffff1527)), adds or subtracts \
uint8(ffff15d8) by ffff2484.bit0, adds 0x32 when bit i of uint8(ffff1574) is \
set, scales the sum by int16(ffff142e+2*i) over 1024 and by uint16(ffff165e) \
over 8192 with uint16 saturation, and adds uint16(ffff2436)."""
note = [
    """
One count is 10 us, the same unit as ffff23c8; the additive ffff2436 term is \
the injector opening time.""",
]
level = "code"
unit = "ms*100"

