summary = """
Bank-1 A/F sensor working word written by FUN 00059d9a. FUN 00035856 divides \
it by 5 for J1979 Mode 01 PID 0x14 at 00035e08 and sends the quotient with \
the bank-1 trim byte through helper 000357dc."""
note = [
    """
J1979 defines PID 0x14 as A*0.005 V, which would make one count one \
millivolt; helper 000357dc refuses every oxygen PID while sensor-present \
byte ROM8[0x8936] is zero, as in stock JK08A, so the path is inactive.""",
]
