summary = """
Stable one-hot ASCD steering-switch code accepted by FUN 000cf020 after five \
equal latched samples of decoded code ffff36d8. Exact diagnostic code maps \
0x02 to CANCEL, 0x08 to SET/COAST, and 0x10 to RESUME/ACCEL. The MAIN switch \
block copies bit 0 into ffff41ae bit 7."""
note = [
    """
A decoded one-hot state, not simultaneous button bits. A CANCEL tap while \
SET is held appears as a CANCEL run between SET runs. The archived \
map_switching.ascd_main_vehicle_2026_09_21 record in \
patches/hardware-results.toml attributes transmitted accepted code 0x01 to \
physical MAIN presses and 0x20 to release during its stationary-idle \
capture. Frame 0x239 byte 3 carries ffff36d8; the record does not directly \
sample stable byte ffff2a85 or MAIN flag ffff41ae.bit7. Those RAM/flag \
bindings are code-derived. The toggled state ffff4251.bit1 is carried by \
frame 0x239 byte 2 bit 1. The record has no hardware_status=pass or physical \
target_ecu provenance; it is retained as a bounded observation, not hardware \
acceptance of the stable byte, the complete debounce state machine, ASCD, \
the lamp, or the current runtime. Code 0x00 is unobserved and invalid to the \
injected selector.""",
]
level = "code"
block = "discrete_inputs/block"
unit = "one-hot switch code"

