summary = """
Second signed request-bound word published by common transmission completion \
FUN 000777fa. With ffff41a6.bit3 set it becomes min(ffff34c8,ffff4162); \
otherwise it is min(ffff348c,ffff34c8). FUN 00079030 applies it as a lower \
signed bound, a maximum at 0007914e..00079154, before upper bound ffff3480 \
on the path to shared request ffff19c6."""
note = [
    """
With ffff41a6.bit3 set and ffff34c8 at or above ffff4162, both bounds equal \
the candidate, which fixes ffff19c6 to it before the remaining bounds; the \
2026-09-22 road captures show ffff19c6 at the code-9 floor of 500 for 30 \
passes of a 4-3 downshift.""",
]
level = "code"
unit = "signed raw"

