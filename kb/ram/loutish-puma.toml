summary = """
Multipurpose diagnostic status byte. In the P030 component, bit 0 is \
recalculated on every coordinator pass and is set exactly when ffff1071 < \
150, ffff1071 >= lookup_u8(0x12DE2,min(2*ffff1070,255)), ffff106e >= 40, and \
ffff2736 >= 40. Bit 1 is the inter-cycle ffff42a8 qualification controlled \
by ffff244f.bit5. Under the stock application-code lifecycle, ffff42a8 \
remains zero, so the normal coordinator update clears bit 1 while \
ffff244f.bit5 is clear and sets it while that phase bit is set. Bits 0 and 1 \
must both be set in every external low-bit consumer: operating-point matcher \
000847dc, auxiliary service 00085020, detection core 00085a70, six-bucket \
updater 00086d2a, and revolution-window producer 000872d0. Bit 2 is a \
coordinator-local event latch set at 00083848 and cleared at 00084552."""
note = [
    """
Normal startup and the two recovery initializers clear the full byte through \
descriptor-driven longword stores. A whole-program p-code census of all \
2,315 functions found 79 exact accesses and no unresolved candidates. FUN \
00082c8a is the only direct runtime writer that changes bits 0 or 1; every \
other resolved direct writer changes only bits 4, 5, or 7. All other \
resolved readers test only bits 4, 6, or 7. Bits 3..7 remain outside this \
P030 claim.""",
]
level = "code"
unit = "bitfield"

