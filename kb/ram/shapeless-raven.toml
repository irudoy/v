summary = """
Element 0 of the two-byte AN1-derived running-min accumulator. Normal \
startup seeds both elements to 255 through FUN 0002d120. On admitted updates \
FUN 0003d45c can only lower each element to the corresponding map-00012dea \
output at ffff2838/ffff2839. FUN 0003d832 copies element 0 through ffff283c \
into the P030 readiness chain."""
note = [
    """
The indexed runtime writer is code-proven by whole-program p-code analysis. \
Conditional clear services zero the accumulator but do not reseed it within \
those functions. The ECM terminal, physical signal, and engineering scale \
remain unresolved.""",
]
level = "code"
unit = "running-min transfer code"

