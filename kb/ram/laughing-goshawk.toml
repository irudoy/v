summary = """
Multipurpose initialization byte. FUN 0007584e uses bit 0 as the \
speed-filter initialization latch: clear selects min(65535,4*N), then sets \
the bit; set selects the recursive N+floor(3*S/4) update. Bit 1 \
independently remains a one-time initialization latch in the second sum term \
of FUN 00054ee0."""
note = [
    """
The two bits belong to independent state machines and must be described \
separately.""",
]
level = "code"
unit = "bitfield"

