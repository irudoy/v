summary = """
Nonzero P0128 normalization parameter from RPM/12.5 curve 00015bf0. FUN \
000b784e writes the uint16 lookup when it is nonzero and writes one when it \
is zero; FUN 000b6b5a is the sole reader and passes the word to FUN \
000b78da."""
note = [
    """
The whole-program exact xref projection has one writer and one reader. Every \
stock cell of 00015bf0 is zero, so the stock value is one in JK03A and \
JK08A. The physical meaning of the parameter is unresolved.""",
]
level = "code"
unit = "P0128 parameter raw"

