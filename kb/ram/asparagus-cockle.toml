summary = """
Current periodic snapshot of producer byte ffff2459; scheduler 00020dfe \
first copies the old value to ffff245a and then copies ffff2459 here. Bit 5 \
is the upstream DFCO mode/eligibility input: 0004fbe2 requires it for cut \
request, 00050018 returns master-inhibit class 1 when clear, 000503e0 uses \
it in release/reset branches, and 0004afdc uses its clear-to-set interval to \
reload then consume timing-transition timer ffff2590. Bit 7 combines with \
ffff22ff state 3 to select the +30 timing constant bypass."""
note = [
    """
The bit-5 Boolean role in DFCO and timing-transition selection is \
code-proven. Bit 5 is the scheduled copy of ffff2459.bit5, which FUN \
0002e0d4 publishes as DID 0x1302 bit 0; a structured Nissan profile names \
that bit CLSD THL POS.""",
]
level = "code"
unit = "bitfield"

