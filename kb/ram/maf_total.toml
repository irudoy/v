level = "code"
note = """
The exact JK08A UDS table maps DID 0x1209 to big-endian word ffff3852. FUN \
0003c3ac derives it as min(65535, floor(105*ffff105c/256)) from the combined \
output of both MAF transfer curves. The community-measured raw/100 g/s \
conversion is retained as a hardware-validation candidate. The conflicting \
raw*1 structured-profile conversion would imply about 26,800 g/s at the \
exact producer's reachable ceiling, while raw/100 gives a plausible ceiling \
near 268 g/s; the independent MAF Factor dimensional closure supports \
raw/100."""

