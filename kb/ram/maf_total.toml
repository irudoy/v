summary = """
Combined mass-airflow diagnostic word written by FUN 0003c3ac as min(65535, \
floor(ROM8[0x83ec]*ffff105c/256)); stock ROM8[0x83ec]=105. Exact UDS DID \
0x1209 returns the word in big-endian order. FUN 00035856 emits the same \
product ROM8[0x83ec]*ffff105c >> 8 as the two bytes of J1979 Mode 01 PID \
0x10 at 00035dca and 00035dd2."""
note = [
    """
J1979 defines PID 0x10 as (256A+B)/100 g/s, so the word is the airflow the \
ECU declares in g/s*100 and the community raw/100 g/s conversion is that \
declaration; a structured profile stating raw*1 g/s is inconsistent with the \
PID path. The declared airflow is the ECU's own model rather than a hardware \
measurement: the 2026-09-17 recordings put it near 5.8 g/s at idle and at a \
volumetric efficiency above 1.2 near 5200 RPM.""",
]
level = "code"
width = 16
unit = "g/s"
scale = "x/100"

