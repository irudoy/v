summary = """
State byte of the cold-start control monitor, records 0x126 (P1421) and \
0x125 (P1422). Worker 0009b1b4 writes the byte, with bit 5 completed, bit 6 \
fail, and bit 7 pass; routing stage 0009bdd0 clears bits 2, 3, 6, and 7 \
under ffff424f bit 2. Scheduler 00020dfe copies the byte to ffff41a0 at \
0002109e..000210a2, and the routing stage reads the copy."""
note = ["Stock ROM8[0001870e] is 0xf0, so neither record is routed on JK08A."]
level = "code"
unit = "bitfield"

