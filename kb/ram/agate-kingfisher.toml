summary = """
Multipurpose diagnostic status byte in the fuel-inhibit family. FUN 0007c166 \
recomputes bit 5 as the critical P0603/P0605/P2119/P1238 aggregate; FUN \
00050920 stores the qualified 2525/2000 RPM inhibit state in bit 6. Bit 7 is \
the stock-inert lifecycle-zero direct subpath of composite contributor \
000507ce."""
note = [
    """
Normal startup clears the byte inside [ffff261c,ffff4514), and both recovery \
paths clear it inside [ffff1000,ffff5cf4). A 2315-function p-code census \
found no unresolved writer. Runtime writers 0007c166, 00050920, and 0007f870 \
all preserve bit 7, and recovered DMAC destinations do not overlap the byte, \
so bit 7 remains zero in the proven stock lifecycle.""",
]
level = "code"
unit = "bitfield"

