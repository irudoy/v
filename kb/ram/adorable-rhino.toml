summary = """
Multipurpose state byte. FUN 0007584e uses bit 2 as the nonpositive-ramp \
latch. The inactive/reset branch clears it; an active pass sets it when \
entry ramp ffff19da is not greater than ROM16[0x8f2c]=0. A set bit selects \
normal rate 0x9426 instead of fast rate 0x9428."""
note = [
    """
The latch is checked before the ramp update, so one final fast step can \
cross zero before the next pass selects the normal rate. Other bits and \
consumers remain independent.""",
]
level = "code"
unit = "bitfield"

