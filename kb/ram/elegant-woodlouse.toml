summary = """
Saturated intermediate base of the EVAP leak-result calculation. FUN \
000b2096 writes zero when the transformed 000152d6 difference is \
nonpositive, writes a normalized positive result on the admitted division \
path, or writes 0xffff on zero-divisor and saturation paths. The word is \
then multiplied by byte coefficients ffff2f8d and ffff2f94."""
note = [
    """
Normalization parameter ffff2c86 and the two byte coefficients have \
unresolved physical scales, so this intermediate remains raw.""",
]
level = "code"
unit = "diagnostic raw"

