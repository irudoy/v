summary = """
First 32-bit weighted accumulator in the crankshaft rotational-irregularity \
component. On the eligible path, which requires ffff4251 bit 7 and ffff41d2 \
bits 0 and 1, condition ffff444d == 0 causes FUN 00085a70 to add \
ROM8[0x11A28 + ffff2b4b]. Failing the entry or readiness gate clears the \
accumulator."""
note = [
    """
All five reachable table entries are 0xff in stock JK03A and JK08A, so every \
eligible update adds 255. The downstream physical quantity remains \
unresolved.""",
]
level = "code"
unit = "raw"

