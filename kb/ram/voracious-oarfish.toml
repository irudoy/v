summary = """
Quarter-BFS longword on 7mfk. The primary branch first tests \
int32(ffff1e38)>0; nonpositive values store zero. For positive Q, \
fixed-address byte F and word K form p=floor(F*K*Q/256), and the split \
multiplication retains t=p modulo 2^40. Unsigned division by \
ROM8[0x88fb]*selected speed produces fixed capped at 0x726f9; a zero \
denominator selects that cap without invoking the divider. The publication \
is floor(fixed*9163/65536), at most 65535. The independent fallback map \
branch writes floor(M/4) for Base Fuel Schedule raw value M from map \
0x15630."""
note = [
    """
The limit 0x726f9 maps to 65535 after multiplication by 9163 and the right \
shift, proving an intentional uint16 saturation boundary. A2L identifies F \
as MAF Factor with x*0.0001 kg/hr and K as K-Value with ms/kg. Combined with \
N at 1.5625 RPM/count, the firmware coefficient differs from the quarter-BFS \
raw/2048 dimensional coefficient by only 43.994 ppm. Engineering units \
remain source-derived pending hardware validation.""",
    """
The chain formula selects the normal ffff11e8 word and assumes positive \
signed aggregate and nonzero denominator. With incoming ffff4185.bit6 clear, \
ffff2461.bit5 selects alternate ffff11dc instead; both word sources are \
unsigned and clamped to at least 64. With the incoming mode bit set, the \
tested slice uses eight times its already cached ffff2804 byte, clamped to \
at least 64. Explicit byte contexts do not execute the upstream \
mode/fallback selector.""",
    """
The complete per-bank contribution and aggregate proofs bound a coherent \
nonnegative stock aggregate at 2*0xffffff+0x7fff+0xffff=0x02017ffc. Stock \
F=109 and K=26806 keep p below 2^40 over that domain, so the simpler \
unbounded product agrees there. Wide positive aggregate contexts or changed \
fixture coefficients exercise the split-product wrap without a live \
reachability or tuning claim.""",
    """
Independent GNU execution covers primary speed selection, both unsigned \
stock arithmetic helpers including delay slots and division boundaries, \
primary zero/cap paths, and the Q7 consumer. Only seven declared RAM pool \
words are aliased after byte comparison; the original GBR and pre-entry \
context remain bound by the decoded static test. The fallback map, post-Q7 \
rate stage, and final BFS publication are outside this selected slice.""",
]
level = "code"
unit = "quarter BFS raw"

