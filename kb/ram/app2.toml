note = """
Exact JK08A service 0x22 pointer data maps DID 0x120E to ffff26a2, which is \
also the value monitored by the exact P2128/P2127 path. The homologous Z34 \
definition supplies the Accelerator Pedal Position 2 name and raw/200 V \
conversion. Near-adjacent target readings give stream raw 152 = 0.760 V and \
diagnostic 0.76 V."""

