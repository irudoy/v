summary = """
Exact JK08A UDS DID 0x120E source and second accelerator-pedal sensor \
diagnostic value, referred to the sensor-1 scale. FUN 000a70f0 accepts \
ROM16[0x8ffc]=60..ROM16[0x8ffa]=1000 counts and dispatches P2128/P2127 \
outside that window."""
note = [
    """
The pedal sensor 2 terminal carries half the sensor 1 voltage while the \
factory display band of both sensors is the same, so the published word \
carries twice the ten-bit sample: its 1000-count limit is 5.00 V, exactly \
twice the 2.5 V terminal maximum. Target recordings hold it within a few \
counts of ffff269e over the whole stroke. The doubling site is an indexed \
store that the whole-program reference scan does not resolve. The diagnostic \
display unit is V at 5 mV per count; JK08A.diagnostics.md derives that \
scale.""",
]
level = "code"
width = 16
unit = "V"
scale = "x/200"

