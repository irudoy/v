summary = """
Ten-bit meter CAN payload field used by the fuel-level monitor. FUN 000c456c \
assembles it from payload byte 1 and the top two bits of byte 2; FUN \
0003dac6 scales it by 39680/1024 before filtering and map 00014bca."""
note = [
    """
Exact P0460/P0461 result-state gates and the homologous factory M&A-to-ECM \
CAN path establish the fuel-level context. The voltage, percentage, and \
tank-volume conversions remain unresolved.""",
]
level = "code"
unit = "fuel-level CAN raw"

