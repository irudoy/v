[[symbol]]
layout = "1me3b"
address = "fffeb80c"

[[symbol.evidence]]
kind = "l0"
supports = "identity"
at = "1me3b:000a5396"
note = """
Function 000a50ac publishes the final limited word to fffeb80c + \
2*uint8(channel) at 000a5396. The channel byte is saved at 000a50d2 and all \
assignments of the terminal R13 index retain its doubled value. Dispatcher \
000a4e28 calls the function with channel 0 at 000a4f3e/000a4f40 and channel \
1 at 000a4f46 after setting R4=1. This binds channel-0 target storage \
fffeb80c; physical opening scale, bank identity, actuator response and \
cadence remain separate target qualifications."""

