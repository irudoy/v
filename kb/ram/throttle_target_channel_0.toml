summary = """
Base of two uint16 per-channel throttle targets: channel 0 at ffff28bc and \
channel 1 at ffff28be. 0006f48c applies normal, mode, lower, upper, and DTC \
caps before publication."""
note = [
    """
The percentage is the throttle opening above the learned closed position of \
the throttle position sensor.""",
    """
The words carry the coordinate scale of axis 000155a0, 34285/1114112 percent \
of throttle opening per count. Code channel-to-bank identity remains \
unverified.""",
]
level = "code"
width = 16
unit = "percent"
scale = "x*34285/1114112"

[logparam]
id = "X_VQ_Throttle_Target"
unit = "Throttle Valve Opening [%]"

