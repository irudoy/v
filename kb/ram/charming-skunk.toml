it at 0008c266 while FUN 0008c396(0x0100) finds a descriptor record whose \
attribute word has bit 8 set and whose runtime record ffff5718 + 3*index has \
byte 1 bit 7 set, and clears it at 0008c268 otherwise. A set bit blocks \
exhaust-VTC operating enable ffff248b bit 2 in 000bf630, rest-edge learning \
gate ffff24a8 bit 7 in 000bf9b0, and the enable argument of 00090a84. Bit 7 \
is written by 00079a98, bit 0 by 0009a348, and bit 4 by 000cc94e."""
