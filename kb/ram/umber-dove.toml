summary = """
Saturating count of consecutive speed-qualified revolution services for the \
P030 monitor. Once-per-revolution FUN 0007c4e0 increments it while \
ffff24c4.bit7 is set and resets it when the hysteresis state is clear. FUN \
0003cf24 and coordinator 00082c8a both require it to reach stock \
ROM8[000083b8] = 1."""
note = [
    """
The counter saturates at 255. A whole-program p-code pass over all 2315 \
functions found four exact accesses, no unresolved candidates, and FUN \
0007c4e0 as the only writer. Below the stock threshold, FUN 00082c8a clears \
ffff4251.bits6/7.""",
]
level = "code"
unit = "speed-qualified engine revolutions"

