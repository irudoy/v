summary = """
Interpolated uint16 normalization coefficient K from map 0x1495a. Function \
0006205c calculates min(floor(U * K / 50000), 65535) for U from map 0x1459a \
or 0x145ca."""
note = [
    """
All map points equal 50000 in stock JK08A, so K is unity in the normalized \
product.""",
]
