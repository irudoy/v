summary = """
Stored work-support timing adjustment, restored by 000686b8 from the high \
byte of record 0x74 and stored by 00068040 from ffff56b2 when the \
ffff41ab.bit7 latch is set. FUN 0004aad0 selects it as the ffff56b2 source \
when neither ffff424c.bit4 nor bit5 is set and it lies within -5..0."""
note = [
    """
One count is one crank degree of the final coordinate within the ffff5b31 \
window. The idle latch of 00068040 writes it back as the high byte of record \
0x74 beside ffff316a.""",
]
level = "code"
unit = "deg"

