summary = """
Cylinder number of the current engine event as used by the dwell-channel \
selection. The first tooth-4 identification writes ROM8[0002266b + id], the \
predecessor of the identified cylinder; tooth 8 copies ffff13c8 into it. \
Continuation 0002ab24 reads it to select dwell channel ffff13d3."""
level = "code"
unit = "cylinder number 1..6"

