summary = """
Bank-2 actual exhaust-cam timing byte. FUN 000bfc2e writes it at 000bfdae as \
128 plus the filtered deviation of the three edge-phase snapshots ffff11c9, \
ffff11cb, and ffff11cd from learned rest edge ffff479c (mean of the three \
deviations while ROM8[00008615] bit 1 is set, first-order filter with \
coefficient curve 00012f7e against previous-pass copy ffff232b), skipping \
the update while driver status ffff850c bit 6 is set. The exact service-0x22 \
pointer table publishes it as DID 0x1165, and exhaust-VTC monitor 0008f168 \
compares it with common exhaust target ffff2327."""
note = [
    """
The exact response binding proves the target-firmware quantity and bank. \
Homologous diagnostics name DID 0x1165 EXH/V TIM B2. One count is 0.5 crank \
degrees of the exhaust-cam edge relative to the learned rest edge, which is \
the community definition raw*0.5-64 degCA; the unit follows the 3.2 us \
capture clock and the 120-degree event interval.""",
]
level = "code"
block = "cvtc_exhaust/block"
width = 8
unit = "degCA"
scale = "x*0.5-64"

