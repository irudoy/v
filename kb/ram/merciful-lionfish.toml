summary = """
Previous-cycle snapshot of ffff246a. Scheduler 00020dfe copies three bytes \
from ffff246a..ffff246c to ffff246d..ffff246f; bit 7 selects the release \
threshold 00008fde when the preceding accelerator-pedal high state was set \
and activation threshold 00008fdc when it was clear."""
note = [
    """
The current-to-previous copy closes exact activation/release hysteresis. \
This byte is not a rev-limit mode selector.""",
]
