summary = """
Retained learned integrator of the exhaust magnet retarder per bank \
(ffff4838, ffff483c) with base copies ffff4840 and ffff4844. Error stage \
000c1152 preloads the integrator from it on the first enabled pass of a bank \
and stores the first learning in both copies; FUN 000bfe88 refreshes it as \
base * (256 - k) / 256 + capture * k / 256 with k = ROM8[00008e52]=77 at \
000c0b64 and 000c0bd8. Default initializer 000bccf0 and service 0x31 routine \
0x0c load ROM32[000096c0]=0x80000000."""
note = ["The cells lie in the retained-memory area that 00026e1c validates."]
level = "code"
unit = "offset-binary int32"

