summary = """
Bank-1 learned rest edge of the exhaust cam. FUN 000bfad4 stores \
clamp_u8(ROM8[0000831d] - ffff1376 + 128) at 000bfbf8, which equals \
edge-phase snapshot ffff11c8 within the +/-40 band, when ffff2495 bit 3 is \
clear, ffff24a8 bits 7 and 4 are set, and ffff246b bit 4 has just fallen or \
is set with ffff2535 zero; it sets ffff2475 bit 1 at 000bfc20 with the \
store. FUN 000bfc2e subtracts it from the three edge-phase snapshots at \
000bfcaa, 000bfcd6, and 000bfd02 to form actual-position byte ffff2324."""
note = [
    """
One unit is 0.5 crank degrees. The on-car value with the cam at its stop is \
a RAM read that is not recorded.""",
]
level = "code"
unit = "edge phase raw"

