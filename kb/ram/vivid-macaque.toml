summary = """
CAN-derived vehicle-speed word. FUN 000c4506 assembles CAN 0x280 bytes 4 and \
5 as big-endian uint16, treats 0xffff as invalid, divides by 10, and writes \
the word; FUN 0003a174 filters it into ffff115e."""
note = [
    """
J1979 PID 0x0D returns min(255, 2*ffff118e) with ffff118e = ffff115e/20, so \
the CAN word is km/h*100 and this word km/h*10.""",
]
level = "code"
unit = "km/h*10"

