summary = """
Throttle-opening byte written by 00054eb8 as min(255, uint16 ffff40c6 * \
0x505b >> 16), the quarter-coordinate monitor scaled by 0.3139. The byte is \
throttle opening on the same 0..255 scale 0006f236 publishes as J1979 PID \
0x11, so one count is 100/255 percent and one coordinate count of axis \
000155a0 is 34285/1114112 percent. Stage 0005594a compares it with the flat \
200 of map 0001214e, 78.4 percent, for wide-open latch ffff2468 bit 3; \
00052f00 also reads it."""
note = [
    """
The code chain ffff40c6 -> ffff3528 -> ffff2468 bit 3 is exact, and gradient \
0x505b is the one 0006f236 applies before publishing ffff1075 for PID 0x11. \
Unlike that byte, this one is measured from coordinate zero instead of idle \
base ffff28f8.""",
]
level = "code"
unit = "raw throttle opening"

