summary = """
Multipurpose diagnostic status byte. Bit 4 selects the value loaded into \
P030 inter-cycle latch ffff42a8 while ffff244f.bit5 is clear: set selects \
ROM8[00008499] = 0xb4, clear selects the map 0x12026 result, which is zero \
in stock JK08A. Normal startup and recovery initializers clear the byte; all \
seven direct runtime writers preserve bit 4, so this selector remains clear \
under the stock application-code lifecycle."""
note = [
    """
A whole-program scan found 30 exact accesses and no unresolved candidates. \
The seven resolved direct runtime writer functions change only bits 0, 1, 2, \
3, 5, or 6 and preserve bit 4. The physical meaning of bit 4 remains \
unresolved.""",
]
level = "code"
unit = "bitfield"

