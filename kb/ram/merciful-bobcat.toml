summary = """
Bits 7, 2, and 0 are the stored-fault summary of DTC attribute bit 10: FUN \
0008c272 sets all three at 0008c28c while event byte ffff48e0 is nonzero and \
clears them otherwise. A set bit 7 blocks exhaust-VTC operating enable \
ffff248b bit 2 in 000bf630. Bit 1 is written by 00097018, bits 4 and 5 by \
000abca2, bit 6 by 000ae5a4 and 000b29b8, and bit 3 by 000aee06, 000b29b8, \
and 000b3284."""
note = [
    """
The class holds the six mass-airflow records, so bit 7 follows a stored \
P0101, P0102, P0103, P010B, P010C, or P010D fault.""",
]
level = "code"
unit = "bitfield"

