summary = """
Common exhaust-VTC release counter. FUN 000bfe88 increments it with \
saturation while any bit of ffff1246 is set and demand flag ffff24a7 bit 3 \
is clear, clears the bank-enable bits once it exceeds ROM8[00008cc1], and \
zeroes it at 000c0920 after both bank counters reach ROM8[00008cbc]."""
