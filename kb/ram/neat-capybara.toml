summary = """
Volatile currently defined dynamic local identifier. SID 0xac stores the \
accepted DLID here after building its pointer list, and SID 0x21 requires a \
requested dynamic LID above 0x80 to match this byte."""
note = [
    """
A fresh definition normally uses 0x81. The value and associated pointer list \
are runtime session state and are not persistent ROM configuration.""",
]
