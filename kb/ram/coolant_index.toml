summary = """
Current normalized engine-coolant-temperature index produced from ffff1079 \
by FUN 00039634: raw below 10 gives 0, raw from 10 through 169 gives \
floor(240*(raw-10)/150), and raw at least 170 gives 255."""
note = [
    """
The linear range maps -40 through 110 deg C to 0 through 240 in steps of 1.6 \
counts per deg C. Values at and above 120 deg C saturate to 255.""",
]
level = "code"
unit = "normalized coolant index"

