summary = """
Live Q7 normalized Base Fuel Schedule byte produced by FUN 0003b75c as \
min(255,floor(uint16[ffff1026]*128/ROM16[00009534])). Stock \
ROM16[00009534]=0x6a5a. FUN 00020dfe snapshots this byte to ffff102c before \
the next periodic task pass; FUN 0004bbee and FUN 0004dbe8 also read the \
live value directly."""
note = [
    """
A whole-program p-code census found site 0003bd5a as the only direct writer. \
Raw 128 means Base Fuel Schedule equals the 0x9534 reference, and \
raw*100/128 is the exact normalized percentage. The physical Cylinder \
Filling name remains a catalog candidate.""",
]
level = "code"
unit = "normalized BFS Q7"

