A whole-program p-code census found site 0003bd5a as the only direct writer. \
Raw 128 means Base Fuel Schedule equals the 0x9534 reference, and \
raw*100/128 is the exact normalized percentage. The physical Cylinder \
Filling name remains a catalog candidate.""",
    """
The stock word load at 0003bcbe and EXTU.W at 0003bcc0 establish the cached \
R5; the following producer instructions preserve it until 0003bd1c. \
Independent slice execution covers the two unsigned division calls, delay \
slots, cap edges, 16-bit input and denominator boundaries, byte-store \
neighbors, and zero-reference fault 0x44e. Explicit artificial cache/RAM \
mismatches distinguish the first quotient cap from the second low-byte store \
and establish no live race or scheduling claim.""",
]
