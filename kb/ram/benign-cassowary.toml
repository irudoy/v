Live unsigned Q7 normalized Base Fuel Schedule byte produced on 7mfk by FUN \
0003b75c. With the stock coherent cached BFS word and a nonzero reference, \
ffff1048=min(255,floor(uint16[ffff1026]*128/ROM16[00009534])); stock \
reference is 0x6a5a. The first quotient uses cached R5 for the cap, while \
the unsaturated path explicitly rereads ffff1026 for its low-byte store. A \
zero reference records the divider fault and stores zero. FUN 00020dfe \
snapshots the byte to ffff102c before the next periodic task pass; FUN \
0004bbee and FUN 0004dbe8 also read it directly."""
note = [
