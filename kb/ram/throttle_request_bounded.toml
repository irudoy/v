summary = """
Shared signed request coordinate written by FUN 00079030 in periodic-table \
index-21 dispatcher 00079dd8 after applying mode-controlled bounds to \
duplicated selection ffff2438/ffff19c2. Index-22 FUN 00073432 adds numeric \
bias 0x8000, inverse-searches the current-RPM 0xe98e row, and writes \
stock-active coordinate ffff198a."""
note = [
    """
A final bounded signed internal request used as the inverse torque-surface \
input. Engineering conversion is unestablished. Retained hypothesis: \
Candidate requested torque at x*0.1 Nm, dependent on the unresolved physical \
conversion of the internal torque domain. Requested torque is not actual \
torque. The hardware actuator and bank boundaries remain explicit. \
Unverified propositions: The signed request has a confirmed x*0.1 Nm \
physical scale. A requested raw-domain torque value is a measured delivered \
engine torque. The code path proves physical throttle movement, motor \
polarity, channel-to-bank identity, or ECM terminal assignment. The proposed \
physical multiplier is validated on each homologous layout. Source \
references: defs/JK08A.throttle-control.md:3-17, \
defs/JK08A.throttle-control.md:304-330, \
defs/JK08A.throttle-control.md:400-431, defs/JK08A.can.md:232-236, \
defs/JK08A.tuning-telemetry.md:107-113.""",
    """
The continuous 0x942c path continues through ffff198a, ffff183e, ffff19b2, \
per-channel targets, the feedback regulator, and ATU-II BFR6A-D. It remains \
separate from fuel mask ffff22e0; physical plate motion, channel-to-bank \
identity, and ECM terminals require hardware evidence.""",
]
