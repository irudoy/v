summary = """
Scheduler snapshot of TCM gear-phase index ffff1066 decoded from CAN 0x177 \
payload byte 2 bits 0..2. Rotational-speed request limiter 0007584e advances \
recovery envelope ffff19dc by the 30-count calibration 0x943a when target \
gear index ffff1083 is greater than this phase index and by the 50-count \
calibration 0x943c otherwise."""
note = [
    """
In the 2026-08-17 target capture this index equals current gear minus one in \
stable 1st through 4th gear and changes after the 0x174 target field but \
before the 0x174 current field during shifts; the 2026-09-22 road captures \
extend the identity to all 24,009 stable-gear TCM groups of gears 1 through \
5. The operational phase role is verified; a direct mechanical engagement \
boundary is not claimed.""",
]
level = "code"
unit = "zero-based gear-phase index"

