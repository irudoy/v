summary = """
ASCD display state written by FUN 000ceabc at 000cee1a. The function selects \
6 when ffff41ad bit 1 is set or when ffff424c bit 0 and ffff4251 bit 1 are \
both set, otherwise 4 when ffff424e bit 1 is set, otherwise 5 when ffff4251 \
bit 1 is set, and otherwise 0. State 4 sets SET-lamp flag ffff4252 bit 0 and \
states 0 and 5 clear it. State 6 inverts the flag each time countdown \
ffff4411 is zero, tracks the phase in ffff4253 bit 7, and reloads the \
countdown with 20. FUN 000cf020 sets the CRUISE LAMP bit of DID 0x130E for \
states 4, 5, and 6."""
note = [
    """
This writer produces only 0, 4, 5, and 6. By the lamp flags, state 4 is the \
engaged state with CRUISE and SET steadily lit, state 5 is the standby state \
with CRUISE alone, and state 6 is the fault state with a blinking SET lamp. \
The write executes only while ROM8[0x8B28] has bit 0 set and bit 1 clear. \
Stock 0x2B has bit 1 set, and a search of every decompiled function finds no \
other store through base literal ffff4124 at offset 4, so the stock image is \
expected to keep the state at 0.""",
]
level = "code"
unit = "enumerated state"

