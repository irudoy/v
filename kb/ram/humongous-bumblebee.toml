summary = """
Bounded uint16 written and read within 00077892. The function derives a \
gear-indexed value from ffff10e6 and table 0x15212, caps it at \
ROM16[0x942c], floors it at ROM16[0x94b2], and subtracts four times \
rotational-speed coordinate ffff11b6 before building signed candidate \
ffff4162."""
note = [
    """
The physical quantity is unresolved. The resulting signed candidate is \
calculated every selected-path pass and bounds ffff19c6 while ffff41a6.bit3 \
is set, during a gear change with TCM status 3 and the 307.2 ms hold after \
it.""",
]
level = "code"
unit = "raw"

