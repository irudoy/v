summary = """
Bank 2 MAF sensor diagnostic word. FUN 0003c408 scales ten-bit AN15 sample \
ffff1d64 by coefficient ffff4970 with saturation and adds one at full-scale \
raw 0x03ff; exact UDS DID 0x1205 returns the word in big-endian order."""
note = [
    """
The same guarded coefficient and transform as bank 1 apply. The diagnostic \
display unit is V at 5 mV per count; JK08A.diagnostics.md derives that \
scale.""",
]
level = "code"
width = 16
unit = "V"
scale = "x/200"

