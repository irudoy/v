note = """
The exact JK08A UDS table maps DID 0x1205 to big-endian word ffff101e. The \
sole whole-program writer path scales SH7058 AN15 sample ffff1d64 through \
000671d8 and writes this word. The diagnostic identity and bank assignment \
are exact for JK08A. Near-adjacent target readings are consistent with the \
homologous raw/200 V conversion but do not provide a synchronized \
validation."""

