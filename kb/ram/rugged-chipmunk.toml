summary = """
Ramped commanded-mixture word of stage 0005594a, Q14, addressed as ffff120e \
+ 0x2c. With ffff84c3 bit 7 set the stage forms a down step of \
ROM8[0000849b] * 8 = 304 toward 0x4000 and an up step of ROM8[0000849c] * 8 \
= 384 toward ffff15eb << 7 from previous-pass snapshot ffff1278, with \
kick-off ROM8[00008b9c] << 7 = 0x4100 and floor ROM16[0000929c] = 0x4000 on \
band entry. State byte ffff1410 selects the branch: 1 writes 0x4000, 4 and 5 \
write the target directly, 2, 3, and 6 ramp until ffff2485 bit 5 reports the \
target reached. The result is capped at ffff15eb << 7 and ffff2485 bit 5 = \
(word == ffff15eb << 7). Scheduler 00020dfe copies it to ffff1278."""
