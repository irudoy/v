summary = """
Shared throttle target-area word. Normal 00072c3c writes \
clamp_u16(ffff183e+ffff1340-(ffff120e>>2)); alternate mode reconstructs it \
from final channel targets. It is consumed by common and per-channel target \
converters 0006f464 and 0006f48c."""
note = [
    """
A shared unsigned area-domain target count used by the two channel-target \
conversions. Engineering conversion is unestablished. Retained hypothesis: \
Candidate physical target opening area at x*0.0008 cm2 for the shared \
throttle-body model. The count-domain role is established. The proposed \
geometric coefficient and physical aggregation remain unresolved rather than \
silently removed. Unverified propositions: One shared raw area count equals \
0.0008 cm2. The word is a measured physical sum of the open areas of both \
throttle bodies. The same physical area coefficient is established on every \
bound layout. The percent opening-coordinate gradient or the table shape \
supplies an absolute geometric area reference. Source references: \
defs/JK08A.throttle-control.md:3-17, defs/JK08A.throttle-control.md:48-60, \
defs/JK08A.throttle-control.md:433-480, \
defs/JK08A.tuning-telemetry.md:107-113.""",
    """
The normal forward path is independent of the alternate feedback \
reconstruction.""",
]
level = "code"
width = 16

