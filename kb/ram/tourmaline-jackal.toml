diagnostic initialization. FUN 00097eb4 writes byte1 and byte2 as the OR of \
exact P0101/P0102/P0103 and P010B/P010C/P010D record status bytes; FUN \
0003c3ac publishes byte1.bit7 for the 2400 RPM fuel-inhibit contributor."""
