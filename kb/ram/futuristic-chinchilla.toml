summary = """
Input-source and mode selector byte in 0004c1e4; serves as the base of gbr \
addressing (ffff4217 = +0x93). Scheduler 00020dfe copies ffff4185 here \
before its periodic loop, so bit 6 is computed START SIGNAL and bit 7 is the \
debounced PLDR bit 4 of 00038618. Bit 6 participates in the generic ffff42a8 \
refresh and ffff41d2.bit1 conditions. Stock ROM8[00008afc].bit3 is set, so \
while ffff244f.bit5 is set the latch is retained and bit 1 does not depend \
on ffff4184.bit6."""
note = [
    """
The wave 2 claim that bit 6 selects the base mode in 00055098 is refuted: \
code establishes the switching mechanism, but the 'enrichment curves' label \
is P6. Work-support statuses 0xa2 and 0xa6 read bits 6 and 7.""",
]
level = "code"
unit = "bitfield"

