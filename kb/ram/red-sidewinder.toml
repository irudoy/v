summary = """
Inflow opening area in four times the raw 0x13202 area counts. FUN 00069374 \
writes floor(b*ROM8[0x82fe]/128) at 0006d0b8 through shift helper 000224f8, \
where b = floor(X*0x3333/2^18) is about X/20 and does not exceed 255. FUN \
0003b498 adds ffff120e/4 to the summed throttle opening area of QH0 byte \
ffff1170, and 00072c3c subtracts ffff120e>>2 from shared target area \
ffff19b2. The word is also the base of the RAM group whose byte \
ffff120e+0x12 = ffff1220 holds the six-channel pulse/update eligibility \
mask."""
note = [
    """
X is 20*ffff1389 while ffff14b2 >= 1, otherwise 20*ffff90c5 while the caller \
flag in r4 is nonzero, otherwise 20*ffff90d1 while ffff8ee2/20 exceeds \
ffff90d1, and otherwise ffff8ee2. The same pass stores X to ffff8ee4 and \
ffff23e8, saturated b to ffff90c6, and min(255, b+1), or zero for X = 0, to \
ffff90c7 and ffff23e6. EVAP monitors 000aacc0, 000ac994, 000acc54, 000ad8fe, \
and 000ae1a8 and MAF monitors 0008152a and 00081d74 read ffff23e6. The \
purge-flow identity of the area follows the ESM PURG VOL C/V item and \
remains a candidate. The stock-mode writer of mask byte ffff1220 is \
00052034; FUN 00051a98 writes it only in the alternate ROM8[00008d92].bit3=0 \
path.""",
]
level = "code"
unit = "raw opening area*4"

