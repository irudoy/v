summary = """
Base of a six-element signed 16-bit subtractive correction array. \
FUN_00052de8 accumulates a bounded correction into the selected element, \
FUN_000571c0 can clear selected elements, and FUN_0004eba2 subtracts the \
element when ROM8[00008d92] bit 3 is set."""
note = [
    """
Stock value ROM8[00008d92]=0x7a enables the subtraction. The physical \
decomposition of the correction remains unresolved.""",
]
