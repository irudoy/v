summary = """
Clean-release flags of the exhaust-VTC banks, bits 0 and 1. FUN 000bfe88 \
sets bit b on the pass that clears bank-enable bit b of ffff1246 while \
previous-pass bit ffff1284 bit b is set and engine-speed byte ffff11ae lies \
inside ROM8[00008e15]=44..ROM8[00008e14]=80 (2200 to 4000 RPM), clears it on \
a release outside that window, and clears both bits while demand flag \
ffff24a7 bit 3 is set. The learning capture and both learning requests \
require the flags."""
