summary = """
Base of a two-byte bank-indexed rear O2 path-A high-condition metric. FUN \
00089d92 dispatches P0138/P0158 when the selected bank byte reaches \
calibrated limit 0xff."""
note = [
    """
The reset value is also 0xff, but enable state surrounds the comparison. A \
whole-program p-code scan found no direct runtime producer outside \
reset/initialization; the producer is pointer-mediated or unresolved.""",
]
level = "code"
unit = "diagnostic raw"

