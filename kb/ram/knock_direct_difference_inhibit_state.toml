note = """
On the normal table path of coordinator 00062780, GBR is ffff23b8. The byte \
read at 00062e74 inhibits the direct map-difference path when bit 6 is set; \
with that bit clear, snapshot ffff23c7.bit6 must be set at 00062e7a. The \
read at 00062eb8 and shared delay-slot store at 00062ec2 preserve the other \
bits and copy snapshot.bit6 into this bit through the 0xbf/0x40 paths. \
Independent function 00090790 changes bit 7 through the store at 00090856 \
and preserves bit 6; the byte is not a single-purpose boolean. This \
target-specific byte is distinct from the canonical bit-7 encoding required \
by knock_branch_state_raw/field. Other bit roles and physical causes remain \
unreviewed."""

