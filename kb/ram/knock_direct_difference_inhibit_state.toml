note = """
On the normal table path of coordinator 0006d948, GBR is fffe93f0. The byte \
read at 0006dd04 inhibits the direct map-difference path when bit 6 is set; \
with that bit clear, snapshot fffe9489.bit6 must be set at 0006dd0c. The \
store at 0006dd98 preserves the other bits and copies snapshot.bit6 through \
the 0xbf/0x40 paths. Independent function 000a254a updates bit 7 at 000a2728 \
through 0x7f/0x80 and preserves bit 6. The byte has independent bit roles \
and does not match the canonical bit-7 encoding of \
knock_branch_state_raw/field. Physical switching conditions and other bit \
roles remain unreviewed."""

