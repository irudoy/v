summary = """
Manifold-pressure word. FUN 00035856 returns floor((uint16[ffff16d2]*118 + \
98304)/65536) for J1979 Mode 01 PID 0x0B at 00035cfc, and exact service-0x22 \
DID 0x112a returns the high byte. Homologous measured diagnostics identify \
the DID as manifold absolute pressure."""
note = [
    """
J1979 defines PID 0x0B as kPa, so the word represents kPa*65536/118 above \
1.5 kPa and the DID byte about 0.461 kPa per count plus 1.5. The producer \
and the distinction from DID 0x1116 remain unresolved.""",
]
level = "code"
width = 8
unit = "(kPa-1.5)*65536/118"

