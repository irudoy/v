summary = """
Primary APC command byte and common UDS response source for exact JK08A DIDs \
0x1107, 0x1108, 0x1109, and 0x110A. FUN 0004df82 normally writes \
uint8(110-uint8(ffff11d4)), passes the byte to 0002a892 for GR11A \
scheduling, and 0004e080 adds the bounded reset offset before calling \
0002acba. J1979 Mode 01 PID 0x0E in FUN 00035856 reports \
ROM8[0x83d5]-ffff2022 as the timing advance."""
note = [
    "The scaled value is the ignition advance that J1979 PID 0x0E reports.",
    """
The byte is a computed actuator command rather than a physical-angle \
measurement. Instrumented target-vehicle telemetry confirms that a late \
Rolling Launch adapter updates this byte before the APC scheduler while \
ffff11d4 retains the upstream stock coordinate. The normal-path formula \
110-raw has the expected software-command direction; gated transforms and \
physical crank angle remain separate hardware boundaries. J1979 defines PID \
0x0E as A/2-64 degrees before TDC, so the ECU declares 110-raw as crank \
degrees of advance.""",
]
level = "code"
former = ["apc_command"]
width = 8
unit = "degBTDC"
scale = "110-x"

