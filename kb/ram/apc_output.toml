note = """
The exact JK08A service 0x22 table maps DID 0x110A to response byte \
ffff2022. The normal firmware transform 110 - uint8[ffff11d4] exactly \
inverts the community display formula 110 - raw, so the displayed value \
equals ffff11d4 on that path. Gated control modes can alter or replace the \
response, and the physical degree unit remains source-derived until hardware \
validation."""

