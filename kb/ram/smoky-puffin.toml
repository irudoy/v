summary = """
Base of two phase-specific 10-bit AN1 samples: FUN 000280d8 writes ADDR1>>6 \
to ffff1d58 on internal phase 1 and to ffff1d5a on phase 3. FUN 0003d258 \
consumes the pair as indices 0 and 1."""
note = [
    """
A whole-program p-code pass found exactly the two direct writes and no \
computed-address writer candidates in ffff1d58..ffff1d5b. Phase-dependent \
external selection is not visible at the MCU input; the ECM terminal and \
physical signal remain unresolved. J1979 Mode 01 PID 0x0F publishes the \
00012dea transfer code of lane 0 through ffff3f42 and ffff3f41 as intake air \
temperature, which declares the lane as the intake-air-temperature input.""",
]
level = "code"
unit = "ADC counts"

