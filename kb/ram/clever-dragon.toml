summary = """
Misfire revolution-window completion byte. FUN 000872d0 sets bit 5 when \
counter ffff409e reaches the stock 200-revolution threshold, bit 7 when \
ffff40a0 reaches 1000 revolutions, and bit 6 when ffff40a2 reaches the \
second stock 200-revolution threshold. Coordinator 00082c8a services and \
clears the flags independently in bit order 5, 7, 6."""
note = [
    """
Bit 5 can produce reporter arguments 0/1. Bit 7 can produce 2/3 or 4/5. Bit \
6 can first produce 0/1 and later 2/3 or 4/5; retained groups therefore do \
not map one-to-one to revolution windows.""",
]
level = "code"
unit = "bitfield"

