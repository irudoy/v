[[bit]]
bit = 1
name = "armed"
summary = """
Cut arm: [[main_rpm_fuel_cut_state_machine/fn]] sets it when engine speed \
reaches the cut-on word of the pair of [[rev_limit_fuel_cut/tbl]] that it \
selects and loads the cut delay counter; it clears it while engine speed \
stays below the cut-on word and, with the active cut, when engine speed \
falls below the release word"""
level = "code"

[[bit.evidence]]
kind = "rom-bytes"
supports = "role"
at = "7mfk:0004f2f4"
value = "c802"
note = """
tst #0x02,r0 skips the load of the cut delay counter while the arm is set"""

