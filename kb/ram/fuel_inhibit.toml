summary = """
Shared fuel-inhibit state byte. FUN 0004f282 uses bit 1 for engine-speed cut \
delay arming and bit 2 for the active main RPM cut. FUN 0004f9c4 uses bit 7 \
for its transition-window low-speed RPM cut. FUN 00050b3c uses bit 0 for the \
P0011/P0021 3000/2800 RPM hysteresis state. Idle function 000420b8 uses bit \
5 as the arm flag of the after-start idle term block and bit 4 as its latch: \
with ROM8[00008b3f] bit 7 clear and ROM8[00008710] bit 3 set, bit 5 is set \
while intake air temperature raw ffff2733 lies strictly inside \
ROM8[00008b53]=55..ROM8[00008b52]=100, word ffff4524 lies inside \
ROM16[0000938c]=0xa000..ROM16[00009388]=0xe100, and the listed diagnostic \
records are clear; when the arm falls while ffff244f bit 5 is set, bit 4 \
sets, and with bit 5 clear and bit 4 set the terms ffff1510, ffff23ed, and \
ffff23f3 take 0, 0, and 0x80."""
note = [
    """
Each writer preserves the unrelated bits. Bits 0, 2, and 7 feed separate \
global contributors. The records of the bit-5 arm include the exhaust-VTC \
indices 0x43, 0x44, 0x151, 0x152, 0x84..0x89, and 0xd0..0xd3.""",
]
level = "code"
unit = "bitfield"

