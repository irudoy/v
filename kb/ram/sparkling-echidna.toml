summary = """
Unsigned activation-delay counter used by bounded main RPM entry0004f282. An \
inactive request at activation or above loads ROM8[00008c69] only when \
armffff2497.bit1 is clear. An existing arm retains the counter. Counter zero \
sets active bit2; nonzero leaves it inactive. Active hold/release preserves \
the incoming counter. This invocation does not decrement it; its periodic \
producer and cadence require separate evidence."""
note = [
    """
Stock ROM8[00008c69]=0 activates a newly armed request immediately; an \
already armed nonzero counter still waits.""",
]
level = "code"
unit = "count"

