summary = """
Exhaust-VTC bank-enable byte, bits 0 and 1 for banks 1 and 2. FUN 000bfe88 \
ORs both bits in at 000c0604 while demand flag ffff24a7 bit 3 is set, and \
clears them at 000c08a6 and 000c0906 after the release counters \
ffff1951/ffff1952 reach ROM8[00008cbc] and common counter ffff1953 exceeds \
ROM8[00008cc1]. FUN 000c1152 updates the error word only for an enabled \
bank, FUN 000c1dec requires the bank bit for mode 1, and FUN 000c2040 holds \
the request while the bit is set in mode 2."""
note = [
    """
On each clear, a set bit of ffff1284 together with engine speed ffff11ae \
inside ROM8[00008e15]..ROM8[00008e14] also sets the bank bit of ffff1c7e.""",
]
level = "code"
unit = "bitfield"

