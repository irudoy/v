summary = """
TCM status field from CAN 0x174: payload byte 4 shifted right by five (bits \
5..7), published by decoder FUN 000c47ea. Invalid-message fallback FUN \
000c5cb2 writes zero. Sole consumer FUN 0007724c maps values 3, 5, 6 and 7 \
to bits of ffff419b."""
note = [
    """
The 2026-09-22 road captures carry only values 0 and 3; value 3 appears in 5 \
episodes, all in 4-3 and 3-2 downshifts at 2200..3987.5 RPM, and \
JK08A.can.md gives its path to shared request ffff19c6. The TCM-side meaning \
of the field is not established.""",
]
level = "code"
unit = "raw code"

