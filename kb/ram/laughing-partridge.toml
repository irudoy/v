summary = """
Bit 7 is a coalescing pending flag for an interval between consecutive \
tooth-9 ICR0A captures. When ffff13b2 equals stock ROM8[00008bdc] = 9 and \
ffff84f1.bit7 is set, FUN 00028ea2 stores abs(ICR0A - ffff84d4) at ffff1dac \
and sets this bit. The same invocation refreshes ffff84d4 because \
ROM8[00008bdd] also equals 9. FUN 0003cf24 clears the bit after consuming \
and shifting the sample."""
note = [
    """
Stock JK03A and JK08A both use tooth bytes 9/9. The tooth-9 capture occurs \
once per 120 crank degrees, three times per crankshaft revolution.""",
]
level = "code"
unit = "bitfield"

