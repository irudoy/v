summary = """
Multipurpose diagnostic state byte. FUN 000ab844 is the recovered producer \
of bit 0 for P0444, and FUN 000abca2 consumes and clears that bit around \
exact descriptor index 0xc9. Other functions control separate bits of the \
same byte."""
note = [
    """
A whole-program direct-writer scan distinguishes the P0444 bit from \
unrelated bits in this shared byte. ROM8[0x186FE] is zero, so the P0444 \
producer and exact dispatch branch are skipped in stock JK08A.""",
]
level = "code"
unit = "bitfield"

