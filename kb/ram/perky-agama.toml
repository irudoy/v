summary = """
Periodic snapshot of Intake Air Temperature source byte ffff2837. Scheduler \
FUN 00020dfe copies it through the 0x104-byte runtime block snapshot; P0128 \
accessors consume the snapshot as their ambient/intake-temperature input."""
note = [
    """
The exact copy offset is ffff2837-0x104=ffff2733. The homologous DID 0x1106 \
conversion is deg C=raw-50; the physical input requires hardware validation \
on JK08A.""",
]
