summary = """
Second-channel Q15 crossfade weight scratch. FUN 0007a804 writes \
interpolation result w from map 00016f48 here when ROM8[000083c1].bit7 is \
clear, or substitutes ROM16[0001630c]=0x8000 otherwise. It immediately uses \
w in floor((A*(32768-w)+B*w)/32768)."""
note = [
    """
This word is the weight source-selection result, not the blended endpoint \
output.""",
]
