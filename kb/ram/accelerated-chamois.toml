summary = """
Multipurpose diagnostic state byte following ffff423e. FUN 000ab844 is the \
only recovered direct setter of bit 7, which FUN 000abca2 consumes and \
clears for exact P0445 descriptor index 0xca. Other functions control bits 0 \
through 4 and bit 6 for unrelated state."""
note = [
    """
ROM8[0x186FE] is zero, so the P0445 producer and exact dispatch branch are \
skipped in stock JK08A. The only recovered producer also requires unsigned \
ffff404a < 0 and is therefore independently unreachable in the stock \
image.""",
]
level = "code"
unit = "bitfield"

