summary = """
Bank 2 short-term fuel-trim word in Q8.8 percent representation. FUN \
0005c910 normally copies working word ffff40ae here; UDS DID 0x1124 returns \
the high byte and J1979 PID 0x08 converts the complete word by division by \
200."""
note = [
    """
Neutral is 0x6400 = 100 percent. The bank mapping is established \
independently by standard PID 0x08 and exact UDS pointer data.""",
]
level = "code"
width = 16
unit = "percent"
scale = "x/256-100"

[[diagnostic]]
id = "short-term-fuel-trim-bank-2-did-1124"
kind = "runtime_value"
label = "DiagnosticParameter"
key = "diagnostic-parameter:request:221124"
claim = {label = "ParameterDefinition", id = "obd2tools-d27c9a2:pids-nissan-py:l0028-l0028:entry-0014:parameter:stft-b2-221124-9661ad52"}
applicability = "nissan_family_candidate"
scope = "exact-code"
priority = 100
level = "code"
note = """
The exact JK08A service 0x22 table maps DID 0x1124 to the high byte of \
Q8.8-percent word ffff22de. Exact Mode 01 code maps the same word to \
standard PID 0x08 as min(255, floor(word/200)), proving short-term fuel trim \
bank 2. The community display formula raw-100 and firmware initialization at \
0x6400 agree on neutral raw 100."""

