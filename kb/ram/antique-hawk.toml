summary = """
Engine-event scheduler pending flags. FUN 000208f8 sets bit 7 on every \
admitted current-cylinder event and bit 6 after each third event. Dispatcher \
000209d8 uses bit 7 for the six-entry table at 00021948 and bit 6 for the \
three-entry table at 00021960, whose second entry is misfire \
revolution-phase dispatcher 0007c494, then clears each serviced bit."""
note = [
    """
The modulo-3 event relation corresponds to one crankshaft revolution on the \
V6 and closes the physical cadence of FUN 000872d0.""",
]
level = "code"
unit = "bitfield"

