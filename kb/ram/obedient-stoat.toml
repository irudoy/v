Normal startup clears the containing [ffff261c,ffff4514) span and both \
recovery paths clear [ffff1000,ffff5cf4). The full p-code census finds no \
store to the byte; its only unresolved base-ffff4184 store targets offsets \
0x54 or 0x65. Recovered DMAC destinations are limited to ffff86cc..ffff87cb, \
so bit 1 remains zero in the proven stock lifecycle.""",
]
