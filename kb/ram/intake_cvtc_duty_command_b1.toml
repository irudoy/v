note = """
The byte-selected branch of programmer 000e7994 loads command byte ffff2308 \
at 000e7a86 using literal base ffff2282 plus zero-extended offset 0x86. With \
ROM8[0000852a].bit2 clear and without the override, it zero-extends the byte \
at 000e7ada and uses the byte-scheme conversion before writing word BFR7B \
fffff592 at 000e7af2. The alternate set-bit-2 branch reads word ffff25c4 at \
000e7a6c. This directly grounds the byte consumer and distinguishes the \
schemes; scheduler copy, bank identity and cadence remain separately \
qualified, and existing scale evidence retains its scope."""

