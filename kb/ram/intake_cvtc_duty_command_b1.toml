summary = """
First cell of the two-cell intake-VTC solenoid duty command and scheduler \
latch of live duty cell ffff2440. FUN 000beace reads it at offset 0x84 of \
base ffff2330 and programs ATU-II channel-7 buffer register fffff592 with \
raw*ROM8[00008dfc]*39/80."""
note = [
    """
Cycle register fffff58a holds 125*ROM8[00008dfc], so percent = raw*39/100 \
and full scale 255 is 99.45 percent. FUN 00020dfe copies 140 bytes from \
ffff23bc to ffff2330 through the block-copy call at 00021318, so this cell \
receives ffff2440 once per scheduler pass.""",
]
