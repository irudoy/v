[[symbol.evidence]]
kind = "spec"
supports = "scale"
path = "defs/JK78C.cvtc.md"
note = """
Bit 2 of ROM8[0x8576] selects the 16-bit scheme in the stock image: \
programmer 0011c3a6 drives BFR7B from duty word fffe9692 over a cycle of \
1000 counts, and the cell holds the high byte of that word after the \
scheduler copies, x*25/64 percent"""

[[symbol.evidence]]
