summary = """
Pending one-hot channel mask of the delayed injection start. Sequencer \
00054a44 writes ROM8[00022695 + slot] for the slot accepted on the current \
engine event and zero when no slot is accepted; engine-event driver 00028ea2 \
seeds it during the start phase. Compare-match handler 0002be40 fires it \
through one-shot scheduler 0002c13c, and the sequencer fires it on the next \
event when ffff84ec.bit7 is still set."""
note = [
    """
Slot masks at 00022695 are 02 04 08 10 20 01. Channel bit k drives the \
injector of cylinder k + 1: Power Balance service 0x30 IOLID 0x0c replaces \
the same six-channel mask bit for bit and the Nissan-family profile assigns \
bits 1..32 to cylinders 1..6. The assignment is not measured electrically.""",
]
level = "code"
unit = "six-channel bit mask"

