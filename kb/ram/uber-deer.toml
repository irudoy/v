note = [
    """
Bounded 7mfk entries 00054d06, 00054bdc and 00054c0e execute the accepted \
lookup, zero-lead-delta selection and negative-lead-delta clear. The direct \
lookup requires slot 0..5 and uses ROM8[00022695+slot]. Zero-delta selection \
clears the pending byte, computes next = cursor+1 for unsigned cursor <5 and \
0 otherwise, and accepts only slot==next; acceptance updates cursor and the \
pending mask. Negative-delta entry clears only the pending byte. Full \
unsigned cursor and slot contexts do not imply service reachability. Earlier \
mode exits, positive-delta catch-up, other calls, complete sequencer \
execution and MMIO retain separate evidence.""",
    """
The complete natural 00054a44 dispatcher executes its real selector, \
one-shot and programmer calls. The enabled entry follows the optional \
trigger setup. Equal lead accepts only the next cursor matching the staged \
slot; negative lead clears pending. Positive lead accumulates the exact ROM \
masks across every advanced cursor, updates queue/history, calls mode3 \
selection and one-shot, then publishes the final slot mask. The programmer \
argument is 4*unsigned8[ffff2333] or52 underffff4251.bit0 and wraps in the \
callee. All register state,192 frame bytes,64k RAM and declared alias \
neighbors are checked. Producer reachability and physical event timing are \
not inferred.""",
]

