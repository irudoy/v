summary = """
Multipurpose bitfield. Bit 0 is an alternate enable input to FUN 000bc9e4 \
and forces scheduled value 1000 in ATU-II one-shot scheduler 0002c13c. \
Within P030, coordinator 00082c8a is the only bit-6/7 writer. Its successful \
common-gate path sets bit 6 and, because stock ROM8[00008afc].bit3 is set, \
also sets bit 7. Every failed prerequisite clears both bits. Bit 7 gates \
snapshot matching, auxiliary monitor state, detection-core accumulation, a \
five-channel helper, and all three revolution windows. FUN 000c2152 reads \
bit 0 at 000c215a (tst #1; bf) and drives the fixed 60/50 percent exhaust \
test fractions while it is set and the computed duty words while it is \
clear; FUN 000cd75c clears bit 0 at 000cd76e while programming the ATU-II \
channel-7 cycle registers. Memory task 000cd85c is the only setter of bit 0: \
it executes or #1 at 000cdd4e (cmp/eq #3 at 000cdd40) for request 3 of \
manufacturer diagnostic service 0xa0, whose handler 000306f8 copies the \
request byte ffff8005 into ffff40be at 000309ca and sets pending flag \
ffff41de bit 0 at 000309d6; scheduler task 0002e8d2 runs the memory task \
with that request while the flag is set."""
note = [
    """
A whole-program p-code pass found 81 exact byte accesses and no unresolved \
candidates. Mask inspection found 20 writer functions; the other 19 writers \
modify only bits 0..5. The five external bit-7 readers listed here are \
exhaustive. When bit 7 is clear, the coordinator and consumers reset their \
P030 working state; FUN 000872d0 resets all three revolution counters.""",
]
level = "code"
unit = "bitfield"

