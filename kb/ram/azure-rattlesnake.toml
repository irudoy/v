summary = """
Engine speed in RPM*0.64 counts. While ffff417f bit 5 is clear, FUN 000385bc \
writes floor(12000000/(ROM8[0x88fb]*ffff22d4)) through unsigned divider \
00021ce0; while it is set, it writes zero."""
note = [
    """
With ROM8[0x88fb] = 3 and ffff22d4 = 6250000/RPM counts, the quotient is \
4000000/ffff22d4 = 0.64*RPM.""",
]
level = "code"
unit = "rpm*0.64"

