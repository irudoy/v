summary = """
Signed BFS rate correction produced by the 7mfk Base Fuel Schedule producer. \
Under its combined enable, diagnostic, latch, and timer conditions it is \
sat_s16(floor((uint16(ffff1dee)-uint16(ffff1e06))*ROM8[0000865a]/64)); \
otherwise it is zero. The natural helper performs six arithmetic right \
shifts, including its return delay slot. The producer stores the correction \
word and retains it in R7 for the following limiter; the limiter \
sign-extends the cached word and does not reread ffff1060."""
level = "code"
unit = "BFS delta raw"

