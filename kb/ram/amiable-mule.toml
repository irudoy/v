summary = """
Previous-pass image of selected raw-temperature byte ffff1076. After the 69 \
entries of periodic table 00021834, dispatcher FUN 000209d8 copies \
ffff1072..ffff1079 to ffff107a..ffff1081 through block-copy helper 00022558 \
at 00020cba. FUN 000394b8 reads it on the hold branch of selector 0003967a, \
so the selected byte keeps its last coolant selection. Startup initializer \
FUN 00027c50 and clear services FUN 0002fc24 and FUN 00034b70 zero the byte \
inside their RAM spans."""
note = [
    """
The helper writes through its destination pointer, so the byte has no \
literal-address store. The zero of RAM initialization is replaced at the end \
of the first pass. The selector takes coolant once on that pass, before the \
hold branch first reads the image.""",
]
level = "code"
unit = "degC+50"

