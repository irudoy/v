summary = """
Engine-speed word RPM*5.12. FUN 00038272, reached from 00038260, stores \
floor(32000000 / ffff11fc) at 0003829c through unsigned divider 00021ce0 \
from the 3.2 us event interval; FUN 000384fe forms RPM/50 byte ffff11e6 as \
min(255, ffff1196 >> 8), which scheduler 00020dfe copies to ffff11ae."""
note = [
    """
The constant 32000000 = 6250000 * 5.12 binds the 3.2 us count (312500 counts \
per second, three events per revolution) to 5.12 units per RPM. The on-car \
CAN engine speed confirms ffff11e6 = RPM/50.""",
]
level = "code"
unit = "rpm*5.12"

