summary = """
Engine-speed word RPM*5.12. With ffff417f.bit5 clear and a nonzero 32-bit \
unsigned event interval, FUN 00038272 stores \
min(65535,floor(32000000/ffff11fc)) through unsigned divider 00021ce0. Bit 5 \
set selects zero without calling the divider. A zero interval returns zero \
and records 0x44e at ffff9818. FUN 000384fe forms RPM/50 byte ffff11e6, \
which scheduler 00020dfe copies to ffff11ae."""
note = [
    """
The constant 32000000 = 6250000 * 5.12 binds the 3.2 us count (312500 counts \
per second, three events per revolution) to 5.12 units per RPM. The on-car \
CAN engine speed confirms ffff11e6 = RPM/50.""",
]
level = "code"
unit = "rpm*5.12"

