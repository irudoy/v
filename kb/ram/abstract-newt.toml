summary = """
Exact UDS DID 0x130D ASCD status byte. FUN 000cf020 packs output bit 3 from \
stable switch code bit 3, bit 2 from code bit 4, bit 1 from code bit 1, and \
bit 0 from ffff41ae bit 7."""
note = [
    """
Homologous measured diagnostics identify bits 3, 2, 1, and 0 as SET, RESUME, \
CANCEL, and the MAIN (cruise on/off) switch. Bit 0 follows the MAIN switch \
while it is pressed, as the factory data monitor item MAIN SW does. Other \
packed bits are not assigned a physical name here.""",
]
level = "code"
unit = "bitfield"

