summary = """
Coolant-selected exhaust-VTC target byte before conditioning. FUN 000bfe88 \
writes it at 000c055c from the cold/fallback and warm/main bytes ffff1c5f \
and ffff1c5d and compares it with ROM8[00008dcb]+128 to form demand flag \
ffff24a7 bit 3. Initializer FUN 000bced0 writes its reset value."""
note = [
    """
Stock entry threshold is 142 counts, with hysteresis 2 while the demand flag \
is set. The slew stage at 000c045a..000c04b4 bounds the increase of the \
conditioned byte over the previous ffff1c90 to ROM8[0000830a]=4 times \
ffff11c0 while ffff2482 bit 1 marks a byte at or above previous-pass value \
ffff125a, and to ROM8[000084f3]=20 times ffff11c0 otherwise; the step is \
stored to ffff1995. Captured override ramps of 4 counts per tick correspond \
to ffff11c0=1.""",
]
level = "code"
block = "cvtc_exhaust/block"
unit = "centered_u8"

