summary = """
Scheduler snapshot of injector opening time ffff2436, produced by the \
140-byte ffff23bc -> ffff2330 copy in 00020dfe. ATU-II one-shot scheduler \
0002c13c selects it per channel when ffff22e0 or ffff1935 contains the \
channel bit, and subtracts it from the selected word when the DSTR start bit \
is already set. FUN_00054d3e fills the whole duration array with it while \
the engine is stopped or fuel is inhibited."""
note = [
    """
One count is 10 us. Substituting the opening time for an inhibited channel \
commands a pulse that delivers no fuel.""",
]
level = "code"
unit = "ms*100"

