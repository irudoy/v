Scheduler snapshot of injector opening time ffff2436, produced by the \
140-byte ffff23bc -> ffff2330 copy in 00020dfe. Enabled one-shot scheduler \
0002c13c selects this unsigned16 word for every selected channel when the \
whole incoming mask intersects ffff22e0 or entry history ffff1935. It \
subtracts this word with floor0 when the selected channel already has its \
DSTR bit set. FUN_00054d3e also selects it under its independently checked \
override conditions."""
note = [
    """
One count is 10 us. Substituting the opening time for an inhibited channel \
commands a pulse that delivers no fuel.""",
]
