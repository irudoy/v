summary = """
Unsigned auxiliary MAF contribution read by FUN 0003b224, combined-MAF \
producer 0003b252, and total-MAF producer 0003b27e. Startup initializer \
00027c50 clears it as part of [ffff1000,ffff261c). A whole-program p-code \
scan found these three reads and no direct or computed-address writer. A \
direct-reference audit of DMAOR and all four DMAC channel register blocks \
found no recovered transfer covering this word; the only recovered complete \
setup writes ADC2 bytes to ffff86cc..ffff87cb."""
note = [
    """
It remains zero in the recovered normal application-code and statically \
recovered DMAC configuration. Static analysis cannot exclude an unresolved \
computed peripheral access, external bus master, execution outside the \
analyzed application, or establish the physical meaning.""",
    """
On 7mfk, the combined-MAF consumer reads ffff2368 as a word and explicitly \
zero-extends it before a wrapping 32-bit addition. Independent execution \
covers 0x8000 and 0xffff as positive additions. The absence of a recovered \
application writer and the physical meaning retain their existing \
uncertainty.""",
]
level = "code"
unit = "raw MAF correction"

