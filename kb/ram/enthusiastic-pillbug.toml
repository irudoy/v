summary = """
Ten-bit SH7058 AN4 sample written as ADDR4>>6 by FUN 00028098. It is the \
sole input to the bank-1 diagnostic publisher FUN 0003c408 and is copied \
separately to ffff1a3e."""
note = [
    """
The SH7058 manual maps ADDR4 to AN4 at MCU pin 90/H18. Exact DID 0x1204 \
establishes MAF bank 1 in firmware; physical continuity from the ECM \
terminal to the MCU pin requires bench verification.""",
]
level = "code"
unit = "ADC counts"

