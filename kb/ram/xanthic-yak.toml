summary = """
Vehicle-speed fuel-cut state byte. Natural 0004f19c preserves all bits other \
than bit0. Inclusive activation is raw93, exclusive release raw91. A newly \
armed stock zero delay permits immediate activation with the RPM gate clear; \
an already armed nonzero counter waits. An active RPM gate clears bit0 \
independently of the arm. Physical conversion and the global coordinator \
retain separate evidence."""
note = [
    """
Candidate conversion places the entry/release thresholds near 186/182 km/h; \
hardware validation remains required.""",
]
level = "code"
unit = "bitfield"

