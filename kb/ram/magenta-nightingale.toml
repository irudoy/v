summary = """
Per-bank fault counter of the P0078/P0084 magnet retarder circuit pair \
(ffff3596 + b). FUN 00090642 increments it with saturation while a driver \
status byte of the bank equals 1 during a zero-duty evaluation, zeroes it \
otherwise, sets result ffff358d bit b at ROM8[00008b00]=10, and sets judged \
latch ffff3584 bit b at ROM8[00008b02]=100. Reset helper 0008fc6a zeroes \
it."""
