summary = """
Exhaust-VTC target byte after the standstill override stage of FUN 000bfe88, \
stored at 000c01f4: ROM8[00008e36]+128=168 while ffff246c bit 1 is set and \
cancel latch ffff2478 bit 4 is clear; 128 on the pass after the predicate \
falls (prior-cycle copy ffff246f bit 1) or while the latch is being set; the \
previous value while the latch holds; otherwise the coolant-selected map \
byte from ffff137a. It feeds the 190-count limiter and the slew stage before \
ffff1c90."""
note = [
    """
On the 2026-09-17 captures of a Map 3 image with neutral surfaces the byte \
reached 168 in eight standstill excursions, each starting as the engine \
passed 1800 RPM at rest.""",
]
level = "code"
unit = "centered_u8"

