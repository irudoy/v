summary = """
Packed hardware and computed-input state. FUN 00038618 writes bit 2 from \
SH7058 PHDR bit 4 with active-low polarity; the port bit is the park/neutral \
position input, so bit 2 set means P/N position switch OFF. FUN 00038d44 \
mirrors computed START SIGNAL ffff4185.bit6 into bit 1."""
note = [
    """
The bit-1 identity follows from the exact DID 0x1302 START SIGNAL chain. \
PHDR bit 4 is MCU pin 67/B19. The switch identity follows from the DID \
0x1302 bit 2 P/N POSI SW chain through ffff4217 bit 1; the ECM terminal \
remains unresolved.""",
]
level = "code"
unit = "bitfield"

