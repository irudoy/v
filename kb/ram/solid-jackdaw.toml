summary = """
Final corrected EVAP leak-monitor result word. FUN 000b2096 writes \
sat_u16(uint8[ffff2f8d] * uint16[ffff3018] * uint8[ffff2f94] >> 14). FUN \
000b2838 and FUN 000b29b8 consume its high byte. The exact P0442 branch \
dispatches when that byte is at or above ROM8[0x880c]=0xff under its \
operating gates; P0456-associated branches call the complementary state \
updater with descriptor index 0xd8."""
note = [
    """
The producer arithmetic and P0442/P0456 monitor use are exact. No direct \
P0456 fault-dispatch call was found. Factory Service 06 publishes homologous \
leak-area results in 1/128 mm2, but no conversion trace binds that unit to \
this internal word.""",
]
