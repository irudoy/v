summary = """
Bank 1 MAF contribution longword ffff1df8 on 7mfk. Active mode stores a \
nonnegative result capped at 0xffffff from unsigned filtered input ffff1df0, \
a clamped word base, signed correction state, and carried residual. Fallback \
mode uses a low-32-bit weighted product of reference ffff1e10, publishes a \
capped contribution and base word, and preserves correction and residual \
states. The combined-MAF consumer interprets the longword as signed."""
note = [
    """
The MAF and bank identity are code-proven; the individual correction terms \
and engineering scale remain unresolved.""",
    """
The active formula in the chain applies with ffff2462.bit0 set, both \
inhibitor bits clear, selected latch zero, and base plus scaled correction \
v>=0. If v<0 the output is zero even when v+e is positive; otherwise a \
negative v+e also selects zero. Those zero paths carry v+e as the residual. \
A nonnegative v+e clears the residual even if the output is capped. The \
final magnitude is capped at 65535, with zero represented as nonnegative. \
Intermediate signed 24-bit clamps and the active output cap execute through \
explicit post-base contexts, not a claim that ordinary word inputs reach \
them. Full-entry wide fallback references and changed fixture weights \
similarly establish software boundaries without live reachability.""",
]
level = "code"
unit = "raw MAF contribution"

