summary = """
Previous Base Fuel Schedule sample. Scheduler 00020dfe copies ffff1024 here \
immediately before refreshing ffff1024 from ffff1026. In the \
ROM8[00008d92].bit3-clear branch of 00051a98, current minus previous is \
compared with ROM8[000087fd]<<3."""
note = [
    """
Stock JK08A has ROM8[00008d92].bit3 set, so the positive Base Fuel Schedule \
delta comparison and its ffff1220 writer do not execute. The raw/2048 ms \
conversion remains a hardware-validation target.""",
    """
Independent 7mfk scheduler-slice execution binds the exact old-current word \
store at 00020f0c before the current-word refresh at 00020f14. The 16-bit \
snapshot preserves the high bit and the newest source word. Physical \
conversion, stock delta-comparison mode, and hardware validation remain \
unchanged.""",
]
