channel c only on its selected mode branch. The executable domain is 1 <= c \
<= 6; 00049ffc contains no channel guard. The lookup proof does not assign \
physical channel identity or live mode reachability.""",
    """
Independent 7mfk execution of 00054a64..00054ac6 uses explicit incoming \
R2=255, R5=ffff8510, R14=ffff4555 and GBR=ffff1ff4. The six-cylinder domain \
is 1 <= c <= 6, with full unsigned lead, flags, counter and history bytes. \
Bit5 selects lead ffff2364 or constant 3. A negative difference gets one \
addition of 6 before uint8 storage; c=1, lead=7 and bit5 set store 255. For \
a given c, modulo-6 and a slot in 0..5 hold when selected lead <= c+5; \
selected lead <= 6 covers all six c values. The counter saturates at 255 and \
history ORs 1<<(c-1). Prologue, tail, upstream producer bounds, live \
scheduling and hardware reachability retain their separate evidence. Only \
four RAM literal aliases and the declared incoming RAM base registers are \
simulator substitutions.""",
]

