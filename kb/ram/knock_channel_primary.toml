summary = """
Engine-event cylinder number 1..6 written by 00028ea2, 0002b768, and \
00099a48. Tooth 7 of the crank signal plate copies identified cylinder \
ffff13c8 into it; that tooth is 110 degrees before compression TDC of the \
cylinder in the firmware coordinate of ignition command 110 - advance. IMI4D \
handler 000c2d76 updates the bank-1 exhaust-cam edge phase ffff1200 only for \
values 1, 3, and 5, and IMI4C handler 000c2c58 updates the bank-2 phase \
ffff1201 only for values 2, 4, and 6."""
note = [
    """
Misfire attribution fixes the identity: the interval tested by detection \
core 00085a70 lies on the expansion stroke of index c - 3 and is charged to \
cylinder number ROM8[0002265c + c] = c + 3 modulo six, which reports \
P0301..P0306 by that number. The index advances 1-2-3-4-5-6, the firing \
order, and odd values are bank 1. The mechanical offset between the sensor \
and the plate remains a hardware boundary.""",
]
level = "code"
unit = "cylinder number 1..6"

