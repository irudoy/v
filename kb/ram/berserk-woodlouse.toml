summary = """
Second wrap-corrected engine-event interval divided by 32, in 3.2 us counts. \
00028b5c computes it from the same capture ffff185c under the same gates as \
00028af8 computes ffff11fc, with previous-capture cells ffff84d0 and \
ffff84cc that only these two samplers update, and 0002b768, 0002c648, and \
00099a48 store one value to both words. The word therefore equals ffff11fc, \
6250000/RPM counts over 120 crank degrees. FUN 000385bc divides 12000000 by \
three times the word."""
note = ["One count is 3.2 us (phi'/32 with PSCR1 = 1)."]
level = "code"
unit = "normalized timer counts"

