summary = """
Unsigned state-weighted inverse-weight term in the P0128 model. FUN 000b7a3c \
derives temperature-difference base B, parameter-ratio coordinate q, inverse \
map weight w, and four-state coefficient K, then writes \
K*floor(H*floor(B*w/255)/2500). FUN 000b6b5a is the only reader and adds \
this term to ffff2f98 with uint32 saturation into ffff3224."""
note = [
    """
The whole-program exact xref projection has one writer and one reader. Stock \
ROM8[00008a30] is zero, so B and ffff3228 are always zero in JK03A and \
JK08A. The physical heat-transfer interpretation remains unresolved.""",
]
level = "code"
unit = "P0128 model raw"

