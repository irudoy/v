summary = """
Multipurpose misfire status byte. Reporter 00084cd0 sets bit 2 when group 0 \
is captured and bit 0 when group 1 is captured. Its odd-argument path clears \
each marker when it clears that group's retained payload."""
note = [
    """
The claim is limited to group-retention markers in bits 2 and 0. Other bits \
and uses remain unassigned.""",
]
