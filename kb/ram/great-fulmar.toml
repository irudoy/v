summary = """
CAN parallel actual-torque word for frame 0x160 byte 1 bits 3..0 and byte 2. \
FUN 00079e70 writes 4095 while ffff4221.bit2 is set and otherwise \
clamp(trunc0(x/5)+800, 0, 4094) with x=max(min(s16[ffff23a8], \
s16[ffff2382]), s16[ffff2374]), the scheduler latches of ffff2434, ffff240e, \
and ffff2400."""
note = [
    """
A moving-load vehicle capture equals word ffff3f96 outside gear changes and \
stays above it during them.""",
]
level = "code"
unit = "CAN torque count"

