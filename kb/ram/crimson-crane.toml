summary = """
Bit 6 is the intake-CVTC operating bit that FUN 000bd20a writes at 000bd9d6: \
it holds with intake electrical enable ffff248b bit 1, the pedal off its \
idle position, 900 RPM, and the coolant ceiling and latch-selected floor, \
and whenever idle-source bit ffff24a7 bit 1 is set. While it is clear, FUN \
000bdc66 writes neutral 0x80 to intake target ffff2326 unless ffff248b bit 1 \
and IOLID 0x19 active-test bit ffff41fa bit 0 are both set. Bit 6 also \
selects the centered two-bank multiplier path in FUN 00055098. Set uses \
lookup 00012ede indexed by min(u8[ffff2442],u8[ffff2443]); clear substitutes \
raw 64 in the same factor slot."""
note = ["Code proves the producer and both consumers."]
level = "code"
unit = "bitfield"

