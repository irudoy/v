summary = """
First admitted-revolution counter in the misfire monitor. FUN 000872d0 \
compares it with 200*ROM8[00008354], which is 200 in stock JK08A, resets it \
on completion, and sets ffff4241 bit 5. It increments with ffff40a0 when the \
common readiness gates pass and ffff444d is zero."""
note = [
    """
Failure of ffff4251.bit7 or ffff41d2.bits0/1 resets the counter. Qualified \
rotational-reference sample count ffff3834 below 31 and nonzero ffff444d \
freeze it.""",
]
level = "code"
unit = "engine revolutions"

