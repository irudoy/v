Reload source of tick-flag byte ffff84c4: scheduler 00020dfe loads it at \
00020eec and stores it into ffff84c4 at 00020ef0. The export holds only \
reads of the byte (000209d8, 00020dfe)."""
note = [
    """
With no writer in the export the byte holds its initialization value, so \
ffff84c3 carries bit 7 from the base tick on every pass.""",
]
