title = "Coil dwell angle in crank degrees"
summary = """
Coil dwell angle in crank degrees, held as the periodic snapshot of \
ffff2406. FUN 00020dfe copies 0x8c bytes from ffff23bc to ffff2330, mapping \
offset 0x4a to this byte. Producer 0004c1e4 bounds it to 0..114. Reader \
0004e080 derives the GR11B reset-edge command offset as 120 minus this \
angle, and 0002af38 maintains that edge before the following spark. The \
spark-cut wrapper reads this angle to guard the successor dwell start."""
note = [
    """
The APC reset-offset snapshot describes the role of the same coil \
dwell-angle byte. The 2026-11-03 vehicle evidence supports its unit through \
angle * 1000 / (6 * RPM), which converts it to dwell time in milliseconds; \
the actual coil-terminal voltage and electrical pulse duration are not \
measured.""",
]
level = "code"
unit = "deg crank"

