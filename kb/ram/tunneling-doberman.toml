summary = """
Crank tooth counter 0..9 of the crank signal plate. The ICI0A handler \
prologue at 00028ea2 increments it with saturation on every tooth and \
restarts it at zero on the tooth after gap detection, so tooth 7 is the last \
tooth before the two-missing-teeth gap and teeth 8, 9, and 0 follow it at \
30, 40, and 50 crank degrees. FUN 00028ea2 dispatches values 0, 4, 6, 7, 8, \
and 9; tooth 9 carries the misfire ICR0A interval path. FUN 00028dc8, FUN \
0002a36a, FUN 0002a5cc, FUN 0003e04e, FUN 000c2c58, and FUN 000c2d76 read \
the same counter in timer scheduling, capture arithmetic, or phase \
conversion."""
note = [
    """
The writer addresses the byte as offset 0x126 from window base ffff128c held \
in a register, inside prologue 00028ea2..00029587 that lies outside the \
function boundaries of the structure export. Gap detection compares 64 * \
previous interval / current interval with ROM8[00008c89] = 118 once the \
count reaches ROM8[00008c81] = 8, or ROM8[00008c82] = 8 after sync; the \
ratio is 192 on tooth 9.""",
]
level = "code"
unit = "crank tooth 0..9"

