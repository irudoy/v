summary = """
Unsigned P0128 temperature-difference term. FUN 000b7768 writes \
floor(d*floor(lookup_u16(00014b0a)*ROM8[00008543]/256)/256), where d is the \
nonnegative model-temperature-minus-IAT difference in 0.01 deg C units. FUN \
000b6b5a is the only reader and adds the term to ffff2d00 with uint32 \
saturation into ffff3220."""
note = [
    """
The whole-program exact xref projection has one writer and one reader. Every \
stock cell of 00014b0a is zero, so this term is always zero in stock JK03A \
and JK08A.""",
]
level = "code"
unit = "P0128 model raw"

