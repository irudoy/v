summary = """
Work-support idle adjustment (CONSULT TARGET IDLE RPM ADJ) written by \
000420b8 while ROM8[0x870e].bit0 is clear: zero with ffff41b9.bit0 set, \
unsigned min(ffff3168, 20) with ffff41ef.bit3 set, the automatic step of \
ffff10da with ffff41ef.bit4 set, and otherwise ffff316a when it is at most \
20 and zero when it is larger. The same function raises its idle aggregate \
to at least min(255, ffff56f6+ROM8[0x12754]=44)."""
note = [
    """
Scheduler 00020dfe copies it to ffff5690, which DID 0x112e publishes. The \
homologous profile scale of 12.5 rpm per count gives the 20-count limit as \
250 rpm; the unit of the idle aggregate is not code-proven.""",
]
level = "code"
unit = "count"

