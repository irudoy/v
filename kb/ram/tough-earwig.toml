summary = """
Current engine speed. FUN 000384fe forms current byte ffff11e6 as min(255, \
ffff1196>>8), and scheduler 00020dfe copies it to ffff11ae. It is the shared \
axis input of the X-wrapper for the ignition, AFR-power, and lambda 16x16 \
families."""
note = [
    """
The rpm/50 unit converges across three independent RPM axes and the 7500 RPM \
cut. The common ffff1196 producer also establishes the exact relative RPM/25 \
and RPM/12.5 representations at ffff11b3 and ffff11f4.""",
]
level = "code"
unit = "rpm/50"

