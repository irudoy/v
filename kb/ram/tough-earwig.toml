applicability = "homologous_vq35hr"
scope = "exact-code"
priority = 90
level = "code"
note = """
Code establishes the current-engine-speed quantity and native RPM/50 \
representation. The DATA MONITOR name and behavior come from the VQ35HR \
factory manual and remain homologous for JK08A."""

