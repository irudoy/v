summary = """
Third normalized output of FUN 0007af78. It equals 800 when endpoint span \
max(0,U-L) is zero; otherwise it is \
min(800,floor(max(0,32768+int16[ffff3396]-L)*800/span))."""
note = [
    """
Both stock endpoint curves are zero, so span is zero and this word is \
exactly 800. FUN 0007ae80 applies it as the upper bound after the two lower \
bounds.""",
]
level = "code"
unit = "normalized raw 0..800"

