summary = """
Unsigned Q7-compensated quarter-BFS word on 7mfk. Stock primary and fallback \
paths provide cached quarter BFS in R6; the consumer forms \
uint32(R6*uint8(ffff1160)), shifts logically by seven, and caps the result \
at 65535 before storing ffff1062. Other consumers use four times this value \
as a comparison width or tolerance."""
note = [
    """
The operational role and relationship to the Base Fuel Schedule producer are \
exact. Its standalone physical unit is not assigned.""",
    """
The chain formula describes coherent cache/RAM quarter BFS. The independent \
consumer also executes deliberately mismatched cached R6 and RAM, wide \
cached-product wrap, neutral 128, zero and maximum byte coefficients, and \
word saturation. Those explicit contexts do not assert a concurrent RAM race \
or live-state reachability. The selected primary and Q7 slices preserve the \
source words, coefficient, flags, neighboring RAM, and fixed ROM \
coefficients.""",
]
