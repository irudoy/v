summary = """
Live producer byte sampled by scheduler 00020dfe into current snapshot \
ffff2458. FUN 0006efbc is the only whole-program writer found for bit 5 and \
derives that upstream DFCO mode/eligibility bit from two Boolean gate \
groups. FUN 0002e0d4 publishes bit 5 as bit 0 of DID 0x1302 response byte \
ffff3342."""
note = [
    """
Other functions read or modify other bits of this shared byte. A structured \
Nissan profile names DID 0x1302 bit 0 CLSD THL POS, and the VQ35HR factory \
manual defines CLSD THL POS as the idle position computed by the ECM from \
the accelerator pedal position sensor signal.""",
]
level = "code"
unit = "bitfield"

[[diagnostic]]
id = "closed-throttle-position-did-1302-bit0"
kind = "runtime_value"
label = "DiagnosticParameter"
key = "diagnostic-parameter:semantic:cid-1302h-bit0-clsd-thl-pos"
claim = {label = "ParameterDefinition", id = "ecudocs-p32m-997c5a9:data:cid-1302h-bit0-clsd-thl-pos-d848fad4"}
applicability = "nissan_family_candidate"
scope = "exact-code"
priority = 100
level = "code"
note = """
FUN 0006efbc is the only whole-program writer of ffff2459.bit5. FUN 0002e0d4 \
packs that bit into ffff3342.bit0, and the exact JK08A service-0x22 table \
publishes ffff3342 as DID 0x1302 with support mask 0x3f. A structured Nissan \
profile names bit 0 CLSD THL POS. The VQ35HR factory manual defines CLSD THL \
POS as the idle position computed by the ECM from the accelerator pedal \
position sensor signal."""

