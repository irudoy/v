summary = """
Final six-channel fuel-output inhibit/override mask written at \
periodic-table index 28 by 0004ed88. Exact order is \
P=global_3f|DFCO_mask|count_mask, R=runtime_replacement when active else P, \
then ffff22e0=(R|auxiliary_mask)&0x3f. FUN 00052034 blocks corresponding \
ffff1220 eligibility bits, FUN 0004eba2 selects override ffff2436, and \
0002c13c substitutes fallback ffff23aa."""
note = [
    """
Main and stationary RPM cuts each make the global term 0x3f. Runtime \
replacement can substitute global/DFCO/count bits; the auxiliary mask is \
ORed afterward. The request limiter rooted at 0000942c is outside this \
formula.""",
]
