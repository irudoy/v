summary = """
Bank-1 A/F adjustment integrator state in 000a0ee8, a signed word: each \
update adds the unsigned up step ffff97a4 (map 0x1462a on selector 2), \
subtracts the unsigned down step ffff97a0 (map 0x1463a on selector 2), \
saturates to signed 16 bits, bounds the result to -500..500 with signed \
compares, and publishes it as exact DID 0x1249."""
note = [
    "The -500..500 bounds limit the candidate factor to -1..1.",
    """
Structured Nissan diagnostics identify DID 0x1249 as A/F ADJ-B1. The code \
fixes the signed count range; public sources disagree on the scale, so the \
physical conversion remains unresolved.""",
]
level = "code"
width = 16
unit = "ratio"
scale = "x*0.002"
scale_level = "candidate"

