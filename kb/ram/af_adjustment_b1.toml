update adds the unsigned up step ffff97a4 (map 0x1462a on selector 2), \
subtracts the unsigned down step ffff97a0 (map 0x1463a on selector 2), \
saturates to signed 16 bits, bounds the result to -500..500 with signed \
compares, and publishes it as exact DID 0x1249."""
