summary = """
Scheduler snapshot of engine-speed word ffff1208 in RPM/3.125 counts. \
Scheduler 00020dfe copies the 56-byte block ffff11d4..ffff120b to ffff119c, \
which places ffff1208 at offset 0x34. FUN 0003de4c reads it as the source of \
trustful row coordinate ffff1cca."""
note = [
    """
The same copy places ffff11ee, the RPM/3.125 word of the primary path, at \
ffff11b6.""",
]
level = "code"
unit = "rpm/3.125"

