summary = """
Step counter of the engine-coolant fail-safe ramp. FUN 000395ae clears it \
while ffff2451 bit 5 is clear. While the bit is set, every expiry of \
countdown ffff24f7 increments it with saturation at 255 and reloads the \
countdown with 6. The substitute coolant byte is min(90 + counter, 130)."""
note = [
    """
Periodic handler 0002040c decrements countdown array ffff24d4..ffff24f8 \
every 1000 base interrupts, or 1.024 s at the 10.24 ms scheduler pass. Forty \
steps take 245.8 s and move the substitute from raw 90 to raw 130. The \
factory fail-safe table gives 40 deg C at ignition ON or START and 80 deg C \
after about four minutes, which is deg C = raw-50 at one deg C per count.""",
]
level = "code"
unit = "6.144 s steps"

