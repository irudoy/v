summary = """
Transmission-transition hold byte used by FUN 00077892. The function writes \
stock ROM8[0x8b07]=0x1e only on the same branch that sets ffff4252.bit1 and \
otherwise tests the retained byte while recomputing ffff41a6.bit3. The byte \
lies in the 10.24 ms block ffff43c7..ffff4489 that FUN 0002040c decrements \
while nonzero, so it keeps bit 3 set for 30 passes, 307.2 ms, after the last \
bit-1 pass."""
note = [
    """
A whole-program p-code census found only this writer and reader on the \
selected implementation, plus their alternate-implementation counterparts; \
the decrement of FUN 0002040c reaches the byte through its block pointer. \
Startup clears the byte. The 2026-09-22 road captures show the hold as \
passes up to 0.306 s after the last TCM status-3 frame in which ffff19c6 \
stays below the pre-limiter request.""",
]
level = "code"
unit = "raw state"

