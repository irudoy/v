summary = """
Wrap-corrected engine-event interval divided by 32, in 3.2 us counts of the \
phi'/32 ATU-II clock. Producers 00028af8 and 0002b768 update it; APC paths \
use it as event-timing state, and FUN 00038272 publishes ffff1196 = 32000000 \
/ ffff11fc at 00038282, the RPM*5.12 engine-speed word, so the interval is \
6250000/RPM counts and spans 120 crank degrees (three engine events per \
revolution)."""
note = [
    """
The 3.2 us count follows PSCR1 = 1 (phi' = Pphi/2 = 10 MHz with Pphi = 20 \
MHz from CAN timestamps) and TCR1A = 5 (phi'/32); the 120-degree span \
follows the RPM/50 identity of ffff11e6 = ffff1196 >> 8 confirmed against \
the CAN engine speed on the car.""",
]
level = "code"
unit = "normalized timer counts"

