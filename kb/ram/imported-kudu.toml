summary = """
120-degree engine-event interval in 3.2 us counts. With ffff24c9.bit5 clear \
and ffff25ff zero, 00028af8 subtracts previous 32-bit capture ffff84cc from \
ffff185c, subtracts one more when the current capture is below the previous \
capture, shifts the unsigned result right by five, and sets ffff2465.bit5. A \
nonzero holdoff selects 0xffffffff without changing that marker. Both \
enabled branches refresh ffff84cc from ffff185c; diagnostic bit 5 set \
preserves the interval, previous capture, and marker. Producer 0002b768 \
supplies the fallback interval. Consumer 00038272 forms the saturated \
primary RPM*5.12 word through unsigned division."""
note = [
    """
The 3.2 us count follows PSCR1 = 1 (phi' = Pphi/2 = 10 MHz with Pphi = 20 \
MHz from CAN timestamps) and TCR1A = 5 (phi'/32); the 120-degree span \
follows the RPM/50 identity of ffff11e6 = ffff1196 >> 8 confirmed against \
the CAN engine speed on the car.""",
    """
The normal ICI0A tooth-7 path calls event feeder 000208f8 at 0002983a; the \
feeder calls 00028af8 at 0002090a before decrementing the holdoff counters. \
The arithmetic equation applies to the enabled zero-holdoff nonwrapping \
branch. The wrapping branch uses uint32(ffff185c-ffff84cc-1)>>5.""",
    """
In the measured operating range, the nominal interval is 6250000/RPM counts \
and spans 120 crank degrees, corresponding to three engine events per \
revolution. APC paths use it as event-timing state.""",
]
level = "code"
unit = "normalized timer counts"

