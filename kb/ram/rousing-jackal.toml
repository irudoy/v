summary = """
Previous-pass image of normalized coolant index ffff1077. After the 69 \
entries of periodic table 00021834, dispatcher FUN 000209d8 copies \
ffff1072..ffff1079 to ffff107a..ffff1081 through block-copy helper 00022558 \
at 00020cba. FUN 00038618 uses it as the interpolation input of ROM tables \
0x12ADA and 0x12AEA on two state branches. Startup initializer FUN 00027c50 \
and clear services FUN 0002fc24 and FUN 00034b70 zero the byte inside their \
RAM spans."""
note = [
    """
The helper writes through its destination pointer, so the byte has no \
literal-address store. The zero of RAM initialization is replaced at the end \
of the first pass. Implicit nodes 0,32,...224 of both tables are \
-40,-20,...100 deg C on the normalized coolant scale.""",
]
level = "code"
unit = "normalized coolant index"

