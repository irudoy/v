summary = """
Exact UDS DID 0x124c runtime word written by paired-sensor conditioning FUN \
0003e4cc as 0x0400 minus ten-bit sample ffff363c. Reviewed Nissan \
diagnostics identify the parameter as TP SEN 2-B2 voltage."""
note = [
    """
The complement inverts the sensor about the 1024-count full scale, which is \
5.12 V at 5 mV per count; the factory criteria for the paired sensors, more \
than 0.36 V on one and less than 4.75 V on the other, span the same 5.11 V. \
The diagnostic display unit is V at 5 mV per count; JK08A.diagnostics.md \
derives that scale.""",
]
