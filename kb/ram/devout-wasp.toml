summary = """
Multipurpose DTC status byte. FUN 000aacc0 controls bit 2 in its calibrated \
complementary P0448 status path. FUN 000ad8fe sets bit 6 for the exact P0441 \
purge-flow result, and FUN 000abca2 consumes and clears bit 6 after \
dispatch."""
note = [
    """
The same byte also participates in hysteresis comparators in FUN 00071448. \
ROM8[0x18700].bit1 is clear, so the P0441 producer and exact dispatch branch \
are skipped in stock JK08A. Individual bit roles must not be generalized \
across those state machines.""",
]
level = "code"
unit = "bitfield"

