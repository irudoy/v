summary = """
Previous-pass snapshot of exhaust-VTC bank-enable byte ffff1246. Scheduler \
00020dfe copies it through the 0x3e-byte block ffff120e..ffff124b -> \
ffff124c..ffff1289 at 00020f7c, so bits 0 and 1 hold the enable state of the \
previous scheduler pass. FUN 000bfe88 reads them as the ffff1c7e arming \
condition, FUN 000c1152 at 000c1320, and FUN 000c2040 at 000c20b2 as the \
condition for copying ffff1aac+2b to ffff1ab4+2b while the bank is disabled, \
which selects the pass on which the enable bit falls."""
note = [
    """
The copy length 0x3e is the delay-slot immediate of the 00022558 call at \
00020f7c and the destination base ffff124c is the pool word at 00021164.""",
]
level = "code"
unit = "bitfield"

