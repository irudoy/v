summary = """
Current coolant snapshot byte produced by FUN 0008092e as \
max(lookup_u8(00012dea, ffff1186)-10, 0). Misfire reporter 00084cd0 copies \
it into each retained operating-point group, and matcher 000847dc requires \
current and retained values to be on the same side of code 110. FUN 00035856 \
returns it for J1979 Mode 01 PID 0x05 at 00035bf8."""
note = [
    """
The same lookup result is exact raw coolant byte ffff1079 with deg C = \
raw-50. Therefore code 0 represents at most -40 deg C; for positive codes, \
deg C = code-40; matcher boundary 110 is 70 deg C. J1979 defines PID 0x05 as \
A-40 deg C, which fixes the same conversion.""",
]
level = "code"
unit = "degC+40"

