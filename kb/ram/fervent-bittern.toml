sat_i16(s16[ffff18d2]-u16[ffff2410]). Scheduler FUN 00020dfe latches it to \
ffff2380 inside the 140-byte copy ffff23bc->ffff2330 at 00021318, and CAN \
packer 00079e70 converts the latch to word ffff3f96 of frame 0x180."""
note = [
    """
FUN 00065e54, entry 96 of the 124-entry periodic table at 0002196c, runs the \
chain 00065b08, 00065cd8, 00065de4, 00065f9c, 00065e2c. This is the static \
path from Engine Torque Map 00010b8e to the CAN frame.""",
]
