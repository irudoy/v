summary = """
Signed timing-state byte written by 0004afdc as \
clamp_s8(s8(ffff1514)+u8(ffff12db)+s8(ffff1511)+u8(ffff1512)+u8(ffff1349)-128). \
The alternate branch of 0004bdc2 consumes it while forming ffff1830."""
note = [
    """
The value reaches the actuator through ffff1830 -> ffff2404 -> ffff2378 -> \
ffff12d6 -> ffff11da -> ffff11d4 with coefficient 1, so one count is one \
crank degree of the J1979 PID 0x0E coordinate. Exact source-selection \
predicates for ffff1511 are recorded in 0004afdc. A matched target-vehicle \
A/B capture shows that default map 00012196 propagates one-for-one into the \
final software timing coordinate during warm deceleration.""",
]
level = "code"
unit = "deg"

