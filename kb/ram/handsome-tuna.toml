descriptor indices 0x84 and 0x85 (P1078, P1084). FUN 00090086 sets the bank \
bit after its debounce of driver status ffff850c; FUN 0008f168 enables the \
helper only while the bit is clear and enable mask ROM8[000186f1] bit 7 or 6 \
is set, and calls dispatcher 0007d8b8 with the index while the bit is set. \
Reset helper FUN 0008fc6a clears it."""
