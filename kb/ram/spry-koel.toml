summary = """
Time of 10 crank degrees, one tooth of the crank signal plate. On the normal \
path the ICI0A handler prologue copies tooth interval ffff22ba into it and, \
with sync set, stores one third of the three-pitch interval on tooth 8. In \
P0335 fallback 0002b768 writes the quotient floor(event_interval/12) of the \
120-degree event interval ffff11fc. Compare schedulers multiply it by the \
command remainder over ten to form compare offsets; capture handlers \
000c2de0 and 000c2c58 read it at 000c2dfa and 000c2cc6 and divide 20 times \
the cam edge interval by it to form the 0.5-degree phase bytes ffff1200 and \
ffff1201."""
note = [
    """
The 10-degree scale follows the 3.2 us clock of the ATU-II captures (TCR1A = \
5 in 0002718a, PSCR1 = 1 in 000274ac), the RPM identity ffff1196 = 32000000 \
/ ffff11fc of 00038272, and the tooth-8 multiplier 0x5555 >> 16.""",
]
level = "code"
unit = "timer count per 10 degCA"

