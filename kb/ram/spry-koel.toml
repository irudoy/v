summary = """
Time of 10 crank degrees, one tooth of the crank signal plate. With \
ffff24c9.bit6 clear, the normal ICI0A prologue copies the 16-bit tooth \
interval ffff22ba; synchronized tooth 8 instead writes \
floor(21845*uint16(ffff22ba)/65536) through the fixed-point multiplier \
0x5555 and a 16-bit right shift. In the reviewed cam-based fallback quotient \
path, a count of at least two and previous capture other than 0xffffffff \
permit unsigned division of the new 120-degree interval by twelve. The \
stores at 0002b81a and 0002b81e keep the low 16 bits of that quotient in \
ffff22bc and ffff22ba. Compare schedulers multiply it by the command \
remainder over ten to form compare offsets; capture handlers 000c2de0 and \
000c2c58 read it at 000c2dfa and 000c2cc6 and divide 20 times the cam edge \
interval by it to form the 0.5-degree phase bytes ffff1200 and ffff1201."""
note = [
    """
The 10-degree scale follows the 3.2 us clock of the ATU-II captures (TCR1A = \
5 in 0002718a, PSCR1 = 1 in 000274ac), the RPM identity ffff1196 = 32000000 \
/ ffff11fc of 00038272, and the tooth-8 multiplier 0x5555 >> 16.""",
    """
The gap normalization approximates one third: a positive multiple of three, \
including 3, produces one count less than exact integer division. The \
ordinary step equation applies to the normal nonsynchronized or non-tooth-8 \
branch. The fallback word boundary is uint16(floor(ffff11fc/12)); the \
quotient uses the new capture interval, not the preceding stored interval.""",
]
level = "code"
unit = "timer count per 10 degCA"

