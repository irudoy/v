summary = """
Multipurpose status byte. In stationary limiter 0004f324, bit 3 marks \
entered timer state, bit 4 marks readiness, and bit 5 is the active \
1800/1500 RPM hysteresis cut. Failure of any stationary entry gate clears \
bits 3..5 together with ffff16a6. In the independent EVAP purge-control \
circuit monitor, FUN 000acc54 controls bits 6 and 7; FUN 000abca2 consumes \
bit 7 as the exact P0443 dispatch condition."""
note = [
    """
Bit 5 becomes global fuel mask 0x3f. The byte is shared by independent state \
machines; the stock P0443 producer branch is skipped because \
ROM8[0x186d7].bit2 is clear.""",
]
level = "code"
unit = "bitfield"

