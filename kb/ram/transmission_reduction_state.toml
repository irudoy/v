note = """
Controller 00096a18 maintains this unsigned word. The conditional direct \
path writes uint8[fffea819]<<8 at 00096a8a; ROM8[00008a7f].bit4 is set and \
ROM8[0000865e].bit6 is clear in the decoded 1ME3B image. Other paths use \
