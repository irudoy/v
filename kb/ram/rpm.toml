summary = """
Current engine-speed word in RPM/12.5 representation. FUN 000384fe writes \
source ffff11f4 = ffff1196>>6, and scheduler 00020dfe copies it here through \
the 56-byte snapshot block. Fuel-cut state machine 0004f282 compares it with \
calibrated activation/release words; misfire reporter 00084cd0 retains it in \
three operating-point snapshots, and matcher 000847dc applies a -30/+30 \
count window."""
note = [
    """
The source word and destination word occupy matching offsets in the exact \
snapshot-copy blocks. The matcher tolerance of 30 counts corresponds to 375 \
RPM.""",
]
level = "code"
unit = "rpm/12.5"

