summary = """
Engine-speed window flags of exhaust-VTC conditioner FUN 000bfe88. Bit 0 \
sets when engine-speed byte ffff11ae reaches ROM8[00008e3b]=36 (1800 RPM) \
and holds until the byte plus ROM8[000086e1]=4 falls below 36 (1600 RPM), \
stored at 000bfee4. Bit 1 follows hysteresis comparator 000259d0: it sets \
when the byte is at or below ROM8[00008e3a]=80 (4000 RPM) and clears above \
80+ROM8[000086e1]=84 (4200 RPM), stored at 000bff14. Both bits are inputs of \
standstill override predicate ffff246c bit 1. Bit 2 is the first-learning \
request of the exhaust valve timing control learning, stored at 000c0a2c as \
settle flag ffff24d3 bit 4 together with learning status ffff5b33 bit 3 and \
cleared at the end of the pass."""
note = [
    """
Bit 0 has no consumer other than the hysteresis at 000bfebe and the \
predicate at 000c0158, so ROM8[00008e3b]=0xff keeps the standstill override \
predicate clear at every reachable engine speed.""",
]
level = "code"
unit = "bitfield"

