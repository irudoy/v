summary = """
Base of a two-byte bank-indexed catalyst-monitor limit array. FUN 000a2ee4 \
writes the interpolated uint8 result of table 0x11fb6, and FUN 000a2f56 \
dispatches P0420/P0430 only when unsigned ffff314d[bank] is below this \
limit."""
note = [
    """
All eight stock table cells are zero, making the unsigned below-limit fault \
branch unreachable in the stock image. The physical quantity and units \
remain unresolved.""",
]
level = "code"
unit = "diagnostic raw"

