summary = """
Unsigned vehicle-speed-selected temperature-difference term in the P0128 \
model. FUN 000b78da applies inverse weight \
255-min(lookup_u16(00014cca),255), two calibrated divisions, and the nonzero \
ffff35a0 parameter before writing this uint32 word. FUN 000b6b5a is the only \
reader and adds it to ffff3228 with uint32 saturation into ffff3224."""
note = [
    """
The whole-program exact xref projection has one writer and one reader. Both \
speed-selected stock coefficients are zero, so this term is always zero in \
stock JK03A and JK08A even though map 00014cca supplies full inverse \
weight.""",
]
level = "code"
unit = "P0128 model raw"

