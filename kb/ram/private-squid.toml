summary = """
Scheduler snapshot of target gear index ffff1087 decoded from the high \
nibble of CAN 0x174 payload byte 3. Values 1 through 7 become zero-based \
indices 0 through 6; zero and values above 7 become zero. Rotational-speed \
request limiter 0007584e uses target > current for recovery tracking and \
auxiliary output, target > gear-phase index ffff1064 for the 30-count \
recovery rate, and min(target,4) for table 0x14384."""
note = [
    """
Passive target transitions show the high nibble changing before the low \
nibble for both upshifts and downshifts, which establishes the target \
role.""",
]
level = "code"
unit = "zero-based target gear index"

