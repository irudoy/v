bank b. FUN 00090086 sets the bit at 000900d2 or 000900f4 while its enable \
is set and clears it at 00090168 (enable clear) or 00090182 (judged latch \
ffff3580 set); reset helper 0008fc6a clears the byte. Scheduler 00020dfe \
copies it to ffff4120 at 0002132c."""
