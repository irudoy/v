summary = """
Load coordinate of builder 00053698: min(255, ((uint16(ffff1024)*R >> 8)*T) \
>> 15), where R is the pressure ratio of ffff517c and T = floor(76288/(b + \
223)) bounded to ROM8[0x83C5]+128..ROM8[0x83C6]+128. Byte b is \
intake-temperature snapshot ffff2733, or ROM8[0x8B51] when 00025e20(0x125) \
is nonzero. It indexes curve 000129e2."""
note = [
    """
With the ECU-declared degC = raw - 50 temperature scale, b + 223 is kelvin \
and T is 256*298/kelvin, 256 at 25 degC; stock bounds 179 and 343 correspond \
to 426 K and 222 K. At R = 256 and T = 256 the coordinate is Base Fuel \
Schedule over 128, 16 counts per millisecond.""",
]
level = "code"
unit = "raw_u8"

