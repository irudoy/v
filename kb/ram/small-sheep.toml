summary = """
Multipurpose state byte whose bit 6 is computed START SIGNAL and whose bit 7 \
is the debounced PLDR bit 4 input. FUN 00038d44 writes bit 6 and mirrors it \
to ffff24ae.bit7 and ffff1164.bit1. Together with battery-voltage raw \
ffff1188, bit 6 drives selected-temperature gate 0003967a; it also inhibits \
AN1-derived running-min update FUN 0003d45c when set. FUN 00038618 clears \
bit 7 in state 1 of debouncer ffff39c4 and sets it otherwise."""
note = [
    """
The exact DID 0x1302 bit-1 chain and homologous diagnostic definition bind \
bit 6 to computed START SIGNAL. The VQ35HR factory manual independently \
states that this signal is computed from engine speed and battery voltage \
and is OFF after engine start.""",
]
level = "code"
unit = "bitfield"

[[diagnostic]]
id = "start-signal-did-1302-bit1"
kind = "runtime_value"
label = "DiagnosticParameter"
key = "diagnostic-parameter:semantic:cid-1302h-bit1-start-signal"
claim = {label = "ParameterDefinition", id = "ecudocs-p32m-997c5a9:data:cid-1302h-bit1-start-signal-d3281df1"}
applicability = "nissan_family_candidate"
scope = "exact-code"
priority = 100
level = "code"
note = """
FUN 00038d44 writes computed state ffff4185.bit6 and mirrors it to \
ffff24ae.bit7. FUN 0002e0d4 packs that bit into ffff3342.bit1, and the exact \
JK08A service-0x22 table publishes ffff3342 as DID 0x1302 with support mask \
0x3f. A structured Nissan profile names bit 1 START SIGNAL. The VQ35HR \
factory manual independently defines START SIGNAL as ECM-computed from \
engine speed and battery voltage and OFF after engine start."""

