claim = {label = "ParameterDefinition", id = "ecudocs-p32m-997c5a9:data:cid-1302h-bit1-start-signal-d3281df1"}
applicability = "nissan_family_candidate"
scope = "exact-code"
priority = 100
level = "code"
note = """
FUN 00038d44 writes computed state ffff4185.bit6 and mirrors it to \
ffff24ae.bit7. FUN 0002e0d4 packs that bit into ffff3342.bit1, and the exact \
JK08A service-0x22 table publishes ffff3342 as DID 0x1302 with support mask \
0x3f. A structured Nissan profile names bit 1 START SIGNAL. The VQ35HR \
factory manual independently defines START SIGNAL as ECM-computed from \
engine speed and battery voltage and OFF after engine start."""

