summary = """
Multipurpose state byte whose bit 6 is computed START SIGNAL and whose bit 7 \
is the debounced PLDR bit 4 input. FUN 00038d44 writes bit 6 and mirrors it \
to ffff24ae.bit7 and ffff1164.bit1. Together with battery-voltage raw \
ffff1188, bit 6 drives selected-temperature gate 0003967a; it also inhibits \
AN1-derived running-min update FUN 0003d45c when set. FUN 00038618 clears \
bit 7 in state 1 of debouncer ffff39c4 and sets it otherwise."""
note = [
    """
The exact DID 0x1302 bit-1 chain and homologous diagnostic definition bind \
bit 6 to computed START SIGNAL. The VQ35HR factory manual independently \
states that this signal is computed from engine speed and battery voltage \
and is OFF after engine start.""",
]
level = "code"
unit = "bitfield"

[[bit]]
bit = 7
name = "pl4_debounced_high"
summary = """
Debounced PLDR bit 4 (fffff75e bit 4). FUN 00038618 clears the bit in state \
1 of debouncer ffff39c4, reached after the pin reads 0 through the countdown \
of 5 at ffff25d5, and sets it otherwise, including a pending low reading. \
Dispatcher 000c3b14 and the receive-age task 000c3994 run only while it is \
set, and FUN 000c34a8 clears every CAN receive age while it is clear. The \
physical input on PL4 is not identified."""
level = "code"

