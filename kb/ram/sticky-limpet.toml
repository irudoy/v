summary = """
Multipurpose state byte. Bit 4 is the settle flag of the exhaust-VTC \
learning stroke, stored by FUN 000bfe88 at 000c0a0a: settle bit ffff247e bit \
0 set together with published target ffff2327 above 128 + ROM8[00008e38] or \
pass counter ffff1c74 at most 2. While the standstill override predicate \
holds it sets override latch ffff2478 bit 4, and it raises the learning \
requests ffff24ab bit 2 and ffff24aa bit 2."""
note = ["Other bits are written by 0008d240, 000bea04, and 000d1ce4."]
level = "code"
unit = "bitfield"

