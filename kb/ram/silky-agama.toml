summary = """
Base ignition angle written by 0004ae6c: a divider-based angle from \
ffff17b8, ffff14dc, ffff1630, ROM8[0x884d]=128, ROM8[0x8b6c]=14, and \
RPM/12.5 word ffff11bc, stored as r-14 when r<0x8e and 127 otherwise. The \
normal branch of 0004bdc2 adds the centered map adjustment and subtracts the \
retard terms from it."""
note = [
    """
One count is one crank degree of the final coordinate ffff11d4 by the \
coefficient-1 chain. The physical meaning of the divider inputs remains \
unresolved.""",
]
