summary = """
Signed common correction added to both per-bank calculations by FUN 0003b224 \
and to combined MAF aggregate ffff1e38 by FUN 0003b252. FUN 0003b320 \
implements exact zero, signed-input, preserve, and piecewise unsigned-input \
modes. Stock ROM8[0x86f9]=0xdc and ROM8[0x8b3f]=0x18 select an unconditional \
zero write on every call."""
note = [
    """
The stock lifecycle and all integer branch formulas are exact. The \
alternative modes' physical meaning and engineering scale remain \
unresolved.""",
    """
On 7mfk, the combined-MAF consumer reads ffff1e2a as a sign-extended 16-bit \
word before a wrapping 32-bit addition. Independent execution covers both \
word sign boundaries and cancellation; these cases do not extend the \
correction writer or its lifecycle proof.""",
]
level = "code"
unit = "raw MAF correction"

