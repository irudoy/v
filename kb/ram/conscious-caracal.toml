summary = """
First-channel published word from FUN 00070e4c. The configurable path can \
select processed word ffff1330, but stock ROM8[000089fb]=0x20 has bit 3 \
clear and therefore always copies source ffff1210."""
note = [
    """
The zero-surface crossfade and local rate-processing result do not reach \
this word in unmodified JK08A. Its physical interpretation remains \
unresolved.""",
]
level = "code"
unit = "scaled first-channel raw"

