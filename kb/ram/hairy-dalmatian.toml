summary = """
Ten-bit SH7058 AN15 sample written as ADDR15>>6 by FUN 00028098. It is the \
sole input to the bank-2 diagnostic publisher FUN 0003c408 and is copied \
separately to ffff1a40."""
note = [
    """
The SH7058 manual maps ADDR15 to AN15 at MCU pin 104/L20. Exact DID 0x1205 \
establishes MAF bank 2 in firmware; physical continuity from the ECM \
terminal to the MCU pin requires bench verification.""",
]
