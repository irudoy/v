note = """
Function 00028098 reads unsigned word ADDR15 at fffff826, performs three \
logical right shifts by two, and stores uint16(fffff826)>>6 as a word at \
ffff1d64 in its RTS delay slot. The six low alignment bits are discarded; \
bank-1 input and neighboring RAM remain independent."""

