summary = """
Bits 0 and 1 are the per-bank flags of FUN 00090bd2, a third P0014/P0024 \
path. With ffff24a7 bit 4 set, conditioned target ffff2327 at 0x80, the bank \
bit of ffff48df set, and duty word ffff1aac + 2b zero, the function sets bit \
b while cam edge phase snapshot ffff11c8 + b exceeds the high byte of \
reference word ffff5578 + 2b by at least ROM8[0000895e]=254 and clears it \
below that; once timer ffff2539 + b has expired it stores record 0xd2 or \
0xd3 through 0008c2d2 and 0007d8b8. FUN 00090e02 clears both bits. Either \
bit blocks exhaust-VTC operating enable ffff248b bit 2 in 000bf630."""
note = [
    """
Family entry 00090e5e calls 00090bd2 only under ROM8[000186f1] bits 3 and 2; \
stock JK08A holds 0xf0, so the function never runs and both bits stay clear. \
The difference is stored in ffff16bd + b.""",
]
level = "code"
unit = "bitfield"

