sole direct writer: zero with ffff41b9.bit0 set, the clamped LID-1 slot \
ffff99dc with ffff424c.bit4 set, the clamped automatic step of ffff10da with \
ffff424c.bit5 set, and otherwise stored adjustment ffff29c6 when it lies \
within -5..0."""
note = [
