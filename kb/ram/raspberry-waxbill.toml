summary = """
Long admitted-revolution counter in the misfire monitor. FUN 000872d0 \
compares it with the literal 1000, resets it on completion, and sets \
ffff4241 bit 7. It increments with ffff409e when the common readiness gates \
pass and ffff444d is zero."""
note = [
    """
Failure of ffff4251.bit7 or ffff41d2.bits0/1 resets the counter. Qualified \
rotational-reference sample count ffff3834 below 31 and nonzero ffff444d \
freeze it.""",
]
level = "code"
unit = "engine revolutions"

