summary = """
Filtered bank 1 MAF word ffff1df0 on 7mfk. With ffff2461.bit5 clear, FUN \
0003a9aa copies unsigned working word ffff1058. With bit5 set, \
f=floor((ROM8[0x870a]*uint16(ffff1058)+(256-ROM8[0x870a])*uint16(previous \
output))/256); stock ROM8[0x870a]=26. If f equals the previous output but \
differs from the input, the function moves one count toward the input before \
storing the word."""
note = [
    """
At input 1000 and previous output zero, five stock weighted calls produce \
101, 192, 274, 347, 413. With the positive stock coefficient 26, a lower \
input gives a weighted result strictly below the previous word, making the \
downward anti-stall branch unreachable from function entry. Explicit \
post-arithmetic entry supplies input, previous, and weighted words plus \
saved GBR/MACL to execute both correction directions without changing \
instructions. The physical bit5 state, scheduler timing, and coefficient \
time constant remain unresolved.""",
]
level = "code"
unit = "raw MAF quantity"

