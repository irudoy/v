summary = """
Scheduler snapshot of work-support idle adjustment ffff56f6, copied by \
00020dfe in the ffff56b2..ffff5717 -> ffff564c..ffff56b1 block after its \
periodic loop and published as DID 0x112e."""
note = [
    """
The homologous P32M profile names DID 0x112e CRRCT IDL RPM at 12.5 rpm per \
count.""",
]
level = "code"
unit = "count"

