level = "code"
note = """
FUN 000420b8 writes the work-support idle adjustment to ffff56f6 within \
0..20 counts from service-0x3b LID-2 value ffff3168, stored record 0x74, or \
the automatic step, and scheduler 00020dfe copies it to ffff5690. The exact \
JK08A service-0x22 table publishes ffff5690 as DID 0x112e. A structured \
Nissan profile names DID 0x112e CRRCT IDL RPM at 12.5 rpm per count and its \
write request 3b 02 DataWrite.CRRCT IDL RPM, and the factory manuals list \
the matching work-support item TARGET IDLE RPM ADJ."""

