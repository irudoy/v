summary = """
Exhaust-VTC evaluation window byte. FUN 0008f168 writes it at 0008f57a as \
the staircase lookup ROM8[0000988a+8*row+col], where row counts axis \
000119f8 points at or below engine-speed byte ffff11ae and col counts axis \
00011a08 points at or below coolant byte ffff1071. A non-zero value is a \
prerequisite of the target-tracking enable."""
note = ["All 64 stock cells of the 8x8 block 0000988a..000098c9 hold 60."]
