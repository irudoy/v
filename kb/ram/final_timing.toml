summary = """
Final signed timing coordinate in degBTDC written by 0004dbe8 after \
mode-dependent limits and overrides. Before the rate limiter and bounds it \
is ffff11da=clamp(ffff12d6+gated ffff564c, ROM8[0x8221]=-7, \
ROM8[0x821e]=50), and the full chain is ffff23f1 + (low7-64) + (ffff1a7d-64) \
- ffff23c5 - ffff12dc - ffff15ea + ffff134a - ffff11af + ffff2356 - ffff11f9 \
- ffff1ff6 + ffff564c with every coefficient 1. FUN 0004df82 transforms the \
result into ffff2022 and passes it to APC scheduler 0002a892. J1979 Mode 01 \
PID 0x0E in FUN 00035856 returns clamp((ROM8[0x83d5]-ffff2022)*2, \
-128..127)+128, which is 2*ffff11d4+128 on the normal path."""
note = [
    """
The normal transform is uint8(110-uint8(ffff11d4)). In the instrumented 1.11 \
target capture, this identity holds outside the Rolling Launch late \
override. During that override ffff11d4 remains the upstream stock \
coordinate while ffff2022 carries the effective command. The -7 bound is not \
universal across diagnostic and fallback modes; physical degree scale and \
pulse polarity remain hardware boundaries. J1979 defines PID 0x0E as A/2-64 \
degrees before TDC, so the ECU declares one count of this coordinate as one \
crank degree of advance; the physical spark angle remains a hardware item.""",
]
level = "code"
width = 8
unit = "degBTDC"
scale = "x"

