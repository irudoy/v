Function 000a4be2 publishes the bounded absolute-throttle byte at fffe8085 \
at 000a4c8a, using offset 2 of literal base fffe8083. Its selection paths \
use word fffeb684, optionally subtract fffe9a24 with a zero boundary, \
multiply by 0x505b with a right shift of 16, or use ROM byte 0000859a; the \
joined value is capped at 0xff before publication. This binds target storage \
and the software publication path; physical percentage, diagnostic identity \
and live cadence require separate target qualification."""

