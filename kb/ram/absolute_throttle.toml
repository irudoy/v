summary = """
Absolute throttle byte. FUN 0006f236 writes it and FUN 00035856 returns it \
unchanged for J1979 Mode 01 PID 0x11 at 00035de2."""
note = [
    """
J1979 defines PID 0x11 as A*100/255 percent, so the ECU declares the byte as \
absolute throttle position with 100/255 percent per count. CAN telemetry \
schema 2 streams it as absolute_throttle_raw.""",
]
