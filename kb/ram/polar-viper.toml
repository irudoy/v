summary = """
Nonnegative combined MAF quantity written by 0003b252 immediately before \
Base Fuel Schedule producer 0003b75c executes in the same seven-entry task \
table. Exact formula is max(0, int32[ffff1df8] + int32[ffff1dfc] + \
int16[ffff1e2a] + uint16[ffff2368]); stock configuration makes ffff1e2a zero \
on every producer call."""
note = [
    """
The exact AN4/AN15 and DID 0x1204/0x1205 paths establish the MAF identity. \
With the source-derived A2L scale, F*Q*0.0001 kg/hr is the physical airflow \
represented by aggregate Q and MAF Factor F. The physical meaning of \
ffff2368 remains unresolved. J1979 Mode 01 PID 0x10 declares \
ROM8[0x83ec]/25600 g/s per count of the offset-corrected total ffff105c, and \
the 2026-09-17 recordings reproduce the Base Fuel Schedule from A+B, so the \
aggregate shares that unit: 0.01477 kg/hr per count with stock 105 against \
F*0.0001 = 0.0109 from the A2L scale of F.""",
]
level = "code"
unit = "MAF Factor input counts"

