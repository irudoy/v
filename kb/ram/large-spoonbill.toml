summary = """
Baseline-relative EVAP pressure-depression coordinate used for the first \
000152d6 lookup. Direct producer paths call FUN 000abb84 with baseline \
ffff2abc and current sample ffff10c4, clamp a negative result to zero, and \
store the resulting uint16 here."""
note = [
    """
On those direct paths the stored value is max(0, \
floor((uint16[ffff2abc]-uint16[ffff10c4])*112/32)). Other state-machine \
paths can retain or update the same coordinate. Its physical pressure scale \
remains unresolved.""",
]
level = "code"
unit = "diagnostic raw"

