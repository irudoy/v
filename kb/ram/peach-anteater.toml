summary = """
Conditional P0128 parameter from RPM/12.5 curve 00015c80. FUN 000b784e \
writes the uint16 lookup when trunc0(P0128_model_microdegC/1000000) >= \
uint8(ROM[00008c8c])-50 and writes one otherwise. FUN 000b6b5a passes the \
word as H to FUN 000b7a3c."""
note = [
    """
The whole-program exact xref projection has one writer and one direct \
reader. Every stock cell of 00015c80 and every point of its axis are zero, \
so stock H is either zero or one. The physical meaning of this parameter \
remains unresolved.""",
]
level = "code"
unit = "P0128 parameter raw"

