summary = """
Multipurpose transient-state byte. FUN 0007b7c0 maintains bit 6 through a \
hysteresis comparison using scaled threshold ffff1393. Bit 4 is the cancel \
latch of the standstill exhaust override in FUN 000bfe88: set at 000c01c8 \
when ffff24d3 bit 4 is set while ffff246c bit 1 requests the override, \
cleared at 000c018c while ffff248b bit 2 is clear; while the latch is set \
the conditioner writes 128 during the predicate and then holds the previous \
ffff137e instead of the map target, so the override is a single stroke per \
pedal application. Service 0x31 routine 0x0c clears the latch at 000340cc."""
note = [
    """
No direct connection from bit 6 to the final timing coordinate or APC \
registers is established. Other consumers may use different bits.""",
]
level = "code"
unit = "bitfield"

