summary = """
Common conditioned exhaust-cam target byte. FUN 000bfe88 selects or blends \
cold/fallback ffff1c5f and warm/main ffff1c5d, applies mode, rate, and \
offset constraints, and writes this byte. The exact service-0x22 pointer \
table publishes it as target-exhaust-angle DID 0x1166."""
note = [
    """
The exact DID and exhaust-VTC DTC paths prove the physical subsystem. \
Warm-path replay converges to this byte after downstream conditioning. \
Monitor 0008f168 forms target minus actual plus 0x80 against actual bytes \
ffff2324 and ffff2325, and FUN 0004d2a6 adds this byte to intake target \
ffff2326, so it shares their unit of 0.5 crank degrees per count about \
neutral 128.""",
]
level = "code"
width = 8
unit = "degCA"
scale = "x*0.5-64"

