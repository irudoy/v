note = """
The exact JK08A service-0x22 table maps DID 0x1166 to ffff2327. Structured \
Nissan diagnostics identify the DID as the common target exhaust-VTC angle. \
Exhaust-VTC control and DTC paths independently consume the same byte. \
Conflicting public engineering conversions remain unresolved for JK08A."""

