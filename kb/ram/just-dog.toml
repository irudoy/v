summary = """
Centered cam-coordinate correction written by FUN 0004d2a6. Its normal value \
combines response-curve terms derived from intake target-minus-actual errors \
and target-versus-actual intake-plus-exhaust coordinates. Ignition-angle \
functions 0004afdc, 0004bdc2, and 00062fa4 consume the byte as value-64 or \
an algebraically equivalent centered term."""
note = [
    """
Code proves the centered cam-coordinate and ignition-angle path: 0004bdc2 \
subtracts 64 in the alternate branch and 128 for this term together with the \
low-seven map field in the normal branch, so the neutral value is 64 and one \
count is one crank degree of the final coordinate. The exact high-level \
calibration name remains unresolved.""",
]
level = "code"
unit = "deg+64"

