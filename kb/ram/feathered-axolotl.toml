summary = """
Judged latch of the P0014/P0024 rest-position pair, bits 0 and 1 for \
descriptor indices 0xd2 and 0xd3. FUN 00090256 sets the bank bit at 0009035c \
once the ffff43b6+b timer has expired; FUN 0008f168 enables the helper only \
while the bit is clear and ROM8[000186ff] bit 1 or 0 is set, and calls \
dispatcher 0007d8b8 with the index while the bit is set. Reset helper FUN \
0008fc6a clears it."""
