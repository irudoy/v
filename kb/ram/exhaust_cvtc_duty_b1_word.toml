claim = {label = "ParameterDefinition", id = "ecudocs-p32m-997c5a9:data:cid-122fh-vtc-dty-ex-b1-70b6f971"}
applicability = "nissan_family_candidate"
scope = "exact-code"
priority = 100
level = "code"
note = """
The exact JK08A service-0x22 table maps DID 0x122F to big-endian word \
ffff1aac. Structured Nissan diagnostics identify it as bank-1 exhaust-VTC \
duty and define percent = raw*100/1024. The conversion remains homologous \
pending target measurement."""

