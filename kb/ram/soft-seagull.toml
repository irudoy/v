summary = """
Crank reference capture of the current tooth. On the normal path the ICI0A \
handler prologue stores OSBR1 (fffff456) at 00028f22 on every crank tooth \
and forms tooth interval ffff22ba from the difference to the previous value. \
In P0335 fallback 0002b768 stores the GR1E or GR1F word (fffff44c from \
caller 0002a51e, fffff44e from 0002a5cc) at 0002b7cc for the current engine \
event. APC and injection-start compare scheduling uses it as its base, and \
capture handlers 000c2c58 (000c2c86) and 000c2d76 (000c2da4) subtract it \
from the channel-4 cam captures to form the exhaust-cam edge interval. \
Channels 1A and 4 both count phi'/32 = 3.2 us (TCR1A and TCR4 = 5 in \
0002718a, PSCR1 = 1 in 000274ac), so the difference is a time."""
note = [
    """
The producers and consumers are exact. One count is 3.2 us. The prologue \
bytes 85bb 6403 9075 0845 at 00028f1c read OSBR1 and store it at offset \
0x2fe of window base ffff128c.""",
    """
In normal ICI0A mode, the previous word is loaded into R5 before the OSBR1 \
store. The ordered chain equation retains that old value as prev for the \
following modulo-65536 period subtraction.""",
]
level = "code"
width = 16
signed = false
unit = "timer count"

