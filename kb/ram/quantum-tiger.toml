summary = """
Six-channel fallback-history mask shared by DFCO rotating release and ATU-II \
scheduler 0002c13c. A channel uses fallback word ffff23aa when its ffff22e0 \
bit or history bit is set. Injector-event handler 0002be40 clears the \
current event bit and can add it again while rotating-release count ffff1937 \
is nonzero."""
note = [
    """
This history makes the rotating release tail injector-event synchronized. \
Physical channel-to-cylinder order is unresolved.""",
]
level = "code"
unit = "bitfield"

