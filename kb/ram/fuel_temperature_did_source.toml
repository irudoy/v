level = "code"
note = """
The exact JK08A service 0x22 pointer table maps DID 0x1104 to response byte \
ffff1074. A structured homologous Nissan profile identifies the DID as fuel \
temperature and defines deg C = raw-50. The source profile embeds CID 0x1104 \
in the semantic name but does not expose a request field, so its canonical \
corpus identity remains semantic. The byte is the output of thermistor table \
00012dea, whose code the ECU declares as deg C+50 through J1979 Mode 01 PIDs \
0x05 and 0x0F, so the conversion is established by code; the sensor identity \
rests on the profile and on the AN0 mux code 111 acquisition path."""

