summary = """
Exact one-byte response source for UDS DID 0x1104 and published \
fuel-temperature transfer code. Initialization path 0002c4f8 stores \
lookup(00012dea, uint8(ffff100a >> 2)) at 0002c56e, where ffff100a is the \
AN0 external-mux sample of selector code 111. Periodic publisher 00039788 \
stores at 000397c4 either service-0x30 value byte ffff992d while active bit \
ffff99c5 bit 1 is set or the output of limiter 00039874 over transfer code \
ffff1f89, which FUN 000397e8 forms from filtered sample ffff1fa8 through the \
same table. FUN 000398b0 reads the byte to form normalized index ffff117a, \
and the service 0x22 pointer table publishes it directly."""
note = [
    """
The byte is the output of shared thermistor table 00012dea, whose code the \
ECU declares as deg C+50 through J1979 Mode 01 PIDs 0x05 and 0x0F, so deg C \
= raw-50 is established by code. The factory fuel tank temperature sensor \
reference of 3.5 V at 20 deg C and 2.2 V at 50 deg C gives 20.5 and 52 deg C \
through the table at 20 mV per input count. The limiter keeps the published \
byte between the converted sample and the sample plus two counts while the \
temperature falls. The identification of DID 0x1104 as fuel temperature is a \
diagnostic-binding claim in JK08A.diagnostic-bindings.csv.""",
]
level = "code"
width = 8
unit = "degC"
scale = "x-50"

