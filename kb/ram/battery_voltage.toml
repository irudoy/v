summary = """
Exact one-byte response source for UDS DID 0x1103 and current \
battery-voltage byte. On 7mfk, FUN 00039a9e forms input byte \
uint8(uint16(ffff1d6e)>>2), applies shared unsigned Q1.15 coefficient \
ffff4970 through guard 00067188 and scaler 000671d8, and caps the result at \
255. The guard is bypassed with ffff4252.bit3 set; otherwise inclusive \
0x7900..0x8700 is preserved and other coefficients reset to 0x8000. FUN \
00038618 and selected-temperature gate 0003967a compare the output with raw \
100; scheduler 00020dfe snapshots it to ffff1108."""
note = [
    """
One count is 0.08 V: the ROM limits that the DTC monitors apply to snapshot \
ffff1108 reproduce the factory battery-voltage test conditions of 10, 10.5, \
11, and 16 V; that row carries the constants and JK08A.diagnostics.md \
derives the scale. With stock coefficient 0x8000 the byte equals the ten-bit \
sample shifted right by two, so one count is 20 mV at the converter input \
and the terminal divider is 4:1. Raw 100 is 8.00 V. Target recordings hold \
157..180 counts, or 12.56..14.40 V, around a diagnostic reading of 13.92 \
V.""",
    """
The unsigned word copy at ffff1fc4 and byte intermediate at ffff1fc6 retain \
distinct access widths. The battery output has no MAF-style increment at raw \
0x03ff. Executed software cases do not validate the physical scale or the \
reachable state of coefficient bypass.""",
]
level = "code"
width = 8
unit = "V"
scale = "x*0.08"

