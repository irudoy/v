note = """
The exact JK08A service-0x22 table maps DID 0x1103 to ffff1188. FUN 00039a9e \
converts phase-2 AN0 mux sample ffff1d6e and writes the response byte. \
Homologous measured diagnostics identify the DID as battery voltage with V = \
raw*0.08, and the ROM limits of the JK08A DTC monitors reproduce the factory \
battery-voltage test conditions of 10, 10.5, 11, and 16 V at that scale. A \
target diagnostic reading of 13.92 V lies inside the recorded range of \
12.56..14.40 V."""

