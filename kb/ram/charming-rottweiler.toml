summary = """
Scheduler snapshot of current gear index ffff1086 decoded from the low \
nibble of CAN 0x174 payload byte 3. Values 1 through 7 become zero-based \
indices 0 through 6; zero and values above 7 become zero. Rotational-speed \
request limiter 0007584e uses target > current to admit immediate recovery \
tracking and auxiliary output."""
note = [
    """
Passive target transitions 0x44 -> 0x34 -> 0x33 and 0x22 -> 0x32 -> 0x33 \
establish that the low nibble changes after the target nibble and represents \
current gear.""",
]
level = "code"
unit = "zero-based current gear index"

