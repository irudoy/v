summary = """
Bank-1 exhaust-cam edge phase byte. IMI4D capture handler 000c2d76 \
(continuation body 000c2de0) writes it at 000c2e60 as 20*segment + \
floor(20*interval / ffff22bc) through signed divider 00021bbc, where segment \
maps event selector ffff13b2 (values above 7 minus 5, 7 to 0, lower values \
plus 5) and interval is the 16-bit difference between capture GR4D and crank \
reference count ffff158a. The update runs only while cylinder index ffff11de \
is 1, 3, or 5 and driver status ffff850c bit 5 is clear, after shifting the \
previous values into ffff1202 and ffff1204. Scheduler 00020dfe copies the \
byte to ffff11c8."""
note = [
    """
Ghidra lists the handler as 000c2d76 and 000c2de0 because the segment-index \
branch splits the body; the interval is also stored as a word at ffff1a80 \
and the segment at ffff16f2, both reached through window base ffff128c. The \
phase is a crank-relative timing of the cam sensor edge in 0.5-degree units \
(ffff22bc is 10 crank degrees), and the stock rest value ROM8[0000831d]=88 \
places the calibrated rest edge 44 crank degrees after the event origin, 8 \
units into segment 4.""",
]
level = "code"
unit = "edge phase raw"

