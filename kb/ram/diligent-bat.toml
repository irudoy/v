Base of the 64-word bank 2 learned-fuel-trim RAM grid. FUN 0005796c selects \
one Q8.8-percent cell by an 8x8 operating-region index, and FUN 00057d1e \
updates selected cells with bounds 90..110 percent. Reset paths fill all \
cells with 0x6400."""
