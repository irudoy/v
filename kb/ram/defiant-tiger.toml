summary = """
Multipurpose status byte. Bit 6 is the coolant latch of FUN 000bd20a: set at \
raw coolant ffff1071 of 125 and above, cleared below 65, and unchanged \
between; while it is set, intake operating bit ffff246b bit 6 uses coolant \
floor ffff24a9 bit 0 (raw above 70) instead of bit 3 (raw above 106). The \
byte lies in retained RAM region ffff4514..ffff5cf3, which startup \
initializers 00027ac0 and 00027c50 leave unzeroed; 00026f30 zeroes the \
region only when 00026f08 calls it, and 0002fc24 and 00034b70 zero \
ffff1000..ffff5cf3. No other direct writer changes bit 6, so the latch keeps \
its state across engine starts. Bit 3 is the global odd-polarity result \
latch for exact P0306..P0300 runtime records. Reporter 00084cd0 sets it \
before and after odd-argument dispatch, and selector-free handler 0007dc32 \
sets it with record bits 4 and 5. Initializer 00082c8a clears it with all \
retained snapshot state. Reconciler 0008042c retains it only when the first \
P030 record carrying bit 5 or 6 has bit 5 set and bit 6 clear. Global expiry \
0007c57a clears it at maintenance count 3, and common aging pass 0007cf14 \
clears it when any P030 record reaches its bit-5 aging condition."""
note = [
    """
The full static set, reconcile, consume, and clear lifecycle is code-proven. \
Odd-polarity is an operational argument label; physical diagnostic phase \
names and time cadence remain unresolved.""",
]
level = "code"
unit = "bitfield"

