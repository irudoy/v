summary = """
EVAP pressure-sensor circuit result byte. FUN 000ac934 sets bit 6 for the \
P0452 low branch and bit 5 for the P0453 high branch; FUN 000abca2 applies \
configuration gates, dispatches descriptor indices 0xd4 and 0xd5, and clears \
the bits."""
note = [
    """
The low/high identities follow the exact descriptor catalog. The stock \
configuration skips the pressure-circuit producer and both exact dispatch \
branches. Sensor voltage conversion remains unresolved.""",
]
level = "code"
unit = "bitfield"

