summary = """
Current saturated engine-speed byte in RPM/12.5 representation. FUN 0003846e \
forms source ffff11ea as min(255, ffff1196>>6), and scheduler 00020dfe \
copies it here. The byte indexes multiple implicit-axis maps and supplies \
the hysteretic P030 speed gate in FUN 0007c4e0."""
note = [
    """
It has the same count scale as engine-speed word ffff11f4 and saturates at \
255. For 1D-8 implicit grids, nodes 0,32,...224 correspond to 0,400,...2800 \
RPM, with the last cell selected at and above 2800 RPM.""",
]
level = "code"
unit = "rpm/12.5"

