summary = """
First-sample mask for the two filtered AN1 lanes. When bit 0 or 1 is clear, \
FUN 0003d258 copies the corresponding raw sample directly to \
ffff2832/ffff2834 and sets the bit; later admitted updates use the \
first-order filter. Startup and conditional recovery ranges clear the byte."""
note = [
    """
The claim is limited to bits 0 and 1. Other uses of the byte are not \
assigned semantics.""",
]
level = "code"
unit = "bitfield"

