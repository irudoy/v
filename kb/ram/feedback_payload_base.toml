summary = """
Base of the 30 ten-byte stock HCAN1 software mailbox records corresponding \
to ROM table records at 0000975a. Record i is ffff3ab5+10*i; bytes 0 and 1 \
hold state and age, and bytes 2 through 9 hold the payload copied to \
physical mailbox i+1 by FUN 000c3746."""
note = [
    """
Only firmware type-3 records use the stock periodic serializer and submitter \
path.""",
]
level = "code"
unit = "CAN software records"

