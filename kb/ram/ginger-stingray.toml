summary = """
Bank 1 MAF-table input written by FUN 0003ae8a from diagnostic word \
ffff101c: the first call copies the word, and later calls write \
uint16(ffff101c-c) with c = floor(floor(K*335/65536)/min(65535, previous \
ffff1e48+80)) and K = uint32 ffff3998. FUN 0003a904 uses its low 12 bits to \
interpolate curve 0x14274."""
note = [
    """
Init 0002d120 seeds K = 0x00180000, so c = floor(8040/(previous+80)) until \
0003aa12 rewrites K: 32 counts, 0.16 V, at a steady 1 V input. The transfer \
curve therefore follows this word, not diagnostic word ffff101c. The \
physical meaning of the correction remains unresolved.""",
]
level = "code"
unit = "V*200"

