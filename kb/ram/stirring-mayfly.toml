summary = """
Multipurpose state byte. Coordinator 000493e8 copies ffff160f.bit7 into bit \
6 for knock-state eligibility logic. FUN 0004faac uses bit 3 as its \
engine-running inhibit state and requires bit 4 as an enable input. Direct \
runtime writers modify bits 0, 1, 2, 3, 6, and 7 while preserving bit 4."""
note = [
    """
Normal startup clears the containing [ffff1000,ffff261c) span and both \
recovery paths clear [ffff1000,ffff5cf4). A 2315-function p-code census and \
the recovered DMAC configuration find no path that can set bit 4, so it \
remains zero in the proven stock lifecycle.""",
]
level = "code"
unit = "bitfield"

