summary = """
Target injection-slot byte of the current engine event. The bounded 7mfk \
sequencer subtracts selected lead from c-1, adds 6 once if negative, and \
stores uint8. Bit5 selects snapshot ffff2364 or constant 3. For c in 1..6 \
and selected lead <= 6 the result equals modulo 6 and is in 0..5. Full-byte \
lead contexts include c=1, lead=7 storing 255. Sequencer 00054a44 writes it \
and engine-event driver 00028ea2 reads it to seed ffff2228 and ffff221e. \
Upstream bounds and hardware reachability retain separate evidence."""
