summary = """
Mode byte of final timing-coordinate builder 0004dbe8. Bits 1..5 are \
hysteresis flags that are clear inside the work-support timing window: bit 1 \
for raw coolant ffff1079 (clears at 110, sets below 107), bit 2 for the low \
RPM/25 bound of ffff11b3 (clears at ROM8[0x8897]=48, sets below 40), bit 3 \
for the high RPM/25 bound (clears at 120 or below, sets above \
ROM8[0x8896]=128), bit 4 for the low bound of Q7 normalized base fuel \
schedule ffff1048 (clears at ROM8[0x8768]=64, sets below 60), and bit 5 for \
its high bound (clears at 92 or below, sets above ROM8[0x8767]=96). FUN \
0004dbe8 adds ffff564c only while all five bits are clear."""
note = [
    """
Idle speed lies below the RPM window, so the timing adjustment has no effect \
at the work-support condition IDLE CONDITION. Other bits are not \
characterized.""",
]
level = "code"
unit = "bitfield"

