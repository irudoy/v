summary = """
Scheduler copies of the exhaust magnet output status bytes: ffff109e and \
ffff109f for bank 1, ffff10a0 and ffff10a1 for bank 2. Scheduler 00020dfe \
copies block ffff1114..ffff1193 to ffff1094..ffff1113 at 00020f56, so they \
follow decoder 0004110a outputs ffff111e..ffff1121. FUN 00090642 counts \
passes on which a byte of the bank equals 1."""
note = [
    """
Each byte is a two-bit field of the 16-bit diagnostic word of output driver \
device 1 (ffff1eb2). The electrical condition behind code 1 is not \
recoverable from ECU code.""",
]
level = "code"
unit = "driver status code"

