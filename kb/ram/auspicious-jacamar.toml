summary = """
Bit 5 selects the source used by per-channel difference producer 0005727a: \
set selects ffff123e, clear selects ffff1024. Bit 6 satisfies the secondary \
readiness clause of fuel-output inhibit state machine 0004f324 when ffff1071 \
is below ROM8[00008d0e]. The byte also participates in the \
ROM8[00008d92].bit3-clear calculation path of 00051a98."""
note = [
    """
Stock ROM8[00008d0e]=0 makes the unsigned ffff1071 comparison always true, \
so bit 6 cannot block readiness in JK08A. Bit 5 is a source selector in the \
stock per-channel path, not an identified Over Run Fuel Cut state.""",
]
