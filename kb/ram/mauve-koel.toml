summary = """
CAN limited-request word for frame 0x160 byte 0 and byte 1 bits 7..4. FUN \
00079e70 writes clamp(trunc0(x/5)+800, 0, 4094) with x=s16[ffff4106], the \
scheduler latch of ffff415e. While ROM8[0000870c].bit7 and ffff4248.bit1 are \
both set, x is max(s16[ffff4106], s16[ffff410a]), where ffff410a latches \
transmission request candidate ffff4162."""
note = [
    """
Stock ROM8[0000870c]=0x44 has bit 7 clear, so the transmission candidate \
does not enter this word.""",
]
level = "code"
unit = "CAN torque count"

