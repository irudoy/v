summary = """
Second commanded-mixture word of 0005651c, Q14, addressed as ffff120e + \
0x2e. Gates ffff2474 bit 7 (load ffff102c >= ffff12e7) and ffff2493 bit 2 \
(vehicle speed ffff110e <= ROM8[000087d9]) select a ramp from snapshot \
ffff127a toward ROM16[00008f86] = 0x4000 with the same \
ROM8[0000849b]/ROM8[0000849c] steps as ffff123a. Stock constants keep the \
word at 0x4000, so max(ffff123a, ffff123c) in 0005594a always returns \
ffff123a."""
