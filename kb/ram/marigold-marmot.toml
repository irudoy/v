summary = """
Scheduler snapshot of ffff115a, copied by 00020dfe in the ffff1114..ffff1193 \
-> ffff1094..ffff1113 block before its periodic loop. It selects the \
automatic step of 0004aad0 and of 000420b8, and a value of at least 0xe0 \
gives work-support status 0xa4 and blocks the automatic request of \
000682f6."""
note = [
    """
Source ffff115a has no static writer, so the snapshot stays zero in JK08A \
unless an interrupt, DMA, or peripheral writer outside the static census \
exists.""",
]
