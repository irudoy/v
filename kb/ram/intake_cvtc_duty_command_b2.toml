summary = """
Second cell of the two-cell intake-VTC solenoid duty command and scheduler \
latch of live duty cell ffff2441. FUN 000beace reads it at offset 0x85 of \
base ffff2330 and programs ATU-II channel-7 buffer register fffff590 with \
the same conversion."""
note = [
    """
Bank order follows the adjacent-pair convention of ffff2442/ffff2443; it is \
not established by a diagnostic identity.""",
]
