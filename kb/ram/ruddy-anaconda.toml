summary = """
Signed P0128 model-temperature state in 1e-6 deg C. FUN 000b6b5a seeds it as \
1000000*uint8[ffff1071]-50000000, otherwise loads the retained integrated \
state ffff9df0, and passes it to three P0128 term accessors before adding \
scaled balance ffff3400."""
note = [
    """
Exact DID 0x1101 and the hard-coded -50 offset establish the temperature \
representation. When the model-ready gate is clear, the retained state is \
replaced by current coolant temperature after the calculation; otherwise the \
saturated integrated result is retained for the next pass.""",
]
level = "code"
unit = "P0128 model temperature [1e-6 deg C]"

