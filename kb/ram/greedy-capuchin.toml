summary = """
Unsigned P0128 surface product. FUN 000b7b98 writes zero when aggregate \
inhibit mask ffff22e0 is nonzero; otherwise it writes \
uint8(coefficient)*lookup_u16(0000d40e, RPM, Base Fuel Schedule). FUN \
000b6b5a is the only reader and subtracts half of a saturated three-term sum \
from half of this value before signed scaling."""
note = [
    """
The whole-program exact xref projection has one writer and one reader. Every \
stock cell of 0000d40e is zero, so this word is always zero in stock JK03A \
and JK08A; the surrounding monitor calculation remains live.""",
]
level = "code"
unit = "P0128 model raw"

