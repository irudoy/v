summary = """
Base of six one-based per-channel uint16 knock thresholds at \
ffff2144..ffff214f. FUN 00049ffc interpolates one of six rows of Knock Slice \
Map 0001108e by engine speed and writes ffff2144 + 2*(channel-1); FUN \
0004a238 compares the selected threshold with its calculated metric."""
note = [
    """
The physical channel-to-cylinder order and engineering threshold unit remain \
unverified. ffff2142 is a separate event counter, not the first threshold \
word.""",
]
level = "code"
unit = "raw threshold array"

