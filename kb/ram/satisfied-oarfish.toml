summary = """
Shared unsigned Q1.15 coefficient at ffff4970 on 7mfk. FUN 000671d8 scales \
both MAF ADC words and the shifted battery sample. With ffff4252.bit3 clear, \
FUN 00067188 preserves the inclusive range 0x7900..0x8700 and replaces other \
values with ROM16[0x92be]=0x8000; bit3 set preserves any coefficient word."""
note = [
    """
At coefficient 0x8000, the scaler is an identity. MAF publisher 0003c408 \
adds one after scaling only when its original raw word equals 0x03ff; \
battery publisher 00039a9e has a separate byte-width output contract. The \
physical meaning and scheduler reachability of ffff4252.bit3, and the \
lifecycle of non-stock coefficient values, remain unresolved.""",
]
level = "code"
unit = "Q1.15 coefficient"

