summary = """
Shared Q1.15 coefficient used by FUN 000671d8 when converting both ten-bit \
MAF ADC samples to DID 0x1204/0x1205 words and the shifted battery sample to \
DID 0x1103 byte ffff1188. FUN 00067188 accepts values 0x7900..0x8700 and \
restores ROM16[0x92be]=0x8000 outside that range."""
note = [
    """
At stock 0x8000, conversion is identity for samples 0..1022; FUN 0003c408 \
increments the full-scale sample 1023 to 1024. The lifecycle of non-stock \
in-range values remains unresolved.""",
]
level = "code"
unit = "Q1.15 coefficient"

