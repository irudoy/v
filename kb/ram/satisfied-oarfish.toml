note = """
Bit3 set bypasses both range comparisons and preserves ffff4970, returning \
the unsigned mode byte. Bit3 clear selects the inclusive-range check: \
0x7900..0x8700 is preserved with return 0x55; other words reset to \
ROM16[0x92be]=0x8000 with return 0xaa. The MAF publisher invokes this guard \
before loading either selected raw sample."""

