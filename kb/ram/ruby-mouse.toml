summary = """
Service-0x3b flag byte of LIDs 1..4. For each LID the even bit is the apply \
bit and the next odd bit is the store bit: bits 0 and 1 for LID 1, 2 and 3 \
for LID 2, 4 and 5 for LID 3, and 6 and 7 for LID 4. Handler 00034194 writes \
the bits, and diagnostic-state reset 0002e81a zeroes the byte with flag \
bytes ffff99f5..ffff99f9."""
note = [
    """
Flag bytes ffff99f5..ffff99f8 hold LIDs 5..20 in the same layout; \
ROM16[0x22e32+2*LID] gives the byte offset and the apply mask.""",
]
level = "code"
unit = "bitfield"

