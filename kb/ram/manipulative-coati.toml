summary = """
Signed transmission request candidate written by the selected FUN 00077892 \
or alternate FUN 00077dec. On a pass with ffff4252.bit1 set, the selected \
function writes the maximum of shift-code floor ffff34da and the target term \
built from ffff32ec, limited to ffff4138 and, under ROM8[0x8b08].bit0, to \
word B latch ffff2770; on every other pass it writes min(ffff34a4, \
ffff2770). Common completion FUN 000777fa reads it only while ffff41a6.bit3 \
is set, then publishes it through ffff3480 and ffff3484 to signed request \
boundary FUN 00079030."""
note = [
    """
A whole-program p-code census found exactly two writers and the two reads in \
000777fa, with no computed-address candidates. The candidate bounds ffff19c6 \
only while ffff41a6.bit3 is set, during a gear change with TCM field \
ffff3a2e == 3 through latch ffff418f.bit4 and the 307.2 ms hold after it; \
the 2026-09-22 road captures show such bounds in 4-3 and 3-2 downshifts, \
where ffff19c6 falls below the pre-limiter request.""",
]
level = "code"
unit = "signed raw"

