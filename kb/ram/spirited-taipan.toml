summary = """
Fast-ramp mode byte of rotational-speed request limiter 0007584e. \
Initializer 0002c648 and the limiter inactive/reset branch both load \
ROM8[0x8a9b]=100. A nonzero value selects rate 0x9428 while ffff24a3.bit2 \
remains clear; the set latch selects rate 0x9426."""
note = [
    """
A whole-program p-code census of all 2315 functions found only these two \
writes and the limiter read, with no computed-address candidates. No \
countdown exists: the stock byte remains 100, and ffff24a3.bit2 alone \
changes the fast-versus-normal rate after initialization.""",
]
level = "code"
unit = "mode byte"

