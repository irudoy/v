summary = """
Bank 1 short-term fuel-trim word in Q8.8 percent representation. FUN \
0005c910 normally copies working word ffff40ac here; an alternate control \
path forces a whole-percent value. UDS DID 0x1123 returns the high byte, \
while J1979 PID 0x06 returns min(255, floor(ffff22dc/200))."""
note = [
    """
Neutral is 0x6400 = 100 percent. The UDS community conversion raw-100 \
exposes signed correction percent from the high byte; fractional content is \
not returned by DID 0x1123.""",
]
level = "code"
width = 16
unit = "percent"
scale = "x/256-100"

