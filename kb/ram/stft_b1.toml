applicability = "nissan_family_candidate"
scope = "exact-code"
priority = 100
level = "code"
note = """
The exact JK08A service 0x22 table maps DID 0x1123 to the high byte of \
Q8.8-percent word ffff22dc. Exact Mode 01 code maps the same word to \
standard PID 0x06 as min(255, floor(word/200)), proving short-term fuel trim \
bank 1 and the internal percent*256 representation. The community display \
formula raw-100 therefore has neutral raw 100, matching the 0x6400 \
initialization."""

