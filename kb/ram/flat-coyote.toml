start delay in crank degrees by 120, forced to 3 while ffff4251.bit0 is set. \
Scheduler copier 00020dfe snapshots the byte to ffff2364, which sequencer \
00054a44 uses as the lead while ffff8513.bit5 is set and replaces with 3 \
otherwise."""
