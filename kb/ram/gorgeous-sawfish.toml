summary = """
Misfire attribution cylinder number 1..6 of the current interval sample. The \
common tail of 00028ea2 writes ROM8[0002265c + ffff11de] on tooth 9 together \
with interval ffff1dac; detection core 00085a70 and helper 00086b0c use \
twice the value as the offset of the per-cylinder event counters."""
note = [
    """
Event index c maps to cylinder c + 3 modulo six, the cylinder whose \
expansion stroke fills the interval tested by the detection metrics. Counter \
element 1 reports P0301 through 00084aa4 and 00084cd0, so event index \
ffff11de is the cylinder number.""",
]
level = "code"
unit = "cylinder number 1..6"

