summary = """
Multipurpose state byte. FUN 00077892 recomputes bit 6 as a \
transmission-transition inhibit aggregate. It clears bit 6 only when \
ffff424c.bit3 is set, ffff415c is zero, ffff41a5.bit2 is set, ffff4200.bit0 \
is set, ffff4201.bit7 is set, and signed ffff34ba is at least 0x2710; every \
failed prerequisite sets bit 6."""
note = [
    """
The aggregate is an exact operational inhibit for ffff4252.bit1. Its \
individual physical prerequisite names remain unresolved. Other bits have \
independent consumers.""",
]
level = "code"
unit = "bitfield"

