summary = """
Saturating count of consecutive qualified rotational-reference interval \
samples for the misfire monitor. FUN 0003cf24 consumes ffff84f2.bit7, shifts \
the interval history, and increments this byte only when the \
speed/prior-reference checks pass and ffff4247.bit6 is set. Invalid \
qualification or a clear configuration bit resets it. Detection core \
00085a70 requires at least 19 samples; revolution-window producer 000872d0 \
requires at least 31."""
note = [
    """
The counter saturates at 255. Static code does not establish the physical \
cadence of one accepted sample, so the 19- and 31-sample gates are not \
converted to revolutions or time.""",
]
level = "code"
unit = "qualified interval samples"

