title = "Dwell mask sequence guard"
summary = """
An eligible mismatch or pair of zero masks sets bits 7 and 6. The consistent \
path copies prior bit 7 into bit 6 and clears bit 7. Bit 7 withholds the \
next high POPCR action."""

