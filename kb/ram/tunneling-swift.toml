summary = """
Multipurpose state byte written every pass by FUN 0007724c from TCM field \
ffff3a2e: value 3 sets bits 3 and 4, value 5 sets bits 3 and 5, value 6 sets \
bits 3 and 6, value 7 sets bits 3 and 7, and every other value clears bits \
3..7. FUN 000c4460 recomputes bit 2 from an independent status bit. \
Scheduler FUN 00020dfe latches the byte into ffff418f."""
note = [
    """
FUN 0007724c is the first call of FUN 00079de4 (pointer 00079e18), entry 58 \
of the 69-entry table at 00021834 that dispatcher 000209d8 drains on \
ffff84b9 bit 4. Reader FUN 0002e0d4 is independent.""",
]
