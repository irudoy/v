summary = """
Bit 6 is a one-shot init latch that gates the single baseline lookup of map \
0x18766 in 00073824 through test-then-set. Bit 7 is the standstill flag of \
exhaust-VTC conditioner FUN 000bfe88: hysteresis comparator 000259d0 sets it \
while coarse vehicle-speed byte ffff110e is at or below ROM8[00008e3c]=2 and \
clears it above 2+ROM8[000086e8]=3, stored at 000bff4e; it is one input of \
standstill override predicate ffff246c bit 1."""
note = [
    """
The claim for bit 4 of the same byte, threshold 'clamp activated', has no \
verdict because its refutation failed; confidence remains candidate.""",
]
