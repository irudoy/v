summary = """
Multipurpose state byte. FUN 0004f662 uses bit 0 for a stock-inert BFS \
hysteresis contributor. FUN 000507ce uses bit 2 for a 6375 RPM high-speed \
contributor with 200 RPM hysteresis. Bit 1 independently selects endpoint \
pairs in both parallel raw-output channels."""
note = [
    """
The bit-set raw-output endpoints are pairwise identical in stock JK08A. \
These three bit roles belong to independent state machines.""",
]
level = "code"
unit = "bitfield"

