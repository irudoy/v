summary = """
First-channel scaled publication from FUN 0007a592. The function calculates \
floor(S*727/800) with signed division and writes the uint16 result here; S \
is the locally bounded value or override source ffff3026. Under stock \
ROM8[000083c1].bit0=0, the selected source also reaches final channel word \
ffff2a7a. Direct surface evaluators 00074028 and 0007604c use this word on \
byte-identical 0..727 axes; inverse evaluator 00076ad0 restores the \
corresponding 0..800 domain."""
note = [
    """
The exact 727/800 relationship is code-proven. The physical interpretation \
of the common first-channel raw quantity is not assigned.""",
]
level = "code"
unit = "scaled first-channel raw"

