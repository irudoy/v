summary = """
Clamped timing sum written by 0004dbe8 as clamp(ffff12d6+gated ffff564c, \
ROM8[0x8221]=-7, ROM8[0x821e]=50), where the ffff564c term is included only \
while ffff5b31 bits 1..5 are clear. The rate limiter and mode bounds of the \
same function derive ffff11d4 from this sum."""
note = ["One count is one crank degree of the J1979 PID 0x0E coordinate."]
