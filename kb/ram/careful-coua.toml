summary = """
Multipurpose status byte. Bit 0 contains NATS registered channel 0 and is \
managed by FUN_000937dc. In the misfire component, bit 1 gates group-0 \
snapshot capture; even reporter argument 0 sets it after capture. Global \
expiry FUN 0007c57a and group-0 cleanup FUN 0007c8fa clear it with the \
retained payload."""
note = [
    """
The NATS and misfire uses are independent. The group-0 bit is a capture \
latch; code does not assign it a physical phase name.""",
]
level = "code"
unit = "bitfield"

