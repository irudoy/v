summary = """
Request byte of memory task 000cd85c. Handler 000306f8 of manufacturer \
diagnostic service 0xa0 (dispatched by 0002f928 at 0002fa78) copies an \
accepted request code from ffff8005 into it (000309ca for codes 1, 2, and 3) \
and sets pending flag ffff41de bit 0 at 000309d6; scheduler task 0002e8d2 \
passes the byte to 000cd85c at 0002e8f4 while the flag is set, the task \
resets it to zero after a pass (000cdb1e, 000cdb7e, 000cdbca, 000cdd16), and \
initialization path 0002e81a zeroes it at 0002e890. Request 1 runs the ROM \
sum, request 2 the compare, and request 3 sets ffff4251 bit 0 at 000cdd4e."""
note = [
    """
The immediate codes 0x82, 0x84, 0x88, 0x92, 0x93, 0x94, and 0x98 are stored \
at their own sites and answered inside the handler. The tester-side meaning \
of the codes is not established.""",
]
