summary = """
One-bit current-cylinder mask for the low byte of POPCR. On the enabled APC \
path it selects the PULSxSOE set action associated with GR11A; engine \
inhibit ffff4198 bit 1 clears it."""
note = [
    """
The manual proves output-high action on compare. Tooth 7 forms the mask as 1 \
<< (ffff11de - 1), so bit c - 1 addresses cylinder c, and the ignition \
advance moves only this set edge, which makes it the spark edge. The \
external driver stage and cylinder-to-pin continuity remain hardware \
boundaries.""",
]
level = "code"
unit = "bitfield"

