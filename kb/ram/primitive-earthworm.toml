summary = """
Bank-1 exhaust-cam edge count of the current capture window. IMI4D handler \
000c2de0 increments it with saturation at 000c2e8e while arm byte ffff4120 \
bit 0 or ffff4121 bit 0 is set; edge-count monitor 000c22dc judges it while \
cylinder index ffff11de is 2, 4, or 6 (one edge is normal, zero or two or \
more raise ffff850c bit 5) and zeroes it at 000c24aa outside that window and \
at 000c2374 on reset request."""
