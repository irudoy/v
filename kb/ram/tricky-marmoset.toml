summary = """
Bit 6 gates the throttle-gated subsection of the angle summation, pair \
0x11efa/0x147ca through mul.l and 0x21ce0. Bit 7 is the work-support timing \
record latch: 00068040 sets it on the LID-1 store edge with accepted status \
(ffff41aa bits 2 and 4) or on timing request ffff41aa.bit0 with \
ffff4184.bit7 clear, and clears it after requesting record 0x74."""
note = [
    """
The exact role of the pair, such as knock limit, torque ratio, or timing \
limit, is unresolved.""",
]
