Shared 16-bit input of the 0x76xxx group (base ffff1114 + 0x3e): used as the \
lookup index in 000763e2 (shifted by >>3), 0007654c, and 00076770. FUN \
00076ad0 uses it as the secondary coordinate for signed surfaces 0000de8e \
and 0000e28e when ffff4255.bit7 is clear, or as one input to the maximum \
selector when the bit is set."""
note = [
