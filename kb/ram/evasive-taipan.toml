summary = """
Engine speed in RPM/3.125 counts. FUN 000385bc writes \
floor(uint16[ffff1206]/2) = floor(2000000/ffff22d4), or zero while ffff417f \
bit 5 is set. Scheduler 00020dfe copies it to snapshot ffff11d0."""
note = [
    """
Interval ffff22d4 equals ffff11fc, so the word has the representation of \
ffff11ee = ffff1196>>4 = floor(2000000/ffff11fc).""",
]
level = "code"
unit = "rpm/3.125"

