summary = """
Primary requested-torque conversion row coordinate. FUN 0003de4c writes \
max(32, ffff11b6) each pass, and startup initializer 0002d120 seeds 32. \
Wrapper 000262e0 passes it to byte core 00026a0c, which multiplies each \
stored 0x11d0c point by 16 before comparison, so one row-axis count is 50 \
RPM. Every forward lookup of 0xe98e except 0007584e passes it as the row \
input; 000730fc passes it to inverse lookup 00073432 and scales the selected \
inverse coordinate by it, and 00073948 divides the doubled opening area by \
it."""
note = [
    """
The clamp at 32 counts (100 RPM) lies below the first row point, 16*16 = 256 \
counts (800 RPM).""",
]
level = "code"
unit = "rpm/3.125"

[logparam]
id = "X_VQ_Engine_Speed"
unit = "RPM"

