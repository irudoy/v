summary = """
Current engine-speed byte in RPM/25 representation. FUN 000384cc forms \
current byte ffff11eb as min(255, ffff1196>>7), and scheduler 00020dfe \
copies it to ffff11b3. FUN 0004fbe2 and FUN 00050018 compare it with the \
Over Run Fuel Cut and Restore table outputs."""
note = [
    """
The scale is code-derived relative to ffff11ae: both bytes originate at \
ffff1196, with shifts of 7 and 8 respectively.""",
]
level = "code"
unit = "rpm/25"

