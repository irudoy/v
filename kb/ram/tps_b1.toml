summary = """
Exact UDS DID 0x120f runtime word and bank 1 throttle-position sensor 1 \
value. Pointer table 0x2289c maps the DID to this address; FUN 000a7418 \
accepts ROM16[0x9550]=60..ROM16[0x954e]=964 counts and dispatches \
P0223/P0222 outside that window."""
note = [
    """
The acceptance window is 0.30..4.82 V at 5 mV per count and brackets the \
factory terminal criteria of more than 0.36 V released and less than 4.75 V \
depressed. The diagnostic display unit is V at 5 mV per count; \
JK08A.diagnostics.md derives that scale.""",
]
