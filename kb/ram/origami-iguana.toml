summary = """
Active-test state of the VTC channel enabled by ffff248b bit 1. FUN 0002e466 \
writes bit 4 at 0002e50a as ffff248b bit 1 and ffff244f bit 1 set with \
vehicle-speed byte ffff110e at most ROM8[000089f1]=2 and raw coolant \
ffff1071 in ROM8[000089f3]=110..ROM8[000089f2]=170, and bit 0 at 0002e522 as \
service-0x30 IOLID 0x19 active flag ffff99c7 bit 0 together with bit 4, \
storing offset ffff1704 = clamp(int8(ffff993c), \
ROM8[0000873e]=-20..ROM8[0000873f]=20) at 0002e54c."""
note = [
    """
The second bank of the same channel is ffff41fb bit 7 from IOLID 0x1a with \
offset ffff1705 (0002e576, 0002e59e). The consumers of the bits are outside \
the exhaust-VTC review.""",
]
