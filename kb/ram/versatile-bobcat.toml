summary = """
Common Q14 gain written by alternating-pass builder 00053698 as \
floor(uint8(ffff160d)*ROM16[0x9332]/256), with ROM16[0x9332]=13972. Pulse \
precursor 0004e974 uses it in signed helper 0002657c(v,ffff165e,-2), \
equivalent to trunc_toward_zero(v*ffff165e/16384)."""
note = [
    """
The arithmetic scale is exact. Factor byte ffff160d spans 225..255, so the \
gain spans 12280..13917, 0.7495..0.8494 of unity 16384; ROM16[0x9332]/16384 \
= 0.8528 is a fixed calibration scalar. With stock pressure slope \
ROM8[0x89FE] = 0 the gain depends only on Base Fuel Schedule, the \
intake-temperature byte, and the engine-speed byte. Its replay from those \
three recorded inputs reproduces both bank pulse words of three 2026-09-17 \
vehicle recordings at a median ratio of 1.000. The builder has the form of \
an injector differential-pressure correction; that physical reading is a \
candidate recorded at ffff160d.""",
]
level = "code"
unit = "ratio_q14"

