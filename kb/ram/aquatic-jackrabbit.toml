First-channel raw endpoint-crossfade result before multiplicative trims. FUN \
0007a592 writes floor((A*(32768-w)+B*w)/32768), saturated to uint16, where \
A/B are the selected endpoint curves and w is ffff31c8."""
note = [
    """
Q15 trim 0001484a is applied after this write when ffff245e.bit6 is set. The \
physical quantity is unresolved.""",
]
