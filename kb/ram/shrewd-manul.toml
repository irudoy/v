summary = """
Multipurpose state byte. On the stock-selected transmission path, FUN \
00077892 sets bit 1 exactly when ffff418f.bit4 is set, current gear index \
ffff1082 differs from target gear index ffff1083, and aggregate inhibit \
ffff4253.bit6 is clear; otherwise it clears bit 1. FUN 0007584e uses bit 1 \
as a forced-neutral override after recovery selection: set writes 0x7fff to \
ffff19d8 and copies shared signed request ffff19c6 into ramp ffff19da before \
auxiliary-output evaluation."""
note = [
    """
Stock ROM8[0x83c1].bit0 and ROM8[0x870c].bit7 select FUN 00077892. Bit 1 \
requires ffff418f.bit4, the scheduler latch of TCM field ffff3a2e == 3 from \
CAN 0x174 byte 4; the 2026-09-22 road captures carry that value in 4-3 and \
3-2 downshifts, so bit 1 is set during those gear changes. Other bits and \
consumers belong to independent state.""",
    """
On 7mfk, FUN 00067188 reads this byte at ffff4252 and tests mask 0x08. Bit3 \
set bypasses the shared MAF and battery coefficient guard without changing \
ffff4970. Its physical mode identity and reachable scheduler states require \
separate evidence.""",
]
level = "code"
unit = "bitfield"

