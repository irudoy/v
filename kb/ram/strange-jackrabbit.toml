summary = """
Live current gear index decoded by FUN 000c47ea from the low nibble of CAN \
0x174 payload byte 3. Input values 1 through 7 are decremented; zero and \
values above 7 publish zero. Scheduler 00020dfe copies the byte to \
ffff1082."""
note = [
    """
CAN 0x174 is the exact standard identifier represented by dispatcher key \
0x2e80 and stock mailbox record 0x9786.""",
]
level = "code"
unit = "zero-based current gear index"

