summary = """
Signed ramp state of rotational-speed request limiter 0007584e. The active \
branch applies fast coefficient 0x9428 while ffff25b0 is nonzero and \
ffff24a3.bit2 is clear, or normal coefficient 0x9426 otherwise, then \
enforces the current-RPM first-column baseline from 0xe98e and upper \
saturation. The inactive branch copies APP request ffff243c when previous \
ffff19d8 is below neutral. A restrictive recovery envelope rolls this state \
back to its entry value; ffff4252.bit1 synchronizes it from ffff19c6."""
note = [
    """
Fast mode normally operates while the ramp is positive; a nonpositive entry \
value sets the latch before rate selection. The physical signed-request \
scale remains unresolved.""",
]
level = "code"
unit = "signed raw"

