summary = """
Forward column coordinate of primary requested-torque surface 0xe98e: FUN \
00073948 interpolates 00015690 over 00015500 at ffff1824 while ffff1824 <= \
ROM16[0x1553e] = 45187, otherwise 000156d0 over 00015540 at min(0xffff, \
ffff1824>>4), and passes the result as the column input with row ffff1702. \
000730fc arbitrates it with inverse coordinate ffff198a."""
note = """
A uint16 forward-conversion column coordinate formed from raw \
opening-area-domain counts divided by engine speed. Engineering conversion \
is unestablished. Retained hypothesis: Catalog QH0 Flow Potential at \
x*0.00152588 percent. The percentage remains candidate coordinate \
presentation and does not claim a measured physical flow or a bound source \
on an unresolved layout. Unverified propositions: QH0 Flow Potential has an \
independently established physical 100-percent reference. The catalog \
percentage measures actual airflow, throttle-opening percentage, or \
normalized fuel schedule. The missing 1nd and 1me3b RAM sources follow \
automatically from their mapped table axes. All homologous target \
coordinates have a measured common physical scale. Source references: \
defs/analysis/throttle/JK08A.throttle-control.md:334-398, \
defs/analysis/can/JK08A.tuning-telemetry.md:107-113, \
patches/can-telemetry.md:331-366."""
