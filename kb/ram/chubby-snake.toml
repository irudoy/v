summary = """
Signed engine-torque state after the spark-efficiency factor. On the stock \
ROM8[00008710].bit5 branch FUN 00065b08 writes \
trunc0(s16[ffff18cc]*(256-F(clamp_u8(s8[ffff23f1]-s8[ffff11a2])))/256), \
where ffff11a2 is the scheduler latch of clamped timing sum ffff11da."""
note = [
    """
F(z)=interp_u8(00011d24,axis 0001199e,z) rises from 0 at zero retard to 179 \
at 40 counts, with F(3k)=k*k over the first seven breakpoints, so the factor \
removes torque as timing is retarded from base angle ffff23f1.""",
]
level = "code"
unit = "signed torque raw"

