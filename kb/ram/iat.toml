summary = """
AN1-derived diagnostic temperature byte. FUN 0003d832 copies the first \
output of shared transfer table 00012dea here, and the exact UDS DID 0x1106 \
pointer entry returns this byte. J1979 Mode 01 PID 0x0F returns ffff3f41, \
the same 00012dea transfer code of the unfiltered lane-0 sample minus 10."""
note = [
    """
Homologous measured Nissan diagnostics identify DID 0x1106 as Intake Air \
Temperature with deg C=raw-50, and J1979 defines PID 0x0F as A-40 deg C, so \
the ECU itself declares the transfer code as deg C+50 and AN1 lane 0 as \
intake air temperature. The SH7058 AN1 channel is exact, while the ECM \
terminal and hardware conversion require validation.""",
]
level = "code"
width = 8
unit = "degC"
scale = "x-50"

