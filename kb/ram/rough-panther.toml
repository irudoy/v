summary = """
TCM reduction-request byte. With stock ROM8[00008b3f].bit4 set, 0006425a \
copies the latched frame 0x177 byte 4 at ffff273a to ffff3373. The stock \
enabled direct path of 00064cb2 shifts the unsigned byte left by eight into \
ffff1866; subsequent torque-ratio and nonlinear timing stages consume that \
state."""
