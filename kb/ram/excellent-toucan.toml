summary = """
Output-driver status bytes of the exhaust magnet outputs: ffff111e and \
ffff111f for bank 1, ffff1120 and ffff1121 for bank 2. Decoder 0004110a \
stores the two-bit fields of channels 2, 3, 0, and 1 of the 16-bit \
diagnostic word of device 1 (ffff1eb2, identifier 0x4000) through the \
channel pointer table at 000232b8, and zeroes them when the word is \
rejected. Scheduler 00020dfe copies them to ffff109e..ffff10a1."""
note = [
    """
The electrical condition behind each code belongs to the driver device and \
is not recoverable from ECU code.""",
]
level = "code"
unit = "driver status code"

