summary = """
Work-support idle byte. Bit 3 marks LID 2 active with accepted status and \
selects ffff3168 in 000420b8; bit 4 is the routed automatic idle request \
that selects the automatic step in 000420b8; bit 5 is the idle record latch \
of 00068040; bit 6 is the automatic idle request of 000682f6; and bit 7 is \
the previous level of LID-2 store bit ffff99f4.bit3."""
note = ["Other bits are not characterized."]
level = "code"
unit = "bitfield"

