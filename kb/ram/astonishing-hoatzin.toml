summary = """
Bank 1 word of the two-word third fuel-trim array in Q8.8 percent \
representation with neutral 0x6400. Init routine 0002c648 and reset function \
0005b708 store 0x6400; FUN 0005b534 steps the word by ROM-defined \
increments, bounds it to ROM8[0x82E4] << 8..ROM8[0x82E5] << 8, and otherwise \
ramps accumulator ffff3310 toward 0x6400 by ROM8[0x86F5] per pass. FUN \
0004ead4 adds the word to the short-term and long-term trims before scaling \
precursor ffff18c0."""
note = [
    """
Stock bounds are 90 and 110 percent. When ROM8[0x8B2A] bit 2 is set both \
writers also copy the result to bank 2 word ffff2a26; stock value 0x09 keeps \
the banks independent. The physical source of the correction is \
unresolved.""",
]
level = "code"
unit = "percent*256"

