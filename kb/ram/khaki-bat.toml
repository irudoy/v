summary = """
Stored work-support idle adjustment, the low byte of record 0x74. Startup \
step 000686b8 restores it, and the idle latch of 00068040 copies ffff3168 \
into it. FUN 000420b8 selects it for ffff56f6 when neither ffff41ef.bit3 nor \
bit4 is set and it is at most 20."""
note = [
    """
Record 0x74 holds stored timing adjustment ffff29c6 in its high byte and \
this byte in its low byte.""",
]
