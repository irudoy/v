summary = """
Current high-resolution engine-speed count written by FUN 000384fe as \
ffff1196>>3. Runtime Base Fuel Schedule producer 0003b75c selects this word \
or ffff11dc in its normal mode, clamps the selected value to at least 64, \
and uses it as denominator N in the primary MAF calculation."""
note = [
    """
The scale follows exactly from companion word ffff11f4=ffff1196>>6 at \
RPM/12.5: ffff11e8 has eight times as many counts, so one count is 1.5625 \
RPM. The stock normal-path minimum of 64 counts is 100 RPM.""",
]
level = "code"
unit = "rpm/1.5625"

