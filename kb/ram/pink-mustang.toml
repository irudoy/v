summary = """
One-bit current-cylinder mask for the high byte of POPCR. On the enabled APC \
path it selects the PULSxROE reset action associated with GR11B; engine \
inhibit ffff4198 bit 1 clears it."""
note = [
    """
The manual proves output-low action on compare. Bit c - 1 addresses cylinder \
c, the cylinder that fires next, and builder 0004e080 places the reset edge \
ffff237a crank degrees before its set edge, so the low state is the dwell. \
The external driver stage and cylinder-to-pin continuity remain hardware \
boundaries.""",
]
level = "code"
unit = "bitfield"

