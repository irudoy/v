summary = """
Unsigned unblended BFS working word produced by the 7mfk rate stage. Cached \
unsigned ffff24b1.bit4 selects the saturated sum branch when clear or the \
nonnegative-difference branch when set. Shifted candidates use a logical \
15-bit shift and unsigned word cap; sum overflow bypasses the shifts and \
caps to 65535. The sum arm increments once when its capped candidate equals \
the previous working word and remains below min(65535,4*Q), with Q \
coherently cached from ffff1062."""
