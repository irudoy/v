summary = """
Trustful requested-torque conversion row coordinate. FUN 0003de4c writes \
max(32, ffff11d0) each pass, and initializer 0002c648 seeds 32. Wrapper \
00026660 passes it to byte core 00026bc4, which multiplies each stored \
0x18716 point by 16, so one row-axis count is 50 RPM. Lookups of 0x175c8 in \
00073a44, 00074728, 000749bc, and 0007acb4 pass it as the row input, inverse \
lookup 00073628 compares it with the 0x18716 points after the same \
multiplication, and 00073a44 divides the doubled trustful opening area by \
it."""
level = "code"
unit = "rpm/3.125"

