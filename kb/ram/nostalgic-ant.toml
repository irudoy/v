summary = """
Latched inhibit byte for the P030 common readiness gate. Coordinator \
00082c8a writes stock value 0x32 when ffff84c3.bit6 is set and unsigned \
ffff2b73 is at least 5; any nonzero value routes to clearing \
ffff4251.bits6/7."""
note = [
    """
A whole-program p-code pass over all 2315 functions found exactly this write \
and read, with no unresolved candidates and no statically resolved clear. It \
is therefore documented as a latch rather than a countdown; reset-time or \
pointer-mediated initialization remains outside the resolved lifecycle.""",
]
