summary = """
Bank 2 MAF-table input word on 7mfk. With ffff3976.bit1 clear, FUN 0003ae8a \
copies diagnostic word ffff101e to ffff1e4a and sets mask 2. With the bit \
set it subtracts the correction computed from the previous unsigned output \
word and bank-specific uint32 input at ffff399c, then stores the low 16 bits \
without a zero clamp. FUN 0003a904 indexes the transfer curve with the low \
12 bits of this word."""
note = [
    """
Init 0002d120 seeds K = 0x00180000, so c = floor(8040/(previous+80)) until \
0003aa12 rewrites K: 32 counts, 0.16 V, at a steady 1 V input. The transfer \
curve therefore follows this word, not diagnostic word ffff101e. The \
physical meaning of the correction remains unresolved.""",
    """
The numerator is floor(K*335/65536), formed from the high and low halves of \
the unsigned 32-bit K word. The denominator is min(65535,uint16(previous \
output)+80). At raw 200 and K=0x00180000, calls produce 200, 172, 169, 168, \
168 from a clear bank flag. This software sequence does not establish a \
physical correction state or its reachability.""",
]
level = "code"
unit = "V*200"

