summary = """
First-channel Q15 crossfade weight scratch. FUN 0007a592 writes \
interpolation result w from map 0000d78e here when ROM8[000083c1].bit7 is \
clear, or substitutes ROM16[00009394]=0x8000 otherwise. It then uses w in \
floor((A*(32768-w)+B*w)/32768)."""
note = [
    """
This word is the weight source-selection result, not the blended endpoint \
output.""",
]
level = "code"
unit = "Q15 fraction"

