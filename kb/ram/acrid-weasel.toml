summary = """
Bit 6 is the selected-temperature transition latch maintained by FUN \
0003967a. Computed START SIGNAL ON with battery-voltage raw below 100 clears \
it and returns coolant. Outside that condition, a clear latch is set while \
coolant is returned once; subsequent calls with the latch set return 0, and \
FUN 000394b8 holds the selected pair through previous-pass images \
ffff107e/ffff1080."""
note = [
    """
The latch state machine is exact. At 0.08 V per count the clearing condition \
uses voltage below 8.00 V.""",
]
level = "code"
unit = "bitfield"

