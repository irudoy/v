summary = """
Judged latch of the P0078/P0084 magnet retarder circuit pair, bits 0 and 1 \
for descriptor indices 0x43 and 0x44. FUN 00090642 evaluates only while the \
bit is clear and the published duty word ffff1aac+2b is zero, and sets the \
bit once fault counter ffff3596+b reaches ROM8[00008b02]=100; FUN 0008f168 \
calls dispatcher 0007d8b8 with the index while the bit is set. Reset helper \
FUN 0008fc6a clears it."""
