summary = """
Multipurpose diagnostic readiness byte. FUN 000804ce sets bit 4 when raw \
coolant ffff1071 exceeds start-latched raw coolant ffff106e by at least 20 \
and sets bit 5 once raw coolant reaches 0x78. FUN 00080b54 clears both bits \
during diagnostic reset; both gate qualification-counter increment in FUN \
0007d856."""
note = [
    """
A 2315-function p-code census found no unresolved writer. Other runtime \
writers preserve bits 4 and 5. Bit 4 is the coolant rise of 20 deg C after \
engine start and bit 5 the coolant temperature of 70 deg C of factory \
driving pattern A.""",
]
level = "code"
unit = "bitfield"

