summary = """
Active-flag byte of service-0x30 Output Control IOLIDs 0x19..0x20 (array \
ffff99c4, bit n-1 of IOLID n): bit 0 is IOLID 0x19, bit 1 IOLID 0x1a, and \
bit 4 IOLID 0x1d. Handler 00030c4c maintains the array, FUN 0002e466 reads \
the byte at 0002e50e for the VTC active tests, and startup 0002e76e zeroes \
ffff99c4..ffff99d3."""
note = [
    """
The value bytes of the same requests are ffff9923 + n (ffff993c, ffff993d, \
ffff9940 for IOLIDs 0x19, 0x1a, 0x1d).""",
]
level = "code"
unit = "bitfield"

