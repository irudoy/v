summary = """
Warm/main intake-cam target byte. FUN 000bda64 writes the output of 0000b43a \
or clamp_u8(output_0000b43a-output_0000ab5a+128) when ffff2466.bit6 is set. \
FUN 000bdc66 selects or blends this value by coolant before the target \
enters ffff2326."""
note = [
    """
The centered representation and intake CVTC target path are exact. The \
engineering conversion raw*0.5-64 crank degrees follows the intake \
edge-phase unit of the actual bytes ffff2442/ffff2443 that the target is \
compared with.""",
]
level = "code"
unit = "centered_u8"

