summary = """
Summed throttle opening area calculated by the second branch of 0003b520: \
min(0xffff, ffff27ac + ffff27ae), where ffff27ac = clamp(ffff27b0 - \
ffff56a2, 0, 0xffff), ffff27ae = clamp(ffff27b2 - ffff56a4, 0, 0xffff), and \
ffff27b0 and ffff27b2 interpolate 0x13202 over 0x155a0 at min(0xffff, \
4*ffff284a) and min(0xffff, 4*ffff284c). FUN_0003b468 forwards it to \
ffff1e60 when ffff4246 bit 6 is clear."""
note = [
    """
The contribution branch sourced by maps 0x141f4/0x14274 does not feed this \
value. The static access census records no writer of subtrahends ffff56a2 \
and ffff56a4.""",
]
