Per-channel curve selector in FUN 000c0d90. For channel param_1, a set bit \
in mask param_1+1 selects 00015ad0; a clear bit selects 00015b10."""
note = [
    """
The two curves are byte-identical in stock JK08A, so the selector cannot \
change the stock output. The condition that controls these bits is \
unresolved.""",
]
