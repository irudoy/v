summary = """
Multipurpose status byte. FUN 00050a06 sets bit 6 while service-0x30 \
IOLID-0x0c Power Balance is active; FUN 00050a34 uses it to replace the \
aggregate mask with cached byte ffff2b2c. Bits 4/5 independently force \
output ffff2c6c to lower/upper limits ffff413a/ffff4138 in 0007b2c8."""
note = [
    """
The diagnostic replacement occurs before the P2119/P1238 ETC auxiliary mask \
is ORed.""",
]
level = "code"
unit = "bitfield"

