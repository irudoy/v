summary = """
Code-channel-1 uint16 throttle target written by 0006f48c after normal, \
mode, lower, upper, and DTC caps. It is the second element of the array \
based at ffff28bc."""
note = [
    """
The percentage is the throttle opening above the learned closed position of \
the throttle position sensor.""",
