summary = """
Common conditioned intake-cam target byte. FUN 000bdc66 starts from the \
coolant-selected main/cold target, or from intake idle source byte ffff1553 \
while ffff24a7 bit 1 is set, applies mode, rate, and offset logic, and \
writes this byte. FUN 0004d2a6 compares the same target with actual \
intake-cam bytes ffff2442 and ffff2443 for both banks."""
note = [
    """
The target role, centered arithmetic, and common use for both intake banks \
are exact. Target-vehicle replay confirms the warm main-map path and \
identifies 1,968 samples in 51 runs where downstream logic forces neutral \
128 despite an active reconstructed map result. The cold-start replays in \
JK08A.cvtc.md reproduce the coolant blend, the idle source byte in the \
stationary cold band, and the direct cold lookup in the moving cold band. \
FUN 000bdc66 writes neutral 0x80 while intake operating bit ffff246b bit 6 \
is clear.""",
]
level = "code"
width = 8
unit = "degCA"
scale = "x*0.5-64"

