title = "Intake CVTC reference update delay"
summary = """
The reference updater requires zero in both reference update paths. CVTC \
initialization, early live rejection and copied cleanup load the stock value \
30. The ATU-II byte countdown loop decrements the nonzero delay every 100 \
base interrupts."""
