note = """
The exact JK08A UDS table maps DID 0x1201 to word ffff11f4. FUN 000384fe \
writes ffff1196>>6. The same producer forms RPM/25 ffff11b3 with a shift of \
7 and RPM/50 ffff11ae with a shift of 8, proving x*12.5 RPM for ffff11f4. \
This exact relation resolves the conflicting x*10 and x*12.5 community \
formulas in favor of x*12.5 for JK08A."""

