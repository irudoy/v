summary = """
Current engine-speed word in RPM/12.5 representation. FUN 000384fe writes \
ffff1196>>6 here. It is returned by UDS DID 0x1201 and is also an \
interpolation input for Fuel Compensation Map 0xA29A and the per-cylinder \
Knock Slice Map accessor 0x1108E."""
note = [
    """
For one U = uint16[ffff1196], W = uint16[ffff11f4] = U >> 6 and B = \
uint8[ffff11e6] = U >> 8 satisfy W = 4*B + ((U >> 6) & 3). The nominal 12.5 \
RPM/count word and 50 RPM/count byte scales do not imply exact raw-value \
equality. Scheduler-latched ffff11ae can represent a different producer \
sample; no exact current-word reconstruction or raw-value ratio to saturated \
byte ffff11b3 is asserted.""",
]
level = "code"
width = 16
unit = "rpm/12.5"

