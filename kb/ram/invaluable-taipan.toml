summary = """
Bank-2 exhaust-cam edge phase byte. IMI4C capture handler 000c2c58 writes it \
at 000c2d2c as 20*segment + floor(20*interval / ffff22bc) through signed \
divider 00021bbc, with the same segment mapping of ffff13b2 as bank 1 and \
interval as the 16-bit difference between capture GR4C and crank reference \
count ffff158a. The update runs only while cylinder index ffff11de is 2, 4, \
or 6 and driver status ffff850c bit 6 is clear, after shifting the previous \
values into ffff1203 and ffff1205. Scheduler 00020dfe copies the byte to \
ffff11c9."""
note = [
    """
The interval word is stored at ffff1a82 and the segment at ffff16f2 through \
window base ffff128c. One unit is 0.5 crank degrees.""",
]
level = "code"
unit = "edge phase raw"

