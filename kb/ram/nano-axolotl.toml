summary = """
Exact UDS DID 0x130a runtime status byte. FUN 0002e2e8 sets bit 4 when \
ffff24d2 bit 3 is set and ffff4255 bit 3 is clear; the DID record supplies \
support mask 0x10. Reviewed Nissan diagnostics identify bit 4 as THRTL \
RELAY."""
note = [
    """
This is the reported throttle-control-motor relay condition. It does not \
identify the physical relay-output pin.""",
]
level = "code"
unit = "bitfield"

