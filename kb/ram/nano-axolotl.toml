note = """
Exact JK08A DID 0x130a returns ffff2c56 and support byte ROM8[0x11a39]=0x10. \
FUN 0002e2e8 constructs bit 4 from control and inhibit flags. Reviewed \
Nissan diagnostic profiles and the factory VQ35HR manual identify the bit as \
the throttle-control-motor relay condition."""

