summary = """
Selected byte factor for the 00012ede path. FUN 00055098 writes \
interpolate(00012ede,00011bfb,min(u8[ffff2442],u8[ffff2443])) when \
ffff246b.bit6 is set and writes bypass constant 64 otherwise. The same \
factor enters FUN 00055098 and FUN 00054ee0."""
note = [
    """
Raw 64 is the bypass-relative identity. Coordinator 00057608 calls 00055098 \
before 00054ee0, so both consumers use the current invocation's selected \
factor.""",
]
level = "code"
unit = "relative factor raw"

