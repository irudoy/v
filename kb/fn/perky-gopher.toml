summary = """
ATU-II IMI4C input-capture handler for the bank-2 exhaust-cam sensor edge, \
installed at interrupt pointer entry 0x2020c. It clears IMF4C in TSR3 \
(fffff480) with mask 0x7f7f, reads capture GR4C (fffff4c6), forms the 16-bit \
difference to crank reference count ffff158a, and stores it as the edge \
interval word at window offset 0x7f6 (ffff1a82). It maps event selector \
ffff13b2 to a segment index (values above 7 minus 5, value 7 to 0, lower \
values plus 5) stored at ffff16f2 and copies normalized interval ffff22bc to \
ffff224c. While cylinder index ffff11de is 2, 4, or 6 and driver status \
ffff850c bit 6 is clear, it shifts ffff1203 into ffff1205 and ffff1201 into \
ffff1203 and writes ffff1201 = 20*segment + floor(20*interval / ffff22bc) \
through signed divider 00021bbc at 000c2d2c. It then increments saturating \
byte ffff4073, the bank-2 edge count of the current window judged by \
000c22dc, while arm copy ffff4120 bit 1 or ffff4121 bit 1 is set, and \
returns with rte."""
note = [
    """
The register identities follow the SH7058 hardware manual: TSR3 at fffff480 \
holds IMF4C in bit 7 and IMF4D in bit 8, and GR4C and GR4D are the channel-4 \
general registers at fffff4c6 and fffff4c8. The pointer table at 0x20000 \
leads the manual vector offsets by one longword (IMI3A handler 0002040c sits \
at 0x201e4). The bank identity follows the consumer chain ffff1201 -> \
ffff11c9 -> monitor index 1 -> descriptor 0xd3 (P0024); one phase unit is \
0.5 crank degrees (ffff22bc is 10 degrees at the 3.2 us capture clock).""",
]
level = "code"
role = "handler"

