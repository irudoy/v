summary = """
Service-0x3b work-support status and routing coordinator. It writes status \
ffff4124 as the first failing check in this order: 0xa2 when afterrun \
countdown ffff42d4 is nonzero or ffff4184.bit6 is set, 0xa3 when coolant \
gate ffff41a6.bit1 is clear, 0xa1 when ffff41b9.bit0 is set, 0xa4 when \
ffff10da is at least 0xe0, 0xa5 when ffff244f.bit5 is clear, 0x10 when \
ffff41a6.bit5 is set, 0xa6 when ffff4184.bit7 is clear, and 0xff otherwise. \
ffff41aa.bit4 is set exactly for 0xff, and ffff4125 is 0 when accepted, 2 \
when 0xa1 is the only failing check, and 1 otherwise. It forms one-pass \
rising edges ffff41aa.bit2, ffff41ee.bit0, and ffff41b3.bit6 of LID store \
bits ffff99f4 bits 1, 3, and 5 against previous levels ffff41aa.bit1, \
ffff41ef.bit7, and ffff41b3.bit5. While the status is accepted, LID 1 \
activity sets ffff424c.bit4, LID 2 activity sets ffff41ef.bit3 and writes \
ffff3168 = unsigned min(ffff99dd, ROM8[0x8909]=20), and LID 3 activity \
copies ffff99de to ffff56ba."""
note = [
    """
Scheduler 00020dfe copies ffff4124 to ffff40cc after the periodic loop, and \
handler 00034194 answers a failed check of that copy with the status as the \
negative response code. The ffff99de slot is service-0x3b LID 3, which the \
JK08A LID-0 support bitmap does not advertise.""",
]
level = "code"
role = "service"
block = "work_support/block"

