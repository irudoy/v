summary = """
Stock-selected transmission request coordinator. It decodes transition \
readiness into ffff4253.bit6 and sets ffff4252.bit1 exactly when \
ffff418f.bit4 is set, current gear index ffff1082 differs from target gear \
index ffff1083, and bit 6 is clear. Each bit-1 pass loads hold byte ffff4413 \
with ROM8[0x8b07] and advances pass counter ffff3443, which every other pass \
clears. It sets ffff41a6.bit3 when bit 1 is set or retained byte ffff4413 is \
nonzero, and clears bit 3 otherwise. With code min(ffff2728, 15), it writes \
floor ffff34da = ROM16[0x144f2+2*code] - 0x8000 while bit 1 is set, the \
counter is at most ROM8[0x11e01+code], and ffff245d.bit2 is set or ffff1210 \
is at most ROM16[0x94b6], and -32768 otherwise. It also derives gear-indexed \
bounded word ffff32ec by applying upper cap ROM16[0x942c] and lower floor \
ROM16[0x94b2], subtracts four times ffff11b6, and publishes signed candidate \
ffff4162: on a bit-1 pass the maximum of the floor and that target term, \
limited to ffff4138 and word B latch ffff2770. A separate 4x4 calibration \
0x0b5ca produces ffff32ea as ten times its interpolated byte."""
note = [
    """
Build the stock-selected transmission transition state and signed request \
candidate""",
    """
Stock ROM8[0x83c1]=0x2c and ROM8[0x870c]=0x44 select this implementation \
through FUN 00077352. Startup clears ffff418f.bit4 and ffff4413. \
ffff418f.bit4 is the scheduler latch of ffff419b.bit4, which FUN 0007724c \
sets when TCM field ffff3a2e (CAN 0x174 byte 4 bits 5..7) equals 3; the \
function therefore sets ffff4252.bit1 only on a pass that follows that field \
value with a gear mismatch and a clear inhibit aggregate, and FUN 0002040c \
decrements ffff4413 so that ffff41a6.bit3 stays set for 307.2 ms after the \
last such pass. The 2026-09-22 road captures carry the field value in 4-3 \
and 3-2 downshifts, and ffff19c6 holds the code-9 floor of 500 for 30 passes \
in one of them.""",
]
level = "code"
role = "driver"
block = "transmission/block"

