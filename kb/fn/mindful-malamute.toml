summary = """
EVAP diagnostic coordinator. It calls the subsystem monitors, consumes \
one-shot status bits, and invokes FUN 0007d8b8 for descriptor indices 0xc9 \
P0444, 0xca P0445, 0x2e P0443, 0xd4 P0452, 0xd5 P0453, 0xd6 P0441, 0x31 \
path-A P0447, and 0x2f P0448."""
note = [
    """
The descriptor identities and dispatcher sites are exact, but the stock \
configuration skips all eight branches. The separate P0451 call at 0xabf96 \
remains outside those configuration gates. Each consumed status bit is \
cleared after handling.""",
]
level = "code"
role = "dispatch"

