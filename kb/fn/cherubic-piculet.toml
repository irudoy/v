summary = """
P0128 balance-surface product accessor. It looks up uint16 map 0000d40e by \
current RPM/12.5 and Base Fuel Schedule. A nonzero aggregate inhibit mask \
ffff22e0 forces zero; otherwise the lookup is multiplied by a \
caller-supplied uint8 coefficient and written as uint32 ffff2d04."""
note = [
    """
Caller 000b6b5a supplies ffff1024, ffff22e0, ffff11bc, and the maximum of \
two selected byte coefficients. Every map and axis cell is zero in stock \
JK03A and JK08A.""",
]
