summary = """
ROM-gated inverse evaluator of the conditional request surface. With both \
gate bits clear it copies the fallback coordinate. Otherwise it builds a \
sixteen-word slice of request_conditional_signed_endpoint_a on the stack by \
row interpolation across the forward context axis, reads the identity \
coordinate table alternate_inverse_request_coordinate as inverse values over \
that slice, and publishes min(800, floor(x*800/727)). 7mfk and the VQ35HR \
layouts repeat the pass over a second surface and can blend the two \
coordinates; JK78C and the VQ37VHR layouts have one surface. Endpoint and \
zero-span cases use separate paths. The physical quantity is unresolved."""
note = [
    """
Entry requires ROM8[000089fa].bit5 or ROM8[00008b29].bit6. Both bits are \
clear in stock JK08A, so only the direct ffff2a7a copy executes. The first \
target is signed16[ffff18ea]+32768 when bit5 is set and \
signed16[ffff3394]+32768 when only bit6 enables the path; the second target \
is signed16[ffff18ea]+32768. Every cell of 0000e28e is zero in stock. JK03A \
preserves this exact function and address layout; VQ35HR JK00D preserves the \
two-surface algorithm, while VQ37VHR 1ND0A preserves a simplified \
one-surface homolog and the same 727/800 range conversion. The physical \
quantity is unresolved.""",
]
