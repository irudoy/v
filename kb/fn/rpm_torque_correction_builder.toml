summary = """
RPM-curve torque-correction builder. It looks up uint16 map 00014c1a, forms \
a nonnegative byte difference selected by ffff4181.bit7, multiplies the \
lookup by that difference, divides by 256, and writes ffff14e2."""
note = [
    """
The live lookup result is consumed inline after its scratch copy to \
ffff14e4. FUN 00065cd8 and FUN 00064a1c consume ffff14e2 in the same signed \
torque-state component as Engine Torque Map 00010b8e. The physical x*0.1 Nm \
scale remains a catalog candidate.""",
]
