summary = """
Diagnostic transport state machine. On the active-response path it observes \
and clears transmit-completion flag ffff82e4.bit7, transitions through \
transport states 3 and 6, sets state 4, and calls service dispatcher \
0002f928. When transmit mode ffff8212 remains 0x06, this path re-enters SID \
0x21 after every completed response and causes the service handler to \
rebuild the payload from the current dynamic-list sources."""
note = [
    """
The function owns additional receive, timeout, and session-state paths. The \
recorded claim is limited to the exact continuous-response redispatch \
path.""",
]
