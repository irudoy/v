title = "Scale the transient calibration lookup into the runtime threshold byte"
summary = """
Transient threshold builder. It uses x=clamp_u8(16*u8(ffff1a58)-2704) to \
look up 0x11f6a into ffff1394. With c=clamp(u8(ffff479e),55,85)-50 it writes \
ffff1393=min(255,floor(2*(ffff1394*c+25)/25)), then updates a separate mode \
bit."""
note = [
    """
Code establishes a scaled state threshold. Catalog matches place 0x11f6a in \
the Initial Retard Quantity family but do not identify which transient mode \
or prove that ffff1393 is an applied retard amount.""",
]
level = "code"
role = "accessor"
block = "unattributed/block"

