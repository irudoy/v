summary = """
Composite status/RPM fuel-inhibit contributor. It combines stock-inert \
lifecycle-zero status ffff41ea.bit7, an 1800/1600 RPM state gated by \
ffff245d.bit6 and ffff2458.bit5, and a high-RPM state selected by \
ffff24ce.bit2 or ffff24d2.bit0."""
note = [
    """
Combine a lifecycle-zero direct seed with two live status-gated RPM \
fuel-inhibit paths""",
    """
Normal startup and both recovery paths clear ffff41ea. A 2315-function \
p-code census finds only runtime writers 0007c166, 00050920, and 0007f870, \
all of which preserve bit 7; the recovered DMAC does not overlap the byte. \
Stock map 00012a32 is all 0xff, producing a 6375 RPM high boundary with 200 \
RPM hysteresis. Two calls with index -1 are inert.""",
]
