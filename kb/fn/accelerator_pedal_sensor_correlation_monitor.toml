summary = """
Accelerator-pedal sensor correlation monitor for P2138 with a \
pedal-dependent tolerance. It forms d1=|u16[ffff2692]-u16[ffff2694]| of the \
clamped channel pair and d2=|s16[ffff269c]-s16[ffff26a0]| of the signed \
offset-corrected channel pair. While ffff4184 bit 7 is clear and ffff4186 \
bit 7 is set, it only clears stored record 0xe3 through 0008c348 while \
ROM8[00018702] bit 3 is set. Otherwise it looks up tolerance \
t=lookup(00023dd4, min(255, 2*ffff269a)) through 00026370. While d1 or d2 \
exceeds t, START SIGNAL bit 6 of ffff4184 is clear, battery-voltage snapshot \
ffff1108 is at least 0x64, ffff41b6 bit 4 is clear, and ROM8[00018702] bit 3 \
is set, it sets pending bit 7 of ffff4220 and loads countdown ffff256e with \
0x32 on the first pass, and on later passes reports runtime record 0xe3 \
through 0007d8b8 once ffff256e has reached zero, without further writes. In \
every other state of the check it clears ffff4220 bit 7 and loads ffff256e \
with 0x32."""
note = [
    """
000a72d4, which diagnostic periodic dispatcher 0007bfc4 calls at 0007c10c, \
runs pedal range monitors 000a7040 and 000a70f0 and then this function at \
000a72de. The descriptor of record 0xe3 carries P2138 (APP SENSOR, EC-526 of \
the 2007 G35 manual). ffff2692 and ffff2694 are scheduler snapshots of \
ffff2796, which pair selector 0006ec68 sets to channel ffff27a0 clamped at \
zero, or to channel ffff27a4 under ffff24c8 bits 2 and 3, and of ffff2798, \
which 0007295c sets to channel ffff27a4 clamped at zero, or to channel \
ffff27a0 under ffff24c8 bits 2 and 4; ffff269c and ffff26a0 are snapshots of \
signed channels ffff27a0 and ffff27a4. ffff269a is the snapshot of ffff279e, \
which 0006f168 sets to min(255, (min(ffff2796, ffff2798)*0x505b)>>16). Stock \
00023dd4 holds 34, 47, 60, 120, 160, 160, 160, 160 counts, 0.17 to 0.80 V at \
5 mV per count, over nodes 0 to 224 in steps of 32. ffff256e lies in the \
10.24 ms byte block of 0002040c, so 0x32 counts are 512 ms; stock \
ROM8[00018702]=0xf9 enables the record, and 0x64 is 8.00 V at 0.08 V per \
count.""",
]
level = "code"
role = "monitor"
block = "sensor_monitors/block"

