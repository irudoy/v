summary = """
Second accelerator-pedal sensor range monitor. It reads diagnostic value \
ffff26a2, accepts ROM16[0x8ffc]=60..ROM16[0x8ffa]=1000 counts inclusive, and \
dispatches exact JK08A descriptor indices 0xe1 and 0xe2 for P2128 and \
P2127."""
note = [
    """
The exact ROM descriptor catalog identifies the two dispatcher indices as \
accelerator-pedal position sensor 2 high and low circuit faults. The upper \
limit is 5.00 V at 5 mV per count, exactly twice the 2.5 V terminal maximum \
of this sensor, because the published word is referred to the sensor-1 \
scale.""",
]
level = "code"
role = "monitor"
block = "sensor_monitors/block"

