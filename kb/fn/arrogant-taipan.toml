role = "monitor"
contract = """
Not arithmetic: incremental ROM self-test scanner. It takes no arguments. \
Each call scans the next group of longwords from cursor 0xFFFF2FF4, \
accumulates XOR in 0xFFFF3000 and a sum in 0xFFFF3008, and advances the \
cursor. It returns no result: r0 contains garbage at both rts instructions, \
while r12-r14 and PR are preserved. Execution is gated by bit 7 of \
0xFFFF4184."""
