descriptor table 0x225F4 to clear [ffff84a0,ffffa314) and effective span \
[ffff1000,ffff5cf4), whose unaligned descriptor stop is ffff5cf2; the latter \
includes previous-pass bytes ffff107e..ffff1080, fuel-inhibit prerequisite \
bytes ffff2494 and ffff418c, diagnostic status byte ffff41ea, and AN1-path \
state ffff3f3e, ffff3f44, and ffff3f4c. The function then continues its \
non-returning service loop."""
note = [
