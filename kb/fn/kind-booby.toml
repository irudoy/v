summary = """
Periodic stock HCAN1 payload-serialization coordinator. It maintains the \
transmit phase counters, scans only firmware type-3 records, invokes the \
ID-specific serializer, and updates the ten-byte software record and ready \
state used by the subsequent 000c38de scan."""
note = [
    """
Entry 63 at word 00021930 of the 69-entry table 00021834 calls this function \
after 000c38de, so payload preparation is for a later scan. A custom type-4 \
mailbox remains outside this serializer.""",
]
