summary = """
Generic table-driven DTC monitor with 0x38-byte entries rooted at ROM \
0x23ac4. Entry 6 at 0x23c14 tests word fffff754 with mask 0x0004, requires \
low mode bits of ffff1098 to equal 1, uses state byte ffff4348, and \
dispatches descriptor index 0xd7 through FUN 0007d8b8."""
note = [
    """
Descriptor record 0x19d74 identifies entry 6 as path-B P0447. Its only \
caller, FUN 000a6fee, skips entry 6 in stock JK08A because \
ROM8[0x18700].bit0 is clear.""",
]
level = "code"
role = "monitor"
block = "sensor_monitors/block"

[[diagnostic]]
id = "evap-vent-open-b-p0447"
kind = "monitor"
label = "DtcCode"
key = "P0447"
claim = {label = "RomDtcDescriptor", id = "jk08a:00019d74"}
applicability = "exact_rom"
scope = "exact-rom"
priority = 98
level = "code"
note = """
Table entry 6 dispatches exact path-B descriptor index 0xD7 for P0447. Its \
only caller skips the entry in stock JK08A because ROM8[0x18700].bit0 is \
clear."""

