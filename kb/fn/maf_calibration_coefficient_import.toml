summary = """
Import step of the MAF coefficient. At state byte ffff2985 equal to 7 it \
reads configuration key 0x7f through stable wrapper 0006727c, stores the \
result in ffff4970, and advances the state to 0 when the value lies within \
ROM8[0x87f9]<<8=0x7900..ROM8[0x87f8]<<8=0x8700 or to 8 otherwise."""
note = [
    """
Sibling step 000686b8 imports keys 0x74 and 0x7e through the same wrapper. \
Together with calibration stage 0006635c this closes the lifecycle of \
non-stock in-range coefficients.""",
]
