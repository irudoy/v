summary = """
Accessor for table-based lower bound 00012758. Lookup by \
clamp(2*(uint8[ffff10f4]-0x50),0,255) is written to ffff16b0 and through max \
limits a local uint8 aggregate below before passing the composite result to \
00041f2c. While ROM8[0x870e].bit0 is clear it also writes work-support idle \
adjustment ffff56f6 (CONSULT TARGET IDLE RPM ADJ): zero with ffff41b9.bit0 \
set, unsigned min(ffff3168, ROM8[0x8909]=20) with ffff41ef.bit3 set, \
(ffff10da>>5)<<2 below 0xc0 and 4 from 0xc0 with ffff41ef.bit4 set, and \
otherwise stored adjustment ffff316a when it is at most 20 and zero when it \
is larger. It then raises the local aggregate to at least min(255, \
ffff56f6+ROM8[0x12754]=44)."""
note = [
    """
Every cell of 00012758 equals 44. The contract of 00041f2c and physical \
aggregate quantity are unresolved. Scheduler 00020dfe copies ffff56f6 to \
ffff5690, which DID 0x112e publishes; the homologous profile scale of 12.5 \
rpm per count gives the 20-count limit as 250 rpm.""",
]
level = "code"
role = "accessor"
block = "idle_air/block"

