summary = """
Descriptor-class status handler selected by common dispatcher 0007d8b8 when \
descriptor byte 8 bit 6 is set. It always sets bits 0 and 1 in the \
descriptor runtime record's third byte. With any ffff5b2b bit 4..6 set, it \
calls FUN 0008c942, which sets record bits 3 and 6. With all three selector \
bits clear, it sets record bit 5, calls FUN 0008c968 to set record bit 4, \
and sets global ffff5b2c.bit3."""
note = [
    """
The two branches are tied to reporter argument polarity through \
ffff5b2b.bits4..6. Internal runtime-record bits are not assigned UDS status \
names.""",
]
level = "code"
role = "dispatch"

