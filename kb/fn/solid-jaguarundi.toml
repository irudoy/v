summary = """
State controller using shared nonzero gate curve 000122d2. When its read \
gates pass, it interpolates the curve by uint16[ffff11b8] over axis 00014d2a \
and writes ffff2524. A retained-value branch and the following transition \
logic test only whether ffff2524 is zero."""
note = [
    """
The interpolated magnitude is not consumed. The physical state, coordinate, \
and timing represented by the gate are unresolved.""",
]
