summary = """
P0128 inverse-weight term accessor. It derives a model-temperature-minus-IAT \
difference in 0.02 deg C units, selects a byte coefficient by previous-cycle \
coarse vehicle speed <=2 or >2 counts, applies inverse map weight \
255-min(lookup_u16(00014cca),255), scales by the nonzero 00015bf0-derived \
parameter, and writes the uint32 result to ffff2f98."""
note = [
    """
Caller 000b6b5a supplies all four inputs and is the sole reader of ffff2f98. \
Stock maps 00014cca and 00015bf0 and axis 00013b38 are zero; 00015bf0 is \
replaced with one. Both speed coefficients and both coordinate constants are \
zero, so the stock result is always zero in JK03A and JK08A.""",
]
level = "code"
role = "accessor"

