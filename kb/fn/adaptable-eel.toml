summary = """
Centered two-bank gated multiplier and composite accumulator. When \
ffff246b.bit6 is set, it interpolates map 00012ede on axis 00011bfb by \
min(u8[ffff2442],u8[ffff2443]); otherwise it substitutes raw 64. It writes \
the selected factor to ffff1b14 and calculates \
ffff15ce=min(65535,u16(ffff2ff0)+((u8(ffff1680)*u8(ffff193d)*u8(ffff1955)*u8(ffff1b14))>>12))."""
note = [
    """
The exact x/64 scale of 00012ede is relative to the bypass substitution: 64 \
reproduces the bypass factor and 18 contributes 18/64 of it. The shared >>12 \
does not assign an absolute fixed-point scale to all four factors or \
physical units to ffff15ce. VQ35HR JK00D homolog FUN 00056fc8 preserves the \
same 312-byte control and arithmetic structure with map 0001528b, axis \
00013eb8, and a different gate bit. The physical subsystem remains \
unresolved.""",
]
