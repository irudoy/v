summary = """
Complete 7mfk RAM-only reference learner with natural diagnostic predicate \
and returns."""
note = """
The complete entry selects a legal one-based channel c in 1..6 from the bit3 \
scalar and the two declared channel bytes. With both queried diagnostic \
byte1.bit7 results clear, it updates eight uint16 reference words from eight \
uint16 samples using byte weight W, coefficient sum 255 and a conditional \
increment. Either queried result set resets all six eight-word rows using a \
raw ROM word. The CPU-only envelope executes the real predicate and natural \
returns. Its caller, acquisition, diagnostic producers, scheduling, physical \
channel order, units and hardware behavior are separate facts."""
role = "consumer"
block = "knock/block"

