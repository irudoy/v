summary = """
Lagged request and ratio stage of the torque state. It looks up weight \
w=lookup(00014e52, ffff11b3<<8) through 000263f4 and writes it to ffff1608, \
forms T=min(0x7fff, s16[ffff19c6]+u16[ffff2408]+u16[ffff2410]), and updates \
first-order lag ffff199e to (T*w+F*(0x10000-w))>>16, adding one while the \
result is below T and equals the previous value F. While ffff24a3 bit 3 is \
clear it fills the ten-word history ffff19f6..ffff1a08 with the lag value \
and sets the bit. It writes to ffff19a0 the lag value of ROM8[00008c61] \
passes earlier, at most ten, or the current value while ROM8[00008c61] is \
zero, then shifts the history by one word and stores the current value at \
ffff19f6. With D=ffff18d4 while ROM8[000083c1] bit 5 is set and D=ffff19a0 \
otherwise, it writes ffff34d6=trunc0(D*(6-ffff16a3)/6) while ROM8[00008b38] \
bit 1 is set and D otherwise. Ratio byte ffff186c takes min(255, max(0, \
trunc0(256*S/ffff34d6))) with \
S=s16[ffff19cc]+u16[ffff2408]+u16[ffff14e2]+u16[ffff2410], and ratio byte \
ffff1864 the same form with s16[ffff34b8] in S and divisor ffff19a0; each \
reads 0xff while its source word ffff19cc or ffff34b8 equals 0x7fff, and \
with a zero divisor 0xff for positive S and 0 otherwise."""
note = [
    """
00065434, entry 66 of the 124-entry periodic table at 0002196c, calls it at \
00065446. Stock table 00014e52 holds 8000 in every cell, a new-value weight \
of 8000/65536, and stock ROM8[00008c61]=4, ROM8[000083c1]=0x2c, and \
ROM8[00008b38]=0x63 select the four-pass delay, divisor source ffff18d4 of \
000655b4, and the (6-ffff16a3)/6 factor. 00079030 writes ffff19cc and \
ffff19c6. L0 readers are 00065270 for ffff186c and 00079358 for ffff1864; L0 \
records no reader of ffff1608, ffff19a0, or ffff34d6.""",
]
