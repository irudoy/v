summary = """
Three-coordinate endpoint normalizer. It interpolates lower endpoint L from \
000154e0 and upper endpoint U from 000154c0 by ffff113c, forms \
span=max(0,U-L), and normalizes 32768 plus signed int16 inputs \
ffff338c/ffff338e/ffff3396 minus L into ffff3478/ffff347a/ffff347c on a \
capped 0..800 domain. A zero span writes 800 to all three outputs."""
note = [
    """
Both stock endpoint curves are zero, so span is zero and every normalized \
output is exactly 800. FUN 0007ae80 consumes all three values. Code \
establishes the endpoint and normalization roles but not the physical input \
quantity or engineering unit.""",
]
level = "code"
role = "accessor"
block = "torque_request/block"

