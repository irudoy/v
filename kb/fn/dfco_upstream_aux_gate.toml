Auxiliary upstream DFCO gate. It requires ffff4184.bit6 clear and \
ffff244f.bit5 set. It normally returns true; one exception returns false \
when ffff41a5.bit2 is set, ffff41bd.bit0 is clear, and both ffff34e4 and \
ffff34e6 are below 20."""
