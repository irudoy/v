summary = """
Entry of the exhaust cam reference monitor family, called from 0007c166. It \
calls reset 00090e02 while ffff424f bit 2 is set. On a scheduler tick \
(ffff84c3 bit 7) it calls coordinator 00090a84 and then 00090bd2 for bank 1 \
under ROM8[000186f1] bit 3 and for bank 2 under bit 2. It forms ffff24ab bit \
3 as engine-speed byte ffff11b2 at least ROM8[00008e33]=0 with release \
offset 16, and calls 00090d54 for bank 1 under ROM8[000186f2] bit 5 and for \
bank 2 under bit 4."""
note = [
    "With the stock masks 0xf0 and 0x07 neither 00090bd2 nor 00090d54 runs.",
]
level = "code"
role = "dispatch"
block = "vtc_monitors/block"

