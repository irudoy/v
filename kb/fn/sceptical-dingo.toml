summary = """
Paired accessor for 1D-8 maps 0001234a and 00012342 by uint8 ffff1070. Both \
lookups are represented as x<<8 and added with saturation at 65535; the high \
byte of the sum is written to ffff15b1. Raw results are also written \
separately to ffff15b5 and ffff15b0."""
note = [
    """
000474a4 uses ffff15b1 with coefficient 2. The physical quantity of the sum \
is unresolved.""",
]
level = "code"
role = "accessor"
block = "idle_air/block"

