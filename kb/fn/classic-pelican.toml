summary = """
EVAP negative-pressure leak transform. It maps baseline-relative coordinate \
ffff2c92 through 000152d6 into ffff3240, compares that result with the \
caller-supplied lookup at corrected coordinate ffff2c98, and writes zero \
when the transformed difference is nonpositive. A positive difference is \
normalized with caller parameter ffff2c86 and saturated into ffff3018. The \
final output is sat_u16(uint8[ffff2f8d] * uint16[ffff3018] * uint8[ffff2f94] \
>> 14)."""
note = [
    """
Caller 000b29b8 supplies the second 000152d6 lookup result in r5, ffff2c86 \
in r4, and output pointer ffff301c in r6. The arithmetic and saturation are \
exact. Physical pressure conversion and the factory Service 06 leak-area \
publication conversion are not connected to this internal result by code.""",
]
level = "code"
role = "service"

