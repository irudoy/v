summary = """
Accelerator-pedal high-state comparator. It compares normalized dual-channel \
sample ffff266e with ROM16[00008fdc]=610 when previous-cycle state ffff246d \
bit 7 is clear and with ROM16[00008fde]=528 when that state is set. The \
result is written to current state ffff246a bit 7."""
note = [
    """
Scheduler 00020dfe copies ffff246a to ffff246d once per cycle, closing \
activation/release hysteresis. The input producer traces to A/D channels \
AN10 and AN17. Exact diagnostic bindings identify the paired analog \
subsystem as accelerator-pedal sensors; no engine-speed path reaches this \
comparison.""",
]
level = "code"
role = "monitor"
block = "pedal/block"

