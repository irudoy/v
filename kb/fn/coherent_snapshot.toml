summary = """
Periodic scheduler and snapshot copier reached from the main loop when \
ffff84b9 bit 2 is pending; handler 0002040c sets that bit every tenth base \
interrupt. It moves current Base Fuel Schedule ffff1024 to previous sample \
ffff1028 and then copies newest producer word ffff1026 to ffff1024. It calls \
block copier 00022104 with source ffff1048, destination ffff102c, and length \
0x1c, establishing the internal normalized-BFS load snapshot ffff1048 -> \
ffff102c. It copies ffff1072..ffff1079 to ffff106a..ffff1071, establishing \
ffff1076 -> ffff106e for selected raw temperature, ffff1077 -> ffff106f for \
normalized coolant, ffff1078 -> ffff1070 for selected normalized \
temperature, and ffff1079 -> ffff1071 for raw coolant. It also copies \
ffff1114..ffff1193 to ffff1094..ffff1113 and ffff11d4..ffff120b to \
ffff119c..ffff11d3, establishing ffff1188 -> ffff1108 for battery voltage, \
ffff118e -> ffff110e for coarse vehicle speed, ffff11e6 -> ffff11ae for \
RPM/50, ffff11ea -> ffff11b2 for saturated RPM/12.5, ffff11eb -> ffff11b3 \
for RPM/25, and ffff11f4 -> ffff11bc for the RPM/12.5 word, ffff1200 -> \
ffff11c8 and ffff1201 -> ffff11c9 for the exhaust-cam edge phase bytes. It \
copies ffff120e..ffff124b to ffff124c..ffff1289 through FUN 00022558, \
establishing ffff1246 -> ffff1284 for the exhaust-VTC bank-enable snapshot. \
A 0x104-byte call to FUN 00022558 copies ffff277e..ffff2881 to \
ffff267a..ffff277d, including ffff283a -> ffff2736 and ffff2876 -> ffff2772 \
for the oil-temperature snapshot. It copies ffff2451/ffff2452 to \
ffff244f/ffff2450, shifts ffff2458 to previous snapshot ffff245a, copies \
producer ffff2459 to current snapshot ffff2458, and copies \
ffff246a..ffff246f to prior-cycle state. It copies tick-flag byte ffff84c4 \
to ffff84c3 at 00020ee6 and reloads ffff84c4 from ffff84bb at 00020ef0, \
copies ffff2324..ffff2329 to ffff231e..ffff2323 at 00021308 and to \
ffff232a..ffff232f at 00021310, and copies ffff4124..ffff417b to \
ffff40cc..ffff4123 at 0002132c, establishing ffff4178 -> ffff4120 and \
ffff4179 -> ffff4121 for the edge-count arm bytes. A 0x8c-byte call to FUN \
00022558 at 00021314 copies ffff23bc..ffff2447 to ffff2330..ffff23bb, \
establishing ffff23d4 -> ffff2348 for the transformed injection-pulse array, \
ffff241c -> ffff2390 for the minimum pulse, and ffff2436 -> ffff23aa for the \
injector opening time. Before its periodic loop it copies ffff417e to \
ffff4180 and ffff417f to ffff417e at 00021076 and 0002107e, ffff4184 to \
ffff4186 and ffff4185 to ffff4184 at 0002108c and 00021092, and ffff41a6 to \
ffff41a8 at 000210ba; the ffff1114 block copy at 00020f56 establishes \
ffff115a -> ffff10da. The loop at 000212ec calls the 124 pointers at \
0x2196c..0x21b58 in order. After the loop a 0x66-byte call to FUN 00022558 \
at 00021334 copies ffff56b2..ffff5717 to ffff564c..ffff56b1, establishing \
ffff56b2 -> ffff564c for the work-support timing adjustment and ffff56f6 -> \
ffff5690 for the work-support idle adjustment."""
note = [
    """
Periodic state copier including normalized-BFS load snapshot and scheduler \
dispatch""",
    """
The copy directions, lengths, exact offsets, and every-tenth-interrupt \
cadence are code-proven. The ffff1048 block copy runs before periodic tasks \
produce the next ffff1026 and ffff1048 values, so ffff102c is the coordinate \
consumed during the current pass. Exact DID 0x1103 identifies ffff1188 as \
battery voltage. Normal timer initialization makes this scheduler cadence \
exactly 204800/Pphi seconds; passive target-CAN timestamps establish Pphi=20 \
MHz and 10.24 ms per pass.""",
    """
Independent 7mfk execution covers only 00020f04..00020f1a and the length-28 \
stock copier selection. It shifts BFS current to previous, refreshes current \
from newest, and copies ffff1048..ffff1063 to ffff102c..ffff1047 through \
seven descending longword stores. The table entry at 00022174 selects \
0002213a; the dispatcher delay slot reads offset 24 and the natural return \
delay slot restores R3. Five declared RAM pointers alone are aliased after \
byte identity. The simulator boundary at 00020f1c restores PR from SP+0 \
outside all tested instructions. Source bytes, newest BFS, neighbors, MACL, \
GBR, and saved registers remain unchanged. These cases establish no other \
copy length, complete scheduler execution, live cadence, or hardware \
atomicity.""",
]
