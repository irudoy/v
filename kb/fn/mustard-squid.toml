summary = """
Complete bank-indexed MAF contribution producer on 7mfk. Byte-truncated \
indices 0 and 1 select input words, base and correction state, residual, \
latch, and output longword. ffff2462.bit0 permits active correction only \
with ffff2449.bit7 and ffff24b8.bit3 clear and selected latch zero; either \
inhibitor writes latch 3. Active arithmetic distinguishes truncation toward \
zero at /8, /512, and /256 from floor at the final /64. Fallback multiplies \
the longword reference modulo 32 bits before logical shifts. Both modes cap \
the nonnegative output at 0xffffff and preserve all sibling-bank state."""
