instructions and delay slots, and the called six-shift signed /64 helper. \
Only five declared RAM pool words are aliased after byte identity. Explicit \
0003b042 post-base contexts execute otherwise unreachable 24-bit residual \
and active output caps with the complete saved stock frame; wide fallback \
references and fixture-only weight variants have no live reachability claim. \
Five active calls with fixed filtered input 1000, zero references, and \
initial correction zero publish 5782,5939,6094,6249,6403 while only the \
producer-owned correction changes. This sequence does not execute reference \
refreshers or reproduce scheduler cadence. Physical correction identities \
and scales remain unresolved.""",
