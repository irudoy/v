summary = """
Composite four-factor calculation. Tables 0x11E46, 0x11E56, and 0x11E5E \
produce three coefficients for base byte ffff1294; the product is normalized \
by 2^24, written to ffff22f8, and its zero/nonzero state controls bit 0 of \
ffff2473."""
note = [
    """
The physical purpose of the composite coefficient is unresolved. Scale x/256 \
is established for 0x11E56; normalization allocation across the other \
factors remains in their individual claims.""",
]
level = "code"
role = "accessor"
block = "ignition_timing/block"

