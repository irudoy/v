summary = """
Common complementary DTC-state updater. For ordinary descriptor indices it \
clears state bit 0, calls FUN 00025d02, sets state bit 2, and clears pending \
bit 6 when appropriate. Indices 0xd8/0xd9 and 0xda/0xdb use grouped handling \
coordinated with descriptor 0x30."""
note = [
    """
This helper is distinct from common fault dispatcher FUN 0007d8b8. A call to \
this function does not by itself identify a fault-producing branch.""",
]
