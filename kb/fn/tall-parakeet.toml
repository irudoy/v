summary = """
Fuel-level signal conditioner and EVAP coordinate publisher. It scales \
ten-bit meter CAN field ffff3e24 by 39680/1024, maintains held and low-pass \
words, gates the live coordinate by diagnostic result-state indices 0x14a, \
0x45/P0461, 0x46/P0460, and -1, evaluates 00014bca, and writes ffff282e for \
the periodic snapshot to ffff272a."""
note = [
    """
All 16 map cells are 0xffff. The output remains live through ffff272a, which \
has seven reads in four EVAP functions.""",
]
level = "code"
role = "monitor"

