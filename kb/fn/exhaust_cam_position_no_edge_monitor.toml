summary = """
Exhaust-VTC position-sensor monitor, path A (no-edge), called from 0008f168 \
with the bank in r4 and the enable in r5. With the enable set it sets bit b \
of arm byte ffff4178 (000900d2 under interrupt mask when both arm bytes were \
clear for the bank, raising reset request ffff850c bit 7 at 000900d8; \
000900f4 otherwise); while indicator ffff850d bit 6 + b is clear it reloads \
timer ffff43be + b with ROM8[00008e23]=100 at 0009016a, and when the \
indicator is set and the timer (read at 0009010e) has expired it sets judged \
latch ffff3580 bit b at 0009011c. A clear enable clears the arm bit at \
00090168 and reloads the timer at 0009017a, and a set judged latch clears \
the arm bit at 00090182."""
note = [
    """
The arm bit reaches capture handler 000c2de0 and monitor 000c22dc through \
scheduler copy ffff4120. Timer ffff43be + b lies in the 102.4 ms block of \
base-tick handler 0002040c, so the reload of 100 is 10.24 s.""",
]
level = "code"
role = "monitor"
block = "vtc_monitors/block"

