title = "Misfire timing input refresh"
summary = """
Copies history slots 3, 8, and 9 into the timing words, or scales selected \
inputs by Q15 factors indexed by cylinder when the correction gates pass. A \
selected correction with an out-of-range cylinder retains the previous \
timing words."""
