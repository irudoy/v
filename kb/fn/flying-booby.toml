summary = """
ASCD control task and steering-switch decoder. It copies prior stable code \
ffff2a85 to ffff2a86, accepts a new stable code only when samples \
ffff2701..ffff2705 all match, and packs diagnostic bytes ffff2a83 for DID \
0x130D and ffff2a84 for DID 0x130E."""
note = [
    """
The five-sample buffer producer remains unresolved. The homologous VQ35HR \
factory manual establishes an analog resistor ladder at ECM terminal \
M107-101, but the exact JK08A ADC channel and MCU pin are not traced.""",
]
level = "code"
role = "driver"

