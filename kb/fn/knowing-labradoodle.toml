summary = """
Signed comparator with an optional subtractive hysteresis offset. FUN \
0004d2a6 uses it to maintain ffff24a9.bit6 from raw coolant snapshot \
ffff1071, ROM8[00008e00]=170, and offset 3."""
note = [
    """
With bit 6 clear, the caller sets it while ffff1071<=170. With bit 6 set, \
subtracting 3 retains it through ffff1071=173 and clears it at \
ffff1071>=174. The comparator contract is exact; the physical coolant \
conversion remains separate.""",
]
level = "code"
role = "service"
contract = """
It returns uint8 1 iff int32(r4 - (uint8(r7) != 0 ? r6 : 0)) <= int32(r5); \
otherwise it returns 0. It reads and writes no memory."""
contract_level = "code"

