title = "Convert the bounded shared request to the stock opening-area request"
summary = """
Periodic-table index-22 request-to-area coordinator. It calls 00073432 after \
ffff19c6 publication, forms local threshold ffff1734 from lookups 0x15062 \
and 0x15082, arbitrates inverse request coordinates with ffff1980 and state \
bits, converts the selected coordinate through 0x15500/0x15690 or \
0x15540/0x156d0, applies ffff1702 and ROM8[0x8d8f], and clamps the result \
through the first 0x13202 value before writing unsigned area-domain request \
ffff183e. The direct ffff1984 branch is guarded by ROM8[0x870c].bit7 and is \
disabled by stock value 0x44; the stock-active path uses already-arbitrated \
ffff198a."""
note = [
    """
The request-to-area role and stock branch selection are exact. \
Requested-torque, airflow, opening-area units, and their catalog scales \
remain candidate physical semantics.""",
]
