summary = """
Purge-control circuit monitor feeding P0443. It samples word ffff10c4, \
clears ffff247f bits 6 and 7 on reset, and sets bit 7 under its final \
calibrated result gates. FUN 000abca2 consumes bit 7 and dispatches \
descriptor index 0x2e."""
note = [
    """
The exact descriptor is P0443, but FUN 000abca2 skips this monitor in stock \
JK08A because ROM8[0x186d7].bit2 is clear. The complete physical circuit \
metric and units remain unresolved.""",
]
level = "code"
role = "monitor"
block = "evap/block"

[[diagnostic]]
id = "evap-purge-circuit-producer-p0443"
kind = "monitor"
label = "DtcCode"
key = "P0443"
claim = {label = "RomDtcDescriptor", id = "jk08a:00019588"}
applicability = "exact_rom"
scope = "exact-rom"
priority = 98
level = "code"
note = """
FUN 000acc54 produces ffff247f bit 7 for the exact P0443 path, which is \
configuration-disabled in stock JK08A. The function target keeps this \
diagnostic claim separate from unrelated bits in the shared state byte."""

