summary = """
Combined MAF diagnostic producer. It forms \
S=uint16[ffff1058]+uint16[ffff105a]+uint16[ffff2368], applies a first-order \
filter selected by ROM8[0x8a08]=1 through left-shift helper 000221bc, \
saturates the result into ffff1df4, and writes \
ffff105c=max(ffff1df4-ROM16[0x93ce],0). FUN 0003c3ac converts ffff105c to \
exact DID 0x1209."""
note = [
    """
The mass-airflow identity is exact through DID 0x1209. The \
community-measured raw/100 g/s conversion is the working candidate; hardware \
validation remains required.""",
]
level = "code"
role = "service"
block = "airflow_load/block"

