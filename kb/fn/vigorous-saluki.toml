summary = """
First signed-state channel using forward nonlinear table 00011d24. When \
ROM8[00008710].bit5 is clear, it forms bounded x0 and x1 from \
s8[ffff23f1]-s8[ffff2404], channel byte ffff11c2, and unsigned corrections \
ffff12df/ffff15ea, then calculates \
trunc0(s16[ffff18cc]*(256-F(x1))/(256-F(x0))). When bit5 is set, an equality \
branch copies ffff18ce; the other branch calculates \
trunc0(s16[ffff18cc]*(256-F(x))/256). The saturated signed result is written \
to ffff18d4."""
note = [
    """
F(z)=interp_u8(00011d24,axis 0001199e,z). Denominators are nonzero because \
the table maximum is 179, so 256-F(x)>=77. The exact channel arithmetic is \
established; the physical state and units are unresolved.""",
]
