summary = """
Crank and cam sensor fault predicate. It returns 1 when record predicate \
00025e20 reports the stored-fault bit for any of runtime indices 0x14, 0x47, \
0x48, 0x49, 0x4a, 0x4b, 0x4c, 0x8a, 0x8b, and 0x8c, and 0 otherwise; two \
leading calls pass index -1, which the predicate rejects without reading \
RAM. The descriptor records at 0x19360 + 12*index carry P0335 for 0x14 and \
0x4a..0x4c, P0340 for 0x47..0x49, and P0345 for 0x8a..0x8c. Exhaust-VTC \
monitor 0008f168 and enable coordinator 000bf630 require a zero result."""
note = [
