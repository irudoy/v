summary = """
Component with three control bits and two calculation variants for ffff192e. \
Bit 4 of ffff2484 selects special lookup 0001230a with formula 2*min(y,209); \
normal branch 00012302 forms 2*min(y+uint8[ffff340c],209). Bit 1 of ffff41d0 \
latches disable/fault, bit 1 of ffff24d0 selects a bypass path, and 00012c12 \
is compared with difference uint8[ffff1071]-uint8[ffff106e]."""
note = [
    """
At 00056d0e the signed difference between two unsigned bytes is compared \
with raw threshold 00012c12. The difference ffff1071 - ffff106e is the \
coolant rise since engine start in deg C. ffff192e is the injection-end \
delay in 2 crank degrees per count read by FUN 000521a8.""",
]
level = "code"
role = "accessor"

