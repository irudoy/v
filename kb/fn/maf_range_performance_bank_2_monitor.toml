title = "Build and evaluate the P010B bank-2 range-performance state"
summary = """
Second-bank P010B MAF range-performance monitor. It mirrors 0008152a, builds \
model byte ffff15bd and composite byte ffff12ec through the shared factor \
tables, maintains event context, and returns a Boolean that 00080f82 \
dispatches as runtime record 0x07."""
note = [
    """
Stock 00008d92 bit 5 is set, so the model_byte < ffff12ec comparison is \
bypassed. The composite survives only in captured P010B event context; exact \
code does not connect it to fuel or actuator control.""",
]
level = "code"
role = "monitor"

[[diagnostic]]
id = "maf-range-monitor-bank2-p010b"
kind = "monitor"
label = "DtcCode"
key = "P010B"
claim = {label = "RomDtcDescriptor", id = "jk08a:000193b4"}
applicability = "exact_rom"
scope = "exact-rom"
priority = 100
level = "code"
note = """
FUN 00081d74 returns the second-bank MAF range-performance result as \
argument 7 of 00080f82, which dispatches exact runtime-record index 0x07 for \
P010B."""

