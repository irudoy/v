summary = """
Computed START SIGNAL state coordinator. It evaluates retained start-state \
predicates using engine-speed state, battery voltage ffff1188, and related \
status; writes the resulting Boolean to ffff4185.bit6; and mirrors it to \
ffff24ae.bit7 and ffff1164.bit1. The function also looks up lower raw \
threshold 000123aa by ffff1077, writes it to ffff1f44, and compares it with \
ffff11ea."""
note = [
    """
Compute START SIGNAL and mirror it into runtime and diagnostic status bits""",
    """
The exact DID 0x1302 response path packs ffff24ae.bit7 as bit 1. A \
structured Nissan profile names that bit START SIGNAL, and the VQ35HR \
factory manual independently defines START SIGNAL as an ECM-computed state \
based on engine speed and battery voltage that is OFF after the engine \
starts. The physical quantity of map 000123aa and state ffff25a4 remains \
unresolved.""",
]
level = "code"
role = "monitor"

