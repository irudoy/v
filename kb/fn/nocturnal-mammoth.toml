summary = """
Engine-torque base-term builder. It calculates \
D=min(65535,floor(u16[ffff1024]*ROM16[000092ac]/ROM16[00009534])), looks up \
RPM curve 000154a0, and writes ffff2408=sat_u16(lookup-D+C), where \
C=max(0,trunc0(ROM16[000092ac]*(ROM8[000087f3]-32)/32))."""
note = [
    """
Stock ROM8[000087f3]=32 makes C zero. FUN 000659ae adds ffff2408 without \
rescaling to the signed centered output of Engine Torque Map 00010b8e, \
establishing the shared internal domain.""",
]
level = "code"
role = "accessor"
block = "torque_model/block"

