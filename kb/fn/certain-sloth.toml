role = "service"
block = "library/block"
contract = """
Not arithmetic: block copier, odd-parity entry into the same ladder 0x22116. \
It copies r0 bytes from [r2] to [r1], with r0 = 4 mod 8, or 1, 3, .. 15 \
longwords. The unrolled sequence alternates r0 and r3 as transfer registers, \
so parity selects the entry. Its paired entry is 000220f8."""
contract_level = "code"

