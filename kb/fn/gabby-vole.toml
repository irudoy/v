summary = """
Implicit-axis 2D entry with byte inputs: r4 holds the table base, and r5 and \
r6 hold raw inputs. It calls the shift kernel sensible-dugong/fn (7mfk \
0x26AE0) for each input, gives index 7 a zero fraction, and tail-calls the \
2D finisher 0x26770 with row stride 8, which interpolates uint8 cells. Each \
axis has 8 points with step 32. On 7mfk the two 8x8 maps are 0xA8EA and \
0x9EDA; their inputs are byte[ffff106f] and byte[ffff10f0]."""
note = [
    """
Both inputs pass through one shift kernel, so the two implicit axes of a map \
have one point count and one step.""",
]
level = "code"
role = "wrapper"
block = "library/block"

