inputs right by 5, gives index 7 a zero fraction, and interpolates the uint8 \
cells with row stride 8 in its body. The readers of 0x9EDA call it where the \
readers on the other layouts call the byte entry: 1me3b:0007ee7e in \
1me3b:0007ee5c, as 1nd:0007a522 in 1nd:0007a508 calls 1nd:00028390."""

