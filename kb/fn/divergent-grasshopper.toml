summary = """
Short-term fuel-trim diagnostic-word producer. It calls FUN 0005cbec, then \
normally copies working Q8.8-percent words ffff40ac/ffff40ae to \
ffff22dc/ffff22de. In an alternate control mode it writes one forced byte \
shifted left by 8 to both banks after clamping it to 75..125 percent."""
note = [
    """
The normal path preserves fractional Q8.8 content. UDS DIDs return only the \
high bytes, while Mode 01 conversion uses the complete words. The upstream \
closed-loop arithmetic is retained separately in FUN 0005cbec.""",
    """
The execution boundary is the post-feedback fragment 0005ca08..0005ca5e, \
with its complete supplied 32-byte caller save frame and natural return. The \
preceding feedback calculation and dispatch remain separate. F = \
(RAM8[0xffff99c4]>>1)&1; to = \
(1-F)*uint16(from)+F*256*min(125,max(75,RAM8[0xffff9925]))""",
]
level = "code"
role = "accessor"
block = "fuel_closed_loop/block"

