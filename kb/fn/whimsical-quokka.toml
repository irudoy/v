summary = """
Exhaust cam reference learning per bank, run only with bit b of gate byte \
ffff14f0 set. With bit b of mask ffff48df clear and sample counter ffff1930 \
+ b below ROM8[0000863b] it accumulates max(0, word + ROM8[0000831d + b] - \
cam edge phase ffff11c8 + b), saturating at 0xffff, into ffff17ea + 2b and \
increments the counter. Otherwise it stores ffff14ea + b = clamp_u8((word - \
0x8000) / ROM8[0000863b] + 128) through divider 00021bbc, sets the mask bit \
at 000909be, stores reference word ffff5578 + 2b = clamp((ROM8[0000831d + b] \
- ffff14ea + b + 128) * 256, 0, 0xff00), and zeroes the counter. With the \
mask bit set the reference word becomes min(0xffff, phase * 8 + ((word * 31) \
>> 5))."""
note = [
    """
Stock ROM8[0000863b] is 0, so the first gated pass divides by zero: 00021bbc \
returns 0 and records 0x044e in ffff9818, the learned offset becomes 128, \
and the reference word becomes 0x5800. Afterwards the function is a \
first-order filter with gain 1/32 toward 256 times the phase snapshot. No \
code clears a bit of ffff48df, and 00090bd2 is the only reader of the mask \
and the reference word in the whole-program references.""",
]
level = "code"
role = "monitor"

