summary = """
Per-bank corrected MAF helper. For a selected bank it adds signed common \
correction ffff1e2a and unsigned auxiliary contribution ffff2368 to the \
bank's signed 32-bit contribution ffff1df8/ffff1dfc, clamps negative results \
to zero, and writes the indexed result. Stock configuration makes ffff1e2a \
zero on every producer call."""
note = [
    """
The destination's downstream role and the physical meaning of ffff2368 \
remain unresolved.""",
]
level = "code"
role = "service"

