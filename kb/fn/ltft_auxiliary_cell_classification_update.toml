summary = """
The selector supplies uint8(R5)=255 to clear all 64 auxiliary bytes. The \
learner supplies an explicit cell index 0..63 and bank 0..1 to increment, \
optionally decay and classify the cell. The original saved R14 and natural \
return are observed. For the bounded ordinary cell: C = uint8(from); N = \
uint8(C+1); D = ROM8[0x000088f5]; G = min(1,max(0,(N+D)-(255))); V = \
(1-G)*N+G*max(0,N-D); W = RAM16[0xffff134e+2*uint8(x)]; lo = \
256*ROM8[0x0000839d]; hi = 256*ROM8[0x0000839c]; to = \
min(1,max(0,(W)-(lo)+1))*min(1,max(0,(hi)-(W)))*V"""
