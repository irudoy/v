summary = """
Paired accessor for 1D-8 multipliers 000126a0 and 000126a8. Their unsigned \
lookups are multiplied and combine with \
max(uint16[ffff15fc]-signed16[ffff15fe],0)*100 to form capped byte ffff1657. \
Function 0004bb6a subtracts ffff1657>>4 from ffff22f8+ffff22fe and writes \
saturated byte ffff23c5."""
note = [
    """
Both maps contain only zeros, but the lookups and downstream branch are \
live. The physical subsystem is unresolved.""",
]
