summary = """
Throttle-position sensor correlation monitor of bank b+1 for argument b of 0 \
or 1, P2135 and P1239, with an opening-dependent tolerance. It forms \
d1=|s16[ffff2752+2b]-s16[ffff275a+2b]| of the signed offset-corrected sensor \
pair and d2=|u16[ffff2746+2b]-u16[ffff274a+2b]| of the selected nonnegative \
pair. While ffff4184 bit 7 is clear, it clears pending bit b+1 of ffff2867 \
and loads countdown ffff25e3+b with 0x32, first clearing stored record 0xea \
for b=0 or 0x115 for b=1 through 0008c348 while ffff4186 bit 7 and the \
enable bit of the record are set. Otherwise it looks up tolerance \
t=lookup(00023ddc, min(255, 2*u8[ffff274f+b])) through 00026370. While d1 or \
d2 exceeds t, START SIGNAL bit 6 of ffff4184 is clear, battery-voltage \
snapshot ffff1108 is at least 0x64, ffff41b6 bit 4 is clear, the enable bit \
of the record, bit 3 of ROM8[00018703] for b=0 and of ROM8[00018709] for \
b=1, is set, and ffff41be bit 5 is set, it sets the pending bit and loads \
the countdown on the first pass, and on later passes reports runtime record \
0xea or 0x115 through 0007d8b8 once the countdown has reached zero, without \
further writes. In every other state it clears the pending bit and loads the \
countdown with 0x32."""
note = [
    """
000a7926, which diagnostic periodic dispatcher 0007bfc4 calls at 0007c112, \
runs range monitors 000a7418 and 000a75c0 and then this function, each for \
arguments 0 and 1. The descriptors of records 0xea and 0x115 carry P2135 (TP \
SENSOR-B1) and P1239 (TP SENSOR-B2). ffff2752+2b is the scheduler snapshot \
of ffff2856+2b, which 0003eb2a sets to sensor-1 word ffff285a+2b minus \
learned offset ffff454e+2b clamped to int16, and ffff275a+2b that of \
ffff285e+2b, which 0003e4cc sets to sensor-2 word ffff2862+2b minus learned \
offset ffff561a+2b; ffff2746+2b and ffff274a+2b are snapshots of \
ffff284a+2b, which 0003e63c writes, and ffff284e+2b, which 0003e548 writes. \
ffff274f+b is the snapshot of ffff2853+b, which 0006f19a sets to min(255, \
(min(ffff284a+2b, ffff284e+2b)*0x505b)>>16). Stock 00023ddc holds 22, 28, \
35, 60, 80, 80, 80, 80 counts, 0.11 to 0.40 V at 5 mV per count, over nodes \
0 to 224 in steps of 32. The countdown lies in the 10.24 ms byte block of \
0002040c, so 0x32 counts are 512 ms; stock ROM8[00018703]=0xfb and \
ROM8[00018709]=0xf8 enable both records.""",
]
level = "code"
role = "monitor"
block = "sensor_monitors/block"

