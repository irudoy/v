summary = """
ATU-II/APC engine-event configuration driver. When bit 1 of 0xffff4198 is \
set, it skips the primary timer-configuration block and clears 0xffff13d1; \
the enabled path passes the cylinder mask to POPCR 0xfffff700. It forms the \
dwell mask as ffff13d1 = ROM8[00022687 + ffff13d3], the one-hot bit of dwell \
channel ffff13d3."""
level = "code"
role = "driver"

