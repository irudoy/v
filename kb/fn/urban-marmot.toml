summary = """
Accessor for current/prior-cycle coefficient surface 0x0C78E and subtractive \
correction 0x13CE8. It indexes 0x0C78E by uint16 ffff1024 and ffff11bc, \
combines current and retained unsigned coefficients with signed state terms, \
decomposes the result through an arithmetic right shift by 12, and applies \
0x13CE8 to the coarse component."""
note = [
    """
M-32768 is consumer arithmetic rather than an independent map storage scale. \
A whole-program p-code scan finds no reader of ffff3080 or ffff3106 outside \
this function. The physical quantity and fixed-point scale of the \
coefficient/state calculation are unresolved.""",
]
level = "code"
role = "accessor"
block = "sensor_monitors/block"

