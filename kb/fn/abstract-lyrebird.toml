summary = """
Two-lane phase-gated first-order filter for AN1 samples ffff1d58/ffff1d5a. \
On the first admitted sample it copies the raw 10-bit value. Later admitted \
samples compute floor((3*previous + sample)/4), with a one-count upward \
anti-stall correction when truncation would leave a rising result unchanged. \
The output pair starts at ffff2832."""
note = [
    """
FUN 0003d832 is the complete caller set and invokes this function with \
indices 0 and 1. Bits 0 and 1 of ffff3f3e admit alternate updates; the \
physical sampling cadence remains unresolved.""",
]
