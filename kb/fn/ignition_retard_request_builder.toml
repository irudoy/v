summary = """
Retard-request producer. It writes ffff11f9=0 when (ffff4242&0x30)!=0; \
otherwise min(max(hi(ffff2336),hi(ffff235e)),127) while ffff24cb.bit5 is \
clear, or the ffff2025-adjusted variant when it is set. It also writes \
ffff2015."""
note = [
    """
ffff2336 and ffff235e are scheduler snapshots of the Q8 states ffff23c2 and \
ffff23ea. FUN 0004d99c negates the result into ffff11d6, so one count is one \
crank degree of retard in the final coordinate.""",
]
