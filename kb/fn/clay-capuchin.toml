Signed 32-bit absolute value: r0 = abs(r4). The argument is passed in r4 \
rather than r0 or r1, unlike the rest of the library convention. r4 also \
holds the result on exit because neg r4,r4 overwrites a negative argument. \
The body has five register instructions, no memory access, and one acyclic \
branch."""
