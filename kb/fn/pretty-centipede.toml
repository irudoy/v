summary = """
Piecewise inverse conversion of area-per-speed coordinate ffff18fc: while \
uint32 ffff18fc does not exceed ROM16[0001553e], the last point of 00015500, \
it interpolates 00015690 over axis 00015500 at ffff18fc; otherwise it \
interpolates 000156d0 over axis 00015540 at min(0xffff, ffff18fc>>4). The \
uint16 result is written to ffff1988."""
note = [
    """
00072d1c, entry 37 of the 124-entry periodic table at 0002196c, calls it \
after 00072d32. The conversion is the one that 00073948 applies to ffff1824 \
for ffff1980; 00072e5e reads ffff1988.""",
]
level = "code"
role = "accessor"

