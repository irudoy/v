value = "2f2641118f18e2203123890bd204321c6220d102312c412b0009"
note = "Bounds the shift count and jumps through the indexed byte-offset table."

[[symbol.evidence]]
kind = "rom-bytes"
at = "1ek7a:000226e8"
value = "0e0c0a0806040200201e1c1a181614123432302e2c2a2826403e3c3a4856626c"
note = """
Stock shift-entry offsets. The first eight entries select exactly zero \
through seven shifts."""

