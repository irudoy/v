summary = """
Attribute-class stored-fault poll. It walks the 0x129 descriptor records and \
tests each through 0008c3de: a record matches when its attribute word, read \
through pointer table 0001a14c, has any bit of the mask set and byte 1 of \
its runtime record ffff5718 + 3*index has bit 7 set."""
note = [
    """
Callers pass 0x0100 (0008c24e), 0x4000 (0008c2ae), and 0x0400 and 0x2000 \
(0008c65c).""",
]
level = "code"
role = "service"
contract = """
Input r4 is a 16-bit attribute mask. It returns 1 on the first matching \
record and 0 when none matches."""
contract_level = "code"

