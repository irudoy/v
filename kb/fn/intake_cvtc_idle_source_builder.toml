summary = """
Intake idle-source producer. It forms S from 000122ea over axis 00012f66 by \
RPM/50 byte ffff11ae and W from 000122f2 by coolant index ffff106f, and \
writes ffff1553 = clamp_u8(128 + trunc0((S-128)*W/128)). While ffff24a7 bit \
1 is clear, it sets ffff247b bit 1 and reloads rise pair ffff1a1e/ffff25ee \
from 00012efe when ROM8[00008616] bit 0 is set or from 00012f06 otherwise; \
while the bit is set, it clears ffff247b bit 1 once ffff1553 is at or below \
intake target ffff2326."""
note = [
    """
While ffff24a7 bit 1 is set, FUN 000bdc66 continues from ffff1553 instead of \
the coolant-selected map byte; FUN 000bd20a sets that bit only with CLSD THL \
POS and a vehicle-speed byte of at most 2 (JK08A.cvtc.md). \
tools/logs/cvtc_intake_state_audit.py replays ffff24a7 bit 1, intake \
operating bit ffff246b bit 6, and the rise, and places the stationary and \
moving cold-band targets that follow the replayed byte on the idle-source \
path.""",
]
