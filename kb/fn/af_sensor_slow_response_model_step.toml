summary = """
Step function of the two-lane model that 0009c298 runs for the A/F sensor 1 \
slow-response monitor, P0133 and P0153. Its outputs include decision bytes \
ffff2f2d, ffff2f2f, ffff2f14, and ffff2f16 and words ffff2fd8 and ffff2fdc, \
which reporting stage 0009609c reads before it reports runtime records 0xfc \
to 0xff through 0007d8b8 and 000b4ef8. Its map terms are four Q7 products \
saturated to uint16, each looked up through 000264f8 over axis 00013c68: \
ffff2f90=min(0xffff, ffff326e*lookup(000150f2, ffff2aae)>>7), ffff2f7c from \
ffff304a and lookup(000150f2, ffff2aaa), ffff2f92 from ffff3270 and \
lookup(00015112, ffff2ab0), and ffff2f7e from ffff304c and lookup(00015112, \
ffff2aac). Each product is formed only while its lane gate is set; otherwise \
the word keeps the previous-pass value that the function saves at its end in \
ffff9490, ffff947c, ffff9492, or ffff947e."""
note = [
    """
0009c238, entry 52 of the 124-entry periodic table at 0002196c, runs \
00095da8, copies ffff56fa and ffff56fc into ffff51a4 and ffff51a6, runs \
0009c298, which calls this function at 0009c9e8, runs 0009609c while \
ROM8[00008afc] bit 5 is set (stock 0x28), and copies ffff51a4 and ffff51a6 \
back. The descriptors of records 0xfc and 0xfd carry P0133 and those of 0xfe \
and 0xff P0153. 0009c298 passes A/F conversion outputs ffff29e2 and ffff29e4 \
multiplied by 256 into the model. Stock 000150f2 falls from 195 to 89 and \
00015112 from 166 to 89 over axis points 200 to 750, coefficients 1.52 to \
0.70 and 1.30 to 0.70. The assignment of lanes to banks and the physical \
quantities of the products are unresolved.""",
]
