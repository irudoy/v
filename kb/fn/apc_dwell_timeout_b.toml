[[symbol]]
layout = "jk78c"
address = "0002e3c0"
level = "code"
summary = """
IMI5B acknowledges the compare and disables its interrupt. An extended \
timeout programs the next interval and re-enables the interrupt. At finite \
expiry it checks the saved PULS inputs and sets the low POPCR action for a \
pin still in dwell. A pending primary tooth count is cleared and GR11A is \
moved to TCNT11 + 2. With no pending count, the compare moves only under the \
distance or pin-state guard."""

