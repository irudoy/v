summary = """
Misfire operating-point snapshot matcher. FUN 00082c8a calls it once for \
each retained group with that group's native-speed word, calculated-load \
byte, and coolant snapshot byte. It admits a group only under the common \
misfire readiness gates and when the current operating point lies inside the \
code-defined speed/load windows and on the same side of the 70 deg C coolant \
boundary."""
note = [
    """
The 110 coolant-code boundary is 70 deg C because ffff3fa4 uses deg C = \
code-40 for positive codes. The function names no diagnostic phase for \
groups 0..2.""",
]
level = "code"
role = "monitor"
block = "misfire/block"
contract = """
Inputs are r4=snapshot native-speed word, r5=snapshot calculated-load byte, \
and r6=snapshot coolant byte. It returns 1 exactly when ffff4251.bit7 and \
ffff41d2.bits0/1 are set; max(r4-30,0) <= ffff11bc < min(r4+30,255); \
floor(8*r5/10) <= ffff413e < floor(12*r5/10); and r6 and ffff3fa4 are either \
both below 110 or both at least 110. Otherwise it returns 0."""
contract_level = "code"

