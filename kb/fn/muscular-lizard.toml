summary = """
VTC active-test driver for service-0x30 Output Control, reached from \
0002e66c at 0002e760 and through it from 000ca79e, with gbr = 0000873e. It \
writes ffff41fa bit 4 at 0002e50a (ffff248b bit 1 and ffff244f bit 1 set, \
vehicle-speed byte ffff110e at most ROM8[000089f1]=2, raw coolant ffff1071 \
in ROM8[000089f3]=110..ROM8[000089f2]=170), bit 0 at 0002e522 (IOLID 0x19 \
active flag ffff99c7 bit 0 together with bit 4) storing ffff1704 = \
clamp(int8(ffff993c), ROM8[0000873e]=-20..ROM8[0000873f]=20) at 0002e54c, \
ffff41fb bit 7 at 0002e576 (IOLID 0x1a, ffff99c7 bit 1) storing ffff1705 \
from ffff993d at 0002e59e, and exhaust request ffff249c bit 6 at 0002e5ec \
(IOLID 0x1d active flag ffff99c7 bit 4, ffff248b bit 0, ffff244f bit 1, the \
same speed and coolant window) storing ffff1706 from ffff9940 at 0002e612; \
it clears the exhaust request at 0002e61c otherwise."""
note = [
    """
The value bytes ffff9923 + n and active flags ffff99c4 (bit n-1) are \
maintained by service-0x30 handler 00030c4c; startup 0002e76e zeroes both \
arrays. The exhaust request bypasses the coolant-window term of enable \
coordinator 000bf630, and 000bfe88 adds ffff1706 to the exhaust target while \
it is set.""",
]
