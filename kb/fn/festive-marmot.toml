role = "service"
contract = """
Arithmetic right shift by 11: r0 = (int32)r0 >> 11, signed division by 2048 \
rounded down. It is pure; its only memory access spills r1 to the stack. \
Ghidra renders the return as CONCAT44(in_r1, ...), which is a decompiler \
artifact: r1 is not computed and is restored from the stack."""
contract_level = "code"

