summary = """
Exhaust-VTC diagnostic coordinator. It compares common exhaust target \
ffff2327 with bank-specific actual exhaust bytes ffff2324/ffff2325 and \
routes failures through descriptor indices 0x84..0x87 and 0xd2..0xd3."""
note = [
    """
The exact JK08A descriptor registry maps indices 0x84..0x87 to P1078/P1084 \
exhaust-timing-sensor records and 0xd2/0xd3 to P0014/P0024 \
exhaust-VTC-control records. This provides an independent subsystem binding \
for the three centered bytes.""",
]
