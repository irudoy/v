summary = """
Upper load bound of the P0500 vehicle-speed sensor monitor: it interpolates \
1D-16 uint8 table 00012e52 at engine-speed byte ffff11b3 through 00026388 \
and writes the result to ffff357c."""
note = [
    """
000a6c9a calls it after 000a681c. 000a6854 and 000a6aa0 admit their monitor \
only while ffff357d <= high_byte(ffff1024) < ffff357c, where ffff1024 is the \
current Base Fuel Schedule sample; 000a6854 reports runtime record 0, whose \
descriptor carries P0500. Stock 00012e52 holds 255 in every cell, so the \
upper bound excludes only a high byte of 255.""",
]
level = "code"
role = "accessor"
block = "sensor_monitors/block"

