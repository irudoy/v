title = "Run the ordered fuel-multiplier calculation stages"
summary = """
Fuel-multiplier calculation coordinator at periodic table index 36. Its \
fixed call order is 00054eb8, 0005594a, conditional 00055596, 0005525a, \
00055098, 00052f00, 00054ee0, 000554ae, 00055648, 000554f8, and 000556ec. \
The call to 00055596 is gated on ROM8[00008b42] bit 0 or ROM8[00008b34] bit \
4; stock holds both clear, so 0005594a is the only commanded-mixture writer \
in the stock image."""
note = [
    """
Table order places this coordinator after final mask producer 0004ed88 and \
before common gain 00053698, transient coordinator 000522c4, precursor \
0004e974, and six-channel builder 0004ecac.""",
]
