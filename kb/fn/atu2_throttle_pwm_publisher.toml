title = "Scale duty and write complementary ATU-II BFR6A-D outputs"
summary = """
Throttle ATU-II PWM publisher. It converts ffff374c/ffff374e to \
min(320,floor(raw*320/500)), uses direction masks ffff36dc/ffff385e to drive \
one member and clear the other in each pair, and writes channel 0 to BFR6A/B \
at fffff510/fffff512 and channel 1 to BFR6C/D at fffff514/fffff516. Disabled \
output clears all four registers; a fault branch writes fixed 0x40/0x60 \
values."""
note = [
    """
The MCU register and TO6A-D pin mapping is exact. ECM connector continuity, \
H-bridge polarity, and channel-to-bank identity require bench validation.""",
]
level = "code"
role = "driver"

