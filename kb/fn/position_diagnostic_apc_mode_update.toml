title = "Update the P0335 P0340 P0345 fallback mode used by APC schedulers"
summary = """
Crank/cam position-diagnostic APC fallback-mode updater. It evaluates \
runtime records 0x47/0x48 for P0340, 0x8a/0x8b for P0345, and 0x4a/0x4b for \
P0335. The P0335-only combination can set ffff24cf.bit6; periodic dispatcher \
00020dfe snapshots that bit to ffff24c9.bit6 for both APC schedulers."""
note = [
    """
The exact JK08A descriptors map those six runtime indices to the stated \
DTCs. Bit6 selects alternate scheduler behavior and is a mandatory \
stock-pass-through gate for a late retard override.""",
]
level = "code"
role = "monitor"

