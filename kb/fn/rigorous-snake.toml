summary = """
Conditional RAM-clear service. When ffff2451 bit 5 is clear, descriptor \
table 0x2260C drives longword clears of [ffff84a0,ffffa314) and effective \
span [ffff1000,ffff5cf4), whose unaligned descriptor stop is ffff5cf2; the \
latter includes previous-pass bytes ffff107e..ffff1080, fuel-inhibit \
prerequisite bytes ffff2494 and ffff418c, diagnostic status byte ffff41ea, \
and AN1-path state ffff3f3e, ffff3f44, and ffff3f4c. Peripheral-state \
service calls follow the clears. The set-bit branch skips them."""
note = [
    """
FUN 0002f888 reaches this service from command/state branches. The exact \
clear spans are proven; the external meaning of those branches is not \
assigned.""",
]
level = "code"
role = "service"
block = "startup/block"

