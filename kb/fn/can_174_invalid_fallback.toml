title = "Reset decoded CAN 0x174 transmission fields after invalid data"
summary = """
Invalid-message fallback for CAN 0x174. On the invalid-data branch it writes \
zero to both live gear indices ffff1086 and ffff1087, resets associated \
decoded fields, and marks the fallback state."""
note = [
    """
Zero is also the decoder fallback for out-of-range nibble values, so \
consumers cannot distinguish invalid CAN data from decoded gear index zero \
through these two bytes alone.""",
]
level = "code"
role = "handler"
block = "can_network/block"

