summary = """
Accessor for 4x4 family 0000a49a/0000ab6a through 00026084 and two 1D-8 \
upper bounds 000126b0/000126b8. The 1D lookups form a minimum; the selected \
value enters with weight ffff165b into \
(ffff165a*ROM8[0000886e]+ffff165b*min)/256, saturated at 255 and written to \
ffff15df. After preparing signed word ffff15fe, the function calls 000532ae, \
whose arithmetic consumes ffff15ce, and writes the 32-bit return to \
ffff15f8."""
note = [
    """
Both 1D maps contain only zeros, but min rather than contents establishes \
their upper-bound role. The physical quantities of ffff15df and ffff15f8 are \
unresolved; the exact write closes the downstream path from ffff15ce without \
naming the subsystem.""",
]
