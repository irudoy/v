summary = """
Gated Q0.16 blend of signed states ffff18e8 and ffff18e6. When all three \
gates admit the blend, ffff2422 selects A=ffff18e8 at 0, B=ffff18e6 at \
65535, or floor(((65536-w)*A+w*B)/65536); otherwise A is copied. The result \
is written to ffff18f4."""
note = [
    """
FUN 00074c82 and FUN 00074b68 control weight ffff2422. Code proves the blend \
and gates; the physical quantity is unresolved.""",
]
level = "code"
role = "service"

