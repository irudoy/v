summary = """
Current RPM/12.5 producer. With ffff417f.bit5 clear, it writes \
floor(0xA2C2/uint16[ffff22bc]) to ffff114a while ffff24c9.bit5 is clear and \
directly copies established RPM/12.5 word ffff11f4 while that bit is set. \
The ffff417f.bit5-set branch writes zero."""
note = [
    """
The direct-copy branch binds the result to the RPM/12.5 domain. Signed \
divider 00021bbc returns zero on a zero divisor after recording its \
diagnostic word.""",
]
level = "code"
role = "accessor"
block = "engine_speed/block"

