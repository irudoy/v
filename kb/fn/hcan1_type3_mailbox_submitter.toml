summary = """
Stock HCAN1 type-3 transmit submitter for one mailbox-table index. It checks \
the ten-byte software record at ffff3ab5+10*i, applies the frame-specific \
phase and condition gates, copies the configured DLC bytes into physical \
mailbox i+1, and contributes the mailbox bit to the TXPR request aggregate."""
note = [
    """
The caller 000c38de selects only firmware type 3. A custom type-4 mailbox \
does not share this software-record submission path.""",
]
