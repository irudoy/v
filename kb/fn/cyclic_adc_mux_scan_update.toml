title = "Cyclic ADC scan and PF13 through PF15 external mux sequencing"
summary = """
Cyclic on-chip A/D sampler and PF13..PF15 external-mux sequencer. For \
ADDR0/AN0 it samples mux code 000 into ffff1d60 in phase 1, code 001 into \
ffff1d6e in phase 2, advances through all codes, samples code 111 into \
ffff100a in phase 8, and then clears the selector to 000. It also samples \
phase-specific ADDR1/AN1 values into ffff1d58 and ffff1d5a."""
note = [
    """
Direct reader 00028668 independently binds mux code 000 to the coolant path \
and code 111 to the fuel-temperature path. Exact DID 0x1103 binds the \
intervening phase-2 code-001 sample to battery voltage. Other AN0 mux \
positions remain unnamed.""",
]
level = "code"
role = "driver"

