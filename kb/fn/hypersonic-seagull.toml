summary = """
Saturated engine-speed byte producer. FUN 000384fe first writes ffff11e8 = \
ffff1196 >> 3; this function writes ffff11ea = min(255, ffff11e8 >> 3), \
therefore min(255, ffff1196 >> 6). It also maintains two prior samples at \
ffff229a/ffff229b and sets ffff2219 when the selected three-sample sequence \
is strictly increasing."""
note = [
    """
The output has the same RPM/12.5 count scale as word ffff11f4, which FUN \
000384fe forms directly as ffff1196 >> 6. The byte saturates at 255.""",
]
level = "code"
role = "accessor"
block = "engine_speed/block"

