title = "Update battery ADC threshold state with raw hysteresis"
summary = """
Raw battery-ADC hysteresis state updater. It reads phase-2 AN0 mux sample \
ffff1d6e, enters the upper state at raw 0x33c, returns through the lower \
threshold 0x308, stores its four-state result at ffff3674, and sets \
ffff24ad.bit7 for states 2 or 3."""
note = [
    """
The shared source is diagnostic-bound to battery voltage through 00039a9e \
and DID 0x1103. No engineering conversion is assigned directly to the \
pre-conversion word thresholds.""",
]
level = "code"
role = "monitor"
block = "analog_inputs/block"

