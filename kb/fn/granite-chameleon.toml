summary = """
HCAN1 mailbox initializer. It reads 30 four-byte records at 0000975a, maps \
record index i to physical mailbox i+1, decodes bytes as firmware type, DLC, \
and big-endian STDID<<5, and programs the mailbox control fields. Types 1/2 \
configure MBC 010 receive, types 3/4 configure MBC 000 transmit, and type 5 \
configures MBC 111 inactive. Types 2 and 4 additionally clear the \
corresponding MBIMR bit to enable mailbox activity interrupts."""
note = [
    """
Record 25 at 000097be configures physical mailbox 26 as stock-inactive. \
Mailbox 0 and mailbox 31 are initialized separately. The table describes \
configured capability and does not prove traffic observed on a vehicle.""",
]
level = "code"
role = "init"
block = "can_network/block"

