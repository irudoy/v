summary = """
Implicit-axis primitive: 64 points, step 256, limit 0x3F00, uint16 element."""
note = [
    """
On 7mfk, the wrapper first truncates R5 to an unsigned word. Arguments below \
0x3f00 enter the eight-shift body at 00026a74 with word format and zero R3. \
It interpolates 64 unsigned words with step 256; argument >=0x3f00 returns \
the sign-extended word at base+126. Interpolation preserves MACL and \
balances its descending-path stack. Independent literal cases execute both \
MAF curves, both interpolation directions, unsigned cell boundaries, \
argument wrap, and the last-cell return. Other layouts receive no execution \
claim from this fixture.""",
]
