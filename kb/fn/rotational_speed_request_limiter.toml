title = "Build the calibrated rotational-speed signed request-limit candidate"
summary = """
Stateful rotational-speed request limiter reached from periodic-table index \
12 through 000769c0 and 00075e9e. ROM16[0x942c]=0xffff writes neutral 0x7fff \
to ffff19d8 and returns without updating other state. The enabled path \
stores S_new=min(65535,4*N) on first use or \
S_new=min(65535,N+floor(3*S_entry/4)) later. Its blend uses S_entry while \
both request-rate terms use S_new. Coolant latch ffff249e.bit0 sets at raw \
255, retains through raw 239, and clears at 238. Dynamic threshold ffff1796 \
has gated down/up rates and optional cap. Engagement requires previous \
signed ffff19d8 < APP-derived ffff243c; equality resets the ramp mode. The \
active ramp uses rate 1500 while ffff25b0 is nonzero and ffff24a3.bit2 is \
clear, otherwise rate 200, then applies the first-column 0xe98e baseline. An \
independent rate-2000 term applies on every enabled pass. Recovery envelope \
ffff19dc can restrict output and roll ffff19da back to its entry value. \
ffff4252.bit1 forces neutral output and synchronizes the ramp from ffff19c6. \
Conditional auxiliary request and duration are written to ffff2400 and \
ffff413c."""
note = [
    """
Stable speed converges to 4*N; passive target-CAN timing establishes a 10.24 \
ms call period. Stock threshold rates are zero and alternate caps are \
0xffff, so the normal threshold remains 0x2580. Exact ROM execution covers \
all branch classes and an isolated downstream two-channel projection. The \
x*0.78125 RPM interpretation, context-byte identities, physical plate \
response, and channel-to-bank assignment require separate evidence.""",
]
level = "code"
role = "monitor"
block = "limiters/block"

