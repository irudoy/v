title = "All-zero stock BFS-threshold hysteresis contributor"
summary = """
BFS-threshold hysteresis contributor for ffff249f.bit0. It compares the high \
byte of ffff1024 with RPM-indexed 0-to-1 map 00012116 and 1-to-0 map \
00012984; ffff25b9 additionally gates the transition to one."""
note = [
    """
Both complete maps contain only zero in stock JK08A. An unsigned BFS byte \
cannot be below the clear-state threshold, so the bit cannot set through \
this function; an externally set bit clears on the next evaluation.""",
]
