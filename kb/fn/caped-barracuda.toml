summary = """
EVAP negative-pressure leak-monitor state machine and calculation \
coordinator. It assembles corrected and saturated raw coordinate ffff2c98, \
maps it through 000152d6 into ffff3242, and calls FUN 000b2096 with \
normalization parameter ffff2c86 and output pointer ffff301c. One branch \
dispatches exact gross-leak descriptor index 0x30 for P0455 when ffff2c9c is \
below ROM16[0x915e]=0x0600 and the calibrated operating gates pass. Other \
branches call complementary updater FUN 000b4ef8 with index 0xd8 for P0456 \
and index 0xda for P0442 while processing the high byte of ffff301c."""
note = [
    """
No direct call to the common fault dispatcher with index 0xd8 was found in \
the whole-program constant-call scan. The P0456 trace establishes exact \
descriptor-aware complementary result handling rather than the fault \
assertion branch. The physical scale of the two lookup coordinates and \
ffff301c remains unresolved.""",
]
level = "code"
role = "monitor"

