title = "Publish coolant and latch the start-temperature pair"
summary = """
Coolant publisher and start-temperature coordinator, entry 24 of periodic \
table 00021834. It calls transfer stage 00039550 and writes DID 0x1101 byte \
ffff1079 at 000394fc: service-0x30 value byte ffff9924 while active bit \
ffff99c4 bit 0 is set, otherwise the output of fall-rate limiter 00039588 \
with ffff2461 bit 6 cleared while range check 00039614 passes, otherwise the \
output of fail-safe ramp 000395ae with ffff2461 bit 6 set. It invokes \
normalizer FUN 00039634 and selector FUN 0003967a. A selector result of 1 \
copies coolant pair ffff1079/ffff1077 to ffff1076/ffff1078; a result of 0 \
copies ffff107e/ffff1080, the previous-pass images of the same pair that \
dispatcher 000209d8 forms at 00020cba, so the pair holds its last selection. \
Gate 0003972a applies the same selection to ffff39ae, whose hold branch \
reads previous-pass image ffff39be. While ffff4185 bit 7 is clear the \
function also stores ffff1079 in ffff5509."""
note = [
    """
The selected pair is the engine coolant temperature at engine start. RAM \
initialization clears the selector latch, so the first pass selects coolant \
once; a computed START SIGNAL interval with battery voltage below raw 100 \
tracks coolant and ends with one more selection. Value byte ffff9924 and \
active bit ffff99c4 bit 0 occupy the IOLID-0x01 positions of the \
service-0x30 arrays.""",
]
level = "code"
role = "accessor"
block = "temperatures/block"

