summary = """
Stock HCAN1 SLE1 mailbox-empty interrupt handler. It checks only physical \
mailbox 28, represented by bit 0x1000 in TXACK1 and ABACK1, clears the \
acknowledged flag and IRR bit 8, marks ffffa56f, and calls 000c6b68 only \
after successful transmission. It returns directly with RTE."""
note = [
    """
A custom SLE1 target must preserve the complete mailbox-28 success and abort \
behavior. Because the stock handler owns RTE, it cannot be called with JSR. \
An indirect tail jump would consume a general register whose interrupted \
entry value its prologue must preserve; the implemented telemetry layer uses \
one combined save/body/restore/RTE handler instead.""",
]
level = "code"
role = "handler"
block = "can_network/block"

