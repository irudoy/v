summary = """
Second two-surface conditioning stage. It interpolates 00017cc8 and 00017ec8 \
by ffff1248 and ffff10d2, stores the endpoints in ffff1cba/ffff1cbc, and \
writes floor((A*(65536-w)+B*w)/65536) to ffff124a using Q16 weight ffff190e \
produced by 00070e4c. It conditionally rate-adds the blend into ffff1cb4 and \
publishes either ffff1cb4 or original source ffff1248 as ffff1cb6."""
note = [
    """
All cells of both endpoint surfaces are zero, so the blend is zero for every \
shared weight. Stock ROM8[000089fb].bit6 clear selects direct blend \
processing, while bit3 clear makes the final selector always copy ffff1248 \
to ffff1cb6. The executed surface results therefore have no terminal \
consumer in unmodified JK08A. The physical quantity and engineering unit \
remain unresolved.""",
]
level = "code"
role = "accessor"
block = "torque_request/block"

