summary = """
Speed-gated pass of byte ffff3368. It writes coolant-indexed speed threshold \
ffff351b=lookup(00012e1a, ffff106f) through 00026388 and keeps four \
hysteretic comparisons through 000259d0: ffff420a bit 0 for engine speed \
ffff11b2 against ffff351b, bit 1 against ffff351b+ROM8[00008d37], bit 2 \
against ffff351b+ROM8[00008d36], and ffff420b bit 7 for opening coordinate \
ffff40c6 against ROM8[00008d3a]; each bit sets while its input is at most \
the threshold and, once set, holds until the input exceeds the threshold by \
more than 4 counts, 5 for ffff40c6. It writes ffff3368=0 while START SIGNAL \
bit 6 of ffff4184 is set, ffff244f bit 1 is set, ffff420a bit 0 is set, or \
ffff420a bit 1 and ffff420b bit 7 are both set; otherwise it writes \
min(ffff336b, ROM8[000088c2]) while ffff420a bit 2 is set and ffff336b while \
it is clear."""
note = [
    """
000797d0, which request-boundary dispatcher 00079dd8 calls at 00079dda, \
calls 00079358, this function, and 00079538 in that order; 00079358 writes \
ffff336b, and 00079538 and 000657ac read ffff3368. Stock 00012e1a falls from \
102 at -40 deg C to 76 from 70 deg C, 1275 to 950 RPM at 12.5 RPM per count; \
stock ROM8[00008d36]=ROM8[00008d37]=24 place bits 1 and 2 at 300 RPM above \
the threshold, ROM8[00008d3a]=10, and ROM8[000088c2]=15. 000c5558 also reads \
ffff351b.""",
]
level = "code"
role = "accessor"

