summary = """
Multimode accessor for three 4x4 calibrations. Direct path 0x0B5DA writes a \
byte to ffff2fe4 and checks it with cmp/pl. The alternate path blends \
results of 0x0B5EA and 0x0B5CA using two weighted products, shifts the sum \
right by 10, and writes the same destination."""
note = [
    """
Build the alternate transmission request state and signed request \
candidate""",
    """
The machine window does not establish the value of constant r14 or equality \
of the two reads from ffff2fe6, so the exact weighting formula for maps \
0x0B5CA/0x0B5EA separately remains candidate.""",
]
level = "code"
role = "accessor"
block = "transmission/block"

