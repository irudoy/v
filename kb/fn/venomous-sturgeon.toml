summary = """
Periodic fuel-temperature publisher for DID 0x1104 byte ffff1074, entry 27 \
of periodic table 00021834. It calls filter and transfer stage 000397e8 and \
stores at 000397c4 either service-0x30 value byte ffff992d while active bit \
ffff99c5 bit 1 is set or the output of limiter 00039874 with ffff24b8 bit 5 \
cleared. The limiter compares transfer code ffff1f89 with ffff107c, the \
previous-pass copy of ffff1074 that dispatcher 000209d8 makes through the \
eight-byte block ffff1072..ffff1079 -> ffff107a..ffff1081 at 00020cba: it \
returns a higher code at once, holds the previous byte while code + 2 \
exceeds it, and otherwise returns code + 2. Validity helper 00039896 returns \
1 on every path, so the branch that sets ffff24b8 bit 5 is unreachable. The \
function then calls 000398b0 to form normalized index ffff117a and writes \
ffff1073 at 000397d8: the current byte while gate 00039902 returns 1, \
otherwise its previous-pass copy ffff107b. The gate returns 1 and clears \
latch ffff24bd bit 5 while computed START SIGNAL ffff4185 bit 6 is set and \
battery byte ffff1188 is below 100; outside that condition it sets a clear \
latch and returns 1 once, then returns 0."""
note = [
    """
Value byte ffff992d and active bit ffff99c5 bit 1 occupy the IOLID-0x0a \
positions of the service-0x30 arrays, in which IOLID 0x0c holds ffff992f and \
ffff99c5 bit 3. The published byte is deg C+50, the code of table 00012dea; \
on a falling temperature the limiter keeps it between the converted sample \
and the sample plus two counts. ffff1073 holds the fuel temperature of the \
first pass after the start and low-voltage condition ends, the gate \
structure that selector 0003967a applies to coolant.""",
]
level = "code"
role = "accessor"
block = "temperatures/block"

