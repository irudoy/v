summary = """
Component enabled by master gate bit 7 of ffff84c0. On the r5>=r7 branch, \
map 00012126 defines floor((r5-r7)*x/2048). Separately, lookup 00012332 by \
uint8 ffff1077 defines a lower raw bound: code selects \
max(lookup<<8,uint16[ffff1e5c])."""
note = [
    """
The physical purpose of both computed quantities is unresolved; shifting \
lookup 00012332 by 8 bits is an internal representation.""",
]
level = "code"
role = "accessor"

