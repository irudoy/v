summary = """
Primary conversion chain from throttle geometry to requested-torque surface \
0000e98e. It converts saturated ffff1332*4 through 00013202 over 000155a0 \
and writes the saturated doubled area to ffff12a0, writes uint32 \
ffff1824=floor(4*floor(ffff12a0*65536/ROM8[0x8d8f])/ffff1702), converts \
ffff1824 through 00015690 over 00015500 up to ROM16[0x1553e] or otherwise \
through 000156d0 over 00015540 after a shift right by four, writes that \
coordinate to ffff1980, then interpolates 0000e98e over axes \
00011d0c/00014114 at row ffff1702 and column ffff1980 and writes the \
centered result to ffff19ba."""
note = [
    """
Code proves the chain and offset-binary output centering. With ffff1702 in \
RPM/3.125 counts, ffff1824 is 8192*ffff12a0/RPM. The physical identities and \
engineering scales of the opening-area and requested-torque tables remain \
candidates.""",
]
