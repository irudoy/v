summary = """
TCM status decoder. It maps field ffff3a2e (CAN 0x174 byte 4 bits 5..7) to \
ffff419b: value 3 sets bits 3 and 4, value 5 sets bits 3 and 5, value 6 sets \
bits 3 and 6, value 7 sets bits 3 and 7, and other values clear bits 3..7. \
It clears ffff4194.bit0 for field values 0, 3, 5, 6 and 7 and sets it \
otherwise, and derives ffff4194.bit2 from words ffff3f8c and ffff3f8e."""
note = [
    """
FUN 00079de4 calls it first through pointer 00079e18 and is entry 58 of the \
69-entry table at 00021834 that dispatcher 000209d8 drains on ffff84b9 bit \
4. Scheduler 00020dfe latches ffff419b into ffff418f, the prerequisite of \
transition neutralizer ffff4252.bit1 in FUN 00077892.""",
]
level = "code"
role = "driver"

