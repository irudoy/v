summary = """
Two-lane unfiltered temperature PID producer. For lane index r4 it converts \
uint8(ffff1d58[lane] >> 2) through shared table 00012dea with implicit-axis \
primitive 000263a0 and writes ffff3f42[lane] = max(code - 10, 0)."""
note = [
    """
The minus-10 offset matches the coolant snapshot producer FUN 0008092e, and \
both bytes are published as A-40 deg C J1979 PIDs, which fixes the 00012dea \
output as deg C+50.""",
]
level = "code"
role = "accessor"

