summary = """
Second-bank paired-sensor conditioning stage. It subtracts two acquisition \
words ffff363a/ffff363c from 0x0400, writes publication words \
ffff2862/ffff2864, subtracts learned offsets ffff561a/ffff561c, clamps \
signed corrected values, and writes ffff285e/ffff2860."""
note = [
    """
Exact UDS DID 0x124c and reviewed Nissan diagnostics identify ffff2864 as TP \
SEN 2-B2, whose signal the factory documentation states is converted inside \
the ECM. The 0x0400 complement inverts the sensor about the ten-bit full \
scale, which is 5.12 V at 5 mV per count.""",
]
level = "code"
role = "driver"
block = "throttle_sensing/block"

