title = "Continue normal APC GR11A scheduling across position events"
summary = """
Normal-mode APC set-compare continuation. It consumes the stored command \
decade and remainder across later position events, calculates the next \
fractional offset from ffff22bc, writes GR11A, and enables the \
current-cylinder low-byte POPCR action. At the set compare it selects the \
next dwell channel: ffff13d3 = ROM8[00022680 + ffff13c9], the successor of \
the identified cylinder, or ffff13c9 itself on the alternate branch."""
note = [
    """
Together with 00028dc8 this proves that command decades are scheduled rather \
than discarded. The ignition advance moves only the GR11A set edge, so that \
edge is the spark and the preceding low state of the pin is the dwell; the \
external driver stage remains a hardware boundary.""",
]
level = "code"
role = "handler"
block = "ignition_output/block"

