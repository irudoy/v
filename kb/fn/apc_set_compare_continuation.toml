[[symbol]]
layout = "jk00c"
address = "0002b7ac"
level = "code"
summary = """
IMI11A acknowledges the GR11A match. With ffff8517 bit 7 set, it clears the \
low byte of POPCR and consumes the armed state. If APC mode bit 6 and \
ffff8517 bit 6 are set, it programs GR11A again and updates the armed state. \
On that path it also ORs the byte at ffff13e1 into the POPCR low byte when \
ffff84ea bit 7 is set and ffff13f6 is zero."""

