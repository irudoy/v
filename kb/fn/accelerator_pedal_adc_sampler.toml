title = "Sample and align the two accelerator-pedal ADC channels"
summary = """
Samples on-chip A/D channels AN10 and AN17 through FUN 0002df5c, shifts each \
aligned result right by six, and writes the resulting 10-bit values to \
ffff362c and ffff362e."""
note = [
    """
Downstream adjustment, paired accelerator-pedal diagnostics, and \
P2122/P2123/P2127/P2128 monitors establish that these two analog channels \
belong to the dual-channel accelerator-pedal path.""",
]
level = "code"
role = "driver"
block = "analog_inputs/block"

