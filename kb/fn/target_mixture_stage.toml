summary = """
Commanded-mixture stage of coordinator 00057608 and sole stock runtime \
writer of ffff22e8. It looks up target mixture map 0000a9aa on engine-speed \
word ffff11bc and load ffff102c, with 0xff forced onto the load axis while \
wide-open latch ffff2468 bit 3 holds (the latch compares throttle-opening \
byte ffff3528 with the flat 200 of 0001214e on ffff11b3), scales the \
deviation from 128 by 00012552 on ffff11ae when ffff2466 bit 6 selects the \
high-detonation surface, applies enrichment latch ffff24a2 bit 7 \
(ROM8[00008b9b] = 130 on, ROM8[00008b9f] = 129 hold), and writes target byte \
ffff15eb. It derives request byte ffff1411 and state byte ffff1410 from warm \
gate ffff24a4 bit 5, the engine-speed band flags of ffff2493, and ffff2485 \
bit 6, ramps ffff123a from snapshot ffff1278 toward ffff15eb << 7 with steps \
ROM8[0000849b] * 8 and ROM8[0000849c] * 8, takes max(ffff123a, ffff123c), \
forces 0x4000 while ffff2700 < 32 or countdown ffff2531 (reload \
ROM8[000087d6] = 2) is nonzero, caps the word at ROM16[000094ec] under \
ffff4252 bit 1, and writes ffff22e8."""
note = [
    """
Vehicle validation on three 2026-08-26 recordings: the streamed ffff22e8 \
matches the 0000a9aa lookup in 98.3..100 percent of settled records, and \
STFT holds neutral 0x6400 whenever the command exceeds 0x4000.""",
]
