summary = """
ICI0A input-capture handler and crank-tooth dispatcher. Vector 84 at \
00020154 enters prologue 00028ea2, which runs on every tooth of the crank \
signal plate: it copies ICR0A to ffff20b8, stores OSBR1 in ffff158a and the \
tooth interval in ffff22ba, maintains tooth counter ffff13b2, writes the \
10-degree interval ffff22bc, and falls through into this body; a set \
ffff24c9.bit6 diverts the prologue to the cam-based fallback at 0002a294. \
The prologue forms ratio ffff196c = min(255, 64 * previous interval / \
current interval) through 00021bbc. With ffff8502.bit7 set by a count of at \
least ROM8[00008c81] = 8, a ratio above ROM8[00008c89] = 118 and a count of \
at least ROM8[00008c81] = 8 before sync or ROM8[00008c82] = 8 after it set \
gap flag ffff84e9.bit7; the next tooth latches the count in ffff13b4, \
restarts ffff13b2 at zero, sets sync flag ffff8501.bit7, and clears the gap \
flag. With sync set, tooth 8 stores one third of its interval in ffff22bc. \
The body dispatches tooth numbers 0, 4, 6, 7, 8, and 9. Tooth 7, the last \
tooth before the two-missing-teeth gap, is the engine event: with \
ffff8501.bit7 set it copies identified cylinder ffff13c8 to event index \
ffff11de, forms spark mask ffff13bd = 1 << (index - 1) through 000221bc, and \
calls scheduler feeder 000208f8. Tooth 4 identifies the cylinder from the \
cam edge counts; the first identification writes ffff13c8, ffff11de = \
ffff13c9 = ROM8[0002266b + id], ffff13d3 = ROM8[00022672 + index], dwell \
mask ffff13d1 = 1 << (ffff13d3 - 1) unless ffff4198.bit1 is set, and \
ffff13bd = ROM8[00022679 + index], sets ffff84ff.bit7, and, with \
ffff8513.bit7 set and bit 6 clear, fires the grouped start pulse with \
channel mask ROM8[000226a2 + index] and sets ffff8513.bit6. Tooth 8 copies \
ffff13c8 to ffff13c9. Tooth 9 serves the start-phase injection path while \
ffff8513 bits 7..6 are set and bit 5 is clear: it seeds ffff2228 and \
ffff221e from slot ffff20b4 and programs the delayed start with angle \
ROM8[00008d5f] = 0, or ROM8[00008d60] = 92 while ffff24ca.bit1 is set. The \
common tail on tooth ROM8[00008bdc] = 9 with ffff84f1.bit7 set writes \
abs(ICR0A - ffff84d4) to ffff1dac and misfire cylinder ffff4038 = \
ROM8[0002265c + ffff11de] and sets ffff84f2.bit7; on tooth ROM8[00008bdd] = \
9 it refreshes ffff84d4 from ICR0A and sets ffff84f1.bit7. On the \
injector-event path it refills scheduled-duration array ffff224e through FUN \
00054d3e and then calls masked one-shot scheduler 0002c13c with that array."""
note = [
    """
The crank signal plate carries ten teeth at 10-degree pitch per 120 crank \
degrees with two missing teeth between tooth 7 and tooth 8. The gap ratio 64 \
* 3 = 192 appears on tooth 9, the tooth after it becomes tooth 0, and the \
divide-by-three normalization at tooth 8 (multiplier 0x5555 >> 16) matches \
the three-pitch interval from tooth 7 to tooth 8. Relative to tooth 7, teeth \
8, 9, 0, 1, 2, 3, 4, 5, 6, and 7 follow at 30, 40, 50, 60, 70, 80, 90, 100, \
110, and 120 degrees. Entry 00028ea2 owns the prologue, the crank-tooth \
continuation at 00029588, and the common restore tail ending in RTE at \
0002a2ba. The bounded ratio-cell action and its hardware exclusions are \
specified in defs/JK08A.ici0a-ratio.md. The first tooth-9 capture seeds the \
misfire reference and every later one produces an interval over 120 crank \
degrees. The mechanical offset between the sensor and the plate remains a \
hardware boundary.""",
]
level = "code"
role = "driver"

