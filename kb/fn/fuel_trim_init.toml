title = "Initialize trim and offset-neutral bank correction words"
summary = """
Control-state and fuel-trim initialization path. It writes 0x4000 to feature \
lifecycle word ffff2318, neutral Q8.8-percent value 0x6400 to STFT words \
ffff22dc/ffff22de and LTFT words ffff2302/ffff2304, and offset-neutral value \
0x8000 to bank correction words ffff2310/ffff2312 during broader \
initialization called from FUN 0002c648."""
note = [
    """
A whole-application p-code census found no other writer for ffff2318 and no \
later writer for ffff2310/ffff2312. The fixed ffff2318 value makes the \
strict less-than-0x4000 feature-map condition in 0004afdc false. Runtime \
producers replace the diagnostic trim words.""",
]
level = "code"
role = "init"
block = "fuel_closed_loop/block"

