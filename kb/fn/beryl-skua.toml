summary = """
EVAP purge-flow monitor feeding P0441. It samples word ffff10c4 through a \
multi-stage state machine and sets ffff24a1 bit 6 after its final threshold \
and operating-range gates. FUN 000abca2 consumes that bit and dispatches \
descriptor index 0xd6."""
note = [
    """
The exact descriptor is P0441, but FUN 000abca2 skips this monitor in stock \
JK08A because ROM8[0x18700].bit1 is clear. Internal flow metric scaling and \
the full enable sequence remain unresolved.""",
]
