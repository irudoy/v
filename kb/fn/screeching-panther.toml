summary = """
Dual-channel coordinate conditioner for conversion curve 000148fa. It looks \
up Q1.7 divisor C from 00012292 by high8(uint16[ffff4524]) over axis \
00011b47. For each selected source X, it forms d=sat_s16(X-880). When C is \
nonzero and the range gates pass, the returned coordinate is \
max(0,880+sat_s16(trunc0(128*d/C))); otherwise the original X is returned."""
note = [
    """
ROM8[00008978].bit3 selects the source pair: set uses ffff2882/ffff2884; \
clear, as in stock 0xa0, uses 2*ffff267c and 2*ffff267e. The physical sensor \
quantity and engineering scale of the coordinates are unresolved.""",
    """
The complete bounded conversion executes both channels with exact bytes and \
real helpers; both signed16 clamps, admission/bypass, integer lookup \
rounding and final output saturation are independently checked. The \
independent software domain and reader interpretation do not establish \
source producers, physical units, engine reachability, permission or \
cadence. B = uint8(x); M = (ROM8[0x00008978]>>3)&1; X = \
M*RAM16[0xffff2882+2*B]+(1-M)*uint16(2*RAM16[0xffff267c+2*B]); H = \
ROM16[0x00008f98]; D = sat_s16(X-H); C = uint8(from); K = min(1,C); Q = \
K*sat_s16(trunc0(128*D/max(1,C)))+(1-K)*(65535*min(1,max(0,(D)-(0)+1))-32768); \
S = RAM16[0xffff110a]; W = RAM16[0xffff4524]; G = \
min(1,max(0,(S)-(ROM16[0x000095c6])))*min(1,max(0,(65280)-(S)))*(min(1,max(0,(W)-(ROM16[0x00009384])))+min(1,max(0,(ROM16[0x00009386])-(W))))*K; \
to = uint16((1-G)*X+G*max(0,H+Q))""",
]
