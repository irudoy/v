title = "Build and evaluate the P0101 bank-1 range-performance state"
summary = """
First-bank P0101 MAF range-performance monitor. It builds model byte \
ffff15bc and composite byte ffff12eb from throttle-derived weights and \
factors 0001236a/00012ac2/00012868, evaluates two fault candidates, \
maintains event context, and returns a Boolean that 00080f82 dispatches as \
runtime record 0xba."""
note = [
    """
Stock 00008d92 bit 5 is set, so the model_byte < ffff12eb comparison is \
bypassed. The composite survives only in captured P0101 event context; exact \
code does not connect it to fuel or actuator control.""",
]
level = "code"
role = "monitor"
block = "maf_monitors/block"

