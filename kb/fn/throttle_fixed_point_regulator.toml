title = "Update regulator state and publish effort magnitude and direction"
summary = """
Stateful per-channel throttle regulator. It consumes feedback-reference \
magnitude and direction ffff36a0/ffff369c, scaled target magnitude and \
direction ffff391c/ffff392b, and coefficient/state arrays selected by \
000cb41c. It publishes effort magnitude ffff37b8+4*channel and direction \
ffff369a+channel, and writes state ffff2628+4*channel capped by \
ROM32[0x96bc]=0x000d0000 for the next-pass snapshot."""
note = [
    """
The controller data flow and output/state distinction are exact. A simple \
PID or physical torque interpretation is not assigned.""",
]
level = "code"
role = "driver"
block = "throttle_servo/block"

