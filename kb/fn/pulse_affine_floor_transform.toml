title = "Apply the saturating affine floor to a compensated pulse word"
summary = """
Pure saturating affine-floor transform applied to each injection-pulse word. \
With stock words C0=13656, C1=16384, D0=4250, and D1=0 at 0x91da, it returns \
max(x, sat_u16(floor((x*C0+100*D0)/16384)), \
sat_u16(floor((x*C1+100*D1)/16384))). FUN 0004eba2 applies it between \
ffff23c8 and ffff23d4, and FUN 00051a98 between ffff155c and ffff1568."""
note = [
    """
The stock second affine branch equals x, so the result simplifies to max(x, \
sat_u16(floor((13656*x+425000)/16384))). It is the last minimum-pulse floor \
before the hardware: on the 10 us duration scale it holds a 0.26 ms minimum \
and stops acting at 1.56 ms.""",
]
level = "code"
role = "service"
block = "fuel_quantity/block"

