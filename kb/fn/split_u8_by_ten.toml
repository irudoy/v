title = "Split an unsigned byte into quotient and remainder modulo ten"
summary = """
Unsigned byte division by ten used by APC command schedulers. It multiplies \
the input by reciprocal 0x199a, stores floor(input/10) through the word \
pointer, and stores input-10*quotient through the byte pointer."""
note = ["The reciprocal is exact over the admitted byte domain."]
level = "code"
role = "service"
block = "ignition_output/block"
contract = """
Given r4=x in 0..255, r5=&q and r6=&r, writes q=floor(x/10) as uint16 and \
r=x-10*q as uint8."""
contract_level = "code"

