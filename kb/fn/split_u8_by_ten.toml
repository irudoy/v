note = [
    """
The complete 7mfk helper 00028e7c..00028e9c uses a 32-bit R4 input M and \
distinct output pointers in R5 and R6. Q = floor(uint32(6554*M)/65536); the \
word output is Q and the byte output is uint8(M-10*Q). The stock return \
delay slot restores entry MACL. Q equals floor(M/10) for M in 0..255, while \
M=200000 gives Q=20001 and byte 246. The helper neither caps a quotient nor \
establishes caller pointer identities, units or hardware reachability.""",
]

