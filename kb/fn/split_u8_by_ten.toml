title = "Split an unsigned byte into quotient and remainder modulo ten"
summary = """
Unsigned reciprocal splitter used by APC command schedulers. For the \
complete 32-bit input M it computes Q=floor(uint32(6554*M)/65536), stores Q \
through the word pointer and uint8(M-10*Q) through the byte pointer. For M \
in 0..255 this equals ordinary division by ten; larger inputs can differ \
through reciprocal precision or low-32-bit product wrap. The natural return \
delay slot restores MACL."""
note = ["The reciprocal is exact over the admitted byte domain."]
level = "code"
role = "service"
block = "ignition_output/block"
contract = """
Given r4=x in 0..255, r5=&q and r6=&r, writes q=floor(x/10) as uint16 and \
r=x-10*q as uint8."""
contract_level = "code"

