summary = """
Exact P0306..P0300 result reconciler. It scans the seven runtime records in \
descriptor order and updates ffff2461.bit3. A record with third-byte bit 6 \
terminates the scan without retaining ffff5b2c.bit3; a record with bit 5 set \
and bit 6 clear terminates the scan and retains that latch. Records with \
neither bit clear ffff2461.bit3 and advance. Therefore ffff5b2c.bit3 \
survives only when the first record carrying either bit has bit 5 set and \
bit 6 clear."""
note = [
    """
The reconciliation rule and descriptor order are exact. The physical \
diagnostic phase represented by either status bit remains unresolved.""",
]
level = "code"
role = "service"
block = "misfire/block"

