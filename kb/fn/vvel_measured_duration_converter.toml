summary = """
Converts the measured VVEL shaft-angle words ffff2670 and ffff2672 for \
charge_model: it looks up vvel_command_shaft_angle over \
vvel_shaft_angle_axis at each word and returns each result times 1/512, the \
duration domain of defs/analysis/valve-timing/JK78C.vvel.md. charge_model \
stores the mean of the two results times 512 at ffff33ae and each result, \
clamped to 0..127.998, times 512 at ffff2816 and ffff2818."""
