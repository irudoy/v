summary = """
Component with override clamps: bits 4/5 of ffff41fb force output ffff2c6c \
to the lower or upper bound ffff413a/ffff4138. Map 0x14AFA is a \
normalization denominator: when M != 0 it computes min(255, \
floor(uint16(ffff412a)*255/M)); when M = 0 the result is 255."""
note = [
    """
The physical quantities of denominator 0x14AFA and input ffff412a are \
unresolved.""",
]
