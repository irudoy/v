title = "Normalize command decade and remainder across APC position events"
summary = """
Tooth-count normalizer of the crank-angle compare schedulers. A command is a \
count of 10-degree steps from the current tooth plus a remainder in degrees; \
the normalizer converts the step count into a count of tooth events across \
the two-missing-teeth gap that follows tooth 7, selected by tooth counter \
ffff13b2. On tooth 4 it maps 4 to 3 with remainder + 10, 5 to 3 with \
remainder + 20, and 6..15 to count - 2. On tooth 9 it maps 9 to 8 with \
remainder + 10 and 10 or more to count - 2 with remainder + 20. On every \
other tooth, which is tooth 7 for the primary scheduler, it maps 1 to 0 with \
remainder + 10, 2 to 0 with remainder + 20, 3..12 to count - 2, 13 to 10 \
with remainder + 10, 14 to 10 with remainder + 20, and 15..24 to count - 4."""
note = [
    """
Callers are primary scheduler 0002a892, secondary scheduler 0002acba, \
delayed injection-start programmer 0002b64a, and 00057380. The arithmetic is \
exact for a plate with ten teeth at 10-degree pitch per 120 crank degrees \
and two missing teeth between tooth 7 and tooth 8: a step that lands inside \
the gap is fired from tooth 7 with the missing 10 or 20 degrees added to the \
remainder, and a step beyond the gap loses two tooth events per gap crossed. \
On tooth 9 the exact range ends at count 10.""",
]
