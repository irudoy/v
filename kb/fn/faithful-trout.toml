summary = """
Sample collector of the MAF coefficient calibration sequence. While state \
byte ffff2985 is 1 it requires snapshot ffff1a3e to lie within \
ROM8[0x8d3e]*4=856..ROM8[0x8d3f]*4=944 counts, adds it to accumulator \
ffff3524, and advances the state to 2 after eight accepted samples. An \
out-of-range sample clears coefficient ffff4970 and aborts to state 3."""
note = [
    """
The accepted window is 4.28..4.72 V at 5 mV per count, a symmetric band \
around the 900-count design point of the sequence.""",
]
level = "code"
role = "service"
block = "airflow_load/block"

