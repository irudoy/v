summary = """
Bank-indexed rear O2 heater circuit monitor. Under its exact enable gates it \
compares ffff2722[bank] with ROM8[0x8aaf]=0x0c and ROM8[0x8ab0]=0xec. A \
value below 0x0c dispatches descriptor 0xb1 or 0xb2 for P0037/P0057; a value \
at or above 0xec dispatches descriptor 0xaf or 0xb0 for P0038/P0058. \
In-range state reloads the monitor byte at ffff4293[bank] from \
ROM8[0x8ab2]=5."""
note = [
    """
Code establishes the threshold and descriptor selection. A whole-program \
p-code scan found no direct writer for ffff2722, so its producer and \
physical current or voltage scale remain unresolved.""",
]
level = "code"
role = "monitor"
block = "o2_catalyst/block"

