summary = """
Worker of the cold-start control monitor, records 0x126 (P1421) and 0x125 \
(P1422), reached through pointer slot 0007c4dc. It writes completed, fail, \
and pass bits 5, 6, and 7 of ffff41a1 and the capture block ffff5628. It is \
also one of two accessors for reserve map 0x14FF2: when the current value is \
zero, interpolated uint16 M is converted to 255*M and written to ffff4058."""
note = [
    """
The physical quantity of accumulator ffff4058 is unresolved. A structured \
Nissan profile names P1421 COLD START CONTROL; routing stage 0009bdd0 \
reports the records only under ROM8[0001870e] bits 0 and 1, which stock \
JK08A holds clear.""",
]
level = "code"
role = "monitor"
block = "thermostat_coldstart/block"

