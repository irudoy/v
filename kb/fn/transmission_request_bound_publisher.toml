summary = """
Common transmission request-bound publisher called after the selected or \
alternate coordinator. Under stock ROM8[0x83c1].bit0 clear and ffff41a6.bit3 \
set, it publishes min(ffff34c8, ffff4162) as lower bound ffff3484, ffff4162 \
as upper bound ffff3480 under stock ROM8[0x89c5].bit0, and ffff349c as \
ffff347e and ffff3482. With bit 3 clear, it publishes the ordinary \
preselected request words. The resulting four words ffff347e, ffff3480, \
ffff3482, and ffff3484 enter FUN 00079030."""
note = [
    """
Publish transmission-derived signed bounds for the common request boundary""",
    """
FUN 00077892 sets the selecting bit during a gear change with TCM status 3 \
and for the 307.2 ms hold after it; the 2026-09-22 road captures show the \
resulting bounds on ffff19c6 in 4-3 and 3-2 downshifts.""",
]
level = "code"
role = "driver"

