summary = """
Requested-torque row-coordinate producer and overspeed bookkeeping. It \
writes ffff1702=max(32, ffff11b6) and ffff1cca=max(32, ffff11d0), keeps \
ffff246b bit 3 set while ffff11b6 is at least ROM16[0x934a], or at least \
ROM16[0x934a]-64 once the bit is set, increments saturating byte ffff4994 \
while the bit is set and ffff246e bit 3 is clear, and holds the maximum of \
ffff11b6 in ffff506e."""
note = [
    """
With ffff11b6 in RPM/3.125 counts, ROM16[0x934a] = 2560 is 8000 RPM and the \
release point is 7800 RPM.""",
]
level = "code"
role = "service"
block = "engine_speed/block"

