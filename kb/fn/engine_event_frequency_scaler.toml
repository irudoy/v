summary = """
Engine-event frequency scaler. While ffff417f bit 5 is clear, it writes \
ffff1206=floor(12000000/(ROM8[0x88fb]*uint32[ffff22d4])) through unsigned \
divider 00021ce0 and ffff1208=floor(uint16[ffff1206]/2); while the bit is \
set, it writes zero to both words."""
note = [
    """
ROM8[0x88fb] is 3 in all six project ROMs, the number of engine events per \
crankshaft revolution of a four-stroke V6. Interval ffff22d4 equals \
ffff11fc, 6250000/RPM counts of 3.2 us, so ffff1206 is 0.64*RPM and ffff1208 \
is RPM/3.125, the representation of ffff11ee.""",
]
level = "code"
role = "service"
block = "engine_speed/block"

