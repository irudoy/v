title = "CAN-derived requested RPM ceiling fuel inhibit"
summary = """
CAN-derived RPM-ceiling fuel-inhibit contributor. A valid source byte \
defines max(36,source)*50 RPM; the contributor activates strictly above that \
threshold and releases with 300 RPM hysteresis."""
note = [
    """
Source values 0 and 0xff and fault bits ffff4189.bit1 or ffff4250.bit7 \
disable the limiter. Internal dispatch key 0x2ee0 is not asserted to be a \
physical CAN identifier.""",
]
