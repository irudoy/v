summary = """
Long-term fuel-trim diagnostic-word producer. For each bank it calculates \
selected learned word ffff2306/ffff2308 + adjustment ffff5648/ffff564a - \
0x6400. Under the normal limiting gate it clamps the result to \
ROM8[0x8e5b]<<8 through ROM8[0x8e5a]<<8; fault and control gates force \
neutral 0x6400. It writes ffff2302 for bank 1 or ffff2304 for bank 2."""
note = [
    """
The stock calibrated normal-path range is 90 through 110 percent. UDS DIDs \
0x1125/0x1126 return the high bytes; J1979 PIDs 0x07/0x09 convert the \
complete words.""",
]
level = "code"
role = "accessor"
block = "fuel_closed_loop/block"

