summary = """
CAN 0x180 payload serializer for software record 7. Bytes 0..1 are \
sat_u16(u16[ffff11ee]*25); byte 2 and byte 3 bits 7..4 are actual-torque \
word ffff3f96; byte 3 bits 3..0 and byte 4 are requested-torque word \
ffff3f90; byte 5 and byte 6 bits 7..6 are min(u16[ffff279c],1000); byte 6 \
bits 5 and 4 copy ffff4246 bits 5 and 4; byte 6 bits 3..0 are ffff3d3a&15; \
byte 7 bits 7..5 are ffff4104; byte 7 bit 4 is ffff4248.bit7; byte 7 bit 2 \
is ffff4196.bit4 and bits 1..0 hold 1 while that bit or ffff2451.bit7 is \
set."""
note = [
    """
The payload occupies ffff3afd..ffff3b04. The function sets ffff4229.bit2 on \
exit.""",
]
