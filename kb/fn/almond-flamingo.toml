summary = """
Accumulator stage of the P0125 coolant-temperature monitor. It writes \
ffff2b80=0 while ffff41dd bit 7 or ffff244f bit 5 is clear. Otherwise, while \
ffff84c3 bit 6 is set and START SIGNAL bit 6 of ffff4184 is clear, it lowers \
ffff2b80 by ROM8[00008cd8], stopping at zero, while fuel mask ffff22e0 is \
nonzero; while ffff22e0 is zero and battery-voltage snapshot ffff1108 is at \
least 0x89, it writes threshold t=lookup(000151d2, ffff106f<<8) through \
000263f4 to ffff321e and raises ffff2b80 by 0x100 while ffff2716 is at least \
t and by ROM8[00008d2a] otherwise, saturating at 0xffffff. Other states keep \
ffff2b80."""
note = [
    """
000a66e8, which diagnostic periodic dispatcher 0007bfc4 calls at 0007c0d0, \
runs 000a6492, 000a64d0, 000a643c, this function, and 000a65ca only while \
ROM8[000186d0] bit 0 is set; stock JK08A leaves it clear, so the stock ROM \
does not execute this function. 000a65ca reports runtime record 0x16, whose \
descriptor carries P0125 (ECT SENSOR, EC-180 of the 2007 G35 manual), once \
ffff2b80 reaches 0xa00 times byte ffff351a while coolant byte ffff1071 is \
below ROM8[00008392] or ROM8[00008cd4], both 60, as start coolant ffff106e \
selects against ROM8[00008730]. 000a64d0 and 000a66b4 also write ffff2b80. \
Stock 000151d2 holds 0xffff in every cell, so the 0x100 step needs \
ffff2716=0xffff; stock steps are 169 up and 123 down. ffff2716 is the \
scheduler snapshot of ffff281a, which 0003d19c writes.""",
]
level = "code"
role = "accessor"

