summary = """
Stable 16-bit read wrapper. It calls 00066bd0 twice per attempt and returns \
only equal consecutive values, for up to ROM8[0x8a37] attempts. Success \
clears ffff41b9.bit0; exhaustion sets the bit and returns zero. Stock retry \
count is three."""
note = [
    """
The wrapper proves consistency checking and error signaling, not the \
external peer's physical identity.""",
]
