summary = """
Normalized fuel-temperature index producer. It reads ffff1074 and writes \
ffff117a at 000398f8: 0 below raw 10, floor(240*(raw-10)/150) through \
unsigned divider 00021bbc for raw 10..169, and 0xff from raw 170."""
note = [
    """
The transform equals coolant normalizer 00039634. Under deg C+50 the linear \
range maps -40 through 110 deg C to 0 through 240 in steps of 1.6 counts per \
deg C, and values from 120 deg C saturate to 255.""",
]
