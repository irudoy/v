summary = """
Per-revolution engine-speed qualification updater for the misfire monitor. \
It applies hysteresis to saturated RPM/12.5 byte ffff11b2 through ffff24c4 \
bit 7: a clear state sets at stock ROM8[00008bda] = 32, while an already-set \
state adds four before comparison and therefore remains set at 28 or above. \
While the state is set it increments saturating byte ffff4096; while clear \
it resets the counter to zero."""
note = [
    """
The RPM/12.5 scale makes the set threshold 400 RPM and the retained-state \
lower boundary 350 RPM. The caller cadence is once per crankshaft \
revolution.""",
]
level = "code"
role = "monitor"
block = "misfire/block"

