summary = """
Cam-coordinate deviation correction builder in the ignition-angle path. It \
forms intake target-minus-actual errors from ffff2326 against \
ffff2442/ffff2443 and overlap-like centered coordinates from target pair \
ffff2326+ffff2327 and actual pairs ffff2442+ffff2324 and ffff2443+ffff2325. \
It evaluates response curve 000125ca three times and writes the bounded \
result to ffff1a7d."""
note = [
    """
The exact DID table identifies ffff2324/ffff2325 as actual exhaust timing \
B1/B2 and ffff2327 as common exhaust target; the intake path independently \
identifies ffff2442/ffff2443 and ffff2326. The target coordinate is \
clamp_u8(ffff2326+ffff2327-192), while bank coordinates use the \
corresponding actual intake and exhaust bytes. Map 000124b2 and mode gates \
select the coefficient branch or neutral replacement. The final engineering \
interpretation as valve-overlap correction remains a physical candidate.""",
]
level = "code"
role = "accessor"
block = "ignition_timing/block"

