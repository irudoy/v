title = "Transform the final timing coordinate and schedule the APC set compare"
summary = """
Primary APC command builder and diagnostic publisher. Normal branches \
calculate command=uint8(ROM8[0x83d5]-uint8(ffff11d4)), write it to ffff2022, \
and call 0002a892. Gated branches add ROM8[0x8c95] with saturation, subtract \
ROM8[0x83ea] and cap by ROM8[0x864a], or force ROM8[0x83d5]-20 before the \
same publication and scheduling step."""
note = [
    """
The call target literal at 0004e198 is after final stock arbitration and \
before both APC command schedulers. A homologous DID 0x110a conversion is \
110-raw, so normal commands 110..117 represent a commanded coordinate of \
0..-7 deg BTDC. Scheduler 0002a892 applies the command as the delay in crank \
degrees after tooth 7 of the crank signal plate, so the firmware coordinate \
places compression TDC of event cylinder ffff11de 110 degrees after that \
tooth, on tooth 6; the mechanical offset between the sensor and the plate \
remains a hardware boundary.""",
]
level = "code"
role = "driver"
block = "ignition_output/block"

