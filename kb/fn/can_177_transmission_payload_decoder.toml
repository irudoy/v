title = "Decode CAN 0x177 requested RPM ceiling and TCM gear-phase index"
summary = """
CAN 0x177 payload decoder selected by internal key 0x2ee0. It copies payload \
byte 0 into live RPM-ceiling source ffff2818, writes payload byte 2 bits \
0..2 into live TCM gear-phase index ffff1066 for periodic snapshotting to \
ffff1064, stores payload byte 4 in ffff283e, and stores the shift-code index \
of byte 5 in ffff282c: 15 when bit 7 is set and bits 3..6 otherwise."""
note = [
    """
The stock mailbox record encodes standard ID 0x177 as STDID shifted left by \
five. Passive target traffic correlates the low three bits of byte 2 with \
zero-based gear progression and shift phase. The 2026-09-22 road captures \
hold byte 5 constant through each shift event and at 0x78 outside them.""",
]
level = "code"
role = "handler"

