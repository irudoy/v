summary = """
P0128 temperature-difference coefficient accessor. It looks up uint16 L from \
curve 00014b0a by the raw output of upstream curve 00015c40, derives \
d=clamp(trunc0(ffff3348/10000)-100*uint8[ffff2733]+5000,0,32767), and writes \
floor(d*floor(L*ROM8[00008543]/256)/256) to ffff2d08."""
note = [
    """
The raw-50 conversion of exact DID 0x1106 makes the clamped factor a \
model-temperature-minus-IAT difference in 0.01 deg C units. Every cell of \
00014b0a and 00015c40 and every point of axis 00013ff4 is zero, so ffff2d08 \
is always zero in stock JK03A and JK08A.""",
]
level = "code"
role = "accessor"
block = "thermostat_coldstart/block"

