summary = """
Stored-fault setter of the diagnostic runtime records. For an index other \
than -1 it sets bit 4 of record byte 1 and event byte ffff48ca when bit 7 \
was clear, sets bit 7 of byte 1 of ffff5718 + 3*index, sets event byte \
ffff48de, sets ffff48e0 at 0008c326 when the attribute word of the record \
has bit 10 set and ffff48e2 at 0008c338 when it has bit 13 set, and sets \
ffff2f09."""
note = [
    """
Dispatcher 0007d8b8 calls it first for every index, and monitors call it \
directly to store a result.""",
]
level = "code"
role = "service"
block = "dtc_manager/block"
contract = """
Input r4 is a record index; -1 returns without a write. The descriptor bytes \
are not read; the attribute word is read through pointer table 0001a14c only \
for the two class event bytes."""
contract_level = "code"

