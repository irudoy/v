summary = """
Per-bank rear O2 heater command-state observer called by FUN 000a38dc. It \
tests ffff2377 bit 0 for bank 1 or bit 1 for bank 2, updates the \
corresponding ffff3298 latch bit, and clears ffff4295[bank] to \
ROM8[0x8ab1]=0 when the command bit is inactive."""
note = [
    """
The command-state bit names come from the exact DID 0x130b packing path and \
a homologous structured Nissan profile. No direct writer for ffff2377 or \
physical output driver is resolved.""",
]
