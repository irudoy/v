summary = """
Primary torque-ratio lookup of the requested-torque conversion. While row \
coordinate ffff1702 is nonzero it writes ffff17e2=min(0xffff, \
floor(61440*min(ffff10d6, ffff1582)/floor(25*ffff1702/8))), otherwise \
0xffff; it scales ffff17e2 by ROM16[0000920e]/32768 with saturation into \
ffff16b2 and writes lookup(00015770, ffff16b2) to ffff19a2."""
note = [
    """
Entry 10 of the 124-entry periodic table at 0002196c calls it; L0 records no \
direct caller. With ffff1702 in RPM/3.125 counts, floor(25*ffff1702/8) is \
the engine speed in RPM, so ffff17e2 is 61440 times the smaller of ffff10d6 \
and ffff1582 per RPM. L0 records no writer of ffff10d6, and the physical \
quantities of both inputs and of the ratio are unresolved. Pedal-request \
scaler 00075306 and the six other consumers that the 00015770 map row lists \
use ffff19a2 as a zero-protected divisor.""",
]
level = "code"
role = "accessor"
block = "torque_request/block"

