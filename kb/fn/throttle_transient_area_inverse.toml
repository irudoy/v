summary = """
Converts the flow of 00048a30, which adds a manifold filling term, into the \
throttle area for 0004886a under 00048814: the area is the flow / the flux \
times 1e4, stored at ffff99d0; while bit 7 of ROM byte 00008958 is set, as \
in the stock byte 0x9a, it averages the area with the previous area \
ffff9acc. Its fraction of twice max(ROM word 00008c8a * 0.0008, 0.0008) and \
a flow-function word index throttle_target_discharge_surface; it stores the \
coefficient at ffff99d8 and the area / coefficient minus a word argument \
times 2e-4 at ffff99d4, and keeps the area at ffff9acc."""
