summary = """
Timing-state latch. It copies ffff1830 to ffff2404 when ffff1239 is 1 or 2, \
or when ffff4184.bit6 and ffff2458.bit5 are both clear; otherwise it copies \
ffff1831."""
note = [
    """
Latch the active timing-state byte for the nonlinear transition controller""",
    """
The normal selected-map path uses ffff1830. Scheduler 00020dfe snapshots \
ffff2404 into ffff2378 for the engine-event correction builder 0004d99c; \
both alternatives are crank degrees of the final coordinate.""",
]
level = "code"
role = "accessor"
block = "ignition_timing/block"

