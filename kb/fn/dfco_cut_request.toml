title = "Edge-sensitive DFCO cut-request evaluator"
summary = """
Edge-sensitive DFCO cut-request evaluator. It always interpolates \
coolant-indexed RPM thresholds 000126e4 and 00012718 by ffff106f. With \
current ffff2458.bit5 clear it returns 0. A rising edge with previous \
ffff245a.bit5 clear requires coarse vehicle speed at least 4 and selects \
00012718; a held edge selects 000126e4 on the common stock branch. It \
returns 1 only when RPM/25 ffff11b3 is strictly above the adjusted selected \
threshold."""
note = [
    """
Both threshold tables are live in stock JK08A. A2L Bosch/JECS family labels \
do not describe this executable's dynamic edge selection. Additional \
branches apply saturating offsets, lower bounds, and runtime gates. A true \
cut request is necessary but not sufficient for state-machine entry: FUN \
000503e0 also requires restore class 0. The target-vehicle restore-only A/B \
result confirms that distinction in warm moving operation.""",
]
level = "code"
role = "accessor"
block = "dfco/block"

