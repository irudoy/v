summary = """
Diagnostic readiness-latch updater. It sets ffff422e.bit7 after RPM reaches \
400, sets ffff422f.bit4 after raw coolant exceeds start-latched raw coolant \
ffff106e by at least 20, and sets ffff422f.bit5 at raw coolant 0x78 or \
above."""
note = [
    """
Update engine-running temperature-difference and coolant-warm diagnostic \
latches""",
    """
The three target bits are set-only in this updater and are cleared by \
diagnostic reset service 00080b54. Under deg C = raw-50 the latches are \
engine speed of 400 rpm, a coolant rise of 20 deg C above the temperature \
latched at engine start, and a coolant temperature of 70 deg C. Factory \
driving pattern A lists the same three conditions.""",
]
level = "code"
role = "monitor"
block = "dtc_manager/block"

