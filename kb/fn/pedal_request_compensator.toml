title = "Apply the Q15 pedal and compensation coefficient to the signed request"
summary = """
Pedal-request compensation stage. With stock ROM8[0x89fb].bit5 set, it \
normalizes ffff266e between ROM16[0x94e4]=0 and ROM16[0x94e8]=170 into Q15 \
word ffff18c8, selects max(interp2d(0x10b0e),ffff18c8), records that \
coefficient in ffff19be, caps the applied coefficient at 0xa000, and applies \
the bounded signed adjustment to ffff19d0 before writing ffff19d2. With bit \
5 clear it copies ffff19d0 to ffff19d2."""
note = [
    """
The SH word displacement at 000753f0 is scaled, so base 0x94e4 plus encoded \
displacement 2 reads 0x94e8. The operational transform is exact; the \
physical TTEPTD identity and engineering units remain candidate semantics.""",
]
level = "code"
role = "accessor"
block = "pedal/block"

