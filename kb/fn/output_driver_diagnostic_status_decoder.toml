summary = """
Output-driver status decoder. It walks the five-device table at 00023290 \
with the channel pointer table at 000232b8, six channels per device. For \
each device it takes the 16-bit diagnostic word received by serial read \
state machine 00040e6c (ffff1eaa, ffff1eb2, ffff1ea2, ffff1ea8, ffff1eb0) \
and accepts it when bits 15..14 match the device identifier, bit 13 is set, \
bit 12 is clear, the low 12 bits are non-zero, and ffff24be bit 4 is clear; \
a rejected word zeroes all six channel bytes. Channel k receives the two-bit \
field (word >> (10 - 2k)) & 3 through shift helper 0002227c."""
note = [
    """
Device 1 (word ffff1eb2, identifier 0x4000) carries the exhaust magnet \
outputs: channels 0 and 1 are ffff1120 and ffff1121 of bank 2, channels 2 \
and 3 are ffff111e and ffff111f of bank 1. Scheduler 00020dfe copies block \
ffff1114..ffff1193 to ffff1094..ffff1113 at 00020f56.""",
]
