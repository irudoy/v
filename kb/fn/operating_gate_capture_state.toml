title = "Publish captured accumulator threshold state"
summary = """
Copy uint32[ffff437c] to ffffa624. When ffffa635 is zero and both ffffa634 \
and ffffa636 equal one, latch ffffa62c and capture the accumulator at \
ffff4384; set ffffa62b below the threshold at ffffa630, otherwise set \
ffffa62a. A nonzero ffffa635 clears the two comparison-result bytes. Paths \
that return early preserve their prior state bytes."""
note = [
