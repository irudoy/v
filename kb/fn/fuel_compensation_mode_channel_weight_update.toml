note = """
Mapper 00050310, called at 00050122, maps VVEL input mode 5 to code 2 and \
mode 15 to code 8 from RAM byte fffe99c2. Retention helper 000503cc at \
00050134 preserves the previous mapped code, stored to fffeb8dc at 00050140. \
Store 0005014a writes the current byte code to fffeb826; store 0005024e \
writes the word weight to fffeb824. Snapshot 00021240 copies the current \
pair at 00021812/00021814 to fffeb820/fffeb822 and copies fffeb8dc to \
fffeb850 through the 0002182a block-copy call. Coordinator 00048564 weights \
the current channel by the snapshot weight and the previous or held channel \
by 0x8000 minus that weight. Stock driving reachability of modes 5 and 15 \
remains unqualified."""

