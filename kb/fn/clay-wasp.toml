summary = """
Continuation body of IMI4D handler 000c2d76. It completes the segment-index \
mapping (value 7 to 0, lower values plus 5) into ffff16f2, copies normalized \
interval ffff22bc to ffff224c, and, while cylinder index ffff11de is 1, 3, \
or 5 and driver status ffff850c bit 5 is clear, shifts ffff1202 into \
ffff1204 and ffff1200 into ffff1202 and writes ffff1200 = 20*segment + \
floor(20*interval / ffff22bc) through signed divider 00021bbc at 000c2e60. \
It then increments saturating byte ffff4072, the bank-1 edge count of the \
current window judged by 000c22dc, while arm copy ffff4120 bit 0 or ffff4121 \
bit 0 is set, and returns with rte."""
note = [
    """
The entry has no caller in the export; it is reached only from 000c2d76. One \
phase unit is 0.5 crank degrees (ffff22bc is 10 degrees at the 3.2 us \
capture clock).""",
]
level = "code"
role = "handler"

