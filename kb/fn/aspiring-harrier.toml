summary = """
Primary bank-indexed rear O2 fault dispatcher. It dispatches indices \
0xa7/0xa8 for P0139/P0159 when either ffff26e9[bank] or ffff26eb[bank] is \
below 0x80, 0xab/0xac for P0137/P0157 when ffff2726[bank] is below 0x24, and \
0xa9/0xaa for the path-A P0138/P0158 descriptors when ffff2724[bank] reaches \
0xff."""
note = [
    """
Descriptor records establish the rear O2 fault identities. The internal byte \
scales and all surrounding enable/timing conditions remain unresolved.""",
]
level = "code"
role = "monitor"
block = "o2_catalyst/block"

