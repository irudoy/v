summary = """
Transient additive-term coordinator. On the negative ffff1a66 branch it \
halves the 0x12176 lookup into byte ffff150a; the nonnegative branch uses \
constant 64. It then calls 00052902, which writes \
clamp_s16(trunc_toward_zero(uint8(ffff150a)*int16(ffff1a66)/256)) to \
ffff2300 unless a runtime gate forces zero."""
note = [
    """
Select transient coefficient and invoke the signed additive-term producer""",
    """
Coordinator 000522c4 runs at scheduler index 42 immediately before pulse \
precursor 0004e974. The physical transient qualifier remains unresolved.""",
]
