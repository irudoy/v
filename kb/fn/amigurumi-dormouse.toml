summary = """
Sequential-injection sequencer, entry 1 of the ten-entry engine-event task \
table at 00021b5c run by feeder 000208f8. It increments saturating event \
counter ffff4555 and ORs the one-hot bit of engine-event cylinder index \
ffff11de into ffff1526. The lead in engine events is 3, or snapshot ffff2364 \
while ffff8513.bit5 is set, and the target slot byte ffff20b4 is \
uint8(c-1-lead), with one addition of 6 when the difference is negative. For \
a given c in 1..6 this equals modulo 6 when selected lead <= c+5; selected \
lead <= 6 covers all six c values. The bounded consumer stores 255 for c=1, \
lead=7 and bit5 set. Upstream bounds and hardware reachability retain \
separate evidence. When P0335 fallback snapshot ffff24c9.bit5 is set and \
ffff8513.bit4 is clear it sets ffff8513 bits 7..4 and ffff8514.bit7 and \
seeds last slot ffff221e with the slot before the target and previous lead \
ffff221d with the lead. The rest runs only while ffff8513 bits 7..5 are all \
set. While delayed-start flag ffff84ec.bit7 is still set it refills duration \
array ffff224e through FUN 00054d3e, with parameter 4 while ffff24c9.bit5 is \
clear and start-event count ffff2298 is at most 4 and parameter 3 otherwise, \
fires pending mask ffff2228 through one-shot scheduler 0002c13c, and clears \
TIER1A bit 0 at fffff462. It then compares ffff221d with the lead. On \
equality it accepts the target slot only as the modulo-6 successor of \
ffff221e. On a smaller lead it advances ffff221e through the skipped slots, \
accumulates their masks from ROM table 00022695, refills the array with \
parameter 3, fires them at once, and accepts the target slot. On a larger \
lead it accepts none. The pending mask becomes ROM8[00022695 + slot] for an \
accepted slot and zero otherwise. Every fired mask is ORed into ffff20b5, \
ffff157e, and ffff16fe, removed from DFCO fallback history ffff1935, and, \
while ROM8[00008d92] bit 3 is set, ORed into ffff14c3 and ffff14c2. It ends \
by storing the lead in ffff221d and calling delayed-start programmer \
0002b64a with angle 4*ffff2333, or 0x34 while ffff4251.bit0 is set."""
note = [
    """
Slot masks at 00022695 are 02 04 08 10 20 01. ffff2364 and ffff2333 are the \
00020dfe snapshots of lead ffff23f0 and start angle ffff23bf from FUN \
000521a8. Engine-event driver 00028ea2 sets ffff8513.bit6 after the first \
grouped pulse and bit 5 when start-event count ffff2298 reaches 4; \
compare-match handler 0002be40 clears ffff84ec.bit7 when the delayed start \
fires first. The accepted slot carries channel bit (ffff11de - lead) mod 6, \
whose reference event is tooth 7 of that event index. Channel bit k drives \
the injector of cylinder k + 1: service 0x30 IOLID 0x0c Power Balance \
replaces the same six-channel mask bit for bit and the Nissan-family profile \
assigns its bits 1, 2, 4, 8, 16, and 32 to cylinders 1..6. The reference \
tooth is then 130 degrees after intake TDC of the injected cylinder. The \
assignment is not measured electrically.""",
]
level = "code"
role = "driver"
block = "injector_output/block"

