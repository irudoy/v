summary = """
Per-bank reset of catalyst-monitor state for bank r4 (0 or 1). It clears \
mask r4+1 in flag bytes ffff34a8, ffff32f0, ffff32f2, ffff2fee, ffff32f5, \
ffff2b51, ffff328b, ffff2bac, and ffff2bab; zeroes the bank elements of \
ffff335c, ffff3300, ffff3187, metric ffff314d, limit ffff2b6f, word array \
ffff3336, and longword arrays ffff4008 and ffff332c; zeroes ffff47db, \
ffff2ebe, and ffff2ebf; and writes ROM8[0000848e] to ffff426c[bank], 0xff to \
test-value record ffff491e[bank], the interpolation of 00011fb6 at \
engine-speed byte ffff11b2 to limit record ffff492e[bank], and 0x80 to \
ffff2c84[bank]."""
note = [
    """
000a3ea0, which diagnostic periodic dispatcher 0007bfc4 calls, calls \
000a3a14 and then this function for banks 0 and 1 while ROM8[000186ce] bit 6 \
and ffff424f bit 2 are set. Stock ROM8[000186ce] is 0x80, so stock JK08A \
does not execute it. Catalyst-monitor branch 000a2f56 compares \
ffff314d[bank] with ffff2b6f[bank] and records both in ffff491e[bank] and \
ffff492e[bank].""",
]
level = "code"
role = "init"
block = "o2_catalyst/block"

