summary = """
Throttle-angle coordinate of a combined opening area. It takes doubled \
first-channel area ffff12a2 when ROM8[0000870c] bit 7 is set and ffff12a0 \
otherwise, adds ffff1300 with uint16 saturation and writes the sum to \
ffff1364, converts the sum through 000155a0 over axis 00013202 into angle \
coordinate ffff1c92, and writes byte ffff1c91: 255 when ROM16[00008ff0] is \
zero, otherwise min(255, floor(255*ffff1c92/ROM16[00008ff0])>>2) while \
ROM8[00008b38] bit 7 is clear, or min(255, \
floor(255*ffff40c6/ROM16[00008ff0])) while it is set."""
note = [
    """
Its only caller 0006e71c, entry 88 of the 124-entry periodic table at \
0002196c, calls it only when ROM8[0000870c] bit 7 is set; stock 0x44 has the \
bit clear, so stock JK08A does not execute it, and the ffff12a0 branch is \
unreachable through that caller. With ROM16[00008ff0]=727 the byte reaches \
255 at coordinate 2908, 89.5 percent of throttle opening on the 000155a0 \
scale. L0 records no reader of ffff1364, ffff1c92, or ffff1c91. ffff1300 \
comes from 0006e490, which applies the 0001296c lookup of 0006e3d8 as a \
multiplier; its physical quantity is unresolved.""",
]
level = "code"
role = "accessor"
block = "throttle_target/block"

