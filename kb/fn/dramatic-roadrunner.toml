Floor curves for a target quantity: byte-identical 1D-16 pair \
0x12908/0x12918 with shared hash 786c40a671b09d6c, selected by bit 3 of \
ffff4250 and written to ffff171a. Consumer 000474a4 establishes the floor \
role by taking max(uVar4, ffff171a<<3). Under bit 5 of ffff2458, the same \
component also contains a peak-hold and implicit map 0x12042."""
