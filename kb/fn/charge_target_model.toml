vvel_load_coordinate ffff238a. 00051bb8 and 0005247a form an angle that it \
stores times 128 at charge_target_angle ffff351c; 00052bc4 and 000524d4 form \
the outputs that it stores times 20 at ffff356e and ffff356c. spectral-yak \
reads all three. Its callees repeat the volume, flow, valve area and closing \
correction lookups of charge_model and invert vvel_duration_characteristic \
and charge_ratio_response_curve."""
