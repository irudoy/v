00021bb8. It reads engine speed ffff11a0 and ffff11a6, the charge_model \
outputs ffff3322 / 128, crank_degree_time ffff2e3c * 2.55e-8, ffff326c * \
2^-40, charge_target_ratio ffff3134 and ffff3146 times 2^-14, ffff369a * \
