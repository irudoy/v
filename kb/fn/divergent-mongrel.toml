summary = """
Exhaust-CVTC target-surface accessor. It interpolates cold/fallback surface \
0xB2FA into ffff1c5f and warm/main surface 0xB33A into ffff1c5d using RPM/50 \
and Q7 normalized-BFS coordinates. When ffff2466 bit 6 is set, it subtracts \
centered 4x4 correction 0xAB4A from the warm/main result before \
publication."""
note = [
    """
The normal coordinates and centered subtraction are exact. Bit 3 of ffff2468 \
or bit 0 of ffff5773 can substitute 0xff for the load input. The \
exhaust-target identity is closed by downstream ffff2327, exact DID 0x1166, \
and exhaust-VTC diagnostic consumers. The 0.5 degCA-per-count scale remains \
homologous.""",
]
level = "code"
role = "accessor"
block = "cvtc_exhaust/block"

