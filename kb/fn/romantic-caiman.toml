summary = """
AN1-derived two-lane source update sequence. It filters phase-specific AN1 \
samples through FUN 0003d258, converts them through map 00012dea in FUN \
0003d2dc, conditionally lowers running minima ffff3f4c/ffff3f4d through FUN \
0003d45c, copies element 0 to ffff283c, and invokes FUN 0003d7b4 to produce \
ffff283a for the scheduler snapshot. It also calls FUN 0003d4a8 for both \
lanes and copies unfiltered temperature PID element ffff3f42 into J1979 PID \
0x0F byte ffff3f41 at 0003d8c4."""
note = [
    """
The complete code-proven path is SH7058 AN1 -> ffff1d58 -> ffff2832 -> map \
00012dea -> ffff2838 -> ffff3f4c -> ffff283c -> ffff283a -> ffff2736. J1979 \
Mode 01 PID 0x0F publishes the lane-0 transfer code minus 10 as intake air \
temperature in A-40 deg C, so the ECU declares the code as deg C+50; the ECM \
terminal and physical signal remain unresolved.""",
]
level = "code"
role = "dispatch"
block = "o2_catalyst/block"

