summary = """
Gated accessor for additive table 0x13016 with implicit axis, 1D-8 uint8, \
entry 0x26370, and core 0x26a80. Gate is bit 6 of ffff249f; index is \
ffff1152>>3 clamped to 0..255; result is reduced by 0x80 and clamped to \
[-16,+15]; output is ffff15c8 at base ffff128c+0x33c. With the gate clear \
output is 0. All eight cells of 0x13016 equal 0x80, so the addition is \
identically zero in this image."""
note = [
    """
A wave 4 singleton missed by the classifier. The physical quantity is not \
derived: ffff1152 is a shared 16-bit input for the 0x76xxx group, its \
meaning is not traced, and ffff15c8 has no direct readers outside 000763e2. \
The role of bit 6 of ffff249f is a new facet of a known bit field; bit 1 \
selects the crossfade pair in 0007a592.""",
]
