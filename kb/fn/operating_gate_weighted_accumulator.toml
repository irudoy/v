title = "Accumulate weighted reference and emit inverse feedback"
summary = """
Read word curve 000160ea with uint16[ffff11e0] on axis 00014fcc and curve \
00015902 with 32768 + final_timing/ram in degBTDC from signed byte ffff1f45 \
on axis 00014f9c. While permitted, multiply the coordinator-selected \
BFS-derived reference of operating_gate_reference_mode_flags by the timing \
factor and shift right six with uint16 saturation; multiply by the \
word-coordinate factor and shift right ten with a separate uint16 \
saturation. Accumulate with cap 0x00feff01, otherwise retain the \
accumulator. Override ffff974c.bit3 substitutes 255 times curve 0001622a. \
Store the accumulated or override value at ffff27fc and retain it at \
ffffa640. Divide by max(ROM16[000090d8],1), cap to 255 and publish inverse \
feedback 255-result at ffff4332, which BCC6C reads later in the same \
coordinator pass."""
note = [
    """
Known BFS, coolant, battery-voltage and final-timing inputs retain their \
tracked conversions. The enclosing physical subsystem, invocation period and \
other input quantities remain unresolved. Curve-output conversions, editor \
publication and later-layout counterparts require separate qualification.""",
]
