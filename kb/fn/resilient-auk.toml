summary = """
State controller using shared nonzero gate curve 000122d2. On the \
calibration-read branch it interpolates the curve by uint16[ffff11f0] over \
axis 00014d2a and writes ffff2522. Later code tests only ffff2522!=0 before \
admitting a calculation involving ffff22e4 and ffff1196."""
note = [
    """
The interpolated magnitude is discarded; only zero versus nonzero affects \
the state path. The physical purpose of the gate and its coordinate is \
unresolved.""",
]
