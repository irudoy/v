summary = """
Trustful twin of torque-ratio lookup 00075174 over row coordinate ffff1cca. \
While ffff1cca is nonzero it writes ffff1cda=min(0xffff, \
floor(61440*min(ffff10d6, ffff1582)/floor(25*ffff1cca/8))), otherwise \
0xffff; it scales ffff1cda by ROM16[000162f2]/32768 with saturation into \
ffff1cc8 and writes lookup(00019190, ffff1cc8) to ffff1d16."""
note = [
    """
Entry 14 of the 124-entry periodic table at 0002196c calls it; L0 records no \
direct caller. In stock JK08A ROM16[000162f2] equals primary \
ROM16[0000920e], and 00019190 holds the sixteen values of 00015770. 00074478 \
uses ffff1d16 as a multiplier. The physical quantities are unresolved, as \
for 00075174.""",
]
