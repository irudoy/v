summary = """
Bank-specific catalyst-monitor metric accumulator. It scales ffff3300[bank] \
by ROM8[0x8b0b] or ROM8[0x8b0c], accumulates a saturated uint16 sum at \
ffff3336+2*bank, increments sample count ffff3187[bank], divides the sum by \
the count, caps the result at 255, and writes ffff314d[bank]. A zero count \
writes 0xff."""
note = [
    """
Code establishes the averaging and saturation path. The physical quantity \
and units remain unresolved.""",
]
level = "code"
role = "accessor"

