summary = """
Init/reset routine that fills RAM with default values and initializes \
several calibration paths. For Base Fuel Schedule, it looks up M from uint16 \
fallback map 0x15630 by uint8[ffff1077]<<8, writes M to ffff1e44 and M>>2 to \
ffff1e40, and calculates q=min(65535,floor(M*uint8[ffff1160]/512)). It \
writes q to ffff1062, min(65535,4*q) to ffff1dee and ffff1e06, and, when \
ROM8[0x8d92].bit4 is set as in stock JK08A, to ffff1dec and ffff1e04. The \
same min(65535,4*q) initializes newest diagnostic word ffff1026. It also \
copies throttle-limiter scalar 0x942c to ffff1796 and forms selector \
ffff23ed from map 0x1218e."""
note = [
    """
The initialization arithmetic and ffff1026 sink are exact. The Base Fuel \
Schedule identity follows from the exact DID 0x1208 binding. The raw/2048 ms \
conversion of map 0x15630 remains candidate evidence pending hardware \
validation.""",
]
level = "code"
role = "init"
block = "startup/block"

