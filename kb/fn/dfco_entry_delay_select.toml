title = "Select two-stage DFCO entry delay"
summary = """
DFCO entry-delay selector. It returns stage1<<8|stage2 for 000503e0. Stock \
ROM8[0000870c].bit7 clear branches select stage 1 values 40, 60, or 75 and \
stage 2 zero; a configuration override can place 10 or 20 in stage 2. \
Conditional non-stock branch interpolates 000120f6 into stage 1 from a \
speed-derived coordinate."""
note = [
    """
All cells of 000120f6 are 60. Delay units are the periodic DFCO scheduler \
count.""",
]
level = "code"
role = "accessor"
block = "dfco/block"

