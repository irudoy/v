summary = """
Stock-resolved common signed MAF-correction producer. Let \
A=(ROM8[0x86f9]&0x20)!=0, B=(ROM8[0x8b3f]&1)!=0, C=ROM8[0x8782], \
U=uint8[ffff1e73], and S=int8[ffff56ba]. If !A&&!B it writes zero; if !A&&B \
it writes floor(C*S/32); if A&&B it preserves the prior word; otherwise it \
writes floor(C*(U-123)/32) for 5<=U<=122, floor(C*(U-133)/32) for \
133<=U<=250, and zero outside both ranges. Stock A=false and B=false, so \
every call writes zero."""
note = [
    """
Five SH-2E arithmetic right shifts implement floor division by 32 for \
negative products. The alternative mode's physical meaning and engineering \
scale remain unresolved.""",
]
level = "code"
role = "service"
block = "airflow_load/block"

