summary = """
Engine-event scheduler feeder and timing-task dispatcher. It first calls \
00028af8 and 00028b5c to publish two wrap-corrected interval snapshots, then \
sets ffff84ba bit 7, advances modulo-3 phase ffff9f24, and sets ffff84ba bit \
6 when the phase reaches three. It invokes all ten entries of the \
engine-event task table at 00021b5c; index 4 is timing dispatcher 0004e162."""
note = [
    """
Three admitted current-cylinder events correspond to one crankshaft \
revolution on the V6. The table order establishes that final \
timing-coordinate construction and APC scheduling execute in the \
engine-event path.""",
]
level = "code"
role = "handler"
block = "scheduler/block"

