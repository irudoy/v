summary = """
Two-table calculation: 2D 8x8 uint16 map 0xD80E produces signed ffff1750, \
while coefficient 0x12964 supplies g and computes \
sat_s16(trunc0(ffff1750*g/100)) in ffff1712. The same quantity reaches \
ffff170a only under a triple enable condition."""
note = [
    """
Interpolated g is written to ffff1767 and multiplies signed ffff1750 without \
a reload; 00021bbc divides the product by 100 with truncation toward zero. \
Saturation applies to the derived int16. Every cell of 0x12964 equals 100, \
so the current multiplier is 1. The physical quantity is unresolved.""",
]
