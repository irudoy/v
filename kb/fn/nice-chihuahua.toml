summary = """
Stock-selected error stage of the exhaust-VTC duty controller, called per \
bank. It keeps the integrator of the position error as offset-binary \
longword ffff147c + 4b with working copy ffff148c + 4b. While bank-enable \
bit b of ffff1246 is set and either duty word ffff1aac + 2b is below 1024 or \
target ffff2327 is at most the actual position, it adds error byte ffff1240 \
+ b minus 128 through saturating sum 000265c4 and clamps the result to \
ROM16[00009128]*4 - 0x20000 = 0 .. ROM16[00009124]*4 - 0x20000 = 9400; on \
the first enabled pass (ffff1284 bit b clear) it preloads the working copy \
from learned longword ffff4838 + 4b at 000c133a. With ffff1c7f bit b set it \
loads ffff4838 + 4b into both integrator longwords, and with ffff1c8e bit b \
set it copies captured ffff1484 + 4b into ffff4838 + 4b and base ffff4840 + \
4b at 000c13c6 and 000c13ca. It writes the bank error word ffff1b18 + 2b at \
000c1dac only while the bank bit is set."""
note = [
    """
ROM8[00008615] bit 3 selects this stage over 000c0d90; stock 0xab has the \
bit set. The learned longword is the integrator state from which every \
exhaust stroke starts, which is the magnet retarder characteristic of the \
factory learning description.""",
]
level = "code"
role = "kernel"
block = "cvtc_exhaust/block"

