summary = """
Dual-channel corrected conversion. FUN 0003ef74 forms adjusted coordinates \
Z1/Z2, which are saved to ffff322c/ffff322e. Let Y1/Y2 be lookups of common \
curve 000148fa at Z1/Z2, A1/A2 be lookups of 0000c10e/0000c18e, O1/O2 be \
signed ffff45a0/ffff45a2, and P1/P2 be signed ffff2b54/ffff2b56. The \
function writes clamp(Y1+A1+O1+P1-32768,0,65535) to ffff29e2 and the \
parallel second-channel result to ffff29e4."""
note = [
    """
Stock ROM16[00008ea4]=0, so P1/P2 cannot change either output. The vendor \
AFR Conversion Table name and the downstream two-bank fuel-trim context \
support a physical hypothesis but do not establish an engineering scale; \
code confidence is limited to the conversion and correction arithmetic.""",
    """
The complete bounded conversion executes both channels with exact bytes and \
real helpers; both signed16 clamps, admission/bypass, integer lookup \
rounding and final output saturation are independently checked. The \
independent software domain and reader interpretation do not establish \
source producers, physical units, engine reachability, permission or \
cadence. B = uint8(x); Z = RAM16[0xffff322c+2*B]; Y = uint16(from); A = \
RAM16[0xffff8544+14-2*B]; O = int16(RAM16[0xffff45a0+2*B]); P = \
int16(RAM16[0xffff2b54+2*B]); to = min(65535,max(0,Y+A+O+P-32768))""",
]
level = "code"
role = "accessor"
block = "unattributed/block"

