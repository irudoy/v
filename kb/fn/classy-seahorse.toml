summary = """
P030 group-0 cleanup path. Under its local enable gates it sets bit 2 in the \
second byte of all seven P0306..P0300 runtime records. Only while \
ffff5b2c.bit3 is clear, it also clears bit 6 from every third byte, clears \
the group-0 retained payload and marker, clears ffff41c1.bit1, and resets \
auxiliary byte ffff48c2."""
note = [
    """
The code establishes group-0 cleanup and its result-latch guard; the \
diagnostic phase name remains unresolved.""",
]
