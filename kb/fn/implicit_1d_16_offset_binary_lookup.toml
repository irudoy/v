elements with limit 0x00F0 with its own unrolled kernel: it adds 0x0080 to \
both samples, interpolates, and subtracts 0x0080, as the shared entry \
subtracts 128 from the kernel result. It lies at the library position of the \
shared entry, between xanthic-kagu 1me3b:0002abec and brilliant-ibis \
1me3b:0002ac9c, as 1nd:00028870 lies between 1nd:00028854 and 1nd:000288b8. \
Masked-match from 7mfk names 1me3b:0002ac3c as its only candidate."""

