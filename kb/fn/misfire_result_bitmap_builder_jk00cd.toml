title = "JK00C and JK00D cylinder result bitmap builder"
summary = """
Rebuilds the low seven bits of the local bitmap from six consecutive \
unsigned cylinder count words. A lane qualifies at or above the caller's \
floor. Two qualifying lanes set the aggregate bit."""
home = "jk00c"
role = "monitor"
block = "misfire/block"

