title = "Decode CAN 0x174 target and current zero-based gear indices"
summary = """
CAN 0x174 payload decoder selected by internal key 0x2e80. It decodes \
payload byte 3 high nibble into live zero-based target gear index ffff1087 \
and low nibble into live zero-based current gear index ffff1086. Each nibble \
value 1 through 7 is decremented; zero and values above 7 publish zero. \
Scheduler 00020dfe copies the pair to ffff1082/ffff1083."""
note = [
    """
Passive target transitions 0x44 -> 0x34 -> 0x33 and 0x22 -> 0x32 -> 0x33 \
establish high-nibble target and low-nibble current ordering for downshifts \
and upshifts.""",
]
level = "code"
role = "handler"

