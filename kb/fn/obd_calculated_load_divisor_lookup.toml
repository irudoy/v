summary = """
Calculated-load secondary-divisor accessor. It looks up Q1.7 divisor K from \
000129d2 by high8(uint16[ffff4524]) over axis 00011b7b and writes K to \
ffff329f. When ROM8[0000870e].bit4 is set, FUN 0008083c applies \
floor((q<<7)/K), with K=0 forcing 255."""
note = [
    """
Stock ROM8[0000870e]=0x28 has bit4 clear, so the secondary normalization is \
inactive in stock JK08A. The physical quantity represented by ffff4524 is \
unresolved.""",
]
