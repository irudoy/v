title = "Publish dual-bank MAF diagnostics and record-0x129 summary state"
summary = """
Dual-bank MAF diagnostic coordinator referenced by scheduler table 0x217f8. \
It publishes DID 0x1204/0x1205 words through two calls to 0003c408, \
snapshots both raw ADC samples through 0003c45c, writes combined MASS \
AIRFLOW word ffff3852=min(65535,floor(ROM8[0x83ec]*ffff105c/256)), and \
publishes extension-record-0x129 byte1.bit7 to ffff2449.bit7."""
note = [
    """
Record 0x129 byte1 is the OR of exact P0101/P0102/P0103 and \
P010B/P010C/P010D runtime-record byte1 values. Stock factor 0x69 is 105. \
Engineering conversions require hardware validation.""",
]
