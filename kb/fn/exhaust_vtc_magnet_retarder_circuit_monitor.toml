summary = """
Exhaust-VTC magnet retarder circuit monitor of P0078/P0084 (records 0x43 and \
0x44), called from 0008f168 with the bank in r4 and the enable in r5. It \
evaluates only while the enable is set, judged latch ffff3584 bit b is \
clear, and duty word ffff1aac + 2b is zero (00090674). It sets running bit b \
of ffff28c0 and zeroes counter ffff3596 + b until scheduler copy ffff28f0 \
carries that bit. The counter increments with saturation while a driver \
status byte of the bank equals 1 (ffff109e or ffff109f for bank 1, ffff10a0 \
or ffff10a1 for bank 2) and returns to zero otherwise. A count of \
ROM8[00008b00]=10 sets result bit b of ffff358d, and a count of \
ROM8[00008b02]=100 sets the judged latch. A non-zero duty word or a clear \
enable clears the running bit and zeroes the counter."""
note = [
    """
The pair judges the de-energized output, so it stays active when every \
exhaust surface is neutral. The status bytes are scheduler copies of decoder \
0004110a outputs ffff111e..ffff1121. The factory confirmation procedure for \
P0078/P0084 (2007 G35, EC-156) is an idle of 5 seconds. The electrical \
condition behind driver status code 1 is not recoverable from ECU code.""",
]
