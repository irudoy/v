summary = """
Conditional dual signed-endpoint surface evaluator. It selects y=ffff10d2 or \
max(ffff10d2,ffff10e2) through ffff4255.bit7, uses x=ffff1210, interpolates \
0000de8e and 0000e08e, decodes each uint16 result as raw-32768, and writes \
endpoints ffff18ec and ffff18ee."""
note = [
    """
Both surfaces and their axes are byte-identical in stock JK08A. Code proves \
the signed endpoint representation and selection; the physical quantity is \
unresolved.""",
]
level = "code"
role = "accessor"
block = "torque_request/block"

