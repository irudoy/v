role = "service"
contract = """
Not a standalone function: count-7 leaf of left-shift ladder 000221bc and \
also the base of its jump table. It computes r0 = r0 << 7, discarding bits \
beyond bit 31 without saturation. Entry is only through the dispatcher's \
jmp: rts restores r2 placed on the stack by prologue 000221bc, so a direct \
call would misalign the stack."""
