summary = """
Adjacent calibrated limiter branch. It subtracts unsigned input ffff10e2 \
from ROM16[0x9476], applies calibrated rates and bounds from 0x946a..0x9478, \
and writes signed candidate ffff19de, which enters the same minimum arbiter \
00071508 as the 0x942c branch."""
note = [
    """
EV18A places Speed Limiter at 0x94c2; JK08A 0x9476 preserves the same -0x4c \
layout offset as the throttle-rev pair 0x9478/0x942c. The speed-limiter \
physical label and x*0.1 km/h conversion are catalog/homology evidence \
rather than code confidence.""",
]
