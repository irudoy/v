summary = """
Per-bank exhaust-VTC control-mode state machine and bounded controller-state \
builder. Mode byte ffff1b1c+param_1 moves between 0, 1, and 2 under ffff248b \
bits 0/2 and the bank bit of ffff1246. With stock ROM8[00008615] bit 3 set \
it forms \
P=floor(floor(u16[ffff1b18+2*param_1]*ROM16[00009212|00009214])*gain*2/625); \
with the bit clear it forms \
P=(u16[ffff1a86+2*param_1]+u16[ffff1a98+2*param_1]-65536)*65536+int32[ffff1a90+4*param_1]-0x08000000 \
scaled by gain/128. Gain is curve 0001205a over axis 00012850 at ffff2772, \
stored in ffff143a. P is clamped to 0..0x04000000 and stored at \
ffff1aa4+4*param_1."""
note = [
    """
The subtraction of 65536 jointly decodes the two uint16 words as centered \
offset-binary terms. The physical meaning of ffff248b bits 0 and 2 and of \
coordinate ffff2772 remains unresolved; P feeds duty stage 000c2040.""",
]
