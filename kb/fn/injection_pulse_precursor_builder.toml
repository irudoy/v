title = "Build common and two-bank injection pulse precursors"
summary = """
Current-pass common and two-bank injection-precursor producer. It selects \
BFS ffff1024 or alternate ffff123e, optionally bounds it by RPM-derived \
limit and ffff34f6, scales it by ffff22e6 over 131072, applies bank \
multipliers ffff40b6/ffff40b8 over 0x6400, adds signed transient word \
ffff2300, scales through 0002657c by common Q14 gain ffff165e, clamps to \
uint16, and lower-bounds all results at ROM16[0x94e8]=170. It writes bank \
words ffff18c0/ffff18c2 and common word ffff1876."""
note = [
    """
Scheduler index 43 follows multiplier publication, common-gain calculation, \
and transient coordinator in the same periodic pass. Unity multiplier 0x4000 \
over 131072 divides the schedule by 8; with the 100/256 of FUN 0004ead4 the \
chain factor from BFS counts to 10 us counts is 100/2048. The physical \
meaning of the bank multiplier remains unresolved.""",
]
level = "code"
role = "driver"
block = "fuel_quantity/block"

