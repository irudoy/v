title = "Build and cap one channel throttle target"
summary = """
Per-channel throttle-target builder. It converts shared area word ffff19b2 \
through inverse pair 0x155a0/0x13202, applies a channel-specific signed \
correction on the normal controller branch, and clamps the result between \
ROM16[0x9574]=15 and the selected upper bound before writing \
ffff28bc+2*channel. The dynamic upper bound is \
clamp(raw(0x12daa)*13,908,2908); the fixed stock upper value is \
ROM16[0x9578]*4=2908. DTC-record predicates 0x6f/0x121 and 0x70/0x122 apply \
additional caps."""
note = [
    """
The per-channel target role is exact. Channel-to-bank identity and the \
catalog TVO engineering scale remain unverified.""",
]
level = "code"
role = "driver"
block = "throttle_target/block"

