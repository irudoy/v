summary = """
Per-index enable test of closed-loop control-function monitor 00088d3c for \
index r4 (0 or 1); it returns 1 when the monitor may run. While ffff10c8 has \
bit r4+1 set it sets that bit in ffff29e0. While START SIGNAL bit 6 of \
ffff4184 is clear and ffff267a has bit r4+1 set, it reloads delay byte \
ffff24dc[r4] while ffff42a5[r4] is nonzero, and the delay has elapsed once \
both bytes are zero; otherwise it writes ROM8[0000861a] to ffff42a5[r4] and \
reloads. A reload writes lookup(00012312 over axis 00012f9e, start-coolant \
byte ffff106e) to ffff24dc[r4] and ffff157f[r4]. With the delay elapsed it \
returns 1 while ffff41c8 bit 7 is set, ffff245d bit 6 is clear, record \
predicate 000259e4 returns zero for indices 0x12a, 0x12e, 0x129, and 0, \
crank and cam record gate 00025a12 returns zero, and battery-voltage \
snapshot ffff1108 is at least 0x89 and below ROM8[000083a4]. When it returns \
0, or while ffff22f1 lacks and ffff22e3 has bit r4+1, it calls \
00088edc(r4)."""
note = [
    """
00088b30, which diagnostic periodic dispatcher 0007bfc4 calls, runs it for \
indices 0 and 1 under two ROM enable bits and runs 00088d3c(r4) when it \
returns 1; 00088d3c reports descriptor 4, P1148 CLOSED LOOP-B1 of the 2007 \
G35 manual, for r4=0 and descriptor 5, P1168, for r4=1. The delay table \
00012312 is the after-start time table of closed-loop enable timer 0005d6ae. \
In stock JK08A the battery window is raw 137..199, 10.96..15.92 V.""",
]
