note = [
    """
The complete bounded conversion executes both channels with exact bytes and \
real helpers; both signed16 clamps, admission/bypass, integer lookup \
rounding and final output saturation are independently checked. The \
independent software domain and reader interpretation do not establish \
source producers, physical units, engine reachability, permission or \
cadence.""",
]
role = "service"
block = "library/block"
contract = """
Signed 32/32 division: r0 = r1 / r0 (dividend r1, divisor r0), truncating \
toward zero (-7/2 = -3). It does not return a remainder. It clobbers r1; r2, \
r3, and r4 are preserved on the stack. Division-by-zero diagnostic: when r0 \
== 0, it writes 0x0000044E to 0xFFFF9818 and returns 0 without raising a \
trap, so the caller cannot distinguish failure from a valid zero by the \
return value."""
contract_level = "code"

