summary = """
Intake-cam target-map accessor within two-channel CVTC dispatcher 000bd170. \
It interpolates cold 8x8 surface 0000b53a and warm/main 16x16 surface \
0000b43a by RPM/50 byte ffff11ae and Q7 normalized-BFS scheduler snapshot \
ffff102c, writes cold target ffff1c5e, and writes warm target ffff1c5c. When \
ffff2466.bit6 is set, it applies 4x4 correction 0000ab5a as \
clamp_u8(main-correction+128)."""
note = [
    """
Code proves the warm, cold, conditional-correction, target-routing, exact \
byte-interpolation, and raw*100/128 normalized-BFS coordinate roles. \
Target-vehicle replay validates the warm/main path, and the cold-start \
replays in JK08A.cvtc.md validate the cold path through the coolant blend \
and, in the moving cold start, by direct lookup; the correction branch \
remains dynamically untested. The high-detonation interpretation of \
ffff2466.bit6, Cylinder Filling physical name, and (x-128)*0.5 degree \
conversion remain catalog candidates.""",
]
level = "code"
role = "accessor"
block = "cvtc_intake/block"

