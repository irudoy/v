summary = """
Misfire per-cylinder flag builder. It clears ffff41ff bits 4..0 and ffff4200 \
bits 7..6, then compares the byte threshold in r4 with six consecutive \
uint16 counters at r5. Counter 0 at or above the threshold sets \
ffff41ff.bit4, counters 1..4 set bits 3..0, and counter 5 sets \
ffff4200.bit7; two or more qualifying counters set ffff4200.bit6. \
Coordinator 00082c8a passes ffff37fa with threshold ROM8[00008862] = 6 and \
ffff3808 with threshold ROM8[00008863] = 6, the per-cylinder elements one \
word above totals ffff37f8 and ffff3806."""
note = [
    """
Reporter 00084cd0 maps ffff41ff bits 4..0 to P0301..P0305 and ffff4200.bit7 \
to P0306, so counter element ffff4038 = 1 reports P0301 and element 6 \
reports P0306. ffff4200.bit6 marks two or more cylinders at the threshold.""",
]
level = "code"
role = "monitor"

