summary = """
EVAP pressure-sensor circuit status producer called by FUN 000ac994. Under \
the common ffff2736 and ffff10f9 gates, timer ffff2fd6 below \
ROM8[0x8553]=0x16 sets ffff247e bit 6 for P0452, while a timer at or above \
ROM8[0x8552]=0xfe sets bit 5 for P0453."""
note = [
    """
FUN 000abca2 applies exact configuration gates before dispatching \
P0452/P0453 and skips the pressure-circuit monitor in stock JK08A. The timer \
cadence and sensor voltage conversion remain unresolved.""",
]
