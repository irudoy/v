summary = """
Per-bank producer of MAF-word correction factor K, uint32 ffff3998[bank] for \
bank r4 (0 or 1), that MAF preprocessor 0003ae8a divides into its offset. \
The bank bit of ffff3977 sets after ROM8[0000829e] consecutive calls with \
ffff3a1e[bank] < ROM8[0000829f], absolute-throttle byte ffff1075 < \
ROM8[000082a0], and MAF word ffff101c[bank] >= ROM16[00008f8a]; the bank bit \
of ffff3978 then sets after as many calls with ffff101c[bank] < \
ROM16[00008f8c] and battery-voltage byte ffff1188 >= ROM8[000082a1]. Between \
the two phases sum ffff397c[bank], seeded with \
5*ROM8[00008a4c]*(ROM8[00008a4e]-ROM8[00008d75])^2, adds \
5*(ffff1188-ROM8[00008d75])^2 per call with saturation, and when the second \
phase sets, ffff3988[bank] latches max(0, ffff398a[bank]-ROM8[0000829e]) \
from call counter ffff398a[bank]. It writes mean ffff3979[bank]=min(255, \
floor(floor(ffff397c[bank]/(ROM8[00008a4c]+ffff3988[bank]))/1000)), \
interpolates 00012d82 over axis 00011bc3 at it into ffff3995[bank], latches \
ffff398e[bank]=min(0xffff, ffff3995[bank]*(ffff3988[bank]+ROM8[00008a4c])) \
at the second phase or 0x6400 when ffff398a[bank] equals 125 with only the \
first phase set, and while the first phase holds interpolates 00012c4a over \
axis 00011bbb at ffff398e[bank]>>8 into ffff3993[bank]. K starts at \
ROM16[000095b6]<<16, is zero while ffff439a[bank] is zero or while the first \
phase is clear with ffff3a1e[bank] >= ROM8[0000829f], and otherwise decays \
by ROM16[00009410]/65536 per call, scaled once by ffff3993[bank]/256 after \
the latch."""
note = [
    """
Dual-bank MAF coordinator 0003a904 calls it for banks 0 and 1, and startup \
initializer 0002d120 seeds both K words. In stock JK08A the MAF thresholds \
are 700 and 600 counts, 3.50 and 3.00 V; the battery threshold is 100 \
counts, 8.00 V; the throttle threshold is 34 counts, 13.3 percent; and K \
decays by 0.30 percent per call. The physical purpose of the correction is \
unresolved.""",
]
level = "code"
role = "accessor"
block = "airflow_load/block"

