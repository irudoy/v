summary = """
Looks up throttle_angle_cap_surface by coolant byte ffff1069 and engine \
speed ffff11a6 for 000493e0, stores the word times 0.00171875 as an angle at \
ffff9a68 and returns the area of that angle on \
throttle_angle_to_area_primary times 0.0016. It sets a flag when two byte \
arguments are set, and sets ffff9af6 while engine speed exceeds ROM word \
00009044, plus ROM word 00008eec while ffff9af6 is clear; the stock word \
0xffff never sets it. 00049824 and 0004988e cap the model angle and area by \
these values while the flag is set."""
