summary = """
SCI transmit-complete interrupt handler for diagnostic responses. With mode \
ffff8212=0x04 it increments response counter ffff8213, compares it with \
requested response count ffff8214, and either invokes 0002f866 for another \
transmission or clears the counter and mode. With mode 0x06 it bypasses the \
response-count comparison and sets ffff82e4.bit7 so the diagnostic state \
machine can redispatch the service."""
note = [
    """
Mode 0x04 repeats on the interrupt path without calling SID 0x21 again, so \
this code does not establish a fresh list dereference between its finite \
responses. Mode 0x06 takes the redispatch path that rebuilds each \
response.""",
]
level = "code"
role = "handler"
block = "diag_services/block"

