summary = """
Lower load bound of the P0500 vehicle-speed sensor monitor: it interpolates \
1D-16 uint8 table 00012e62 at engine-speed byte ffff11b3 through 00026388 \
and writes the result to ffff357d."""
note = [
    """
000a6c9a calls it, then 000a6838, 000a6854, and 000a6aa0, while bit 4 of \
ROM8[000186c8] is set (stock 0x12). 000a6854 and 000a6aa0 admit their \
monitor only while ffff357d <= high_byte(ffff1024) < ffff357c, where \
ffff1024 is the current Base Fuel Schedule sample; 000a6854 also requires \
coarse vehicle-speed byte ffff110e below 2 and reports runtime record 0, \
whose descriptor carries P0500 (VEH SPEED SEN/CIRC, EC-524 of the 2007 G35 \
manual), through 0007d8b8 once its countdowns expire. Stock 00012e62 holds \
42 in every cell, 5.25 ms of Base Fuel Schedule at raw/8 ms per count of the \
high byte.""",
]
