summary = """
On-chip A/D sampler for four channels. Within the exact MAF path it reads \
SH7058 ADDR4 and ADDR15, shifts each aligned result right by six, and writes \
ten-bit samples ffff1d62 and ffff1d64."""
note = [
    """
The hardware manual maps ADDR4 to AN4 at MCU pin 90/H18 and ADDR15 to AN15 \
at MCU pin 104/L20. Firmware and exact DIDs establish bank-1/bank-2 MAF \
identity; ECM-terminal continuity still requires bench verification.""",
]
