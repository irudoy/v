summary = """
Battery current sensor monitor for P1550 to P1554 with an \
engine-speed-dependent limit. It keeps reference ffff2ac0: while ffff41af \
bit 2 is clear it sets that bit, clears ffff41af bit 3, and takes sample \
snapshot ffff10a8; afterwards it keeps the reference and sets ffff41af bit 3 \
while |ffff10a8-ffff2ac0| through 00022590 is at most ROM8[00008326], and \
otherwise takes ffff10a8 and clears bit 3. It writes t=lookup(00011f4a, \
clamp(2*ffff11b2-0x50, 0, 255)) through 00026370 to ffff2b47 and forms \
estimate A=clamp(trunc0(5*ROM8[00008329]*ffff10aa/16)-256*ROM8[00008327], \
-0x8000, 0x7fff). Five checks require ffff41c8 bit 7 set, START SIGNAL bit 6 \
of ffff4184 clear, ffff4184 bit 7 set, and their enable bit of \
ROM8[0001870a]; each reloads its countdown while its condition is false and \
reports its runtime record through 0007d8b8 while the condition holds and \
the countdown is zero. Record 0x11d, bit 0, needs ffff1108 above 0x64, \
ffff244f bit 5, and ffff41af bit 3, with countdown ffff42a0 for a reference \
strictly between ROM16[00009016] and ROM16[00009014] and word countdown \
ffff44a0 otherwise; record 0x11c, bit 1, needs ffff1108 above 0x64 and \
ffff10a8 at most 4*ROM8[00008647], countdown ffff42a2; record 0x11b, bit 2, \
needs ffff1108 above 0x64 and ffff10a8 at least 4*ROM8[00008646], countdown \
ffff42a1; record 0x11a, bit 3, needs ffff1108 above 0x64, ffff244f bit 5, \
and A above 256*t, countdown ffff42a3; and record 0x119, bit 4, needs \
ffff244f bit 5, ffff1108 at least 0xaf, and ffff10a8 at most 0x1cc, \
countdown ffff42a4."""
note = [
    """
000bbb98, which diagnostic periodic dispatcher 0007bfc4 calls at 0007c0dc, \
runs 000bbb7a while ffff424f bit 2 is set and then branches to this function \
at 000bbba6; 000bbb7a reloads countdowns ffff42a0, ffff44a0, ffff42a3, and \
ffff42a4. The descriptors of records 0x11d, 0x11c, 0x11b, 0x11a, and 0x119 \
carry P1550, P1551, P1552, P1553, and P1554, all BAT CURRENT SENSOR on \
EC-525 of the 2007 G35 manual. 00039be2 writes sample ffff1128, which DID \
0x1246 returns, from ffff1d4a, its filtered value ffff112a, and \
ffff1126=A+0x8000 over the filtered value limited to 80..920, or 0x8000 \
while the fault predicate of any of the five records is set; ffff10a8 and \
ffff10aa are the scheduler snapshots of ffff1128 and ffff112a. The \
countdowns lie in the 1.024 s blocks of 0002040c; stock reloads are 10 \
counts, 10.24 s, for the byte countdowns and 900 counts, 921.6 s, for \
ffff44a0. Stock ROM16[00009016]=86, ROM16[00009014]=900, ROM8[00008647]=11 \
for 44 counts, ROM8[00008646]=253 for 1012 counts, ROM8[00008326]=2, and \
ROM8[0001870a]=0x1f enables all five checks; 0x64 and 0xaf are 8.00 V and \
14.00 V at 0.08 V per count. Stock 00011f4a rises from 30 at 500 RPM to 138 \
from 1900 RPM over nodes at 12.5 RPM per count of ffff11b2.""",
]
level = "code"
role = "monitor"
block = "sensor_monitors/block"

