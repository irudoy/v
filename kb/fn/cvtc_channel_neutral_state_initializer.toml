summary = """
Subsystem initializer that writes neutral offset-binary value 0x8000 to both \
channel pairs ffff1a86/ffff1a88 and ffff1a98/ffff1a9a, while initializing \
their associated 32-bit states. It also initializes actual exhaust-cam \
timing bytes ffff2324 (000bcf7e) and ffff2325 (000bd046) and rest-edge \
deviations ffff1376 (000bcfb6) and ffff1377 (000bd04a) to 0x80."""
note = [
    """
The 0x8000 stores independently establish the neutral representation used by \
FUN 000c0d90 and FUN 000c1dec. The 0x80 initializations of the exhaust-cam \
bytes bind the initializer to the exhaust-VTC subsystem.""",
]
level = "code"
role = "init"
block = "cvtc_intake/block"

