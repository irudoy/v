summary = """
Engine-oil-temperature producer, called from 000bcd44. With ROM8[00008616] \
bit 0 set (tst #1; bf at 0003eb96; stock 0x01) it reads ADC sample ffff1d5c \
at 0003ebb4, filters it through 0003a5e0 into ffff1f92 at 0003ebd0 and raw \
byte ffff117b at 0003ebd6, converts the byte through curve 00012c6e via \
000263a0 into ffff1f94 at 0003ec18, and publishes ffff2876 at 0003ecae: 0xff \
with ffff4182 bit 7 set at 0003eca4 when the raw byte is outside 3..241 or a \
P0197, P0198, or P0196 record (0xdd, 0xde, 0xe4 through 00025e20 at \
0003ec32, 0003ec3e, 0003ec4a) is stored; the converted value directly while \
ffff4183 bit 7 is set; otherwise a rising value at once (0003ec98) and a \
falling value as new + 2 only after a drop of two or more counts, with \
ffff4182 bit 7 cleared at 0003ec58 on the valid path. With the bit clear it \
publishes zero."""
note = [
    """
DID 0x111f publishes the byte. Curve 00012c6e is byte-identical to shared \
thermistor table 00012dea, whose code the ECU declares as deg C+50 through \
J1979 Mode 01 PIDs 0x05 and 0x0F, so deg C = raw-50 follows from code. \
Sample ffff1d5c is the phase-3 AN0 external-mux result of selector code 010, \
stored by sampler 000280d8 at 00028290. Periodic table 00021834 of \
dispatcher 000209d8 lists the function at index 28. The stock configuration \
bit keeps the sensor path live, so exhaust-VTC gain coordinate ffff2772 \
follows the oil temperature.""",
]
