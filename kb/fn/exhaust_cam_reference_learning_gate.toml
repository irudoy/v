summary = """
Gate of the exhaust cam reference learning, called as (enable, bank) from \
00090a84. It sets bit b of gate byte ffff14f0 while the enable is set, \
conditioned target ffff2327 is 0x80, duty word ffff1aac + 2b is zero, timer \
ffff2568 + b has expired, and bit b of ffff14b8 is clear; every other state \
clears the gate bit and zeroes sample counter ffff1930 + b, and a clear \
enable also reloads the timer with ROM8[00008e1a]=0."""
note = [
    """
Timer ffff2568 + b lies in the 102.4 ms block of base-tick handler 0002040c; \
with the stock reload of 0 it is always expired.""",
]
