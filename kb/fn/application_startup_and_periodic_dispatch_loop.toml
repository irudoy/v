summary = """
Main-loop coordinator for the every-tenth-interrupt scheduler. It enables \
interrupts before waiting for ffff84b9 bit 2, calls FUN 00020dfe indirectly \
through literal 00028090, and then reaches FUN 00027aa2 before the next loop \
iteration. FUN 00020dfe returns with interrupts masked, making the point \
immediately after the indirect call a coherent but interrupt-disabled \
capture boundary."""
note = [
    """
A wrapper substituted through literal 00028090 must call the displaced stock \
function first and must preserve the interrupt state expected by the main \
loop. Any additional copy extends an existing interrupt-disabled interval.""",
]
level = "code"
role = "dispatch"
block = "scheduler/block"

