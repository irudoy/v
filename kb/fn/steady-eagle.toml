summary = """
Six-bucket misfire operating-range counter updater called only by detection \
core 00085a70. It requires ffff41d2.bits0/1 both set, divides \
calculated-load code ffff413e at 128, divides current RPM/25 byte ffff11eb \
at 64 and 160, and saturating-increments one of ffff395c..ffff3961. Failure \
of the low-bit gate clears all six buckets and ffff36f0."""
note = [
    """
The speed boundaries are 1600 and 4000 RPM. Calculated-load code 128 is \
approximately 50.2 percent under the J1979 100*A/255 scale. The physical \
diagnostic phase of these buckets remains unresolved.""",
]
level = "code"
role = "monitor"

