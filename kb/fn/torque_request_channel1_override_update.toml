summary = """
First-channel override and upper-bound coordinator. On the admitted path it \
copies ffff2698 to ffff3026 and can clear ffff41f3.bit0. Fallback paths \
select ffff2a6a, zero, or ROM16[000092ec] for ffff3026 and set the override \
bit. It writes ffff3024 as 1000 when both service gates pass or \
ROM16[000092ea]=150 otherwise."""
note = [
    """
FUN 0007a592 consumes ffff3024 as its final upper bound and ffff3026 as its \
bit-gated override source. The physical quantity of these words is \
unresolved.""",
]
