summary = """
Status and slot copier of service-0x3b LIDs 4..20. It writes status ffff416a \
= 0xff when ffff41b9.bit0 is clear and ffff4184.bit7 is set, and otherwise \
0xa1 when ffff41b9.bit0 is set and 0xa6 when it is clear; ffff416b is 0 when \
accepted, 2 when 0xa1 is the only failing check, and 1 otherwise, and \
ffff420d.bit0 marks acceptance. While accepted, each active LID 4..20 copies \
its slot ffff99df..ffff99ef to ffff5564..ffff5574. A branch under \
ffff4235.bit2 copies ffff3fcd..ffff3fdd to ffff5564..ffff5574, ffff3fde to \
ffff47f4, and ffff3fdf to ffff47f5 and then clears the bit."""
note = [
    """
FUN 00031718 and FUN 00037020 read ffff5564..ffff5574; the calibrated \
quantities of that block are not identified. The JK08A LID-0 support bitmap \
does not advertise LIDs 4..20.""",
]
level = "code"
role = "service"
block = "work_support/block"

