summary = """
Coolant-gated request-limit candidate of candidate dispatcher 00075e9e. \
Latch bit 2 of ffff246b sets while coolant byte ffff1071 is at least \
ROM8[000086d9] and clears below it once s16 ffff1546 <= s16 ffff1544. \
Follower ffff1548 equals ffff1071*256 unless the latch and ffff246e bit 2 \
are both set; then it approaches ffff1071*256 by steps ROM16[000091f0] up \
and ROM16[000091ee] down on ffff84c3 bit 7 ticks. With the latch set it \
writes ffff1910=lookup(00014cea, clamp(32*ffff1702-4096, 0, 0xffff)) and \
ffff1682=lookup(0000e98e, row ffff1702, column 0xffff) and forms signed \
candidate ffff1546: ffff1910-0x8000 while ffff1548 >= ROM8[000086d8]*256 or \
ROM8[000086d8] equals ROM8[000086d9], ffff1682-0x8000 while ffff1548 <= \
ROM8[000086d9]*256, and between them \
ffff1910+(ffff1682-ffff1910)*(ROM8[000086d8]*256-ffff1548)/((ROM8[000086d8]-ROM8[000086d9])*256)-0x8000, \
clamped to the int16 range. ffff1544 follows ffff1546 by steps \
ROM8[000086db] up and ROM8[000086da] down on the same ticks, starting from \
ffff1544 while ffff246e bit 2 is set and from max(ffff19c6, ffff1546) \
otherwise. With the latch clear both words are 0x7fff."""
note = [
    """
Signed request-limit arbiter 00071508 reads ffff1544. In stock JK08A both \
coolant thresholds are 255, raw coolant 255 being the 205 deg C end of the \
ffff1071 scale, and 00014cea is flat 0xffff, so a set latch yields candidate \
0x7fff and the candidate never restricts the request. Between the thresholds \
the candidate moves linearly from the last E98E column at the current row to \
the 00014cea curve as coolant rises.""",
]
