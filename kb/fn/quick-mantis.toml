summary = """
ATU-II channel 1A GR1F capture handler for the bank-1 intake cam. It stores \
interval ffff22c8 = GR1F - ffff158a, forms running edge phase ffff22d2 = \
20*ffff13b2 + floor(20*interval/ffff22bc) - 60 (selector below 8) or - 20 \
(selector 8 and above) through signed divider 00021bbc, clamped at zero, and \
copies it to ffff22cc while event state ffff13c8 is 2, 4, or 6, after \
shifting ffff22cc into ffff22ce and ffff22d0. The pass requires ffff84ff bit \
7 set and edge count ffff1391 equal to 1."""
note = [
    """
The SH7059 hardware manual identifies 0xfffff44e as GR1F. One count of the \
edge phase is 0.5 crank degrees (ffff22bc is 10 crank degrees and the \
selector step is 20 counts), the same unit as the exhaust edge handlers \
000c2d76 and 000c2c58.""",
]
level = "code"
role = "driver"

