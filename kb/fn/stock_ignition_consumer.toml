title = "Convert the primary timing command into an APC GR11A compare event"
summary = """
Primary APC compare scheduler. It zero-extends the command byte, splits it \
through 00028e7c, and on the normal ffff24c9.bit6-clear path carries \
complete decades through 00028dc8 and 0002ab24. It calculates \
ffff16c2=min(65535,floor(ffff22bc*remainder/10)) and writes GR11A fffff5c2 \
as ffff158a+ffff16c2 or the TCNT11+3 fallback."""
note = [
    """
The command is the delay in crank degrees after tooth 7: the ICI0A handler \
prologue decrements tooth count ffff1558 on every later tooth and at zero \
writes GR11A = ffff158a + ffff22bc * remainder / 10 and enables the POPCR \
set action of mask ffff13bd. Command 95 becomes six tooth events to tooth 3 \
plus 15 degrees. The GR11A set edge carries the ignition advance, so it is \
the spark edge. The bit6-set fallback branch clamps only inputs above 199. \
Targets 110..117 avoid that clamp but must not override the stock command in \
fallback mode because its physical angle contract is unresolved.""",
]
level = "code"
role = "driver"
former = ["apc_set_compare_scheduler"]

