summary = """
Stationary rev-limiter state machine in the aggregate fuel-output inhibit \
path. Entry requires coarse vehicle speed ffff110e == 0, ffff244f bit 2 set, \
and ffff2458 bit 5 clear. It loads ffff258a with 100; each expiry looks up \
000124d2 at q=clamp((signed16(ffff11bc)-160)/2,0,255), adds lookup-128 to \
readiness accumulator ffff16a6 with saturation, and reloads the timer. \
Readiness bit 4 is set at accumulator >= ROM16[0000911c]. With readiness \
set, RPM/50 byte ffff11ae at or above ROM8[000085d9] sets fuel-cut bit 5; \
equality to ROM8[000085da] retains it and only a lower value clears it."""
note = [
    """
Accumulate stationary readiness and apply the low-speed full fuel-cut \
hysteresis""",
    """
At or below 2000 RPM the stock step is zero. In the high-RPM limiter region \
it is 127, so three timer expiries reach the inclusive threshold 381. This \
is 300 tenth-phase counts, or 3.072 seconds at the target-measured 10.24 ms \
period. Returned bit 5 becomes global mask 0x3f.""",
]
level = "code"
role = "accessor"
block = "fuel_cut/block"

