summary = """
Bank-indexed MAF diagnostic-word publisher. It reads ten-bit AN4/AN15 \
samples ffff1d62/ffff1d64, invokes 000671d8 to apply shared Q1.15 \
coefficient ffff4970 with uint16 saturation, adds one when the raw sample is \
full-scale 0x03ff, and writes ffff101c/ffff101e."""
note = [
    """
FUN 0003c3ac is the complete caller and invokes indices 0 and 1. A \
whole-program p-code scan found no other writer candidates for \
ffff101c/ffff101e. The full-scale increment makes the published span 0..1024 \
counts rather than 0..1023, so the saturated reading is one count above the \
last converted value.""",
]
level = "code"
role = "service"
block = "airflow_load/block"

