summary = """
Diagnostic status-byte builder. For DID 0x130a byte ffff2c56, bit 4 is set \
only when ffff24d2 bit 3 is set and ffff4255 bit 3 is clear. For DID 0x130b \
byte ffff2c57, output bit 1 follows ffff2377 bit 0, while output bit 0 \
follows ffff2377 bit 1 when ROM8[0x8b2a] bit 2 is clear. The exact DID \
records supply support masks 0x10 and 0x03. For DID 0x1311 byte ffff2c58, \
stored at 0002e404, output bit 3 follows ffff5b32 bit 3, the scheduler copy \
of exhaust-VTC learning status ffff5b33 bit 3, and output bit 4 follows \
ffff24cd bit 4; the DID record supplies support mask 0x18."""
note = [
    """
Reviewed Nissan diagnostics identify DID 0x130a bit 4 as THRTL RELAY. A \
homologous structured Nissan profile identifies DID 0x130b bits 1 and 0 as \
HO2S2 heater states for banks 1 and 2. The function establishes reported \
control states, not physical output pins. The structured profile names DID \
0x1311 bit 3 EXH V/T LEARN with 0 = DONE and 1 = YET.""",
]
