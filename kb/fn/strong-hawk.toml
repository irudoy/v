summary = """
First raw-output calculation channel. Bit 1 of ffff249f selects endpoint \
pair 0001480a/0001482a or 00015360/00015380 on shared axis 00014f82 and \
input ffff2698. Q15 weight 0000d78e is written to ffff31c8, and the endpoint \
crossfade writes ffff2a7c. Q15 trim 0001484a and common coefficient ffff31e2 \
are applied before bounds and override produce ffff2a7a; \
floor(value*727/800) is published as ffff1210."""
note = [
    """
ffff31c8 is the Q15 weight scratch, not the blend output. Stock pair \
00015360/00015380 is byte-identical, and trim 0001484a is flat unity. \
Monitor 0008d194 compares final ffff2a7a with the parallel channel ffff35cc. \
Physical quantity and engineering unit remain unresolved; rejected \
load-limit and torque-request labels are not reinstated.""",
]
level = "code"
role = "accessor"
block = "torque_request/block"

