title = "Build post-replacement P2119 or P1238 RPM-shaped inhibit mask"
summary = """
P2119/P1238 ETC-actuator-fault six-channel inhibit-mask coordinator. \
Runtime-record byte1.bit7 at exact indices 0x71 and 0x123 enables 000509a0, \
which maps RPM/25 43..48 to masks 01,05,07,0f,1f,3f; 000509ea can add 3f at \
coarse speed <=2 under ffff10e4.bit2."""
note = [
    """
Exact JK08A descriptor index 113 is P2119 ETC ACTR-B1 and index 291 is P1238 \
ETC ACTR-B2. The mask is ORed after Power Balance and cannot be cleared by \
that replacement.""",
]
level = "code"
role = "accessor"

[[diagnostic]]
id = "etc-actuator-fault-mask-p1238"
kind = "monitor"
label = "DtcCode"
key = "P1238"
claim = {label = "RomDtcDescriptor", id = "jk08a:0001a104"}
applicability = "exact_rom"
scope = "exact-rom"
priority = 100
level = "code"
note = """
Exact runtime-record index 0x123 is P1238 ETC ACTR-B2 and enables the staged \
six-channel auxiliary inhibit mask."""

