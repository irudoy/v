title = "Force the spark of APC dwell-timeout slot A"
summary = """
Compare-match handler of dwell-timeout slot A at interrupt-table entry \
00020224, compare register fffff4e2. When the timeout expires and a pin of \
ffff13cf still reads low, it forces the spark. With a pending set countdown \
in ffff1558 it clears the countdown, writes GR11A = TCNT11 + 2, enables the \
low-byte POPCR action of the slot pins and sets ffff8517.bit7. Otherwise it \
moves GR11A to TCNT11 + 2 when the compare lies more than five counts ahead \
or ffff13d2 is nonzero, and enables the low-byte action of the slot pins."""
level = "code"
role = "handler"
block = "ignition_output/block"

[[symbol]]
layout = "7mfk"
address = "0002b396"

[[symbol.evidence]]
kind = "rom-bytes"
supports = "identity"
at = "7mfk:00020224"
value = "0002b396"

[[symbol]]
layout = "jk78c"
address = "0002e266"
level = "code"
summary = """
IMI5A acknowledges the compare and disables its interrupt. An extended \
timeout programs the next interval and re-enables the interrupt. At finite \
expiry it checks the saved PULS inputs and sets the low POPCR action for a \
pin still in dwell. A pending primary tooth count is cleared and GR11A is \
moved to TCNT11 + 2. With no pending count, the compare moves only under the \
distance or pin-state guard."""

