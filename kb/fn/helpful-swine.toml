summary = """
Two independent calculations share one routine. The first converts outputs \
A=out(0x14274) and B=out(0x141F4) into contribution bytes \
wA=uint8(trunc0((A<<8)/(A+B))) and wB=uint8(trunc0((B<<8)/(A+B))), then \
partitions common value T=ffff2842 into ffff2844=(T*wA)>>8 and \
ffff2846=(T*wB)>>8. The second uses inverse pair 0x13202/0x155A0 and RAM \
inputs ffff284a/ffff284c to calculate ffff3a76; the paired-curve outputs do \
not feed this branch."""
note = [
    """
The full 456-byte exact-JK08A machine listing includes blocks 0003b5d0, \
0003b60c, and 0003b630 omitted by the decompiler. Their signed-correction \
branches are unreachable for the unsigned, nonnegative operands used here.""",
]
level = "code"
role = "driver"
block = "airflow_load/block"

