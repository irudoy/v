summary = """
Alternate bank-indexed rear O2 high-voltage monitor. It maintains two \
calibrated working bytes at ffff42b0[bank] and ffff42b2[bank], sets a fault \
condition when either working byte is zero under its gates, and dispatches \
indices 0xad/0xae for the path-B P0138/P0158 descriptors."""
note = [
    """
The stock reload value is 5. The cadence and physical interpretation of the \
two working bytes are not established.""",
]
level = "code"
role = "monitor"
block = "o2_catalyst/block"

[[diagnostic]]
id = "rear-o2-alt-high-b-p0138"
kind = "monitor"
label = "DtcCode"
key = "P0138"
claim = {label = "RomDtcDescriptor", id = "jk08a:00019b7c"}
applicability = "exact_rom"
scope = "exact-rom"
priority = 100
level = "code"
note = """
FUN 0008a258 dispatches exact JK08A path-B descriptor index 0xAD for bank 1 \
when either alternate high-condition working byte is zero. Descriptor record \
0x19B7C contains P0138."""

