summary = """
Diagnostic runtime-record byte-1 bit-7 predicate. It addresses ffff5718 + \
3*index and returns that bit as a Boolean."""
note = [
    """
Test runtime diagnostic record byte 1 bit 7 with minus-one sentinel \
support""",
    """
Indices 0x71 and 0x123 are exact P2119 and P1238 descriptors in 0005096c.""",
]
level = "code"
role = "service"
