summary = """
Stock-mode per-channel writer of ffff1220. For the supplied channel bit, it \
sets the bit only when the corresponding ffff22e0 bit is clear, \
signed16[ffff142e+2*i] is greater than or equal to ROM8[000087fe]<<7, and \
the corresponding ffff16ff bit is clear; otherwise it clears the ffff1220 \
bit. ROM8[000087fe]=5, so the signed-difference threshold is 640 raw \
counts."""
note = [
    """
ffff1220 is therefore a pulse/update eligibility mask in stock mode, not a \
standalone global fuel-enable state.""",
]
level = "code"
role = "driver"
block = "injector_output/block"

