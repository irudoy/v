summary = """
Mode-dependent six-channel calculation. ROM8[00008d92] bit 3 controls entry. \
When bit 3 is clear, the function runs an internal six-channel loop, \
evaluates a compound condition that includes current sample ffff1024 minus \
previous sample ffff1028 being greater than or equal to ROM8[000087fd]<<3, \
writes ffff1220, and uses map 000121ee in derived array calculations. In \
stock JK08A ROM8[00008d92]=0x7a and bit 3 is set, so execution branches \
directly to 00051e14: the writer loop is skipped, and the function reads the \
externally prepared ffff1220 bit for the current channel to calculate a \
16-bit output. The executing stock branch forms base = \
arithmetic_shift6(uint8(ffff152c)*uint8(ffff1527)), adjusts it by \
uint8(ffff15d8) with the sign taken from ffff2484.bit0, adds 0x32 for \
channels set in ffff1574, scales the sum by int16(ffff142e+2*i) over 1024 \
and by uint16(ffff165e) over 8192, adds ffff2436, writes the word to \
ffff155c+2*i, and stores FUN 0005b7ec of that word to ffff1568+2*i."""
note = [
    """
Scheduler 00020dfe proves that ffff1028 is the preceding sample of ffff1024, \
so the alternate comparison tests a positive sample increase of at least 200 \
raw counts. The compound ffff1220 writer, the 000087fd comparison, and map \
000121ee path do not execute in stock bit-3 mode and are not evidence for \
stock Over Run Fuel Cut. The derived 16-bit output is an injection duration \
in 10 us counts: FUN 00051f1e passes array ffff1568 to ATU-II one-shot \
scheduler 0002c13c.""",
]
level = "code"
role = "driver"
block = "injection_timing/block"

