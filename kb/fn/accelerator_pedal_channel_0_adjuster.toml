First accelerator-pedal analog-channel adjustment and range monitor. It \
copies AN10 sample ffff362c to ffff27a2, subtracts learned offset ffff55c0, \
writes signed result ffff27a0, and applies calibrated range checks that \
share thresholds with the first accelerator-pedal DTC monitor."""
note = [
    """
The shared thresholds and exact diagnostic monitor connect AN10 to \
accelerator-pedal sensor channel 1.""",
]
