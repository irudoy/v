summary = """
Automatic work-support request router. When ffff42d4 is zero, ffff4184.bit6 \
is clear, ffff41a6.bit1 is set, ffff244f.bit5 is set, ffff41a6.bit5 is \
clear, and ffff4184.bit7 is set, it copies timing request ffff41aa.bit0 to \
ffff424c.bit5 and sets ffff41ef.bit4 exactly when idle request ffff41ef.bit6 \
is set and ROM8[0x870e].bit0 is clear. Otherwise, with ffff4184.bit7 set, it \
clears ffff424c.bit5 and ffff41ef.bit4."""
note = [
    """
The same checks form statuses 0xa2, 0xa3, 0xa5, 0x10, and 0xa6 of 000683cc. \
FUN 0004aad0 reads ffff424c.bit5 and FUN 000420b8 reads ffff41ef.bit4 as the \
automatic branches of the timing and idle adjustments.""",
]
level = "code"
role = "selector"

