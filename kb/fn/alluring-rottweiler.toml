summary = """
Routing and in-use counter stage of the cold-start control monitor, records \
0x126 (P1421) and 0x125 (P1422), reached through pointer slots 0003e420 and \
0007c360. Under ffff424f bit 2 it clears bits 2, 3, 6, and 7 of ffff41a0 and \
ffff41a1, resets capture block ffff5628, and with ROM8[00008afc] bit 0 \
zeroes counters ffff480e and ffff4810. It sets ffff424f bit 6 while \
00025a12, 00025f14(0), 00025f14(1), or predicate 000259e4 of a listed record \
is nonzero. Under ROM8[0001870e] bit 0 it routes record 0x126 through \
000b4ef8 (ffff41a0 bit 2) and 0007d8b8 (bit 3), and under bit 1 record 0x125 \
through 000b4ef8 (bit 7) and 0007d8b8 (bit 6). Counter ffff4810 increments \
once per cycle when the listed readiness bits are set, counter ffff480e \
increments once when ffff41a0 bit 5 is set, and when either reaches 0xffff \
it becomes 0x7fff and the other is halved."""
note = [
    """
Stock ROM8[0001870e] is 0xf0, so neither record is routed on JK08A. The \
listed records of the in-use predicate include the exhaust-VTC indices 0x43, \
0x44, 0x84..0x88, 0x14f, 0x151, and 0x152. A structured Nissan profile names \
P1421 COLD START CONTROL; the name of P1422 is unresolved. Worker 0009b1b4 \
writes the monitor state in ffff41a1, which the scheduler copies to \
ffff41a0.""",
]
level = "code"
role = "monitor"

