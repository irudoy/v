summary = """
Common runtime-record aging pass. When a record whose third byte has bit 4 \
set and bit 1 clear reaches count 40, it clears bit 5 from associated record \
state. If the aged record is one of exact descriptor indices 0x0a..0x10 for \
P0306..P0300, it also clears global result latch ffff5b2c.bit3."""
note = [
    """
The aging threshold is exact in invocation counts; its physical-time \
duration remains unresolved.""",
]
