summary = """
Coefficient stage of the MAF calibration sequence. At state 2 it divides \
ROM8[0x8d40]=225 shifted left by twenty by accumulator ffff3524, saturates \
the quotient to 0xffff, and stores it in ffff4970 when it lies within \
ROM8[0x87f9]<<8=0x7900..ROM8[0x87f8]<<8=0x8700; otherwise it stores zero. It \
then advances the state to 3."""
note = [
    """
An eight-sample average of 900 counts returns stock coefficient 0x8000, so \
the design point of the sequence is 4.50 V at 5 mV per count.""",
]
level = "code"
role = "service"

