summary = """
1D linear interpolation: if (y1 < y0) return y0 - ((y0-y1)*frac >> 16); \
return y0 + ((y1-y0)*frac >> 16). Branching avoids signed overflow on a \
descending segment. Registers are y0=R0, y1=R2, frac=R3."""
note = [
    """
This is a lower-level primitive rather than the bank core. Twelve functions \
hold pointers to it, so enumerating from it yields 230 sites instead of one; \
the registry declares wrapper 0x2642C for it.""",
    """
The complete bounded conversion executes both channels with exact bytes and \
real helpers; both signed16 clamps, admission/bypass, integer lookup \
rounding and final output saturation are independently checked. The \
independent software domain and reader interpretation do not establish \
source producers, physical units, engine reachability, permission or \
cadence.""",
    """
The complete bounded adjustment entry executes both channels and four real \
helpers with exact stock bytes; all selectors, signed saturation, ordered \
bounds, byte counters and both-bank admission/bypass have independent \
register, frame and memory expectations. The independent raw software domain \
does not establish physical units, source producers, permission, cadence or \
engine reachability.""",
]
level = "code"
role = "finisher"
block = "library/block"
contract = """
Unsigned linear interpolation between r0=y0 and r2=y1 at Q0.16 fraction r3 \
in 0..65535. On a descending segment it returns y0 - \
floor((y0-y1)*r3/65536); on an ascending segment it returns y0 + \
floor((y1-y0)*r3/65536). The result lies between y0 and y1. MACL is \
preserved through r1; r1 and r2 are clobbered, r3 and PR are preserved, and \
the stack is balanced."""
contract_level = "code"

