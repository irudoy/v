summary = """
ROM-gated inverse signed-surface evaluator. It selects y=ffff1152 or \
max(ffff1152,ffff1162), interpolates each row of 0000de8e across axis \
00013d34, and uses the resulting 16-word stack vector as the search axis for \
target ffff18ea or ffff3394. Identity table 00013d14 returns coordinate \
ffff1f60. The bit5 path repeats the operation over 0000e28e into ffff1e7a, \
can blend the two coordinates through ffff3e72/255 into ffff1f5e, and \
publishes min(800,floor(selected_coordinate*800/727)) as ffff2816. The \
disabled path copies ffff2a7a to ffff2816."""
note = [
    """
Entry requires ROM8[000089fa].bit5 or ROM8[00008b29].bit6. Both bits are \
clear in stock JK08A, so only the direct ffff2a7a copy executes. The first \
target is signed16[ffff18ea]+32768 when bit5 is set and \
signed16[ffff3394]+32768 when only bit6 enables the path; the second target \
is signed16[ffff18ea]+32768. Every cell of 0000e28e is zero in stock. JK03A \
preserves this exact function and address layout; VQ35HR JK00D preserves the \
two-surface algorithm, while VQ37VHR 1ND0A preserves a simplified \
one-surface homolog and the same 727/800 range conversion. The physical \
quantity is unresolved.""",
]
level = "code"
role = "accessor"
block = "torque_request/block"

