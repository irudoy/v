summary = """
Misfire P030 runtime-state retention maintenance. When ffff5b2c.bit3 is set \
and the ffff41d4, ffff41c9, and ffff41d3 gates admit maintenance, it \
saturating-increments ffff4a49. At count >= 3 it clears bit 5 from both \
status bytes of all seven exact P0306..P0300 runtime records, clears \
ffff5b2c.bit3, all three retained operating-point payloads and markers, \
ffff41c1.bit1, and auxiliary bytes ffff48c2..ffff48c4."""
note = [
    """
The count threshold and reset set are exact. One count has no assigned \
physical-time duration.""",
]
level = "code"
role = "service"

