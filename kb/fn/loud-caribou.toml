summary = """
Two-bank diagnostic monitor with two independent Q1.7 coefficient paths. Map \
00012262 multiplies signed *(ffff2bda+bank*2), divides by 128 with \
truncation toward zero, and compares the result with ROM16[00009070]. Later, \
map 00012272 multiplies signed *(ffff2bde+bank*2), performs the same \
division, clamps to int16, and compares the result with \
ROM16[00008eac]=-10000."""
note = [
    """
Both coefficient scales and signed-product formulas are exact. The physical \
diagnostic quantities remain unresolved.""",
]
level = "code"
role = "accessor"
block = "sensor_monitors/block"

