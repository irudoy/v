title = "Apply bank trims and common additive word to form two parity bases"
summary = """
Complete 7mfk two-bank base-pulse producer from unsigned16 RAM words. The \
raw incoming R4 low byte chooses the bank. Two scalar flag bits choose \
control and conditional LTFT inclusion; a lower trim clamp precedes low32 \
multiplication, unsigned offset correction with a zero-precursor bypass, and \
a final unsigned16 cap. Full machine inputs admit both product wrap and \
unsigned offset underflow. The CPU-only natural-return contract does not \
establish upstream producers, physical bank order, scheduling or hardware \
behavior."""
note = [
    """
The trace proves two-bank parity reuse across six channels but not physical \
bank-to-cylinder ordering. Startup value 0x8000 makes ffff2310/ffff2312 \
neutral.""",
]
