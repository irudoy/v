title = "Apply bank trims and common additive word to form two parity bases"
summary = """
Two-bank base-pulse producer. For bank b it combines STFT ffff22dc+2*b, LTFT \
ffff2302+2*b, extra term ffff2a24+2*b, precursor ffff18c0+2*b, common word \
ffff2436, and offset word ffff2310+2*b. Stock flags select either \
STFT+extra-0x6400 when ffff22e6>0x4000 or STFT+LTFT+extra-0xc800 otherwise, \
clamp the delta nonnegative, scale the precursor by it over 65536, so \
neutral delta 0x6400 is the factor 100/256 that converts the precursor to 10 \
us counts, add ffff2436, apply the offset-neutral correction, saturate, and \
write ffff191c+2*b."""
note = [
    """
The trace proves two-bank parity reuse across six channels but not physical \
bank-to-cylinder ordering. Startup value 0x8000 makes ffff2310/ffff2312 \
neutral.""",
]
level = "code"
role = "driver"
block = "fuel_quantity/block"

