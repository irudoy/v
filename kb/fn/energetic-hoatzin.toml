summary = """
Mode-dependent masked six-channel pulse scheduler. In stock JK08A mode \
ROM8[00008d92] bit 3 is set. When ffff1220 is nonzero, the function calls \
FUN 0002c13c with ffff1220 as the channel mask and the six-word duration \
array at ffff1568, then ORs the same mask into status bytes ffff14c3 and \
ffff14c2."""
note = [
    """
Both branches form the array pointer as ffff128c+0x2dc = ffff1568; ffff14c3 \
and ffff14c2 are status bytes in the same window at +0x237 and +0x236. The \
scheduled quantity is an injection duration in 10 us counts.""",
]
level = "code"
role = "driver"

