summary = """
Paired accessor for 0x14FD2/0x14FE2. Value 0x14FD2 is limited to 10..5000 \
and its low byte is written to ffff8b18. Value 0x14FE2 independently \
participates in two local comparisons and is stored in a stack slot after \
bound selection."""
note = [
    """
The physical purpose of both calibrations is unresolved. The semantics of \
0x14FE2 remain candidate because downstream consumption of the stack value \
is unresolved.""",
]
