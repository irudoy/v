summary = """
P0196 soak-comparison rationality monitor of the engine oil temperature, \
called from 00099e00 only while ROM8[0x18702] bit 2 is set, which stock \
JK08A leaves clear. While ffff4184 bit 7 and ffff244f bit 5 are set it \
counts ffff84c3 bit 6 ticks in ffff3192 and sets ffff41f1 bit 6 above \
ROM16[0x9370]=300. The enable chain requires ffff41c8 bit 7 set, zero \
results of fault predicates 000259e4 and 00025a12 for the checked indices, \
coolant latch ffff5508 of at least ROM8[0x8cda]=130, selected-temperature \
snapshot ffff106e and second temperature byte ffff452c both at most \
ROM8[0x8cdb]=90, and their absolute difference through 00022590 below \
ROM8[0x8cc9]=6; otherwise it clears pass counter ffff3194. With the chain \
satisfied, oil snapshot ffff2772 above ROM8[0x8964]=170, ffff244f bit 5 set, \
ffff41f1 bit 6 clear, battery snapshot ffff1108 above 137, and ffff4206 bit \
0 clear, it counts ticks in ffff3194 and from ROM16[0x9372]=300 reports \
descriptor 0xe4 through 0007d8b8, increments saturating word ffff54f0, and \
sets ffff4206 bit 0."""
note = [
    """
Under deg C+50 the constants are the factory confirmation procedure: coolant \
above 80 deg C before the soak, coolant and intake air below 40 deg C, and a \
difference within 6 deg C; the oil limit of 170 is 120 deg C, and the \
300-tick count stands against a factory idle period of 5 minutes. The \
procedure identifies the second byte as intake air temperature: ffff452c is \
the scheduler snapshot of ffff454c, which FUN 0003d832 copies from ffff5610 \
at 0003d894, and the reference scan holds no writer of ffff5610. Battery \
byte 137 is 10.96 V against the factory condition of more than 11 V.""",
]
level = "code"
role = "monitor"

