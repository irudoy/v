summary = """
Memory and ROM-check task driven by request byte ffff40be from scheduler \
task 0002e8d2 while pending flag ffff41de bit 0 is set. Request 1 \
accumulates the ROM sum (ffff3324, ffff31f8), request 2 compares it against \
ROM32[000096d4], ROM32[000096dc], ROM16[00005ffe], and ROM16[00006efe] and \
records the result, request 3 sets ffff4251 bit 0 at 000cdd4e (cmp/eq #3 at \
000cdd40), and the further codes 5, 6, 0x31, 0x61, 0x81, 0x82, 0x85, and \
0x88 select the other memory operations of the task. The task resets the \
request byte to zero at 000cdb1e, 000cdb7e, 000cdbca, and 000cdd16 and \
clears the pending flag when a pass completes."""
note = [
    """
ffff4251 bit 0 selects the fixed 60/50 percent exhaust test fractions in \
000c2152 instead of the computed duty words; 000cd75c clears the bit on \
every reset. The request codes arrive through manufacturer diagnostic \
service 0xa0 (handler 000306f8).""",
]
level = "code"
role = "service"

