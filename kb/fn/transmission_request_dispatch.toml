title = "Select and run the exact JK08A transmission request coordinator"
summary = """
Transmission request coordinator dispatcher. It always runs four preparation \
functions, then stock ROM8[0x83c1].bit0 clear admits the transmission block \
and stock ROM8[0x870c].bit7 clear selects FUN 00077892 instead of alternate \
FUN 00077dec. It then calls FUN 000789d6 and the common completion function \
FUN 000777fa."""
note = [
    """
Both selector decisions and the active exact-JK08A implementation are \
code-proven.""",
]
level = "code"
role = "dispatch"
block = "transmission/block"

