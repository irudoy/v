summary = """
Exhaust-VTC enable coordinator. It maintains hysteresis flags from scheduler \
snapshots: ffff24a9 bit 3 (raw coolant ffff1071 above ROM8[00008e03]=106, \
release offset 3), ffff24a9 bit 6 (ffff1071 at most ROM8[00008e00]=170 \
through 000259d0, offset 3), ffff24a8 bits 4 and 2 (engine-speed byte \
ffff11b2 at least ROM8[00008de9]=72 and ROM8[00008dec]=72, both 900 RPM with \
700 RPM release through offset 16), ffff24aa bit 5 (vehicle-speed byte \
ffff110e at least ROM8[00008e0f]=5, offset ROM8[000086de]=1), ffff24aa bit 7 \
(ffff110e at most ROM8[00008e0d]=48 through 000259d0, offset 1), and \
ffff246c bit 3 (oil-temperature snapshot ffff2772 at least \
ROM8[00008dff]=110, offset 3). It writes ffff248b bit 0 at 000bf852 as the \
electrical enable: battery snapshot ffff1108 above ROM8[00008e0a]=125 and at \
most ROM8[00008e07]=200, driver status ffff850c bits 5 and 6 clear, \
predicate 00025e4e zero, ffff244f bit 5 set, and record predicate 00025e20 \
clear for the P0014/P0024 extension slots 0x14f, 0x150, 0x151, and 0x152 and \
the P0078/P0084 records 0x43 and 0x44, and, with ROM8[00008616] bit 0 set as \
in stock JK08A (tst #1 at 000bf80e skips the block while the bit is clear), \
the P0197/P0198/P0196 records 0xdd, 0xde, and 0xe4 clear. It writes ffff246c \
bit 2 at 000bf864 as ffff24a9 bits 3 and 6 both set, latches ffff248c bit 6 \
on the rising edge of that bit against prior-cycle ffff246f while ffff2458 \
bit 5 is clear, and latches ffff248c bit 7 on the rising edge of ffff246c \
bit 3. It writes ffff248b bit 2 at 000bf99a as the operating enable: bit 0 \
set, ffff2458 bit 5 clear, ffff246c bit 2 with ffff248c bit 6 clear or \
ffff249c bit 6 set, the engine-speed flag (ffff24a8 bit 4 while ffff24aa bit \
5 or ffff2468 bit 3 is set, otherwise ffff24a8 bit 2), and ffff41be bit 6, \
ffff41d1 bit 7, ffff41d0 bit 0, ffff2f64 bits 0 and 1, and ffff14b8 bits 0 \
and 1 all clear, and, with ROM8[00008616] bit 0 set (test at 000bf974), \
ffff246c bit 3 set with ffff248c bit 7 clear."""
note = [
    """
ROM8[00008616] bit 0 is the oil-temperature sensor configuration bit; stock \
JK08A holds 0x01, so the oil-temperature terms and the P0196/P0197/P0198 \
records apply. The engine-speed release value follows the offset 16 added to \
ffff11b2 while the flag is set. The only caller is coordinator 000c21e6 at \
000c21f2. ffff850c bits 5 and 6 are the edge-count anomaly flags of 000c22dc \
and ffff249c bit 6 the active-test request of 0002e466; ffff2458 bit 5 is \
the scheduled CLSD THL POS status of DID 0x1302 bit 0. The inhibit bits are \
written by 0008c24e (ffff41be bit 6), 0008c272 (ffff41d1 bit 7), 00090d54 \
(ffff2f64), and 00090bd2 (ffff14b8); ffff41d0 bit 0 has no setter.""",
]
level = "code"
