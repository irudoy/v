summary = """
Builds the two-byte parameter pair that fuel_cut_coordinator passes to the \
fuel-cut entry sequence 0006c444, whose first stage loads the first byte \
into a countdown and whose second stage loads the second. In priority order \
it derives the pair from the held pair ffff1490/ffff1491 while ffff1494 is \
nonzero, takes one of two override pairs of ROM8[0000834f..00008352] by bit \
6 of ffff23b0 while ffff477c is nonzero and none of the four bytes is 0xff, \
takes a zero pair while bit 3 of ffff23ff is set, and takes the fixed pair \
ROM8[000089a8..000089a9] when ffff1069 is below ROM8[00008a80] or bit 1 of \
ffff2425 is set. Otherwise the first byte comes from \
fuel_cut_pair_primary_surface or fuel_cut_pair_primary_alternate_surface by \
the hysteretic ratio bit 1 of ffff4525, and the second byte from \
fuel_cut_pair_secondary_curve. After every branch except the held pair, the \
late pair ROM8[0000871d], ROM8[0000871c] replaces the result while bit 2 of \
ffff4501 is set and bit 2 of ffff4504 is clear. The branches differ by \
layout (symbol notes). Physical component conversions remain unresolved."""
