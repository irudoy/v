summary = """
Builds the two-byte parameter pair that fuel_cut_coordinator passes to the \
fuel-cut entry sequence 0006c444. In priority order it derives the pair from \
the held pair ffff1490/ffff1491 while ffff1494 is nonzero, takes the \
override pair ROM8[0000834f..00008352] while ffff477c is positive and no \
byte is 0xff, returns zero while bit 3 of ffff23ff is set, and takes the \
fixed pair ROM8[000089a8..000089a9] when ffff1069 is below ROM8[00008a80] or \
bit 1 of ffff2425 is set. Otherwise the first byte comes from \
fuel_cut_pair_primary_surface or fuel_cut_pair_primary_alternate_surface by \
the hysteretic ratio bit 1 of ffff4525, and the second byte from \
fuel_cut_pair_secondary_curve. Physical component conversions remain \
unresolved."""
