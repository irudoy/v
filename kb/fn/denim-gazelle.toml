summary = """
Alternate commanded-mixture writer reached from coordinator 00057608 only \
when ROM8[00008b42] bit 0 or ROM8[00008b34] bit 4 is set; stock holds both \
clear (0xe0 and 0x81), so the function is never called. When reached it \
writes ffff22e8 = clamp(source, 0x1000, 0x6000) where the source is ffff2732 \
<< 7 when ROM8[00008b42] bit 0 is clear, word ffff557e when ROM8[000086f9] \
bit 1 is clear, and ROM16[000090f0] = 0x4009 otherwise."""
note = [
    """
Dead in stock calibration; a calibration that sets either gate bit \
substitutes this writer for stage 0005594a.""",
]
level = "code"
role = "driver"

