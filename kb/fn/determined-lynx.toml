summary = """
Absolute-throttle publisher. While ROM8[0x8b2c] bit 0 is clear it writes \
min(255, max(0, ffff3f7c - ffff28f8) * 0x505b >> 16) to ffff1075, otherwise \
min(255, ffff3f7c * 0x505b >> 16); while ffff4250 bit 6 is set it writes \
ROM8[0x864e] instead. Before that it stores a per-channel word selected by \
the channel bits of ffff23a6 and ffff23a4."""
note = [
    """
ROM8[0x8b2c] is 0x02, so this image subtracts the idle base. FUN 00035856 \
returns ffff1075 for J1979 Mode 01 PID 0x11 as A*100/255 percent, so \
gradient 0x505b makes one quarter-coordinate count 0x505b/65536*100/255 \
percent and one coordinate count of axis 000155a0 34285/1114112 percent of \
throttle opening.""",
]
level = "code"
role = "monitor"

