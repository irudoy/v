summary = """
Exhaust-cam rest-edge learner, called from coordinator 000c21e6 at 000c21fe. \
While ffff246b bit 4 is set it forms ffff1376 = 128 + \
clamp(ROM8[0000831d]=88 - ffff11c8, -40..40) at 000bfb4a and ffff1377 from \
ROM8[0000831e] and ffff11c9 at 000bfb98 with bound ROM8[00008834]=40, \
setting ffff2495 bit 3 at 000bfb2a when a deviation reaches the bound; while \
bit 4 is clear it clears that flag at 000bfb9e. It then stores learned edges \
ffff479b = clamp_u8(ROM8[0000831d] - ffff1376 + 128) at 000bfbf8 and \
ffff479c at 000bfc1c and sets ffff2475 bit 1 at 000bfc20 when ffff2495 bit 3 \
is clear (000bfba2), ffff24a8 bits 7 and 4 are set (tst; bt exit at 000bfba8 \
and 000bfbb0), and either prior-cycle ffff246e bit 4 is set with ffff246b \
bit 4 clear or ffff246b bit 4 is set with ffff2535 zero."""
note = [
    """
Within the band the learned edge equals the measured phase snapshot, so the \
actual-position bytes of 000bfc2e read 128 at the learned rest. ffff246e is \
the prior-cycle copy of ffff246b made by 00020dfe at 0002105a; the physical \
identities of ffff246b bit 4, ffff24a8 bit 7, and ffff2535 are not \
established.""",
]
