summary = """
Calculates the crankshaft rotational-irregularity metric and is called only \
by 00085a70. It runs only when six 16-bit coefficients at ffff55a2 lie \
between 0x9452=32437 and 0x9454=33096, or within +-1% of 0x8000."""
note = [
    """
The journal interprets six unity-normalized coefficients with +-1% tolerance \
on a six-cylinder engine as crank trigger-wheel irregularity corrections. \
This is inferred from arithmetic and cylinder count; the trace does not \
reach their writers.""",
]
