summary = """
Unsigned Q1.15 scaler on 7mfk for both MAF sensor channels and the \
battery-voltage publisher. It stores min(65535, \
floor(uint16(input)*uint16(ffff4970)/32768)) through its word output \
pointer. The unsigned-word product fits in 32 bits, and the scaler preserves \
MACL through its stock return delay slot."""
note = [
    """
Coefficient 0x8000 makes the scaler an identity. MAF publisher 0003c408 \
applies its raw-full-scale increment after the call; battery publisher \
00039a9e applies a separate byte cap. The scaler does not check the \
coefficient range or mode bit.""",
]
level = "code"
role = "service"
block = "analog_inputs/block"

