summary = """
Unsigned Q1.15 scaler used for both MAF sensor channels and for the \
battery-voltage byte. It calculates min(65535, \
floor(uint16(input)*uint16[ffff4970]/32768)) and writes the uint16 result \
through its output pointer."""
note = [
    """
Stock ffff4970=0x8000 makes the transform an identity before the separate \
full-scale correction in 0003c408.""",
]
