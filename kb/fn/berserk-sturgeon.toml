summary = """
Local misfire DTC reporter called only by FUN 00082c8a. It maps ffff4200 bit \
7 to descriptor index 0x0a (P0306), ffff41ff bits 0..4 to indices 0x0b..0x0f \
(P0305..P0301), and either ffff4200 bit 6 or the no-cylinder fallback to \
index 0x10 (P0300). It captures one of three retained operating-point \
groups, each containing ffff11bc, ffff413e, and ffff3fa4. Odd arguments \
retain only the selected group, arrive with caller selector bits \
ffff5b2b.bits4..6 clear, and set global result latch ffff5b2c.bit3 before \
and after DTC dispatch; even arguments preserve other groups and arrive with \
one caller selector bit set."""
note = [
    """
The cylinder and DTC identities come from the exact JK08A descriptor \
catalog. The argument polarity is operational: code does not identify either \
branch as a physical pass or fail phase. Group 0 is used by both \
200-revolution tracks; groups 1 and 2 are used by the 1000-revolution track \
and by the second 200-revolution track. Groups remain numbered because code \
does not name their diagnostic phases.""",
]
level = "code"
role = "dispatch"
block = "misfire/block"
contract = """
Its only caller restricts the unsigned argument to 0..5. group = argument >> \
1 selects group 0, 1, or 2; polarity = argument & 1 selects the \
group-selector preserving even path or selector-free exclusive-retention odd \
path. Group 0 capture is gated by ffff41c1.bit1 being clear, and even \
argument 0 sets that latch. Groups 1 and 2 capture unconditionally. The \
function returns the common DTC dispatch result when a descriptor is \
selected."""
contract_level = "code"

