summary = """
Positive RPM-drop filter and publication gate. It maintains four RPM/12.5 \
samples, filters the positive four-sample drop into ffff1e50, evaluates \
0001202e by pre-mode RPM, retains the Boolean result in ffff257a, and \
conditionally publishes high8(ffff1e50) to ffff1072."""
note = [
    """
On the normal path D=max(uint16[ffff1f76]-uint16[ffff114a],0) and \
F=min(65535,64*D+floor(192*uint16[ffff1e58]/256)). With ffff2459.bit5 clear, \
q=clamp(ffff114a-96,0,255) indexes 0001202e, the result is retained, and \
ffff1072 is zeroed. With bit5 set, a nonzero retained result and clear \
ffff2451.bit7 inhibit publication; a zero result or set bit7 publishes \
high8(F).""",
]
level = "code"
role = "accessor"
block = "engine_speed/block"

