title = "Critical P0603/P0605/P2119/P1238 qualified RPM fuel inhibit"
summary = """
Critical ECM/ETC fault RPM inhibit contributor. With qualification counter \
ffff4b0e greater than four and the P0603/P0605/P2119/P1238 aggregate in \
ffff41ea.bit5 set, it activates at 2525 RPM and retains through 2000 RPM."""
note = [
    """
FUN 0007d856 produces the qualification counter from the aggregate plus \
engine-running, temperature-difference, and coolant-warm latches.""",
]
level = "code"
role = "accessor"
block = "fuel_cut/block"

