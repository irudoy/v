summary = """
Bounded-ramp coordinator. It selects lower threshold L from 0x1243A or \
0x1244A by ffff2466.bit6, reads live Q7 normalized-BFS byte ffff1048, and \
combines it with upper coordinate C=ROM8[0x11ECD]=128 and a branch-specific \
upper value H from 0x12462 or 0x12472. On the code-proven bit-clear branch \
it calculates clamp(H*(ffff1048-L)/(C-L),0,H) when L<C and selects zero \
otherwise."""
note = [
    """
The live load representation is exact at raw*100/128 percent of \
ROM16[00009534]. Address 00011ecd is the terminal cell of ignition \
normalized-BFS axis 00011ebe, so C is exactly the 100-percent reference \
point; this function reads only that terminal cell and does not interpolate \
the axis. The physical purpose of the ramp output remains unresolved.""",
]
level = "code"
role = "accessor"
block = "ignition_timing/block"

