summary = """
J1979 Calculated Load byte producer. It interpolates M from uint16 map \
0x1491a by uint8[ffff11b3]<<8, calculates q=floor((uint16[ffff1024]<<8)/M), \
optionally recalculates q=floor((q<<7)/uint8[ffff329f]) when ROM8[0x870e] \
bit 4 is set, clamps q to 255, and writes ffff413e. Stock \
ROM8[0000870e]=0x28 has bit 4 clear, so stock normal-path output uses only \
the RPM-dependent 0x1491a reference."""
note = [
    """
Entry gates can force output 0 or 255. A zero optional divisor also forces \
255. FUN 00035856 returns ffff413e for J1979 Mode 01 PID 0x04, whose \
standard scale is 100*A/255 percent. This diagnostic byte is not internal Q7 \
map coordinate ffff102c: that byte uses fixed Base Fuel Schedule reference \
00009534 and scale 100*A/128 percent.""",
]
level = "code"
role = "accessor"
block = "diag_services/block"

