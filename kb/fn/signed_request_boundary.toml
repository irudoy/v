title = "Apply signed request bounds and publish the shared coordinate"
summary = """
Signed request-boundary stage reached by periodic-table index-21 dispatcher \
00079dd8. It reads duplicated controller selection ffff2438/ffff19c2, \
applies mode-controlled lower and upper bounds from several independent \
signed candidates, including transmission-completion bounds ffff347e, \
ffff3480, ffff3482, and ffff3484, and writes bounded outputs including \
ffff19cc and ffff19c6. FUN 00073432 and FUN 00073628 consume ffff19c6 in \
downstream interpolation branches."""
note = [
    """
This closes the signed-request boundary before stock-active inverse \
coordinate ffff198a. ffff4162 can reach this function only through \
ffff3480/ffff3484 while ffff41a6.bit3 is set; the selected stock-lifecycle \
path clears that bit before publication. Exact code continues through \
ffff183e, ffff19b2, per-channel targets, the regulator, and ATU-II BFR6A-D; \
physical scale, plate response, bank identity, and ECM terminals require \
hardware evidence. The function also writes ffff415e and ffff4160, the \
limited and pre-limiter requests clamped to [ffff413a, ffff4138]; CAN packer \
00079e70 scales their scheduler latches exactly as net engine torque, which \
places this request coordinate in the torque domain.""",
]
level = "code"
role = "driver"
block = "torque_request/block"

