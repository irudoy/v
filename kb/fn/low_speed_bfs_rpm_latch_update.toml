title = "Update low-speed BFS-derived RPM eligibility latch with discarded return"
summary = """
Side-effect-only low-speed BFS/RPM latch update. It looks up 00012086 from \
high-byte Base Fuel Schedule, writes threshold ffff143e, and can set \
ffff41d4.bit0 after coarse speed <=2, RPM/25 at or above the threshold, \
status gates, and timer ffff255b expiry. Its return is discarded by \
0004ed88."""
note = [
    """
The latch blocks later low-speed RPM protection branches. Its physical mode \
name remains unresolved.""",
]
level = "code"
role = "accessor"
block = "fuel_cut/block"

