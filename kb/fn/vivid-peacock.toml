summary = """
Curve-form and branch selector. Let x=uint8[ffff22e4]. ROM8[00008710].bit3 \
set selects explicit-axis lookup over 00012778; clear selects implicit \
lookup at q=min(2*x,255). ffff244f.bit1 clear selects curve A (000127a8 \
explicit or 00012798 implicit), while bit1 set selects curve B (000127e8 \
explicit or 000127d8 implicit). The function writes 4*lookup to uint16 \
ffff1752."""
note = [
    """
Stock ROM8[00008710]=0x7c has bit3 set, so the explicit maps are active in \
this function. The physical curve quantity is unresolved.""",
]
level = "code"
role = "accessor"
block = "idle_air/block"

