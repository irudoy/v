summary = """
Fuel-temperature sample filter and transfer stage, called from publisher \
00039788. It filters AN0 mux code 111 sample ffff100a through 0003a5e0 with \
state word ffff1fa8 and status byte ffff1f87, stores the filtered word in \
ffff1fa8 at 00039826 and uint8(word >> 2) in ffff1178 at 0003982e, converts \
that byte through shared table 00012dea via implicit-axis primitive 000263a0 \
at 00039832, and writes transfer code ffff1f89 at 0003983a. It copies two \
filter result flags to ffff24bd bit 6 and ffff24b6 bit 4."""
note = [
    """
Oil-temperature producer 0003eb84 applies the same filter, shift, and lookup \
sequence to its own sample. The transfer code is deg C+50, as the ECU \
declares for table 00012dea through J1979 Mode 01 PIDs 0x05 and 0x0F.""",
]
