summary = """
Periodic P0128 thermostat-model coordinator. It calls surface-product \
accessor 000b7b98 unconditionally, forms \
T=sat_u32(ffff3220+sat_u32(ffff3228+ffff2f98)), writes \
(u32[ffff2d04]>>1)-(T>>1) to ffff33fc, scales that signed balance through \
000b7c84 into ffff3400, and combines the result with ffff3348 under signed \
saturation into ffff2d28."""
note = [
    """
Unsigned additions saturate at 0xffffffff. The final addition saturates to \
int32. The broader state machine and the physical units of its model terms \
remain unresolved.""",
]
