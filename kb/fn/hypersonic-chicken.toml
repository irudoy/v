summary = """
Automatic work-support request selector. While ffff41aa.bit3 is clear it \
requires ffff41a6.bit1, change count ffff2b72 of at least 3, ROM8[0x8b34] \
bit 1 clear and bit 0 set, ROM8[0x8b42] bit 4 clear and bits 5 and 6 set, \
ffff41b9.bit0 clear, and ffff10da below 0xe0. ffff417e.bit6 set then sets \
timing request ffff41aa.bit0 and clears idle request ffff41ef.bit6; a clear \
bit clears the timing request and sets the idle request. A failing condition \
clears both requests."""
note = [
    """
Stock ROM8[0x8b34] and ROM8[0x8b42] pass the calibration checks. The \
automatic request stays clear in JK08A because change count ffff2b72 stays \
below 3.""",
]
level = "code"
role = "selector"

