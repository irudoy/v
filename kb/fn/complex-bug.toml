contract = """
Not arithmetic: longword block copy. It copies r0 bytes from [r2] to [r1], \
with r0 divisible by 4. For r0 <= 0x40 it unrolls through jump table \
0x22094; otherwise it loops. It returns no result and clobbers r0; r2 and r3 \
are preserved on the stack. It writes only destination range [r1, r1+r0) and \
has no diagnostic channel."""
