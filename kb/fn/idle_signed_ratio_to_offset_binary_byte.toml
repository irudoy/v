summary = """
Conditional normalization of the selected curve term. When ffff2465.bit6 or \
ffff2468.bit2 is set, \
D=u16(ffff1752)+4*u8(ffff1765)+u8(ffff1763)+u8(ffff1f62). For D!=0, the \
function writes clamp(floor(s16(ffff2266)*128/D)+128,0,255) to ffff2315; \
separate endpoint rules handle D=0. When both gates are clear, it writes \
128."""
note = [
    """
The arithmetic and gate behavior are exact. The physical quantity \
represented by the normalized byte is unresolved.""",
]
