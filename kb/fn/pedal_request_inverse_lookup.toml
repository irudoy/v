summary = """
APP request inverse-coordinate publisher. It normalizes signed ffff19d2 with \
00075230, inverse-searches current-RPM row of 0xe98e using axis 0x11d0c and \
coordinate table 0x14114, caps the signed result, and writes APP-derived \
candidate ffff243c."""
note = [
    """
Convert the compensated pedal request to the shared-request candidate \
domain""",
    """
The inverse-coordinate operation is exact. The QH0/torque names and \
engineering scales remain candidate semantics.""",
]
