summary = """
Service 0x31 handler. Routine identifier 0 returns the supported-routine \
record; identifiers 0x01..0x08 and 0x0c are accepted through the request-bit \
table at 00022e10, which ORs the routine bit into ffff99d8 or ffff99d9, and \
every other identifier is rejected with response code 0x12. Routine 0x01 \
stores the two parameter bytes as word ffff3fb0. Routine 0x0c resets the \
exhaust-VTC learning: it loads ffff4838 and ffff483c with \
ROM32[000096c0]=0x80000000 at 000340b6 and 000340ba, sets learning status \
ffff5b33 bit 3 at 000340c2, and clears standstill override latch ffff2478 \
bit 4 at 000340cc."""
note = [
    """
Routine 0x0c matches the CONSULT work support item EXH V/T CONTROL LEARN; no \
tester capture binds the identifier. Service 0x32 and 0x33 handlers 00033dd4 \
and 0003348c report routine 0x0c as finished while ffff5b32 bit 3 is \
clear.""",
]
