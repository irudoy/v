summary = """
Saturating aggregate builder. It calculates \
S=u16(ffff1752)+4*u8(ffff1765)+u16(ffff1748)+s16(ffff1230)+u8(ffff15ac)+u8(ffff13f7)+s16(ffff170a). \
When ROM8[0000870c].bit7 is set, u8(ffff1f62) is also added. The result \
clamp(S,0,65535) is written to ffff173a."""
note = [
    """
The aggregate is consumed in the air/throttle target path, but the \
individual physical quantity represented by ffff1752 remains unresolved.""",
]
