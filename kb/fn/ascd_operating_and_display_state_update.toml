summary = """
ASCD control stage that writes display state ffff4128. At 000cede8..000cee1a \
it selects fault state 6 from ffff41ad bit 1 or from ffff424c bit 0 with \
ffff4251 bit 1, engaged state 4 from ffff424e bit 1, standby state 5 from \
ffff4251 bit 1, and 0 otherwise. It drives SET-lamp flag ffff4252 bit 0: set \
in state 4, cleared in states 0 and 5, and inverted in state 6 each time \
countdown ffff4411 is zero, with reload value 20 and phase bit ffff4253 bit \
7."""
note = [
    """
The display-state block runs only while ROM8[0x8B28] has bit 0 set and bit 1 \
clear; the stock byte is 0x2B. The remaining stages of the function, \
including the speed-request calculation and the DTC-driven cancel flags, are \
not described here.""",
]
