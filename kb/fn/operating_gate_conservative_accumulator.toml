title = "Accumulate minimum-factor reference and compare its level"
summary = """
Scan all eight words of each factor array 000160ea and 00015902 and use \
their independent minima in the gated, saturating two-factor reference \
increment. Retain the accumulator when the gate is clear; cap updates at \
0x00feff01. The override flag substitutes 255 times curve 0001622a on axis \
00014f3c. Return ROM16[000090d8] <= floor(accumulator/255), store the \
accumulator at ffff4370 and retain it at ffffa63c. The direct minimum scans \
do not perform an interpolation."""
