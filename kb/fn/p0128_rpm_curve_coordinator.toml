summary = """
P0128 RPM-curve coordinator. It looks up curves 00015bf0, 00015c40, and \
00015c80 over shared RPM/12.5 axis 00013ca8; returns the 00015c40 result \
through a caller output word, conditionally replaces the 00015c80 result \
with one below a model-temperature threshold, and writes one instead of a \
zero 00015bf0 result to ffff35a0."""
note = [
    """
Every cell of all three curves and every point of their shared axis is zero \
in JK03A and JK08A. The 00015bf0 path therefore writes one to ffff35a0; the \
physical meanings of the three curve outputs remain unresolved.""",
]
level = "code"
role = "accessor"
block = "thermostat_coldstart/block"

