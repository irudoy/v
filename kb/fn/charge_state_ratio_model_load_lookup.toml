byte 0x9a, otherwise vvel_load_coordinate ffff238a. It stores each word \
times 2^-14 at ffff9c9c..ffff9cb8, the current-code ratio at ffff9c98 and \
the previous-code ratio at ffff9c94; charge_model blends them as for \
charge_state_ratio_lookup into ffff9c5c, with the held values at ffff9e54 \
and ffff9e58."""
