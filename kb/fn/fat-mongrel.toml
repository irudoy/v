summary = """
Exhaust-cam edge-count monitor, called from engine-event driver 00028ea2 \
with gbr = ffff850c. On reset request ffff850c bit 7 it clears indicators \
ffff850d bits 4..7, zeroes window counters ffff408c..ffff408f whose result \
bit is clear, zeroes edge counts ffff4072 and ffff4073, and clears bit 7 at \
000c23f6. While cylinder index ffff11de is 2, 4, or 6 it judges bank-1 count \
ffff4072 (zeroed otherwise at 000c24aa): a count of one clears ffff850c bit \
5 and ffff850d bits 6 and 4; zero with arm ffff4120 bit 0 sets bit 5 and \
ffff850d bit 6 and increments ffff408c, setting result bit 3 at \
ROM8[00008e21]=10; two or more with arm ffff4121 bit 0 sets bit 5 and \
ffff850d bit 4 and increments ffff408e, setting result bit 1 at 10; both arm \
bits clear clear bit 5 and the indicators. Bank 2 mirrors this while the \
index is 1, 3, or 5 (ffff4073 zeroed otherwise at 000c28ce) with bit 6, arm \
bits 1, ffff850d bits 7 and 5, counters ffff408d and ffff408f, and result \
bits 4 and 2."""
note = [
    """
Bits 5 and 6 of ffff850c inhibit the edge-phase updates in 000c2de0 and \
000c2c58, the actual-position update in 000bfc2e, and the electrical enable \
in 000bf630; the indicators feed the P1078/P1084 judgement of 00090086 and \
0009018c.""",
]
level = "code"
role = "monitor"

