summary = """
Active/reference timing-state field extractor. It writes \
ffff12de=ffff160f&0x7f and ffff12e0=ffff1610&0x7f. When ROM8[0x8b3f].bit1 is \
set it writes ffff12df=max(ffff12e0-ffff12de,0), otherwise zero. It also \
writes ffff23bd=max(ffff12de-ffff11af,0)."""
note = [
    """
Extract the selected map fields and publish downstream timing-state terms""",
    """
ffff23bd carries the active cold/hot map state into the normal timing-state \
compositor branch.""",
]
level = "code"
role = "accessor"
block = "ignition_timing/block"

