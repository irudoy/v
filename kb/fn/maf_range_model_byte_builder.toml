title = "Build one bank-indexed comparison byte for P0101 or P010B"
summary = """
Bank-indexed model-byte builder called with index 0 by P0101 monitor \
0008152a and index 1 by P010B monitor 00081d74. It combines ffff1956 and \
per-bank state with Base Fuel Schedule K-Value 00009284, MAF Factor \
00008a27, normalization reference 00009534, event scalar 000088fb, and byte \
ffff10e0, then writes a saturated byte to ffff15bc[index]."""
note = [
    """
The two outputs are model-side comparison bytes and captured event values in \
the exact P0101/P010B range-performance path. Their complete physical \
conversion remains unresolved.""",
]
