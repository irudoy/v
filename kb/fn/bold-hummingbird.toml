summary = """
ADC2-to-RAM acquisition initializer using DMAC channel 2. With \
ROM8[0x8b3d].bit7 set, it programs SAR2 to ADC2 ADDR24 at fffff840 or ADDR28 \
at fffff848, DAR2 to byte buffer ffff86cc or ffff874c selected by ffff20c0, \
DMATCR2 to 128, and CHCR2 to 0x010d110d. The control word selects ADC2 \
requests, source reload, incrementing byte destinations, completion \
interrupt, and channel enable."""
note = [
    """
The two 128-byte destination ranges are ffff86cc..ffff874b and \
ffff874c..ffff87cb; neither overlaps ffff2368. The ADC2 channel selection \
and DMAC control fields follow the SH7058 hardware manual.""",
]
