summary = """
Live boundary and state consumer for the three normalized outputs from FUN \
0007af78. It calculates min(ffff347c,max(ffff2a7a,ffff3478,ffff347a)), \
unless ffff41f3.bit0 selects override ffff3026, writes zero and 800-bound \
state bits in ffff41fb, and publishes the selected word to ffff412a."""
note = [
    """
With stock normalization endpoints both zero, all three bounds equal 800 and \
the non-override clamp resolves to 800. The downstream state transition is \
exact; the physical quantity remains unresolved.""",
]
level = "code"
role = "consumer"

