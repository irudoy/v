summary = """
Actual exhaust-cam timing producer, called from coordinator 000c21e6 at \
000c220c and 000c2212 with the channel in r4. It returns at 000bfc50 while \
driver status ffff850c bit 5 + ch is set. It stores filter coefficient \
ffff160e = interp(00012f7e over axis 00012f6e by ffff11ae) at 000bfc70, \
forms the deviations d0, d1, d2 = clamp_u8(snapshot - ffff479b[ch] + 128) of \
the three edge-phase snapshots ffff11c8, ffff11ca, and ffff11cc from learned \
rest edge ffff479b + ch into ffff1c88 + ch, ffff1c8a + ch, and ffff1c8c + ch \
(000bfcaa, 000bfcd6, 000bfd02), takes calc = (d0 + d1 + d2) / 3 through \
00021bbc while ROM8[00008615] bit 1 is set and calc = d0 otherwise (stored \
at ffff1c84 + ch, 000bfd66), and writes byte[ffff2324 + ch] = clamp_u8(128 + \
round((x * (calc - 128) + (256 - x) * (byte[ffff232a + ch] - 128)) / 256)) \
at 000bfdae, where ffff232a is the previous-pass copy of the output read at \
000bfd74."""
note = [
    """
One output count is 0.5 crank degrees of the edge relative to the learned \
rest edge (DID 0x1164 and 0x1165, community definition raw*0.5-64 degCA). \
Curve 00012f7e holds 0xcd at 800 RPM and 0xff from 1600 RPM over axis \
00012f6e (0x10..0x80 RPM/50), so the output is a first-order filter that \
passes 255/256 of each new sample above 1600 RPM.""",
]
