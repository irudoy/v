summary = """
Cross-channel disagreement monitor for final words ffff2a7a and ffff35cc. \
Under four entry gates it calculates abs(uint16(ffff2a7a)-uint16(ffff35cc)), \
writes the result to ffff2c1c, and when the difference exceeds 26 invokes \
service dispatcher 0007d8b8 with argument 0x62 after a local countdown \
permits it."""
note = [
    """
This proves that the two crossfade components are parallel calculation \
channels whose final raw outputs are checked for agreement. It does not \
identify their physical quantity.""",
]
level = "code"
role = "monitor"

