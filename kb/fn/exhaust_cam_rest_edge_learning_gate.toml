summary = """
Exhaust-cam rest-edge learning gate, called from coordinator 000c21e6. It \
maintains ffff24aa bit 0 through 000259d0 (engine-speed byte ffff11b2 at \
most ROM8[00008e1b]=80, release offset 16) and writes ffff24a8 bit 7: set at \
000bfa3c while ffff248b bit 0, ffff24a9 bits 3 and 6, and ffff24aa bit 0 are \
set and ffff850c bits 5 and 6, predicate 00025e4e, and ffff41be bit 6 are \
clear, cleared at 000bfa8a otherwise. With the gate set it sets ffff246b bit \
4 while conditioned target ffff2327 is 0x80, duty words ffff1aac and \
ffff1aae are zero, and timer ffff2536 has expired, and keeps the bit clear \
while that timer runs; with the gate clear, the target off neutral, or a \
duty word nonzero it clears the bit and reloads ffff2536 from \
ROM8[0000883f]=10. It reloads ffff2535 from ROM8[0000883d]=10 on every pass \
that does not set the bit."""
note = ["Learner 000bfad4 consumes ffff246b bit 4 and ffff24a8 bit 7."]
