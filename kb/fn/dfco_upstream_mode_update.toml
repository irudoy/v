title = "Update upstream DFCO mode or eligibility bit 5"
summary = """
Update upstream DFCO mode or eligibility bit ffff2459.bit5. One gate \
requires ffff2451.bit7 or ffff24cd.bit7 together with 0008c3fa. The \
alternate gate selects inverted ffff417f.bit3 or ffff4230.bit7 according to \
ffff4245.bit0, ffff4249.bit4, and ffff259c. The same function derives \
ffff417f.bit3 and maintains ffff4230.bit7 through a small hysteresis state."""
note = [
    """
Whole-program p-code establishes this as the only writer of bit 5. Physical \
signal identities remain unresolved.""",
]
level = "code"
role = "driver"
block = "dfco/block"

