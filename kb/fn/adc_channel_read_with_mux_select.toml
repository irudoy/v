title = "Read an ADC channel with optional PF13 through PF15 mux selection"
summary = """
Direct ADC channel reader with optional PF13..PF15 external-mux selection. \
For channel 0, argument 0 selects mux code 000 before reading ADDR0; \
argument 0xe000 selects code 111. The caller 0002c4f8 uses those exact \
combinations for coolant and fuel-temperature acquisition respectively."""
note = [
    """
Together with cyclic sampler 000280d8, these calls prove that AN0 is an \
external-multiplexer node rather than a dedicated single-signal input. Mux \
positions other than the diagnostic-bound coolant, battery-voltage, and \
fuel-temperature paths remain unnamed.""",
]
level = "code"
role = "driver"
block = "analog_inputs/block"

