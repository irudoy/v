summary = """
Coolant selector and downstream conditioner for the intake-cam target. With \
stock thresholds ROM8[00008d2e]=106 and ROM8[00008d2d]=131, it selects cold \
target ffff1c5e at raw coolant <=106, warm/main target ffff1c5c above 131, \
and blends cold + trunc0((coolant-106)*(main-cold)/25) between them. It \
writes the selected byte to ffff1bee, then applies mode, rate, and offset \
logic before writing common reference ffff2326. While ffff24a7 bit 1 is set, \
it continues from idle source byte ffff1553 instead: a value at or below the \
previous ffff2326 applies at once, and a higher value also applies at once \
unless ffff247b bit 1 is set and ffff1a1e is nonzero, in which case the \
target holds while countdown ffff25ee runs and rises one count each time it \
reads zero, reloading ffff1a1e and ffff25ee from 00012efe when \
ROM8[00008616] bit 0 is set or from 00012f06 by coolant index otherwise. \
While intake operating bit ffff246b bit 6 is clear, it writes neutral 0x80 \
to ffff2326 through 000bdcf6 and 000bdeca unless ffff248b bit 1 and IOLID \
0x19 active-test bit ffff41fa bit 0 are both set."""
note = [
    """
The raw selection thresholds, signed truncation, and common-reference output \
are exact. The exact diagnostic raw-50 conversion maps the thresholds to 56 \
and 81 degC. Target-vehicle replay observes 1,968 samples in 51 runs where \
this downstream path forces neutral 128 while the reconstructed warm map \
remains active. The routine that counts ffff25ee down is not identified, so \
the time base of the rise is not established.""",
]
