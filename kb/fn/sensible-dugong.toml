summary = """
Shift kernel of the implicit-2d byte entry gabby-vole/fn: five shlr/rotcr \
pairs shift the input in r4 right by 5 into the index and carry the low bits \
into r5, and swap.w returns the Q0.16 fraction in r5, so one axis step is \
32. The entry calls it once for each input."""
