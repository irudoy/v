summary = """
Exhaust-CVTC target coordinator. It starts from retained ffff2327, selects \
or blends cold/fallback ffff1c5f and warm/main ffff1c5d across the same raw \
coolant thresholds used by the intake target path, then applies mode, rate, \
and offset constraints before writing ffff2327 at 000c0cee. Its override \
stage at 000c0150..000c01f4 is the stroke of the exhaust valve timing \
control learning, and its tail at 000c0a0c..000c0ca8 runs the learning: with \
settle flag ffff24d3 bit 4 it raises first-learning request ffff24ab bit 2 \
while status ffff5b33 bit 3 is set and refresh request ffff24aa bit 2 \
otherwise, captures integrator longword ffff147c + 4b into ffff1484 + 4b on \
a clean bank release (ffff1c7e bit b), filters retained ffff4838 + 4b from \
base ffff4840 + 4b with weight ROM8[00008e52]=77/256 on a refresh, requests \
the retained copy through ffff1c8e on the first learning, and clears \
ffff5b33 bit 3 once both banks are done."""
note = [
    """
The exact JK08A DID table maps 0x1166 to ffff2327. Structured Nissan \
diagnostics name it target exhaust VTC angle. The P1078/P1084 and \
P0014/P0024 monitor paths consume the same byte, independently confirming \
the subsystem. Target-vehicle replay exercises only the warm band and shows \
exact steady-state convergence while exposing downstream conditioning \
transitions. The VQ35HR factory manual (2007 G35, EC-20) describes the \
learning as a comparison of the target angle with the actual retarded angle, \
performed in N at 1,800 to 2,000 rpm for 20 seconds.""",
]
