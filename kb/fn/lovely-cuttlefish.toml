summary = """
ATU-II channel 1A GR1E capture handler for the bank-2 intake cam. It stores \
interval ffff22ca = GR1E - ffff158a, forms running edge phase ffff22d3 = \
20*ffff13b2 + floor(20*interval/ffff22bc) - 60 (selector below 8) or - 20 \
(selector 8 and above) through signed divider 00021bbc, clamped at zero, and \
copies it to ffff22cd while event state ffff13c8 is 1, 3, or 5, after \
shifting ffff22cd into ffff22cf and ffff22d1. The pass requires ffff84ff bit \
7 set, ffff8504 bit 7 clear, and edge count ffff1390 equal to 1."""
note = [
    """
The SH7059 hardware manual identifies 0xfffff44c as GR1E. One count of the \
edge phase is 0.5 crank degrees, the same unit as the bank-1 handler \
0002a5cc and the exhaust edge handlers.""",
]
level = "code"
role = "driver"
block = "crank_cam/block"

