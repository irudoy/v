summary = """
EVAP small-leak result monitor. It compares the high byte of ffff301c with \
ROM8[0x880c]=0xff. The below-threshold branch calls complementary updater \
FUN 000b4ef8 with index 0xda; the at-or-above branch dispatches exact P0442 \
index 0xda through FUN 0007d8b8 after calibrated operating-range gates."""
note = [
    """
The exact code proves the raw comparison and descriptor. The homologous \
factory Service 06 area unit is not assigned to ffff301c without a \
conversion trace.""",
]
