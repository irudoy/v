summary = """
Retained-region check run first by startup initializer FUN 00027ac0. While \
PLDR fffff75e bit 4 is set, it accepts retained region ffff4514..ffff5cf3 \
when marker ffff5cf6 equals 0xaa55 and either check word ffff5cf8 equals \
0x6997 and checksum FUN 00026dc4 equals byte ffff5cf4, or ffff5cf8 differs \
from 0x6997, range check FUN 00026ea0 passes, FUN 00067188 returns a value \
other than 0xaa, and pair check FUN 00026fd0 returns zero. Acceptance clears \
ffff5b2f bit 7, rejection calls reinitializer FUN 00026f08, and the function \
then clears ffff5cf8."""
note = [
    """
FUN 00026da8 writes the checksum byte and check word 0x6997. The physical \
meaning of PLDR bit 4 is not assigned; startup entry FUN 00027e24 waits for \
the bit before it runs the startup initializers.""",
]
