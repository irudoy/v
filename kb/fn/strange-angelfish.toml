summary = """
Trustful RPM-row interpolation and inverse-coordinate lookup. It selects or \
interpolates one 16-point offset-binary output row of 000175c8 over byte \
axis 00018716, searches that row with centered signed request ffff19c6 plus \
0x8000, returns values from 00018ac6, and writes the result to ffff1d14."""
note = [
    """
The operational transform is exact. The physical QH0/torque identity and \
engineering scales remain catalog candidates. This path is the parallel \
counterpart of FUN 00073432 and uses byte-identical table and axis \
contents.""",
]
