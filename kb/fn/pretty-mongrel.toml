Bank-indexed learned-trim adjustment producer. It updates Q8.8-percent word \
ffff5648 or ffff564a through gated signed steps and calibrated bounds, and \
forces neutral 0x6400 under fault conditions. FUN 00057b26 combines this \
adjustment with the selected learned-grid cell to form the LTFT diagnostic \
word."""
