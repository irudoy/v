summary = """
Per-bank P1080/P1086 path. With ffff4184 bit 7 and ffff24ab bit 3 set and \
cam edge phase snapshot ffff11c8 + b at or below ROM8[00008e32]=254 it sets \
bit b of ffff2f64 once timer ffff25f0 + b has expired and calls 0007d8b8 \
with record 0x88 or 0x89 once timer ffff25f2 + b has expired; otherwise it \
reloads the timers from ROM8[00008e34]=0 and ROM8[00008e35]=0."""
note = [
    """
Family entry 00090e5e calls it only under ROM8[000186f2] bits 5 and 4; stock \
JK08A holds 0x07, so it never runs. No factory definition of P1080 or P1086 \
is present in the tracked sources.""",
]
