summary = """
Hardware-input and state-bit builder. It reads SH7058 PHDR and forms packed \
current input byte ffff1164. PHDR bit 1 (PH1DR) is copied with direct \
polarity to ffff2451.bit7. PHDR bit 4 is the park/neutral position input: at \
00038636 a clear port bit sets ffff4217 bit 1 and ffff1164 bit 2, and a set \
port bit clears both. At 0003895a..00038990 it sets ffff2451 bit 2 while \
ROM8[00008b3f] bit 7 is clear and battery-voltage raw ffff1188 is at most \
100, and otherwise stores the inverse of ffff1164 bit 2. The function \
retains its established state-machine use of maps 00012ada and 00012aea. It \
also debounces PLDR bit 4 in state ffff39c4: state 0 moves to 2 and loads \
countdown ffff25d5 with 5 when the pin reads 0, state 2 returns to 0 when \
the pin reads 1 and moves to 1 when the countdown reaches 0, and state 1 \
returns to 0 when the pin reads 1; ffff4185.bit7 is clear in state 1 and set \
otherwise."""
note = [
    """
PH1 is MCU pin 64. FUN 0002e0d4 publishes ffff2451.bit7 as DID 0x1305 bit 2, \
which a structured Nissan profile names BRAKE SW; the factory manuals place \
the stop lamp switch signal on ECM terminal 122, so PH1 is a terminal 122 \
candidate by signal identity. PHDR bit 4 is MCU pin 67/B19 and reaches \
ffff1164 bit 2 with active-low polarity. FUN 0002e0d4 publishes the inverse \
of ffff4217 bit 1 as DID 0x1302 bit 2, which the same profile names P/N POSI \
SW, so ffff2451 bit 2 is P/N position switch ON with ON as the low-battery \
default; the ECM terminal remains unresolved. Exact DID 0x1103 identifies \
ffff1188 as battery voltage, and at 0.08 V per count raw 100 is 8.00 V. The \
ffff25d5 countdown lies in the 10.24 ms block of FUN 0002040c, so bit 7 \
clears after the pin has read 0 for five decrements. Application startup FUN \
00027e24 waits for PLDR bit 4, and work-support status 0xa6 reports the \
debounced low level through scheduler copy ffff4184.bit7.""",
]
level = "code"
role = "accessor"

