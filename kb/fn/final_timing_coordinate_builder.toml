title = "Apply mode-dependent limits and publish the final timing coordinate"
summary = """
Final internal timing-coordinate builder. It forms mode byte ffff5b31 with \
hysteresis from coolant ffff1079 against raw 110, RPM/25 byte ffff11b3 \
against ROM8[0x8897]=48 and ROM8[0x8896]=128, and load ffff1048 against \
ROM8[0x8768]=64 and ROM8[0x8767]=96; writes \
ffff11da=clamp(ffff12d6+ffff564c, ROM8[0x8221]=-7, ROM8[0x821e]=50) with the \
ffff564c term included only while bits 1..5 of ffff5b31 are clear; \
optionally adds clamp(ffff9926,-10,0) under ffff99c4.bit2; rate-limits the \
sum against the previous ffff11d4 by at most ROM8[0x828a..0x828e]=4 counts \
upward per pass (ROM8[0x828f]=15 or ROM8[0x8291]=15 in the flagged modes) \
and ROM8[0x8291]=15 downward; re-clamps to -7..50; bounds it below by \
-(129-ffff1079) while coolant raw is below 130 and above by \
ROM8[0x83d5]-40=70; applies the override modes of ROM8[0x8b34], \
ROM8[0x8b42], and ROM8[0x86f9]; initializes to ROM8[0x8289]=0 on the first \
pass; and writes ffff11d4."""
note = [
    """
The -7 lower bound is the normal stock envelope, not a universal limit for \
diagnostic and fallback branches. FUN 0004df82 converts the result into both \
the APC set command and shared diagnostic byte. Every term enters with \
coefficient 1, and J1979 PID 0x0E declares the result as crank degrees \
before TDC. Stock ROM8[0x8b34]=0x81 has bit 4 clear, which skips the \
override branch.""",
]
level = "code"
role = "accessor"
block = "ignition_timing/block"

