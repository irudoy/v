summary = """
Area-per-speed column coordinate of the shared throttle target. With \
ffff24ce bit 2 and ffff24d2 bit 0 clear it writes uint32 \
ffff18fc=floor(4*floor(ffff19b2*65536/ROM8[00008d8f])/max(ffff11b6, 32)); \
otherwise it converts final channel targets ffff28bc and ffff28be through \
00013202 over axis 000155a0, adds both areas with uint16 saturation, and \
applies the same formula to the sum."""
note = [
    """
00072d1c, entry 37 of the 124-entry periodic table at 0002196c, calls it \
first and then 00072dfc, which converts ffff18fc. The formula matches \
ffff1824 of 00073948: with ffff11b6 in RPM/3.125 counts and \
ROM8[00008d8f]=100, ffff18fc is 8192*area/RPM, with the speed floored at 100 \
RPM. Its mode branches match those of shared-area compositor 00072c3c.""",
]
level = "code"
role = "accessor"
block = "throttle_target/block"

