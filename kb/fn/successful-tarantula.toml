summary = """
Bank-indexed learned-fuel-trim cell selector. It selects one of 64 \
Q8.8-percent cells from RAM grid ffff4b90 for bank 1 or ffff4b10 for bank 2. \
The 8x8 index uses current Base Fuel Schedule word ffff1024 against ROM byte \
thresholds 0x12592 and engine-speed byte ffff11ae against thresholds \
0x126dc, with hysteresis around the prior packed index in ffff130a/ffff130b. \
The selected cell is written to ffff2306 or ffff2308."""
note = [
    """
The RPM thresholds correspond to 0, 1000, 1500, 2200, 3400, 4400, 5400, and \
6400 RPM through the established rpm/50 scale of ffff11ae. Exact DID 0x1208 \
establishes the ffff1024 coordinate as Base Fuel Schedule. An invalid \
selected cell, a fault flag, or a control gate resets all 64 cells of the \
affected bank to neutral 0x6400.""",
    """
R4 supplies b=uint8(x) in 0..1, with independent upper register bits. \
First-break searches admit arbitrary byte thresholds; prior indices use only \
the low six packed bits. Real fill, auxiliary reset and diagnostic predicate \
execute on their actual stock call paths. The reset transition prevents a \
universal positive selected-cell sign. B = uint8(x); X = RAM16[0xffff1024]; \
S = RAM8[0xffff11ae]; P = RAM8[0xffff130a+B]; O = P&7; V = (P>>3)&7; H = \
ROM8[0x0000881b]; K = floor(ROM8[0x0000881a]/4); A1 = \
min(1,max(0,(X)-(256*ROM8[0x00012593])+1)); A2 = \
A1*min(1,max(0,(X)-(256*ROM8[0x00012594])+1)); A3 = \
A2*min(1,max(0,(X)-(256*ROM8[0x00012595])+1)); A4 = \
A3*min(1,max(0,(X)-(256*ROM8[0x00012596])+1)); A5 = \
A4*min(1,max(0,(X)-(256*ROM8[0x00012597])+1)); A6 = \
A5*min(1,max(0,(X)-(256*ROM8[0x00012598])+1)); A7 = \
A6*min(1,max(0,(X)-(256*ROM8[0x00012599])+1)); C1 = \
min(1,max(0,(S)-(1*ROM8[0x000126dd])+1)); C2 = \
C1*min(1,max(0,(S)-(1*ROM8[0x000126de])+1)); C3 = \
C2*min(1,max(0,(S)-(1*ROM8[0x000126df])+1)); C4 = \
C3*min(1,max(0,(S)-(1*ROM8[0x000126e0])+1)); C5 = \
C4*min(1,max(0,(S)-(1*ROM8[0x000126e1])+1)); C6 = \
C5*min(1,max(0,(S)-(1*ROM8[0x000126e2])+1)); C7 = \
C6*min(1,max(0,(S)-(1*ROM8[0x000126e3])+1)); R = A1+A2+A3+A4+A5+A6+A7; U = \
C1+C2+C3+C4+C5+C6+C7; I = \
R-min(1,max(0,(R)-(O)))*min(1,max(0,(256*(ROM8[0x00012592+min(7,O+1)]+H))-(X)))+min(1,max(0,(O)-(R)))*min(1,max(0,(X)-(256*(ROM8[0x00012592+O]-H)))); \
J = \
U-min(1,max(0,(U)-(V)))*min(1,max(0,(ROM8[0x000126dc+min(7,V+1)]+K)-(S)))+min(1,max(0,(V)-(U)))*min(1,max(0,(S)-(ROM8[0x000126dc+V]-K))); \
L = RAM16[0xffff4b90-128*B+2*(8*J+I)]; lo = 256*ROM8[0x00008a9e]; hi = \
256*ROM8[0x00008a9f]; G = min(1,max(0,(L)-(lo)+1))*min(1,max(0,(hi)-(L)+1)); \
F = RAM8[0xffff41b5]&1; D = (RAM8[0xffff5718+3*297+1]>>7)&1; Z = \
1-G*(1-F)*(1-D); to = (1-Z)*L+Z*25600""",
]
