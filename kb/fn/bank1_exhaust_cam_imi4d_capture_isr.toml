summary = """
ATU-II IMI4D input-capture handler for the bank-1 exhaust-cam sensor edge, \
installed at interrupt pointer entry 0x20210; its body continues at \
000c2de0. It clears IMF4D in TSR3 (fffff480) with mask 0x7eff, reads capture \
GR4D (fffff4c8), forms the 16-bit difference to crank reference count \
ffff158a, stores it as the edge interval word at window offset 0x7f4 \
(ffff1a80), and branches into 000c2de0 on the segment-index mapping of event \
selector ffff13b2."""
note = [
    """
Ghidra separates the continuation at 000c2de0 because the three-way segment \
branch re-enters the body below the entry; the two parts form one handler.""",
]
level = "code"
role = "handler"
block = "crank_cam/block"

