title = "Add the pulse offset and schedule the APC reset compare"
summary = """
Secondary APC command builder. It computes byte offset=120-u8(ffff237a); \
when ffff24c9.bit5 is set it also subtracts ROM8[0x8649] and lower-clamps at \
zero. Stock ROM8[0x8649]=0 and ffff237a is bounded to 0..114, so the stock \
offset is 6..120. It writes ffff2230, adds the offset to ffff2022, and \
tail-calls 0002acba."""
note = [
    """
For a newly applied primary target at most 117 the sum is at most 237, so \
the override introduces no uint8 wrap before the GR11B scheduler. The offset \
places the GR11B reset edge ffff237a crank degrees before the GR11A set edge \
of the next cylinder, so ffff237a is the dwell angle in crank degrees; the \
external driver stage remains a hardware boundary.""",
]
level = "code"
role = "driver"
block = "ignition_output/block"

