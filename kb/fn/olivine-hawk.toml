summary = """
First accelerator-pedal sensor range monitor. It reads diagnostic value \
ffff269e, accepts ROM16[0x8ffc]=60..ROM16[0x8ff8]=964 counts inclusive, and \
dispatches exact JK08A descriptor indices 0xdf and 0xe0 for P2123 and \
P2122."""
note = [
    """
The exact ROM descriptor catalog identifies the two dispatcher indices as \
accelerator-pedal position sensor 1 high and low circuit faults. At 5 mV per \
count the window is 0.30..4.82 V, which brackets the factory band of \
0.5..1.0 V released and 4.2..4.8 V depressed.""",
]
level = "code"
role = "monitor"
block = "sensor_monitors/block"

