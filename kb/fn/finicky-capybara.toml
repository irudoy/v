summary = """
Accessor gated by ffff24c0. It copies the eight-byte curve 0x237AC to the \
stack, looks up map 0x120CE by min(255,ffff1024>>7) and the stack copy by \
clamp(ffff2020-144,0,255), combines the results as (lookup1+lookup2-128)*8, \
and writes the correction to ffff2018. FUN 00068d58, gated by the same bit, \
adds it to a quotient and limits the sum to 125..(ffff201a-125) before it \
writes ffff201e."""
note = ["The physical purpose of the correction is unresolved."]
level = "code"
role = "accessor"
block = "idle_air/block"

