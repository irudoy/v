[[symbol]]
layout = "jk78c"
address = "00087288"
name = "funky-anaconda"
note = """
FUN_00087288 holds the position of JK08A FUN_00068CB8 in the calls of \
FUN_00087624 (JK08A FUN_00069064) and repeats its structure (154 bytes on \
JK78C, 158 on JK08A). Both layouts combine two eight-point curves. JK78C \
reads the uint16 curves 0x15D72 and 0x15D62 in place through the implicit \
primitive 0x28200 (step 8192); JK08A reads the byte map 0x120CE and a stack \
copy of the byte curve 0x237AC through 0x26370 (step 32). The first index is \
min(0xFFFF, 2*u16[ffff1016]), the snapshot copy of ffff1022, against \
min(255, u16[ffff1024]>>7), the Base Fuel Schedule sample, on JK08A. The \
second index is clamp((u16[ffff1F74]-144)*256, 0, 0xFFFF) against \
clamp(u16[ffff2020]-144, 0, 255). The second curve is biased by 0x8000 in \
place of 0x80, and the sum (l1+l2-0x8000)*8 saturates to the signed 16-bit \
range before the store to ffff1F6C. After the bias, the stock values of \
0x15D62 repeat those of 0x237AC except the fourth point (-8 against -7). The \
curve 0x237AC is not classified."""

