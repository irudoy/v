summary = """
Accessor for map 0x120CE gated by ffff24c0. Two lookups of the same map \
combine as (lookup1+lookup2-128)*8, and the correction is written to \
ffff2018. FUN 00068d58, gated by the same bit, adds it to a quotient and \
limits the sum to 125..(ffff201a-125) before it writes ffff201e."""
note = ["The physical purpose of the correction is unresolved."]
level = "code"
role = "accessor"

