title = "Map RPM/25 to staged six-channel ETC fault mask"
summary = """
ETC-fault staged six-channel RPM mask. RPM/25 values below 43 return 00; \
values 43..48 return 01,05,07,0f,1f,3f respectively; values above 48 retain \
3f."""
note = [
    """
The non-linear bit sequence is exact and is not interpreted as physical \
injector order.""",
]
