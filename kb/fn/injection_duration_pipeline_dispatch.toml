summary = """
Top-level mode-dependent six-channel calculation and output dispatcher. Its \
initial calculation uses Q0.6 map 0001300e. ROM8[00008d92] bit 3 selects the \
downstream pipeline. Stock value 0x7a selects the branch at 00052484: shared \
calculations call FUN 0005185c and FUN 00051700, then each of six channels \
passes through FUN 0005727a, FUN 00052034, and FUN 00051a98 among other \
calculations; after the loop, FUN 00051f1e schedules the selected channels. \
In this stock branch FUN 00052034, not FUN 00051a98, writes ffff1220."""
note = [
    """
The physical subsystem of map 0001300e and several intermediate quantities \
remains unresolved. The stock dispatch topology and ffff1220 writer are \
code-level facts.""",
]
