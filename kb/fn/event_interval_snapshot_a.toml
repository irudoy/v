summary = """
First event-interval snapshot. Under its gates it calculates a \
wrap-corrected unsigned difference between current timestamp ffff185c and \
previous timestamp ffff84cc, writes the difference shifted right by five to \
ffff11fc, and updates ffff84cc. A fault gate writes 0xffffffff instead."""
note = [
    """
Measure a wrap-corrected event interval and publish the value shifted right \
by five""",
    """
The shift and wrap arithmetic are exact. The physical timer frequency and \
event-to-crank-angle conversion remain hardware-level unknowns.""",
]
level = "code"
role = "accessor"

