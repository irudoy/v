summary = """
Selector of transition byte ffff3373. While ROM8[00008b3f] bit 4 is set it \
copies ffff273a, the scheduler snapshot of CAN 0x177 payload byte 4 \
ffff283e. Otherwise it writes 0 while ffff244f bits 0 and 6 and ffff2450 bit \
5 are clear. While ffff2453 bit 6 is clear and ffff244f bit 6 is set, for \
target gear index ffff1083 of 0 to 2 it writes the explicit-axis lookup \
through 00026474 of engine speed ffff11ae over axis 00012b42 in the table \
that ffff1083 selects from 00012b2a, 00012b32, and 00012b3a while ffff2466 \
bit 6 is clear and from 00012b4a, 00012b52, and 00012b5a while it is set. In \
the remaining states, for ffff1083 of 1 to 3, it forms x=min(255, max(0, \
(ffff40c6*0x2d0e>>15)-32)) and writes the implicit 1D-8 lookup through \
00026370 at x: while ffff2454 bit 5 is clear and ffff2450 bit 5 is set, in \
00012b86, 00012b8e, or 00012b96 for ffff1083 of 1, 2, or 3 while ffff2466 \
bit 6 is clear and in 00012b9e, 00012ba6, or 00012bae while it is set; \
otherwise, while ffff2453 bit 0 is clear and ffff244f bit 0 is set, in \
00012b66 or 00012b6e for ffff1083 of 1 or at least 2 while ffff2466 bit 6 is \
clear and in 00012b76 or 00012b7e while it is set. Every other state keeps \
ffff3373."""
note = [
    """
00065434, entry 66 of the 124-entry periodic table at 0002196c, calls it at \
00065460. Stock ROM8[00008b3f]=0x18 has bit 4 set, so stock JK08A takes the \
copy branch and reads none of the tables; the sixteen tables and axis \
00012b42 hold zeros. CAN 0x177 payload decoder 000c4ace writes ffff283e, and \
the 0x104-byte scheduler copy 00022558 moves ffff277e..ffff2881 to \
ffff267a..ffff277d, which places ffff283e at ffff273a. L0 readers of \
ffff3373 are 00064444, 000645c4, 000647e8, and 00064cb2; 000647e8 multiplies \
it into the decrement step of ffff1866.""",
]
