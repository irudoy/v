summary = """
EVAP baseline-difference scaling helper. It subtracts two zero-extended \
uint16 arguments, multiplies the signed difference by ROM8[00008999]=112, \
arithmetic-shifts right by five, and upper-saturates the result at 65535."""
note = [
    """
EVAP producer paths pass captured baseline ffff2abc as a and current sample \
ffff10c4 as b, then clamp negative returns to zero before storing ffff2c92. \
The physical pressure scale of either sample remains unresolved.""",
]
level = "code"
role = "service"
block = "evap/block"
contract = """
Given r4=a and r5=b, returns r0=min(65535, \
floor((uint16(a)-uint16(b))*112/32)) as a signed 32-bit result. Negative \
results are not lower-clamped."""
contract_level = "code"

