summary = """
Oxygen-sensor PID helper called by FUN 00035856. It answers negatively \
unless the PID mask in r4 matches sensor-present byte ROM8[0x8936]; \
otherwise it emits the value byte, doubled with saturation at 255 for every \
PID except 0x14, followed by the short-term trim byte min(255, \
floor(word/200)) or 0xff for the rear-sensor masks 0x02 and 0x20."""
note = [
    """
Stock ROM8[0x8936]=0 makes every call answer negatively, so the doubling \
rule for PIDs 0x15, 0x18, and 0x19 is inactive in JK08A.""",
]
