summary = """
Runtime Base Fuel Schedule and normalized-load producer executed as index 3 \
of the every-fourth-interrupt table at 0x21818. Its fallback selects map \
0x15630 by normalized coolant index. In the primary branch, let \
Q=uint32[ffff1e38], F=ROM8[0x8a27]=109, K=ROM16[0x9284]=26806, \
E=ROM8[0x88fb]=3, and N be the selected engine-speed count clamped to at \
least 64. The exact split multiply and quotient/remainder sequence forms \
fixed=min(floor(floor(F*K*Q/256)/(E*N)),0x726f9), then writes \
ffff1e40=floor(fixed*9163/65536). The common path forms ffff1062, unblended \
schedule ffff1dee, signed rate correction ffff1060, and selected schedule \
ffff1dec. With ffff2449 bit 7 clear, RPM curve 0x12c9e caps the corrected \
result before ffff1026 is written. With bit 7 set, direct 3x4 grid 0x974e \
supplies ffff1026 from RPM and ffff1075 buckets. Sites 0003bd1c..0003bd5a \
then write ffff1048=min(255,floor(uint16[ffff1026]*128/ROM16[00009534])); \
stock ROM16[00009534]=0x6a5a."""
note = [
    """
Calculate Base Fuel Schedule ffff1026 and normalized-BFS load byte \
ffff1048""",
    """
Whole-program p-code scans find no other runtime writer of ffff1026 or \
ffff1048. Exact DID 0x1208 identifies ffff1026 as Base Fuel Schedule, while \
the exact upstream DID and ADC trace establishes the MAF input. The ffff1048 \
formula proves a Q7 ratio to the 0x9534 Base Fuel Schedule reference; raw \
128 means equal numerator and denominator. The distinct A2L entries match \
0x8a27 as MAF Factor, 0x9284 as K-Value, and 0x9534 as the Cylinder Filling \
Up Efficiency Scaler vocabulary. The physical Cylinder Filling name and BFS \
engineering units remain source-derived pending hardware validation.""",
    """
The 7mfk normalization slice 0003bd1c..0003bd5a independently reconstructs \
and executes both unsigned division calls, their delay slots, the \
cached-quotient cap at 255, and the final byte store. R5 is the unsigned \
ffff1026 word loaded at 0003bcc0 and preserved through the intervening \
producer instructions. Coherent incoming cache and RAM plus a nonzero \
reference give min(255,floor(uint16[ffff1026]*128/ROM16[00009534])); \
explicit artificial mismatches reveal a cached cap followed by a low-byte \
second quotient and do not establish a live race. The zero-reference \
alternative executes the stock divider fault record and stores zero. The \
simulator continuation restores PR from SP+0 at 0003bd5c outside all tested \
instructions; this proof does not execute the complete producer or promote \
physical units.""",
    """
The independently reconstructed primary slice 0003b7c6..0003b8b8 and Q7 \
consumer 0003b8da..0003b908 execute both stock unsigned arithmetic helpers \
00021ce0 and 00021f40. Their 378 instructions retain the signed aggregate \
branch, low-40-bit split product, zero-denominator fixed cap, exact speed \
source choice, Q7 cached operand, and word publication. Seven declared RAM \
pool aliases follow byte identity. A boundary continuation ends at 0003b908 \
before post-Q7 rate processing; the stock full function and fallback \
selection are not executed by this slice. Helper-only divide/remainder zero \
contexts record 0x44e at ffff9818; the primary zero denominator avoids those \
helpers.""",
]
