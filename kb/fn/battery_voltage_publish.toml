title = "Convert the AN0 mux battery sample and publish DID 0x1103 raw voltage"
summary = """
Battery-voltage diagnostic publisher. It copies phase-2 AN0 mux sample \
ffff1d6e to ffff1fc4 at 00039ab0, stores uint8(sample >> 2) in ffff1fc6 at \
00039ab8, runs coefficient guard 00067188, scales the byte through Q1.15 \
scaler 000671d8 with shared coefficient ffff4970, saturates the result to \
255, and writes DID-0x1103 response byte ffff1188 at 00039ae2."""
note = [
    """
The exact service-0x22 table binds ffff1188 to DID 0x1103. With stock \
coefficient 0x8000 the byte equals the ten-bit sample shifted right by two, \
so one count is 20 mV at the converter input. One count is 0.08 V at the \
battery terminal, which the ROM limits of the DTC monitors fix against the \
factory test conditions on row ffff1108 and in JK08A.diagnostics.md; the \
terminal divider is therefore 4:1. A target diagnostic reading of 13.92 V \
lies inside the recorded range of 12.56..14.40 V.""",
]
level = "code"
role = "accessor"
block = "analog_inputs/block"

