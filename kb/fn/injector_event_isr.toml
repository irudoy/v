title = "Per-channel injector event handler and DFCO release-history update"
summary = """
ATU-II IMI1A compare-match handler, vector 96 at 00020184, for the delayed \
injection start programmed by FUN 0002b64a, and per-channel injector-event \
handler. It clears IMF1A in TSR1A and pending flag ffff84ec.bit7, copies \
pending mask ffff2228 to current one-hot event mask ffff1936, removes that \
bit from DFCO fallback history ffff1935, and, while active rotating count \
ffff1937 and aggregate mask ffff22e0 are nonzero, decrements the count and \
adds the current bit back to history before invoking masked one-shot \
scheduler 0002c13c. It refills scheduled-duration array ffff224e through FUN \
00054d3e before that call."""
note = [
    """
The path proves that the DFCO rotating-release tail advances on injector \
events. Physical channel-to-cylinder order remains unresolved.""",
]
level = "code"
role = "handler"
block = "injector_output/block"

