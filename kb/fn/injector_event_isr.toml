title = "Per-channel injector event handler and DFCO release-history update"
summary = """
ATU-II IMI1A compare-match handler, vector96 at00020184, for delayed \
injection start programmed by0002b64a. It clears IMF1A and pending flag \
ffff84ec.bit7, refills scheduled durations through actual helper00054d3e, \
and copies pending mask ffff2228 to current event mask ffff1936. It clears \
all bits of that mask from history ffff1935. When both rotating count \
ffff1937 and aggregate inhibit ffff22e0 are nonzero, it decrements the count \
and ORs the whole event mask into history. The actual one-shot call0002c13c \
can also OR the whole mask into history under its enabled \
aggregate-intersection condition. The complete bounded consumer domain \
admits all pending-mask bytes; upstream one-hot production, SPC/SSR \
exception behavior and physical timing retain independent evidence."""
note = [
    """
The path proves that the DFCO rotating-release tail advances on injector \
events. Physical channel-to-cylinder order remains unresolved.""",
]
level = "code"
role = "handler"
block = "injector_output/block"

