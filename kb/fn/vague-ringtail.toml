summary = """
Selects Knock Sensor Circuit Monitor Surface B 0xABFA or Surface A 0xABBA \
when byte[ffff3427] > byte[0x8796], with ROM threshold 0x5F=95; interpolates \
shared axes 0x12BE2/0x12BEA and writes the monitor coefficient to ffff338a."""
note = [
    """
The output enters chain ffff338a -> ffff3334 -> ffff4204.bit3 -> DTC \
P0327/P0328/P0332/P0333. The physical meaning of selector ffff3427 and the \
coefficient unit are unresolved.""",
]
