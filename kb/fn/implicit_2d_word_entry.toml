summary = """
Implicit-axis 2D entry with word inputs: r4 holds the table base, and r5 and \
r6 hold raw inputs that it zero-extends. It calls the shift kernel \
implicit_2d_word_shift_kernel/fn (jk78c 0x288E8) for each input, gives index \
7 a zero fraction, doubles both indices for uint16 cells, and tail-calls the \
2D finisher jk78c 0x28670 with row stride 8, which interpolates uint16 \
cells. Each axis has 8 points with step 8192. Its readers are \
request_rise_step_builder/fn and request_transition_conditioner/fn."""
home = "jk78c"
role = "wrapper"
block = "library/block"

[interp]
access = "implicit-2d"
kernel = "implicit_2d_word_shift_kernel/fn"
cols = 8
rows = 8
step = 8192
storage = "uint16"

