title = "Signed 32 by unsigned 16 fixed-point multiply with variable shift"
summary = """
Pure signed fixed-point multiplication helper. It multiplies the absolute \
32-bit first argument by the unsigned 16-bit second argument, shifts the \
48-bit product according to the signed byte third argument, and restores the \
first argument's sign."""
note = [
    """
The call-specific denominator follows from the helper's implicit 16-bit \
product alignment and two-bit left shift for r6=-2.""",
]
level = "code"
role = "service"
block = "library/block"
contract = """
For the fuel call (r4=v, r5=G, r6=-2), return \
trunc_toward_zero(int32(v)*uint16(G)/16384). The helper has no memory \
access; negative results are sign-restored after magnitude scaling."""
contract_level = "code"

