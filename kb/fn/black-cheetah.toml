summary = """
Explicit-axis 16x16 wrapper over the byte core; its sole caller is accessor \
00082c8a, making it a local wrapper. It is the only entry using finisher \
0x268A4, which saturates the sample when element bit 7 is set."""
note = [
    """
The shared interpolation functions are the primitives reachable through \
PTR_FUN slots, not this wrapper.""",
    """
On 1ME3B, 1me3b:0002a6b4 is no wrapper: it is an own unrolled kernel without \
calls that searches both uint8 axes and interpolates in its body, and its \
inline finisher returns the limit 0x0080, which the pool word at \
1me3b:0002a9a0 holds, when a corner element reaches it.""",
]
