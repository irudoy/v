note = """
1ME3B compiles this explicit 16x16 lookup of uint8 elements over uint8 axes \
with its own unrolled kernel at the library position of the shared entry, \
between bald-dachshund 1me3b:0002a388 and hypnotic-dugong 1me3b:0002a9a4, as \
7mfk:00026320 lies between 7mfk:000262e0 and 7mfk:00026358. Its finisher \
returns the limit 0x0080, which the pool word at 1me3b:0002a9a0 holds, when \
a corner element reaches it, as fabulous-silkworm/fn, the finisher that only \
this entry uses, does with 7mfk:00026940. Of the two 1ND entries at that \
position, only 1nd:00028764 has uint8 elements; masked-match finds no \
counterpart, since the unrolled body shares no instruction run with the \
wrapper."""

