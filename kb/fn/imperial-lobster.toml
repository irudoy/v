summary = """
Per-channel signed-difference producer used by the stock dispatcher. It \
scales either ffff1024 or ffff123e by ffff22e6, stores the current \
six-channel value, conditionally updates a held prior value, calculates \
current minus held, clamps the signed result to -32768..32767, and writes it \
to ffff142e+2*i. FUN 00052034 compares this result with ROM8[000087fe]<<7."""
note = [
    """
The physical quantity of the scaled current and held value is unresolved. \
This function establishes the producer for the signed difference consumed by \
FUN 00052034. Bit 5 of ffff245d is a source selector here and does not by \
itself identify an Over Run Fuel Cut gate.""",
]
level = "code"
role = "driver"
block = "fuel_quantity/block"

