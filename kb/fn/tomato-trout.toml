summary = """
Intake-CVTC state producer. At start event ffff4184 bit 6 it zeroes byte \
counter ffff19aa and writes ffff17f0 from 0x12A8A by oil temperature \
ffff2772 or, with ROM[00008616] bit 0 clear, from 0x12A92 by coolant index \
ffff106f; later calls count ffff19aa up while ffff84c3 bit 7 is set, and \
000bd3c8 checks unsigned ffff19aa > ffff17f0. It stores intake electrical \
enable ffff248b bit 1 at 000bd432: the counter check, a zero 00025e4e \
result, records 0x14b and 0x14c clear, battery ffff1108 in 126..200, \
ffff244f bit 5 set, and ffff3622 bits 0 and 1 clear. It stores intake \
operating bit ffff246b bit 6 at 000bd9d6 from the same register: CLSD THL \
POS copy ffff2458 bit 5 with ROM8[00008940] bit 1 clear, ffff248d bit 3, \
ffff41d1 bit 7, ffff41d0 bit 0, or ffff41be bit 6 clears it at 000bd462, and \
it also needs coolant ceiling ffff24a9 bit 6, engine-speed flag ffff24a8 bit \
4, and coolant floor ffff24a9 bit 0 (raw above 70) while latch ffff5b2c bit \
6 is set or ffff24a9 bit 3 (raw above 106) while it is clear. The function \
sets the latch at raw coolant ffff1071 of 125 and above and clears it below \
65. It writes ffff24a7 bit 1 on every call: it sets the bit at 000bd994, and \
the operating bit with it at 000bd988, only with the electrical enable, CLSD \
THL POS copy ffff2458 bit 5, vehicle-speed byte ffff110e at most \
ROM8[0000871d]=2, engine-speed flag ffff248f bit 2 (1500 RPM to set, 1400 \
RPM to hold), the raw coolant, oil, intake-air, and normalized BFS flags, \
the inhibit bits clear, and a set of stored-fault records clear, and clears \
it at 000bd9c0 or 000bd9c6 on every other path. Each pass through 000bd9c2 \
reloads re-arm countdown ffff2527 from ROM8[00008713]=100, and after the \
first activation the bit stays clear while ffff2527 is nonzero."""
note = [
    """
0x12A8A supplies flat raw threshold 30; 0x12A92 supplies flat raw threshold \
0. ffff19aa is cleared and incremented with saturation, then compared with \
the selected threshold. The routines that count ffff2527 and start countdown \
ffff2528 down are not identified, so the physical start and re-arm delays \
are not established; tools/logs/cvtc_intake_state_audit.py replays both bits \
against dashboard recordings with a fitted re-arm wait in snapshots \
(JK08A.cvtc.md).""",
]
level = "code"
role = "accessor"

