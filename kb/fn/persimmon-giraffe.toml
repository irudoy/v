P030 group-2 cleanup path. Under its local enable gates it sets bit 2 in the \
second byte of all seven P0306..P0300 runtime records. Only while \
ffff5b2c.bit3 is clear, it also clears bit 6 from every third byte, clears \
the group-2 retained payload and marker, and resets auxiliary byte \
ffff48c4."""
