title = "Select DFCO exit delay"
summary = """
DFCO exit-delay selector. It returns zero under master/runtime gates, \
including ffff2458.bit5 set with scheduled RPM-drop class ffff106a at least \
4; otherwise restore classes 1, 2, and 3 select calibrated bytes at \
00008c4b, 00008c41 or 00008c40, and 00008c4d or 00008c4c according to stock \
selector ROM8[0000870c].bit7."""
note = [
    """
All relevant stock delay bytes are zero, so normal state-4 exit delay is \
zero.""",
]
