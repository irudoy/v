summary = """
ReadDataByLocalIdentifier handler. The application request is 21 LID TXM \
NRS. It accepts only TXM 0x04 or 0x06. LIDs below 6 return four bytes \
through the predefined local-ID table. A dynamic LID must be above 0x80 and \
equal the volatile value ffff3ee2. The dynamic path emits 61 LID followed by \
bytes read in order from the pointer list at ffff9820 using count ffff9920. \
Addresses 0xfffe0000 through 0xfffe0fff use a special pending-response path; \
addresses above 0xfffe0fff and below 0xffff0000 are rejected with NRC 0x12; \
other entries are directly byte-dereferenced."""
note = [
    """
Each dynamic-list entry contributes exactly one response byte, and entries \
are dereferenced sequentially without an interrupt-masked snapshot boundary. \
Multi-byte values can therefore tear across producer updates. Only reviewed \
side-effect-free RAM addresses are eligible for hardware use.""",
]
