summary = """
Service 0x3b work-support write-by-local-identifier handler. The request is \
3b LID VALUE CONTROL: it stores LID ffff8005 in ffff4004, VALUE ffff8006 in \
ffff2b94, and CONTROL ffff8007 in ffff2b95. LID 0 answers 7b 00 with the \
four bytes C0 00 00 00 at 0x11e3d, which ROM32[0x22e30] holds, a \
most-significant-bit-first support bitmap of LIDs 1 and 2. LIDs 1..20 read \
ROM16[0x22e32+2*LID]: the high byte is the offset of the flag byte from \
ffff99f4, the low byte is apply mask m, the store mask is m<<1, and the \
value slot is ffff99db+LID; LIDs 21 and above answer NRC 0x12. Control 0x00 \
sets the apply bit, clears the store bit, and writes VALUE to the slot; \
control 0x55 sets the store bit, clears the apply bit, and writes VALUE for \
LIDs 1..3 only; control 0xff clears both bits and zeroes the slot; other \
controls answer NRC 0x12. Controls 0x00 and 0x55 require status copy \
ffff40cc = 0xff for LIDs 1..3 and ffff4112 = 0xff for LIDs 4..20, and a \
failed check answers with the status byte as the negative response code. The \
positive response is 7b LID."""
note = [
    """
The homologous P32M profile defines requests 3b 01 (DataWrite.ADVADJ - RAM) \
and 3b 02 (DataWrite.CRRCT IDL RPM - RAM, NSET4 at 12.5 rpm per count) with \
control values 0 = FLASH, 85 = UPDATE, and 255 = FINISH. In JK08A control \
0x55 produces the store edges of 000683cc, control 0x00 applies without \
storing, and control 0xff ends the adjustment. JK08A.work-support.md \
specifies the complete path.""",
]
level = "code"
role = "service"
block = "work_support/block"

