summary = """
Bounded main RPM fuel-cut state machine. Stock configuration00008b38=63 \
selects the two-pair path; ffff2468.bit4 selects unsigned activation/release \
words from0000934e. Inactive RPM at or above activation arms ffff2497.bit1 \
and loads stock delay00008c69 only when the arm is clear. An already armed \
invocation retains unsigned counterffff24f1; zero sets active bit2 and \
nonzero waits. Active RPM at release or above retains cut; below release \
clears arm and active. All other state bits, unrelated RAM, full natural \
CPU/frame state and bound ROM data preserve their declared values. This \
invocation does not decrement the counter. Physical RPM scale, scheduling, \
decrement production and global inhibition retain their existing independent \
evidence."""
note = [
    """
Apply calibrated activation and release thresholds to the main full fuel-cut \
state""",
    """
The returned state reaches the global 0x3f mask in 0004ed88 and therefore \
inhibits all six injection outputs through ffff22e0. Exact code proves the \
RPM x*12.5 scale; the public HR A2L catalog supplies the candidate \
Normal/Reverse column labels.""",
]
