summary = """
Engine-speed fuel-cut state machine. Stock ROM8[00008b38] bit 7 is clear, so \
ffff2468 bit 4 selects one activation/release pair from the 2x2 uint16 table \
at 0000934e. With state ffff2497 bit 2 clear, RPM/12.5 word ffff11bc at or \
above the activation threshold inclusively arms bit 1 and loads optional \
delay ffff24f1; stock delay zero sets bit 2 in the same invocation. With bit \
2 set, equality to the release threshold retains cut and only speed below it \
clears bits 1 and 2. The function returns bit 2 as a Boolean."""
note = [
    """
Apply calibrated activation and release thresholds to the main full fuel-cut \
state""",
    """
The returned state reaches the global 0x3f mask in 0004ed88 and therefore \
inhibits all six injection outputs through ffff22e0. Exact code proves the \
RPM x*12.5 scale; the public HR A2L catalog supplies the candidate \
Normal/Reverse column labels.""",
]
level = "code"
role = "accessor"

