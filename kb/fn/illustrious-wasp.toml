summary = """
The only 2D entry without a finisher: it reads the point directly (RTS + \
MOV.B @R4,R0 in the delay slot), while fractional parts of both axes are \
computed and discarded. Row stride is pool constant 0x260F8 = 4 rather than \
an immediate."""
note = [
    """
The journal had listed the existence of a non-interpolating family as an \
open question. Three converging observations identify the element as \
unsigned: both callers truncate the result to a byte, the rest of the 2D \
family is unsigned, and both maps contain monotonic data.""",
]
