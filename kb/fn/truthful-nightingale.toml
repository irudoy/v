summary = """
Pure arithmetic-shift helper used by fuel, misfire, and diagnostic \
calculations."""
note = [
    """
FUN 00056fc0 passes a signed product directly, so negative values retain \
floor-rounding before its explicit lower clamp.""",
]
level = "code"
role = "service"
block = "library/block"
contract = """
Arithmetic right shift by 7: r0 = (int32)r0 >> 7, equivalent to signed \
division by 128 rounded down toward negative infinity. The body is seven \
consecutive shar instructions followed by rts; the seventh shift occupies \
the return delay slot. It has no memory access and preserves PR and r1-r15. \
Side output is T = input bit 6."""
contract_level = "code"

