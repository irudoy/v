summary = """
Common engine-speed representation producer. From word ffff1196 it writes \
ffff11e8 = source>>3, ffff11ee = source>>4, ffff11f4 = source>>6, and \
current byte ffff11e6 = min(255, source>>8), then calls FUN 000384cc to \
produce current byte ffff11eb = min(255, source>>7)."""
note = [
    """
Scheduler 00020dfe exposes RPM/50 at ffff11ae, RPM/25 at ffff11b3, and \
RPM/3.125 at ffff11b6. The exact shift ratios establish RPM/12.5 at \
ffff11f4, which UDS DID 0x1201 returns.""",
]
