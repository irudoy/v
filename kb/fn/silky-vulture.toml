summary = """
Second signed-state channel using forward nonlinear table 00011d24. When \
ROM8[00008710].bit5 is clear, it forms bounded x0 and x1 from \
s8[ffff23f1]-s8[ffff2404], channel byte ffff11c1, and unsigned corrections \
ffff12df/ffff15ea, then calculates \
trunc0(s16[ffff18cc]*(256-F(x1))/(256-F(x0))). When bit5 is set, it \
calculates \
trunc0(s16[ffff18cc]*(256-F(clamp_u8(s8[ffff23f1]-s8[ffff11a2])))/256). The \
saturated signed result is written to ffff18ce."""
note = [
    """
F(z)=interp_u8(00011d24,axis 0001199e,z). Denominators are nonzero because \
the table maximum is 179, so 256-F(x)>=77. The exact channel arithmetic is \
established; the physical state and units are unresolved.""",
]
