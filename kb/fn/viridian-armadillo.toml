summary = """
P0128 state-weighted inverse-weight term accessor. It derives a nonnegative \
model-temperature-minus-IAT difference, combines it with ROM8[00008a30], \
obtains a parameter-ratio coordinate from uint16 H and upstream curve \
00014e42, applies inverse weight 255-min(lookup_u16(000151f2),255), selects \
coefficient K from a four-state runtime selector, and writes \
K*floor(H*floor(B*w/255)/2500) to ffff3228."""
note = [
    """
Exact inputs are H=uint16[ffff35b6], S=uint8[ffff178e], M=int32[ffff3348], \
I=uint8[ffff2733], and V=uint8[ffff110e]. The arithmetic is \
d=clamp(trunc0(M/20000)-50*I+2500,0,32767), \
B=min(floor(d*ROM8[00008a30]/2),65535), \
A=lookup_u16(00014e42,00013bb8,V<<8), \
q=max(0,65535-floor(20*A*ROM8[00008832]/H)) for H!=0 with an explicit \
zero-denominator endpoint, x=lookup_u16(000151f2,00013bf8,q), \
w=255-min(x,255), and K=10 for S=0 or ROM8[00008a35], ROM8[00008a36], and \
ROM8[00008a34] for S=1, 2, and >=3. Stock ROM8[00008a30] is zero, so B and \
ffff3228 are always zero. ROM8[00008832], all three state coefficients, both \
maps, and both axes are also zero. The physical heat-transfer interpretation \
and engineering scales remain unresolved.""",
]
level = "code"
role = "accessor"
block = "thermostat_coldstart/block"

