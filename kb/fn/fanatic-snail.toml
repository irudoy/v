summary = """
Composite accumulator: lookup 00012562 by uint8 ffff106f is successively \
multiplied by Q6 coefficients 00012572 and 00012582 with /64 normalization \
and by uint8 ffff10bf; a conditional branch can clear this first term. A \
separate 4x4 map 0000a49a supplies a multiplier for an additional term that \
also uses bytes ffff1600 and ffff1b14 plus ROM8[000087e8]. The saturated sum \
forms ffff230c, which participates in calculations of ffff231a and \
ffff18e2."""
note = [
    """
00012572 and 00012582 have code-level x/64 scaling; 00012562 remains a raw \
coefficient in the composite product. Coordinator 00057608 calls 00055098 \
before 00054ee0, so the latter reads the current selected 00012ede/bypass \
factor from ffff1b14. The physical quantity of the composite results is \
unresolved.""",
]
level = "code"
role = "accessor"
block = "fuel_quantity/block"

