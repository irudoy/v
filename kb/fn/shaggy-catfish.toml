summary = """
Batch lookup accessor for maps 0x12D22/0x12D32/0x12D42/0x12D52/0x12D62: for \
each interpolated uint8 x it computes \
min(65535,(uint16(ffff165e)*x*100)>>14) and writes ffff2414, ffff1926, \
ffff1928, ffff192a, and ffff192c respectively."""
note = [
    """
The physical quantity of shared base ffff165e and the five results is \
unresolved.""",
]
level = "code"
role = "accessor"

