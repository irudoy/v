title = "Encode feedback-reference magnitude and direction"
summary = """
Per-channel feedback-error encoder. With ffff41a5.bit2 enabled, it compares \
selected feedback ffff3888/ffff388a with sat_u16(ROM8[0x8cb6]*64+0x2000), \
writes absolute magnitude ffff36a0/ffff36a4, and writes direction \
ffff369c/ffff369d."""
note = [
    """
The reference-relative magnitude and direction are exact internal regulator \
inputs.""",
