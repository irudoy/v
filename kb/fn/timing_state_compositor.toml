[[symbol]]
layout = "jk78c"
address = "00067122"
level = "code"
former = ["timing_auxiliary_correction_builder/fn/jk78c-00067122"]
summary = """
Compose selected timing states into bounded signed bytes. The normal path \
includes the shared gated byte/surface/word product; the alternate path \
bypasses it. ROM8[8965].bit5 enables a second output and additional \
centered-curve and timed-cap branches."""
note = """
JK78C 67122 retains both branches of compositor 4bdc2. It writes \
min(255,floor(u16[ffff1900]*u8[ffff1343]*u8[ffff133f]/500000)) to ffff1341 \
and ffff12bc and adds it to the normal sums. ROM8[8965].bit5 adds ffff1832 \
beside ffff1830; curves 135f0/135f8 over 13c6a and timers ffff24ec/ffff24ee \
supply extra caps. ROM16[8d56]=0xffff requires ffff43d4 and ffff43d6 to \
equal 65535 with ffff4508.bit6 set. The sibling addend gate in 644d0 uses \
ROM16[8d54]=0xffff. The JK78C engineering timing conversion remains \
unresolved."""

