title = "Compose the selected timing state and publish the bounded byte"
summary = """
Timing-state compositor with an embedded 8x8 multiplier lookup at 0x0C50E. \
The normal branch forms ffff1830 from ffff23f1 + ffff23bd - ffff23c5 - \
ffff12dc - ffff15ea - 128 + ffff1a7d and optional ffff134a, with signed-byte \
saturation; the -128 centers the low-seven map field at 64 together with cam \
term ffff1a7d, whose neutral value is 64. The alternate branch forms \
ffff1830 from ffff1a7d + ffff23ee - ffff23c5 - 64, also with signed-byte \
saturation. The embedded lookup calculates \
ffff134a=min(255,floor(min(255,interp2d)*u16(ffff1900)*u8(ffff134c)/500000))."""
note = [
    """
The normal branch carries active cold/hot low-seven-bit map state through \
ffff23bd. The alternate branch carries ffff23ee. Both converge at ffff1830 \
in crank degrees: the coefficient-1 chain ffff2404 -> ffff2378 -> ffff12d6 \
-> ffff11da -> ffff11d4 ends at the J1979 PID 0x0E coordinate.""",
]
level = "code"
role = "accessor"
block = "ignition_timing/block"

