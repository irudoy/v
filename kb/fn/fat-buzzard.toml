summary = """
Rotational-reference interval history updater. When ffff84f2 bit 7 announces \
a sample, it clears that pending bit, sets ffff84f8 bit 7, and requires \
speed-qualification counter ffff4096 to reach stock ROM8[000083b8] = 1 plus \
prior-reference latch ffff84f1 bit 7. A valid sample shifts the 14-longword \
interval history rooted at ffff1dac and updates three saturating sample-age \
counters. Counter ffff3834 increments only while ffff4247 bit 6 is set; \
otherwise it resets. An invalid sample fills the history with the current \
interval and resets all three counters."""
note = [
    """
Detection core 00085a70 requires ffff3834 >= 19; revolution-window producer \
000872d0 requires >= 31. The counter unit is accepted intervals between \
consecutive tooth-9 ICR0A captures, one per 120 crank degrees and three per \
crankshaft revolution. After the shift, history longword k holds interval \
T[n-k+1] for k >= 1, with T[n] the newest. Static code does not establish \
the initialization source of ffff4247 bit 6.""",
]
level = "code"
role = "monitor"
block = "crank_cam/block"

