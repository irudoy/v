summary = """
Stored-record request coordinator. It requests record writes through key \
byte ffff2cd6, record word ffff2ce2, and writer flag ffff9a65.bit5; \
ffff9a65.bit4 clears bits 4 and 5 on entry, and each request runs only while \
bit 5 is clear and then sets it. Timing latch ffff41ab.bit7, set by the \
LID-1 store edge with accepted status (ffff41aa bits 2 and 4) or by timing \
request ffff41aa.bit0 with ffff4184.bit7 clear, copies ffff56b2 into \
ffff29c6, writes record 0x74 as (ffff56b2<<8)|ffff316a, and clears \
ffff41aa.bit0 and the latch. Idle latch ffff41ef.bit5, set by the LID-2 \
store edge ffff41ee.bit0 with accepted status or by idle request \
ffff41ef.bit6 with ffff4184.bit7 clear, copies ffff3168 into ffff316a, \
writes record 0x74 as (ffff29c6<<8)|ffff316a, and clears ffff41ef bits 6 and \
5. LID-3 store edge ffff41b3.bit6 writes record 0x7e as ffff56ba<<8. Later \
branches request record 0x73 with word ffff56f8, record 0x4e with word \
ffff4954, and record 0x70 with word 1 under their own state bits."""
note = [
    """
Record 0x74 holds the timing adjustment in its high byte and the idle \
adjustment in its low byte; 000686b8 restores both, and they re-enter \
0004aad0 within -5..0 crank degrees and 000420b8 up to 20 counts. The two \
latches wait while the writer is busy; the one-pass LID-3 edge is dropped \
when the writer is busy in that pass.""",
]
level = "code"
role = "service"
block = "work_support/block"

