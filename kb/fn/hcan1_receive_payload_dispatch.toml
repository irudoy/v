summary = """
Stock HCAN1 receive dispatcher. It matches software-table keys encoded as \
STDID shifted left by five and calls payload handlers, including key 0x2e80 \
for CAN 0x174 through FUN 000c47ea and key 0x2ee0 for CAN 0x177 through FUN \
000c4ace. Invalid-message dispatch separately reaches their fallback \
handlers."""
note = [
    """
Dispatch HCAN1 payload handlers by the STDID shifted-left-five internal \
key""",
    """
Stock mailbox records 0x9786 and 0x9782 independently encode standard IDs \
0x174 and 0x177 with the same shift.""",
]
