summary = """
Five-state control machine over longword ffff39d8. States 2, 3, and 4 set \
bit 5 in both ffff2451 and ffff244f; states 0 and 1 clear that bit. The \
transitions consume ffff4184.bit6, ffff4186.bit6, ffff42f5, and ffff432a. \
State 1 writes ffff84c8 = 0 and state 2 writes ffff84c8 = 1."""
note = [
    """
The state transitions and bit-5 projection are exact. The physical mode \
represented by states 0..4 remains unresolved.""",
]
