summary = """
Diagnostic group-summary updater. Its first group starts byte1 and byte2 \
accumulators at zero, ORs those bytes across runtime indices 0xba, 0x07, \
0xbb, 0x08, 0xbc, and 0x09, and writes the two accumulated status bytes to \
extension record 0x129 at ffff5a94 and ffff5a95."""
note = [
    """
Build extension runtime-record summaries including dual-bank MAF record \
0x129""",
    """
The six exact descriptors are P0101/P0102/P0103 for bank 1 and \
P010B/P010C/P010D for bank 2. The function builds additional diagnostic \
group summaries outside this annotation; byte 0 of extension record 0x129 is \
not consumed by the fuel path.""",
]
level = "code"
role = "service"

