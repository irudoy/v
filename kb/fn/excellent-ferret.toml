summary = """
P0196 stuck-low rationality monitor of the engine oil temperature, called \
from 00099e00 only while ROM8[0x18702] bit 2 is set, which stock JK08A \
leaves clear. While ffff244f bit 5 is set and coolant snapshot ffff1071 \
exceeds ROM8[0x8cd9]=100 it counts ffff84c3 bit 6 ticks in ffff3190 and sets \
ffff41f1 bit 7 from ROM16[0x936a]=300 ticks; countdown ffff449e, reloaded \
from ROM16[0x936e]=300 while ffff244f bit 5 is set, clears the counter and \
the flag when it expires. While ffff4184 bit 7 is set it tracks minimum \
ffff344c and maximum ffff344b of oil snapshot ffff2772. With ffff41c8 bit 7 \
set, zero results of fault predicates 000259e4 and 00025a12 for the checked \
indices, ffff41f1 bit 7 set, battery snapshot ffff1108 above 137, and \
ffff4206 bit 0 clear, an oil byte below ROM8[0x8962]=50 with maximum - \
minimum below ROM8[0x8963]=6 reports descriptor 0xe4 through 0007d8b8 once \
countdown ffff449c, reloaded from ROM16[0x936c]=10 otherwise, has reached \
zero, and sets ffff4206 bit 0."""
note = [
    """
Under deg C+50 and 0.08 V per battery count the constants read: coolant \
above 50 deg C for 300 ticks, battery above 10.96 V, oil below 0 deg C, and \
an oil span below 6 deg C. The factory confirmation procedure asks for \
battery voltage of more than 11 V and an idle period of 5 minutes and 10 \
seconds.""",
]
level = "code"
role = "monitor"
block = "sensor_monitors/block"

