summary = """
Path-A P0447 status producer inside the EVAP vent-control monitor. With \
ffff15d3 equal to 0x80 it increments timer ffff2d30 and computes the \
nonnegative high-byte difference between baseline ffff2e91 shifted by 8 and \
sample word ffff10c4. When the timer exceeds ROM8[0x8370]=0x50 it sets \
ffff247a bit 6."""
note = [
    """
FUN 000abca2 consumes bit 6 through FUN 000aacc0 and dispatches exact path-A \
descriptor index 0x31 for P0447. The coordinator skips this monitor in stock \
JK08A; the sample scale and physical terminal remain unresolved.""",
]
level = "code"
role = "monitor"
block = "evap/block"

