summary = """
Bounded engine-torque state builder. It adds signed centered map result \
ffff18ca to unsigned term ffff2408, applies a Q14 multiplier derived from \
ffff18e4 and ROM8[000087ee], applies Q8 complement 256-lookup(0001245a), \
saturates the result to int16, and writes ffff18cc."""
note = [
    """
Stock ROM8[000087ee]=0 makes the Q14 multiplier unity, and flat-zero map \
0001245a makes the Q8 multiplier unity. The stock result therefore \
simplifies to sat_s16(s16[ffff18ca]+u16[ffff2408]). FUN 000655b4 and FUN \
00065b08 consume ffff18cc in the two nonlinear output channels.""",
]
level = "code"
role = "accessor"
block = "torque_model/block"

