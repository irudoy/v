summary = """
Pending-task dispatcher called by periodic interrupt handler 0002040c. It \
drains bit-selected function tables. When ffff84b9 bit 5 is set, it invokes \
all seven entries at 00021818; FUN 0003a904 is index 2 and Base Fuel \
Schedule producer FUN 0003b75c is index 3. After the table, it copies 24 \
bytes ffff1dec..ffff1e03 to ffff1e04..ffff1e1b. When ffff84b9 bit 4 is set, \
it invokes all 69 entries at 00021834, including wrapper 00039a8c of \
battery-voltage producer 00039a9e at index 22, coolant coordinator 000394b8 \
at index 24, fuel-temperature publisher 00039788 at index 27, and \
oil-temperature producer 0003eb84 at index 28. After the table, block-copy \
helper 00022558 forms previous-pass images: ffff1072..ffff1079 to \
ffff107a..ffff1081 at 00020cba, the eight-byte current RPM-drop filter block \
ffff1e50..ffff1e57 to preceding-snapshot block ffff1e58..ffff1e5f, and the \
16-byte block ffff39a4..ffff39b3 to ffff39b4..ffff39c3 at 00020ce6. Word \
pairs ffff1086/ffff1088 and ffff2672/ffff2674 are copied to \
ffff108e/ffff1090 and ffff2676/ffff2678 before the pending bit is cleared. \
When ffff84ba bit 6 is set, it invokes all three entries at 00021960, \
including FUN 0007c494 at index 1."""
note = [
    """
Periodic handler 0002040c sets ffff84b9 bit 5 every fourth base interrupt \
and bits 4 and 2 every tenth, so the previous-pass images have the 10.24 ms \
cadence of scheduler 00020dfe. The engine-event phase separately produces \
ffff84ba bit 6 every third admitted current-cylinder event; dispatcher delay \
does not change either relative divisor under normal pending-flag service.""",
]
level = "code"
role = "dispatch"

