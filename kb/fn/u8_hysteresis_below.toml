summary = """
Unsigned byte below-threshold hysteresis comparator used by the \
vehicle-speed fuel-cut RPM gate."""
note = [
    """
Unsigned byte-domain below-threshold helper with state-dependent \
hysteresis""",
    """
FUN 0004f050 uses threshold 180 and hysteresis 20 in RPM/25 units, so its \
state sets below 4500 RPM and clears at or above 5000 RPM.""",
]
level = "code"
role = "service"
contract = """
Given uint8 value r4, threshold r5, hysteresis r6, and previous Boolean r7, \
returns uint8((r4 - (r7 ? r6 : 0)) < r5)."""
contract_level = "code"

