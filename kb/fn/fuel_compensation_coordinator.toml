summary = """
1ME3B coordinator with the three-state gate fffe8f80 and the bounded bypass \
gates of ROM bytes 0x8A82, 0x8A71 and 0x8647, addressed through GBR. On the \
lookup path it stores Fuel Compensation Main 0xA0F4 in channel fffe8ed6, \
fuel_compensation_alternate 0xA1F4 in fffe8ed7 and \
fuel_compensation_coefficient_curve 0x13CF6 in fffe8ed5. State codes \
fffeb822 and fffeb850 each select a channel: code 2 selects the alternate \
channel, code 8 the curve channel and every other code the main channel. The \
published byte fffe8ed4 is the crossfade of the fffeb822 channel, weighted \
by word fffeb820 with 0x8000 as 1.0, against the fffeb850 channel, or \
against the held byte fffe8ed8 while bit 0 of fffeba3a is set. Curves \
0x139AE and 0x13A3E supply the gated gain states. Physical conversions \
remain unresolved."""

