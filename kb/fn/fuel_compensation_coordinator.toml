summary = """
Fuel-compensation coordinator with the three-state gate ffff1fdc. The gate \
returns to state 0 whenever bit 6 of ffff4185 is set, bit 5 of ffff2451 is \
clear, or bit 4 of ffff4235 is clear. Otherwise state 0 enters state 1, \
looks up 1D-8 map 0x12AB2 by uint8 ffff1078 through 00026370, and writes the \
byte to ffff1f81 and ffff2554. State 1 advances to state 2 when ffff2554 \
reads zero, when bit 5 of ffff2459 is set, u16 ffff3a40 exceeds u16 ffff2672 \
by more than 13, and u8 ffff11ea reaches the nonzero u8 ffff22e4 plus signed \
ROM byte 0000822d, when bit 5 of ffff245b is set with bit 5 of ffff2459 \
clear, or when bit 7 of ROM byte 00008b3f and bit 2 of ffff2451 are both \
clear; state 2 holds. The coordinator retains the established 0x09CEA -> \
ffff1efc and 0x09E3A -> ffff115b paths, selects working word ffff115c, and \
on the active Fuel Compensation Main path looks up 0x0A29A through 000261f0 \
on axes 00011cf0/00011d4c before writing its uint8 result to ffff1160. \
Runtime gates can write a bounded bypass byte to the same destination."""
note = [
    """
Advance the three-state gate ffff1fdc and publish Fuel Compensation Main \
byte ffff1160 and selected multiplier ffff115c""",
    """
The stock 0xA29A representation is Q7 with raw 128 neutral. ffff115c is a \
separate selected word and must not be identified as the 0xA29A result. The \
physical purpose of the gate state and of bytes ffff1f81 and ffff2554 is \
unresolved, and no reader of ffff1f81 was found.""",
]
level = "code"
role = "accessor"
block = "fuel_quantity/block"

