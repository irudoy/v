summary = """
EVAP pressure-sensor range/performance monitor. It samples ffff10c4 into a \
21-sample sequence, produces word metric ffff2cac, and dispatches descriptor \
index 0xc3 for P0451 when the metric is greater than ROM16[0x92f8]=0x0c00. \
The complementary branch calls FUN 000b4ef8 with the same index."""
note = [
    """
The arithmetic and threshold are exact. The metric's physical units and the \
precise aggregation interpretation remain unresolved.""",
]
level = "code"
role = "monitor"
block = "evap/block"

