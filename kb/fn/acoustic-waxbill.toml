role = "service"
block = "library/block"
contract = """
Not arithmetic: block copier, even-parity entry into unrolled ladder \
0x22116. It copies r0 bytes from [r2] to [r1], with r0 divisible by 4 and an \
even count of 0..16 longwords; writes proceed in descending order. It \
returns no result and clobbers r0; r1 and r2 are preserved, with r3 \
preserved on the stack. The paired odd-parity entry is 00022104."""
contract_level = "code"

