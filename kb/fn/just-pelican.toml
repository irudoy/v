summary = """
ATU-II channel initialization. It zeroes TCNT1A (fffff440) at 000271be and \
TCNT4 (fffff4c0) at 000272a4 and writes TCR1A (fffff45d) = 5 at 000271ec, \
TCR1B (fffff45c) = 0 at 000271f0, and TCR4 (fffff4cc) = 5 at 000272c0 (mov \
#5 at 000271a6), so channels 1A and 4 count phi'/32 in lockstep once \
000274ac starts them together with TSTR1 = 0x73. It also clears one-shot \
down-counters DCNT8A..DCNT8P at fffff640..fffff65e and DSTR at fffff666 and \
writes TCR8 (fffff668) = 0x55 at 000273b4, so CKSELA and CKSELB both select \
phi'/32 for channel 8."""
note = [
    """
With PSCR1 = 1 (phi' = Pphi/2 = 10 MHz) one count is 3.2 us. The lockstep of \
the two counters makes the difference between a channel-4 cam capture and \
the channel-1 crank reference ffff158a a time. The same selection gives the \
six injector one-shots a 3.2 us step.""",
]
level = "code"
role = "init"
block = "startup/block"

