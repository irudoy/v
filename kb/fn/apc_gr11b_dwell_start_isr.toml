title = "Service the APC GR11B dwell-start match"
summary = """
GR11B compare-match handler at interrupt-table entry 000202ec, serviced \
while ffff8518.bit7 is set. With interrupts masked it saves the POPCR high \
byte, the pins that have just entered dwell, in ffff13ce and clears that \
byte. It recomputes the dwell mask ffff13d1 = ROM8[00022687 + ffff13d3], the \
one-hot successor of dwell channel ffff13d3; bit 1 of ffff4198 forces the \
mask to zero. While ffff84ea.bit7 is set and ffff13d2 is zero, a mask that \
is zero or not the successor of the previous one sets bits 7 and 6 of \
ffff8511, and a consistent advance moves bit 7 into bit 6. It arms the dwell \
timeout of the saved pins in the slot that ffff851a.bit7 selects. While \
ffff24c9.bit6 is set and bit 5 or 6 of ffff8518 is set, a fallback branch \
arms the next dwell itself: it writes GR11B for the dwell start and, while \
ffff84ea.bit7 and ffff4185.bit7 are set, ffff13d2 is zero and ffff8511.bit7 \
is clear, enables the POPCR high byte of the ffff13d1 pins; it then sets \
ffff8518.bit7 and clears bits 5 and 6."""
