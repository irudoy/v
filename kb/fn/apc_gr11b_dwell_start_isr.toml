[[symbol]]
layout = "jk78c"
address = "0002dde4"
level = "code"
former = ["keen-cuscus/fn/jk78c-0002dde4"]
summary = """
IMI11B acknowledges GR11B before testing the armed bit. With the compare \
armed, it saves and clears the high POPCR byte and retains the low byte. It \
updates the next-mask sequence guard and schedules two alternating GR5 \
dwell-timeout slots. In fallback mode it can rearm GR11B from the selected \
zero-count slot and restore the high POPCR action under the output-enable \
and sequence guards."""

