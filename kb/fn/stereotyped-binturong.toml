summary = """
EVAP pressure-sensor circuit monitor coordinator. It samples word ffff10c4, \
maintains captured byte and timer state including ffff2fd6, resets ffff247e \
bits 5 and 6 on initialization, and calls FUN 000ac934 to produce the \
P0452/P0453 result bits."""
note = [
    """
The exact monitor role is established by its status consumer and descriptor \
paths. FUN 000abca2 skips this coordinator in stock JK08A; the physical \
scale of ffff10c4 remains unresolved.""",
]
level = "code"
role = "monitor"

