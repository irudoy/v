summary = """
CAN torque-word packer reached from FUN 00079de4 through the trampoline at \
0007a050. It converts scheduler latches of the torque chain and of the \
signed request boundary to 12-bit CAN words clamp(trunc0(x/5)+800, 0, 4094): \
ffff3fa0 from ffff4106, ffff3f90 from ffff4108, ffff3f9c from \
ffff237c+ffff2384, ffff3f96 from ffff2380, and ffff3f98 from \
max(min(ffff23a8,ffff2382),ffff2374). It writes invalid code 4095 to \
ffff3f96 and ffff3f98 while ffff4221.bit2 is set, stores the complement of \
ffff40d2 in ffff3d6e, and derives the two-bit status codes ffff3e89, \
ffff3d3f, and ffff3d3e."""
note = [
    """
FUN 00079de4 is entry 58 of the 69-entry pending-task table at 00021834. \
Serializers 000c577a and 000c590e are the only readers of the packed \
words.""",
]
level = "code"
role = "driver"

