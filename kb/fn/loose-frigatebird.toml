summary = """
Per-bank reference-deviation path of P0014/P0024. With ffff24a7 bit 4 set, \
conditioned target ffff2327 at 0x80, the bank bit of ffff48df set, and duty \
word ffff1aac + 2b zero, it stores max(0, ffff11c8 + b minus the high byte \
of ffff5578 + 2b) in ffff16bd + b. Below ROM8[0000895e]=254 it reloads timer \
ffff2539 + b from ROM8[000088d2]=5 and clears bit b of ffff14b8; otherwise \
it sets that bit and, once the timer has expired, calls 0008c2d2 and \
0007d8b8 with record 0xd2 or 0xd3 and copies the record to extension slot \
0x3ed or 0x3f0 through 00022558."""
note = [
    """
Family entry 00090e5e calls it only under ROM8[000186f1] bits 3 and 2; stock \
JK08A holds 0xf0, so it never runs.""",
]
