title = "Publish a bounded signed mode-dependent state for the periodic snapshot"
summary = """
Work-support timing adjustment source (CONSULT TARGET IGN TIM ADJ). With \
ffff41b9.bit0 clear, ffff424c.bit4, the accepted service-0x3b LID 1 route, \
selects LID-1 slot ffff99dc; ffff424c.bit5, the automatic route, selects a \
piecewise step from ffff10da (0 below 0x20, 4-2*(ffff10da>>5) up to 0xbf, -8 \
above); and otherwise stored adjustment ffff29c6 when it lies within the \
bounds and zero when it does not; ffff41b9.bit0 set forces zero. Signed ROM \
bounds ROM8[0x821d]=-5 and ROM8[0x821c]=0 clamp the result before it is \
written to ffff56b2."""
note = [
    """
Scheduler 00020dfe copies the enclosing source block at ffff56b2 to snapshot \
ffff564c, which DID 0x112d publishes and 0004dbe8 adds to the timing sum \
with coefficient 1 in crank degrees while ffff5b31 bits 1..5 are clear. \
JK08A.work-support.md specifies the service, status, routing, and \
stored-record paths; the automatic route stays inactive in JK08A.""",
]
