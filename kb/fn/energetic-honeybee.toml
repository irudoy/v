summary = """
Base ignition-angle producer. It derives a divider-based angle from \
ffff17b8, ffff14dc, ffff1630, ROM8[0x884d]=128, ROM8[0x8b6c]=14, and \
RPM/12.5 word ffff11bc with factor 0x78 and a 5/2 scaling, and writes \
ffff23f1=r-14 when r<0x8e and 127 otherwise."""
note = [
    """
ffff23f1 is the base term of the normal compositor branch of 0004bdc2 in \
crank degrees. The physical meaning of the divider inputs remains \
unresolved.""",
]
level = "code"
role = "accessor"

