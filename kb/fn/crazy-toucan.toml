summary = """
Second raw-output calculation channel. Bit 1 of ffff249f selects endpoint \
pair 00018cf6/00018d16 or 00019090/000190b0 on shared axis 00018f76 and \
input ffff2698. Q15 weight 00016f48 is written to ffff35f4, and the endpoint \
crossfade writes ffff35ca. Q15 trim 00018d36 and common coefficient ffff31e2 \
are applied before bounds and ffff4214.bit6 override produce ffff35cc; \
floor(ffff35cc*727/800) is published as ffff1248."""
note = [
    """
ffff35f4 is the Q15 weight scratch, not the blend output. Stock pair \
00019090/000190b0 is byte-identical, and trim 00018d36 is flat unity. \
Monitor 0008d194 compares final ffff35cc with the parallel channel ffff2a7a. \
Physical quantity and engineering unit remain unresolved.""",
]
