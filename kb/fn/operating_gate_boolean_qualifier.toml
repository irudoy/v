title = "Combine window permission and blocking state"
summary = """
Combine the coolant-window helper's held permission with the inverse context \
blocker. Publish that combined state at ffff45b3.bit7 and return it as the \
gate of the conservative accumulator. Additionally require ffffa644 == 0 for \
the result at ffff45b2.bit1, which gates the fraction qualifier, weighted \
accumulator and capture accumulator. The coordinator copies capture latch \
ffffa62c to ffffa644 at the end of the preceding pass. The conservative \
accumulator therefore retains its separate gate after capture."""
note = [
    """
