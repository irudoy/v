title = "Reduce six transformed pulse words and derive scalar outputs"
summary = """
Complete 7mfk bounded injection start-delay publisher with natural quotient \
and remainder calls. Five unsigned-word input identities supply the two \
speed alternatives, six-word maximum, floor and end word. The selected-speed \
product retains uint32 wrap, the pulse fraction clamps at 255, and \
nonnegative delay optionally subtracts an unsigned ROM byte. Divisor 120 \
produces a remainder clamped to 4..116 and a quotient published through \
uint8 unless a raw control bit forces 3. All full-word input and \
control-byte domains are explicit consumer contexts. Upstream units, \
acquisition, scheduling and hardware reachability retain their separate \
evidence."""
note = [
    """
p = rpm * t * 1.49998 while crank rotation is rpm * t * 6 degrees, so one \
count of p is 4 crank degrees; divisor 120 is the engine-event spacing, and \
FUN 0002b64a splits the same angle by the 10-degree crank tooth. Scheduler \
copier 00020dfe snapshots ffff23f0 and ffff23bf to ffff2364 and ffff2333 for \
sequencer 00054a44. This function applies ffff241c as the same lower bound \
that FUN 00054d3e applies through snapshot ffff2390.""",
]
level = "code"
role = "accessor"
block = "injection_timing/block"

