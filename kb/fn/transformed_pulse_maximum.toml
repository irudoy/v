title = "Reduce six transformed pulse words and derive scalar outputs"
summary = """
Injection start-delay calculator. It takes the longest of the six \
transformed pulse words ffff23d4..ffff23de and floor ffff241c in 10 us \
counts and the engine-speed word in RPM/12.5, ffff11bc or ffff10ca while \
ffff4184.bit6 is set, and forms pulse angle p = min((((speed << 4) * 0xc49b \
>> 16) * pulse) >> 16, 255) in 4 crank degrees per count. With E = \
uint16[ffff192e] the start delay is 2*E - 4*p crank degrees, or zero when E \
< 2*p, less ROM8[000083ea] = 30 while ffff24c9.bit5 is set. It writes lead \
ffff23f0 = delay / 120, forced to 3 while ffff4251.bit0 is set, and start \
angle ffff23bf = clamp(delay % 120, 4, 116) / 4."""
note = [
    """
p = rpm * t * 1.49998 while crank rotation is rpm * t * 6 degrees, so one \
count of p is 4 crank degrees; divisor 120 is the engine-event spacing, and \
FUN 0002b64a splits the same angle by the 10-degree crank tooth. Scheduler \
copier 00020dfe snapshots ffff23f0 and ffff23bf to ffff2364 and ffff2333 for \
sequencer 00054a44. This function applies ffff241c as the same lower bound \
that FUN 00054d3e applies through snapshot ffff2390.""",
]
level = "code"
role = "accessor"
block = "injection_timing/block"

