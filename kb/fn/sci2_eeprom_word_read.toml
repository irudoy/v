summary = """
SCI2-backed two-byte read primitive. For each of byte addresses 2*key and \
2*key+1 it writes command 0x03, sends the address through TDR2, clocks one \
response byte with 0xff, and combines the two RDR2 bytes into a big-endian \
uint16 result."""
note = [
    """
The SH7058 hardware manual establishes the SCI2 register identities. The \
external peer and stored quantity are not identified by the transaction \
mechanics.""",
]
