summary = """
After-start enable timer of the two-bank closed-loop fuel calculation. Run \
flag ffff88c2 sets when START SIGNAL argument r4 falls from 1 to 0 and \
clears when engine-speed word argument r7 falls from above 2 to 2 or less; \
counter ffff34e2 counts calls with saturation while the flag is set and is \
zero otherwise. On the first call after RAM initialization it only sets \
ffff88ec bit 7; afterwards it writes, for each bank, ffff88c4[bank]=1 while \
the flags ffff88d0 and ffff88d8 of the previous call are set and the bank \
byte at r6 equals 1, and 0 otherwise; then ffff88d0=(ffff34e2 > \
100*lookup(00012312 over axis 00012f9e, start-coolant argument)), \
ffff88d8=(ffff88dc or ffff88e0), ffff88dc=(coolant argument r5 >= \
ROM8[00008cd4] while the start coolant is at least ROM8[00008730], \
ROM8[00008392] otherwise), and ffff88e0=(ffff34e2 >= \
floor(232*ROM8[00008475]/10) and r5 >= ROM8[00008d14]). It copies both bank \
flags to the output pair that the last argument addresses."""
note = [
    """
Two-bank closed-loop calculation 0005cbec calls it at 0005cef8 with \
r4=ffff8946, its copy of START SIGNAL bit 6 of ffff4184, r5=coolant byte \
ffff1071, r6 a bank byte pair of its state, r7=engine-speed word ffff11bc, \
start-coolant byte ffff106e, and output pair ffff895c/ffff8960, which it \
reads afterwards. In stock JK08A the time threshold is 3000 calls at \
start-coolant raw 50, 0 deg C, and below, 500 calls from raw 70 to 110, 20 \
to 60 deg C, and 400 calls from raw 120, 70 deg C; both coolant floors are \
raw 60, 10 deg C; and the long-time threshold is 2552 calls. The call period \
and the physical role of the bank flags are unresolved.""",
]
level = "code"
