title = "Accumulate gated reference and publish capture state"
summary = """
Select threshold curve 00016a44 or 00016884 from the raw flag supplied by \
ffff5c0e, look it up on axis 0001502c with raw ffff106c and multiply the \
word by 64. Store the threshold at ffffa630. When the incoming operating \
gate permits, scale the raw reference by ROM8[00008382]/2048, then by the \
previous feedback byte and 91/2213, cap the increment to uint16 and \
accumulate at ffff437c with cap 0x00a00000. Invoke \
operating_gate_capture_state, return three state bytes through stack-passed \
pointers and retain the accumulator at ffffa638."""
