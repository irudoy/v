title = "Cache service 0x30 IOLID 0x0c Power Balance mask and active state"
summary = """
Power Balance mask updater. When service-0x30 IOLID-0x0c active flag \
ffff99c5.bit3 is set it copies value byte ffff992f to ffff2b2c and sets \
ffff41fb.bit6; otherwise it clears that active bit."""
note = [
    """
A structured Nissan-family profile identifies IOLID 0x0c as Power Balance \
and maps bits 1..32 to cylinders 1..6. The VQ35HR factory ESM independently \
defines the test as cutting one injector signal at a time.""",
]
level = "code"
role = "service"

