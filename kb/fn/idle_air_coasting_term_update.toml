summary = """
Rate-limited coasting term ffff13ea of the idle-air target. It zeroes \
ffff13ea and clears ffff2473 bit 2 and ffff24a0 bit 0 unless closed-throttle \
bit 5 of ffff2458 is set, P/N bit 2 of ffff244f is clear, coarse \
vehicle-speed byte ffff110e is at least ROM8[000086fd], ffff4197 bit 6 is \
clear, crank and cam fault predicate 00025e4e returns zero, RPM-drop class \
ffff106a is below ROM8[00008763], and, while ROM8[0000870c] bit 7 is set, \
ffff2466 bit 7 is set. Otherwise it writes speed coordinate \
ffff1a7a=ffff110e, or clamp(ffff110e-ROM8[00008252], 0, 255) while \
ROM8[0000870c] bit 7 and ffff2458 bit 7 are set; sets ffff2473 bit 2 while \
engine-speed byte ffff11b2 > ffff22e4+ROM8[00008762], ffff1a7a >= \
ROM8[00008766], and ROM8[00008765] <= coolant byte ffff1071 <= \
ROM8[00008764]; and while that bit is set, with ffff11b2 > \
ffff22e4+ROM8[00008760], ffff2465 bit 6 clear, and ffff1a7a >= \
ROM8[00008761], raises ffff13ea by at most ROM8[000084d9] per call toward \
128*min(max(0, s16 ffff1230+ffff1748), lookup(00011ff6, min(255, \
4*ffff1a7a))). When those raise conditions fail it clears ffff2473 bit 2 and \
sets ffff24a0 bit 0, and while that bit is set ffff13ea falls by \
ROM8[000084d8] per call to zero, which clears the bit."""
note = [
    """
000475a2 calls it, and idle-air consumer 000474a4 subtracts ffff13ea>>7. In \
stock JK08A the speed floor is 13 counts, about 26 km/h; the term engages at \
15 counts, an engine-speed byte 62 counts above ffff22e4, and coolant raw \
125..145, 75..95 deg C; both steps are 255 per call; and ROM8[0000870c] bit \
7 is clear, so ffff1a7a equals ffff110e. Its call of record predicate \
00025e20 passes index -1, which returns zero. The physical quantity of the \
term is unresolved.""",
]
level = "code"
role = "accessor"
block = "idle_air/block"

