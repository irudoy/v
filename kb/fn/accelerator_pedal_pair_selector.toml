title = "Select and rate-limit the dual-channel pedal quantity"
summary = """
Dual-channel accelerator-pedal quantity producer. It clamps signed \
channel-adjusted values ffff27a0 and ffff27a4 to nonnegative values, selects \
their minimum subject to mode bits in ffff24c8, optionally rate-limits the \
result through state ffff1384, and writes current normalized quantity \
ffff2672."""
note = [
    """
The output is a normalized internal count, not either sensor voltage and not \
an engine-speed coordinate.""",
]
level = "code"
role = "driver"
block = "pedal/block"

