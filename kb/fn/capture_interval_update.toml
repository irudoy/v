summary = """
Engine-event capture and interval updater. It derives a wrap-corrected \
interval from timer captures, publishes the interval to ffff22d4 and \
ffff11fc, divides it by 12 through exact unsigned divider 00021ce0, and \
writes the quotient to ffff22bc and ffff22ba. Later event branches use the \
same normalized interval for APC compare scheduling. The reference capture \
is GR1E (fffff44c) when called from 0002a51e with r7 = 0 and GR1F (fffff44e) \
from 0002a5cc with r7 = -1; it stores the capture word in ffff158a at \
0002b7cc, forms the event timestamp from TCNT0 and the TCNT1A-to-capture \
difference, and divides the wrap-corrected difference to the previous event \
by 32."""
note = [
    """
Normalize the captured engine-event interval and publish its division by \
twelve""",
    """
The captures count phi'/32 = 3.2 us (TCR1A = 5 in 0002718a, PSCR1 = 1 in \
000274ac), and FUN 00038272 binds the interval to engine speed as ffff1196 = \
32000000 / ffff11fc, so the interval is 120 crank degrees and ffff22bc is 10 \
degrees.""",
]
level = "code"
role = "handler"

