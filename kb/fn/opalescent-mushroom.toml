Accessor for table-based state 00012afa. When bit 6 of ffff2462 is set, \
lookup by ffff106f is written to ffff254d and sets bit 7 of ffff246c. When \
bit 6 is clear, a stored zero byte clears bit 7 while a nonzero byte retains \
it."""
