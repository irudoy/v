[[symbol]]
layout = "7mfk"
address = "0002b64a"
name = "pumpkin-peacock"
note = [
    """
Bounded 7mfk entry 0002b660 applies A=uint8(R4) in the BT/S delay slot on \
both mode paths. With ffff24c9.bit6 clear it executes the real reciprocal \
splitter and phase normalizer through count word ffff13b8 and remainder byte \
ffff193b. With bit6 set it stores count 0 and remainder A below 120, or \
count 1 and remainder A-120 otherwise. Direct 0002b676 contexts cover the \
signed clamp unreachable after byte truncation. Direct normalizer contexts \
cover full unsigned count words and raw remainder/position bytes, including \
signed byte scratch registers. Prologue, source-argument dispatch, count \
decision, compare programming, live tooth validity and hardware remain \
separate evidence.""",
    """
Bounded 7mfk entry 0002b6d4 reads unsigned period word ffff22bc and unsigned \
remainder byte ffff193b, computes M=P*R, and executes the real helper \
00028e7c with word output ffff16c2 and byte output ffff166c. The outputs are \
Q=floor(uint32(6554*M)/65536) and uint8(M-10*Q). MACL contains M after the \
helper restores it. P=8192,R=4 gives Q=3277 rather than floor(M/10)=3276; \
P=25000,R=8 gives Q=20001 and residue byte 246. Product wrap seams make the \
full consumer-domain sign none. The preceding zero-count decision, physical \
timer scale, compare programming and hardware remain separate evidence.""",
    """
Direct 7mfk entry 0002b6ce tests the stored unsigned count word ffff13b8. \
The MOV.W sign-extends its scratch R0; TST selects zero independently of \
that sign. Count zero executes the complete offset multiplication and real \
reciprocal splitter until 0002b6f8 before MMIO. Nonzero count executes the \
real epilogue 0002b74a..0002b754, restores the explicitly staged GBR, MACL, \
PR, R14 and R13, including the RTS delay slot, and returns with SP increased \
by 20. Nonzero count preserves all RAM. The observer records actual PR/SP \
before its own compensation and checks all fifteen GPRs, complete SR, 92 \
immutable entry bytes, 96 neighboring frame bytes, the outer ABI, all 64k \
RAM and bound pools. The original prologue, validity of the staged frame as \
its product, earlier count and argument producers, complete call composition \
and MMIO/hardware retain separate evidence.""",
]

