summary = """
Delayed injection-start programmer. It sets pending flag ffff84ec.bit7 and \
converts the unsigned low byte of its angle argument into a tooth count and \
a compare. While P0335 fallback snapshot ffff24c9.bit6 is clear it splits \
the angle by ten through 00028e7c into count ffff13b8 and remainder \
ffff193b, moves one tooth into the remainder when the count is nonzero, and \
normalizes both through 00028dc8; in fallback an angle of 120 or more \
becomes count 1 with remainder angle - 120. When the count is zero it forms \
M=uint16(ffff22bc)*uint8(ffff193b), computes Q=floor(uint32(6554*M)/65536) \
through 00028e7c, stores the word Q at ffff16c2 and the byte uint8(M-10*Q) \
at ffff166c, writes GR1A fffff444 = crank reference capture ffff158a + \
offset, or TCNT1A + 2 when that instant has passed, clears TSR1A bit 0 at \
fffff45e, and sets TIER1A bit 0 at fffff462."""
note = [
    """
ffff22bc is the time of one 10-degree crank tooth, so the offset is the \
remainder angle in ATU-II channel-1 counts of 3.2 us. Callers are sequencer \
00054a44 and engine-event driver 00028ea2.""",
]
level = "code"
role = "driver"
block = "injector_output/block"

