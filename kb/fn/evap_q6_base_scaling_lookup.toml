summary = """
Multiplier * base pair in one component: base table 0x14a7a, u16 through \
wrapper 0x264cc, supplies the multiplicand; multiplier map 0x12bda through \
wrapper 0x26474 multiplies it and divides by 64. The instruction stream \
contains product and >>6: mul.l at 0xb1ecc, followed by shlr2 x3 at \
0xb1ed4/d6/d8. Pivot 64 and the shift establish x/64 scaling in code."""
note = [
    """
Flat value 64 gives output = base, or multiplier 1.0. Base 0x14a7a has no \
established scale; bypass default 100 suggests percent but remains \
candidate. ffff41e5 selects the bypass constant versus interpolation.""",
]
