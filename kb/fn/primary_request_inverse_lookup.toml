title = "Convert the shared signed request into inverse lookup coordinates"
summary = """
Primary RPM-row interpolation and inverse-coordinate lookup. It selects or \
interpolates one 16-point offset-binary output row of 0000e98e over byte \
axis 00011d0c, then searches that row with centered signed request ffff19c6 \
or ffff243c plus 0x8000 and returns values from 00014114. Results are \
written to ffff1984 and ffff198a."""
note = [
    """
The operational transform is exact. Physical QH0/torque identity and \
engineering scales remain catalog candidates. At site 000735ac the resolver \
snapshot retains r5=0x8000 before delay-slot instruction 000735ae replaces \
r5 with the local row pointer. Value 0x8000 is only the offset-binary bias \
and is never dereferenced as an axis.""",
]
level = "code"
role = "accessor"
block = "throttle_target/block"

