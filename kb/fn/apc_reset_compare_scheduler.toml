title = "Convert the offset timing command into an APC GR11B compare event"
summary = """
Secondary APC compare scheduler. On the normal ffff24c9.bit6-clear path it \
splits the full primary-plus-offset command through 00028e7c, carries \
complete decades, calculates \
ffff16c2=min(65535,floor(ffff22bc*remainder/10)), and writes GR11B fffff5c4 \
as ffff158a+ffff16c2 or the TCNT11+2 fallback."""
note = [
    """
The bit6-set position-diagnostic fallback uses a separate threshold-120 \
path. The SH7058 manual proves the GR11B output-low action. Builder 0004e080 \
places this edge 120 - ffff237a degrees after the primary command, which is \
ffff237a degrees before the set edge of the next cylinder, and dwell mask \
ffff13d1 addresses that next cylinder, so the low state is the dwell; the \
external driver stage remains a hardware boundary.""",
]
level = "code"
role = "driver"
block = "ignition_output/block"

