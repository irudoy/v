summary = """
Reciprocal-pair component where each table is the other's axis: \
{00018e86,00018fd6} for the low range and {00018e46,00018f96} for the high \
range with input >>4. Branching selects the pair. FUN 00073824 looks up the \
same pairs with table and axis exchanged, from ffff1d10 to ffff1ce4. \
Downstream consumers use trustful QH0/torque surface 000175c8 and subtract \
0x8000 from its output."""
note = [
    """
Code establishes the reciprocal wide-range conversion and signed centering \
of the surface output. The QH0/torque identity of 000175c8 follows from its \
exact primary/trustful table family and remains candidate. The physical \
quantity and unit of the preceding piecewise pairs remain unresolved.""",
]
