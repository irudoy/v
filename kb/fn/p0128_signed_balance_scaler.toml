summary = """
Signed P0128 balance scaler. It clamps input d to -107350..107350, sets \
K=min(uint8[00008542]*uint8[00008543],10735), and writes \
clamp(trunc0(20000*d/K),-200000,200000) to ffff3400. K=0 selects the \
corresponding signed saturation endpoint without division."""
note = [
    """
Stock K is 20*8=160, so the unsaturated stock gain is 125. The input arrives \
in r4 from ffff33fc; the function has no direct RAM read of that staging \
word.""",
]
level = "code"
role = "service"
block = "thermostat_coldstart/block"

