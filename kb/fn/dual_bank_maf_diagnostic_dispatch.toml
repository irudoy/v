summary = """
Boolean-to-record dispatcher for the six exact dual-bank MAF circuit \
diagnostics. Nonzero inputs call diagnostic reporter 0007d8b8 with fixed \
record indices."""
note = [
    """
Dispatch six exact MAF diagnostic runtime records from Boolean monitor \
results""",
    """
Argument 3 is wired to the minus-one sentinel by FUN 00080e20 and therefore \
cannot report a descriptor on this exact path.""",
]
level = "code"
role = "service"
block = "maf_monitors/block"
contract = """
Arguments 1..7 dispatch records 0xbc, 0xbb, -1, 0xba, 0x09, 0x08, and 0x07 \
respectively when nonzero. The exact non-sentinel descriptors encode P0103, \
P0102, P0101, P010D, P010C, and P010B."""
contract_level = "code"

