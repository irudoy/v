summary = """
Throttle-release detector and six-table calculation accessor; holds a \
pointer to 00026370 in slot 0005197c. Map 000121ae forms shared multiplier \
g=max(0,8192+(lookup-64)*uint8[ffff10bf]). Maps 0001220e and 000121d6 form \
ffff1534 and ffff1535. Map 000121fe is independently multiplied by g, \
normalized by 8192, saturated to 255, and written to ffff1531. Maps 000121c6 \
and conditionally updated 000121de combine with ffff1531 in a product \
normalized by 16384 for ffff1532. The detector is signed16[ffff10b8] < \
-ROM8[000086ae] and writes bit 0x10 of ffff24d2."""
note = [
    """
ROM8[000086ae]=0 makes detection true for any negative input slope. No \
direct consumer tests bit 4 of ffff24d2. The physical quantities of the \
composite outputs remain unresolved; code rules out treating 000121fe as an \
RPM threshold.""",
]
level = "code"
role = "accessor"
block = "fuel_quantity/block"

