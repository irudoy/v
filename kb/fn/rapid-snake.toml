Derived readiness-source producer. It writes ffff283a = max(ffff283c - \
offset, 0). Offset is ROM8[00008b5b] = 0 when ffff1076 < ROM8[00008cef] = 90 \
and abs(ffff454c - ffff1076) < ROM8[00008cce] = 12; otherwise offset is \
ROM8[00008b5c] = 15."""
note = [
    """
The arithmetic and branch thresholds are exact. The physical quantities \
represented by ffff283c and ffff454c remain unresolved.""",
]
