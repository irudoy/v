title = "Translate regulator direction into complementary-pair masks"
summary = """
Per-channel throttle-direction publisher. It translates regulator direction \
ffff369a/ffff369b values -0x10 and 0x0f into channel bits in ffff36dc and \
ffff385e, with controller-disabled fallback gating."""
note = [
    """
The two masks select which member of each complementary ATU-II PWM pair \
receives duty. Opening polarity remains unverified.""",
]
