summary = """
Bank-indexed MAF input preprocessor on 7mfk. Bank argument indices 0 and 1 \
select diagnostic word ffff101c/ffff101e and initialization masks 1 and 2 at \
byte ffff3976, corresponding to bit0 and bit1. A clear selected mask copies \
the word to ffff1e48/ffff1e4a and sets only that mask. An initialized bank \
subtracts floor(floor(uint32(K)*335/65536)/min(65535,uint16(previous \
output)+80)) and stores the low word through unsigned divider 00021ce0. K is \
ffff3998/ffff399c; ROM16[0x9586]=335 and ROM16[0x958c]=80. The publisher \
preserves MACL, GBR, R12, R13, and R14."""
note = [
    """
Caller 0003a904 invokes exactly indices 0 and 1. Init 0002d120 seeds both K \
words with ROM16[0x95b6]<<16 = 0x00180000, which gives c = \
floor(8040/(previous output+80)): 32 counts, 0.16 V, at a steady 1 V input. \
FUN 0003aa12 rewrites K. The MAF and bank identities are exact; the physical \
meaning of the correction remains unresolved.""",
    """
The previous output is read before the selected word is replaced. Underflow \
and a correction above 65535 retain modulo-65536 storage, without a zero \
clamp. Stock bias 80 makes the zero-denominator branch unreachable for a \
previous word; an explicit direct-entry fixture with the full saved return \
frame executes its uint16(raw+1) alternative without changing instructions. \
Software cases establish no physical meaning or live reachability of the \
correction states.""",
]
