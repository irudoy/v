summary = """
Bank-indexed MAF input preprocessor. For indices 0 and 1 it reads diagnostic \
word ffff101c/ffff101e. The first call per index copies the word to table \
input ffff1e48/ffff1e4a and sets bit index+1 of ffff3976; later calls write \
uint16(word-c) with c=floor(floor(K*ROM16[0x9586]/65536)/min(65535, previous \
output+ROM16[0x958c])) through unsigned divider 00021ce0, where K is uint32 \
ffff3998/ffff399c. Caller 0003a904 consumes the outputs."""
note = [
    """
Caller 0003a904 invokes exactly indices 0 and 1. Init 0002d120 seeds both K \
words with ROM16[0x95b6]<<16 = 0x00180000, which gives c = \
floor(8040/(previous output+80)): 32 counts, 0.16 V, at a steady 1 V input. \
FUN 0003aa12 rewrites K. The MAF and bank identities are exact; the physical \
meaning of the correction remains unresolved.""",
]
level = "code"
role = "service"
block = "airflow_load/block"

