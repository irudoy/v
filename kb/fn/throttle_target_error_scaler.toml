title = "Mask and scale the target-reference term"
summary = """
Per-channel target-error scaling stage. It masks the lower four or six \
magnitude bits according to feedback and status, multiplies the remaining \
target-reference magnitude by ROM16 literal 0x070a, writes fixed-point \
magnitude ffff391c/ffff3920, and copies direction to ffff392b/ffff392c."""
note = [
    "This is the scaled target term consumed by the fixed-point regulator.",
]
level = "code"
role = "driver"
block = "throttle_servo/block"

