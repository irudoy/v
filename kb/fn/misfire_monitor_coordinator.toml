summary = """
Misfire-monitor coordinator for calibration surfaces, classifiers, common \
readiness, event counters, retained operating-point snapshots, \
revolution-window completion, and DTC result handling. It is the sole writer \
of P030 readiness bits ffff4251.bits6/7. The successful path requires \
ffff4096 >= stock ROM8[000083b8] = 1, ffff436f == 0, ffff41c8.bit7 set, no \
active result bits in the records checked by FUN 00025a12 and six direct FUN \
000259e4 calls, ffff1108 >= 0x89, and 6 <= ffff11ae < 0x98, which is 300 <= \
RPM < 7600. Success sets bit 6 and stock ROM8[00008afc].bit3 sets bit 7; any \
failure clears both bits and resets P030 working state. Maps \
0001265a..0001268a form the five-state ladder consumed by detection core \
00085a70. Completion flags from 000872d0 are serviced independently in the \
order ffff4241 bit 5, bit 7, then bit 6."""
note = [
    """
The P030 identity, gate topology, RPM interval, DTC mapping, speed and \
revolution cadence, snapshot payload, snapshot-match arithmetic, and \
operational result-latch use are code-proven. Stock JK03A contains the same \
gate constants and byte-identical executable code. The physical identities \
of ffff1108, ffff41c8.bit7, ffff2b73, and the record groups checked by the \
gate remain unresolved. A whole-program p-code census found no other bit-6/7 \
writer for ffff4251.""",
]
level = "code"
role = "monitor"
block = "misfire/block"
contract = """
The common readiness path sets ffff4251.bit7 in stock JK08A exactly when all \
listed prerequisites pass. FUN 00025a12 must return 0. Direct FUN 000259e4 \
calls for indices 0x129, 0x12a, 0, 0x130, 0x14, and -1 must all return 0; \
index -1 is inert. If ROM8[00008afc].bit3 were clear, the alternate branch \
would set bit 7 when ffff4184.bit6 is clear and clear it when that selector \
bit is set."""
contract_level = "code"

