summary = """
Throttle-position sensor 2 range monitor for both channels. It reads \
ffff275e and ffff2760, accepts ROM16[0x9550]=60..ROM16[0x954e]=964 counts \
inclusive, and dispatches exact JK08A descriptor indices 0xe8 and 0xe9 for \
P0123 and P0122 and 0x113 and 0x114 for P0228 and P0227."""
note = [
    """
The exact ROM descriptor catalog identifies the four indices as throttle \
position sensor 2 circuit high and low input for banks 1 and 2. Both \
sensor-2 words are published on the sensor-1 scale, so they share the limits \
of 000a7418.""",
]
level = "code"
role = "monitor"

