summary = """
Dual-channel calculation with two x/100 coefficient pairs and a \
selector-controlled offset-binary curve. param_1 selects 0x123F2/0x123FA and \
0x1252A/0x12532. Bit mask param_1+1 against ffff14c8 selects 0x15AD0 when \
set or 0x15B10 when clear; both are indexed by uint8[ffff11ae] over axis \
0x149CA and written to ffff1a98+2*param_1."""
note = [
    """
The four byte coefficients use dimensionless x/100 scaling. The selected \
uint16 curve uses offset-binary x-32768 representation; FUN 000c1dec \
combines it with ffff1a86 as u16(A)+u16(B)-65536. Maps 00015ad0 and 00015b10 \
are byte-identical in stock JK08A. The physical domain is unresolved.""",
]
level = "code"
role = "accessor"

