summary = """
Diagnostic-state reset. It calls 0002e76e, which clears the service-0x30 \
state, zeroes service-0x3b flag bytes ffff99f4..ffff99f9, value slots \
ffff99dc..ffff99f3, and ffff99d8..ffff99d9, clears bits 6 and 7 of ffff9a6b, \
zeroes ffff8422, ffff8423, ffff8462, and ffff8463, clears ffff4198.bit4, \
calls 000cd75c with ffff40be, zeroes ffff40be, clears ffff41de.bit0 and bits \
5 and 6 of ffff41a4, and zeroes ffff2985."""
note = [
    """
Transport state machine 0002ea0a calls it at 0002ec2a when transport state \
ffff821c is 8 and ffff8468 is neither 3 nor 4, and 000ca69c also calls it. \
Together with control 0xff, the reset ends an active work-support \
adjustment.""",
]
level = "code"
role = "service"
block = "work_support/block"

