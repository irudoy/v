title = "Update qualification counter for the critical diagnostic RPM inhibit"
summary = """
Critical-diagnostic qualification counter updater. A clear ffff41ea.bit5 \
resets ffff4b0e. While that aggregate bit is set, ffff422e.bit7 plus \
ffff422f.bits4/5 permit saturating increment; loss of any of those three \
latches holds the prior count rather than resetting it."""
note = ["The consumer requires the count to exceed stock threshold four."]
