title = "Select and publish the signed limiter or controller result"
summary = """
Final selector in periodic-table index-20 scheduler 000702a0. When ffff2490 \
bit 1 is clear it selects limiter aggregate ffff243a. When the bit is set it \
selects controller result ffff19c0 and, while ffff25d6 is zero, takes the \
signed minimum with ffff243a. It writes the selected value to both ffff2438 \
and ffff19c2."""
note = [
    """
The duplicated result provides the exact bridge from the 0x942c limiter \
aggregate to periodic-table index-21 boundary FUN 00079030.""",
]
level = "code"
role = "driver"
block = "torque_request/block"

