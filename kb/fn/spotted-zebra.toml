summary = """
Multimode accessor for maps 0x0B5FA and 0x11FE6. Interpolated uint8 M from \
the selected map is multiplied by uint8 ffff3373; the product is written to \
ffff13dc and used as a zero-saturating decrement step for uint16 ffff1866."""
note = [
    """
The physical purpose of state ffff1866 is unresolved. Map 0x11FE6 contains \
only zeros in the current ROM.""",
]
