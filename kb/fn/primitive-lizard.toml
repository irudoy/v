summary = """
Engine Torque Map accessor. It copies the 16-word column axis at ROM \
0002378c to a stack buffer, calculates \
q=min(65535,floor(u16[ffff1024]*40960/ROM16[00009534])), performs a 16x16 \
uint16 lookup of 00010b8e by ffff11b6 and q, and writes signed lookup-32768 \
to ffff18ca."""
note = [
    """
The accessor census records the second axis as ROM 0002378c with operand \
kind copy because r6 points to its byte-identical runtime stack copy. With \
the catalog Cylinder Filling scale x*160/65536, the exact q formula becomes \
100*BFS/scaler. The VQ35HR JK00D homolog FUN 00067be8 has the same 126-byte \
structure and uses corresponding map 00012922, row axis 00016f3c, column \
axis 00023884, and scaler 000095f6.""",
]
level = "code"
role = "accessor"

