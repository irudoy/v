summary = """
Periodic-table index-27 six-channel fuel-output inhibit coordinator. It \
converts the OR of exactly 15 global Boolean contributors to G=00 or 3f \
through 0004fb5e; calls 0004f758 and 0004f7e0 only for side effects; forms \
P=G|DFCO_mask_000503e0|count_mask_0005079c; applies service-0x30 Power \
Balance replacement through 00050a06/00050a34; ORs the P2119/P1238 ETC \
auxiliary mask 0005096c after replacement; limits the result to six bits \
through 00050a4c; and writes ffff22e0."""
note = [
    """
Aggregate exactly 15 global Boolean conditions with DFCO count Power Balance \
and ETC masks""",
    """
A full global mask absorbs partial DFCO/count masks before Power Balance. \
Power Balance can substitute those bits, while the ETC auxiliary mask is \
applied afterward and cannot be cleared by that replacement. The 0000942c \
request limiter is outside this formula.""",
]
