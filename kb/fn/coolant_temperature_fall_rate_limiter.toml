summary = """
Engine-coolant fall-rate limiter. It compares transfer code ffff1187 with \
ffff1081, the previous-pass image of published byte ffff1079: it returns a \
higher code at once, holds the previous byte while code + 2 exceeds it, and \
otherwise returns code + 2."""
note = [
    """
Fuel-temperature limiter 00039874 has the same structure. On a falling \
temperature the published byte stays between the converted sample and the \
sample plus two counts.""",
]
level = "code"
role = "accessor"
block = "temperatures/block"

