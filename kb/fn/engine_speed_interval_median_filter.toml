summary = """
Interval-derived engine-speed byte producer. It shifts sample history \
ffff3e34 -> ffff3e35 -> ffff3e36, divides 41666 by interval quotient \
ffff22bc through signed divider 00021bbc, saturates the quotient to 255 into \
ffff3e34, and writes the median of the three samples to ffff2804. When \
diagnostic-mode snapshot ffff24c9 bit 5 is set it writes saturated \
engine-speed byte ffff11ea to ffff2804 instead."""
note = ["The diagnostic substitute equates the representation with rpm/12.5."]
level = "code"
role = "monitor"
block = "engine_speed/block"

