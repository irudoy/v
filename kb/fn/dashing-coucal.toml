summary = """
Misfire detection core: builds thresholds ffff3100..3105 and ffff306e..3070 \
from ffff314a/ffff314b through 000224f8, compares them in windows against \
offset-binary metrics ffff3820/ffff3816 with 0x80 as zero, and fills \
per-cylinder event registers. It also consumes five-state selector ffff2b4b, \
adds ROM8[0x11A28 + state] to accumulators ffff36e8/ffff36ec, and requires \
ffff4251.bit7 plus ffff41d2.bits0/1 for those accumulators and three counter \
groups. It is the sole caller of five-channel accumulation helper 000867c4. \
Helper 00086b0c forms the metrics from the interval history of 0003cf24: \
ffff3816 from 6*T[n-7] - 5*T[n-8] - T[n-2], ffff381c from 3*(2*T[n-6] - \
T[n-9] - T[n-3]), and ffff3822 from 3*(2*T[n-6] - T[n-12] - T[n]). A \
detected event increments counter element 2*ffff4038 of the arrays at \
ffff3806, ffff37f8, and ffff37dc next to total element 0."""
note = [
    """
It is the only external consumer of ffff314a/ffff314b and ffff2b4b. Its six \
per-cylinder counters feed coordinator 00082c8a, whose sole local reporter \
00084cd0 dispatches exact P0300..P0306 descriptors. The physical role of the \
five-channel helper output remains unresolved. The tested interval T[n-7] is \
congruent to T[n-1] modulo six events. Interval T[n] is captured on tooth 9 \
of event index c and spans 50..170 degrees after compression TDC of index c \
- 2, so T[n-1] spans the expansion stroke of index c - 3, which is cylinder \
number ROM8[0002265c + c]. The attribution is correct only when event index \
ffff11de equals the cylinder number of the P0301..P0306 descriptors.""",
]
level = "code"
role = "monitor"
block = "misfire/block"
contract = """
The main weighted-accumulator path retains and updates state only while \
ffff4251.bit7 and both low readiness bits of ffff41d2 are set. A failed gate \
clears the accumulators. The same common bit-7 state reaches the local \
helper through its only call from this function."""
contract_level = "code"

