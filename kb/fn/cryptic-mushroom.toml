summary = """
Engine-oil-temperature circuit coordinator. While ROM8[0x18701] bit 1 is set \
it reports descriptor 0xdd (P0197) through 0007d8b8 when ffff4184 bit 6 is \
clear, ffff41c8 bit 7 is set, snapshot ffff10fb of oil input byte ffff117b \
is below 3, and countdown ffff438d, reloaded to 50 while the condition is \
false, has reached zero. While ROM8[0x18701] bit 0 is set it reports \
descriptor 0xde (P0198) on the same terms for an input byte of 242 or above \
with countdown ffff438c. While ROM8[0x18702] bit 2 is set it calls \
rationality monitors 00099efe and 0009a0d4; the stock byte 0xf9 leaves the \
bit clear, so JK08A skips both. With ffff4184 bit 7 clear and ffff4186 bit 7 \
set it latches coolant snapshot ffff1071 into ffff5508 at 00099ef0."""
note = [
    """
The input limits are below 0.06 V and from 4.84 V at 20 mV per input count, \
and producer 0003eb84 publishes 0xff outside the same 3..241 range. \
Descriptor records 0xdd, 0xde, and 0xe4 at 00019360 + 12*index carry P0197, \
P0198, and P0196.""",
]
level = "code"
role = "monitor"

