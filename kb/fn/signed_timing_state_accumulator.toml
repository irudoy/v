title = "Combine mode-selected base and correction terms into signed timing state"
summary = """
Signed timing-state accumulator with an exact source selector for ffff1511. \
Priority is stock-inert feature map 000121a6, warm DFCO-transition map \
0001219e, state-3/bit-7 constant ROM8[000086a2], then \
default/post-transition map 00012196. Map results and the constant use \
x-128. Coolant-indexed corrections 00011f0a/00011f12/00011f1a/00011f22 \
contribute through ffff12db, two-bank surface 00009dba through ffff1514, and \
multiplier 000147ca through ffff1349. The final byte is \
clamp_s8(s8(ffff1514)+u8(ffff12db)+s8(ffff1511)+u8(ffff1512)+u8(ffff1349)-128) \
at ffff23ee."""
note = [
    """
Map 0001219e requires ffff244f.bit2 clear, warm latch ffff41de.bit5 set, \
upstream DFCO bit ffff2458.bit5 set, and nonzero 85-count timer ffff2590. \
Map 000121a6 additionally requires ROM8[0000870b].bit0 set and ffff2318 \
below 0x4000; both conditions are false in the stock lifecycle. Constant \
0x9e or +30 counts requires ffff22ff=3 and ffff2458.bit7 set. All remaining \
cases select 00012196. A target-vehicle capture establishes one-for-one \
propagation from 00012196 to the final software timing coordinate during \
warm deceleration. Physical degree units remain unverified.""",
]
level = "code"
role = "accessor"
block = "ignition_timing/block"

