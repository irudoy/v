summary = """
Paired-sensor selection and inverse-conversion stage. Mode bits select \
nonnegative corrected sources into ffff284a and ffff284c. Each is multiplied \
by four, passed through inverse pair 0x13202/0x155a0, averaged, converted \
through the inverse direction, divided by four, and written to ffff2848. FUN \
0003b520 consumes ffff284a/ffff284c in the same two-bank ETC/airflow \
component."""
note = [
    """
The paired-sensor and inverse-conversion topology is exact. Diagnostic \
bindings establish throttle-position feedback semantics for the exposed \
source words. This feedback-side function is distinct from the actuator \
command path modeled in JK08A.throttle-control.md.""",
]
level = "code"
role = "driver"
block = "throttle_sensing/block"

