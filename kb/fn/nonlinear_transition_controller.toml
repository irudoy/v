title = "Update the bounded Q8 transition state through reciprocal curves"
summary = """
Two-mode nonlinear transition controller using reciprocal pair \
00011d24/0001199e. With ffff2482.bit2 clear it converts a nonnegative \
signed-byte difference through F, combines the result with weight ffff186a \
in the F-domain, inverse-converts through G, and writes bounded Q8 state \
ffff23c2. With bit2 set it evaluates F at two separated coordinates, writes \
ffff14c0 and ffff2ec3, decrements ffff23c2 under its gates, and clears bit2 \
when the state reaches zero."""
note = [
    """
Periodic table index 66 reaches this function through 00065434 after index \
64 map selection and index 65 knock coordination. Stock ROM8[0x8710].bit5 \
makes the high byte of ffff23c2 an input to 0004d99c. The normal-path \
difference is max(ffff23f1-ffff2404,0) and the upper limit is \
ffff2404-ROM8[0x8240]=ffff2404+7, both in crank degrees; the Q8 high byte \
reaches the final coordinate through ffff2336 and ffff11f9 with coefficient \
1.""",
]
level = "code"
role = "accessor"

