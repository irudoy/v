address = "00095c30"
level = "code"
note = """
The reviewed 1ME3B controller maintains word fffe93a0 with GBR=fffe93a0. \
Mode fffe9475.bit2 selects its active branch. The clear-mode path converts a \
bounded signed-coordinate difference through byte curve pair \
00013571/0001320c using 0002ad6c, combines it with unsigned ratio byte \
fffe8854, exchanges the curve arguments for the inverse lookup, bounds the \
result and stores its low word after SHLL8 at 00095e64. The active branch \
can initialize ROM8[00008b6b]<<8 at 00095c78, retains the state under its \
gates, or subtracts ROM16[00008fb8] with a zero boundary before the \
delay-slot store at 00095d5a. Zero clears mode bit2 at 00095d66. Coordinator \
00096e2c calls the controller on both outer paths and publishes the state's \
nonzero test in fffe9470.bit0. This target binding asserts no common mode \
mask, physical unit or producer signedness."""

