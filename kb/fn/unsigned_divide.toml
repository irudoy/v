summary = """
Unsigned 32/32 division, a shared library primitive. In two analyzed \
components it closes a fixed-point denominator: angle summation in 0004afdc \
(pair 0x11efa/0x147ca gated by bit 6 of ffff41ab) and normalization (V * M) \
/ 50000 in 0006205c, where V is output of 0x1495a, M is output of 0x1459a or \
0x145ca, and 50000 is divisor literal 0xC350."""
level = "code"
role = "service"
contract = """
Unsigned 32/32 division: r0 = r1 / r0 (dividend r1, divisor r0), rounding \
down. The implementation is an unrolled div0u/div1 sequence that selects a \
path by operand bit width. It does not return a remainder: on exit r1 \
contains an unreconstructed remainder mixed with quotient bits. r2 and r3 \
are preserved on the stack, and PR is untouched. On division by zero it \
writes 0x0000044E to 0xFFFF9818 and returns 0. Its pair 00021f40 returns the \
remainder under the same convention."""
contract_level = "code"

