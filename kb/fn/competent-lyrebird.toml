summary = """
Composite three-factor accessor for maps 0x1211E, 0x1212E, and 0x09D2A. \
Their interpolated uint8 results are multiplied, shifted right by 14, capped \
at 255, and written to ffff14d9."""
note = [
    """
0x1212E has code-level scale x/128; the physical purpose of the composite \
result is unresolved.""",
]
