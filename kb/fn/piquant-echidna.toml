summary = """
Conditional two-lane running-minimum accumulator. For index 0 or 1, it \
lowers ffff3f4c[index] to ffff2838[index] only while ffff4185.bit6 and \
ffff417f.bit5 are clear and the corresponding ffff3f3e phase bit is set. No \
admitted update can increase the accumulator."""
note = [
    """
FUN 0003d832 is the complete caller set and invokes both indices. \
Whole-program p-code analysis resolves the indexed read and write that \
exact-address xrefs omit.""",
]
