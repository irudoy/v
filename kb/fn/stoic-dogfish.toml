summary = """
Large multi-stage accessor. For one branch-selected coefficient K, \
ffff420b.bit4 clear selects lookup_u8(000124f2, axis 00023814, \
uint8[ffff10f0]); bit4 set selects min(lookup_u16(00014e22, axis 00013798, \
uint16[ffff31dc]),255). K is written to ffff90d0 and applied as a Q1.7 \
multiplier in the calculation that writes ffff8f0a. Separately, tables \
000237c4, 000237e4, and 00023804 select positive uint16 divisors M; code \
writes low8(floor(256/M)) to ffff90cd, ffff90cf, and ffff9129."""
note = [
    """
The branch formula and Q1.7 use are exact. The physical purpose of these \
coefficients and the three power-of-two channels is unresolved.""",
]
level = "code"
role = "accessor"

