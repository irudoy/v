summary = """
State and corridor controller. On its calibration-read branch it looks up \
shared curve 000122d2 by uint16[ffff11f0] over axis 00014d2a and writes \
ffff2523; downstream code uses only whether this byte is zero. Separately, \
00014caa defines an upper signed bound, 00014e92 defines a lower signed \
bound, and code selects max(lower,min(upper,value)) before writing \
ffff2260."""
note = [
    """
The 000122d2 result is a nonzero gate; its magnitude is not consumed in this \
function. Both corridor bounds decode as x-32768. The physical quantities \
and branch purposes remain unresolved.""",
]
level = "code"
role = "accessor"
block = "idle_air/block"

