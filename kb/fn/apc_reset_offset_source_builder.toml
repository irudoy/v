title = "Build the bounded source for the APC reset-edge command offset"
summary = """
APC reset-offset source builder. It bounds ffff1874 to 6..114 with \
ROM8[0x8b88] and ROM8[0x8b87], calculates and caps map-derived byte \
ffff1875, and writes ffff2406=min(ffff1874,ffff1875). Diagnostic state \
ffff4251.bit0 instead forces ffff2406=24."""
note = [
    """
Periodic dispatcher 00020dfe copies ffff2406 to actuator-facing snapshot \
ffff237a. The arithmetic and 0..114 output bound are exact; the physical \
dwell meaning remains unverified.""",
]
level = "code"
role = "accessor"

