summary = """
Coordinator of the exhaust cam reference learning, called from 00090e5e on \
every scheduler tick. Through comparator 000259d0 it forms ffff24a7 bit 4 as \
engine-speed byte ffff11b2 at most ROM8[00008dca]=0 with release offset 16, \
ffff24a9 bit 2 as raw coolant ffff1071 (plus 3 while set) above \
ROM8[00008e03]=106, and ffff24a9 bit 5 as raw coolant at most \
ROM8[00008e00]=170 with release offset 3. It passes enable 1 to 000907e8 for \
both banks while ffff248b bit 0 and those three flags are set, 00025e4e \
returns zero, 00025e20 and 000259e4 are clear for records 0x84..0x87, and \
ffff41be bit 6 is clear, and then calls 00090884 for both banks."""
note = [
    """
The learning condition is a stopped engine with the electrical enable set \
and coolant in the 107 to 170 raw window. Family entry 00090e5e calls the \
coordinator without a mask test, so the stage runs on stock JK08A while its \
consumer 00090bd2 does not.""",
]
