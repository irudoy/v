title = "Pack diagnostic status bytes for DIDs 0x1302 through 0x1306"
summary = """
Diagnostic status packer for response bytes ffff3342..ffff3346. For \
ffff3342, it maps ffff2452.bit7 to bit7, ffff2451.bit3 to bit5, \
ffff2459.bit7 to bit4, ffff417f.bit2 to bit3, inverse ffff4217.bit1 to bit2, \
ffff24ae.bit7 to bit1, and ffff2459.bit5 to bit0. For ffff3345, it maps \
ffff2488.bit3 to bit7, ffff5b2a.bit1 to bit6, ffff5b2c.bit7 to bit5, inverse \
ffff4235.bit1 to bit3, and ffff2451.bit7 to bit2."""
note = [
    """
The exact service-0x22 table publishes ffff3342 as DID 0x1302 with support \
mask 0x3f. A structured Nissan profile identifies ffff3342.bit1 as START \
SIGNAL, binding ffff24ae.bit7 to that diagnostic state. The same profile \
names ffff3342.bit0 CLSD THL POS. The table publishes ffff3345 as DID 0x1305 \
with support mask 0x44 (ROM32[0x22a08] = ffff3345, ROM8[0x11e44] = 0x44), \
and the profile names ffff3345.bit2 BRAKE SW.""",
]
level = "code"
role = "service"
block = "diag_services/block"

