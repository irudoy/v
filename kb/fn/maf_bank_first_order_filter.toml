note = """
Previous unsigned word ffff1df2 has weight 230 while the input has weight \
26. If the truncated weighted result equals the previous word and differs \
from the input, CMP/GT selects +1 for a higher input or -1 for a lower \
input; equal input or a changed weighted result skips correction. Stock \
positive coefficient 26 makes the lower-input correction unreachable from \
entry; direct post-arithmetic cases supply its register context explicitly."""

