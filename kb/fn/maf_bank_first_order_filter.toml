summary = """
Two-bank unsigned first-order MAF filter on 7mfk. Indices 0 and 1 write \
ffff1df0/ffff1df2 from working words ffff1058/ffff105a. Byte ffff2461.bit5 \
selects direct copy when clear or a weighted previous-output update when \
set. Stock ROM8[0x870a]=26 gives weights 26 and 230 over 256, truncated by \
logical shift. The one-count rule moves an otherwise unchanged result toward \
a differing input. The function preserves MACL and GBR in its natural return \
and delay slot."""
note = [
    """
Caller 0003a904 invokes exactly indices 0 and 1. The filter coefficient's \
physical time constant remains unresolved.""",
    """
The downward one-count branch cannot be selected from entry with the \
positive stock coefficient: for previous>input the floor result is already \
below previous. Direct post-arithmetic entry supplies previous, input, and \
weighted words plus the exact saved GBR/MACL frame to execute that \
alternative. These software cases establish no physical mode identity, \
scheduling interval, or filter time constant.""",
]
