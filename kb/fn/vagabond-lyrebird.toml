summary = """
4x4 interpolation weight 0x9eca: bVar9*RAM(ffff2c80) + \
(0x100-bVar9)*RAM(ffff2c7e) >>8, so code establishes x/256 scaling. The \
branch is gated by bit 1 of ffff41b7, and the entire map block is gated by \
bit 3 of ffff4208."""
note = [
    """
Section 6 conflict: the 4x4 catalog gives x*0.78125 with unity=128, while \
code gives unity=256. The trace using 0x100-bVar9 and >>8 takes \
precedence.""",
]
