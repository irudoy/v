summary = """
Bank-indexed catalyst-monitor branch. Under its enable state it compares \
metric ffff314d[bank] with calibrated limit ffff2b6f[bank] and dispatches \
descriptor 0x11 or 0x12 when the unsigned metric is below the limit. Other \
branches call FUN 000b4ef8 with the same indices."""
note = [
    """
Table 0x11fb6 yields zero throughout the stock ROM, so unsigned \
ffff314d[bank] < ffff2b6f[bank] is impossible in this branch. FUN 000a2254 \
provides an independent P0420/P0430 dispatch path.""",
]
level = "code"
role = "monitor"
block = "o2_catalyst/block"

