summary = """
A/F adjustment integrator: per bank, adds the unsigned up step \
ffff97a4/ffff97a6 (map 0x1462a on selector 2, 0 on selectors 1 and 3, 1 on \
selector 4) to the sign-extended state ffff45a0/ffff45a2, subtracts the \
unsigned down step ffff97a0/ffff97a2 (map 0x1463a on selector 2, 0 on \
selectors 1 and 3, 1 on selector 4), saturates the result to signed 16 bits, \
bounds it with signed compares to ROM16[0x8e7c]..ROM16[0x8e7e] = -500..500, \
and writes it back."""
note = ["The physical scale of the states is not derived."]
level = "code"
role = "accessor"

