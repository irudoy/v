summary = """
On-chip A/D single-conversion helper. The unsigned channel argument selects \
one of the SH7059 A/D result registers, starts a conversion, waits for \
completion, and returns the aligned unsigned 16-bit result."""
note = [
    """
The caller shifts the returned aligned register value right by six to obtain \
a 10-bit sample.""",
]
