summary = """
Automatic work-support request withdrawal. It clears timing request \
ffff41aa.bit0 and idle request ffff41ef.bit6 when ffff41a6.bit1 falls or \
ffff41a6.bit5 rises against previous-pass copy ffff41a8, clears the timing \
request while ffff99f4 bits 0 or 1 are set, and clears the idle request \
while ffff99f4 bits 2 or 3 are set."""
note = [
    """
ffff99f4 bits 0..3 are the apply and store bits of service-0x3b LIDs 1 and \
2.""",
]
level = "code"
role = "selector"

