summary = """
EVAP vent-control monitor state machine. It calls FUN 000aab54 for the \
path-A P0447 condition, sets ffff247a bit 7 for P0448 on three result \
branches, and contains a calibrated complementary P0448 status path through \
map 0x12870 and FUN 000b4ef8(0x2f)."""
note = [
    """
The stock 0x12870 table is all zero, so its unsigned below-limit branch is \
unreachable. Independently, coordinator FUN 000abca2 skips this entire path \
in stock JK08A because ROM8[0x186d8].bit7 and ROM8[0x186d7].bit1 are clear. \
Internal metric units and the physical output driver are unresolved.""",
]
level = "code"
role = "monitor"
block = "evap/block"

