title = "Conditionally scale the signed pedal-request precursor"
summary = """
Conditional signed pedal-request scaler. When ffff19a2 and ffff23fc are \
nonzero, it scales ffff18f2 by ROM16[0x944e], divides through both runtime \
words with x32 staging, clamps to signed 16-bit range, and writes ffff19d4; \
otherwise it writes zero."""
note = [
    """
The signed arithmetic is exact; its physical requested-torque scale remains \
unresolved.""",
]
level = "code"
role = "driver"
block = "pedal/block"

