summary = """
Component with master gate ffff2458 and six threshold flags in \
ffff2492/ffff2493. Lookup 00012422 is written to ffff15dd, multiplied by \
selected ROM8[0000990a], rate-limited relative to ffff15da and capped by an \
upper bound, then used to update uint16 ffff15da."""
note = [
    """
Direct destination ffff15dd has no external readers, but a register copy of \
the lookup is consumed by the product. The physical quantity of ffff15da is \
unresolved.""",
]
