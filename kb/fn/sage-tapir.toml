role = "service"
block = "library/block"
contract = """
Signed 32/32 remainder: r0 = r1 % r0 under the C rule, where the result has \
the sign of the dividend and is unaffected by the divisor sign; its \
magnitude is strictly less than the divisor magnitude. The quotient is \
computed and discarded. It clobbers r0 and r1; r2, r3, and r4 are preserved \
on the stack. On division by zero it writes 0x0000044E to 0xFFFF9818 and \
returns 0."""
