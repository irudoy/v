summary = """
Engine-coolant fail-safe ramp, the substitute that coordinator 000394b8 \
publishes while range check 00039614 fails. While ffff2451 bit 5 is clear it \
clears step counter ffff1f8c. While the bit is set, every expiry of \
countdown ffff24f7 increments the counter with saturation at 255 and reloads \
the countdown with 6. It returns min(90 + counter, 130)."""
note = [
    """
Periodic handler 0002040c decrements countdown array ffff24d4..ffff24f8 \
every 1000 base interrupts, or 1.024 s, so the ramp covers raw 90 through \
130 in 245.8 s. The factory fail-safe table for P0117 and P0118 gives 40 deg \
C at ignition ON or START, 80 deg C after about four minutes, and a \
time-dependent value between them: deg C = raw-50 at one deg C per count.""",
]
