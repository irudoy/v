summary = """
Coolant snapshot-byte producer. It converts ffff1186 through the same \
00012dea lookup used for raw coolant response ffff1079, subtracts 10 from \
the unsigned result with lower saturation at zero, and writes ffff3fa4."""
note = [
    """
Because ffff1079 is the exact UDS DID 0x1101 source with deg C = raw-50, \
ffff3fa4 code 0 represents at most -40 deg C and each positive code \
represents deg C = code-40.""",
]
level = "code"
role = "accessor"
block = "dtc_manager/block"

