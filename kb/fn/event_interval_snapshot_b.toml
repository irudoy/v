summary = """
Second event-interval snapshot. Under its gates it calculates a \
wrap-corrected unsigned difference between current timestamp ffff185c and \
previous timestamp ffff84d0, writes the difference shifted right by five to \
ffff22d4, and updates ffff84d0. A fault gate writes 0xffffffff instead."""
note = [
    """
Measure the second wrap-corrected event interval and publish the value \
shifted right by five""",
    """
The shift and wrap arithmetic are exact. The physical timer frequency and \
event-to-crank-angle conversion remain hardware-level unknowns.""",
]
