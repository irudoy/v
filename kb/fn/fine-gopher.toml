summary = """
Composite accessor for internal multipliers. Maps 0x1453A and 0x1454A form \
min(0xffff, floor(M*Q/64)). When initial states are zero, 0x15002 forms \
255*M and derived min(255, floor((255*M)/20000)), while 0x15012 forms \
initial uint16 M through an exact multiplication and division pair with \
divisor 1071."""
note = [
    """
The physical quantities of the results are unresolved. Scale x*0.000488 BFS \
for 0x15012 remains candidate based on the catalog.""",
]
level = "code"
role = "accessor"
block = "unattributed/block"

