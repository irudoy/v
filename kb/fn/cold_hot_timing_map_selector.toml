title = "Select and blend cold and hot timing maps into two runtime samples"
summary = """
Cold/hot timing-map selector. It writes active sample ffff160f and \
cold/high-octane reference sample ffff1610. Through coolant raw 106 both use \
0x991A; from 107 through 131 the active sample blends 0x991A with the hot \
surface selected by ffff2466.bit6 while the reference blends 0x991A with \
0x9A1A; above 131 the active sample uses selected 0x9A1A or 0x9B1A and the \
reference uses 0x9A1A. Wrapper 00026230 interpolates bits 0..6 and preserves \
bit 7 independently. A ffff2468.bit3 and ROM8[0x8b3d].bit1 gate substitutes \
column key 0xff for the relevant normalized-BFS lookup."""
note = [
    """
The outputs feed timing state, limits, and knock control before the \
engine-event command. Code does not establish any of the three tables as a \
direct final angle relative to TDC. The map coordinate is exact at \
raw*100/128 percent of the fixed BFS reference.""",
]
level = "code"
role = "accessor"
block = "ignition_timing/block"

