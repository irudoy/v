summary = """
Explicit-axis 16x16 wrapper over the byte core and the only entry using \
finisher 0x267CC. The finisher performs both interpolation stages on bits \
0..6 and then copies bit 7 from the lower-left cell selected by the row and \
column searches. Maps are 0x991A/0x9A1A/0x9B1A."""
note = ["Bit 7 is not numerically interpolated."]
