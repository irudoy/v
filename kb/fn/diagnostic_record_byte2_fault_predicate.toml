summary = """
Diagnostic runtime-record result-state predicate. It addresses the \
three-byte record array at ffff5718 + 3*index and tests bits 5 and 6 of the \
third byte."""
note = [
    """
Test runtime diagnostic record byte 2 bits 5 or 6 with minus-one sentinel \
support""",
    """
The record bits are kept as operational result-state bits; no UDS status \
names are assigned.""",
]
level = "code"
role = "service"
block = "dtc_manager/block"
contract = """
Input r4 is interpreted as a signed 16-bit record index. Index -1 returns 0 \
without reading RAM. Every other index returns 1 when either bit 5 or bit 6 \
is set in byte 2 of ffff5718 + 3*index, and returns 0 when both bits are \
clear."""
contract_level = "code"

