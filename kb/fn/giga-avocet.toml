summary = """
Trustful twin of shared throttle-area compositor 00072c3c. With ffff24d2 bit \
0 and ffff24ce bit 2 clear it writes \
ffff1d18=clamp_u16(ffff183e+ffff1cbe-(ffff120e>>2)); otherwise it converts \
ffff35fe and ffff3600 through trustful opening-area table 00018766 over \
angle axis 000190d0 and writes the uint16-saturated sum of both areas to \
ffff1d18."""
note = [
    """
Entry 97 of the 124-entry periodic table at 0002196c calls it; L0 records no \
direct caller. ffff1cbe, which 00072378 writes, holds the place of idle base \
ffff1340 in the primary composition. 0007240c, 0007249e, and 00072ee4 read \
ffff1d18. The opening-area units remain candidate.""",
]
