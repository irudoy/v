summary = """
Analog acquisition and coolant conversion path. It stores the 16-bit result \
of FUN 00028668(0) at ffff1d60, writes uint8(result >> 2) to ffff1186, \
converts that byte through calibration 00012dea into ffff1079, and calls FUN \
00039634 to form normalized coolant index ffff1077. It acquires the \
fuel-temperature sample through FUN 00028668(0, 0xe000) into ffff100a at \
0002c554, writes uint8(sample >> 2) to ffff1178, converts it through the \
same table into transfer code ffff1f89 and DID 0x1104 byte ffff1074 at \
0002c56e, and calls FUN 000398b0. The function also acquires additional \
analog channels and applies flat correction map 00012d8a to peripheral word \
ffff5620."""
note = [
    """
Exact UDS DID 0x1101 returns ffff1079 and DID 0x1104 returns ffff1074. Both \
bytes are deg C+50, the code that the ECU declares for table 00012dea \
through J1979 Mode 01 PIDs 0x05 and 0x0F; the physical identity does not \
rely on the shape of the calibration.""",
]
level = "code"
role = "accessor"
block = "temperatures/block"

