role = "service"
block = "library/block"
contract = """
Unsigned 32/32 remainder: r0 = r1 % r0, strictly less than the divisor by \
construction. The quotient is computed and discarded. It clobbers r1. On \
division by zero it writes 0x0000044E to 0xFFFF9818 and returns 0. It is the \
canonical pair of 00021ce0: same convention and operands, remainder instead \
of quotient."""
contract_level = "code"

