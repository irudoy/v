summary = """
Lower request bound ffff413a of the signed request boundary. It writes \
ffff3492=min(0x7fff, ffff2408+ffff2410). While ROM8[000083c1] bit 0 is \
clear, as in stock, it forms area-per-speed coordinate ffff339e=min(0xffff, \
floor(8*floor(ROM16[00013202]*65536/ROM8[00008d8f])/ffff1702)) from the \
first opening-area point, or 0xffff while ffff1702 is zero, converts it \
through lower segment 00015690 over axis 00015500 into column ffff3494, and \
writes ffff413a=lookup(0000e98e, row ffff1702, column ffff3494)-0x8000. \
While the bit is set it writes ffff413a=min(ROM16[00008ede], max(-32768, \
R-ffff3492)), where R is \
trunc(trunc(ffff3492*floor(ffff22e4*ROM16[0000932e]/256)/ffff1702)/4) while \
ffff1702 is nonzero and 0x7fff while it is zero, and R is 0 while ffff244f \
bit 5 is clear."""
note = [
    """
0007ac1e calls it before 0007ab18. Signed request boundary 00079030 and \
override clamp 0007b2c8 read ffff413a; 0007ab18 and 0007acb4 read ffff3492. \
The stock bound is the centered E98E request at the first opening-area point \
and the current row.""",
]
level = "code"
role = "accessor"
block = "torque_request/block"

