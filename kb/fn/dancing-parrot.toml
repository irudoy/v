summary = """
Startup configuration initializer. It preserves ffff4247 and ORs bit 4, then \
initializes service 0x22 support masks ffff2a81 for DID 0x130D and ffff2a82 \
for DID 0x130E from ROM configuration byte 0x8B28. The first mask is 0x00, \
0x3F, 0x31, or 0x7F; the second is 0x00, 0x3F, or 0x04."""
note = [
    """
The write proves that existing ffff4247 bits are retained and bit 4 is \
forced on; it does not source bit 6. The support masks do not prove the \
physical option set encoded by ROM8[0x8B28].""",
]
level = "code"
role = "init"

