title = "Coarse vehicle-speed fuel-cut state with RPM gate"
summary = """
Bounded coarse vehicle-speed cut state. Inactive raw speed at activation or \
above arms control bit7 and loads the zero delay only on a new arm; an \
existing nonzero counter waits. Counter zero with control bit5 clear sets \
state bit0. Active speed at release or above holds unless control bit5 gates \
it; below release clears state bit0 and arm. Complete other state/control \
bits, unrelated RAM, natural CPU/frame state and bound ROM retain their \
declared values. This invocation does not decrement the counter."""
note = [
    """
The candidate speed conversion is approximately 186/182 km/h and requires \
hardware validation.""",
]
level = "code"
role = "accessor"
block = "fuel_cut/block"

