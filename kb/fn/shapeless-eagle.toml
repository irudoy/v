summary = """
CAN 0x160 payload serializer for software record 8. Byte 0 and byte 1 bits \
7..4 are limited-request word ffff3fa0; byte 1 bits 3..0 and byte 2 are \
parallel actual-torque word ffff3f98; byte 3 and byte 4 bits 7..6 are \
ten-bit word ffff40d2; byte 5 and byte 6 bits 7..6 are its complement \
ffff3d6e; byte 4 carries ffff421f.bit1, ffff424f.bit3, ffff2459.bit5, and \
ffff3d3f&3; byte 6 carries ffff4242.bit3, ffff2482.bit0, ffff3e89&3, and \
ffff3d3e&3."""
note = [
    """
The payload occupies ffff3b07..ffff3b0d. The function sets ffff4229.bit1 on \
exit.""",
]
