summary = """
Injection-duration array filler for the ATU-II one-shot scheduler. It writes \
six words at ffff224e. When ffff418c.bit1 is set or ffff24a0.bit6 is clear \
it fills all six from injector opening time ffff23aa. Otherwise parameter 0 \
fills them from ffff238a; parameters 1, 2, and 4 form \
uint16(ffff23aa)+(ROM16[000094e8]*100>>8), compare it with ffff2388, \
conditionally subtract ffff238a from ffff2386, and lower-bound the result at \
ffff238c, ffff238e, or ffff2392; any other parameter copies snapshot \
ffff2348+2*i with a lower bound at ffff2390. It then calls FUN 000571c0 when \
ROM8[00008d92] bit 3 is set."""
note = [
    """
All four branches write the same six-word array, whose counts are 10 us. The \
three functions that pass ffff224e to FUN 0002c13c call this filler first, \
so the array is refreshed on every scheduling pass. The physical identity of \
start words ffff2386..ffff2392 remains unresolved.""",
]
level = "code"
role = "driver"
block = "injector_output/block"

