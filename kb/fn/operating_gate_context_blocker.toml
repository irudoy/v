title = "Qualify contextual blocking with a held word gate"
summary = """
Form set-only word latch L = (uint16[ffff11e0] >= ROM16[00008d98]) || \
ffffa646, then retain L at ffffa646. Update counter ffffa628 through \
00027b00: increment with uint16 saturation while L holds and reset to zero \
otherwise. Form set-only failure latch F = ffffa647 || (L && !ffff23b1.bit4) \
|| uint8[ffff106c] outside the inclusive interval \
[ROM8[00008396],ROM8[00008395]] || ffff5c0f != 0 || (uint16[ffff11e0] >= 32 \
&& uint16[ffff22bc] outside [ROM16[00008d9e],ROM16[00008d9c]]), then retain \
F at ffffa647. The blocker is clear only when battery_voltage/ram ffff1174 \
is greater than 137 stored counts (10.96 V), ffff45bc.bit7 is clear, counter \
>= ROM16[00008d9a] and F is clear. Publish the blocker at ffff45b2.bit0 and \
through the stack-passed pointer. Neither latch clears in this reader."""
note = [
    """
Known BFS, coolant, battery-voltage and final-timing inputs retain their \
tracked conversions. The enclosing physical subsystem, invocation period and \
other input quantities remain unresolved. Curve-output conversions, editor \
publication and later-layout counterparts require separate qualification.""",
]
