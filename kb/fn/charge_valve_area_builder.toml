summary = """
Forms the valve flow area of charge_model. It looks up \
charge_valve_lift_surface at the mean measured duration, clamped to 0..100 \
and times 512, and the angle p1 - p3, clamped to 0..160 degrees and times \
256, and forms the lift as the word times 2^-21 minus \
charge_valve_lift_offset times 2^-24, clamped to 0..0.015. It looks up \
charge_valve_area_ratio_curve at the lift times 2^21, stores the ratio word \
times 2^-15 at ffff9d88 and the area (charge_valve_diameter / 2)^2 * 3.1415 \
* ratio at ffff9d80."""
