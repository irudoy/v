summary = """
Big-endian diagnostic-request word reader. It reads four consecutive bytes \
from request-parameter buffer ffff8005 at the caller-supplied low-byte \
offset and combines them as b0<<24 | b1<<16 | b2<<8 | b3."""
note = [
    """
SID 0xAC descriptor 0x83 uses this helper to decode its arbitrary 32-bit \
source address.""",
]
level = "code"
role = "accessor"
block = "diag_services/block"
contract = """
Given r4=offset, returns uint32(request[0xffff8005 + uint8(offset) : +4]) in \
big-endian byte order."""
contract_level = "code"

