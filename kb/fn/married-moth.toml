summary = """
UDS ReadDataByIdentifier handler. High DID byte 0x11 indexes pointer table \
0x226ac and normally returns one byte; high byte 0x12 indexes table 0x2289c \
and normally returns two consecutive bytes in big-endian order. High byte \
0x13 indexes eight-byte records at 0x229e0 and returns one runtime byte plus \
a support-mask byte. Exact entries include 0x1101 -> ffff1079, 0x1107 \
through 0x110a -> ffff2022, 0x1123 -> ffff22dc, 0x1124 -> ffff22de, 0x1125 \
-> ffff2302, 0x1126 -> ffff2304, 0x1201 -> ffff11f4, 0x1206 -> ffff23c8, \
0x1207 -> ffff23ca, 0x1208 -> ffff1026, 0x1135 -> ffff2442, 0x120f -> \
ffff2756, 0x1210 -> ffff275e, 0x124b -> ffff285c, 0x124c -> ffff2864, 0x130a \
-> ffff2c56 with support mask ROM8[0x11a39]=0x10, and 0x130b -> ffff2c57 \
with support mask ROM8[0x11a3a]=0x03; response SID is 0x62."""
note = [
    """
DID 0x1208 returns newest Base Fuel Schedule word ffff1026. DIDs 0x1107 \
through 0x110a are exact aliases for one response byte. DIDs 0x1123 through \
0x1126 return the high bytes of four Q8.8-percent fuel-trim words. DIDs \
0x1211, 0x1212, 0x1127, and 0x1128 select 0xffffffff entries and are \
rejected. Exact pointer bindings are separated from physical names and \
units, which come from reviewed diagnostic sources and exact Mode 01 \
cross-checks.""",
]
