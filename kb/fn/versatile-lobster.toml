summary = """
Engine-coolant-temperature index normalizer. It reads raw DID 0x1101 byte \
ffff1079. Raw below 10 writes 0 to ffff1077; raw 10..169 writes \
floor(240*(raw-10)/150); raw at least 170 writes 255."""
note = [
    """
With the homologous DID conversion deg C = raw-50, implicit lookup nodes \
0,16,...240 correspond exactly to -40,-30,...110 deg C.""",
]
