summary = """
Paired-channel forward-average-inverse conversion through 00013202/000155a0. \
Bits 0/1 of ffff23a6 select two sources; each source is multiplied by four \
and converted through 00013202, the opening-area-domain results are \
averaged, and inverse lookup through 000155a0 returns a coordinate that is \
divided by four and written to ffff3f7c."""
note = [
    """
Code proves the transform. FUN 0006f236 publishes quarter coordinate \
ffff3f7c as the J1979 PID 0x11 absolute-throttle byte, which fixes one \
coordinate count of 000155a0 at 34285/1114112 percent of throttle opening. \
The opening-area scale and the catalog degree scale remain candidates.""",
]
