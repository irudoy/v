summary = """
ROM-gated Q0.16 signed-endpoint blend coordinator. On the enabled path it \
calls 0007604c to produce A=ffff18ec and B=ffff18ee, updates weight \
w=ffff2420 through 000760d2, and writes ffff18e6 as A for w=0, B for \
w=65535, or floor(((65536-w)*A+w*B)/65536) otherwise."""
note = [
    """
Stock ROM8[00008b3f].bit7 is clear, but ROM8[000089fa].bit5 is also clear \
and skips the entire evaluation and blend. The endpoint maps are identical \
if the path is enabled. The physical quantity and engineering unit are \
unresolved.""",
]
