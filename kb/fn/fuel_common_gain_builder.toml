title = "Publish common Q14 fuel gain ffff165e on alternating passes"
summary = """
Alternating-pass common-gain builder gated by ffff2485 bit 3. It forms \
pressure word ffff517c and its ratio to 51865, scales current BFS ffff1024 \
by that ratio and by 76288/(intake-temperature byte + 223) into load \
coordinate ffff13b1, looks up curves 0x129E2/0x129F2 into ffff17ba/ffff17bb, \
saturates their byte sum at 255 into ffff17b9, applies complement multiplier \
(256-sum) to the pressure word into ffff31d8, forms ratio byte ffff17ee = \
256*C/(C+ffff31d8) with C = ROM8[0x8AE7] << 10, and maps it to factor byte \
ffff160d through floor((x*5259 + 0x128500)/10000). Its terminal calculation \
writes ffff165e=floor(uint8(ffff160d)*ROM16[0x9332]/256), with \
ROM16[0x9332]=13972."""
note = [
    """
Scheduler index 40 executes this function after fuel-multiplier coordinator \
00057608 and before pulse precursor 0004e974. The output gain spans \
12280..13917. The stage has the form of an injector differential-pressure \
correction, sqrt(C/(C+V)) with C = 350 kPa and pressure word 51865 = 101.3 \
kPa at 1/512 kPa per count; that physical reading is a candidate.""",
]
