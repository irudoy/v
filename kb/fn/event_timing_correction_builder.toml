summary = """
Engine-event timing-correction builder. With ffff24c5.bit5 and ffff24cb.bit2 \
clear it writes ffff11d6=-ffff11f9; on the knock branch enabled by stock \
ROM8[0x8710].bit5 it writes ffff11d6=min(ffff22fa-hi(ffff23c2), -ffff11fa) \
and ffff11d8=min(ffff22fa, -ffff11fa). When ffff24cc.bit1 is set it writes \
ffff12d6=min(ffff2378,127). Otherwise it interpolates uint16 map 0x147da by \
ffff237e, stores the raw value in ffff2000, scales coefficient ROM8[0x8a3c] \
or ROM8[0x8a3d] (both 100, selected by ffff2459.bit5) by that value over 100 \
into ffff1ff6, forms ffff1ff8=ffff2378+ffff11d6 (or a one-count slew toward \
ffff2378 with timer ffff25fc when ffff24c0.bit6 is set), and writes \
ffff12d6=clamp_s8(ffff1ff8+ffff2356-ffff1ff6); with ffff40e7 nonzero and \
ffff24c2.bit1 clear the sum is limited to min(ffff11d6+ffff2356, \
-ffff40e7)."""
note = [
    """
Build the signed engine-event timing correction from map and state inputs""",
    """
Both the direct hot-map state path and the multi-cycle selected-map path \
reach the final timing coordinate through this function with coefficient 1 \
in crank degrees. The operating qualifier of 0x147da remains unresolved; \
ffff237e is the scheduler snapshot of ffff240a.""",
]
level = "code"
role = "accessor"

