summary = """
ADC2 DMAC channel-2 completion interrupt handler. It disables and rearms \
CHCR2, toggles the destination-buffer selector ffff20c0, programs the next \
128-byte transfer to ffff86cc or ffff874c from ADC2 ADDR24 or ADDR28, \
processes the completed buffer through 0004928c, restores all saved \
registers, and returns with RTE."""
note = [
    """
All recovered programmed destinations remain within ffff86cc..ffff87cb and \
cannot produce ffff2368.""",
]
level = "code"
role = "handler"
block = "knock/block"

