role = "service"
contract = """
Logical unsigned right shift: r0 = r0 >> r1 with zero fill. A jump table \
dispatches into a chain of fixed shifts: SH-2E has no SHLD/SHAD, so variable \
shift is unrolled by count. It clobbers r1; r2 is preserved on the stack. It \
is pure, writes no memory, and has no diagnostic channel."""
contract_level = "code"

