summary = """
Stock-selected final-word publisher with a disabled centered-correction \
branch. ROM8[000083c1].bit1 clear directly copies ffff1d26 to ffff35d2. If \
enabled, the alternate branch can interpolate 00016948 by ffff35ce and \
ffff11b6, write raw-32768 to ffff35d0, derive \
ffff35d6=min(255,floor(uint16(ffff35ce)*255/M)) from denominator M in \
00018dd6 or select 255 when M is zero, and combine the centered correction \
with bounded state before publishing ffff35d2."""
note = [
    """
Stock ROM8[000083c1]=0x2c has bit1 clear, so the map and denominator branch \
is unreachable and ffff35d2 always receives ffff1d26. Every cell of 00016948 \
is 0x8000 and would yield zero centered correction if the branch were \
enabled. The physical quantities of ffff35d2, the correction, denominator, \
and coordinates remain unresolved.""",
]
level = "code"
role = "accessor"
block = "torque_request/block"

