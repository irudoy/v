role = "service"
contract = """
Unsigned 16/16 division: r0 = (r1 & 0xFFFF) / (r0 & 0xFFFF), with the result \
zero-extended to 32 bits. Wide inputs are silently truncated: divisor \
0x10003 acts as 3. It clobbers r1 and preserves r2-r15. On division by zero \
it writes 0x0000044E to 0xFFFF9818 and returns 0."""
contract_level = "code"

