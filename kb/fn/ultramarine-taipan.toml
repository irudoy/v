summary = """
Accessor and state updater. The 1D-8 map 0x12a3a is indexed by uint8 \
ffff1077 and written to ffff1f78. In a separate exact path, four times \
unsigned ffff1062 forms a width around ROM8[0x8ad9]<<8 for comparisons with \
ffff1026; the result updates ffff39d4 and bit 5 of ffff2461."""
note = [
    """
The function has no caller sites in the exact image. The physical purposes \
of map 0x12a3a, ffff1f78, ffff1062, and the state remain unresolved.""",
]
