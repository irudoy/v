Accelerator-pedal request preprocessor. It maps snapshot ffff266e to \
ffff1e6c as 0 below 45, floor((input-45)*1500/125) between 45 and 170, and \
1500 at or above 170, then combines bounded offsets and corrections before \
publishing signed request precursor ffff18f2."""
