summary = """
Temperature-indexed threshold of the knock-sensor circuit monitor. It writes \
ffff32ee=lookup(00012a62, x)<<8 through 00026370, where x is 0 for byte \
ffff2739 up to 10, 255 from 150, and trunc0((16*ffff2739-160)/10) between. \
While coolant snapshot ffff5509 is at least ROM8[00008d0b], ffff54d0 is at \
least ROM8[00008b72], and the signed difference ffff5509-ffff106e is below \
ROM8[00008d03], it writes ROM8[00008b0a]<<8 instead."""
note = [
    """
000a5904 calls it at 000a590e. 000a5530 compares accumulator ffff3334 with \
ffff32ee and sets ffff4204 bit 3, the P0327 bit of the knock-sensor circuit \
state. 000a58d8 copies coolant byte ffff1071 to ffff5509 and ffff314f to \
ffff54d0; ffff2739 is the scheduler snapshot of ffff283d, which 0003d7da \
sets to min(ffff454c, ffff5612) and latches by setting ffff421d bit 2. The \
index form 1.6*(code-10) is that of normalized coolant ffff106f, which \
places the 1D-8 nodes 0 to 224 at -40 to 100 deg C for a deg C+50 code. \
Stock ROM8[00008d0b]=ROM8[00008b72]=ROM8[00008d03]=0xff and \
ROM8[00008b0a]=0; stock 00012a62 holds 255, 234, 117, and 39 from node 3.""",
]
level = "code"
role = "accessor"
block = "knock/block"

