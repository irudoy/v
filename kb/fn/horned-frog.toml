summary = """
Guard for shared Q1.15 trim coefficient ffff4970 of the MAF diagnostic words \
and the battery-voltage byte. Unless ffff4252 bit 3 bypasses the check, \
values outside inclusive range 0x7900..0x8700 are replaced with stock \
ROM16[0x92be]=0x8000."""
note = [
    """
In-range non-stock values come from calibration stage 0006635c and from \
import step 00068724, which reads configuration key 0x7f. The guard range is \
a trim of plus or minus 5.5 percent around unity.""",
]
level = "code"
role = "service"

