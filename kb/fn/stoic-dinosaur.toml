summary = """
Mode-dependent accessor for a shared pool. With ROM[00008d92]=0x7a and bit 3 \
set, control transfers from 00051718 to 000517a8 and skips lookups of maps \
00012206 and 000121f6 together with their downstream calculations. The \
executing branch uses 000121e6/000121ae/000121ce as cascaded multipliers."""
note = [
    "Both maps have role=dead only for the current contents of ROM 00008d92.",
]
level = "code"
role = "accessor"
block = "injection_timing/block"

