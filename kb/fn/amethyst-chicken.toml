summary = """
Misfire revolution-window producer called through revolution-phase \
dispatcher 0007c494. With stock feature gate ROM8[000186ce].bit7 set, it \
maintains two ffff444d-gated counters and one ffff444c-gated counter. \
Thresholds are 200*ROM8[00008354], 1000, and 200*ROM8[00008656]; stock bytes \
at both calibrated multipliers are 1, so completion sets ffff4241 bits 5, 7, \
and 6 at 200, 1000, and 200 admitted engine revolutions respectively."""
note = [
    """
Failure of ffff4251.bit7 or either ffff41d2 readiness bit resets all three \
counters. Qualified rotational-reference sample count ffff3834 below 31 and \
nonzero per-track inhibit values freeze rather than reset the affected \
counters. Threshold checks occur before readiness and increment handling in \
each invocation.""",
]
level = "code"
role = "monitor"
block = "misfire/block"

