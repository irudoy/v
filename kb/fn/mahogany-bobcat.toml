name = "mahogany-bobcat"
note = [
    """
Independent 7mfk execution of 00021314..0002131a calls the real byte copier \
00022558..0002258e with explicit incoming R11=00022558 and R12=140. It \
copies ffff23bc..ffff2447 to ffff2330..ffff23bb, including unsigned lead \
ffff23f0 to ffff2364 and unsigned angle ffff23bf to ffff2333. Only two data \
pointers are aliased after exact instruction identity. The simulator \
boundary at 0002131c restores PR from SP+24 and uses R7 outside stock bytes. \
Complete scheduler execution, live cadence, other copy calls and hardware \
atomicity retain separate evidence.""",
]

