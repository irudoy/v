title = "Process both MAF channels and publish the combined airflow aggregate"
summary = """
Dual-bank MAF processing coordinator. It preprocesses exact DID \
0x1204/0x1205 channels through 0003ae8a, looks up bank-1 curve 0x14274 and \
bank-2 curve 0x141f4, copies their outputs into the filtering pipeline, and \
calls 0003b252 to produce combined MAF aggregate ffff1e38. In the \
every-fourth-interrupt task table it immediately precedes Base Fuel Schedule \
producer 0003b75c."""
note = [
    """
The continuous AN4/AN15 -> DID 0x1204/0x1205 -> transfer curves -> DID \
0x1209 trace establishes MAF identity and bank mapping at code confidence. \
Engineering conversions remain pending hardware validation.""",
]
