summary = """
J1979 Mode 01 PID dispatcher. PID 0x01 masks ffff493e; 0x03 returns ffff3f2c \
and, when ROM8[0x8936] bit 4 is set, ffff3f2d; 0x04 returns calculated-load \
byte ffff413e; 0x05 coolant snapshot ffff3fa4; 0x06, 0x07, 0x08, and 0x09 \
read Q8.8-percent words ffff22dc, ffff2302, ffff22de, and ffff2304, \
calculate min(255, floor(word/200)), and return one byte; 0x0B \
floor((uint16[ffff16d2]*118+98304)/65536); 0x0C min(65535, \
50*uint16[ffff11f4]) as two bytes; 0x0D min(255, 2*ffff118e); 0x0E \
clamp((ROM8[0x83d5]-ffff2022)*2, -128..127)+128; 0x0F ffff3f41; 0x10 \
(ROM8[0x83ec]*uint16[ffff105c])>>8 as two bytes; 0x11 ffff1075; 0x13 \
ROM8[0x8936]; 0x14 and 0x18 floor(ffff1d44/5) and floor(ffff1d46/5) with the \
bank trim through helper 000357dc; 0x15 and 0x19 ffff118c and ffff118d \
through the same helper; 0x1C ROM8[0x8696]; 0x21 \
floor(uint32[ffff560c]/2548) capped at 0xffff."""
note = [
    """
The standard definitions fix the conversions: PIDs 0x05 and 0x0F are A-40 \
deg C, 0x0B kPa, 0x0C (256A+B)/4 RPM, 0x0D km/h, 0x0E A/2-64 degrees before \
TDC, 0x10 (256A+B)/100 g/s, 0x11 A*100/255 percent, 0x14..0x19 A*0.005 V, \
and 0x21 km. These identities establish the declared engineering scales of \
the internal sources: ffff1079 and ffff3fa4 deg C = raw-50 and raw-40, \
ffff11d4 degrees before TDC, ffff3852 g/s*100, ffff118e 2 km/h per count, \
and ffff1075 100/255 percent per count. PID order 0x06=STFT B1, 0x07=LTFT \
B1, 0x08=STFT B2, and 0x09=LTFT B2 with division by 200 converts internal \
percent*256 into the J1979 byte domain, where 100 percent is raw 128, and \
independently establishes the identities and scale of UDS DIDs 0x1123 \
through 0x1126. Stock ROM8[0x8936]=0 declares no oxygen sensors, so the \
oxygen PIDs answer negatively.""",
]
