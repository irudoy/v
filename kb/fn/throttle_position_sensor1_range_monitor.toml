summary = """
Throttle-position sensor 1 range monitor for both channels. It reads \
ffff2756 and ffff2758, accepts ROM16[0x9550]=60..ROM16[0x954e]=964 counts \
inclusive, and dispatches exact JK08A descriptor indices 0xe6 and 0xe7 for \
P0223 and P0222 and 0x111 and 0x112 for P2133 and P2132."""
note = [
    """
The exact ROM descriptor catalog identifies the four indices as throttle \
position sensor 1 circuit high and low input for banks 1 and 2. At 5 mV per \
count the window is 0.30..4.82 V, which brackets the factory terminal \
criteria of more than 0.36 V released and less than 4.75 V depressed.""",
]
level = "code"
role = "monitor"
block = "sensor_monitors/block"

