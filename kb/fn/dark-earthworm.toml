summary = """
Q0.16 signed-endpoint blend coordinator. It calls 00074028 to produce \
A=ffff1cfc and B=ffff1cfe, updates weight w=ffff1d0c through 000740ae, and \
writes ffff1cf6 as A for w=0, B for w=65535, or \
floor(((65536-w)*A+w*B)/65536) otherwise."""
note = [
    """
The endpoint maps are identical in stock JK08A, so the weight does not \
change the stock result. The physical quantity and engineering unit are \
unresolved.""",
]
level = "code"
role = "service"
block = "torque_request/block"

