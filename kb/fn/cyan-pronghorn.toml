summary = """
Paired-curve normalization branch. Let q=min(2*uint8[ffff22e4],255), \
A=lookup_u8(00012798,q), B=lookup_u8(000127d8,q), \
A128=lookup_u8(00012798,128), and B128=lookup_u8(000127d8,128). When A>B and \
A128>B128, n=min(255,floor(256*(A-B)/(A128-B128))); otherwise n=0. With \
ffff2451.bit1 clear, correction=floor(n*lookup_u8(00012704)/8); with the bit \
set, correction=0. The branch writes \
sat_u16(floor((correction+256*uint8[ffff22e4])/4)) to ffff11f2."""
note = [
    """
The formulas and selector polarity are exact. The physical quantities of q, \
n, correction, and ffff11f2 remain unresolved.""",
]
level = "code"
role = "accessor"
block = "idle_air/block"

