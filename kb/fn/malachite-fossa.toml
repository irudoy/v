forms a nonnegative 16-bit term, calls the signed-difference helper with \
ffff243a, divides the helper result by an independently calculated positive \
term, and updates state ffff1878. Scheduler 000702a0 subsequently runs \
00070cd6, 00070d20, and 00070d82 in the same controller pass."""
