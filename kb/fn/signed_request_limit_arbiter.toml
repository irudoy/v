title = "Select the most restrictive signed request-limit candidate"
summary = """
Periodic-table index-18 signed minimum arbiter for controller limits. It \
combines internal candidates with 0000942c-derived ffff19d8, adjacent \
limiter candidate ffff19de, and other bounds, writes intermediate minimum \
ffff349a, then applies ffff2c6c and ffff4138 before writing selected limit \
ffff243a."""
note = [
    """
The most restrictive signed candidate wins. The 0000942c branch belongs to \
the electronic-throttle/airflow request chain, continues through ffff19c6 to \
ATU-II BFR6A-D, and remains separate from fuel mask ffff22e0. Physical \
request units, plate motion, and channel-to-bank identity remain \
unverified.""",
]
