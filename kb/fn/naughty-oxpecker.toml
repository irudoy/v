summary = """
Common DTC fault-state dispatcher. Its byte argument indexes the exact \
12-byte descriptor catalog, invokes descriptor-specific status handling, and \
records the active result. Descriptor byte 8 bit 6 routes directly to FUN \
0007dc32; all seven exact P0306..P0300 descriptors carry byte 8 value 0x40 \
and therefore use that path. Descriptor pairs 0xd8/0xd9 and 0xda/0xdb \
receive grouped handling for the leak-monitor families."""
note = [
    """
This is the fault-producing dispatcher used by the traced misfire and EVAP \
branches. FUN 000b4ef8 is the distinct complementary state updater.""",
]
