summary = """
Shared throttle-area compositor. With ffff24d2.bit0 and ffff24ce.bit2 clear, \
it writes ffff19b2=clamp_u16(ffff183e+ffff1340-(ffff120e>>2)) and \
ffff19b6=sat_u16(ffff183e+ffff2a1c). The alternate mode converts final \
channel targets ffff28bc/ffff28be through 0x13202/0x155a0 and sums them into \
ffff19b2/ffff19b6."""
note = [
    """
Compose the normal shared throttle target area and alternate feedback \
value""",
    """
The normal request composition and alternate feedback branch are exact. The \
alternate branch does not establish a normal reverse dependency.""",
]
