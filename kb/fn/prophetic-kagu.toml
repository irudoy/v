summary = """
Producer of common Q15 coefficient ffff31e2 for the two raw-output channels. \
It adjusts state ffff31e6 by ROM16[000093b8], bounds the state, looks up \
upper limit 00014fa2 on axis 00014f82 with input ffff2698, and writes \
max(0x8000, min(ffff31e6, lookup)) to ffff31e2."""
note = [
    """
All cells of 00014fa2 equal 0x8000 in stock JK08A, so the published \
coefficient is unity. FUN 0007a592 and FUN 0007a804 apply it with a right \
shift of 15. The physical purpose of the coefficient is unresolved.""",
]
level = "code"
role = "accessor"
block = "torque_request/block"

