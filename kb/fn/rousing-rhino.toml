summary = """
Bank-indexed learned-fuel-trim updater. It derives a signed step from \
Q8.8-percent input ffff134e/ffff1350 relative to neutral 0x6400, an \
operating-region coefficient, and the current short-term fuel-trim word \
ffff22dc/ffff22de. It applies the step to selected word ffff2306/ffff2308, \
clamps the result to 90..110 percent from ROM bytes 0x8a9e/0x8a9f, and \
writes the selected cell in RAM grid ffff4b90 or ffff4b10."""
note = [
    """
The code establishes adaptive learned-grid maintenance and bank mapping. The \
physical meaning of the operating-region coefficient and the exact learning \
cadence remain unresolved.""",
]
level = "code"
role = "driver"
block = "fuel_closed_loop/block"

