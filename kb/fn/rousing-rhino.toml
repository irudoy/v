summary = """
Bank-indexed learned-fuel-trim updater. It derives a signed step from \
Q8.8-percent input ffff134e/ffff1350 relative to neutral 0x6400, an \
operating-region coefficient, and the current short-term fuel-trim word \
ffff22dc/ffff22de. It applies the step to selected word ffff2306/ffff2308, \
clamps the result to 90..110 percent from ROM bytes 0x8a9e/0x8a9f, and \
writes the selected cell in RAM grid ffff4b90 or ffff4b10."""
note = [
    """
The code establishes adaptive learned-grid maintenance and bank mapping. The \
physical meaning of the operating-region coefficient and the exact learning \
cadence remain unresolved.""",
    """
R4 supplies b=uint8(x) in 0..1; the addressed packed byte is explicitly in \
0..63. Independent uint16 words, permit bytes, threshold bytes and \
coefficients define the software domain. Truncation precedes the conditional \
minimum step; bounds apply upper then lower. STFT controls the zero-step \
gate, while the step direction follows ffff134e+2*b, so its full-domain sign \
is none. Cadence and live hardware permission remain separate. B = uint8(x); \
I = RAM8[0xffff130a+B]; W = RAM16[0xffff134e+2*B]; S = uint16(from); L = \
RAM16[0xffff2306+2*B]; V = RAM16[0xffff4b90-128*B+2*I]; C = \
RAM8[0xffff49f0-64*B+I]; A = abs(W-25600); T0 = \
min(1,max(0,(A)-(256*RAM8[0xffff2c21+0]))); T1 = \
T0*min(1,max(0,(A)-(256*RAM8[0xffff2c21+1]))); T2 = \
T1*min(1,max(0,(A)-(256*RAM8[0xffff2c21+2]))); R = T0+T1+T2; N = min(1,C); K \
= N*ROM8[0x000129c6+R]+(1-N)*ROM8[0x00008a9d]; Q = trunc0((W-25600)*K/256); \
E = min(1,abs(S-25600))*(1-min(1,abs(Q))); delta = \
Q+E*(2*min(1,max(0,(W)-(25600)+1))-1); G = \
((RAM8[0xffff1458]>>B)&1)*((RAM8[0xffff1457]>>B)&1); lo = \
256*ROM8[0x00008a9e]; hi = 256*ROM8[0x00008a9f]; to = \
(1-G)*V+G*max(lo,min(hi,L+delta))""",
]
