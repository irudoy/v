title = "Apply the scaled transient threshold and hysteresis to the state bit"
summary = """
Transient hysteresis-state updater. It compares max(u16(ffff10a6)-0x8000,0) \
with threshold 32*ffff1393 and hysteresis 32*ROM8[0x8383], uses comparator \
000259d0, and maintains ffff2478 bit 6. Subsequent branches in the same \
function use that bit while updating ffff2474."""
note = [
    """
No direct path from bit 6 to ffff11d4 or an APC compare is established. The \
table has an operational threshold role without an assigned direct retard \
quantity.""",
]
level = "code"
role = "monitor"
block = "unattributed/block"

