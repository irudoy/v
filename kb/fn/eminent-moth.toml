summary = """
Primary two-surface conditioning stage. It interpolates 0001050e and \
0001070e by ffff1210 and ffff10d2, stores the endpoints in \
ffff133a/ffff133c, and writes floor((A*(65536-w)+B*w)/65536) to ffff1212 \
using Q16 weight ffff190e from curve 0001488a. It conditionally rate-adds \
the blend into ffff1330 and publishes either ffff1330 or original source \
ffff1210 as ffff1332."""
note = [
    """
All cells of both endpoint surfaces and weight curve are zero, so the blend \
is zero. Stock ROM8[000089fb].bit6 clear selects direct blend processing, \
while bit3 clear makes the final selector always copy ffff1210 to ffff1332. \
The executed surface results therefore have no terminal consumer in \
unmodified JK08A. The physical quantity and engineering unit remain \
unresolved.""",
]
level = "code"
role = "accessor"
block = "torque_request/block"

