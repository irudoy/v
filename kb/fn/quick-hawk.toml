summary = """
DynamicDefineLocalIdentifier handler. Fresh DLID 0x81 resets the output \
count, then parses descriptors into the volatile pointer list at ffff9820. \
Descriptor 0x83 consumes a four-byte big-endian address through 0002f2d4 and \
adds one byte source. Descriptor 0x01 expands a predefined local ID into \
four consecutive byte pointers. Descriptor 0x02 selects predefined 0x11 \
through 0x16 table families and expands their declared one-, two-, or \
four-byte storage. The parser requires the current output count to be at \
most 0x3d before another descriptor, giving a maximum of 62 output bytes for \
a list made only from 0x83 descriptors. Success stores count ffff9920 and \
DLID ffff3ee2 and emits EC DLID; invalid syntax or table selection emits 7f \
ac 12."""
note = [
    """
A non-0x81 DLID can extend the current list only through the handler's 01 \
current-DLID reference form. Definition performs no general side-effect or \
memory-map safety validation; the read handler applies only its narrow \
address-range checks.""",
]
level = "code"
role = "service"
block = "diag_services/block"

