summary = """
Accessor for two 1D-4 uint16 tables defining the step of a Q0.16 blending \
coefficient. ffff10d2 selects map 0x153B0 or 0x153B8; the lookup is written \
to ffff17f8, after which 00074b68 updates ffff2422 and 00074c08 blends \
ffff18e8 with ffff18e6 into ffff18f4."""
note = [
    "The physical subsystem of the blended signed16 signals is unresolved.",
]
