title = "Coordinate operating gates and accumulated state"
summary = """
Coordinate all seven immediate helpers of the BCA1C family. Pass context \
byte ffff106c, coolant/ram at ffff106f (degC = raw-50), battery_voltage/ram \
at ffff1174 (V = raw*0.08), final_timing/ram at ffff1f45 (signed degBTDC), \
word ffff11e0 and existing flags through registers and reviewed stack slots. \
Select a BFS-derived reference through operating_gate_reference_mode_flags \
from bfs/ram at ffff102e (ms = raw/2048) and optional word ffff2242. Both \
BD25A and BD0D0 receive this selected reference; BCC6C receives the raw BFS \
word. BD25A publishes ffff4332 before BCC6C reads it in the same pass. \
Publish helper results in ffff44fc bits 2, 3, 4 and 5, then copy capture \
latch ffffa62c to ffffa644 for the next pass. Stack byte parameters follow \
their caller stores, rather than the decompiler's uninitialized high-byte \
temporary."""
note = [
