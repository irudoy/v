summary = """
Paired dynamic counter threshold. Map 0x0AAEA defines interpolated lower \
bound M. Map 0x0AAFA defines coefficient R: code computes \
Q=floor(uint8(ffff3448)*R/10), T=max(Q,M), and compares T with counter \
ffff3446. Reaching the threshold clears bit 0 of ffff41e1 and clears \
ffff3448/ffff3446."""
note = [
    """
0x0AAFA has code-level x/10 scaling. The physical subsystem of the state \
branch is unresolved.""",
]
