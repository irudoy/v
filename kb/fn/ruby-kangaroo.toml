summary = """
Composite diagnostic-record gate used by the P030 common readiness path. It \
returns nonzero when any checked runtime record has bit 5 or bit 6 set in \
its third byte."""
note = [
    """
The exact record set is code-proven. Its physical grouping name remains \
unresolved.""",
]
level = "code"
role = "service"
contract = """
It returns 1 when FUN 000259e4 returns 1 for any index in {0x14, 0x47..0x4c, \
0x8a..0x8c}; otherwise it returns 0. The two calls with index -1 are inert \
because FUN 000259e4(-1) always returns 0."""
contract_level = "code"

