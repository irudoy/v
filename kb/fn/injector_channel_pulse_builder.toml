title = "Per-channel pulse calculation with aggregate-mask override"
summary = """
Compensated six-channel injection-pulse writer. For channel i, a set \
ffff22e0 bit selects override ffff2436. Otherwise it selects base \
ffff191c/ffff191e by parity, adds signed ffff1396+2*i, conditionally \
subtracts signed ffff1466+2*i, multiplies a positive result by \
ROM8[000129c0+i], shifts right by 7, and saturates to uint16. The raw result \
is written to ffff23c8+2*i and a transformed result to ffff23d4+2*i."""
note = [
    """
Stock ROM8[00008d92]=0x7a enables the subtractive correction. All six \
multiplier cells are 0x80, or 1.0 in Q1.7. Channel order is proven; physical \
cylinder order is not.""",
]
