title = "Rate-limit the fuel multiplier and force zero under full inhibit"
summary = """
Fuel-multiplier target, limiter, and publisher. It starts with \
sum=min(65535,ffff231a+ffff240a) and target=floor(sum*ffff22e8/16384), then \
applies mode gates, bounds, and rate limits into working word ffff18e4. If \
aggregate inhibit mask ffff22e0 equals 0x3f it publishes zero to ffff22e6; \
otherwise it publishes ffff18e4."""
note = [
    """
The exact full-inhibit publication rule directly suppresses the multiplier \
consumed later by 0004e974. Other physical mode names remain unresolved.""",
]
level = "code"
role = "driver"
block = "fuel_quantity/block"

