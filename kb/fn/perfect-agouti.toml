summary = """
Engine-speed representation producer. It reads current word ffff11e8, shifts \
right by 4, saturates to 255, and writes byte ffff11eb. Since FUN 000384fe \
writes ffff11e8 = ffff1196>>3, the result is min(255, ffff1196>>7)."""
note = [
    """
Scheduler 00020dfe copies ffff11eb to ffff11b3. Relative to RPM/50 ffff11ae \
from the same source, this establishes RPM/25 at ffff11b3.""",
]
level = "code"
role = "accessor"
block = "engine_speed/block"

