role = "service"
contract = """
Logical left shift: r0 = r0 << r1, with a signed count. For r1 < 0 it \
returns the input unchanged; for r1 >= 32 it returns 0. The shifted value is \
necessarily r0 because paths 28..31 use the encoding and #imm,r0 and cannot \
target another register. It clobbers r1; r2 is preserved on the stack. It \
does not write global RAM; memory accesses are the stack and a byte read \
from table 0x2219c. T is not a contractual output."""
contract_level = "code"

