summary = """
Trustful conversion chain, the twin of 00073948. It converts saturated \
ffff1332*4 through 00018766 over 000190d0 and writes the saturated doubled \
area to ffff1ca8, writes uint32 \
ffff1ce0=floor(4*floor(ffff1ca8*65536/ROM8[0x15f82])/ffff1cca), converts \
ffff1ce0 through 00018fd6 over 00018e86 up to ROM16[0x18ec4] or otherwise \
through 00018f96 over 00018e46 after a shift right by four, writes that \
coordinate to ffff1d0e, then interpolates 000175c8 over axes \
00018716/00018ac6 at row ffff1cca and column ffff1d0e and writes the \
centered result to ffff1d1a."""
note = [
    """
In the stock ROM every table of the chain equals its primary counterpart \
byte for byte: 000175c8 equals 0000e98e, its axes equal 00011d0c and \
00014114, 00018766/000190d0 equal 00013202/000155a0, and the piecewise \
tables equal 00015690/00015500 and 000156d0/00015540; ROM8[0x15f82] and \
ROM16[0x18ec4] equal ROM8[0x8d8f] and ROM16[0x1553e].""",
]
level = "code"
role = "accessor"
block = "throttle_target/block"

