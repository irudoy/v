summary = """
Periodic stock HCAN1 transmit scanner. When the CAN runtime gate is active \
it clears the TX request aggregate, scans all 30 mailbox records, invokes \
000c3746 only for firmware type 3, and publishes the resulting bits to HCAN1 \
TXPR0/TXPR1 while interrupts are masked."""
note = [
    """
Entry 61 at word 00021928 of the 69-entry table 00021834, which dispatcher \
000209d8 drains, calls this function before serializer coordinator 000c3de4 \
at entry 63. Type 4 is intentionally excluded.""",
]
