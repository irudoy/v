summary = """
Per-evaluator-channel knock monitor. It refreshes the current channel \
threshold through 00049ffc, compares the calculated uint32 metric with the \
selected uint16 threshold, writes the current result to ffff24c2 bit 6, sets \
or clears the selected bit in ffff2150, and saturating-increments ffff2142 \
on an exceedance."""
note = [
    """
Compare the current evaluator-channel knock metric with its interpolated \
threshold""",
    """
The counter saturates at 0xff. The six bitmap positions follow the \
function's one-based internal channel selector; physical cylinder or sensor \
order remains unverified. Threshold 0xffff is the uint16 upper bound and \
effectively prevents an exceedance.""",
]
level = "code"
role = "monitor"

