summary = """
Purge-control circuit status producer. The ROM8[0x186fe].bit2 branch \
debounces its condition for ROM8[0x84fc]=0x32 counts and sets ffff423e bit 0 \
for P0444. The bit1 branch can set ffff423f bit 7 for P0445 after the same \
debounce."""
note = [
    """
ROM8[0x186fe]=0 disables both branches in stock JK08A. Even if the P0445 \
configuration bit were enabled, its recovered producer requires unsigned \
ffff404a < ROM8[0x850a]=0 and remains unreachable with the stock \
threshold.""",
]
level = "code"
role = "monitor"
block = "evap/block"

