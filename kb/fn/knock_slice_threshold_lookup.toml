channel c addresses row 0001108e + 32*(c-1) and output word ffff2144 + \
2*(c-1). Wrapper 000264f8 uses the uint16 coordinate ffff11f4 and word axis \
00015340; the natural return leaves R0 = 2*c and R2 = threshold. The legal \
domain is 1 <= c <= 6; the accessor has no channel guard."""
