summary = """
Per-evaluator-channel accessor for Knock Slice Map 0x1108E: it selects one \
of six 16-element uint16 rows by one-based channel number, interpolates the \
row through 000264f8 using speed axis 0x15340, and stores the threshold at \
ffff2144 + 2*(channel-1) for evaluator 0004a238."""
note = [
    """
Interpolate the current evaluator-channel knock threshold by engine speed""",
    """
The six uint16 thresholds occupy ffff2144..ffff214f. The apparent base \
reference ffff2142 in an indexed-listing comment is two bytes below the \
first effective one-based write and is the independent event counter. ROM \
axis 0x15340 corresponds to 400..6400 RPM. Stock ROM8[00008b3d].bit3 is \
clear, so the selected channel comes from ffff11de rather than alternate \
ffff2143. Physical cylinder or sensor order is not established.""",
]
level = "code"
role = "accessor"
block = "knock/block"

