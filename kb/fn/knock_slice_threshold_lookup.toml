    """
On 7mfk, ROM8[00008b3d].bit3 clear selects uint8(ffff11de); bit 3 set \
selects uint8(ffff2143). JK08A stock selector 0x82 chooses the primary byte. \
Other mode bytes in the executable contract are artificial contexts, without \
asserted live reachability. The stock word axis is raw 32..512 in steps of \
32. Chain steps 4-6 use this stock axis; independent artificial axis/table \
contexts exercise the underlying unsigned kernels. The selected uint16 write \
occupies ffff2144 + 2*(c-1); ffff2142 is a separate event counter. Both row \
cells are loaded even with zero fraction, including last neighbor 0001114e. \
A cell value 0xffff is raw threshold 65535; metric comparison and count \
publication belong to evaluator 0004a238 outside this lookup slice. Physical \
channel order and engineering threshold scale remain unverified.""",
]
