title = "Six-channel masked ATU-II one-shot scheduler"
summary = """
Masked six-channel ATU-II one-shot scheduler. Its callers supply duration \
array ffff224e or ffff1568. With ffff4184.bit7 set, it processes bits0..5 of \
the incoming R4 mask. Any intersection of the whole mask with ffff22e0 or \
entry history ffff1935 selects unsigned16 opening word ffff23aa for every \
selected channel and ORs the whole mask into history. Otherwise it uses the \
corresponding duration word. A set DSTR bit subtracts opening with floor0. \
The increment is min(65535,floor(800*d/256)), or1000 when ffff4251.bit0 is \
set. It adds the increment modulo65536 to DCNT8A..DCNT8F with interrupts \
masked and ORs selected bits into DSTR. Peripheral timing and physical \
actuation retain independent evidence."""
note = [
    """
The SH7059 hardware manual identifies the addressed registers as ATU-II \
channel 8 one-shot pulse outputs. With PSCR1 = 1 from 000274ac and TCR8 = \
0x55 from 0002718a the counters step at Pphi/64, so the 800/256 factor makes \
one duration count 200/Pphi = 10 us exactly. Pin-tracer injector-terminal \
mappings remain cross-model candidates, so physical injector identity is not \
asserted at code confidence.""",
]
level = "code"
role = "driver"
block = "injector_output/block"

