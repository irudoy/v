title = "Six-channel masked ATU-II one-shot scheduler"
summary = """
Masked six-channel ATU-II one-shot scheduler. Its callers supply duration \
array ffff224e or ffff1568. For each set bit in the channel mask it selects \
a 16-bit duration; ffff22e0 and ffff1935 substitute injector opening time \
ffff23aa for that channel, and a DSTR start bit that is still set causes the \
same opening time to be subtracted from the new duration. It scales the \
selected value by 800/256 with uint16 saturation, optionally forces 1000 \
through ffff4251 bit 0, adds the result to ATU-II channel 8 down-counter \
DCNT8A..DCNT8F at fffff640..fffff64a with interrupts masked, and sets the \
corresponding start bit in DSTR at fffff666."""
note = [
    """
The SH7059 hardware manual identifies the addressed registers as ATU-II \
channel 8 one-shot pulse outputs. With PSCR1 = 1 from 000274ac and TCR8 = \
0x55 from 0002718a the counters step at Pphi/64, so the 800/256 factor makes \
one duration count 200/Pphi = 10 us exactly. Pin-tracer injector-terminal \
mappings remain cross-model candidates, so physical injector identity is not \
asserted at code confidence.""",
]
level = "code"
role = "driver"
block = "injector_output/block"

