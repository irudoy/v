R4 bits0..5. If the whole low-byte mask intersects aggregateffff22e0 or \
historyffff1935, every selected duration takes unsigned openingffff23aa and \
history ORs the whole mask. An already-set rawDSTR bit subtracts opening \
with floor0. The increment is min(65535,floor(800*d/256)), or1000 under \
ffff4251.bit0. Addition to each raw counter wraps modulo65536; rawDSTR ORs \
the selected bit underI15 and the incoming interrupt mask is restored. \
Peripheral timing, duration units and physical output behavior remain \
unverified.""",
