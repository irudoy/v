summary = """
Compensation component with disable/fault latch bit 3 of ffff41d0: when set \
it writes neutral value 0x80 instead of lookup 0001233a. A separate lookup \
of 00012352 by uint8 ffff10f4 is written to ffff2fc1 and combines with \
ffff2fc0 in two subsequent products with fixed shifts and saturation."""
note = [
    """
Physical names for 0001233a, 00012352, and 00012dd2 are unresolved. The \
range of 00012352 and catalog matches are not used for physical \
identification.""",
]
