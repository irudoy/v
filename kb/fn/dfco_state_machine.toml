title = "Five-state DFCO machine and injector-event release tail"
summary = """
Five-state DFCO machine and injector-event rotating-release coordinator. \
Parameter 1 is cut request 0004fbe2, parameter 2 is restore class 00050018, \
parameter 3 contains stage-1 and stage-2 entry delays, and parameter 4 is \
exit delay. Entry from idle requires a true cut request and restore class 0. \
State ffff14c1 moves 0 idle -> 1 first wait -> 2 second wait -> 3 full cut \
-> 4 exit wait -> 0. In state 4, ffff2458.bit5 set with scheduled RPM-drop \
class ffff106a at least 4 takes the common early-bypass path. Table 0002371c \
maps states to 00, 00, 15, 3f, and 15; a separate rotating tail ORs channel \
masks produced through 00050766."""
note = [
    """
Stock stage-2 and exit delays are zero, so states 2 and 4 normally collapse \
within one invocation. The optional low-RPM release tail is synchronized to \
injector events by 0002be40. Target-vehicle telemetry confirms that a \
nonzero restore classification can veto full-mask entry even when the stock \
cut-request threshold pair is retained.""",
]
level = "code"
role = "driver"
block = "dfco/block"

