summary = """
Stored work-support adjustment import step. While ffff41b9.bit0 is clear it \
reads records 0x74 and 0x7e through stable wrapper 0006727c, rechecks the \
error bit, stores the high byte of record 0x74 in stored timing adjustment \
ffff29c6 and its low byte in stored idle adjustment ffff316a, and stores the \
high byte of record 0x7e in ffff56ba."""
note = [
    """
ffff29c6 is the stored timing adjustment that 0004aad0 selects within -5..0 \
crank degrees, and ffff316a is the stored idle adjustment that 000420b8 \
selects up to 20 counts. FUN 00068040 writes record 0x74 with the timing \
adjustment in its high byte and the idle adjustment in its low byte, and \
record 0x7e with LID-3 value ffff56ba in its high byte; stock \
common-correction mode does not consume ffff56ba. The SCI2 peer is not \
identified.""",
]
level = "code"
role = "service"
block = "work_support/block"

