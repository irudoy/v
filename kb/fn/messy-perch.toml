Net engine-torque builder. It stores the inhibited-cylinder count from FUN \
00065d42 at ffff16a2 and writes \
ffff18d0=sat_i16(trunc0(s16[ffff18ce]*(6-n)/6)-u16[ffff2408]-u16[ffff14e2])."""
note = [
    """
FUN 00065d42 returns 6 for fuel-output inhibit mask ffff22e0=0x3f and at \
least 3 for mask 0x15.""",
