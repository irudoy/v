summary = """
Stateful selected-temperature gate. While computed START SIGNAL \
ffff4185.bit6 is set and battery-voltage raw ffff1188 is below 100, it \
clears ffff24be.bit6 and returns 1 for coolant. Outside that condition, a \
clear latch is set and coolant is returned once; subsequent calls with the \
latch set return 0, the hold branch of coordinator 000394b8."""
note = [
    """
Select coolant during low-voltage START SIGNAL and manage the transition \
latch""",
    """
The state transition and strict raw comparison are exact. DID identities \
bind ffff4185.bit6 to computed START SIGNAL and ffff1188 to battery voltage. \
At 0.08 V per count the strict raw threshold is battery voltage below 8.00 \
V; JK08A.diagnostics.md derives that scale from the ROM limits of the DTC \
monitors.""",
]
level = "code"
role = "selector"
block = "temperatures/block"

