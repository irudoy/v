summary = """
Build the decrement step of the reduction state. By mode and state bits, one \
of three branches takes a byte from the 4x4 mode-selected surface \
reduction_state_decrement_multiplier, from the curve \
reduction_state_decrement_curve at index (x*0x2d0e>>15)-0x20 clamped to \
0..255, or from direct constants, multiplies it by a state byte, and stores \
the word product that strange-mushroom/fn subtracts from the 16-bit \
reduction state with saturation at zero. The physical quantities remain \
unresolved."""
note = [
    """
The physical purpose of state ffff1866 is unresolved. Map 0x11FE6 contains \
only zeros in the current ROM.""",
]
