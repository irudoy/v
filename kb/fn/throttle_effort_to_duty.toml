title = "Apply supply compensation and publish bounded duty"
summary = """
Per-channel throttle-effort-to-duty converter. It reads ffff37b8+4*channel \
using unsigned offset 0xe0 from base ffff36d8, shifts effort right by six, \
applies the ffff39b0 supply-compensation divisor derived with ROM16[0x933a], \
clamps the intermediate command to 500, applies stock literal cap 490, and \
writes ffff374c+2*channel."""
note = [
    """
The effective address is ffff37b8, not ffff36b8: SH extu.b converts \
immediate -0x20 to unsigned 0xe0 before the base addition.""",
]
level = "code"
role = "driver"

