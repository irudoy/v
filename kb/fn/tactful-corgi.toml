summary = """
Component with three computational roles: 0x14FC2 defines the threshold for \
an incremented counter in structure ffff9a28; 0x15580 and 0x15590 are Q12 \
multipliers for two signed channels and form ffff33b2/ffff33b4. Map 0x14E82 \
remains a separate offset-binary calibration in the component."""
note = [
    """
Maps 0x15580 and 0x15590 have code-level x/4096 scaling. The physical \
purpose of the counter and channels is unresolved.""",
]
level = "code"
role = "accessor"
block = "unattributed/block"

