note = """
1ME3B: 16-point nominal encoded-temperature axis 10..160 = -40..110 degC \
under x-50, inverse x+50. The coordinate is selected temperature. Current \
coolant is the snapshot of P; selected temperature uses P on refresh or a \
retained previous selected byte. Equality with the retained community PID05 \
decoder requires T>=10, x=T, and corresponding samples. The grid is not a \
sensor inverse; no hardware proof."""

