note = [
    """
Column axis for Fuel Compensation Map 0xA29A. FUN 0002c648 and FUN 0003bd74 \
pass byte ffff1170 as the column input of wrapper 000261f0, and its byte \
core 00026944 compares each stored point with that byte directly, so one \
stored count is one coordinate count. FUN 0003b498 writes ffff1170 as the \
high byte of curve 00015042/00015022 at coordinate \
min(65535,(ffff1e60*ffff114e>>9)+(ffff120e*ffff114e>>11)), where FUN \
0003b40a forms ffff1f46=min(65535,ROM8[00008d8f]*ffff11f4) and FUN 0003b436 \
forms ffff114e=min(65535,0xdc1d00/ffff1f46), or 0 while ffff1f46 is 0, in \
inverse proportion to engine speed. Throttle area ffff1e60 and inflow area \
ffff120e/4 are both opening areas in the value domain of 00013202, so the \
coordinate is an alpha-N flow estimate: opening area over engine speed \
through a saturating curve. The raw range 16..255 corresponds to \
6.25..99.609375% QH0 flow; the physical name and scale have candidate \
confidence based on A2L.""",
]
