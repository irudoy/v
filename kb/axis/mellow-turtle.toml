note = """
Periodic task 000521DC constructs its internal ratio from unsigned FFFEA522 \
and FFFE89A4 using the binary coefficients at 00052420 and 00052428. It \
multiplies by 100, compares with 99.99799346923828, then truncates the \
result after multiplying by 655.3599853515625, or uses 65535 above the \
threshold. Store 000522C0 publishes the unsigned fixed-word representation \
to FFFE941E. The scheduler copies it unchanged to FFFE937A, whose high byte \
feeds column axis 000141AE at 00049D1E. Startup takes the high byte of \
FFFE941E directly. The scale gives the nominal percent of the internal \
modeled ratio. The physical airflow unit and percentage reference are \
unqualified."""

