summary = """
Axis of the two upper-limit offsets of the warm DFCO-transition timing-state \
addends in FUN_000644D0. Both lookups take the engine-speed byte 0xFFFF11A3 \
as the coordinate; `JK78C.vvel.md` reads that byte at 25 RPM per count, so \
the stock points 32..128 span 800..3200 RPM."""
note = [
    """
The JK78C DFCO-transition reader gates the lookup with ROM8[0x8966].bit0, \
clear in stock. The timing-state compositor also reads the same calibration \
bytes.""",
]
