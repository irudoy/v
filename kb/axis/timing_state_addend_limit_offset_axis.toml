note = """
Target function 00075c4c runs the program of JK78C 00067122 \
(timing_state_compositor): the same two limit-offset lookups over one axis, \
the byte multiplier lookup over its axis and the 8x8 word surface multiplier \
lookup. 1ME3B adds one 8x8 lookup of 00009ae4 between the two limit-offset \
lookups. It is the axis of both limit-offset lookups. MOV.L 00075cd8 loads \
this axis, which reaches the call at 00075ce0 (helper 0002ac9c) in r5, as \
