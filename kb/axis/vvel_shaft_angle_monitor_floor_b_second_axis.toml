note = """
Eight-point engine-speed axis 2400..7200 RPM of the second copy of monitor \
floor B; the coordinate is the word 0xFFFF11BC, the latched copy of \
0xFFFF11F0 = (12000000 / (ROM8[0x87AB] * period 0xFFFF2230)) >> 1 that \
FUN_0003B938 writes with ROM8[0x87AB] = 3. The primary coordinate 0xFFFF11A6 \
latches 0xFFFF11DA = (32000000 / period 0xFFFF11E8) >> 4; both forms equal \
2000000 / period, and FUN_0002B548 and FUN_0002B5AC take the two periods \
from the same timestamp 0xFFFF1864 >> 5 at separate events. The angular span \
of the second period is not bound to a published parameter, which leaves the \
count weight a candidate. Stock bytes are identical to the primary axis \
0x00016D54."""

