note = [
    """
Row axis for primary requested-torque surface 0000e98e. FUN 0003de4c writes \
row coordinate ffff1702 = max(32, ffff11b6) in RPM/3.125 counts, and every \
forward lookup except 0007584e passes it to wrapper 000262e0, whose byte \
core 00026a0c multiplies each stored point by 16; inverse lookup 00073432, \
which 000730fc calls with the same word, multiplies each point by 16 as \
well. One stored count is therefore 16*3.125 = 50 RPM, and the points decode \
to 800 through 6400 RPM in 400 RPM steps and 7200 RPM. Throttle-rev limiter \
0007584e passes ffff11b6 directly, which differs from ffff1702 only below \
100 RPM. The A2L carries the same x*50 scale.""",
]
