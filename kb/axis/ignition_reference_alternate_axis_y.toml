surface over its own axis pair; otherwise it reads the primary reference \
surface. It is the y axis of the alternate reference surface. MOV.L 00079d78 \
loads this axis, which reaches the call at 00079d80 (helper 000293d8) in r6, \
as MOV.L jk78c:0006a102 loads 000135a0, which reaches the call at \
jk78c:0006a106 (helper 00027f98) in r6. Its 8 stock bytes equal JK78C."""

