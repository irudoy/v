note = """
Target function 000797cc runs the program of JK78C 00069ab8 (vivid-weasel): \
the same final selection: while the ROM gate bit 0 is set (JK78C 00008605, \
1ND 00008651, 1ME3B 00008659) and the RAM flag is set (JK78C ffff4501 bit 5, \
