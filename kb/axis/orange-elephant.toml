note = [
    """
Static TVO axis for primary opening-area table 00013202. Code also passes it \
as the returned-value table for the inverse area-to-angle conversion. FUN \
00072c3c passes throttle targets ffff28bc and ffff28be unscaled to wrapper \
00026524, whose word core 00026984 compares each of the 32 stored points \
with the operand directly, so one stored count is one count of the target \
word; FUN 0003b520 passes 4*ffff284a and 4*ffff284c and FUN 00073948 passes \
4*ffff1332 in the same domain. FUN 0003e548 converts both throttle-position \
channels through this pair, averages the opening areas, converts back and \
divides by four into ffff3f7c; FUN 0006f236 writes min(255, (ffff3f7c - \
ffff28f8) * 0x505b >> 16) to absolute-throttle byte ffff1075, which FUN \
00035856 returns unchanged for J1979 Mode 01 PID 0x11 at A*100/255 percent, \
and FUN 00054eb8 applies the same 0x505b gradient to quarter-coordinate \
monitor ffff40c6. One stored count is therefore 0x505b/65536/4*100/255 = \
34285/1114112 percent of throttle opening measured from coordinate zero, \
while the published byte subtracts idle base ffff28f8 first. The catalog \
degree scale x*0.0275 stays a candidate: no ECM diagnostic item publishes \
this coordinate in degrees.""",
]
