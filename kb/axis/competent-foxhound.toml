note = [
    """
Column axis shared by signed endpoint surfaces 000171c8 and 00016fc8. FUN \
00074028 passes uint16[ffff1210] directly as the runtime coordinate, and FUN \
0007a592 produces that word as floor(first_channel_raw*727/800). It is \
byte-identical to axis 00013d14. Code proves the scale relationship inside \
the unresolved first-channel raw domain; it does not assign a physical \
quantity.""",
]
level = "code"
quantity = "raw"
unit = "first-channel raw coordinate"
scale = "x*800/727"
to_raw = "x*727/800"
scale_level = "code"

