note = """
Engineering conversion is unestablished. Retained hypothesis: x*3.125 RPM; \
proposed editor-grid inverse x/3.125. Origin: the retained layout \
interpretation and defs/VQ37.running-rpm-axis-scale.md:42-89, \
vvel_duration_running_axis/axis, intake_cvtc_target_running_axis/axis. The \
existing running-axis proof fixes the nominal fine-coordinate count unit, \
not measured engine-speed accuracy. Its named executable contracts apply \
only to the two running axes. They do not execute this axis caller or \
establish every layout-specific argument path. No running-axis TEST is \
attached to this meaning by analogy. Recorded code and catalog \
interpretation: Sixteen-point engine-speed axis 600..7200 RPM of the \
throttled duration curve; stock bytes are identical to JK78C 0x00016C84."""

