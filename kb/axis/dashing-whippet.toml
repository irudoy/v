note = [
    """
X axis for comparators 0001261a/0001263a/00012cbe, passed in r5 at \
00083988/00083996/000839da through wrapper 000264a0; byte input ffff11ae. \
The bounded conversion chain forms W=u16(ffff1196)>>6 and \
Q=u16(ffff1196)>>8, then copies Q through the real 56-byte scheduler ladder \
to ffff11ae. The PID 0x0c publisher emits min(65535,50*W), high byte first. \
The independently pinned community PID formula gives 12.5*W RPM and the \
nominal 50*Q RPM grid, with same-source residual 0/12.5/25/37.5 RPM. The \
x/50 inverse is an editor-grid inverse, not a reconstruction of arbitrary \
physical RPM. Scale confidence remains candidate; the measuring producer of \
U and hardware correspondence are outside this placement/conversion proof. \
Its literal/input path is bound independently of 00011b6b despite equal \
calibration bytes.""",
]
