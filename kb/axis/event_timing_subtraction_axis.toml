and adds one lookup before the amplitude lookup. It is the axis of the \
subtraction amplitude curve. MOV.L 000786c6 loads this axis, which reaches \
the call at 000786ce (helper 0002aeac) in r5, as MOV.L jk78c:000691c2 loads \
00014fbc, which reaches the call at jk78c:000691c6 (helper 000282f4) in r5. \
Its 16 stock bytes equal JK78C."""

