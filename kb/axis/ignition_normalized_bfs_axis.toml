note = [
    """
Shared column axis for ignition maps 0x991A/0x9A1A/0x9B1A. FUN 0003b75c \
forms live byte ffff1048 as min(255,floor(BFS*128/ROM16[00009534])), and FUN \
00020dfe snapshots it to runtime coordinate ffff102c. Therefore one raw axis \
count is exactly 100/128=0.78125 percent of the fixed BFS reference. The \
terminal cell at 00011ecd is raw 128, or exactly 100 percent, and FUN \
0004bbee reuses that cell as a bounded-ramp upper coordinate without \
interpolating the axis. The HR catalog calls this ratio Cylinder Filling; \
that physical name remains a candidate.""",
]
