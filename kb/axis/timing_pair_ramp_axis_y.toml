note = """
Target function 00073c6a runs the program of JK78C 00065010 \
(timing_pair_ramp_builder): the same 8x8 endpoint lookups over one axis pair \
and the same ramp: the result is the endpoint weighted by the ramp w plus \
the endpoint weighted by 0x8000 minus w. JK78C reads one endpoint of each \
kind. 1ND reads three endpoints and selects the w-weighted endpoint by \
fffe94e2 bit 4; 1ME3B reads five and selects it by fffeb9ca bit 2 and \
fffe94b3 bit 5. It is the y axis of every endpoint lookup. MOV.L 00073c96 \
loads this axis, which reaches the call at 00073ca4 (helper 00028e10) in r6, \
as MOV.L jk78c:0006502c loads 000132ee, and 000132ee plus 0x8 reaches the \
call at jk78c:00065040 (helper 00027ee0) in r6. Its 8 stock bytes differ \
from JK78C in 5 bytes."""

