note = """
Engineering conversion is unestablished. Retained hypothesis: x*3.125 RPM; \
proposed editor-grid inverse x/3.125. Origin: the retained layout \
interpretation and \
defs/analysis/valve-timing/VQ37.running-rpm-axis-scale.md:76-89, \
defs/analysis/valve-timing/VQ37.cold-axis-scale.md:25-56, \
vvel_duration_running_axis/axis, intake_cvtc_target_running_axis/axis, \
vvel_cold_axis/axis. The RPM interpretation must not replace the 1nd coolant \
coordinate. Existing nominal-RPM and nominal-coolant proofs establish \
bounded encoded source domains, not this hot-idle latch and caller. A \
byte-sized runtime temperature coordinate is not made uint16 by the stored \
axis width. Recorded code and catalog interpretation: First axis of the \
hot-intake idle surfaces, 400..2000 RPM, loaded from its own literal pool \
word; the coordinate is the r7 word argument of the resolver. Stock bytes \
are identical to JK78C 0x000160CA; 1ND indexes its surfaces by two \
temperature bytes instead."""

