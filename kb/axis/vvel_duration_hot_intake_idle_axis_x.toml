1ND0A: First axis of the hot-intake idle and mode 14 surfaces, stock points \
90..160. The r7 coordinate is the byte 0xFFFE8073, the per-pass latch that \
the list walker FUN_00021218 takes at 0x212E6 from the coolant temperature \
byte 0xFFFE8079 (DID 0x1101), which FUN_00030810 writes at 0x30C1E from \
curve 0x1468E over the channel 0 ADC word; the axis is degC + 50.""",
    """
1ND3B: First axis of the hot-intake idle and mode 14 surfaces, stock points \
90..160. The r7 coordinate is the byte 0xFFFE8073, the per-pass latch that \
the list walker FUN_00021218 takes at 0x212E6 from the coolant temperature \
byte 0xFFFE8079 (DID 0x1101), which FUN_00030810 writes at 0x30C1E from \
curve 0x1468E over the channel 0 ADC word; the axis is degC + 50. 1ND3B \
shares the 1ND0A code layout and its stock bytes at this address.""",
]

