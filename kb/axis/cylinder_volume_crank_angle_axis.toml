summary = """
Crank angle from top dead center of cylinder_volume_curve in 1/128 degree: \
32 points from 0 to 360 degrees, 6 degrees apart up to 12 degrees and 12 \
degrees apart beyond."""
note = [
    """
The float model root forms the coordinate as |360 - X| * 128 from its \
crank-angle input X in degrees and caps it at 46080, 360 degrees. The \
conversion x/128 degrees rests on the code factors 360.0 and 128.0, and the \
crank-angle reading on the cylinder-volume shape of the curve.""",
    """
Native editor class (issue #129): active on 1ND and 1ME3B, with \
cylinder_volume_curve. The role stays out of the editor.""",
]
