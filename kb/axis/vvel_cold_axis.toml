address = "00017176"
note = """
Eight-point nominal encoded-temperature axis for coolant in the cold \
duration and cold CVTC curves; stock points 20..90 display as -30..40 degC \
using x-50. The independently executed stock PID05 relation is \
A=max(T-10,0); the retained community decoder is A-40. Equality with a \
decoded PID05 value requires T>=10, x=T and corresponding samples. \
Hysteresis, independent refresh, override and fail-safe do not establish \
that equality. x+50 is the inverse of the nominal coordinate grid, not the \
sensor or publication chain; it is not a sensor inverse. Measured \
temperature and physical accuracy are unverified; no hardware proof is \
established. Stock axis bytes match JK78C 0x00016AC4; runtime input is an \
unsigned byte, not the uint16 storage domain. See \
defs/VQ37.cold-axis-scale.md.\n"""

