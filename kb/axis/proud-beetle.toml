note = [
    """
Column axis shared by signed endpoint surfaces 0000de8e and 0000e08e and \
identity output table for inverse evaluator 00076ad0. FUN 0007604c passes \
uint16[ffff1210] directly as the forward coordinate; FUN 0007a592 produces \
ffff1210 as floor(first_channel_raw*727/800). Stored points span 0..727, and \
FUN 00076ad0 restores an inverse result with min(800,floor(x*800/727)). Code \
proves the scale relationship inside the unresolved first-channel raw \
domain; it does not assign a physical quantity.""",
]
