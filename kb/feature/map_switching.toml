title = "Map Switching"
summary = """
Five calibration slots that the steering-wheel switches select: Map 1 is the \
stock storage of each switched map family and Maps 2 through 5 occupy ROM \
that the layout owns, a map commit publishes the limiter clusters \
atomically, and pulses of the CRUISE and SET lamps confirm the selection."""
specs = ["patches/map-switching-selector.md"]

[[target]]
layout = "1ek7a"
status = "supported"

[target.basis]
maps = """
Reviewed exact 1EK7A call pools, calibration storage, native limiter \
consumers, and the ASCD selector and feedback dispatch bind the relocated \
five-slot runtime."""

