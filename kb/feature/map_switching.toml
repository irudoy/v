[[target]]
layout = "1me3b"
status = "supported"
note = """
Requires four DFCO families two fuel compensation surfaces two warm-idle \
timing tables two ignition hooks one state-code ignition hook native \
fuel-cut caps and curves and a throttle-scalar commit"""
requires = [
    "ignition_unreferenced_routine/const",
    "over_run_channel_multiplier/tbl",
    "rev_fuel_cut_delay/ram",
    "rev_fuel_cut_selector/ram",
    "rev_fuel_cut_state/ram",
    "rev_fuel_cut_state_machine/fn",
    "rev_limit_fuel_cut_delay_calibration/tbl",
]

[target.basis]
maps = """
Reviewed 1ND correspondence of the interpolation leaves, target call \
topology, exact stock storage, the native 190-byte fuel-cut state machine, \
and 1ME3B bank structure bind eighteen supported families. Stock \
ROM8[0x8A7D] bit 3 makes the ignition coordinator FUN_000797CC dispatch by \
the VVEL state code alone: the two 16x16 ignition families and the four 8x8 \
state-code families are every surface it reads besides the 8x8 reference \
surface 0x0000A584, which stays stock behind its own literal 0x00079E40. The \
literal 0x00079994 is the only pointer through which FUN_000797CC calls the \
8x8 lookup 0x000293D8 for the four state-code surfaces. The routine at \
0x000791a4..0x000797cb is a second coordinator copy with no inbound pointer \
or branch; its private literals stay stock."""

