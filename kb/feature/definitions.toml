[target.images.1ME3B]
basis = """
Reviewed structural function correspondence against 1ND0A, \
interpolation-call order, contract-equal fused leaves, exact storage \
anchors, target literals, target axis geometry, checksum code, and \
independently reproduced stock checksum values."""
checksum = true
map_switching = true
note = """
The definition uses JK08A as the canonical semantic and presentation source. \
Every emitted stock map and axis is relocated through the SHA-bound reviewed \
correspondence in defs/JK08A-1ME3B.definition-addresses.csv, which is \
established through the 1ND0A structural export: matched consumer functions, \
interpolation-call ordinals, contract-equal fused leaves, exact target \
storage, selector branches, and target literals. No code relocates from any \
modelled ROM. Homologous claims are downgraded to candidate confidence \
unless target-specific evidence keeps code confidence. Source tables whose \
1ME3B implementation changes geometry, removes the subsystem, or keeps no \
gated selector path are omitted explicitly; the three canonical ignition \
surfaces are among them because the target coordinator carries only its \
mode-selected surfaces. The project and native RomRaider checksum contracts \
cover all six 1ME3B checksum fields. The Developer Immobilizer control \
addresses the configuration byte that the eleven target consumers of the \
1ND0A flag read. Exact target-native fuel-cut caps and activation/release \
curves are added from the SHA-bound VQ37 registry. Map 2 through Map 5 \
storage, Rolling Launch controls, and the CAN Telemetry at Startup control \
use the validated 1ME3B runtime allocation in \
patches/rom-address-profiles.toml. The VQ37 Rolling Launch variant requests \
all-cylinder fuel cut after the stock final-mask coordinator and does not \
reuse the VQ35HR fuel-shadow maps."""
rolling_launch = true
romraider_checksum = true
source = "JK08A"
source_sha256 = "ab60f18793fb121e4f55f626246117a6c69d9a900c0307ab1f4fc5f6ac718b23"
target_sha256 = "f905b78901b4ca96002a31c2fca8f1cd00dee57b02bea1921a341caa6db2a6f3"

