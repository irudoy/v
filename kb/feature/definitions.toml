[target.images.1ND0A]
basis = """
Reviewed JK78C-to-1ND0A structural functions, shared interpolation \
contracts, exact storage, selector branch order, target literals, and \
exact-code 1ND family evidence."""
checksum = true
map_switching = true
note = """
The definition uses JK08A as the canonical semantic and presentation source. \
Every emitted stock map and axis is relocated through the SHA-bound reviewed \
correspondence in defs/JK08A-1ND.definition-addresses.csv. Homologous claims \
are downgraded to candidate confidence unless target-specific evidence keeps \
code confidence. Source tables whose VQ37 implementation changes geometry or \
removes the corresponding lookup are omitted explicitly. Exact target-native \
fuel-cut caps and activation/release curves are added from the SHA-bound \
VQ37 registry. The project checksum implementation verifies and recalculates \
all six 1ND fields. The native RomRaider alt2 handler maintains the four \
fields a definition entity can invalidate: both primary SUM16 values and the \
runtime XOR and SUM pair. The boot and vector SUM16 domains end at 0x8200, \
below every published entity, so no editor session can leave them stale. Map \
2 through Map 5 storage, Rolling Launch controls, and the CAN Telemetry at \
Startup control use the validated 1ND runtime allocation in \
patches/rom-address-profiles.toml. The VQ37 Rolling Launch variant requests \
all-cylinder fuel cut after the stock final-mask coordinator and does not \
reuse the VQ35HR fuel-shadow maps."""
rolling_launch = true
romraider_checksum = true
