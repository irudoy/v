data = "2B"
name = "ICC Switch (5 Buttons)"

[switches.developer_immobilizer]
category = "NATS / Immobilizer"
description = """
Exact {target_rom} only. Bit 0 enables ECM immobilizer enforcement; clearing \
it bypasses the Developer Immobilizer transitions and releases the engine \
inhibit. NATS DTC suppression is independent. Hardware evidence covers a \
JK08A-derived image on a 23710-JK00D ECU; no other image carries a hardware \
result."""
