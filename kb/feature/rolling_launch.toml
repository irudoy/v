title = "Rolling Launch"
summary = """
An optional runtime on Map Switching of the 7mfk layout (configuration \
schema 6) that holds either a standstill launch RPM below the per-map speed \
threshold or the captured vehicle speed at or above it while CANCEL is held, \
using ignition alone: a dwell-arming divider wrapper withholds spark dwell \
for fraction q and applies a per-map fixed ignition trim, with no fuel-cut \
request. The other layouts receive the runtime after its vehicle acceptance \
on 7mfk."""
specs = ["patches/rolling-launch.md"]

[[target]]
layout = "1ek7a"
status = "planned"

[[target]]
layout = "1me3b"
status = "planned"
note = """
Rolling Launch v2 is ported to this layout after its vehicle acceptance on \
7mfk; the layout carries no Rolling Launch runtime until then."""

