title = "Rolling Launch"
summary = """
An optional runtime on Map Switching of the 7mfk layout that captures engine \
speed while CANCEL is held, holds RPM with an all-cylinder fuel-cut request \
that a wrapper of the stock fuel-output inhibit coordinator merges into the \
final cylinder mask, and can apply bounded retard-only ignition control; the \
other layouts receive Rolling Launch v2 after its vehicle acceptance on \
7mfk."""
specs = ["patches/rolling-launch.md"]

[[target]]
layout = "1me3b"
status = "planned"
note = """
Rolling Launch v2 is ported to this layout after its vehicle acceptance on \
7mfk; the layout carries no Rolling Launch runtime until then."""

