title = "Rolling Launch"
summary = """
An optional runtime on Map Switching of the 7mfk layout that captures \
vehicle speed while CANCEL is held and runs a speed-hold controller that \
publishes a torque fraction; hold mode adds an all-cylinder fuel-cut request \
above the captured engine speed plus a ceiling offset, which a wrapper of \
the stock fuel-output inhibit coordinator merges into the final cylinder \
mask. The other layouts receive the runtime after its vehicle acceptance on \
7mfk."""
specs = ["patches/rolling-launch.md"]

[[target]]
layout = "1me3b"
status = "planned"
note = """
Rolling Launch v2 is ported to this layout after its vehicle acceptance on \
7mfk; the layout carries no Rolling Launch runtime until then."""

