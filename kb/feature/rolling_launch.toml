[[target]]
layout = "1me3b"
status = "supported"
note = """
Dedicated state requests all-cylinder cut after the stock final-mask \
coordinator without modifying VQ37 map storage"""

[target.allocations.captured_rpm_native]
address = "ffff0c4a"
did = "jolly-bison/did"
width = 2

[target.allocations.cut_rpm_native]
address = "ffff0c4c"
did = "calm-curassow/did"
width = 2

[target.allocations.flags]
address = "ffff0c42"
did = "ninja-shrimp/did"
width = 2

[target.allocations.map_mode_snapshot]
address = "ffff0c44"
did = "copper-kiwi/did"
width = 2

[target.allocations.phase_abort_reason]
address = "ffff0c40"
did = "resilient-beaver/did"
width = 2

[target.allocations.rearm_ticks]
address = "ffff0c48"
did = "archetypal-weasel/did"
width = 2

[target.allocations.restore_rpm_native]
address = "ffff0c4e"
did = "sly-ferret/did"
width = 2

[target.allocations.run_ticks]
address = "ffff0c46"
did = "rigorous-jackrabbit/did"
width = 2

[target.allocations.stock_effective_ignition_command]
address = "ffff0c50"
did = "placid-bullmastiff/did"
width = 2

[target.basis]
rolling = """
The scheduler task behind periodic task-list word 0x000220C8, the sole \
final-mask coordinator 31 words above it, homologous gate inputs, ignition \
path, and aligned empty UDS slots bind the VQ37 fuel-coordinator runtime."""

[target.hooks.displaced_periodic_task]
hook = "displaced_periodic_task/hook"
replacement = "0013c860"

[target.hooks.feedback_arbitration]
hook = "cruise_feedback_serializer/hook"
note = "Rolling feedback chains from the Map Switching serializer wrapper"
replacement = "0013d1e0"

[target.hooks.fuel_cut_coordinator]
hook = "fuel_cut_coordinator/hook"
replacement = "0013e000"

[target.hooks.primary_ignition_command]
hook = "primary_ignition_command/hook"
replacement = "0013cea0"

[target.hooks.selector_arbitration]
hook = "selector_host_call/hook"
note = "Rolling arbitration can chain from the selector literal"
replacement = "0013c880"

[target.hooks.startup_state_clear]
hook = "startup_initializer/hook"
note = "Runtime clear can chain from the startup literal"
replacement = "0013c8a0"

[target.roles.fuel_inhibit]
note = """
Sole coordinator 0007a740 publishes the final six-cylinder inhibit mask \
here"""
symbol = "fuel_inhibit_mask/ram"

[target.symbols]
apc_mode = "apc_mode/ram"
apc_output = "apc_output/ram"
ascd_state = "ascd_state/ram"
button_state = "button_state/ram"
coolant_index = "coolant_index/ram"
fuel_cut_coordinator = "fuel_cut_coordinator/fn"
pedal = "pedal/ram"
periodic_task_slot = "displaced_periodic_task/hook"
periodic_task_table = "periodic_task_table/const"
rpm = "rpm/ram"
scheduler_task = "scheduler_task/fn"
stock_ignition_consumer = "stock_ignition_consumer/fn"
unsigned_divide = "unsigned_divide/fn"
vehicle_speed = "vehicle_speed/ram"

