title = "Runtime allocation"
summary = """
The ROM and RAM that the patch runtimes occupy on each layout: the envelope \
of the canonical JK08A layout, its relocation into an audited free region of \
every other layout, and the build variants that a layout selects."""
specs = ["patches/rom-builder.md", "patches/runtime-reservations.md"]

[[target]]
layout = "1me3b"
status = "supported"
free_ram_end = "ffff1000"
free_ram_start = "ffff0c00"
free_rom_end = "0013ff00"
free_rom_start = "00139dc4"
injected_ram_end = "ffff0f00"
injected_ram_start = "ffff0c00"
injected_rom_end = "0013f000"
injected_rom_start = "0013b108"
map_variant = "sh7059-1me3b"
ram_delta = -20736
rom_delta = 430080
rom_size = 1572864
telemetry_completion_variant = "mailbox26-tail-chain"
telemetry_zero_source = "ffff0de0"

[target.basis]
free_ram = """
TraceRamAccesses PASS for 0xffff0c00..0xffff0fff across the recovered 1ME3B \
executable census: no stock access reaches the allocation."""
free_rom = """
AuditFreeRegion PASS for 0x00139dc4..0x0013feff: erased region with no \
recovered stock ownership; scalar-alias references begin at 0x0013ffec, \
above the declared end. Runtime uses the bounded 0x0013b108..0x0013efff \
envelope."""

[target.ignition_unreferenced_routine]
end = "000797cc"
start = "000791a4"

[target.notes]
free_ram_end = "Audited free RAM ends at this exclusive address"
free_ram_start = "Direct and decompiler-assisted RAM trace found no stock accesses"
free_rom_end = """
Erased ROM audit ends at this exclusive address below the scalar-alias \
references that begin at 0013ffec"""
free_rom_start = "Erased ROM audit begins at this address"
injected_ram_end = "Runtime uses 0x300 bytes inside the audited 0x400-byte window"
injected_ram_start = "Uniform RAM relocation is -0x5100"
injected_rom_end = "Canonical runtime envelope preserves its 0x3ef8-byte extent"
injected_rom_start = "Uniform ROM relocation is 0x69000"

