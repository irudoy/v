title = "CAN telemetry"
summary = """
Custom CAN telemetry, disabled by default: a firmware producer transmits the \
fields of the telemetry profile in fixed and context pages under the \
ROM-neutral schema 2 wire contract on a CAN mailbox of each layout, and the \
host schema, decoder, dashboard, and recorder use the same profile \
identity."""
specs = ["patches/can-telemetry.md"]
base_tick_numerator = 204800
byte_order = "big"
candidate_can_id = 1776
candidate_tick_divisor = 1
context_count = 5
context_pages = [9, 10]
fixed_page_count = 9
full_rate_hz = 97.65625
header_sequence_bits = 4
pphi_hz = 20000000
protocol_version = 2
rotating_divisor = 5
telemetry_profile = "tuning"

[[target]]
layout = "1me3b"
status = "supported"
note = """
Mailbox 26 tail-chain type A3 feedback record and unavailable fields require \
explicit variants"""
feedback_payload_offset = 322
mailbox_index = 26
mailbox_mask = 1024

[target.basis]
can = """
Exact target HCAN1 initialization, SLE1 vector, serializer, mailbox records, \
payload binding, and knock-event path bind the transport runtime."""
telemetry = """
ECU-RAM fields use per-layout source symbols, whose records own each address \
qualification. A source with an unresolved layout status or an explicitly \
unsupported wire role is encoded from cleared reserved RAM and remains \
unavailable in metadata. The exhaust CVTC candidates require independently \
reviewed target producer-consumer bindings before their fields can be \
exposed. The intake solenoid duty fields decode their x*25/64 percent source \
cells with the x*39/100 wire scale, within 0.16 percentage points. A one-bit \
source that the layout keeps in another bit than 7mfk moves into the wire \
bit that the contract decodes, and the other bits of its wire byte are \
cleared; a source of the dynamic page moves only while the page carries its \
default row."""

[target.hooks.coherent_snapshot_call]
hook = "coherent_snapshot_call/hook"
replacement = "0013d280"

[target.hooks.hcan1_primary_init]
hook = "hcan1_primary_init/hook"
replacement = "0013de10"

[target.hooks.hcan1_recovery_init]
hook = "hcan1_recovery_init/hook"
replacement = "0013de10"

[target.hooks.hcan1_sle1_vector]
hook = "hcan1_sle1_vector/hook"
replacement = "0013d800"

[target.hooks.knock_interval_latch]
hook = "knock_interval_latch/hook"
replacement = "0013d2b0"

[target.hooks.knock_margin_latch]
hook = "knock_margin_latch/hook"
replacement = "0013d600"

[target.hooks.startup_state_clear]
hook = "startup_initializer/hook"
note = "Telemetry clear can chain from the startup literal"
replacement = "0013d2f0"

[target.notes]
feedback_payload_offset = "Target serializer writes the eight payload bytes at base plus 0x142"
mailbox_index = "Target uses physical mailbox 26"
mailbox_mask = "HCAN1 mailbox 26 pending mask is unchanged"

[target.roles.alpha_n_flow_raw]
note = """
The high byte of snapshot word fffe937a is the target Fuel Compensation \
table column. Its direct consumer and periodic-copy path are recorded in \
diamond-macaque/ram; the live-word producer remains unresolved. The JK08A \
byte-producer homolog, alpha_n_flow/ram at fffe8150, indexes only 4x4 \
surface 00009bd4."""
symbol = "diamond-macaque/ram"

