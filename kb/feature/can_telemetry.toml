[[target]]
layout = "jk00c"
status = "supported"
feedback_payload_offset = 32
mailbox_index = 26
mailbox_mask = 1024

[target.basis]
can = """
Exact or directly corresponding HCAN functions and literals bind the vector, \
initialization paths, payload, mailbox table, and knock sources; mailbox 26 \
is stock inactive while mailbox 28 is occupied."""
telemetry = """
The aligned target UDS table, direct RAM references, and exact target \
producer-consumer functions bind all 60 schema-2 ECU sources. The normalized \
load snapshot 0xFFFF1034 is the destination of the 0x1C-byte block copy from \
0xFFFF1050 that the scheduler calls at 0x00020F50. The 32 instruction words \
of its producer at 0x0003CACC equal those of the JK08A producer at \
0x0003BD1C; the JK08A literals 0xFFFF1024, 0x00021CE0, 0xFFFF1048, and the \
Base Fuel Schedule reference 0x00009534 correspond to 0xFFFF102C, the \
byte-identical divider 0x00021D6C, 0xFFFF1050, and 0x000095E8. The target \
producer at 0x0003C244 aligns with the JK08A producer at 0x0003B498 and \
stores the Fuel Compensation Main column coordinate 0xFFFF117C at the site \
of its store, and the target stage at 0x000760E4 aligns with the JK08A stage \
at 0x00073948 and stores the requested-torque column coordinate 0xFFFF19E6 \
at the site of its store. Every other JK08A access of either coordinate \
aligns with a target access of the same cell, and the third load of the \
requested-torque coordinator lies at function offset 0x21C in both images."""

[target.hooks.coherent_snapshot_call]
hook = "coherent_snapshot_call/hook"
replacement = "000e0980"

[target.hooks.hcan1_primary_init]
hook = "hcan1_primary_init/hook"
replacement = "000e1510"

[target.hooks.hcan1_recovery_init]
hook = "hcan1_recovery_init/hook"
replacement = "000e1510"

