[[target]]
layout = "1me3b"
status = "supported"
note = """
Mailbox 26 tail-chain type A3 feedback record and five unavailable fields \
require explicit variants"""
feedback_payload_offset = 322
mailbox_index = 26
mailbox_mask = 1024

[target.basis]
can = """
Exact target HCAN1 initialization, SLE1 vector, serializer, mailbox records, \
payload binding, and knock-event path bind the transport runtime."""
telemetry = """
55 of the 60 ECU-RAM fields bind to 1ME3B sources through aligned diagnostic \
tables and reviewed producer-consumer evidence. The two intake solenoid duty \
command fields read the cells 0xFFFE938F and 0xFFFE9390, which hold the high \
bytes of the 16-bit duty words 0xFFFE9692 and 0xFFFE9694 after two scheduler \
copies while bit 2 of ROM8[0x00008576] selects the 16-bit scheme; in that \
scheme the command cells and the live bytes 0xFFFE942B and 0xFFFE942C carry \
x*25/64 percent, within 0.16 percentage points of the x*39/100 wire scale. \
The absent knock timing state, the normalized load snapshot, whose \
32-instruction JK08A producer at 0x0003BD1C has no match in the image with \
PC-relative displacements masked, the knock surface state, whose flag \
occupies bit 7 of 0xFFFE945B outside the wire contract, and the \
requested-torque column coordinate 0xFFFF1980 and the Fuel Compensation Main \
column coordinate 0xFFFF1170, whose target homologs are not traced, are \
encoded from cleared reserved RAM and remain explicitly unavailable in \
metadata."""

[target.hooks.coherent_snapshot_call]
hook = "coherent_snapshot_call/hook"
replacement = "0013d280"

[target.hooks.hcan1_primary_init]
hook = "hcan1_primary_init/hook"
replacement = "0013de10"

[target.hooks.hcan1_recovery_init]
hook = "hcan1_recovery_init/hook"
replacement = "0013de10"

[target.hooks.hcan1_sle1_vector]
hook = "hcan1_sle1_vector/hook"
replacement = "0013d800"

[target.hooks.knock_interval_latch]
hook = "knock_interval_latch/hook"
replacement = "0013d2b0"

[target.hooks.knock_margin_latch]
hook = "knock_margin_latch/hook"
replacement = "0013d600"

[target.hooks.startup_state_clear]
hook = "startup_initializer/hook"
note = "Telemetry clear can chain from the startup literal"
replacement = "0013d2f0"

[target.notes]
feedback_payload_offset = "Target serializer writes the eight payload bytes at base plus 0x142"
mailbox_index = "Target uses physical mailbox 26"
mailbox_mask = "HCAN1 mailbox 26 pending mask is unchanged"

[target.symbols]
coherent_snapshot = "coherent_snapshot/fn"
feedback_config_record_address = "feedback_config_record_address/tbl"
feedback_dispatch_literal = "cruise_feedback_serializer/hook"
feedback_payload_base = "feedback_payload_base/ram"
feedback_payload_base_literal = "feedback_payload_base_literal/const"
feedback_status_byte = "feedback_status_byte/ram"
hcan1_init = "hcan1_init/fn"
knock_channel_alternate = "knock_channel_alternate/ram"
knock_channel_primary = "knock_channel_primary/ram"
knock_count = "knock_count/ram"
knock_function = "knock_function/fn"
knock_mask = "knock_mask/ram"
knock_metric_base = "knock_metric_base/ram"
knock_selector_config = "knock_selector_config/tbl"
knock_threshold_base = "knock_threshold_base/ram"
mailbox_data = "mailbox_data/reg"
mailbox_record_address = "mailbox_record_address/tbl"
occupied_mailbox_record_address = "occupied_mailbox_record_address/tbl"
stock_sle1_isr = "stock_sle1_isr/fn"

