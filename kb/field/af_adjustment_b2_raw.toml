signal = "af_adjustment_states/signal"
source = "af_adjustment_b2/ram"
origin = "ecu_ram"
width = 2
signed = true
context = "secondary_throttle_and_adjustment_b2"
position = 2

[dashboard]
label = "A/F adjustment B2"
digits = 3
group = "Fuel"
panel = "Trims and supply"
panel_label = "A/F ADJ B2"
order = 40
description = """
A/F adjustment of bank 2: the signed correction that the ECU integrates from \
the difference between the target mixture and the A/F sensor 1 mixture, \
bounded to -500..500 counts. The candidate factor 0.002 maps the factory \
running range to -0.33..0.33. Every recording so far reads 0."""
