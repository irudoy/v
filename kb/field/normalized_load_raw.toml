signal = "normalized_load/signal"
source = "normalized_load/ram"
origin = "ecu_ram"
width = 1
signed = false
profiles = ["tuning"]
page = 1
offset = 0x7

[dashboard]
label = "Engine load"
digits = 1
group = "Engine"
panel = "Air and fuel"
order = 40
description = """
Engine load that indexes the ignition and CVTC target maps: the Base Fuel \
Schedule as a ratio to the reference constant of the ROM in steps of 1/128, \
as the ECU computes it for the snapshot. 100 percent is the reference \
schedule, and the value saturates at 199.2 percent. The live value feed \
sends it as VQ Engine Load."""

[dashboard.feed]
key = "load"
name = "VQ Engine Load"
format = "0.00"
minimum = 0
maximum = 200
step = 20
