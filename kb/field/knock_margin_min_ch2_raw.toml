signal = "knock_margin/signal"
source = "can_telemetry.knock_margin_min_ch2"
origin = "telemetry_state"
width = 2
signed = true
scale = """
threshold minus metric in evaluator units, minimum since the previous \
capture of this context; 32767 without an evaluation or for a margin of \
32767 or more"""
context = "knock_margin_channels_1_to_3"
position = 1

[dashboard]
label = "Knock margin ch 2"
digits = 0
unit = "cnt"
group = "Knock"
panel = "Injection and knock"
order = 130
description = """
Smallest knock margin of evaluator channel 2 since the previous capture of \
its context: the knock threshold minus the knock metric, in evaluator counts \
without a physical unit. A positive value is headroom below the threshold, \
and a negative value is an evaluation that the ECU counts as knock. The \
channel number is the cylinder number of the event that opens the knock \
window."""
