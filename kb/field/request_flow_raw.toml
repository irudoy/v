signal = "requested_torque_column/signal"
source = "request_flow/ram"
origin = "ecu_ram"
width = 2
signed = false
profiles = ["tuning"]
page = 0
offset = 0x3

[dashboard]
label = "Requested-torque column count"
digits = 0
group = "Throttle"
panel = "Torque and requests"
order = 30
description = """
A uint16 forward-conversion column coordinate formed from raw \
opening-area-domain counts divided by engine speed. Displayed in stored \
counts. Catalog QH0 Flow Potential at x*0.00152588 percent. The percentage \
remains candidate coordinate presentation and does not claim a measured \
physical flow or a bound source on an unresolved layout."""

[dashboard.feed]
key = "request_flow_count"
name = "VQ QH0 Flow Potential"
format = "0"
minimum = 0
maximum = 65535
step = 4096
