signal = "fuel_compensation_column/signal"
source = "alpha_n_flow/ram"
origin = "ecu_ram"
width = 1
signed = false
context = "long_fuel_trim_map_index_flow"
position = 3

[dashboard]
label = "Fuel-compensation column count"
digits = 0
group = "Fuel"
panel = "Air and fuel"
order = 50
description = """
A byte curve-result coordinate derived from opening-area-domain counts \
divided by engine speed, used by the identified map consumer. Displayed in \
stored counts. Catalog QH0 Flow Quantity at x*0.390625 percent. The \
expression equals 100*x/256 numerically, but the physical quantity and \
reference are not established. The candidate percentage describes the \
retained catalog coordinate presentation, not a physical measurement or a \
universal target-layout consumer identity."""

[dashboard.feed]
key = "alpha_n_flow_count"
name = "VQ QH0 Flow Quantity"
format = "0"
minimum = 0
maximum = 255
step = 16
