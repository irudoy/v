signal = "apc_ignition_command/signal"
source = "apc_output/ram"
origin = "ecu_ram"
width = 1
signed = false
profiles = ["tuning"]
page = 0
offset = 0x6

[dashboard]
label = "APC command"
digits = 0
group = "Ignition"
panel = "Ignition, throttle, and CVTC"
order = 10
description = """
Effective ignition timing command in degrees before TDC, as J1979 PID 0x0E \
reports it: 110 minus the APC byte. It follows the late override of a \
historical Rolling Launch endpoint and the stock modes that move the command \
away from the timing coordinate. A software command, not a measured spark \
angle."""
