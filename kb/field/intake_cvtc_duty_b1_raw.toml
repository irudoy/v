signal = "intake_cvtc_duty_bytes/signal"
source = "intake_cvtc_duty_b1/ram"
origin = "ecu_ram"
width = 1
signed = false
context = "short_fuel_trim_cvtc_duty"
position = 2

[dashboard]
label = "CVTC duty B1"
digits = 1
group = "CVTC"
panel = "Ignition, throttle, and CVTC"
order = 110
description = """
Duty of the bank 1 intake valve timing solenoid, in percent of its PWM \
period; the output that moves the camshaft. A larger duty advances the \
camshaft."""
