summary = """
Coolant-indexed low-speed upper/intermediate-restore RPM threshold in FUN \
00050018. At speed count below 4, RPM above lower table 00012818 and at or \
below this adjusted threshold returns class 2; RPM strictly above it returns \
class 0."""
note = [
    """
The adjusted result is stored in ffff1778 after the same coolant floors and \
runtime offsets as the lower table. The table is always interpolated, but \
every speed-count-4-or-above branch reachable with stock \
ROM8[00008b3f].bit7=0 and ROM8[0000870c].bit7=0 ignores it. It remains a \
live stock calibration for the low-speed class-2 band rather than a moving \
DFCO veto. The moving target-vehicle capture cannot validate this table \
because its selected samples are all above the stock speed boundary. Result \
disposition: inline_comparison.""",
]
level = "code"
role = "table"
access = "explicit"
unit = "RPM"
scale = "x*25"
to_raw = "x/25"
scale_level = "code"

