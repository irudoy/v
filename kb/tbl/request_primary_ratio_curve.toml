summary = """
The interpolated uint16 output is written to ffff19a2 and used as a \
zero-protected divisor for call 00021bbc in the seven shown consumers."""
note = [
    """
Range 1024..1884, monotonic decrease toward 1024, an implicit normalized \
axis, and use of the result as a divisor are consistent with two catalog \
variants of Torque Converter Torque Ratio Table. Code proves the full chain \
to arithmetic consumption but does not identify the physical input ratio or \
consumer quantities, so the claim and scale remain candidate. The artifact \
has no separately addressable axis. Blocking condition: The trace stops at \
00021bbc: consumers 00074b04, 00075306, 000718d8, 00071a10, 00071b7e, \
0007654c, and 000ceabc prove use of ffff19a2 as a zero-protected divisor, \
but the artifact does not link the numerators or division results to torque \
and torque-converter speeds. Physical semantics and multiplier 0.000976563 \
are confirmed only by the catalog. Promotion rejected: Attribution is \
supported by the machine chain: 000751f6 loads address 00015770 into r4, \
000751fc calls table wrapper 000263f4, 00075200 copies return value r0, and \
00075204 writes a word to ffff19a2. The table-wrapper call and reads of \
adjacent uint16 cells at 00026aa0 and 00026aa2 confirm role=table. \
Disposition=consumer is supported by the structural set of seven ffff19a2 \
readers. The promoted semantics and its code evidence are disproven: the \
kernel listing ends immediately after reading two cells and does not show \
interpolation arithmetic through r0, while machine listings for the seven \
consumers are absent. Because of the nonstandard register contract, the \
shown C pseudocode does not reconstruct arguments to 00021bbc by itself. In \
five pseudocode listings, ffff19a2 appears only in a zero test, while in \
00074b04 and 0007654c it appears in neither pseudocode nor expression \
tables. Those two functions show 000224fa before 00021bbc, so the artifact \
does not establish whether the divisor is the raw output, its shifted \
derivative, or another quantity. A complete machine trace for all seven \
consumers is absent. No separate scale or scale evidence is claimed. Result \
disposition: consumer.""",
]
