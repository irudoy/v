summary = """
Normal Q7 ramp-rate coefficient for signed request state ffff19da. FUN \
0007584e adds floor(raw*(ffff1798-ffff1794)/128), then applies the RPM-row \
baseline from 0xe98e and upper saturation."""
note = [
    """
The stock raw value 200 is coefficient 1.5625 per scheduler pass. It applies \
when fast mode is inactive or nonpositive-ramp latch ffff24a3.bit2 is set.""",
]
