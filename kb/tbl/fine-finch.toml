The lookup by uint8 ffff106f is the first cascade multiplier: together with \
the centered result from 000121ae, it forms ffff152d, after which 000121ce \
forms ffff152c. Normalizations >>13 and >>7 apply to composite expressions. \
The implicit RAM axis does not create a separate Axis row; the physical \
quantity is unknown.""",
