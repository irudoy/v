summary = """
Unsigned 1D table of the first multiplier in a cascaded calculation: \
t=lookup(000121e6,u8[ffff106f]); \
q1=min(255,floor(max(0,8192+(lookup(000121ae,u8[ffff106f])-64)*u8[ffff10bf])*t/8192)) \
is written to ffff152d; \
q2=min(255,floor(lookup(000121ce,u8[ffff11b3])*q1/128)) is written to \
ffff152c."""
note = [
