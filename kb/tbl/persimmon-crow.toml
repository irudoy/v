summary = """
Runtime-byte-indexed raw factor in the paired P0101/P010B MAF \
range-performance composite. It is multiplied by factors from 0001236a and \
00012868 before the per-bank model threshold and event snapshot are formed."""
note = [
    """
Both monitors index the implicit eight-point table by uint8[ffff10f5], write \
the result to ffff183a, and consume it in min(255, floor(M*A*B/16384)). \
Stock ROM8[00008d92].bit5 is set, so the resulting threshold comparison is \
bypassed; the composite remains present in captured P0101/P010B event \
context. Result disposition: diagnostic_snapshot.""",
]
level = "code"
role = "table"
access = "explicit"
unit = "raw"
scale = "x"
to_raw = "x"

