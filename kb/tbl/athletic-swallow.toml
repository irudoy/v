summary = """
Implicit eight-point byte-correction table, the first of the two curves of \
accessor 00068cb8. The accessor combines the linearly interpolated result of \
this map with that of a stack copy of the eight-byte curve 000237ac as \
(lookup@00068d08 + lookup@00068d3a - 128)*8 and writes the value as signed16 \
to ffff2018. Consumer 00068d58 adds the correction to the result of unsigned \
division 00021ce0, constrains the sum to range 125..(u16[ffff201a]-125), and \
writes the result to ffff201e."""
note = [
    """
The physical name and unit of the quantity are unknown. Code does not define \
a single decoding scale for an individual cell: offset 128 applies only to \
the result of the second curve 000237ac, while multiplication by 8 occurs \
after the two results are added. The map has no addressable axes, so axes is \
empty. Index: Implicit 1D-8 with a byte selector and linear interpolation: \
for selector <224, 00026370 passes calculation to 00026a80/00026740; for \
selector >=224, it returns cell 7. Site 00068d08 uses \
min(255,u16[ffff1024]>>7), the arithmetic right shift by 7 of 000224f8; the \
lookup of the second curve at site 00068d3a uses \
clamp(u16[ffff2020]-144,0,255). Result disposition: consumer (ffff2018 -> \
00068d58 -> ffff201e).""",
]
