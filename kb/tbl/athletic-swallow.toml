summary = """
Implicit eight-point byte-correction table. The accessor combines two \
linearly interpolated results of this map as (lookup@00068d08 + \
lookup@00068d3a - 128)*8 and writes the value as signed16 to ffff2018. \
Consumer 00068d58 adds the correction to the result of unsigned division \
00021ce0, constrains the sum to range 125..(u16[ffff201a]-125), and writes \
the result to ffff201e."""
note = [
    """
The physical name and unit of the quantity are unknown. Code does not define \
a single decoding scale for an individual cell: offset 128 applies only to \
the second lookup result, while multiplication by 8 occurs after the two \
results are added. The map has no addressable axes, so axes is empty. Index: \
Implicit 1D-8 with a byte selector and linear interpolation: for selector \
<224, 00026370 passes calculation to 00026a80/00026740; for selector >=224, \
it returns cell 7. Site 00068d08 uses the byte after an arithmetic right \
shift by 7 through 000224f8; site 00068d3a uses \
clamp(u16[ffff2020]-144,0,255). Result disposition: consumer (ffff2018 -> \
00068d58 -> ffff201e).""",
]
