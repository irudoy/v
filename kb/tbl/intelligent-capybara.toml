summary = """
Unsigned Q8 new-value mixing weight: k -> ffff2ff8; new=u16(ffff2c80), \
old=u8(ffff2c7e), b=floor((k*new+(256-k)*old)/256). If new > b and b == old, \
b increments by 1; min(255,b) -> ffff2c7e. Physical meanings of the mixed \
values are unresolved."""
note = [
    """
Identity confidence: candidate. The map load and axes 00011a51/00011a45 bind \
00009eca to 4x4 uint8 wrapper 00026084; 0007a278 zero-extends the result and \
0007a27e stores the same coefficient byte. Region 0007a280..0007a2b4 \
includes Q8 mixing, conditional progress, saturation, and the byte sink. \
Stock coefficient 0 permits a +1 update when new > old; coefficient 1 with \
new=1 and old=0 also produces 1. The regression gate executes \
exact/end-point lookup and the mixing region, with upstream row and \
new-value calculations outside it. Scale confidence: code. The coefficient \
is k/256 with complement (256-k)/256; progress and saturation act on the \
mixed result, not the coefficient.""",
]
