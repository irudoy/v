summary = """
Q10 blend gain between the filter value from function entry and dynamic \
speed threshold ffff1796. FUN 0007584e stores clamp_u16(S_entry + \
floor(raw*(D-S_entry)/1024)) in ffff1798; first-pass initialization uses the \
newly initialized filter as S_entry."""
note = [
    """
The stock raw value 76 is gain 0.07421875. Request-rate terms compare the \
resulting blend with the newly stored speed filter, creating an exact \
one-sample split during transients.""",
]
