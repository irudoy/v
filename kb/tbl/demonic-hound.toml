summary = """
Stock-disabled two-dimensional centered correction surface in FUN 0007b3f4. \
In the alternate branch its uint16 interpolation result is converted to \
signed raw by subtracting 32768 and written to ffff35d0 before a bounded \
combination publishes ffff35d2."""
note = [
    """
Stock ROM8[000083c1]=0x2c has bit 1 clear. Sites 0007b3fe..0007b40e \
therefore copy ffff1d26 directly to ffff35d2 and bypass the map block. Every \
map cell is 0x8000, which would decode to zero if the branch were enabled. \
Result disposition: dead_control_flow. Result target: ffff35d2 receives \
ffff1d26 in unmodified JK08A. The physical correction quantity and \
engineering unit remain unresolved.""",
]
