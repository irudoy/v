summary = """
Eight-point uint8 table of the base operand for a branching saturating \
calculation: the interpolated value is used as a minuend or first addend, \
after which the derived result is constrained to range 0..255."""
note = [
    """
The physical quantity and subsystem are unknown. The lookup result has no \
direct RAM sink: it is consumed in registers within FUN_0004afdc. The \
derived saturated byte is written to ffff12db at 0004b2d2. On one branch, \
the lookup of map 00011f1a and byte ffff1842 are subtracted from the value \
with a lower cap of zero; on another, the lookup of map 00011f22 is added \
with an upper cap of 255; on the remaining branch, ffff1842 is subtracted \
with a lower cap of zero. Index: Implicit eight-point axis by unsigned byte \
ffff106f: raw nodes 0, 32, 64, 96, 128, 160, 192, 224. For x < 224, the \
index is x/32 with the remainder discarded and interpolation fraction \
(x%32)/32; for x >= 224, cell 7 is selected. Result disposition: consumer \
(FUN_0004afdc: inline arithmetic sites 0004b186, 0004b1c8, 0004b1e4).""",
]
