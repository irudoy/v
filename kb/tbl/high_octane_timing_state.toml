summary = """
High-octane hot timing-state surface. It supplies active sample ffff160f \
when ffff2466.bit6 is clear and remains reference sample ffff1610 when that \
selector is set. Coordinator 000493e8 also looks it up independently for the \
conditional signed Q8 difference against 0x9B1A."""
note = [
    """
The physical name matches homolog EV18A 0x9a76. The low-seven field is a \
crank-degree adjustment added to the computed base angle ffff23f1, not a \
direct absolute spark angle; coordinator 000493e8 also forms the conditional \
signed Q8 difference against 0x9B1A from the same field. The unit closure is \
the arithmetic chain to the J1979 PID 0x0E coordinate: \
ffff23bd=max(low7-ffff11af,0) at 0004af84; \
ffff1830=clamp_s8(ffff23f1+ffff23bd-ffff23c5-ffff12dc-ffff15ea-128+ffff1a7d+ffff134a) \
at 0004bee2, where ffff1a7d is centered at 64 so the map field enters as \
low7-64 beside base angle ffff23f1; ffff2404=ffff1830 at 0004c17a; scheduler \
00020dfe copies ffff2404 to snapshot ffff2378 at 00021314..00021318; \
ffff12d6=clamp_s8(ffff2378+ffff11d6+ffff2356-ffff1ff6) at 0004db8c; \
ffff11da=clamp(ffff12d6+gated ffff564c,-7,50) at 0004dcf6; the rate-limited \
and bounded result is ffff11d4 at 0004df64, which PID 0x0E publishes as \
A/2-64 degBTDC. Every coefficient is 1, so one raw count is one crank degree \
while the field stays above threshold ffff11af, and raw 64 is the zero \
adjustment. The physical spark angle remains a hardware item.""",
]
