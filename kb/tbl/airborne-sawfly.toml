summary = """
Negative-contribution coefficient for the positive branch of signed \
difference u16[ffff11bc]-u16[ffff11be]: the raw map byte multiplies the \
positive difference, and the result is negated, divided by 4, and saturated \
to int8."""
note = [
    """
Code confirms the lookup and write of the raw byte to ffff15c9. \
Decompilation associates the result with the negative contribution on the \
positive branch of the difference, but the machine listing for region \
0004d0ba..0004d0cc is absent and ffff15c9 has no readers. Therefore, \
semantics and confidence remain candidate; zero content is not evidence.""",
]
