supports = "homology"
at = "1me3b:000786ca"
to = "jk78c:00015ae2"
note = """
Target function 00078560 runs the program of JK78C 000690ac \
(event_timing_correction_builder): the same bounded event-retard limit \
words, the subtraction amplitude lookup and, behind the ROM gate that JK78C \
reads at 00008968 bit 7, the implicit 8x8 upper-bound lookup. 1ME3B lacks \
the clamped branch that JK78C runs while ROM byte 00008965 bit 5 is clear \
and adds one lookup before the amplitude lookup. It is the subtraction \
amplitude curve. MOV.L 000786ca loads this table, which reaches the call at \
000786ce (helper 0002aeac) in r4, as MOV.L jk78c:000691be loads 00015ae2, \
which reaches the call at jk78c:000691c6 (helper 000282f4) in r4. Its 16 \
stock bytes equal JK78C."""

