multiplied by the result of 000126a0, and participates in calculating \
ffff1657. 0004bb6a subtracts ffff1657>>4 from the sum ffff22f8+ffff22fe and \
writes constrained byte ffff23c5. Zero content is not used as semantic \
evidence.""",
