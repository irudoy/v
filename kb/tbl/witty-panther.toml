output of map 000126a0 and participates with nonnegative difference \
u16[ffff15fc]-s16[ffff15fe] in calculating constrained byte ffff1657; its \
high nibble is subtracted from the sum of bytes ffff22f8 and ffff22fe before \
writing ffff23c5."""
