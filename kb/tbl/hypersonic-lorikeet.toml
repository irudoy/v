summary = """
Second of four ordered Base Fuel Schedule thresholds: the lookup result \
defines the inclusive lower bound of state 1 and exclusive upper bound of \
state 2 for high byte ffff1024; selected state 0..4 is written to ffff2b4b."""
note = [
    """
The lookup result is captured in r11 at 000835e0 and compared in place. Flat \
contents 0xfe are not used as semantic evidence. Exact DID 0x1208 \
establishes the Base Fuel Schedule input identity; x/8 ms is profile-derived \
and requires hardware validation. Index: implicit 1D-16 with \
q=min(2*max(u8[ffff11ae]-8,0),255), interpolation below 240, and cell 15 at \
or above 240. Result disposition: inline_comparison; target sites 0008366e \
and 0008367a.""",
]
