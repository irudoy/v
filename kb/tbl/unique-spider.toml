summary = """
The uint8 result of calling 00026388 with base 00012738 is stored as H. On \
the path guarded by H > L, where L is the result of calling 00026388 with \
base 00012748, code forms H-L and H-U8(ffff16ab), multiplies the second \
difference by K, and passes the product as numerator and H-L as denominator \
to divider 00021bbc. In current JK08A, both maps and their inputs match, so \
H=L and the guarded path is inactive."""
note = [
    """
Code does not distinguish idle and fuel cut/restore loops. Matching contents \
of 00012738/00012748 do not remove their separate address attribution as \
upper and lower bounds. Result disposition: consumer.""",
]
