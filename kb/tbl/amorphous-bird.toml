summary = """
Knock Slice Map: per-evaluator-channel knock threshold by engine speed. A \
calculated metric exceeding the interpolated threshold contributes to \
increasing the knock count."""
note = [
    """
00049ffc selects one of six one-based evaluator rows, interpolates 16 uint16 \
points along axis 0x15340, and stores the threshold for comparison in \
0004a238. Stock rows 3 and 5 are all 0xffff. Value 0xffff is the uint16 \
upper bound and makes exceeding the threshold practically impossible. The \
catalog identifies the rows as cylinders, but exact code does not establish \
their physical cylinder or sensor order.""",
]
level = "code"
role = "table"
access = "direct-row-major"
cols = 16
rows = 6
storage = "uint16"
unit = "knock strength"
scale = "x*0.0015259"
to_raw = "x/0.0015259"
scale_level = "candidate"

