summary = """
Conditionally selected uint8 lookup defines the lower threshold of a \
composite gate: FUN_000a65ca permits the branch only when RAM32[ffff2b80] >= \
RAM8[ffff351a]*2560, where RAM8[ffff351a] is the result specifically from \
map 00012fb6 on its selector branch."""
note = [
    """
The target map is selected when RAM8[ffff106e] >= ROM8[00008730], whose \
first ROM byte is 0x28; otherwise 00012fc6 is selected. All eight cells \
equal 255, so the threshold in the comparison domain is 652800. Threshold \
semantics follow from reading ffff351a, multiplying by 0xa00, and comparing \
in 000a65ca, not from flat content. Numeric round trip: 255*2560=652800; \
652800/2560=255. The physical unit and subsystem are unknown. Index: \
Implicit 1D grid of 8 nodes with step 32. Input u=min(2*RAM8[ffff3510],255). \
For u<224, the kernel takes elements floor(u/32) and floor(u/32)+1 and \
linearly interpolates with fraction (u%32)/32; for u>=224, the wrapper \
returns element 7. Output trace: 00012fb6 -> 000a647c -> 000a6480 -> \
00026370 -> [00026a80 -> 00026740 | direct element-7 read in 00026370] -> \
000a6484 -> 000a648a -> ffff351a -> 000a65ca. Result disposition: consumer; \
Result target: RAM8[ffff351a] -> FUN_000a65ca.""",
]
