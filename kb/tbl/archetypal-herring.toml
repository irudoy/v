summary = """
Unsigned table-derived multiplier in a composite correction: the result is \
stored in ffff2fc0 and enters a product together with ffff2fc1 in consumers \
000474a4 and 0005444c."""
note = [
    """
On the calculation branch, the result moves r0->r2 and is written to \
ffff2fc0; the bypass branch writes 128, and the fault branch takes the first \
byte of 00008995, also 128. Consumers use ffff2fc0 together with ffff2fc1. \
Normalizations >>14 and >>21 apply to joint products and do not assign Q \
bits unambiguously to individual multipliers. The multiplier role therefore \
has code confidence, while individual scale x/128 remains candidate. The \
correction's physical purpose is unknown.""",
]
