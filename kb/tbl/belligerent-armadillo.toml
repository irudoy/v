summary = """
Multiplier on nonnegative branches of two channels: interpolated uint16 M is \
multiplied by a separate uint8 coefficient, and the product is saturated to \
0xffff or divided by 128."""
note = [
    """
The table is selected only for nonnegative param_1 elements; the negative \
branch uses adjacent 000153a0. Its result is multiplied by an 8-bit table \
result, compared with a saturation threshold, and shifted right by 7 on the \
unsaturated path. This conditional dynamic conversion is not a standalone \
map scale. All eight cells are zero, which does not prove a physical role. \
Catalogs give several classes of the same shape and no match to a documented \
flat value. Result disposition: consumer. No physical quantity is asserted \
beyond narrow operational semantics.""",
]
