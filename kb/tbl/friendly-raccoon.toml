Conditional source of an initial raw value: when state is zero, interpolated \
uint16 M is multiplied by 1071, divided exactly by 1071, and written \
unchanged to ffff4064; the product is also stored in ffff8c54."""
note = [
    """
Code confirms the operational role as a conditional initial-value source, \
but the physical quantity is unknown. On the target branch, the uint16 \
result is multiplied by 0x042f; the product is written to ffff8c54 at \
00060944. At 0006095a, 00021ce0 divides the same product by 0x042f. Over \
range 0..4000, the product fits uint32 and divides without remainder, so the \
original interpolated uint16 is written to ffff4064 at 00060964. Name and \
scale are catalog candidates only. Round trips for the pair on observed \
values: 4000 -> 1.952 -> 4000; 10 -> 0.00488 -> 10. Result disposition: \
writes. No physical quantity is asserted beyond narrow operational \
semantics.""",
]
