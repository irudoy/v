summary = """
Fuel-level-derived EVAP coordinate and sentinel curve. FUN 0003dac6 indexes \
it by a filtered and scaled 10-bit CAN field from the meter, writes the \
uint16 result to ffff282e, and the periodic runtime snapshot publishes it as \
ffff272a. EVAP consumers interpret the high byte as either a signed \
operating-window value or an unsigned coefficient-curve coordinate."""
note = [
    """
FUN 000c456c decodes the meter CAN payload field into ffff3e24. FUN 0003dac6 \
forms min(65535,floor(39680*uint16[ffff3e24]/1024)), conditionally tracks it \
through ffff3e26 and low-pass state ffff27fc, and passes ffff27fc only when \
result-state predicates for indices 0x14a, 0x45 (P0461), 0x46 (P0460), and \
-1 are all clear; otherwise it passes zero. The reset path also passes zero. \
Scheduler FUN 00020dfe copies ffff282e to ffff272a through the 0x104-byte \
block snapshot. Whole-program p-code scans found the two writes at ffff282e \
and seven reads of ffff272a in FUN 000ae5a4, 000af076, 000b2096, and \
000b3a54. FUN 000b2096 uses uint16[ffff272a]>>8 to index EVAP coefficient \
curves 0001259a/000125a2/000125aa; stock ROM8[0000893f]=0xc0 selects \
000125aa, whose last cell is 133. All 16 cells of 00014bca equal 65535, so \
the current and snapshot result are always 0xffff, the signed high byte is \
-1, and the unsigned high byte is 255 in stock JK03A and JK08A. This \
sentinel fails EVAP range gates that require a nonnegative signed high byte \
and selects the terminal coefficient cell. The engineering conversion of the \
fuel-level coordinate remains unresolved. Result disposition: consumer.""",
]
