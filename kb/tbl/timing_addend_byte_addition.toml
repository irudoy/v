summary = """
Conditional 1D table of an unsigned addition: lookup(00011f22, x) is added \
to lookup(00011f12, x), the sum is upper-saturated at 255, and the composite \
value is then written to RAM ffff12db."""
note = [
    """
The lookup result has no separate direct RAM sink: the value is combined \
with the result of map 00011f12, after which the derived sum reaches RAM \
ffff12db. The physical name of the quantity and the unit of input ffff106f \
are unknown. All eight cells equal 0, so in this image the addition does not \
alter the composite result; this does not prove that the branch is \
unreachable. Index: Implicit uniform uint8 axis with step 32: x = \
RAM[ffff106f]; for x < 224, i = x >> 5, Q0.16 fraction = (x & 31) * 2048, \
and table[i] and table[i+1] are interpolated; for x >= 224, table[7] is \
returned. Result disposition: writes (ffff12db).""",
]
level = "code"
role = "table"
access = "explicit"
unit = "raw"
scale = "x"
to_raw = "x"

