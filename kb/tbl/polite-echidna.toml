summary = """
Inverse-weight curve for a vehicle-speed-selected temperature-difference \
term in the P0128 thermostat model. FUN 000b78da converts lookup raw x to \
w=255-min(x,255), combines it with nonnegative model-temperature-minus-IAT \
difference d, a low/high-speed byte coefficient, and nonzero upstream \
parameter P, then writes floor(P*floor(min(floor(d*c/2),65535)*w/255)/250) \
to ffff2f98."""
note = [
    """
Exact inputs are \
d=clamp(trunc0(ffff3348/20000)-50*uint8[ffff2733]+2500,0,32767), \
c=ROM8[000086d2] when coarse speed ffff110e<=2 and ROM8[000086d3] otherwise, \
and P from curve 00015bf0 with zero replaced by one. The map coordinate is \
max(0,65535-floor(20*ROM16[00009292]*ROM8[00008819]/P)). FUN 000b6b5a adds \
ffff2f98 to ffff3228 with uint32 saturation before placing the sum on the \
subtractive side of the P0128 balance. All map and axis cells are zero, \
making w=255. Both speed-selected coefficients and both coordinate constants \
are also zero, so ffff2f98 is always zero in stock JK03A and JK08A while the \
caller remains live. The physical heat-transfer interpretation and the \
engineering meaning of P remain unresolved. Result disposition: consumer.""",
]
