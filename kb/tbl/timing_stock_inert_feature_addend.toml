summary = """
Stock-inert feature timing-state addend. FUN 0004afdc can select it only \
when ROM8[0000870b].bit0 is set and uint16[ffff2318] is strictly below \
0x4000; stock ROM has the bit clear and the application lifecycle fixes the \
word at exactly 0x4000."""
note = [
    """
Initialization function 000593ac writes 0x4000 to ffff2318 at 000593da, and \
a whole-application p-code census found no other writer. Either stock \
condition independently prevents selection. The eight stock bytes are \
identical to default map 00012196, but reachability does not depend on that \
identity. The map remains hidden from working definitions. A2L Idle Timing \
(Lean) vocabulary is provenance only. The alternate compositor branch of \
0004bdc2 forms ffff1830=clamp_s8(ffff1a7d+ffff23ee-ffff23c5-64) at 0004be82 \
and shares the ffff2404 -> ffff2378 -> ffff12d6 -> ffff11da -> ffff11d4 \
chain of coefficient 1 with the low-seven surfaces, and J1979 PID 0x0E \
publishes ffff11d4 as A/2-64 degBTDC, so one count of this map is one crank \
degree of the declared coordinate.""",
]
level = "code"
role = "table"
access = "explicit"
unit = "deg"
scale = "x-128"
