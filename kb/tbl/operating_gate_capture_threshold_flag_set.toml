title = "Operating gate capture threshold flag set"
summary = """
Alternative capture-threshold curve selected when raw flag ffff5c0e is \
nonzero. The lookup and multiplication by 64 share the default curve's path; \
zero stock values do not establish absence or inactivity."""
note = [
    """
Known BFS, coolant, battery-voltage and final-timing inputs retain their \
tracked conversions. The enclosing physical subsystem, invocation period and \
other input quantities remain unresolved. Curve-output conversions require \
separate qualification. Native editor class (issue #129): stock-inactive on \
1ND and 1ME3B. The capture accumulator 1ND 000ddf52 / 1ME3B 000e8fda tests \
bit 0 of operating_gate_capture_feature_flags (ROM8 1ND 0001af22 / 1ME3B \
0001affa) at 1ND 000ddfbc / 1ME3B 000e9044. The stock byte 0xf0 on every \
image clears that bit, so the capture comparison and its flag updates do not \
run; the accumulator has no other consumer.""",
]
