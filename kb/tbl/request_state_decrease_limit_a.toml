summary = """
Unsigned 1D table of quantity m that limits reduction of state ffff17c0. \
When t<p and bit 0x20 of register ffff2458 is clear, code writes 0 for p<m, \
otherwise max(t,p-m); p is previous ffff17c0, and t is uint16-saturated \
value uVar10<<3. On the other branches, m does not affect the write."""
note = [
    """
The map is selected when the low byte of uVar8 lies within inclusive range \
PTR_DAT_00074fb8[1]..PTR_DAT_00074fb8[0]; the other branch uses adjacent \
00014314. The lookup result is copied r0->r6 at 00074f48 and compared with \
previous ffff17c0 at 00074f70. ffff17c0 has no external readers, but the \
write is reachable. The physical quantity and unit are unknown. Index: \
implicit 1D-8 uint16; idx=(ffff1210<<7)&0xffff when ffff1210<0x0200, \
otherwise idx=0xffff; 000263d8 returns element 7 for idx>=0xe000, otherwise \
calls 00026a60 and linear finisher 00026740. Output trace: 00014304 -> \
00074e4e -> 00074f36 -> 000263d8 -> (00026a60 -> 00026740 for idx < \
0000e000; direct element 7 in 000263d8 otherwise) -> 00074f48 -> 00074f70 -> \
ffff17c0. Result disposition: writes; Result target: ffff17c0.""",
]
