summary = """
Dimensionless Q7 multiplier on the nonnegative branch of two-channel \
calculation 0005fdb0: result 00014c9a is scaled as \
min(0xffff,floor(value*x/128))."""
note = [
    """
0005fe54 is the delay slot of the adjacent map call and writes the \
not-yet-replaced result of 0001221e to ffff8c0d. On nonnegative branches, \
the byte is multiplied by the uint16 result of 00014c9a; four SHLR2 \
operations and one SHLR divide by 128. Threshold 0x007fff80 implements \
product saturation. All cells equal 128, so the coefficient is 1 for any \
index. The physical quantity is unknown.""",
]
