summary = """
Eight-point uint8 table of a centered signed value. The lookup result is \
decoded as x-128, constrained to range -16..15 when bit 0x40 of RAM ffff249f \
is set, or replaced with zero otherwise, then written as a byte to RAM \
ffff15c8. The physical quantity is unknown."""
note = [
    """
All 8 cells equal 128, so the lookup yields 128, decoding yields 0, the \
clamp does not change the result, and with the enable bit clear the same 0 \
is written. The artifact has no external readers of ffff15c8; this remains a \
write rather than a proven dead branch. The physical quantity is unknown. \
The scale applies to the value before the clamp. Numeric round trip: 0 -> \
-128 -> 0; 128 -> 0 -> 128; 255 -> 127 -> 255. Index: Implicit uniform \
eight-point axis. q=min((u16 RAM[ffff1152] / 8),255). For q<224, the kernel \
obtains the adjacent uint8-cell index with five right shifts of q and passes \
the cells to unsigned linear interpolation with a Q0.16 fraction; for \
q>=224, the wrapper returns cell 7. Bit 0x40 of RAM[ffff249f] enables the \
lookup. Output trace: q<224: 00013016 -> 00076404 -> 00076408 -> 00026370 -> \
00026a80 -> 00026aac/00026aae -> 00026740 -> 0007640c -> 00076410 -> \
00076412 -> 00076416/00076422 -> 00076434 -> ffff15c8; q>=224: 00013016+7 -> \
00026370 -> 0007640c -> 00076410 -> 00076412 -> 00076416/00076422 -> \
00076434 -> ffff15c8. Result disposition: writes; Result target: RAM \
ffff15c8, byte store site 00076434.""",
]
