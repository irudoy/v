summary = """
7mfk scalar byte supplying the unsigned weight of normal RAM reference \
learning."""
note = """
The normal learner loads this ROM byte at 0004a1a4 and EXTU.B supplies W. \
Its coefficients are W and 255-W before unsigned weighted-word division by \
256. Forced reset does not read this scalar. Generic storage facts do not \
prescribe a stock value, calibration policy or physical time constant."""
block = "knock/block"
cols = 1
rows = 1
storage = "uint8"

[[symbol]]
layout = "1me3b"
address = "000087ab"

[[symbol.evidence]]
kind = "l0"
supports = "homology"
at = "1me3b:000728a6"
to = "jk78c:00008726"
note = """
Target function 0007285e runs the program of JK78C 000639a4 \
(knock_reference_learning): when bit 7 is clear in both diagnostic bytes \
fffed817 and fffed84a (JK78C ffff6231 and ffff6264), the eight reference \
words of the selected bank move toward the current words with the byte \
weight, rounded up and capped at 0xffff; otherwise the reset word fills all \
three banks. Its 97 mnemonics equal 1ND 0006e956. MOV.L 000728a6 loads this \
table, as MOV.L jk78c:00063a2a loads 00008726. Its 1 stock byte equals \
JK78C."""

