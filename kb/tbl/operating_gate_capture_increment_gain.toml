title = "Operating gate capture increment gain"
summary = """
Unsigned gain applied to raw bfs/ram at ffff102e (ms = raw/2048). Multiply \
the raw BFS word by this byte and shift right eleven, yielding \
floor(gain*BFS_ms). The retained low word multiplies the same-pass inverse \
feedback ffff4332 of operating_gate_weighted_accumulator and 91 before \
unsigned division by 2213 and uint16 saturation."""
note = [
    """
Known BFS, coolant, battery-voltage and final-timing inputs retain their \
tracked conversions. The enclosing physical subsystem, invocation period and \
other input quantities remain unresolved under issue #110. Curve-output \
conversions, editor publication and later-layout counterparts require \
separate qualification.""",
]
