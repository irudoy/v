summary = """
Normal-mode initializer H and direction threshold for Q12 accumulator \
ffff33a8. H < target T from map 00013182 selects addition of step S; H >= T \
selects subtraction, and initialization writes H << 12."""
note = [
    """
The output is saved at 000626c4, compared with target T at 00062738, and \
shifted left by 12 on the initialization path at 00062788-00062796. Maps \
00013182 and 000131a2 are byte-identical in stock JK08A, so the comparison \
selects the subtraction branch when reached. The dedicated scale fixture \
binds independent SHA locks and fixed instruction/literal spans for JK00A, \
JK03A, JK03B, JK08A, JK00C and JK00D; it executes actual exact/end-point H \
lookup, normal Q12 initialization, no-floor extraction, C1 word publication \
and signed word read/copy. In the integer linear domain 4074..10626 the \
initialized component equals nominal 10*H-73500; separate 4073/4074, \
10626/10627 and raw-extrema witnesses check signed saturation of selected \
count N. Publication follows stock GBR: ffff8d6c at home and ffff8d7c on \
JK00C/JK00D. Executed retained-state, alternate/save and restore \
counterexamples disprove a universal H-to-component relation. \
Nonzero-fraction explicit-axis paths and optional floor are excluded, and \
the local component is not a final actuator output. The engineering scale \
remains candidate and identifies no physical unit; the nominal inverse is \
limited to its integer grid, not saturated publication. Result disposition: \
inline_comparison and writes. Result target: comparison 00062738 and Q12 \
accumulator ffff33a8 at 00062796.""",
]
