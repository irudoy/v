summary = """
Coolant-indexed held-request RPM threshold in DFCO request evaluator FUN \
0004fbe2. Exact stock branch logic selects it after upstream DFCO mode bit 5 \
is already present in both current snapshot ffff2458 and previous snapshot \
ffff245a, subject to additional runtime gates."""
note = [
    """
The comparison is strict RPM/25 > threshold. The Nissan A2L registry labels \
this address as the Bosch-family table, but exact JK08A code interpolates \
and selects it dynamically in stock operation. It is not an inactive-family \
calibration. Target-vehicle A/B evidence in patches/hardware-results.toml \
shows that stock request thresholds can coexist with complete suppression of \
the full 0x3f inhibit mask when the restore pair is changed. This table is a \
request gate, not an independently sufficient cut command. Result \
disposition: inline_comparison.""",
]
