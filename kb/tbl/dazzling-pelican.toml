summary = """
Interpolated byte g is written to ffff1767, then scales signed \
uint16[ffff1750] as trunc0(ffff1750*g/100); the saturated int16 result is \
written to ffff1712."""
note = [
    """
Interpolated g is written to ffff1767 and, without a trace break, scales \
signed uint16[ffff1750] as trunc0(value*g/100). The result is saturated to \
int16 and written to ffff1712. Division by 100 defines scale x/100 rather \
than identity x.""",
]
