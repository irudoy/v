of 00008968 in the same way. At 000b2f90 the target reads 00009456 as the \
word gate threshold with +0x32 hysteresis, as JK78C 00096ce0 reads 00009184 \
at 00096d8c. Stock bytes 0064 differ from JK78C ffff and equal 1ND0A; 1ND3B \
