summary = """
Interpolated Base Fuel Schedule threshold for transition of ffff249f bit 0 \
from 0 to 1: while the bit is clear, high byte ffff1024 below the map output \
and ffff25b9 equal to zero allow the bit to be set."""
note = [
    """
The result remains in r12 and is compared in place. Every map cell is zero, \
so the below-threshold branch is unreachable for an unsigned Base Fuel \
Schedule high byte, although lookup and comparison execute. Map 00012984 \
handles the opposite state. Exact DID 0x1208 establishes the input identity; \
x/8 ms is profile-derived and requires hardware validation. The purpose of \
flag ffff249f remains unresolved.""",
]
