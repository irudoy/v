summary = """
Interpolated upper threshold for the disjunction of two absolute differences \
between 16-bit fields: the threshold portion of the branch passes when at \
least one difference is strictly greater than the map output."""
note = [
    """
Interpolated upper threshold for the disjunction of two absolute differences \
between 16-bit fields: the threshold portion of the branch passes when at \
least one difference is strictly greater than the map output. Result \
disposition: inline_comparison. Result target: 000a77d6,000a77de. Machine \
trace: 000a77ba loads an indexed uint8 input; 000a77c0 doubles it, and \
000a77c4/000a77c8 cap the result at 255. 000a77ca loads 00023ddc into r4, \
and 000a77ce calls 00026370 with this base and the input in r5. For input \
<224, wrapper 00026370 transfers execution to kernel 00026a80, where \
00026aac/00026aae read adjacent cells as uint8 and 00026740 performs \
unsigned linear interpolation; for input >=224, the wrapper returns the last \
map cell. Therefore, the result remains within cell range 22..80 up to the \
consumption site. 000a77d2 performs extu.b of the result into r2. In the \
same function, two pairs of indexed 16-bit fields are loaded from \
DAT_000a7838 at offsets 0xd8/0xe0 and 0xcc/0xd0, after which the absolute \
difference is calculated for each pair; they reach the comparison as r14 and \
stack-saved r7. 000a77d6 tests r14 > r2, and 000a77d8 immediately skips the \
downstream checks when true; otherwise 000a77de tests r7 > r2, while \
000a77e0 branches to the exit when false. The map output has no RAM sink: it \
is consumed in place by these two comparisons. Subsequent checks mean this \
disjunction is a threshold prerequisite rather than the sole condition for \
the final action.""",
]
