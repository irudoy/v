summary = """
The interpolated value serves as a nonzero enable condition for state 2: the \
map result is stored in ffff25bf; while processing state 2, result != 0 \
permits the subsequent test battery-voltage raw ffff1188 > 100, while zero \
routes control to the branch that sets state 1. All map nodes are 26..60, so \
a value obtained directly from the map is nonzero."""
note = [
    """
Exact DID 0x1103 identifies ffff1188 as battery voltage. Under the \
source-bound 0.08 V/count conversion, the enabled state-2 branch retains the \
state only above 8.00 V. The physical meaning of input ffff27b5 and the \
state itself remains unresolved. The zero branch cannot be treated as dead \
because code tests a stored RAM byte rather than the direct result in the \
same basic block; ffff25bf has no external readers.""",
]
