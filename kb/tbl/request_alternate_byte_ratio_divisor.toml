summary = """
1D table of a normalization denominator: for interpolated M, when M != 0, \
min(255, floor(uint16(ffff412a) * 255 / M)) is calculated; when M = 0, the \
normalized result is 255."""
note = [
    """
Operational semantics are proven without physically identifying the RAM \
quantities. M is always written to ffff2cfe. When M = 0, a local branch \
forms 255; when M != 0, M is passed in r0 to function 00021ce0 as an \
unsigned divisor, after which the quotient is bounded above by 255 and \
written to ffff2cfd. ffff2cfe has no external readers. The artifact does not \
establish the physical quantities ffff10bc and ffff412a. Result disposition: \
consumer.""",
]
