summary = """
Stock-selected 1D-16 uint8 lookup whose returned raw byte is stored in \
ffff2f8d and used as one multiplier in sat_u16(uint8[ffff2f8d] * \
uint16[ffff3018] * uint8[ffff2f94] >> 14)."""
note = [
    """
ROM8[0000893f]=0xc0 makes the test at 000b20d4 select the 00012282 path. \
Wrapper 00026388 returns cell 15 directly for an input at or above 240; \
below that boundary, kernel 00026a84 selects adjacent uint8 cells and \
finisher 00026740 performs unsigned linear interpolation. Site 000b213c \
writes the result to ffff2f8d. Sites 000b2282 through 000b22a6 read it, form \
the two-multiplier product with ffff3018 and ffff2f94, shift right by 14, \
saturate to uint16, and write the caller-provided result at ffff301c. The \
shared shift does not assign a separate fixed-point scale to either byte \
multiplier, so the map remains raw. Its physical quantity is unresolved. \
Result disposition: consumer.""",
]
