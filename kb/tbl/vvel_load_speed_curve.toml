summary = """
16-point word curve of vvel_load_coordinate_publisher over engine speed \
ffff11a6. The publisher multiplies it by the load fraction ffff310c * \
ffff197a * 2^-30 and stores the product, capped at 25000, at ffff369a for \
00047ce8 and 000518e6, and at the cell corners at ffff3698, ffff3696, \
ffff369e and ffff369c for 000518e6. Stock values are 5352..7194. Its \
physical quantity remains unresolved."""
