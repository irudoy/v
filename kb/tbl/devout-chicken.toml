summary = """
Alternate Q1.7 coefficient selected when ffff420b.bit4 is set. FUN 00069374 \
interpolates this uint16 map by uint16[ffff31dc] over axis 00013798, limits \
the result to 255, writes the low byte to ffff90d0, and applies the same \
K/128 product that writes ffff8f0a."""
note = [
    """
All 16 map cells equal 16 and all 16 axis points equal zero, so the stock \
branch always supplies K=16, or 0.125. Values above 255 would be capped by \
the consumer. The physical subsystem and engineering unit are unresolved. \
Result disposition: consumer.""",
]
