summary = """
Power-of-two divisor table: interpolated uint16 M is used as the divisor in \
floor(256/M), and the low byte of the quotient is written to ffff90cd."""
note = [
    """
Code proves only operational use: interpolated uint16 becomes a positive \
divisor in calculating floor(256/x), after which the low byte is written to \
ffff90cd. Stock points yield 128, 64, 32, 16, 8, 4, 2, 1, but without a RAM \
reader this does not prove a bit-mask role or physical quantity. Conversion \
256/x is not claimed as the map scale: it is consumer arithmetic, so the \
scale fields retain raw identity without confidence. Result disposition: \
writes. No physical quantity is asserted beyond narrow operational \
semantics.""",
    """
Its X axis is the const [[busy-barracuda/const]], which the interpolation \
census gives as the axis of this table. An axis link joins a table to an \
axis meaning only, so this table records the axis through its indexed_by \
dependency.""",
]
