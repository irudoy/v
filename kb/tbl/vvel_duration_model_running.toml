dispatcher reads it for the current code 0xFFFF43F2 and for the previous \
code 0xFFFF4480 and publishes the duration word 0xFFFF122C; the codes 1 and \
3 read 0x00016D14 instead. The path for the bit clear also reads it. Stock \
660..1440 = 33.0..72.0."""
