summary = """
Stock-disabled bank-specific limit for one P0420/P0430 catalyst-monitor \
branch. FUN 000a2ee4 interpolates the table by saturated RPM/12.5 \
engine-speed byte ffff11b2 and writes ffff2b6f[bank]; FUN 000a2f56 \
dispatches the bank DTC only when unsigned metric ffff314d[bank] is below \
that limit."""
note = [
    """
All eight stock cells are zero, so unsigned ffff314d[bank] < ffff2b6f[bank] \
is impossible and this fault branch is dead in unmodified JK08A. Independent \
FUN 000a2254 still dispatches P0420/P0430 from another catalyst-monitor \
result. The physical quantity and unit of ffff314d and the table output \
remain unresolved. Result disposition: dead_control_flow.""",
]
level = "code"
role = "dead"
access = "explicit"

