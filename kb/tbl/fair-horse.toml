summary = """
Unsigned 1D interpolated multiplier table: the lookup result is multiplied \
by the selected byte from ROM 0000990a; the product is conditionally \
step-limited and upper-capped before updating 16-bit state ffff15da."""
note = [
    """
The lookup by transformed uint8 ffff106f is written to ffff15dd, multiplied \
by selected ROM8[0000990a], and updates ffff15da after step limiting and an \
upper clamp. Direct sink ffff15dd has no external readers, but the register \
copy is consumed. The physical quantity is unknown.""",
]
