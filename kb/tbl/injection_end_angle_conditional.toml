summary = """
Conditionally selected end-of-injection angle over the engine-speed axis of \
the base curve. The injection writer interpolates the eight uint16 cells and \
stores 2*min(y, 209) of the interpolated value y, without correction bytes, \
to the end-of-injection word, the delay in 2 crank degrees per count from \
the reference tooth of the scheduled channel to the end of the pulse. A cell \
of x counts ends the pulse 4*x - 590 degrees after the following intake TDC, \
as a cell of JK08A 0001230a does."""
level = "code"
home = "jk78c"
role = "table"
access = "explicit"
cols = 8
rows = 1
storage = "uint16"
unit = "deg after intake TDC"
scale = "x*4-590"
to_raw = "(x+590)/4"
scale_level = "code"

[editor]
name = "End of Injection Angle - Conditional"
category = "Fuelling / Injection"
order = 24
format = "0"
fine = 4
coarse = 20

