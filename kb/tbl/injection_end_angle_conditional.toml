summary = """
End of Injection Angle - Conditional uses the target-local operand at \
00016cac. Its geometry and role correspond to 1ME3B 00016504."""
note = """
FUN_00085600 uses the literal at 00085d6c for the operand corresponding to \
1ME3B 00016504. The display is the nominal cell angle in the firmware crank \
coordinate. The normal event is 110 degrees before compression TDC of its \
indexed cylinder. The injector mask selects the next cylinder, placing the \
reference 230 degrees before its compression TDC and 590 degrees before its \
following intake TDC. The phase origin uses the family Power Balance channel \
assignment. The mechanical offset and injector wiring have no hardware \
measurement. The conditional path uses its interpolation before the shared \
saturation and downstream delay quantization."""

