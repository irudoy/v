title = "State window counter factor curve"
summary = """
Explicit eight-point uint8 factor on 0002463a through 0002829c, shared by \
0007a640, 0007ae5a, 0007b026 and 0007b23c. The coordinate is (uint16(caller \
argument)>>1)&255. Its product with a calibration byte supplies \
qualification counter limits or bounded qualification values."""
note = [
    """
The first three readers form the curve as 0002463a+8; 0007b23c forms the \
same curve as 00024634+14 and the axis as 00024634+6. The first reader adds \
8 in the call delay slot. Caller quantities, invocation periods and a \
conversion of the counters to time remain unresolved.""",
]
level = "code"
role = "table"
access = "explicit"
cols = 8
rows = 1
storage = "uint8"
unit = "raw"

