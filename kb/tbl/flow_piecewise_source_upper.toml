summary = """
High-range branch of a piecewise denominator table: the high byte of \
interpolated uint16 is tested for zero and, when nonzero, used as divisor in \
unsigned quotient (ffff1737 << 8) / value."""
note = [
    """
Code establishes operational rather than physical semantics. The \
interpolation result is quantized as (r0 >> 8) & 0xff, written to ffff1738, \
and used through the same r6 without reading RAM. ffff1738 has no external \
readers, but the flow is not dead: r6 is tested for zero and becomes divisor \
00021ce0 on the nonzero branch; the zero branch forms 0xff. No physical \
quantity or engineering unit follows from this consumption. Loss of the low \
8 bits has no exact inverse, so only raw identity is claimed. Result \
disposition: consumer.""",
]
