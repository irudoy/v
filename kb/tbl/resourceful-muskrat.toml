summary = """
Unsigned scaling-coefficient table. For interpolated byte g, code calculates \
s=min(floor(uint8[ffff2015]*g/128),128), then q=min(2*(128-s),255), and \
passes q as the input to map 00012a02 at site 00062d22."""
note = [
    """
Code proves only operational coefficient semantics, not the physical purpose \
of the source RAM quantities. Values 32..128 correspond to coefficients \
0.25..1.0. After being written to ffff229e, the same value remains in r6, \
scales ffff2015, and participates in forming the adjacent map's input. \
ffff229e has no external readers, so output_disposition remains writes. \
Saturation of the intermediate result to 128 and adjacent-map input to 255 \
is not part of the scale conversion. Result disposition: writes.""",
]
