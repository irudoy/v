summary = """
Fixed-address unsigned K-Value scalar in the 7mfk primary BFS calculation. \
ROM16[0x9284]=26806 multiplies positive signed-tested aggregate Q; split \
fixed-point multiplication and unsigned speed division produce quarter BFS. \
The aggregate is not an index."""
note = [
    """
Exact code establishes the address, uint16 representation, stock value \
26806, MAF-to-BFS position, and multiplicative role. UpRev names this \
calibration K - Fuel Multiplier and states MAF * K = BFS; A2L independently \
names it K-Value and supplies ms/kg. The engineering unit remains \
source-derived pending hardware validation. A2L MAF Factor is a separate \
airflow scalar and is not an alias for this word.""",
]
