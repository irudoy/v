summary = """
Positive-branch coefficient for a difference between two channels: when \
s16[ffff288c+2*i]-s16[ffff4020+2*i]>=0, the lookup result multiplies this \
difference, the product is divided by 100 as unsigned, and the quotient is \
added to 500 before a 16-bit write to ffff40a4+2*i."""
note = [
    """
The physical subsystem is not established by code. All four bytes equal 100, \
so the current calibration gives coefficient 1 over the entire range. The \
lookup result is also written at 0005ad58 to ffff409c+i; the artifact \
contains no external readers of this indexed output. There is no explicit \
ROM axis. The inverse scale is exact on the representable grid with step \
0.01. Index: implicit 1D-4 uint8; c=min(255,2*max(u8[ffff3529+i]-104,0)), \
i=0..1; for c<192, kernel 00026a7c interpolates adjacent uint8 cells through \
Q0.16 finisher 00026740; for c>=192, wrapper 00026358 returns cell 3. Result \
disposition: consumer (site 0005ad5c).""",
]
