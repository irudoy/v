summary = """
Unsigned 8-bit piecewise-linear normalized-BFS limit table: over nodes 0, \
32, 64, 96, 128, 160, 192, 224, the lookup implements y=min(x,224) and \
writes y to RAM ffff17b8; FUN 0004ae6c then multiplies y by uint16 from RAM \
ffff14dc and tests the product for zero, with a zero result selecting \
sentinel 0xffff instead of the main calculation branch."""
note = [
    """
The map has no explicit ROM axis: the index is formed directly from Q7 \
normalized-BFS byte ffff102c, and its identity output preserves that \
representation until saturation at raw 224. The external consumer proves the \
narrow operational role of the result in the zero test, but not the physical \
subsystem or the full arithmetic of subsequent division calls. Index: \
implicit 1D-8: 8 nodes at raw input 0, 32, 64, 96, 128, 160, 192, 224; \
linear interpolation is applied between adjacent uint8 cells, while input \
>=224 selects element 7. Result disposition: consumer (0004ae6c).""",
]
