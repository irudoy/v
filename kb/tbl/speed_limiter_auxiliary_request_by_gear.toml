summary = """
Five-entry offset-binary auxiliary request table. When final limiter output \
is below APP request and ffff1083 is greater than ffff1082, FUN 0007584e \
selects cell min(uint8(ffff1083),4), subtracts 0x8000, and writes the signed \
result to ffff2400."""
note = [
    """
The centered stock values are [1000, 1300, 1300, 1000, 1000]. The physical \
identity of the context bytes, auxiliary request, and downstream consumer \
remains unresolved.""",
]
