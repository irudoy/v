summary = """
Implicitly indexed eight-point threshold for RAM value ffff10c0. At \
00044448, the interpolated lookup is multiplied by 10: if ffff10c0 <= \
10*lookup, bit 3 is set and bit 4 is cleared in RAM ffff24d1; if ffff10c0 > \
10*lookup, both bits are set, when the branch's outer conditions are \
satisfied."""
note = [
    """
The physical quantity and subsystem are unknown. The scale describes only \
conversion of the map byte into the RAM ffff10c0 comparison domain. Numeric \
round trip: 1*10=10, 10/10=1; 50*10=500, 500/10=50. The map comparison acts \
only on the branch enabled by outer conditions involving ffff1071 and \
ffff183c. Index: implicit 1D-8 by v=RAM8[ffff1070]: for v < 224, \
i=floor(v/32), a Q0.16 fraction is defined by the low 5 bits of v, and \
cell[i] and cell[i+1] are interpolated; for v >= 224, cell[7] is returned. \
Output trace: 00012c66 -> site 000420e6 -> call site 000420ec -> wrapper \
00026370 -> for v < 224: kernel 00026a80, cell reads 00026aac/00026aae, and \
finisher 00026740; for v >= 224: cell 7 returned from 00026370 -> site \
000420f0 -> write site 000420f6 -> RAM ffff1958 -> consumer 00044448 -> \
comparison of RAM ffff10c0 with 10*RAM8[ffff1958] -> bits 3/4 of RAM \
ffff24d1. Result disposition: consumer; Result target: site 000420f6 -> RAM \
ffff1958 -> function 00044448 -> bits 3/4 of RAM ffff24d1.""",
]
