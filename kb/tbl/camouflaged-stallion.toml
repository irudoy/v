summary = """
Flat raw uint16 threshold 0xffff for RAM ffff2716: the map result is \
compared with zero-extended ffff2716 and selects an increment for \
accumulator ffff2b80, 0x100 when ffff2716 >= threshold and zero-extended ROM \
byte 00008d2a otherwise."""
note = [
    """
All 16 cells equal 0xffff. ffff321e has no external readers; write 000a658e \
is not the final semantic boundary because the same value remains in r2 and \
is used inline at 000a659a. Neither branch is proven unreachable: when \
ffff2716 == 0xffff, the comparison is true. The artifact establishes no \
physical quantity or unit, so raw identity is used; no explicit ROM axis \
exists. Result disposition: inline_comparison.""",
]
