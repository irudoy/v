summary = """
Primary-channel endpoint B of the Q16 two-surface crossfade in FUN 00070e4c. \
The function interpolates this surface by ffff1210 and ffff10d2, stores the \
result in ffff133c, and applies Q16 weight ffff190e against endpoint A \
0001050e."""
note = [
    """
Every stock cell is zero, so the blend is zero for every weight. The lookup \
executes, but stock ROM8[000089fb].bit3 is clear and the final selector \
always publishes ffff1210 through ffff1332. No crossfade intermediate has an \
external reader. Result disposition: dead_control_flow. Result target: \
ffff1332 receives ffff1210 in unmodified JK08A. The physical quantity and \
engineering unit remain unresolved.""",
]
