summary = """
Shared RPM-dependent raw factor in the paired P0101/P010B MAF \
range-performance monitor. It enters a composite per-bank model threshold \
and the diagnostic event snapshot."""
note = [
    """
Both accessors interpolate the table by RPM/50 byte ffff11ae over axis \
0001238a and store the result in ffff15be. The result is multiplied by \
lookup factors from 00012ac2 and 00012868, divided by 16384, combined with \
per-bank opening-area weights, multiplied by ROM8[000082ba]=128, and written \
to ffff12eb/ffff12ec. Stock ROM8[00008d92]=0x7a has bit 5 set, so both \
monitors bypass the comparison model_byte < threshold. The only stock \
terminal effect is capture of the derived bytes in P0101/P010B event context \
at ffff4566/ffff4567. Result disposition: diagnostic_snapshot; the table \
does not feed fuel, ignition, air command, throttle actuation, or stock \
fault-decision logic.""",
]
level = "code"
role = "table"
access = "explicit"
unit = "raw"
scale = "x"
to_raw = "x"

