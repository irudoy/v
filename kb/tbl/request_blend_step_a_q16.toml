summary = """
Step for changing a dimensionless Q0.16 blend coefficient: the lookup result \
is stored in ffff17f8, then 00074b68 subtracts it from ffff2422 or adds it \
to ffff2422 with limits; 00074c08 applies ffff2422 to linearly blend \
signed16 ffff18e8 and ffff18e6 and writes ffff18f4."""
note = [
    """
The physical subsystem is unknown. The map result is a step, not the final \
coefficient. 00074b68 subtracts the step from ffff2422 or adds it with a \
lower limit and saturation; 00074c08 uses updated ffff2422 as a weight. \
Final weight value 0xffff is handled by a separate branch as full selection \
of ffff18e6. Index: implicit 1D-4; \
coordinate=min(abs(s16[ffff18e6]-s16[ffff18e8])*64,49152); for \
coordinate>=49152 the wrapper returns element 3, otherwise interpolation \
proceeds through 00026a5c/00026740. Result disposition: consumer (00074b68 \
through ffff17f8).""",
]
