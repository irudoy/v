summary = """
First Base Fuel Schedule threshold T0 of a five-range classifier for high \
byte ffff1024: when input >= T0, code 0 is written to selector ffff2b4b; \
when T0 > input, the next threshold is tested for code 1."""
note = [
    """
All 16 cells equal 0xff, so T0=255 for any index. T0 defines only the first \
boundary; subsequent boundaries come from adjacent maps. Exact DID 0x1208 \
establishes the Base Fuel Schedule input identity. The x/8 ms threshold \
conversion follows from the homologous full-word raw/2048 ms profile and \
requires hardware validation. Index: 1D-16 implicit: \
q=min(2*max(u8[ffff11ae]-8,0),255); q<240 uses linear interpolation and \
q>=240 selects element 15. Result disposition: inline_comparison; target \
sites 0008365c and 0008366a.""",
]
