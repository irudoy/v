summary = """
Knock Sensor Circuit Monitor Surface A: the first mode surface in the \
evaluation path for P0327/P0328/P0332/P0333. Output ffff338a scales the \
monitor metric, participates in accumulation into ffff3334, and reaches \
diagnostic state byte ffff4204."""
note = [
    """
The surface is selected when byte[ffff3427] <= byte[0x8796], where the ROM \
threshold is 95. The physical unit of raw and the direction in which \
increasing a cell affects the final DTC verdict are unknown.""",
]
