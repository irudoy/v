summary = """
Unsigned normalized-BFS threshold: uint8 from RAM ffff102c is compared with \
the output of map 00011ede. If bit 7 of RAM ffff2474 is set before the \
comparison, uint8 from ROM 000086ea is added to the sample without sign. If \
the adjusted sample >= threshold, bit 7 of ffff2474 is set; otherwise it is \
cleared."""
note = [
    """
The output uses the same Q7 normalized-BFS representation as ffff102c. \
Result disposition: inline_comparison. Result target: unsigned cmp/hs \
comparison at 0005655c and RAM ffff2474 bit 7 controlled by it. Machine \
trace: 0005652e loads target-map base 00011ede, 00056530 reads its input as \
uint8 from RAM ffff11b3, and 00056534 calls specialized wrapper 00026370. \
For input < 0xe0, the wrapper passes calculation to kernel 00026a80: the \
uint8 path reads adjacent map bytes at 00026aaa/00026aac, then branch \
00026ab4 leads to finisher 00026740 for unsigned linear interpolation. For \
input >= 0xe0, the wrapper returns map[7] directly. All eight map cells \
equal 254, so both paths return byte 254. After return, 0005653a moves r0 to \
r2 and 0005653e writes the low byte to RAM ffff12e7. 00056544 reads uint8 \
RAM ffff102c into r13 and delay slot 0005654a zero-extends it; 00056546 \
tests the previous state of ffff2474 bit 7. If set, 0005654e reads uint8 \
from ROM 000086ea, 00056550 zero-extends it, and 00056552 adds it to r13; \
the sum ranges from 0..510 and does not overflow. 00056558 reads the map \
output again from ffff12e7, 0005655a zero-extends it as uint8, then 0005655c \
executes cmp/hs r2,r13, testing unsigned(r13) >= unsigned(r2). A true result \
branches at 0005655e to set bit 7 at 00056566; a false result clears it at \
00056564. The output of map 00011ede is therefore the normalized-BFS \
threshold for adjusted sample ffff102c.""",
]
