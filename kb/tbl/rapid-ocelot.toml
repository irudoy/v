All eight cells equal 0, so the lookup result is 0 for every input, but flat \
content does not by itself prove the purpose. The map has no separate \
calibration axis. Index: implicit u8: x=RAM[ffff1077]; for x<224, i=x>>5 and \
q=(x&31)*2048 in Q0.16, and the result is linear interpolation of map[i] and \
map[i+1]; for x>=224, map[7] is selected. Output trace: \
0003a76c[00012a3a->r4] -> 0003a76e/0003a774[RAM ffff1077->u8 r5] -> \
0003a772[00026370] -> (x<224: 00026a80 -> 00026aac/00026aae -> 00026ab6 -> \
00026740; x>=224: map[7] in 00026370) -> 0003a776[r0->r2] -> \
0003a780[r2->RAM ffff1f78]; ffff1f78 has no readers. Result disposition: \
writes; Result target: ffff1f78. Evidence boundary: At 0003a780, the result \
is only written to ffff1f78; the artifact contains no read of ffff1f78, and \
0003a750 is a root with no call sites. A machine trace from the sink to a \
physical consumer is absent, so the purpose and physical units are not \
established.""",
