interpolates it by x=uint16[ffff1210] and y selected from ffff10d2/ffff10e2, \
decodes raw-32768, and writes ffff18ee. FUN 00076108 uses weight ffff2420 to \
blend endpoint 0000de8e with this endpoint into ffff18e6."""
