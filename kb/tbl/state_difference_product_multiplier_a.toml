summary = """
Interpolated eight-point uint8 multiplier: the lookup result in the same r2 \
is multiplied by the result of adjacent map 000126a8 from ffff1659, then \
participates in an integer calculation with a nonnegative RAM difference and \
constant 100, followed by a shift, saturation, and a result write to \
ffff1657."""
note = [
    """
The lookup by clamp(uint16[ffff11bc]-0x20,0,255) is written to ffff1658; the \
saved copy is multiplied by ffff1659 from 000126a8 and enters the \
constrained calculation of ffff1657. Direct sink ffff1658 has no external \
readers, but the register copy is consumed. Zero content does not prove dead \
control flow.""",
]
