summary = """
Fast Q7 ramp-rate coefficient for signed request state ffff19da. It applies \
while ffff25b0 is nonzero and ffff24a3.bit2 is clear; the intermediate has \
an additional zero floor before the RPM-row baseline and upper saturation."""
note = [
    """
The stock raw value 1500 is coefficient 11.71875 per scheduler pass. \
Inactive/reset handling loads ffff25b0 with 100 and clears the latch; a \
nonpositive entry ramp sets the latch.""",
]
