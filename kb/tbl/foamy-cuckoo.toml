summary = """
Dimensionless table-derived scaling coefficient: interpolated uint8 x is \
applied to the signed deviation of a byte from 0x80 as multiplier x/100 \
before converting the result to centered Q8"""
note = [
    """
The claim is limited to the mathematical role proven by code, without a \
physical signal name. For target branch param_1=1, the direct uint8 result \
is written to ffff128c+0x036a+1=ffff15f7 at 000c0dec. The same x multiplies \
deviation RAM[ffff1240+param_1]-0x80; expression \
trunc(delta*x*256/100)+0x8000 is limited to the uint16 range and, according \
to pseudocode, written to ffff128c+0x086c+2=ffff1afa. The physical quantity \
of the input byte and readers of these calculated RAM addresses are \
unknown.""",
]
