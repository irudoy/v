summary = """
Frame-by-frame crossfade weight (Q15) between two 1D curves: w -> ffff31c8, \
blend ((0x8000-w)*a + w*b)>>15 in accessor 0007a592; contents are only \
0/0x8000, producing hard branch selection"""
note = [
    """
Frame-by-frame crossfade weight (Q15) between two 1D curves: w -> ffff31c8, \
blend ((0x8000-w)*a + w*b)>>15 in accessor 0007a592; contents are only \
0/0x8000, producing hard branch selection. Result disposition: writes. \
Result target: ffff31c8. Machine trace: 0000d78e:r4@0007a5c4 -> \
00026270@0007a5d4 -> 00026984/00026c78 + 00026848/00026740 -> r0 -> \
r2@0007a5d8 -> ffff31c8@0007a5e0 -> r7@0007a6a2 -> extu.w@0007a6a4 -> \
max(0,32768-r7)@0007a6a6-0007a6ac -> uStack_28*weight@0007a6b2 + \
uVar9*r7@0007a6ba -> sum@0007a6c0 -> >>15@0007a6c2-0007a6ca. Scale \
confidence: code. Scale: x/32768; inverse encoding: x*32768; units: Q15 \
fraction. Scale trace: 0000d78e is loaded into r4@0007a5c4 and passed to \
wrapper 00026270 by the call@0007a5d4; result r0 moves to r2@0007a5d8 and is \
written as uint16 to ffff31c8@0007a5e0. On the map-bypass branch, a separate \
value reaches the same RAM sink, but this does not mix the source on the \
map-execution branch. The consumer loads raw x from ffff31c8 into \
r7@0007a6a2 and zero-extends it@0007a6a4. Constant 0x8000 from pool 0007a7ec \
is loaded into r6@0007a694; code calculates 0x8000-x@0007a6a6 and bounds a \
negative result at zero@0007a6a8-0007a6ac. Target-map values and unsigned \
interpolation results lie in 0..32768, so the bound does not alter 0x8000-x. \
Then a*(0x8000-x)@0007a6b2 and b*x@0007a6ba are added@0007a6c0, the result \
is logically shifted right by a total of 15@0007a6c2-0007a6ca, limited to \
uint16@0007a6cc-0007a6d0, and written to ffff2a7c@0007a6d6. Thus \
y=floor((a*(32768-x)+b*x)/32768), so the coefficient of input b is x/32768 \
and raw range 0..32768 represents fraction 0..1.""",
]
