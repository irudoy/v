summary = """
Engine-speed fuel-cut hysteresis table consumed by0004f282. Bit4 offfff2468 \
selects column0 or1; row0 is inclusive activation and row1 is exclusive \
release. A newly armed stock request loads zero delay and activates in that \
invocation; an already armed nonzero counter waits. Equality at release \
retains active cut. Active stateffff2497.bit2 reaches periodic index27 \
coordinator0004ed88 and contributes full global mask0x3f under its \
independently reviewed producer contract."""
note = [
    """
The active stock 2x2 cells decode to 7650/7450 RPM in column 0 and 7450/4600 \
RPM in column 1. Activation occurs at RPM >= threshold; equality to the \
release value retains cut and release requires RPM below it. \
ROM8[00008b38]=0x63 keeps alternate words 00009356/00009358 outside the \
stock path. The public HR A2L catalog supplies the candidate Normal/Reverse \
column labels. A JK08A vehicle session on 2026-09-21 ran column 0 from the \
Map 3 slot copy, whose release word is 604: eight activations and eight \
releases of the full 0x3f mask bound the compared activation word to 612 = \
7650 RPM and the release word to 604..606 = 7550..7575 RPM, and stock \
release word 596 cannot produce a release whose lower captured RPM word is \
599..603. Column 1 and injector-terminal shutoff remain outside that \
measurement.""",
]
