summary = """
Unsigned eight-point threshold calibration for byte ffff110e. The lookup \
result is written to ffff140f. On the direct branch, bit 3 of ffff247b is \
set if and only if ffff110e > ffff140f. On another branch, ffff110e, \
threshold ffff140f, parameter 2, and the previous state of bit 3 are passed \
to 000259be, and the low bit of the result updates bit 3 of ffff247b."""
note = [
    """
All 8 cells equal 0, so in this ROM the threshold is raw 0 for every input. \
The physical quantity of ffff110e is unknown. The artifact does not contain \
the contract of 000259be, so the internal logic of that function is not \
claimed; the direct comparison branch at 000638b4 independently proves the \
threshold role and relation direction. Index: \
q=min(floor(52429*uint8(ffff10ec)/32768),255); for q<224: i=floor(q/32), \
Q0.16 fraction=(q%32)*2048, linear interpolation of cell[i] and cell[i+1]; \
for q>=224: cell[7]. Result disposition: inline_comparison (ffff140f -> \
comparison with ffff110e at 000638b4; argument 2 of 000259be; result -> bit \
3 of ffff247b).""",
]
