summary = """
Coefficient table for the negative branch of a signed mismatch. When \
d=int16(ffff288c[i])-int16(ffff4020[i])<0, interpolated byte k defines \
dimensionless coefficient k/100; code calculates floor((-d)*k/100) and \
subtracts this correction from base value 500. The physical name of the \
controlled quantity is unknown."""
note = [
    """
The physical subsystem is not established by code. The map is selected only \
on branch d<0, where d=int16(ffff288c[i])-int16(ffff4020[i]). Its result is \
also written as a byte to ffff409c+i at site 0005ad58, but the artifact \
contains no external readers; the direct arithmetic chain provides the \
evidentiary semantics. Flat value 100 means current coefficient 1 but is not \
evidence by itself. Catalog names and default-value matches are not used. \
Index: Implicit 1D-4 axis. For each i=0..1, coordinate \
q=min(2*max(u8[ffff3529+i]-104,0),255). For q>=192, wrapper 00026358 returns \
uint8 cell[3]; for q<192, it passes adjacent-cell selection to kernel \
00026a7c and Q0.16 interpolation 00026740. The artifact has no separate Axis \
claim. Result disposition: consumer (0005ac54 site 0005ad5c and function \
00021ce0 through site 0005ad62; the derived int16 result is written to \
ffff40a4+2*i).""",
]
