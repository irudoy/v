summary = """
Interpolated dimensionless Q0.7 coefficient for scaling the result of map \
000153a0 on branches where the corresponding signed input is negative"""
note = [
    """
Code establishes operational semantics but not a physical signal name. \
Instruction 00060326 is the delay slot of call 00060324 and stores the \
adjacent-map 00012a1a result in ffff8c3d. The target-map result appears \
after return and is written by instruction 0006032c to ffff8c3c. On negative \
branches, it multiplies the result of 000153a0; the product is divided by \
128 and, when exceeding 0x007fff80, saturated to 0xffff. All eight \
target-map bytes are zero. The physical purpose of downstream outputs is \
unknown because accessor registers have no external readers.""",
]
