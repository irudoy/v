summary = """
First channel of a mode-gated paired override. The interpolated uint16 \
result is written to ffff2ffa and, through the override path, to the first \
word of the caller-provided output pair."""
note = [
    """
The mode branch at 00062a34-00062a3c enables the paired lookups. Base \
00014de2 and axis 00013b98 feed the interpolation call at 00062a4c; the \
result is written to ffff2ffa at 00062a58 and reaches the first output word \
at 00062ab6. All map cells and all axis points are zero in stock JK08A, so \
this live override channel publishes zero. The physical quantity and \
engineering scale are not assigned. Result disposition: writes. Result \
target: ffff2ffa and output pair word 0.""",
]
