title = "Configuration-gated multiplier curve of the 1ME3B fallback fuel schedule"
summary = """
Implicit 16-point uint8 curve, step 16, at the high byte of the learned word \
fffed096. When bit 4 of ROM8[0000865c] is clear and bit 2 of ROM8[0000865f] \
is set (stock 0x28 and 0x0c), base_fuel_schedule_producer multiplies the \
fallback result of gainful-mink by out/128 before its 0xffff cap, and \
00083fb8 multiplies the product of fffe862a and swinging-dugong by out/128 \
before y=min(65535,(x*100)>>14). Stock cells rise from 61 to 128, and the \
stock initial value 56000 of fffed096 selects 128."""
note = [
    """
0004eac0 updates fffed096 under the same two ROM bits. 000452c8 derives a \
sample from fffe8d2a, and the function compares uint16(sample << 6) with \
ROM16[000092de]..ROM16[000092dc] (stock 25041..63859). Within that window it \
moves fffed096 toward uint16(sample << 6) with gain min(ROM8[0000830e], \
128)/128 (stock 80/128); while bit 7 of fffed55f is set, it loads \
ROM16[0000957a] (stock 56000) instead. The physical quantity of fffe8d2a, \
and so of the curve input, is unresolved.""",
]
role = "table"
access = "explicit"
cols = 16
rows = 1
storage = "uint8"

