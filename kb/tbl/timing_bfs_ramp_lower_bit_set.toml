summary = """
Calibrated lower normalized-BFS threshold of a linear ramp for RAM ffff1048 \
relative to the 100-percent terminal point of axis 00011ebe"""
note = [
    """
All 16 cells are zero, so this image uses lower threshold 0 for any index. \
Code binds the call to 0001244a: r0 moves to r6 at 0004bca4, is written to \
ffff15ed at 0004bcaa, and is read back into r13 at 0004bcce. At 0004bcd6, \
0004bcde, and 0004bce8, r13 serves as the lower point of the range between \
the map output and terminal cell ROM8[00011ecd]=128 of ignition load axis \
00011ebe. The threshold and terminal cell use the same Q7 normalized-BFS \
representation as ffff1048, making C exactly the 100-percent fixed-reference \
point. The physical process controlled by the ramp remains unknown. There is \
no separate explicit ROM axis for this threshold table. Result disposition: \
inline_comparison.""",
]
