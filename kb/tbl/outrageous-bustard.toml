summary = """
Unsigned table-derived multiplier in the calculation of ffff1349: min(255, \
floor(interp_u8(00011efa) * uint16[ffff1900] * min(255, \
interp_u16(000147ca)) / 500000))."""
note = [
    """
The 00011efa result is written to ffff134b, read again inside 0004afdc, and \
enters a proven three-factor arithmetic chain. All eight cells equal 100, so \
the current image uses constant raw multiplier 100. The derived byte enters \
the subsequent 0004afdc summation, but the physical name and unit of the map \
itself are unknown. Matching value 100 with 'Throttle cut before fuel cut' \
remains a pattern.""",
]
level = "code"
role = "table"
access = "explicit"

