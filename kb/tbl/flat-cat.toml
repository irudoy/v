summary = """
Endpoint B signed surface for a conditional Q0.16 blend. FUN 0007604c \
interpolates it by x=uint16[ffff1210] and y selected from ffff10d2/ffff10e2, \
decodes raw-32768, and writes ffff18ee. FUN 00076108 uses weight ffff2420 to \
blend endpoint 0000de8e with this endpoint into ffff18e6."""
note = [
    """
The two endpoint surfaces are identical in stock JK08A, so their Q0.16 \
weight cannot change the result when the path is enabled. Stock \
ROM8[000089fa].bit5 is clear and disables the evaluator path. Code proves \
the conditional signed endpoint and blend role. The physical quantity and \
engineering unit are unresolved. Result disposition: conditional consumer; \
inactive under the stock ROM gate.""",
]
