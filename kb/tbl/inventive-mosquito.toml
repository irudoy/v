summary = """
Fallback value for two internal accumulators: when the current value is \
zero, interpolated uint16 M is converted to 255*M and written to ffff4058 or \
ffff9358."""
note = [
    """
Both proven paths use the table as a fallback only when the current value is \
zero. After interpolation, the uint16 result is converted exactly to a \
32-bit internal representation by multiplying by 255. All eight cells in the \
current image are zero, but this does not prove a physical role. Consumers \
ffff41a1 and ffff423e belong to other accessor writes and are not linked by \
code to the target map. Result disposition: writes. No physical quantity is \
asserted beyond narrow operational semantics.""",
]
