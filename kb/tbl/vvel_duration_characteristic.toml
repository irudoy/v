summary = """
Monotonic duration characteristic of the VVEL duration ratio correction. \
FUN_00055E78 looks up this curve with its lookup duration x512, clamped \
below 128.0, over the axis 0x00017004 and stores the value at 2^-18 per \
count in 0xFFFFA0D8. FUN_00055F2C and FUN_00055FF2 each clamp the ratio \
0xFFFF365A / max(0xFFFF3332, 1) to their own bounds, scale the curve value \
by it, and look up the axis 0x00017004 over this curve to obtain a corrected \
duration. FUN_00055F2C clamps to ROM16[0x921E] .. ROM16[0x9220] * 2^-13 = 0 \
.. 0, so its corrected duration is the first axis point 25.0; FUN_00055FF2 \
clamps to ROM16[0x9222] .. ROM16[0x9224] * 2^-13 = 65535 / 8192 for both \
bounds, so its corrected duration has 7.9999 times the characteristic of the \
lookup duration, capped at the last axis point 95.0. The stock cells rise \
from 1016 to 38435 and hold 38435 from the eleventh point (73.0)."""
