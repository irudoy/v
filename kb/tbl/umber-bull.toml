summary = """
Standstill exhaust-VTC override target. While ffff246c bit 1 is set \
(operational enable, engine speed between ROM8[0x8e3b] and ROM8[0x8e3a], \
coarse vehicle speed at or below ROM8[0x8e3c], P/N position switch ON in \
ffff244f bit 2) and latch ffff2478 bit 4 is clear, FUN 000bfe88 writes \
clamp_u8(ROM8[0x8e36]+128) to ffff137e at 000c01f4 in place of the \
coolant-selected map byte; the demand flag, both bank enables, and the duty \
controller then follow it. Once both banks have tracked the target within \
ROM8[0x8e16]=6 counts for 0.512 s the latch sets and the byte returns to 128 \
until the operational enable falls. The stroke is the actuation of the \
exhaust valve timing control learning, whose tail in the same function \
captures the integrator of error stage 000c1152 on a clean bank release. Raw \
0 commands the neutral byte 128, which still replaces the map byte and can \
set the latch; the stroke is removed through ROM8[0x8e3b]=255."""
note = [
    """
Stock value 40 is +20 degCA of exhaust retard. The byte is added to the 128 \
center in the same raw units as surface 0000b33a and target ffff2327, so it \
carries the code-proven 0.5 crank degrees per count of the actual bytes that \
monitor 0008f168 compares with the target. It is single-copy and not a Map \
Switching family, so a change applies to every map slot. The 2026-09-17 \
captures of a Map 3 image with neutral surfaces show the override as eight \
excursions to raw 168 starting as the engine passed 1800 RPM at rest.""",
]
