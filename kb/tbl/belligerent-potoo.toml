summary = """
Dimensionless coefficient on the param_1=0 branch of function 000be32a: x \
scales internal difference r11-r14 as trunc0((r11-r14)*x/100)."""
note = [
    """
With param_1=0, address 000123ea is selected. The result is written to \
ffff128c+0x348+0, or ffff15d4, and used in multiplication without reloading. \
00021bbc performs signed division of the product by 100 with truncation \
toward zero. Subsequent +128 and saturation apply to the derived byte. All \
cells are zero. The physical meanings of r11 and r14 are unknown.""",
]
