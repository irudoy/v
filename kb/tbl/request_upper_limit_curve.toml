summary = """
Operational table-based upper limit in a minimum-selection cascade for a \
signed 16-bit value. The lookup result is capped at 0x7fff, written to \
ffff34d4, and compared at 00071508 with other candidates to select the lower \
value."""
note = [
    """
All eight cells equal 32767, so in this calibration the limit is neutral for \
the signed-minimum selection cascade. The physical quantity is unknown. \
Branch q = 0xe000 returns the last cell directly and bypasses the \
interpolation kernel. Index: implicit 1D-8; q = min(u16[ffff11b6], 448)*128, \
range 0..0xe000. For q < 0xe000, interpolation proceeds through 00026a60 and \
00026740; q = 0xe000 selects the last cell at 00015750+0x0e. Output trace: \
00015750 -> 000714da -> 000714e6 -> 000263d8 -> 00026a60 -> 00026740 -> \
000714ec -> 000714ee -> 000714fc -> ffff34d4 -> 00071508. Result \
disposition: consumer; Result target: RAM ffff34d4, consumer 00071508.""",
]
