summary = """
Phase of the trimmed valve event pair of the VVEL idle-model stage \
FUN_00057322, zero at 0x8000 and 0.5 per count, looked up by engine speed \
and the VVEL load word 0xFFFF238A. With ROM8[0x8957].bit5 set (stock 0x3A), \
the stage writes 0xFFFFA1E0 = 0.5 * (raw - 0x8000) and centers the trimmed \
events 0xFFFFA1E4 and 0xFFFFA1E8 at 478 - 0xFFFFA1E0, where 478 = 450 + \
ROM16[0x8D8E] / 512; with the bit clear, the value adds to 478 - 0.5 * \
(0xFFFFA1EC + 0xFFFFA1F0). The mode 5 VTC target is 478 minus the mean of \
the blended events 0xFFFFA1B8 and 0xFFFFA1BC. Stock offsets are 0..120 \
counts."""
