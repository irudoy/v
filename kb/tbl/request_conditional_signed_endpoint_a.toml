summary = """
Endpoint A signed surface for a conditional Q0.16 blend. FUN 0007604c \
interpolates it by x=uint16[ffff1210] and y selected from ffff10d2/ffff10e2, \
decodes raw-32768, and writes ffff18ec. FUN 00076108 uses weight ffff2420 to \
blend this endpoint with 0000e08e into ffff18e6."""
note = [
    """
Weight 0 selects this endpoint, 65535 selects endpoint B, and intermediate \
weights use floor(((65536-w)*A+w*B)/65536). Stock ROM8[00008b3f]=0x18 passes \
the first gate, while ROM8[000089fa]=0x40 has bit5 clear and skips the \
evaluator and blend. The surface is byte-identical to the other three \
endpoint surfaces. The physical quantity and engineering unit are \
unresolved. Result disposition: conditional consumer; inactive under the \
stock ROM gate.""",
]
