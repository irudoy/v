summary = """
Table of coefficient x/256 for linearly blending two uint8 quantities \
represented relative to 0x80 inside FUN_000bfc2e. Coefficient x weights the \
quantity calculated inside the function, while 256-x weights the byte from \
ffff2324+6+param_1."""
note = [
    """
ffff160e has no external readers, but the write is not dead: FUN_000bfc2e \
reads the same byte through ffff128c+0x382 and uses x together with 0x100-x \
in blend arithmetic. The second input comes from ffff2324+6+param_1; after \
rounding, shifting, and saturation, the result is written to \
ffff2324+param_1. The function returns param_1 rather than the map value. \
There is no direct inline comparison of the map value and no proven \
unreachability of the conditional block. The physical meaning of the blended \
channels is unknown. Result disposition: consumer.""",
]
