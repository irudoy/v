summary = """
Unsigned 8-bit table multiplier M: lookup result 0001211e is stored in \
ffff14d8, then multiplied by the results of 0001212e and 00009d2a; the final \
value is calculated as min(255, (M*N*B)>>14) and written to ffff14d9."""
note = [
    """
All eight cells equal 128, so in this ROM the lookup result does not depend \
on the index. ffff14d8 has no external readers, but the value is not dead: \
0004ac7a reads it again and uses it in the product. Code does not establish \
the physical quantity or allocation of the common divisor 2^14 among the \
three multipliers, so the scale remains raw. Index: u=0 when U16[ffff18e2] < \
0x2000; u=floor((U16[ffff18e2]-0x2000)/64) when 0x2000 <= U16[ffff18e2] < \
0x6000; u=255 when U16[ffff18e2] >= 0x6000. u is passed as uint8; for u >= \
224, 00026370 returns cell[7]; otherwise it performs implicit 1D-8 \
interpolation of adjacent uint8 cells. Result disposition: consumer \
(ffff14d8 -> 0004ac7a@0004ad60 -> ffff14d9@0004ad7c).""",
]
