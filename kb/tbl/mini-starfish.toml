summary = """
Q1.7 secondary divisor for the calculated-load byte. FUN 000b997c looks up K \
by high8(uint16[ffff4524]) and writes ffff329f. When ROM8[0000870e].bit4 is \
set, FUN 0008083c converts its intermediate q as floor((q<<7)/K), with K=0 \
forcing 255."""
note = [
    """
Stock ROM8[0000870e]=0x28 has bit4 clear, so this normalization is inactive \
in stock JK08A. The physical meaning of ffff4524 is unresolved. Result \
disposition: conditional consumer.""",
]
