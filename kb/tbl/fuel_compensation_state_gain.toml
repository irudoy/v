summary = """
Explicit byte gain in 00040958 over byte ffff11d7 and axis 0001342f. Stored \
at ffff1e7a and multiplied with the signed state word and the separately \
selected centered gain. The input's physical meaning remains unresolved."""
note = [
    """
Editor publication is withheld on jk78c, 1nd and 1me3b. On jk78c the \
coordinator multiplies this gain, signed word ffff1ebe and the centered gain \
into word ffff1ef8 only while bit 7 of ffff45bd is clear and bit 0 of \
ffff23c2 is set, and writes zero otherwise. The producers of both gate bits \
and the role of FUN_000401D4, the reader of ffff1ef8, are unestablished, so \
the stock path does not qualify the gain for publication.""",
]
