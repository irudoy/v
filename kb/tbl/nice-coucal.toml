summary = """
Eight-point uint16 Base Fuel Schedule fallback table. Lookup M by normalized \
coolant index uint8[ffff1077]<<8 is used during initialization and selected \
runtime fallback. Init writes q=min(65535,floor(M*uint8[ffff1160]/512)) to \
ffff1062 and min(65535,4*q) to ffff1026. Runtime uses floor(M/4) as the \
common schedule source before the same downstream Base Fuel Schedule \
producer."""
note = [
    """
The runtime map branch is selected when uint8[ffff2804] is zero, when \
ffff4185 bit 7 is set with nonzero ffff437a, or when ffff4185 bit 6 is set \
with uint8[ffff2804] below 0x20. The primary runtime branch supplies the \
common source through independent arithmetic. Raw M is written to ffff1e44 \
and floor(M/4) to ffff1e40. Exact DID 0x1208 identifies the eventual \
ffff1026 output as Base Fuel Schedule, closing the fallback table's \
operational identity. The Cranking qualifier and raw/2048 ms conversion \
remain catalog/profile candidates pending hardware validation. Result \
disposition: consumer.""",
]
