summary = """
Eight-point uint8 1D table of a multiplicative term in a composite \
calculation. Interpolated result x is zero-extended, multiplied by result y \
of map 00012dca and by 16-bit intermediate r14; the accessor calculates \
min(65535,(r14*x*y)>>14) and writes the result to ffff14dc. A copy of x is \
written to ffff179a. The physical subsystem is unknown."""
note = [
    """
All 8 cells equal 128, so in this ROM the lookup always yields raw 128. This \
alone does not prove a unit or physical meaning. Code proves only the \
combined arithmetic min(65535,(r14*x*y)>>14), where x is the output of \
000129ca and y is the output of 00012dca. Divisor 2^14 cannot be uniquely \
allocated among the scales of x, y, and r14 without an independent unit for \
one operand, so no separate nontrivial map scale is claimed. The map has no \
addressable axis, and its index grid is implicit. Index: implicit 1D-8 \
uint8. Selector extu.b(r12): r12=0 when uint16(ffff18e2)<0x2000, \
r12=(uint16(ffff18e2)-0x2000)>>6 when 0x2000<=uint16(ffff18e2)<0x6000, \
otherwise r12=0xff. For selector >=0xe0, wrapper 00026370 returns cell[7]; \
for a lower selector, kernel 00026a80 reads adjacent uint8 cells and \
finisher 00026740 performs unsigned linear interpolation. Output trace: \
000129ca -> site 0004ae20 -> site 0004ae24 -> 00026370 -> 00026a80 -> site \
00026aac + site 00026aae -> 00026740 -> site 0004ae28 -> [site 0004ae2c -> \
ffff179a; site 0004ae2e -> site 0004ae36 -> site 0004ae3e -> site 0004ae42 \
-> site 0004ae44 -> site 0004ae46 -> site 0004ae48 -> site 0004ae4a -> site \
0004ae4e -> site 0004ae52 -> ffff14dc]. Result disposition: consumer; Result \
target: site 0004ae36.""",
]
