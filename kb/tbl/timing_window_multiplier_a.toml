Interpolated unsigned multiplier of a composite value: the table byte \
through ffff1295 is multiplied by bytes ffff1296, ffff1297, and ffff1294. \
The high 8 bits of the 32-bit product are written to ffff22f8 and tested for \
zero; the test result sets or clears bit 0 of ffff2473."""
