The claim is limited to the computational role proven by code. The \
multiplier's physical purpose is unknown; 0/255 contents and catalogs are \
not used for identification. ffff1295 has no external readers, but the value \
is read again and consumed inside 0004b9b4, so the branch is not dead. \
Result disposition: inline_comparison.""",
]
