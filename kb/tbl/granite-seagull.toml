summary = """
Second-channel endpoint A of the Q16 two-surface crossfade in FUN 000720c4. \
The function interpolates this surface by ffff1248 and ffff10d2, stores the \
result in ffff1cba, and blends it with endpoint B 00017ec8 into ffff124a \
using shared weight ffff190e."""
note = [
    """
Every stock cell is zero. The lookup executes, but ROM8[000089fb]=0x20 has \
bit 3 clear and therefore forces final ffff1cb6 to copy original source \
ffff1248 instead of processed word ffff1cb4. ffff124a has no reader and \
ffff1cb4 is read only by this function. Result disposition: \
dead_control_flow. Result target: ffff1cb6 receives ffff1248 in unmodified \
JK08A. The physical quantity and engineering unit remain unresolved.""",
]
