summary = """
Knock Slice Map: per-evaluator-channel knock threshold by engine speed. A \
calculated metric exceeding the interpolated threshold contributes to \
increasing the knock count."""
note = [
    """
On 7mfk, 00049ffc selects one of six one-based evaluator rows, interpolates \
16 uint16 cells along axis 00015340, and writes the selected word at \
ffff2144 + 2*(c-1). Its bounded domain is 1 <= c <= 6; the accessor has no \
channel guard. JK08A stock rows 3 and 5 contain raw threshold 65535 at every \
cell. The selected raw word enters comparison in 0004a238; metric \
production, comparison outcome and count publication are outside the bounded \
lookup proof. Both neighboring cells are loaded, including 0001114e on the \
last row endpoint. The catalog identifies rows as cylinders, but exact \
lookup code does not establish physical cylinder or sensor order. The \
engineering threshold scale remains candidate.""",
]
