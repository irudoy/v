[[symbol]]
layout = "1me3b"
address = "00009460"
level = "code"
note = """
Stock 1ME3B executes the conditioner: dispatcher 000b218e calls it while bit \
0 of ROM8[000083a6] and bit 7 of the mode flags ROM8[00008a7f] are clear, \
and the flags hold 0x18. The receive table holds an active frame 0x174 \
record at 000097fc."""

[[symbol.evidence]]
kind = "l0"
supports = "homology"
at = "1me3b:000b3164"
to = "jk78c:0000918c"
note = """
Target conditioner 000b2f2c follows the 1ND conditioner 000abc6e, which \
corresponds to the JK78C request transition conditioner 00096ce0: byte and \
word gates with +5 and +0x32 hysteresis, 8x8 duration and offset surfaces at \
gear coordinates shifted left by 5 and 13, three 4x4 rate tables on shared \
state and coordinate axes, the gear-indexed reference multiplier and \
recovery decrement, and the error correction below its limit. Its constant \
block starts at 00009450 where JK78C reads 00009184. While bit 0 of \
ROM8[000083a6] is clear, dispatcher 000b218e calls it when bit 7 of 00008a7f \
is clear and calls 000b35d8 when that bit is set; with bit 0 set it calls \
neither path. JK78C 0009679a selects 00096ce0 by bit 0 of 00008383 and bit 7 \
of 00008968 in the same way. At 000b3164 the target reads 00009460 as the \
floor of the reference product, as JK78C 00096ce0 reads 0000918c at \
00096fc0. Stock bytes equal JK78C."""

[[symbol]]
layout = "1nd"
address = "000093a8"
level = "code"
note = [
    """
1ND0A: Stock 1ND0A executes the conditioner: dispatcher 000ab184 calls it \
while bit 0 of ROM8[0000839f] and bit 7 of the mode flags ROM8[00008a2e] are \
clear, and the flags hold 0x18. The receive table holds an active frame \
0x174 record at 00009714.""",
    """
1ND3B: Stock 1ND3B leaves the conditioner unexecuted: dispatcher 000ab184 \
calls it only while bit 0 of ROM8[0000839f] and bit 7 of the mode flags \
ROM8[00008a2e] are clear, and the flags hold 0x80. The frame 0x174 receive \
record at 00009714 is inactive.""",
]

[[symbol.evidence]]
kind = "l0"
supports = "homology"
at = "1nd:000abee4"
to = "jk78c:0000918c"
note = """
Target conditioner 000abc6e corresponds to the JK78C request transition \
conditioner 00096ce0: byte and word gates with +5 and +0x32 hysteresis, 8x8 \
duration and offset surfaces at gear coordinates shifted left by 5 and 13, \
three 4x4 rate tables on shared state and coordinate axes chosen by the \
special-branch threshold and the gear relation, the gear-indexed reference \
multiplier and recovery decrement, and the error correction below its limit. \
Its constant block starts at 00009398 where JK78C reads 00009184. While bit \
0 of ROM8[0000839f] is clear, dispatcher 000ab184 calls it when bit 7 of \
00008a2e is clear and calls 000ac294 when that bit is set; with bit 0 set it \
calls neither path. JK78C 0009679a selects 00096ce0 by bit 0 of 00008383 and \
bit 7 of 00008968 in the same way. At 000abee4 the target reads 000093a8 as \
the floor of the reference product, as JK78C 00096ce0 reads 0000918c at \
00096fc0. 1ND0A and 1ND3B stock bytes equal JK78C."""

[[symbol]]
layout = "jk78c"
address = "0000918c"
level = "code"
note = """
Stock JK78C leaves the conditioner unexecuted: dispatcher 0009679a calls it \
only while bit 0 of ROM8[00008383] and bit 7 of the mode flags \
ROM8[00008968] are clear, and the flags hold 0x80. The receive table carries \
no frame 0x174 record, so the latched gear indices do not diverge."""

