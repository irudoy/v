summary = """
RPM-indexed unsigned base term in the engine-torque calculation. FUN \
00065c26 writes lookup M to ffff18c4 and calculates ffff2408=sat_u16(M-D+C), \
where D is proportional to current Base Fuel Schedule divided by \
ROM16[00009534] and C is a calibrated nonnegative correction."""
note = [
    """
FUN 000659ae adds ffff2408 without rescaling to the signed centered output \
of Engine Torque Map 00010b8e. This continuous path establishes a common \
internal torque domain. In stock JK08A ROM8[000087f3]=32 makes C zero. The \
physical x*0.1 Nm conversion follows the Engine Torque Map catalog and \
requires hardware validation. Result disposition: consumer.""",
]
