summary = """
One of three unsigned table multipliers applied to base byte ffff1294. Its \
interpolated result participates in a four-factor product; the normalized \
result is written to ffff22f8 and controls bit 0 of ffff2473 according to \
whether it is zero."""
note = [
    """
The artifact does not identify the physical subsystem. The lookup result is \
stored in ffff1296 and reread locally; ffff1296 has no external readers. \
ffff1294 is the base byte, while ffff1295, ffff1296, and ffff1297 are three \
Q0.8 multipliers: floor(ffff1294*ffff1295*ffff1296*ffff1297/2^24) is written \
to ffff22f8. A zero result clears bit 0 of ffff2473, while a nonzero result \
sets it. Numeric round trip for ROM value 13: (13/256)*256=13. Index: \
Implicit uniform 1D-8 axis: u=min((uint16[ffff1024]>>7),255); for u<224, \
i=u>>5 and a Q0.16 fraction from the low 5 bits interpolate cells[i] and \
cells[i+1]; for u>=224, cells[7] is returned. Result disposition: consumer \
(0004b9b4@0004ba18).""",
]
