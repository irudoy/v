summary = """
Ignition surface for state code 5, VVEL mode 12, of the mode-selected half \
of the ignition coordinator FUN_00074D98, the half that stock ROM8[0x8A2B] = \
0xBA (bit 5 set) executes. Stock ROM8[0x8A2C] = 0x1C (bit 3 set) selects the \
surface by the state-code byte 0xFFFEB6DE, which the mapper FUN_0004C4B8 \
derives from the VVEL mode: mode 5 gives code 2, mode 3 code 3, mode 10 code \
4, mode 12 code 5, mode 13 code 6, mode 14 code 7, mode 15 code 8, and every \
other mode code 1. The coordinator takes the low seven bits of the lookup \
and crossfades the previous and current state values by the progress word \
0xFFFEB6DC, where 0x8000 is 1.0."""
