Direct 8x8 byte table accessed through 00027db8. Row=min(target-gear index \
uint8[ffff1077],7) and column=min(current-gear index uint8[ffff1076],7), \
using the latched indices of defs/JK78C.vvel.md, section \"Data flow\". The \
caller shifts both indices left by five and the helper recovers them without \
interpolation. The unsigned result bounds the saturating elapsed byte \
ffff3648 while the gear transition is active."""
