summary = """
Conditional subtractive correction of the warm/main exhaust-CVTC target. \
When ffff2466 bit 6 is set, ffff1c5d = clamp_u8(out_b33a - out_ab4a + 128); \
otherwise ffff1c5d = out_b33a. Raw 128 is zero correction."""
note = [
    """
Code proves centered subtractive arithmetic and the exact 4x4 lookup. The \
correction is subtracted from the 0000b33a output in the same centered raw \
units before coolant selection, so it shares the exhaust-target conversion \
of 0.5 crank degrees per count relative to the learned rest edge, which \
monitor 0008f168 fixes by comparing target ffff2327 with the actual bytes \
ffff2324/ffff2325 of FUN 000bfc2e. The subsystem identity follows from the \
downstream ffff2327 binding to exhaust-target DID 0x1166 and exhaust-VTC \
control and DTC consumers. The homologous HR A2L uses the same 0.5 degCA per \
centered count for cam-timing maps. Result disposition: consumer.""",
]
level = "code"
role = "table"
access = "explicit"
unit = "degCA"
scale = "(x-128)*0.5"
to_raw = "x*2+128"
scale_level = "code"

