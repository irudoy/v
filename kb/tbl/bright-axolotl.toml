summary = """
Eight-point uint8 table of a centered additive term for channel 0. The \
lookup is indexed by RAM ffff106f; interpolated byte x is stored in \
ffff1a7b. The accessor calculates RAM[ffff16e8] + (x-128)*65536, saturates \
the result to range 0..16777215, and writes ffff1a9c; FUN 000be814 reads \
this slot when param_1=0."""
note = [
    """
The physical subsystem is unknown. Code proves the centered term and its \
path. Before saturation, A = RAM[ffff16e8] + (x-128)*65536; saturation to \
0..16777215 applies to composite A and is not included in the invertible map \
scale. One whole scale unit equals 65536 internal counts; round trip is \
exact: (x-128)+128=x for bytes 0..255. The \"Output association\" section \
row stating that there is no sink contradicts the listing: result r0 is \
copied to r2 at 000be792, written to ffff1a7b at 000be798, and then the \
derived quantity is written to ffff1a9c at 000be7b6 and read by 000be814 for \
param_1=0. Axis 00011bdb belongs only to adjacent explicit maps and is not \
included in the claim. Index: implicit 1D-8: RAM byte ffff106f is passed in \
r5 to wrapper 00026370; for a value <224, kernel 00026a80 selects adjacent \
uint8 cells and 00026740 performs unsigned linear interpolation; for a value \
>=224, the wrapper selects element 7. Output trace: 00012e72 -> 000be786 -> \
000be78e/00026370 -> 00026a80 -> 00026aac,00026aae -> 00026740 -> 000be792 \
-> 000be798/ffff1a7b; 000be79e -> 000be7a0 -> 000be7a2 -> 000be7a4 -> \
000be7a6,000be7aa,000be7ae,000be7ac,000be7b2 -> 000be7b6/ffff1a9c -> \
000be814(param_1=0). Result disposition: consumer; Result target: FUN \
000be814 through RAM ffff1a9c when param_1=0; raw copy in RAM ffff1a7b.""",
]
