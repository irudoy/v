    """
Code proves the operational role: the uint16 interpolation result is \
multiplied by a signed first-channel intermediate value, and the product is \
saturated and divided by 4096 with an arithmetic shift. This establishes a \
Q12 multiplier but not the channel's physical function. Identical map \
00015590 belongs to the second channel and is used only as structural \
context. Result disposition: consumer. No physical quantity is asserted \
beyond narrow operational semantics.""",
]
