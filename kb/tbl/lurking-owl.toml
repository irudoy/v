note = """
The corresponding readers 0007f0f4 and 7mfk 000617ea load this 8-point \
uint16 operand at 0007f2b0 and 00061944. The interpolation geometry and the \
surrounding raw operation agree; the source stock cell values and \
engineering conversions are not assertions about the JK78C image. The \
primary curve 000145f8 requires the common caller byte and the first-channel \
enable byte to be nonzero, all three first-channel blocking bytes to be \
zero, and the final first-channel selector byte to be nonzero; 000167c4 is \
selected otherwise. The complete conjunction is tested at \
0007f270..0007f2ae."""

