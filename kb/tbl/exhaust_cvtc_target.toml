summary = """
Warm/main exhaust-CVTC target surface. FUN 000bfdc0 interpolates it by \
RPM/50 and Q7 normalized BFS, optionally subtracts correction 0000ab4a, and \
writes ffff1c5d. FUN 000bfe88 performs coolant selection and downstream \
conditioning into common exhaust target ffff2327."""
note = [
    """
The exact service-0x22 table publishes ffff2327 as DID 0x1166. Structured \
Nissan diagnostics name that DID T_VTC_ANGL_EX; exact control and DTC paths \
consume the same target in P1078/P1084 exhaust-timing-sensor and P0014/P0024 \
exhaust-VTC-control monitors. This closes the subsystem identity \
independently of map geometry. Code proves centered raw arithmetic and the \
conversion: FUN 000bfc2e writes actual bytes ffff2324/ffff2325 at 000bfdae \
as 128 plus the filtered edge deviation from the learned rest edge in counts \
of 0.5 crank degrees (channel-4 captures on the 3.2 us clock over the \
120-degree event interval), and monitor 0008f168 forms the tracking gap \
clamp_u8(ffff2327 - ffff2324 + 128) at 0008f496 and 0008f4bc in the same raw \
units, so the target and this surface are (raw-128)*0.5 crank degrees \
relative to the learned rest edge. Target-vehicle replay of the warm path \
matches ffff2327 exactly in 26,344 of 35,807 prior-snapshot comparisons and \
in 4,838 of 5,366 active samples after 16 unchanged-input cycles; remaining \
differences are downstream mode, rate, and offset conditioning. The \
2026-09-17 dashboard recordings of a Map 3 image keep both actual bytes \
within two counts of a target unchanged for 100 records in 98 percent of \
83,229 and 34,026 samples per bank. The absolute crank-wheel origin of the \
learned rest edge remains open. Result disposition: writes.""",
]
