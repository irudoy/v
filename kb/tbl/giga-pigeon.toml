summary = """
Second channel of a mode-gated paired override. The interpolated uint16 \
result is written to ffff2ffc and, through the common return path, to the \
second word of the caller-provided output pair."""
note = [
    """
The mode branch at 00062a34-00062a3c enables the paired lookups. Base \
00014e02 and axis 00013b98 feed the interpolation call at 00062a5a; the \
result is written to ffff2ffc at 00062a62, loaded at 00062abc, and reaches \
the second output word at 00062b58. All map cells and all axis points are \
zero in stock JK08A, so this live override channel publishes zero. The \
physical quantity and engineering scale are not assigned. Result \
disposition: writes. Result target: ffff2ffc and output pair word 1.""",
]
level = "code"
role = "table"
access = "explicit"

