summary = """
Eight-point uint8 table with an implicit index that produces an additive \
integer term for an internal result: the interpolated byte is stored in \
ffff1a7c, then clamp(((uint8)y*65536)+RAM[ffff16ec]-0x00800000, 0, \
0x00ffffff) is written to ffff1aa0."""
note = [
    """
The physical name and unit are unknown. The catalog for shape 1D-8 is \
ambiguous. The 16-bit shift belongs to the internal consumption path; \
because of the downstream addition and saturation, it is not claimed as an \
independent invertible physical scale. Axis 00011bdb belongs only to \
adjacent explicit maps and is not included. The summary output-association \
row contradicts the machine listing: the listing directly shows both writes \
of the target-map result. Index: implicit 1D, 8 uint8 cells; input x = \
uint8(RAM[ffff106f]). For x < 0x00e0, kernel 00026a80 interpolates adjacent \
bytes through finisher 00026740; for x >= 0x00e0, wrapper 00026370 returns \
cell 7. There is no explicit ROM axis. Output trace: 00012e7a -> 000be7d6 -> \
000be7de -> 00026370 -> 00026a80 -> 00026aac/00026aae -> 00026740 -> \
000be7e2 -> 000be7e8 -> ffff1a7c; 000be7e2 -> 000be7e6 -> 000be7ea -> \
000be7ee -> 000be7f0 -> 000be7f2 -> 000be7f4/000be7f6/000be7f8 -> \
000be7fa/000be7fc/000be7fe/000be800 -> 000be804 -> ffff1aa0. Result \
disposition: writes; Result target: RAM ffff1a7c (uint8, interpolated byte); \
RAM ffff1aa0 (uint32, result in range 0..0x00ffffff).""",
]
