summary = """
Dimensionless Q12 multiplier for the result of map 0000d68e: output 000153f0 \
multiplies ffff31ba and is normalized by a right shift of 12 bits."""
note = [
    """
The result of 0000d68e is stored in ffff31ba, while 000153f0 is stored in \
ffff3354. Multiplication at 0007abcc followed by SHLR8, SHLR2, SHLR2 divides \
the product by 4096 before writing to ffff3078. All 000153f0 points equal \
4096, so the current calibration gives a unity multiplier. The physical \
quantity of the result is unknown.""",
]
