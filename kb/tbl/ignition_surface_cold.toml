summary = """
Cold-coolant ignition surface of the mode-selected half of the ignition \
coordinator FUN_00069AB8, the half that stock ROM8[0x8965] = 0xBA (bit 5 \
set) executes. The coolant byte 0xFFFF1069 above ROM8[0x8AC1] selects the \
hot-coolant surface and at or below ROM8[0x8AC2] the cold-coolant surface; \
between the two thresholds the coordinator interpolates the low-seven fields \
of both surfaces. Both stock thresholds hold 120 (70 degC), so the stock \
image has no blend band. The low seven bits carry the timing field and bit 7 \
passes to the coordinator output beside it."""
level = "code"
home = "jk78c"
cols = 16
rows = 16
storage = "uint8"

[editor]
name = "Ignition Timing Surface - Cold Coolant"
category = "Ignition Timing / State Surfaces"
order = 104
format = "0"
fine = 1
coarse = 4
mask = "7F"

[[symbol]]
layout = "1me3b"
address = "0000a444"
summary = """
Ignition surface for state code 1, every VVEL mode outside 3, 5, 10, 12, 13, \
14, and 15, of the mode-selected half of the ignition coordinator \
FUN_000797CC, the only half this coordinator carries. Stock ROM8[0x8A7D] = \
0x1C (bit 3 set) selects the surface by the state-code byte 0xFFFEB826, \
which the mapper FUN_00050310 derives from the VVEL mode: mode 5 gives code \
2, mode 3 code 3, mode 10 code 4, mode 12 code 5, mode 13 code 6, mode 14 \
code 7, mode 15 code 8, and every other mode code 1. The coordinator takes \
the low seven bits of the lookup and crossfades the previous and current \
state values by the progress word 0xFFFEB824, where 0x8000 is 1.0."""
note = """
Engineering conversion is unestablished. Retained hypothesis: x-64 deg; \
proposed editor-grid inverse x+64. Origin: the retained layout \
interpretation and defs/JK08A.findings.csv:41, ignition_gated_surface_1/tbl. \
The canonical PID0E closure is not the executed target-native path. Equal \
surface bytes and a common field/coordinator role do not reproduce that \
complete target arithmetic and diagnostic publication. x-64 applies to the \
low-seven field only; applying it to the full byte would include the \
independent flag. This is an adjustment hypothesis, not absolute spark \
angle. Recorded code and catalog interpretation: Byte-identical to the JK78C \
cold-coolant surface 0xA20A. The literal words 0x7941C, 0x7971C hold the \
same address; the structure export recovers no instruction that reads them."""

