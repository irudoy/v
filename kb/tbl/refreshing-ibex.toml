summary = """
Default offset-binary additive curve for the two-channel calculation in FUN \
000c0d90. When ffff14c8 & (param_1+1) is zero, the function interpolates \
this map by uint8[ffff11ae] over axis 000149ca and writes the raw uint16 \
result to ffff1a98+2*param_1."""
note = [
    """
FUN 000c1dec proves the centered representation by calculating \
u16(ffff1a86+2*param_1)+u16(ffff1a98+2*param_1)-65536. Initializer FUN \
000bced0 writes neutral 0x8000 to both elements of the selected-output \
array. This curve and 00015ad0 are byte-identical in stock JK08A, so \
ffff14c8 only selects distinct calibration storage and not a distinct stock \
value. The physical quantity and engineering unit are unresolved. Result \
disposition: consumer.""",
]
