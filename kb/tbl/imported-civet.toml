summary = """
Vehicle-speed threshold of the standstill exhaust-VTC override. Hysteresis \
comparator 000259d0 sets ffff24ac bit 7 while coarse vehicle-speed byte \
ffff110e is at or below this value and clears it above the value plus \
ROM8[0x86e8]=1; FUN 000bfe88 stores the flag at 000bff4e."""
note = [
    """
Stock value 2 with release above 3 counts of coarse vehicle-speed byte \
ffff110e, whose km/h value per count is not established; the 2026-09-17 \
captures release the override between 8 and 9 km/h of the dashboard speed \
channel. The flag is one input of override predicate ffff246c bit 1.""",
]
