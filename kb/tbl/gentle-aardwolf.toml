artifact does not establish the physical subsystem or the time value of a \
counter step. Index: Implicit 1D-8 index: \
q=clamp(trunc((uVar12-1000)/32),0,255). For q<224: i=q>>5, Q0.16 fraction \
(q&31)*2048, interpolation of uint8 map[i] and map[i+1] through 00026740; \
for q>=224, map[7] is returned. Result disposition: inline_comparison \
(000786da).""",
]
