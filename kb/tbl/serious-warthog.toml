summary = """
Eight-point uint16 table with an implicit index whose lookup result is a \
16-bit multiplicand in a composite calculation: at 000525b0 it is multiplied \
by the uint8 result of 0000a8ea, the product is shifted right by 7, \
saturated to 0xffff, and written to ffff1652."""
note = [
    """
The physical quantity, unit, and non-unity scale do not follow from code. \
ffff1652 already contains the product of outputs from 00014ed2 and 0000a8ea, \
so its two readers do not isolate the physical meaning of the target map. \
The implicit map has no separate ROM axis. Index: implicit 1D-8; \
q=min(RAM16[ffff1222]*32,65535); for q<57344, interpolation is performed \
through 00026a60 and 00026740; for q>=57344, map[7] is returned. Output \
trace: 00014ed2 -> 000525a6 -> 000525aa -> 000263d8 -> 00026a60 -> 00026740 \
-> 000525ae -> 000525b0; product -> 000525b6 -> 000525b8 -> 000525ba -> \
000525bc -> 000525be -> 000525c0 -> 000525c2 -> 000525c4 -> 000525cc -> \
ffff1652; ffff1652 -> 000525d8, 0004e59c. Result disposition: consumer; \
Result target: site 000525b0.""",
]
