summary = """
Direct low-speed fallback Base Fuel Schedule grid selected when ffff2449 bit \
7 is set. Rows are selected by saturated RPM/12.5 byte ffff11ea for ranges \
below 800, 1600, and 2400 RPM; at or above 2400 RPM the branch writes zero \
without reading a row. Columns are selected by byte ffff1075 at thresholds \
7, 15, and 22. The selected cell is shifted left by eight and written to \
ffff1026."""
note = [
    """
The exact 3x4 stock grid is 36 3c 4c 61 / 32 34 40 5a / 30 31 38 54. Code \
proves layout, selectors, zero-above-range behavior, left shift, and \
destination. Base Fuel Schedule identity follows from exact DID 0x1208; the \
x/8 ms cell conversion follows from the homologous full-word raw/2048 ms \
profile and requires hardware validation.""",
]
