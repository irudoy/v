summary = """
Interpolated uint16 M is a multiplier for Q = \
low16(floor((u16(RAM[ffff1026]) * u16(RAM[ffff22e6])) / 0x00020202)). The \
consumer calculates Y = min(0xffff, floor((M * Q) / 64)) and writes Y to \
ffff8c72."""
note = [
    """
The claim is limited to computational semantics. The physical meanings of Q, \
the RAM fields in the input difference, and ffff8c72 are unknown. The shift \
by 6 applies to product M*Q after reading the map and does not define a \
separate physical scale for M, so the map scale remains raw. Result \
disposition: consumer.""",
]
