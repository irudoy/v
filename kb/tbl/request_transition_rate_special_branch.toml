title = "Request transition rate special branch"
summary = """
Selected rate surface when ffff23be.bit7 is clear and uint16[ffff11fa] \
exceeds ROM16[0000918e]. Coordinates are min(uint16[ffff10be]>>3,255) and \
the latched target-gear index uint8[ffff1077] of \
defs/analysis/valve-timing/JK78C.vvel.md, section \"Data flow\". The byte \
result is multiplied by ten before the signed request-update calculation."""
note = [
    """
Gear-index inputs follow defs/analysis/valve-timing/JK78C.vvel.md, section \
\"Data flow\": ffff1076 and ffff1077 latch the zero-based current-gear and \
target-gear indices ffff1079 and ffff107a decoded by FUN_000EC214 from byte \
3 of transmission frame 0x174. Scaling and engineering units remain \
unresolved, so the editor definitions show stored counts.""",
]
