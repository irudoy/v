00008a2e is clear and calls 000ac294 when that bit is set; with bit 0 set it \
calls neither path. JK78C 0009679a selects 00096ce0 by bit 0 of 00008383 and \
bit 7 of 00008968 in the same way. At 000ac08a the target reads 0000b7e0 as \
the 4x4 rate table of the special branch, as JK78C 00096ce0 reads 0000b39a \
at 0009705e. 1ND0A stock bytes differ from JK78C and equal 1ME3B; 1ND3B \
stock bytes equal JK78C."""

[[symbol]]
