summary = """
Dimensionless Q7 multiplier on the negative branch of two-channel \
calculation 0005fdb0: result 00014cba is scaled as \
min(0xffff,floor(value*x/128))."""
note = [
    """
The 000122aa result is written to ffff8c0c at 0005fe5a. On negative \
branches, it is multiplied unsigned by the 00014cba result and divided by \
128 through a sequence of shifts; exceeding the threshold saturates the \
output to 0xffff. All cells equal 128, so the current coefficient is 1. The \
physical domain is unknown; this does not limit code confidence in the \
operational semantics.""",
]
