summary = """
Eight-point uint8 table of a base quantity or multiplier in a composite \
7-bit result. The lookup interpolated by byte ffff106f at 0004c02e \
participates in conditional scaling and multiplication with other inputs, \
after which the result is capped at 127 and written to ffff1831; 0004c136 \
conditionally copies it to ffff2404."""
note = [
    """
The physical name of the quantity and engineering scale are unknown. \
ffff1831 receives not the original lookup result but the saturated result of \
branching arithmetic with other inputs; function 0004c136 only conditionally \
copies this byte to ffff2404. Index: x=uint8[ffff106f]; for x<224: i=x>>5, \
f=(x&31)/32, y=unsigned linear interpolation of t[i] and t[i+1] with a Q0.16 \
fraction; for x>=224: y=t[7]. Result disposition: writes (ffff1831).""",
]
