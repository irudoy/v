note = """
Target reader 000afe8c corresponds to the JK78C rotational-speed request \
limiter 00094d6c. It gates the byte context lookup on its eight-point axis \
and looks up the threshold curve on the bound athletic-gharial axis as JK78C \
does; it reads its word constants through GBR 00009264 and adds a \
threshold-selected pair of filter rates and signed floors. At 000aff0a the \
target reads 00008a7f as the mode flag byte whose bit 7 selects the gating \
path, as JK78C 00094d6c reads 00008968 at 00094e26. Stock bytes 18 differ \
from JK78C 80 and equal 1ND0A; 1ND3B stock bytes equal JK78C. Dispatcher \
000b218e reads the same bit 7 and calls the transition conditioner 000b2f2c \
while it is clear, as JK78C 0009679a calls 00096ce0."""

