title = "Request conditioning mode flags"
summary = """
Bit7 selects the request-conditioning mechanism in caller 0009679a: when \
ROM8[00008383].bit0 is clear, a clear bit7 calls 00096ce0, while a set bit7 \
calls 00097298 and 000978d6. The same bit selects the native limiter \
context-gate branch and qualifies its held-transition neutral override with \
ffff45ca.bit6. In the ignition mode-parameter reader, bit 4 selects the copy \
branch; its caller admits that reader only while bit 7 is clear. Other bit \
meanings remain unresolved."""
note = [
    """
Active and unqualified for the editor. Stock code reads bit 7 on every VQ37 \
image, and the stock bytes 0x80 on JK78C and 1ND3B and 0x18 on 1ND0A and \
1ME3B select different branches; bit 4 selects the copy branch in the \
ignition mode-parameter reader, and the meanings of the remaining bits are \
unresolved.""",
]
