title = "Request conditioning mode flags"
summary = """
Bit7 selects the request-conditioning mechanism in caller 0009679a: when \
ROM8[00008383].bit0 is clear, a clear bit7 calls 00096ce0, while a set bit7 \
calls 00097298 and 000978d6. The same bit selects the native limiter \
context-gate branch and qualifies its held-transition neutral override with \
ffff45ca.bit6. Other bit meanings remain unresolved."""
