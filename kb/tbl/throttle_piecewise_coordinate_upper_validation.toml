note = """
Target reader 000ac4a0 corresponds to JK78C reader 0009325c, the validation \
copy of the primary piecewise reader; both run the same five calls: the \
inverse angle-to-area lookup, two divisions, the piecewise lookup and the \
request-conversion lookup. The lower branch is taken when the computed \
coordinate does not exceed the last word (offset 0x3E) of the lower output \
curve; the upper branch shifts the coordinate right by four and caps it. \
MOV.L 000ac522 loads this curve as the returned coordinate of the upper \
branch for call 4 of 5 at 000ac526 (charming-teal), as MOV.L jk78c:000932d4 \
loads 0001b2ca for call 4 of 5 at 000932da (inescapable-dachshund). Stock \
words equal JK78C."""

