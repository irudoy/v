summary = """
Byte table for control selector ffff23ed: the lookup result defines a \
zero/nonzero gate; 0 selects calculated consumer branches, including \
stepwise convergence at 0004355c, while !=0 selects a direct bypass path."""
note = [
    """
The physical subsystem is unknown. Direct confirmed path 0002cd82 -> \
ffff23ed is sufficient for operational semantics; 000420b8 additionally \
retains the lookup result in a local value. All eight cells equal 0, so the \
current ROM content always selects the zero branch, but the role is \
established from the RAM trace and consumers rather than from the flat \
shape. Index: 1D-8 uint8 with an implicit uniform axis over 8-bit input r5: \
for x < 224, wrapper 00026370 directs the lookup to kernel 00026a80, which \
reads adjacent bytes and passes them to linear finisher 00026740; for x >= \
224, map+7 is returned. Sources of x: ffff1077 at 0002cd82 and ffff106f at \
00042114. Result disposition: writes (ffff23ed).""",
]
