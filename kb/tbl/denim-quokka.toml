summary = """
Second-channel Q12 multiplier: interpolated uint16 M multiplies a signed \
intermediate value; the derivative is saturated to signed16 or divided by \
4096 and written to ffff33b4."""
note = [
    """
At site 00061a72, r4 contains 00015590 and r5 contains 00015d50. The \
interpolation return is zero-extended, multiplied by signed intermediate \
value r14, and divided by 4096 through 00022530; overflow branches saturate \
the result to signed16. The derived result is written to ffff33b4. Code \
proves application of a Q12 multiplier to the second channel but not the \
channel's physical function. Result disposition: consumer. No physical \
quantity is asserted beyond narrow operational semantics.""",
]
