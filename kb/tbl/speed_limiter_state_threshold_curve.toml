[[symbol]]
layout = "1me3b"
address = "000172d6"
level = "code"
note = """
Stock 1ME3B applies the curve: bit 0 of ROM8[00008576] enables the oil \
sensor, the comparison at 000eae74 of selector fffe80e5 with ROM8[00008c23] \
= 20 and hysteresis ROM8[00008c24] = 1 sets fffeba06.bit1, 000eaee8 copies \
it to fffeba06.bit2 while the oil-sensor fault records are clear, and the \
reader tests that bit at 000aff9e. The axis and curve stock bytes equal \
JK78C."""

[[symbol.evidence]]
kind = "l0"
supports = "homology"
at = "1me3b:000aff84"
to = "jk78c:00016c14"
note = """
Target reader 000afe8c corresponds to the JK78C rotational-speed request \
limiter 00094d6c. It gates the byte context lookup on its eight-point axis \
and looks up the threshold curve on the bound athletic-gharial axis as JK78C \
does; it reads its word constants through GBR 00009264 and adds a \
threshold-selected pair of filter rates and signed floors. At 000aff84 the \
target reads 000172d6 as the word curve looked up on athletic-gharial, as \
JK78C 00094d6c reads 00016c14 at 00094eac. Stock bytes equal JK78C."""

[[symbol]]
layout = "1nd"
address = "00017222"
level = "code"
note = """
Stock 1ND0A and 1ND3B apply the curve: bit 0 of ROM8[00008561] enables the \
oil sensor, producer 000df018 compares selector fffe80ed with ROM8[00008bd1] \
= 20 and hysteresis ROM8[00008bd2] = 1 and copies the result to \
fffeb89d.bit2 while the oil-sensor fault records are clear, and the reader \
tests that bit at 000a904c. On the stock oil-thermistor curve 0001456a, \
codes 15 to 20 read about 151 to 136 C [cand], as on JK78C."""

[[symbol.evidence]]
kind = "l0"
supports = "homology"
at = "1nd:000a903c"
to = "jk78c:00016c14"
note = """
Target reader 000a8f02, called from 000a9968 with the pedal compensator \
000a76d6, corresponds to the JK78C rotational-speed request limiter \
00094d6c, called from 00095668 with 000948f0. Both take the neutral-output \
return, gate the byte context lookup on its eight-point axis, look up the \
threshold curve on the bound athletic-gharial axis, and set the ramp flag \
and floor the ramp with one signed word. At 000a903c the target reads \
00017222 as the word curve looked up on athletic-gharial, as JK78C 00094d6c \
reads 00016c14 at 00094eac. 1ND0A and 1ND3B stock bytes equal JK78C."""

[[symbol]]
layout = "jk78c"
address = "00016c14"
level = "code"
note = """
Stock JK78C applies the curve: bit 0 of ROM8[0000852a] enables the oil \
sensor, producer 000bdf90 compares the code with ROM8[00008aef] = 20 and \
hysteresis ROM8[00008af0] = 1, and the reader tests ffff4573.bit4. On the \
stock oil-thermistor curve 000140c4, codes 15, 16, 17, 18, 19 and 20 read \
about 151, 147, 144, 141, 138 and 136 C [cand]; the stock curve lowers the \
threshold to 5632 at code 17 and below and to 7552 at codes 18 and 19, and \
holds 9600 at code 20."""

