title = "Speed limiter state threshold curve"
summary = """
Native eight-word dynamic threshold curve read through 000282f4 on explicit \
word axis 00016a64, shared with rev_limit_fuel_cut_curves/tbl. Its input is \
rev_fuel_cut_selector/ram at ffff10e5. The word is published at ffff1a3c and \
can lower the calibrated threshold when ffff4573.bit4 is set. It also bounds \
the downward threshold ramp. This curve has no scalar-to-curve binding to \
the canonical alternate threshold. The existing shared axis contains \
repeated breakpoints; its source and other readers are preserved. Editor \
publication and behavior at those boundaries require separate \
qualification."""
note = [
    """
