title = "Oil-temperature engine speed threshold curve"
summary = """
Eight-word oil-temperature threshold of the rotational-speed request \
limiter, read through 000282f4 on the explicit word axis 00016a64, which it \
shares with rev_limit_fuel_cut_curves/tbl. Its coordinate is \
rev_fuel_cut_selector/ram at ffff10e5, the filtered raw oil-thermistor code. \
While ffff4573.bit4 is set, the word published at ffff1a3c can lower the \
calibrated threshold, and it also bounds the downward threshold ramp. \
Producer 000bdf90 sets that bit by a hysteretic comparison of the code with \
ROM8[00008aef] and ROM8[00008af0] and leaves it clear while the oil-sensor \
fault records are set. This curve has no scalar-to-curve binding to the \
canonical alternate threshold."""
note = [
    """
The RPM scale x*0.78125 follows the base threshold \
rev_limit_throttle_cut/tbl, which this curve lowers; it is a candidate on \
the VQ37 layouts. The axis codes convert to oil temperature through the \
stock oil-thermistor curve, a candidate conversion. The stock axis repeats \
breakpoints 17 and 18, and the stock cells of each repeated pair are \
equal.""",
]
