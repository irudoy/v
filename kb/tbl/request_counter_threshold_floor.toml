summary = """
In the calculated branch, M is the interpolated unsigned byte from map \
0000aaea, Q = (RAM8[ffff3448] * RAM8[ffff351c]) / 10, and T = max(Q, M). \
When T <= RAM16[ffff3446], FUN_00079538 sets condition bVar2, which clears \
bit 0 of RAM ffff41e1 and zeros RAM ffff3448 and ffff3446. The map supplies \
an interpolated lower bound for a dynamic counter threshold; the artifact \
does not establish the threshold's physical purpose."""
note = [
    """
The claim describes operational semantics proven by code rather than a \
physical purpose. The map result has raw byte identity. Division by 10 \
belongs to calculating the threshold's second operand and is not the map \
scale. Catalog matches for the 4x4 shape were not used for its name or \
scale. ffff3449 has no external readers; consumption occurs inside \
FUN_00079538. Result disposition: inline_comparison.""",
]
