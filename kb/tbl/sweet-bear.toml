summary = """
Inverse-weight curve in a four-state-selected P0128 model term. FUN 000b7a3c \
converts lookup raw x to w=255-min(x,255), combines it with a nonnegative \
model-temperature-minus-IAT base B and uint16 parameter H, applies \
coefficient K selected by runtime state S, and writes \
K*floor(H*floor(B*w/255)/2500) to ffff3228."""
note = [
    """
Exact inputs are \
d=clamp(trunc0(ffff3348/20000)-50*uint8[ffff2733]+2500,0,32767), \
B=min(floor(d*ROM8[00008a30]/2),65535), H=uint16[ffff35b6], \
A=lookup_u16(00014e42,00013bb8,uint8[ffff110e]<<8), and \
q=max(0,65535-floor(20*A*ROM8[00008832]/H)) for H!=0. The H=0 branch selects \
q=65535 when A*ROM8[00008832]=0 and q=0 otherwise. K is 10 for S=0 and \
ROM8[00008a35], ROM8[00008a36], or ROM8[00008a34] for S=1, 2, or >=3. FUN \
000b6b5a adds ffff3228 to ffff2f98 with uint32 saturation before placing the \
sum on the subtractive side of the P0128 balance. Stock ROM8[00008a30] is \
zero, so B and ffff3228 are always zero. ROM8[00008832], all three state \
coefficients, both maps, and both axes are also zero. The physical \
heat-transfer interpretation, parameter H, and engineering scale remain \
unresolved. Result disposition: consumer.""",
]
