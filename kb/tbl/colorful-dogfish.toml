summary = """
Sixteen-point RPM-dependent Base Fuel Schedule normalization reference used \
only by the J1979 Calculated Load producer. Lookup M by RPM/25 byte ffff11b3 \
enters q=floor((uint16[ffff1024]<<8)/M); an optional second normalization \
uses ffff329f, and the result is clamped to 255 and written to ffff413e for \
Mode 01 PID 0x04."""
note = [
    """
The exact image closes both wrapper branches: 000263f4 calls the complete \
uint16 interpolation path in 00026a60/00026740 for coordinates below 0xf000 \
and returns cell 15 otherwise. ffff11b3 is min(255,uint16[ffff11f4]>>1); \
because ffff11f4 is RPM/12.5, the implicit 0x1000 coordinate step gives \
exact static points 0,400,...,6000 RPM. Exact DID 0x1208 identifies \
numerator ffff1024 as current Base Fuel Schedule; the quotient therefore \
compares it with a same-dimension RPM-dependent 100% reference. Stock \
ROM8[0000870e]=0x28 leaves the optional second normalization inactive. FUN \
00035856 returns ffff413e for PID 0x04 at standard conversion 100*A/255. \
This map does not normalize internal Q7 map coordinate ffff102c; that path \
uses fixed scalar 00009534 and 100*A/128. The operational role and RPM \
points have code confidence. The raw/2048 ms conversion remains a \
source-derived candidate.""",
]
