summary = """
Primary throttle-valve angle coordinate table. It is the static axis of \
opening-area table 00013202 and the returned-value table when the same pair \
is used in reverse for area-to-angle conversion."""
note = [
    """
Paired throttle-position paths convert two feedback inputs through 00013202, \
average in the opening-area domain, reverse through 000155a0, and divide the \
angle-domain result by four into ffff3f7c. FUN 0006f236 publishes that word, \
less idle base ffff28f8 and scaled by 0x505b, as the J1979 PID 0x11 \
absolute-throttle byte, which fixes one stored count at 34285/1114112 \
percent of throttle opening. The exact operational topology and throttle \
feedback sources distinguish this pair from unrelated 1D-32 conversions. The \
catalog degree scale x*0.0275 remains a candidate and requires hardware \
validation. The stored values are byte-identical to trustful coordinate \
table 000190d0.""",
]
