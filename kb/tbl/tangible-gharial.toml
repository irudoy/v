summary = """
Base end-of-injection angle, indexed by engine-speed byte ffff11b3 in \
RPM/25: uint16[ffff192e] = 2*min(lookup_u8(00012302, uint8[ffff11b3]) + \
uint8[ffff340c], 209) is the delay in 2 crank degrees per count from the \
reference tooth of the scheduled channel to the end of the pulse. The \
reference tooth is 130 degrees after intake TDC of the injected cylinder, so \
a cell of x counts ends the pulse 4*x - 590 degrees after the following \
intake TDC; all 8 cells equal 133, 58 degrees before intake TDC."""
note = [
    """
The normal branch forms ffff192e=2*min(lookup+uint8[ffff340c],209) in 2 \
crank degrees per count, so one cell count is 4 crank degrees; the stock \
delay is 532 degrees and saturation is 836. FUN 000521a8 subtracts the pulse \
angle from that delay and splits the result by 120 into the injection lead \
and the start angle. Sequencer 00054a44 schedules channel bit (ffff11de - \
lead) mod 6 against tooth 7 of that event index, 110 degrees before \
compression TDC of the cylinder with that number; channel bit k drives the \
injector of cylinder k + 1, so the reference tooth is 130 degrees after \
intake TDC of the injected cylinder. The channel order rests on the Power \
Balance bit assignment of the Nissan-family diagnostic profile applied to \
the same six-channel mask and is not measured electrically; the mechanical \
offset between the crank sensor and the signal plate remains a hardware \
boundary.""",
]
level = "code"
role = "table"
access = "explicit"
unit = "deg after intake TDC"
scale = "x*4-590"
to_raw = "(x+590)/4"
scale_level = "code"

