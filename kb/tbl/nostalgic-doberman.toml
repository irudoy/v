summary = """
Raw 8-bit threshold for RAM byte ffff19aa: the interpolated map result is \
written to ffff17f0 and used directly in condition ffff19aa > ffff17f0."""
note = [
    """
All 8 cells equal 0, so the interpolated threshold is 0 for any index. The \
value has no external readers but is consumed inside 000bd20a: 000bd3c8 \
executes cmp/gt r5,r6, testing ffff19aa > ffff17f0, and 000bd3ca branches on \
the result. Branch unreachability has not been proven. The artifact does not \
establish the physical meaning of RAM byte ffff19aa or the axis input.""",
]
