summary = """
Unsigned 8-bit multiplier interpolated by uint8 input ffff11b2 in the \
calculation inside 00055098: after being written to ffff1955, it is loaded \
again and multiplied by the product of values ffff1680 and ffff193d; the \
result is then multiplied by ffff1b14, shifted right by 12, added to \
ffff2ff0, saturated to 0xffff, and written to ffff15ce."""
note = [
    """
ffff1955 has an internal reader in the same function despite no external \
consumers: the value is loaded into r4, zero-extended as a byte, and \
participates in mul.l. The artifact does not establish the physical quantity \
of final ffff15ce. The right shift by 12 applies to a product of four bytes, \
so no separate nontrivial scale can be assigned to map 00012c56. Result \
disposition: consumer.""",
]
