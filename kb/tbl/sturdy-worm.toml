summary = """
Coefficient on the param_1=0 branch: interpolated uint8 g is written to \
ffff15f6 and scales signed deviation uint8[ffff1240]-128 by g/100 before \
forming a centered uint16."""
note = [
    """
With param_1=0, 0001252a is selected. The interpolated byte is written to \
ffff15f6 and participates without a trace break in \
q=trunc0(((uint8[ffff1240]-128)*g*256)/100); a saturated centered uint16 is \
then formed. Scale g/100 belongs to the map, while the clamp applies to the \
derived value. The physical domain is unknown.""",
]
