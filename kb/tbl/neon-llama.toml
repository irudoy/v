summary = """
Engine-speed floor of the standstill exhaust-VTC override. FUN 000bfe88 sets \
ffff24ab bit 0 at 000bfee4 when engine-speed byte ffff11ae reaches this \
value and clears it when the byte plus hysteresis ROM8[0x86e1]=4 falls below \
it."""
note = [
    """
Stock value 36 is 1800 RPM with release below 1600 RPM. The flag is one \
input of override predicate ffff246c bit 1 and has no other consumer, so raw \
255 keeps the predicate clear at every reachable engine speed and removes \
the override stroke, its latch ffff2478 bit 4, and the opportunity it gives \
the exhaust valve timing control learning.""",
]
