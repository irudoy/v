[[status]]
layout = "1ek7a"
state = "absent"
note = """
The standstill exhaust-CVTC RPM floor belongs to the exhaust actuator \
conditioning and learning path. The 1EK7A stock catalog carries the intake \
timing and solenoid pairs only for these subsystems. A scan of the \
calibrated exhaust reader and conditioner found no matching target shape. \
The packed 7MFK standstill block 28 14 00 00 50 24 02 02 has no byte match \
in the 1EK7A image."""

[[status.evidence]]
kind = "rom-bytes"
supports = "identity"
at = "1ek7a:0001d2ec"
value = "370300000000001100000000370200000000002100000000380306000000045200000000"
note = """
The complete group 0x37 contains P0011 and P0021, followed by group 0x38. \
The stock catalog has no P0014 or P0024 descriptor."""

[[status.evidence]]
kind = "rom-bytes"
supports = "identity"
at = "1ek7a:0001cc08"
value = "130400000000007500000000130300000000008100000000"
note = """
The variable cam solenoid descriptor pair is P0075 and P0081. The stock \
catalog has no separate P0078 or P0084 exhaust solenoid descriptor."""

