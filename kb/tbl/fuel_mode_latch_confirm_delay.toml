summary = "Confirmation delay: number of passes before latching ffff24d0 bit 7"
note = [
    """
Confirmation delay: number of passes before latching ffff24d0 bit 7. Result \
disposition: inline_comparison. Result target: Comparison 00056f4e: \
zero-extended byte counter ffff54ee >= zero-extended interpolated output of \
map 00012136; when the comparison is true and bit 0x40 in ffff4184 is set, \
instruction 00056f5c sets bit 0x80 in ffff24d0. Machine trace: \
00056f18-00056f2e reads ffff54ee, zero-extends the byte, increments it by 1, \
saturates it to 0xff, and writes the byte back. 00056f32 loads base \
00012136, 00056f34 reads the byte index from ffff106f, and delay slot \
00056f3a zero-extends it before the call to 00026370 at 00056f38. Wrapper \
00026370 returns the last map byte for index >= 0xe0; for a smaller index, \
it passes processing to kernel 00026a80. In the kernel's byte branch, \
00026aac and 00026aae read two adjacent cells and 00026ab0 and 00026ab2 \
zero-extend them, after which 00026ab4-00026ab6 passes them to 00026740. \
00026740-0002676c performs unsigned linear interpolation with truncation and \
returns a value between adjacent cells; for map contents \
20,20,20,20,20,10,0,0, output is bounded to 0..20, including boundary return \
of the last cell. 00056f3c moves the result to r2, 00056f44 writes the low \
byte to ffff14df, and 00056f46 zero-extends the same r2 again. \
00056f4a-00056f4c reads and zero-extends counter ffff54ee. 00056f4e executes \
cmp/ge r2,r5, testing r5 >= r2; both operands are nonnegative and fit in the \
signed range. Branch 00056f50 ends the path when the threshold is not \
reached. 00056f54-00056f58 requires bit 0x40 in ffff4184, after which \
00056f5c sets bit 0x80 in ffff24d0.""",
]
