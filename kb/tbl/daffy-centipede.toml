summary = """
Implicit 1D table of a zero/nonzero permission to hold internal state 2. The \
lookup result is written to u8[ffff254b] and tested for zero on the state-2 \
branch: a nonzero result enables comparison battery-voltage raw ffff1188 > \
100; if the comparison is true, state 2 is retained, otherwise state 1 is \
selected."""
note = [
    """
Exact DID 0x1103 identifies ffff1188 as battery voltage. All eight stock \
cells equal 6, so the lookup always yields a nonzero result and effectively \
enables the above-raw-100 test, or above 8.00 V under the source-bound 0.08 \
V/count conversion. ffff107f is the previous-pass image of normalized \
coolant index ffff1077, so the implicit nodes are -40,-20,...100 deg C. The \
write and read occur in 00038618 but belong to different states; ffff254b \
has no external readers. The physical identity of the state remains \
unresolved. The implicit map has no separate axis array. Index: implicit \
1D-8: x = u8[ffff107f]; for x < 224, i = floor(x/32), Q0.16 fraction q = (x \
mod 32)*2048, interpolation of map[i]..map[i+1]; for x >= 224, map[7] is \
returned. Output trace: 00038a68 -> 00038a6e -> 00026370 -> 00026a80 -> \
00026740 -> 00038a74 -> ffff254b -> 00038ad6 -> 00038ad8; zero -> 00038ada \
-> 00038b7c, nonzero -> 00038adc -> 00038ae2 -> 00038ae4 -> 00038ae6. Result \
disposition: inline_comparison; Result target: RAM ffff254b; consumer \
00038618; site 00038ad8.""",
]
