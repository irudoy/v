summary = """
Two-word activation/release hysteresis for a normalized dual-channel \
accelerator-pedal analog quantity. FUN 00047a56 compares current sample \
ffff266e with cell 0 when previous-cycle state ffff246d bit 7 is clear and \
with cell 1 when that state is set, then writes current state ffff246a bit \
7. Scheduler 00020dfe copies ffff246a to ffff246d once per cycle."""
note = [
    """
The stock activation and release thresholds are 610 and 528 counts. The \
input is produced from on-chip A/D channels AN10 and AN17 through \
dual-channel adjustment and minimum selection. Exact JK08A diagnostic paths \
expose the paired accelerator-pedal sensors as DID 0x120D/0x120E and monitor \
them through P2122/P2123/P2127/P2128. The operational high-state role is \
proven; a narrower WOT or kickdown interpretation is not asserted.""",
]
