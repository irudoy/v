summary = """
Dimensionless coefficient W for the response-curve branch of the \
intake-cam-deviation correction. With T0, T1, and T2 from curve 000125ca, \
code calculates c0=max(0,64+trunc0(W*(T0-T2)/512)) and \
c1=max(0,64+trunc0(W*(T1-T2)/512)); floor((c0+c1)/2) enters centered output \
ffff1a7d."""
note = [
    """
FUN 0004d2a6 evaluates the 16x16 map by RPM/50 and uint8[ffff102c]>>3. \
Negative products add 511 before the arithmetic right shift by 9, proving \
signed division by 512 rounded toward zero. This branch is selected \
unconditionally by ffff2458.bit5 and otherwise when uint8[ffff102c] is at or \
below threshold map 000124b2. Code proves the narrow operational role in a \
centered intake-cam-deviation correction consumed by ignition-angle \
calculations; the engineering degree scale is unresolved. Result \
disposition: consumer.""",
]
