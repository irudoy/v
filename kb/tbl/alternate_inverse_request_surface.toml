Conditional alternate signed 16x16 surface. FUN 00076ad0 interpolates each \
row at y=ffff1152 or max(ffff1152,ffff1162), producing a dynamic 16-word \
axis whose inverse lookup through output table 00013d14 writes ffff1e7a."""
note = [
    """
The logical row coordinate is 00013d14 and the logical column coordinate is \
00013d34; direct row-major access does not create inferred AXIS_X or AXIS_Y \
edges. Every stock cell is zero, which decodes to -32768 and makes every \
dynamic-axis cell zero. A positive offset-binary target therefore reaches \
terminal coordinate 727. The path requires ROM8[000089fa].bit5, which is \
clear in stock JK08A. The populated companion surface 0000de8e supplies the \
primary inverse pass. Result disposition: consumer.""",
]
