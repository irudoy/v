summary = "Limit for ffff3334 that sets sticky bit 3 of ffff4204"
note = [
    """
Limit for ffff3334 that sets sticky bit 3 of ffff4204. Result disposition: \
inline_comparison. Result target: 000a554e: cmp/hi r2,r6, where \
r2=sext16(interp_u8(00012a62, selector)<<8), r6=sext16(mem16[ffff3334]); for \
two sign-extended 16-bit words, cmp/hi is equivalent to comparing their \
values as uint16, meaning uint16[ffff32ee] < uint16[ffff3334]. Machine \
trace: 000a547e: x=uint8[ffff2739] -> 000a5480..000a548a: selector=0 when \
x<=10 -> 000a548c..000a5496: selector=255 when x>=150 -> 000a5498..000a54a8: \
selector=trunc((16*x-160)/10) when 11<=x<150, division 00021bbc with \
truncation toward zero -> 000a54aa: r4=00012a62 -> 000a54ae/00026370: for \
selector<224, branch to kernel 00026a80; for selector>=224, return \
byte[map+7] -> 00026aac..00026ab2: load and zero-extend adjacent uint8 cells \
-> 00026740: unsigned linear interpolation -> 000a54b2: extu.b result -> \
000a54b6: shift by 8 -> 000a54be: write word to ffff32ee -> \
000a5530..000a554c: enable checks and reads of ffff3334/ffff32ee -> \
000a554e: unsigned cmp/hi -> when uint16[ffff32ee] < uint16[ffff3334], \
000a5552..000a555a sets bit 0x08 in ffff4204.""",
]
