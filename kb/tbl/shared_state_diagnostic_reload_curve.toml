title = "Shared state diagnostic reload curve"
summary = """
Explicit sixteen-point uint8 reload curve on 00014340, read through 000282c8 \
by state routine 0007a8a8 and diagnostic routine 000aab8a. The state reader \
multiplies its result by 100 for word reloads at ffff89f8 and ffff8a06; the \
diagnostic reader stores the raw result as byte reloads at ffff1555+channel \
and ffff2434+channel."""
note = [
    """
State input ffff895f is selected by 00079708: ROM8[0000895a] bit 5 clear \
selects ffff26ca and bit 5 set selects ffff1066. The diagnostic input is \
ffff1066 directly. The producer and physical identity of ffff26ca, consumer \
task periods and a common time conversion remain unresolved; the distinct \
reload widths and scaling do not establish one clock contract.""",
]
