summary = """
Transient state-threshold base. FUN 0007b650 looks it up by \
x=clamp_u8(16*u8(ffff1a58)-2704), scales the raw result into ffff1393, and \
FUN 0007b7c0 compares a runtime word against 32*ffff1393 with calibrated \
hysteresis while maintaining ffff2478 bit 6."""
note = [
    """
The exact scale is \
ffff1393=min(255,floor(2*(raw*(clamp(u8(ffff479e),55,85)-50)+25)/25)). This \
arithmetic and the downstream comparison prove a transient threshold role. \
The five catalog matches do not distinguish Fuel Cut, Lock-Up, combined, or \
Stepping on from Idle variants. No direct path from ffff2478.bit6 to \
ffff11d4 or APC compares is established, so an applied retard quantity and \
degree scale are not claimed. Result disposition: hysteresis threshold.""",
]
level = "code"
role = "table"
access = "explicit"
unit = "raw"
scale = "x"
to_raw = "x"

