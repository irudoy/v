summary = """
Coefficient v of the first-order filter of the intake CVTC duty controller \
for a non-negative controller error. FUN_000E81F8 looks up this surface and \
stores v = x * 2.0e-5 in 0xFFFFAA50. FUN_000E91FA forms the error e and its \
sign, and FUN_000E8794 selects v by the sign and divides by 2v + 0.01 with \
the coefficient 2v - 0.01 on the previous output. Stock 2500..7325."""
