The physical quantity is unknown. There is no separate ROM axis: an implicit \
grid with dynamic input ffff106f is used. After min selection, the value \
participates in multiplications, a shift, saturation to 0x7f, and a write to \
ffff1831, but this RAM result also depends on other quantities and is not an \
associated sink of the target map. Index: implicit 1D-8 uint16: \
q=uint8[ffff106f]<<8; for q<0xe000, linear interpolation is performed \
through 00026a60/00026740; for q>=0xe000, element 7 at base+0x0e is \
selected. Output trace: 00014bea -> 0004c0c4 -> 0004c0cc -> 0004c0ce -> \
000263d8 -> 00026a60 -> 00026740 -> 0004c0d2 -> 0004c0f0 -> 0004c0f2 -> \
0004c0f4 -> 0004c0f6/0004c0f8. Result disposition: inline_comparison; Result \
target: site 0004c0f4.""",
]
