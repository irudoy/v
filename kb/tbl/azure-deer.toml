summary = """
Inverse half of a reciprocal nonlinear coordinate pair. With \
F(z)=interp_u8(00011d24 over axis 0001199e,z) and G(q)=interp_u8(0001199e \
over axis 00011d24,q), FUN 00063f30 and FUN 0006469c use G to return a \
blended F-domain value to the original raw coordinate."""
note = [
    """
In FUN 0006469c, x=clamp_u8(s8[ffff23f1]-s8[ffff2404]), a=F(x), and \
y=floor((0xff00-u8[ffff1862]*(256-a))/256). The function writes \
clamp_s8(s8[ffff23f1]-G(y)) to ffff1346. FUN 00063f30 performs the parallel \
forward-blend-inverse operation with weight ffff186a before updating Q8 \
state ffff23c2. The 16 stored values 0..40 are also the breakpoint axis of \
F. Code proves the operational inverse transform; the physical quantity and \
engineering scale are unresolved. Result disposition: consumer and inverse \
coordinate source.""",
]
