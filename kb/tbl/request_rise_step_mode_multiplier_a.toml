Target reader 000a7ca8 matches 1ND 000a1cb8 instruction for instruction and \
corresponds to the JK78C request rise-step builder 0008ff76: an 8x8 word \
surface at coordinates clamped to 0x2a0 and 0x8c0, times the state \
multiplier indexed by a state byte limited to 7, times two optional byte \
multipliers that default to 0x80, shifted right by 8 and 13 and capped at \
