summary = """
Fixed-address unsigned MAF Factor byte in the 7mfk primary BFS calculation. \
ROM8[0x8a27]=109 multiplies positive signed-tested aggregate Q and ROM16 K; \
after /256 the stock split product retains low 40 bits before unsigned speed \
division. The aggregate is not an index."""
note = [
    """
Stock F is 109. The A2L MAF Factor entry matches the byte's operational \
position, representation, and cross-ROM literal-pool signature and \
distinguishes it from K-Value. Homologous values are 133 for 1ND0A/1ND3B, \
131 for JK78C, 109 for JK03A/JK08A, and 132 for JK00D. The engineering unit \
and multiplier remain source-derived pending hardware validation. J1979 Mode \
01 PID 0x10 declares ROM8[0x83ec]/25600 g/s per count of the total quantity \
that the Base Fuel Schedule producer reproduces from A+B, which is 0.01477 \
kg/hr per count with stock 105, while F*0.0001 gives 0.0109 kg/hr per count; \
the A2L unit of F does not match the ECU's declared airflow.""",
]
