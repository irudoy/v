note = """
This unsigned byte is a coefficient of the fixed-point airflow-to-BFS \
product at 0004967e. FUN_000495c8 combines it with K-Value and the airflow \
aggregate before the speed division and final fixed rescaling. The J1979 PID \
0x10 formatter separately reads FFFE8072 and multiplies it by ROM8 at \
000083d9 before shifting the diagnostic result by eight. The BFS product \
does not yield an independent kg/hr conversion for its coefficient."""

