summary = """
One-dimensional signed-offset step table for stationary rev-limiter \
readiness accumulator ffff16a6. Every time timer ffff258a expires, FUN \
0004f324 decodes the interpolated byte as x-128, adds it to the accumulator \
with saturation to 0..65535, and reloads the timer with 100."""
note = [
    """
The lookup coordinate is q=clamp((signed16(ffff11bc)-160)/2,0,255). Input \
ffff11bc is RPM/12.5, so origin 160 is 2000 RPM and each two-count selector \
step is 25 RPM. At or below 2000 RPM the stock result is 128 and step zero. \
In the high-RPM limiter region result 255 gives step 127; exactly three \
expiries reach inclusive readiness threshold 381, or 300 tenth-phase counts. \
Passive target-CAN timestamps establish 10.24 ms/count and a total of 3.072 \
seconds.""",
]
level = "code"
role = "table"
access = "explicit"
unit = "accumulator counts"
scale = "x-128"
to_raw = "x+128"
scale_level = "code"

