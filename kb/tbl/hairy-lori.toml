summary = """
Identity coordinate table for conditional inverse interpolation of signed \
surfaces. FUN 00076ad0 constructs a dynamic 16-word axis from a selected \
column of surface 0000de8e, searches the offset-binary target from ffff18ea \
or ffff3394 against that axis, and returns the corresponding 00013d14 \
coordinate. An optional second inverse pass uses surface 0000e28e before \
downstream blend and range restoration."""
note = [
    """
The same 16 words also serve as the direct forward-surface axis for 0000de8e \
and 0000e08e. Stored points are 0, 9, 18, 36, 55, 73, 91, 136, 182, 227, \
273, 364, 455, 545, 636, and 727. The inverse path restores its result with \
min(800,floor(x*800/727)); FUN 000d16c2 converts ffff2816 into the 0..727 \
domain with floor(x*727/800) before later bounds logic. Stock \
ROM8[000089fa].bit5 and ROM8[00008b29].bit6 are both clear, so FUN 00076ad0 \
copies ffff2a7a to ffff2816 instead of executing the inverse path. JK03A has \
the same addresses and bytes. VQ35HR JK00D preserves the two-surface \
algorithm with coordinate table 000160e6; VQ37VHR 1ND0A preserves the \
one-surface inverse and 727/800 conversion with table 000155e2. The physical \
identity of the first-channel raw quantity remains unresolved. Result \
disposition: consumer.""",
]
level = "code"
role = "table"
access = "explicit"
unit = "first-channel raw coordinate"
scale = "x*800/727"
to_raw = "x*727/800"
scale_level = "code"

