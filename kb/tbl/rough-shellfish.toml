summary = """
Interpolated uint16 M forms threshold 64*M for an unsigned comparison with \
param_3; the comparison result selects setting flag ffff928b or ffff928a."""
note = [
    """
Code proves the operational threshold role but not its physical meaning. The \
interpolation result is extended to uint16, multiplied by 64 with three \
shll2 instructions, and compared with param_3; the condition sets ffff928b \
when param_3 is below the threshold or ffff928a otherwise. All eight cells \
equal 65535, so the current calibration yields a constant threshold, but \
flat content does not identify its purpose. Multiplication by 64 is a \
conversion before comparison, not a physical-scale claim without a known \
param_3 unit. Result disposition: inline_comparison. No physical quantity is \
asserted beyond narrow operational semantics.""",
]
