All 4 cells equal 90, so both lookup paths return 90 and actual indexing \
does not change the output. The physical name of the quantity and the \
subsystem are unknown. The artifact has no associated external sink; the \
claim is limited to visible local arithmetic and comparison. Index: Implicit \
u8 index from RAM_ffff106f: for x<192, i=floor(x/64), fraction=(x-i*64)*1024 \
in Q0.16, and cell[i]..cell[i+1] are interpolated; for x>=192, cell[3] is \
returned. Result disposition: inline_comparison (site 00044d12).""",
]
