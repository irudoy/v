summary = """
Stock-inert phase of the reference valve event pair of the VVEL idle-model \
stage FUN_00057322, zero at 0x8000 and 0.5 per count, looked up by engine \
speed and the VVEL load word 0xFFFF238A. The stage places the reference \
events 0xFFFFA1F8 and 0xFFFFA1FC at C +/- 0.025 * (0xFFFF356C - 0xFFFF356E), \
with C = 478 - 0.5 * (raw - 0x8000), and blends them with 0.05 * 0xFFFF356C \
and 0.05 * 0xFFFF356E by the ramped weight 0xFFFFA358 into 0xFFFFA1EC and \
0xFFFFA1F0. Those cells enter the duration and phase of the trimmed pair \
only while ROM8[0x8957].bit5 is clear; stock ROM8[0x8957] = 0x3A sets the \
bit, so no stock output depends on this surface."""
note = [
    """
Native editor class (issue #129): stock-inactive on 1ND and 1ME3B. Reader \
1ND 00060244 / 1ME3B 00064042 skips the read while bit 5 of ROM8 1ND \
00008a19 / 1ME3B 00008a6a is set, and the stock byte 0x3a on every image \
sets it, as the JK78C byte 00008957 leaves the role stock-inert.""",
]
