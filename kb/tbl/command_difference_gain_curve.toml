note = """
Target function 000aab88 corresponds to JK78C 000920ea \
(request_difference_limit_builder): the same sequence of calibration loads \
and lookup calls up to the final cap, with this table in the same call and \
argument register. After the final cap the target adds a flag-selected \
branch with two throttle_angle_to_area_primary lookups (00014832 over \
00016e86 at 000aae6c and 000aae78), which JK78C lacks. The difference and \
alternate builders read stock-identical copies; the reader and its load \
order select the copy. MOV.L 000aac3e loads this table for the call at \
000aac42 (dfco_lookup), as MOV.L jk78c:000921aa loads 00014188 for the call \
at jk78c:000921b0 (dfco_lookup). Its 16 stock bytes equal JK78C."""

