[[symbol]]
layout = "1me3b"
address = "00013cf6"
level = "code"
note = """
Coordinator 0x00048564 selects this curve instead of the default \
fuel-compensation surface for state code 8 (VVEL input mode 15). At full \
current-state weight, changes to the default surface are replaced by this \
channel. During a transition, the coordinator mixes current_channel*w with \
previous_channel*(0x8000-w), using the held previous output during an \
interrupted transition, then normalizes by 0x8000 and clamps the result to \
0..255. The weight 0x8000 is 1.0. Stock driving reachability of input modes \
5 and 15 is unconfirmed on every image. The physical unit, engineering \
conversion and neutral value are unestablished; raw 128 is not qualified as \
neutral. No engine-bank identity is established."""

