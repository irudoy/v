summary = """
Interpolated 1D table of a dimensionless coefficient with step 1/128 that \
multiplies byte[ffff1717] in calculation of derived byte ffff3218; a copy of \
the coefficient is written to ffff3406."""
note = [
    """
The interpolated byte is written separately to ffff3406, but the RAM sink \
has no external readers. The write is not the final disposition: the same r4 \
remains live, is zero-extended at 000b5fee, and is multiplied at 000b6000. \
On branch byte[ffff22e0]==0, the derived result is calculated as an \
arithmetic right shift by 7 of expression M*uint8[ffff1717]-128*B, saturated \
to 0..255, and written to ffff3218; B is byte[00008bc4] or 0 depending on \
flag byte[ffff2458]. Saturation applies to the derived result rather than \
the map scale. The artifact does not establish the physical meaning of RAM \
quantities, so only operational semantics proven by code are claimed. Result \
disposition: consumer.""",
]
