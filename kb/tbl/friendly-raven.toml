summary = """
Base Fuel Schedule boundary between states 2 and 3 of selector ffff2b4b: the \
lookup result is the inclusive lower bound of state 2 and exclusive upper \
bound of state 3 when compared with high byte ffff1024."""
note = [
    """
All 16 cells equal 253, so the threshold does not depend on the index. The \
result is captured in r10 at 000835e8 and compared in place. Exact DID \
0x1208 establishes the Base Fuel Schedule input identity; x/8 ms is \
profile-derived and requires hardware validation. Index: implicit 1D-16 with \
q=min(2*max(u8[ffff11ae]-8,0),255), interpolation below 240, and cell 15 at \
or above 240. Result disposition: inline_comparison; target sites 0008367e \
and 0008368a.""",
]
