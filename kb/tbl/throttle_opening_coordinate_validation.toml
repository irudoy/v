summary = """
Trustful throttle-valve angle coordinate table. It is the static axis of \
opening-area table 00018766 and the returned-value table when the same pair \
is used in reverse for area-to-angle conversion."""
note = [
    """
The inverse paths interpolate half of ffff1d18 or an adjusted value over \
00018766. One path writes the raw angle coordinate to ffff1cea; another \
divides it by four before writing ffff35c8. Neither word has a reader, so \
the percent gradient is inherited from byte-identical primary coordinate \
table 000155a0 rather than established here.""",
]
