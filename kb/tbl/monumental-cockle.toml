summary = """
Centered multiplier table for adjacent lookup results: byte y is converted \
into Q13 multiplier g=max(0,8192+(y-64)*u8(RAM[ffff10bf])); flat y=64 \
defines a unity multiplier."""
note = [
    """
Three lookups by uint8 ffff106f form g=max(0,8192+(y-64)*uint8[ffff10bf]); g \
scales adjacent lookup results before a right shift by 13. All cells equal \
64, so current g is 8192. The result is consumed in registers at 00051700 \
and 0005185c; the physical subsystem is unknown.""",
]
