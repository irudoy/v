produces 5120 (0x1400), while 20 is written to ffff413f. Saturating \
conversion min(x*256,65535) is not claimed as a scale because it lacks an \
exact inverse pair. Index: implicit 1D-8: q=min(uint16[ffff40c6]*128,65535); \
