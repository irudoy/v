path, ffff32b8 -> 000661f4 -> comparison and subtraction in 00066186 -> \
ffff32b8. Result disposition: writes; Result target: RAM ffff32b8 at site \
000661d6; RAM ffff413f receives the high byte of ffff32b8 in FUN_00066186.""",
