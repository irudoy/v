summary = """
Unsigned 1D table of the second multiplier in a composite calculation. The \
interpolated byte is stored in ffff1451 and, at site 0004c34c, multiplied by \
low32(r12 * lookup(0001208e)); low32 of the product is passed as a signed \
32-bit dividend to 00021bbc, divided by 0x14000 with truncation toward zero, \
capped at 255 by an unsigned comparison, and written as a byte to ffff1875."""
note = [
    """
The physical quantities of input ffff1450 and the coefficient are unknown. \
There is no separate ROM axis: indexing is implicit, so axes is empty. \
ffff1451 has no external readers, but the saved copy of the result in r5 is \
consumed inside the accessor at site 0004c34c; the value is not dead. A \
nontrivial scale for the individual multiplier cannot be separated from the \
composite product with 0001208e and r12. Index: x=uint8(RAM[ffff1450]); for \
x>=224, cell[7] is returned; otherwise i=x>>5, f=(x&31)<<11 in Q0.16, and \
the result is unsigned linear interpolation of cell[i] and cell[i+1]. Result \
disposition: consumer (site 0004c34c).""",
]
level = "code"
role = "table"
access = "explicit"
unit = "raw"
scale = "x"
to_raw = "x"

