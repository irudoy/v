summary = """
Unsigned surface contribution to the signed balance in the P0128 \
thermostat-function model. FUN 000b7b98 indexes the surface by current \
RPM/12.5 and Base Fuel Schedule, suppresses the result when aggregate \
six-channel inhibit mask ffff22e0 is nonzero, otherwise multiplies it by a \
selected uint8 coefficient, and writes the uint32 product to ffff2d04."""
note = [
    """
FUN 000b6b5a forms T=sat_u32(ffff3220+sat_u32(ffff3228+ffff2f98)), writes \
(u32[ffff2d04]>>1)-(T>>1) to ffff33fc, and passes that signed difference to \
FUN 000b7c84 for calibrated scaling and saturation into ffff3400. FUN \
000b5908 invokes the coordinator every tenth monitor pass and reports \
descriptor 0xcb, whose exact ROM record is P0128. Every stock map cell and \
every point of both axes is zero, so the lookup and ffff2d04 are always zero \
in JK03A and JK08A even though the call and downstream balance are live. The \
physical heat-flow interpretation and engineering scale remain unresolved. \
Result disposition: consumer.""",
]
