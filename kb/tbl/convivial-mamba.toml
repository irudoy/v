summary = """
Dimensionless 1D table of a Q0.6 coefficient. Lookup by RAM byte ffff106f \
returns M; the same r6 scales signed difference \
4*u16[ffff1046]-u16[ffff1024], forming \
trunc0((4*u16[ffff1046]-u16[ffff1024])*M/64), whose sign selects the \
downstream processing branch."""
note = [
    """
There is no separate axis array. The lookup result is mirrored to RAM \
ffff1ca6 through site 00052328, but this RAM sink has no external readers; \
the actual code consumer of the same r6 is at site 00052338. For a negative \
product, site 00052342 adds 63 before the arithmetic shift, so the integer \
result is rounded toward zero. Downstream limiting and combination are \
visible in pseudocode but are not part of the invertible cell scale. Numeric \
round trip: 6 -> 0.09375 -> 6; 32 -> 0.5 -> 32. The artifact does not \
identify the physical subsystem. Index: implicit 1D-8 by u=uint8[ffff106f]: \
for u<224, i=floor(u/32), fraction=(u%32)/32, and map[i]..map[i+1] are \
linearly interpolated; for u>=224, map[7] is selected. Output trace: map \
0001300e -> site 0005231a -> site 0005231e -> function 00026370 -> (site \
00026a80 -> function 00026740 | saturation return in function 00026370) -> \
site 00052322 (r0->r6) -> [site 00052328 -> RAM ffff1ca6; site 00052338 -> \
site 00052346 -> function 000224fa -> site 0005234a -> site 0005234c]. \
Result disposition: consumer; Result target: site 00052338 (FUN_000522c4).""",
]
