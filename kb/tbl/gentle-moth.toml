summary = """
First table-derived multiplier in an internal weighted calculation: the \
value from ffff1754 is multiplied in 00046fb2 by the centered output of map \
00012a42, after which the product undergoes an arithmetic right shift by 6."""
note = [
    """
The claim is limited to operational code semantics without an unproven \
physical name. For calibration byte x, direct scale to ffff1754 is x*2 and \
inverse scale is x/2; units are raw because no physical unit is traced. The \
centered output of 00012a42 lies in 0..64, and 000224fa arithmetically \
shifts the product right by 6. ffff1754 has no external readers, but read \
00046fae and mul.l 00046fb2 prove internal consumption; the write is not \
dead control flow. Result disposition: consumer.""",
]
