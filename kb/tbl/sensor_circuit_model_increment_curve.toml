title = "Increment curve of JK78C sensor-model helper bb3a6"
summary = """
Implicit 16-point uint8 curve of 000bb3a6 through dfco_lookup at coordinate \
max(uint8[ffff11a3]-16, 0). The helper adds the result to a floor byte, \
compares the sum with a RAM word, and integrates a selected rate into a word \
output. Monitor 000bad54, which reports internal codes 0xcd and 0xce for a \
byte below 3 or above 0xf1, calls it; 7mfk has no counterpart monitor."""
