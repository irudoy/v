summary = """
Unsigned 1D coefficient for the first multiplier of a composite byte output: \
lookup M is multiplied by the output of map 00009eda and normalized by \
division by 128; the result is then multiplied by a correction containing \
lookup 0001242a, normalized by division by 64, capped at 255, and written to \
ffff15de."""
note = [
    """
The lookup by min(uint16[ffff1222]>>3,255) is a Q1.7 multiplier for the \
first stage of composite calculation ffff15de. Pair x/128 and x*128 is \
invertible on the representable grid: 0 -> 0 -> 0; 128 -> 1 -> 128; 255 -> \
1.9921875 -> 255. The physical subsystem is unknown; the implicit RAM axis \
is not emitted separately.""",
]
