summary = """
Interpolated uint16 parameter: a zero result from 00015bf0 is replaced with \
1, while a nonzero result is stored in ffff35a0 and passed as the fourth \
argument to 000b78da. The physical purpose of the parameter is unknown."""
note = [
    """
Code implements replacement of zero only, not a general max(x,1). The map \
and axis consist of zeros, so JK08A passes 1. The catalog accel-throttle \
family does not distinguish the purposes of the three adjacent maps.""",
]
