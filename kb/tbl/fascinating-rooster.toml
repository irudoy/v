summary = """
Multiplier, constant in the current calibration, for an intermediate \
coefficient calculated from RAM ffff160a and ffff165e before a logical right \
shift by 15; the resulting coefficient then scales adjacent lookup results."""
note = [
    """
All 16 cells equal 128, so the current calibration yields 128 for any index. \
Code proves the operational role: after zero extension, the byte multiplies \
intermediate value ((RAM[ffff160a] * RAM[ffff165e]) >> 8); the product is \
then passed to 0002227c with fixed shift 15, and the resulting coefficient \
participates in scaling adjacent lookup results. The physical quantity and \
distribution of fixed-point scales among multipliers are unknown, so the \
scale remains raw. The write to ffff1840 has no external readers, but the \
same SSA copy in r5 is consumed at 00056898; this is neither a comparison \
nor a return nor dead control flow. There is no explicit ROM axis, so axes \
are empty. Result disposition: consumer.""",
]
