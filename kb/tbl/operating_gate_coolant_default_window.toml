title = "Operating gate coolant default window"
summary = """
Inclusive coolant interval encoded as upper/lower byte bounds, used when \
ffff23b9.bit6 is clear. Both bounds share the coolant/ram conversion degC = \
raw-50 of uint8[ffff106f]. The stock bounds define 10..60 degC. Leaving the \
interval clears the held coolant-window latch."""
note = [
    """
Known BFS, coolant, battery-voltage and final-timing inputs retain their \
tracked conversions. The enclosing physical subsystem, invocation period and \
other input quantities remain unresolved under issue #110. Curve-output \
conversions, editor publication and later-layout counterparts require \
separate qualification.""",
]
