summary = """
Conditional subtractive correction in the engine-event timing coordinate. \
The interpolated uint16 amplitude is multiplied by a selected byte \
coefficient, divided by 100, subtracted from a signed intermediate, and \
clamped to [-128,127] before the result reaches both APC compare schedulers \
and the shared diagnostic byte."""
note = [
    """
FUN 0004d99c writes ffff12d6; 0004dbe8 forms ffff11d4; 0004df82 publishes \
ffff2022 and schedules GR11A through 0002a892; 0004e080 adds the secondary \
offset and schedules GR11B through 0002acba. FUN 0003235c also returns \
ffff2022 for four exact pointer-table aliases. The operating-mode qualifier, \
degree unit, physical edge polarity, and producer of ffff237e remain \
unresolved. A whole-program p-code scan found only the read of ffff237e at \
0004da82. Result disposition: actuator and diagnostic command chain.""",
]
