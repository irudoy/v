summary = """
Target mixture map: Q7 fuel-multiplier command against the stoichiometric \
base schedule (commanded equivalence ratio x/128), 128 = closed-loop \
stoichiometric target, 149 = 1.16. Stage 0005594a looks it up on engine \
speed (axis 00011cc0, rpm/50 against word ffff11bc) and load (axis 00011ac7, \
normalized BFS Q7 from ffff102c, or 0xff while wide-open latch ffff2468 bit \
3 holds), scales the deviation from 128 by 00012552 when ffff2466 bit 6 \
selects the high-detonation surface, and publishes the byte as ffff15eb and, \
through enrichment latch ffff24a2 bit 7 and the ramp of ffff123a, as \
commanded mixture ffff22e8 = byte << 7."""
note = [
    """
Public HR A2L name Target AFR Map (8x8) with gasoline scale 1881.6/x on axes \
Cylinder Filling Up Efficiency (x*0.78125 percent) and Engine Speed (x*50); \
the AFR scale is a candidate, the Q7 ratio and the stoichiometric neutral \
are code. Three 2026-08-26 vehicle recordings match the lookup in 98.3..100 \
percent of settled records. Result disposition: consumer.""",
]
