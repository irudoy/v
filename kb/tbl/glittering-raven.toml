summary = """
When unsigned uint8[ffff10f9] < ROM byte[000085c1], the map is indexed by \
the high byte of uint16[ffff272a], and the interpolated byte is written to \
ffff2f94."""
note = [
    """
Branch uint8[ffff10f9] < ROM[000085c1]=0x55 selects 0001259a. The high byte \
of uint16[ffff272a] is the index, and the interpolated result is written to \
ffff2f94. The physical quantity and separate scale are unknown.""",
]
