summary = """
Interpolated uint16 M multiplies a quotient in an internal calculation; the \
product is saturated to 0xffff or divided by 64, after which the derived \
uint16 is written to ffff9372."""
note = [
    """
Result disposition: consumer. No physical quantity is asserted beyond narrow \
operational semantics. Values are 255..342. Code proves only the algorithmic \
role of the interpolated result as a multiplier: a product above 0x003fffc0 \
is replaced by 0xffff; otherwise it is shifted right by 6. A nontrivial \
physical scale and physical semantics are unproven.""",
]
