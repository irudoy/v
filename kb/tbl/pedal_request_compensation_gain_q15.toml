Percentage Q15 multiplier. Code selects the maximum of interpolated M and \
ffff18c8, writes it to ffff19be, limits it to 40960, and applies it as a \
multiplier to a nonnegative difference divided by 32768 before writing the \
derived value to ffff3614."""
note = [
    """
Code confidence applies to the percentage Q15 multiplier. The TTEPTD Torque \
Compensation Map name remains candidate without a physical consumer for \
ffff3614. Result disposition: consumer.""",
]
