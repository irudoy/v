summary = """
Eight-node byte-state table. When bit 6 of ffff2462 is set, the lookup \
writes the result to ffff254d and sets bit 7 of ffff246c. On the branch with \
bit 6 clear, saved byte ffff254d is tested for zero: zero clears bit 7 of \
ffff246c, while nonzero preserves it. All cells equal 6, so this map's \
result is always 6 and is handled as nonzero."""
note = [
    """
The physical subsystem and engineering unit are not established: ffff254d \
has no external readers and the catalog shape is ambiguous. All eight cells \
equal 6, so interpolation and the terminal branch return 6; this proves a \
nonzero state and branch behavior but not the physical name of the quantity. \
Index: x=uint8(ffff106f). For x<224: i=floor(x/32), q=(x-32*i)*2048 in \
Q0.16, and cell[i] and cell[i+1] are interpolated. For x>=224, cell[7] is \
returned. The axis is implicit, with no separate Axis claim. Output trace: \
00012afa -> 00043afe -> 00043b04 -> 00026370 -> 00026a80 -> \
{00026aac,00026aae} -> 00026740 -> 00043b08 -> ffff254d; subsequent state \
read: ffff254d -> 00043b10 -> 00043b12 -> 00043b14 -> 00043b1a. Value 6 does \
not follow zero branch 00043b18. Result disposition: inline_comparison; \
Result target: site 00043b12 through ffff254d.""",
]
level = "code"
role = "table"
access = "explicit"
unit = "raw"
scale = "x"
to_raw = "x"

