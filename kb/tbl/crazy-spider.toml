summary = """
Second-channel endpoint B of the Q16 two-surface crossfade in FUN 000720c4. \
The function interpolates this surface by ffff1248 and ffff10d2, stores the \
result in ffff1cbc, and applies shared Q16 weight ffff190e against endpoint \
A 00017cc8."""
note = [
    """
Every stock cell is zero, so the blend is zero for every weight. The lookup \
executes, but stock ROM8[000089fb].bit3 is clear and the final selector \
always publishes ffff1248 through ffff1cb6. No crossfade intermediate \
reaches an external consumer. Result disposition: dead_control_flow. Result \
target: ffff1cb6 receives ffff1248 in unmodified JK08A. The physical \
quantity and engineering unit remain unresolved.""",
]
