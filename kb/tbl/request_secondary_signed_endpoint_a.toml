summary = """
Endpoint A signed surface for a Q0.16 blend. FUN 00074028 interpolates it by \
x=uint16[ffff1210] and y selected from ffff10d2/ffff10e2, decodes raw-32768, \
and writes ffff1cfc. FUN 000740e2 uses weight ffff1d0c to blend this \
endpoint with 00016fc8 into ffff1cf6."""
note = [
    """
When ffff4255.bit7 is clear, y=ffff10d2; when set, y=max(ffff10d2,ffff10e2). \
Weight 0 selects this endpoint, 65535 selects endpoint B, and intermediate \
weights use floor(((65536-w)*A+w*B)/65536). The surface is byte-identical to \
endpoint B 00016fc8 and to conditional pair 0000de8e/0000e08e in stock \
JK08A, so the pair weight cannot change the stock result. The physical \
quantity and engineering unit are unresolved. Result disposition: \
consumer.""",
]
