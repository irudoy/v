reaches the call at 000778e8 (helper 0002aa48) in r4, as MOV.L \
jk78c:000653b2 loads 00013560, and 00013560 plus 0x8 reaches the call at \
jk78c:000653d8 (helper 000281b0) in r4. Its 16 stock bytes equal JK78C."""

