summary = """
Rise reload table of the intake idle target, selected while ROM8[00008616] \
bit 0 is set. FUN 000bdb66 and FUN 000bdc66 write its eight-point implicit \
lookup to ffff1a1e and countdown ffff25ee; with ffff247b bit 1 set and \
ffff1a1e nonzero, FUN 000bdc66 raises intake target ffff2326 toward idle \
source byte ffff1553 by one count each time the countdown reads zero and \
reloads the pair."""
note = [
    """
When bit 0 at address 00008616 equals 1, both accessors select 00012efe; the \
alternate branch selects adjacent 00012f06. All eight cells equal 5, so the \
lookup returns raw 5 for every input; stock ROM8[00008616] is 0x01, so the \
stock image selects this table. The result is also mirrored to RAM ffff25ee \
at 000bdc3c and 000bde94. Index: implicit 1D-8 by uint8 input u: nodes 0, \
32, 64, 96, 128, 160, 192, 224; for u < 224, index floor(u/32) and linear \
Q0.16 interpolation of adjacent uint8 cells; for u >= 224, table[7] is \
returned. Output trace: 00012efe, pointer load 000bdc14 -> wrapper call \
00026370 at 000bdc2a -> kernel 00026a80 -> uint8 cell reads \
00026aac/00026aae -> finisher 00026740 -> r0/r6 at 000bdc2e -> RAM ffff1a1e \
at 000bdc34; 00012efe, pointer load 000bde70 -> wrapper call 00026370 at \
000bde82 -> kernel 00026a80 -> uint8 cell reads 00026aac/00026aae -> \
finisher 00026740 -> r0/r5 at 000bde86 -> RAM ffff1a1e at 000bde8c. FUN \
000bdc66 reads the pair on later passes: the ffff1a1e nonzero test and the \
ffff25ee zero test gate each one-count rise (JK08A.cvtc.md). The routine \
that counts ffff25ee down is not identified, so the time base of the rise is \
not established. Result disposition: writes; Result target: RAM ffff1a1e, \
writes 000bdc34 and 000bde8c; mirror RAM ffff25ee, writes 000bdc3c and \
000bde94. Evidence boundary: The machine trace ends at RAM ffff1a1e writes \
at 000bdc34 and 000bde8c. On the first path, 000bdc3a branches \
unconditionally to 000bdc5c and bypasses the comparison at 000bdc52. On the \
second path, the result in r5 is overwritten after the write at 000bde9c, \
while the return from FUN_000bdc66 is not associated with the lookup. The \
shown read of ffff1a1e inside FUN_000bdc66 precedes the lookup and does not \
form an intra-call downstream trace.""",
]
