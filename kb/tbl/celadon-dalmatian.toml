T=400..3000, so mulu.w, MACL, and the later ushort conversion do not \
overflow. Scale confidence: code. Scale: x*100; inverse encoding: x/100; \
units: uint16 RAM ffff34e2 counts. Scale trace: 00012312 (1D-16, uint8; \
values 4..30) -> wrapper 000264a0 call at site 0005d758 -> result r0 -> \
extu.b at 0005d75c, so x is limited to 0..255 -> immediate 0x64 loaded at \
0005d760 -> mulu.w at 0005d762 -> MACL -> r7 at 0005d76a; the product is in \
0..25500 and fits uint16. In 0005d6ae, without further conversion, this \
value participates as (ushort)((x & 0xff)*100) in an unsigned comparison \
with uVar1 read as ushort from RAM 0xffff34e2. The path executes in the \
active branch after testing flag 0x80; the initialization branch does not \
read the map and defines no alternate scale. 0xffff34e2 is the read \
comparison operand rather than a RAM sink of the map result; the result is \
consumed in place. Second accessor 00088bba stores the raw byte without \
