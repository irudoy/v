summary = """
Stock-inert offset of the upper limit of the warm DFCO-transition \
timing-state addend 0x000137E8. When ROM8[0x8966].bit0 is set, FUN_000644D0 \
stores the centered addend, lookup minus 0x80, in 0xFFFF14E6, looks up this \
eight-point curve by the engine-speed byte 0xFFFF11A3 over the axis \
0x00013C6A and stores the centered value in 0xFFFF1318, forms the limit \
signed8(0xFFFF1980) + (curve - 0x80) + high8(0xFFFF233E), saturates it to \
-128..127 in 0xFFFF14F0, and writes the smaller of the centered addend and \
the limit to 0xFFFF14E5. With bit 0 clear, it writes the centered addend \
unchanged. Stock ROM8[0x8966] = 0x50 keeps bit 0 clear, and every stock cell \
holds 0x80."""
note = """
JK08A FUN_0004AFDC has no counterpart of this limit. The curve carries no \
editor entry because the stock configuration never reads it."""
