summary = """
Eight-point table of an unsigned multiplier for the negative branch of \
signed16 ffff1a66: the interpolated map byte is divided by 2, written to \
ffff150a, and multiplied by ffff1a66 at 00052902; the product is divided by \
256 with truncation toward zero, saturated to signed16, zeroed for a \
specified flag combination, and written to ffff2300. When ffff1a66 >= 0, the \
map value is replaced with constant 64 before the write."""
note = [
    """
The physical quantity is unknown. The map value affects the write to \
ffff150a only on path int16[ffff1a66] < 0; when ffff1a66 >= 0, the result \
register is replaced with constant 64. For map values 70..102, the \
map-derived byte after shar is 35..51. Conversion floor(x/2), subsequent \
multiplication, and division by 256 are conditional and do not form an exact \
invertible scale pair; in particular, x/512 does not correctly describe odd \
cells 77 and 93. Index: Implicit index: b=uint8[ffff102c]; \
q=(b<128)?2*b:255. For q>=224, equivalent to b>=112, element 7 is selected; \
for q<224, kernel 00026a80 reads adjacent uint8 values and passes them to \
Q0.16 interpolator 00026740. There is no explicit ROM axis; preparation of \
the exact index/fraction before the shown 00026a80 slice is not included in \
the artifact. Result disposition: writes (ffff150a).""",
]
