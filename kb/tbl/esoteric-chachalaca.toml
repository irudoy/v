summary = """
Common conversion curve for two adjusted channels. FUN 0003edb4 interpolates \
it at Z1/Z2 from FUN 0003ef74, then combines each result Y with one \
offset-binary correction-map result, one signed state, and one optional \
signed term as clamp(Y+A+O+P-32768,0,65535). The outputs are ffff29e2 and \
ffff29e4."""
note = [
    """
The output values span 5000..30000. The vendor AFR Conversion Table name and \
downstream two-bank fuel-trim context are supporting evidence, but code does \
not establish a physical AFR scale. Result disposition: consumer.""",
    """
The complete bounded conversion executes both channels with exact bytes and \
real helpers; both signed16 clamps, admission/bypass, integer lookup \
rounding and final output saturation are independently checked. The \
independent software domain and reader interpretation do not establish \
source producers, physical units, engine reachability, permission or \
cadence.""",
]
