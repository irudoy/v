summary = """
Operational table of the step used to change a 16-bit blend coefficient. \
When unsigned RAM[ffff10d2] < 200, lookup by the constrained absolute \
difference between signed16 RAM[ffff18e6] and RAM[ffff18e8] writes the step \
to RAM[ffff17f8]. On the active branch, 00074b68 subtracts this step with \
saturation toward 0 or adds it with saturation toward 65535, updating \
RAM[ffff2422]; 00074c08 uses the updated coefficient as the weight for \
linear blending of signed16 RAM[ffff18e8] and RAM[ffff18e6] and writes the \
result to RAM[ffff18f4]."""
note = [
    """
The physical subsystem is unknown. The map result is a Q0.16 step: raw x \
represents dimensionless fraction x/65536, and inverse pair x*65536 is exact \
on the representable grid. Saturation occurs later when ffff2422 is updated \
and is not part of the map-value conversion. 00074c08 uses updated ffff2422 \
as a weight; separate handling of 0 and 65535 defines blend boundary cases, \
not a conditional map scale. When RAM[ffff10d2] >= 200, the same accessor \
selects adjacent map 000153b0 rather than the target map. Index: 1D-4, \
implicit axis with no separate array; r5 = min(abs((int16)RAM[ffff18e6] - \
(int16)RAM[ffff18e8]) * 64, 49152), returning the last cell when r5 >= \
49152. Result disposition: consumer (RAM ffff17f8 -> function 00074b68).""",
]
