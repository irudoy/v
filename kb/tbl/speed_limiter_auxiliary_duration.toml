summary = """
Auxiliary duration word written to ffff413c when final limiter output is \
below APP request and zero-based target gear index ffff1083 is greater than \
zero-based current gear index ffff1082. Otherwise zero is written."""
note = [
    """
The stock value is 182. CAN 0x174 byte 3 supplies both indices and passive \
target shifts establish the target-first upshift relation. The exact \
consumer and physical time semantics of ffff413c remain unresolved.""",
