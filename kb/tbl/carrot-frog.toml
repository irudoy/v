00012b32 is selected by instruction 00064336 when bVar1 == 1 on the branch \
with (ffff2466 & 0x40) == 0. Accessor 0006425a writes the interpolation \
result to ffff3373; consumer 00064cb2, called later from 00065434, reads \
this byte. All 8 map cells and all 8 axis points are zero; this does not \
prove role=dead or threshold and defines no physical scale.""",
]
