summary = """
Lower normalized-BFS input point of a bounded linear ramp, selected by table \
using raw byte ffff11b3"""
note = [
    """
On branch (RAM[ffff2466] & 0x40) == 0, the map defines L in the same Q7 \
normalized-BFS representation as ffff1048 and adjacent 00012462 defines \
upper value H. When L < C, code calculates \
trunc0(H*(RAM[ffff1048]-L)/(C-L)), where C is terminal cell \
ROM8[00011ecd]=128 of ignition load axis 00011ebe, then limits the result to \
0..H; when L >= C, it selects 0. C is therefore exactly the 100-percent \
fixed-reference point. All target-map elements are zero, but the role is \
established by consumption rather than contents. The physical process \
controlled by the ramp is unknown. Result disposition: inline_comparison.""",
]
