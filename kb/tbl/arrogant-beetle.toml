256; q < 0xe000 is processed by kernel 00026a60, while q >= 0xe000 selects \
uint16(map+0x0e). Output trace: 0005519c -> 000551a8 -> 000263d8 -> 00026a60 \
-> 00026740 -> 000551ac; 000551ac -> 000551b0(ffff1406); 000551ac -> \
000551b4(ffff2ff0) -> 000551b8 -> [000551be | 000551c0 -> 000551c2] -> \
000551c8(ffff2ff0). Result disposition: inline_comparison; Result target: \
FUN_00055098: comparison 000551b8, branch to zero at 000551be or subtraction \
at 000551c0; the result is written to RAM ffff2ff0 at 000551c8.""",
]
