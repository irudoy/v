summary = """
On the lookup branch, the 8-bit table result is shifted left by 8 bits, \
added to the result of 00012342, converted back to byte form, and used at \
000474a4 with coefficient 2 as a positive addend in a 16-bit calculation \
before saturation."""
note = [
    """
The lookup by uint8 ffff1070 is represented as x<<8, added with saturation \
to the result of 00012342, and used through ffff15b1 at 000474a4 with \
coefficient 2. The uncombined result is also written to ffff15b5. The \
physical quantity is unknown; the implicit RAM axis is not emitted \
separately.""",
]
