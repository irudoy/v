summary = """
Conditional 1D table of a subtraction quantity: when bits 0x01 and 0x02 are \
both set in ffff22e1, the interpolated uint8 value of the target map is \
subtracted from the lookup result of map 00011f12, then uint8 from ffff1842 \
is subtracted; a negative result is replaced with zero and written as a byte \
to ffff12db."""
note = [
    """
The physical subsystem and engineering unit are unknown. There is no \
separate ROM axis. ffff12db receives a composite result, not a copy of the \
target-map lookup. Index: implicit 1D-8: x = uint8 RAM ffff106f; fixed nodes \
0, 32, 64, 96, 128, 160, 192, 224; for x < 224, linear interpolation with a \
Q0.16 fraction is performed between adjacent uint8 values; for x >= 224, \
cell[7] is returned. Result disposition: writes (RAM ffff12db, derived byte \
store at site 0004b2d2).""",
]
level = "code"
role = "table"
access = "explicit"
unit = "raw"
scale = "x"
to_raw = "x"

