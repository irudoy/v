summary = """
Eight-point uint16 table of a value for conditional internal-state loading: \
lookup result x is converted as min(x*256,65535), written to ffff32b8, and \
its high byte is written to ffff413f. On the alternate path, this state is \
compared with a step quantity and reduced with saturation toward zero."""
note = [
    """
The physical subsystem and physical units are unknown: root FUN_00066186 has \
no call sites, and the artifact has no external readers of the RAM values. \
Code confidence applies only to narrow operational semantics. The map is \
flat, so in this ROM the lookup always yields 20; runtime conversion \
produces 5120 (0x1400), while 20 is written to ffff413f. Saturating \
conversion min(x*256,65535) is not claimed as a scale because it lacks an \
exact inverse pair. Index: implicit 1D-8: q=min(uint16[ffff40c6]*128,65535); \
for q<57344, the kernel performs linear interpolation of adjacent uint16 \
values; for q>=57344, the wrapper selects element 7. Output trace: 000661be \
[delay slot 000661c0 sets r4=00015330] -> 000263d8 -> 00026a60 -> 00026740 \
-> return to 000661c2 -> 000661c6 -> 000661ca/000661ce -> 000661d6 -> \
ffff32b8 -> high-byte extraction in 00066186 -> ffff413f; on the alternate \
path, ffff32b8 -> 000661f4 -> comparison and subtraction in 00066186 -> \
ffff32b8. Result disposition: writes; Result target: RAM ffff32b8 at site \
000661d6; RAM ffff413f receives the high byte of ffff32b8 in FUN_00066186.""",
]
