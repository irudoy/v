Unsigned 16-bit 1D table of a common addition. After the lookup, when \
(ffff41a5 & 4)==0 the result is lower-capped at 46, written to ffff2eba, and \
separately added with saturation to 65535 to ffff2c4e and ffff2c50, forming \
ffff303c and ffff303e."""
note = [
    """
The physical quantity, unit of input ffff40c6, and physical output scale are \
unknown. The shape match with catalogs is ambiguous. The conditional lower \
limit 46 and downstream saturation process the result and are not scale \
claims. Index: implicit 1D-8. Input min(uint16(ffff40c6)*128,65535): for \
value <57344, implicit interpolation of 8 uint16 elements is performed \
through 00026a60/00026740; for value >=57344, element 7 at address \
00023824+14 is returned. Output trace: site 0006f918 (000263d8: 00023824 -> \
00026a60 -> 00026740; for input>=57344, direct read of 00023824+14) -> site \
0006f91e -> (site 0006f920/site 0006f922/site 0006f924; site 0006f926/site \
0006f928/site 0006f92c conditionally) -> site 0006f936 -> ffff2eba -> \
0006f938 -> ffff303c; ffff2eba -> 0006fe6e -> ffff303e. Result disposition: \
writes; Result target: RAM ffff2eba.""",
]
