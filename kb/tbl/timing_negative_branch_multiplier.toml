When ffff15d2==0 and signed16 ffff140a<0, the lookup multiplies -ffff140a; a \
raw copy is in ffff15ca, and internal reader 0004d0aa uses it in the \
calculation. The map is filled with zeros, but this does not prove dead \
control flow. The physical subsystem is unknown.""",
