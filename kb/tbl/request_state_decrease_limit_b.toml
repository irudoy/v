summary = """
1D table of a decrement step for RAM state ffff17c0. During a descending \
update, the lookup is compared with current ffff17c0: if current >= lookup \
and the calculated target <= current - lookup, current - lookup is written; \
if current < lookup, the state is zeroed. Otherwise the higher calculated \
target is retained."""
note = [
    """
The physical subsystem is unknown. The map is selected by the branch that \
adds 0x10 to base 00014304 when a calculated 8-bit selector lies outside the \
range of two bytes at 00008ace. The lookup result is not written as an \
independent quantity: it is consumed inside 00074e4e while limiting a \
descending update of ffff17c0; external readers of derived ffff23fc are not \
used as evidence for target-map semantics. The map has no explicit ROM axis, \
so axes is empty. Index: 1D-8 with an implicit axis. Coordinate r5 is formed \
as saturating uint16(RAM_ffff1210 << 7): for RAM_ffff1210 >= 0x0200, 0xffff \
is used. For coordinate < 0xe000, wrapper 000263d8 interpolates adjacent \
uint16 values through 00026a60/00026740; otherwise it returns element 7 at \
offset +0x0e. Output trace: 00014314 -> site 00074f30 -> site 00074f36 -> \
000263d8 -> [00026a60 -> 00026740 | direct +0x0e return] -> site 00074f48 -> \
site 00074f6c -> site 00074f70 -> 00074e4e -> ffff17c0 -> ffff23fc. Result \
disposition: inline_comparison; Result target: site 00074f70.""",
]
