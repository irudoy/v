summary = """
Base threshold and disable sentinel for the stateful signed rotational-speed \
request limiter. FUN 0002c648 initializes ffff1796 from this scalar. FUN \
0007584e treats 0xffff as an immediate neutral return. The enabled filter \
converges to 4*N but uses its entry value for the 0x9424 blend and its newly \
stored value for the 0x9426/0x9428/0x942a request terms. Engagement requires \
previous signed ffff19d8 < APP request ffff243c; equality takes the \
inactive/reset branch. Fast and normal ramp states, an independent final \
term, a recovery envelope with rollback, forced-neutral synchronization, and \
auxiliary outputs produce ffff19d8. Periodic indices 18, 20, 21, and 22 \
carry this candidate through signed-minimum arbitration and controller \
bounds to shared signed request ffff19c6. The stock-active continuous \
command path to ATU-II BFR6A-D continues through ffff198a, ffff183e, \
ffff19b2, per-channel targets ffff28bc/ffff28be, and the feedback regulator. \
FUN 00077892 also uses the scalar as an unsigned cap while calculating \
signed transmission candidate ffff4162. Common completion 000777fa can pass \
that candidate through ffff3480/ffff3484 only while ffff41a6.bit3 is set."""
note = [
    """
The stock word is 0x2580, or 7500 RPM, between fuel-cut release 7450 RPM and \
activation 7650 RPM. Exact SHA-locked ROM execution covers 51 state and \
sweep cases and 7200..7800 RPM at four APP requests; after 20 measured 10.24 \
ms passes, APP 10000 yields 10000 at 7500, 7601 at 7600, 5466 at 7700, and \
3086 at 7800. The secondary candidate bounds the shared request only while \
00077892 holds ffff41a6.bit3 set, during a gear change with TCM field \
ffff3a2e == 3 and the 307.2 ms hold after it; the 2026-09-22 road captures \
show such episodes in 4-3 and 3-2 downshifts, so calibration-only A/B \
testing is isolated from that secondary path only outside them. The limiter \
never enters fuel mask ffff22e0. A controlled vehicle comparison of three \
JK08A map slots on 2026-09-21 fixes the RPM multiplier and the throttle \
action: slot value 0x1900 closes both throttle sensors from 369/371 to \
166/171 counts from 5000 RPM under a rising pedal and holds 4915..5137 RPM, \
slot value 0x2580 closes them from 838 to 209/214 counts from 7466..7488 RPM \
with the pedal held at 4.70 V and holds 7412..7565 RPM, and slot value \
0xffff leaves them at 835..837 counts until the 7650 RPM fuel cut; no \
limiter interval sets ffff22e0. Plate response time, channel-to-bank \
identity, and ECM terminals remain outside that measurement.""",
]
