summary = """
Base end-of-injection angle over the engine-speed axis 00015f32: eight \
uint16 cells that writer 000730cc reads through wrapper 000282f4 with word \
ffff11ac. The writer adds one or two correction bytes to the interpolated \
value and stores uint16[ffff192a] = 2*min(sum, 209), the delay in 2 crank \
degrees per count from the reference tooth of the scheduled channel to the \
end of the pulse. A cell of x counts ends the pulse 4*x - 590 degrees after \
the following intake TDC, as a cell of JK08A 00012302 does; all 8 stock \
cells equal 133, 58 degrees before intake TDC."""
level = "code"
home = "jk78c"
role = "table"
access = "explicit"
cols = 8
rows = 1
storage = "uint16"
unit = "deg after intake TDC"
scale = "x*4-590"
to_raw = "(x+590)/4"
scale_level = "code"

[editor]
name = "End of Injection Angle - Base"
category = "Fuelling / Injection"
