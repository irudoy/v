summary = """
Eight-point uint8 base curve in a composite calculation. Its interpolated \
result is multiplied by max(0, 8192 + (lookup(000121ae) - 64) * \
uint8(ffff10bf)), normalized by 8192 with truncation toward zero, saturated \
to 255, and written to ffff1531. The result then participates with ffff1528 \
and conditionally updated ffff152b in the product normalized by 16384 and \
written to ffff1532."""
note = [
    """
Code establishes a composite-calculation base curve, not an RPM threshold. \
The physical quantity and subsystem of ffff1531 and ffff1532 remain \
unresolved. Table shape alone does not support the catalog name Over Run \
Fuel Cut.""",
]
