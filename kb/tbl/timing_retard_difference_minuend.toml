note = """
Target function 00077680 performs the program of JK78C 000655c8 \
(timing_retard_difference_producer) inline, at the position where JK78C \
00068af8 calls it: the same two retard-difference lookups, the subtrahend \
and then the minuend. It is the second lookup, the minuend. MOV.L 000779ca \
loads this table, which reaches the call at 000779d0 (helper 0002aa48) in \
r4, as MOV.L jk78c:000655e4 loads 00013588, which reaches the call at \
jk78c:000655e8 (helper 000281b0) in r4. Its 16 stock bytes equal JK78C."""

