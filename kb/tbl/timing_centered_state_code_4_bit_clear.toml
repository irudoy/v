summary = """
Centered secondary state surface for codes 4 with ffff23c6.bit6 clear. \
FUN_000657E4 selects or Q15-blends the current and saved-code samples around \
raw center 128 before publishing the intermediate at ffff1206. FUN_000657E4 \
uses the ROM8[00008965].bit5-set compositor. On the stock state-dispatch \
path ROM8[00008966].bit4 is set: both current code ffff43f2 and saved code \
ffff4480 are evaluated, then selected or blended according to ffff2814. The \
bit-clear path also evaluates its two endpoint samples. The alternative bank \
selector is ffff23c6.bit6; input load may be forced to 255 by the separate \
override gate. Stored-byte timing units are not established here."""
