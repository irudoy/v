summary = """
Six-channel injection-pulse multiplier indexed directly by channel number \
0..5. For a positive calculated pulse, FUN_0004eba2 multiplies by the \
selected byte, shifts the product right by 7, saturates to uint16, and \
writes the raw and transformed six-channel output arrays."""
note = [
    """
All six stock cells are 128, so every channel uses multiplier 1.0. A set bit \
in override mask ffff22e0 bypasses this multiplier and selects word \
ffff2436. The trace proves channel indexing but does not establish the \
physical cylinder order; presentation labels remain generic channel \
numbers.""",
]
