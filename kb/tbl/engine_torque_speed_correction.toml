summary = """
RPM-indexed unsigned coefficient for a bounded engine-torque correction. FUN \
000658a4 multiplies the interpolated value by a nonnegative byte difference, \
divides by 256, and writes the result to ffff14e2 for the downstream \
torque-state arithmetic."""
note = [
    """
The direct scratch copy ffff14e4 has no external reader, but the same live \
lookup result remains in r6 and is consumed at 00065908 before ffff14e2 is \
written. FUN 00065cd8 and FUN 00064a1c add or subtract ffff14e2 in the same \
raw domain as offset-binary Engine Torque Map 00010b8e. The continuous \
consumer path assigns an engine-torque correction role. The physical x*0.1 \
Nm conversion follows the Engine Torque Map catalog and requires hardware \
validation. Result disposition: consumer.""",
]
