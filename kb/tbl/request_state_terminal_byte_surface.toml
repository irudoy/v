Code confirms the structural role of an 8x8 uint8 table, unsigned reading, \
interpolation, and a byte-result write. The map and both axes are filled \
with zeros, which does not identify a physical meaning. The catalog contains \
ten incompatible 8x8 variants and cannot distinguish them without an output \
consumer. Raw identity describes only the byte representation and is not a \
physical-scale claim. Blocking condition: The trace stops at site 0007a378 \
when the result is written to RAM ffff2c7a, which has no readers. Before the \
return at 0007a396 there is no comparison of this exact quantity and no \
consumer call; the subsequent conditional write through r2 to ffff2c71 does \
not read ffff2c7a and can be replaced at site 0007a382. Branch \
unreachability has not been proven. Physical semantics and a nontrivial \
scale therefore cannot be established. Result disposition: writes.""",
]
