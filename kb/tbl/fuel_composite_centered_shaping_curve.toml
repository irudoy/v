summary = """
Interpolated 1D table of a neutral-centered multiplier for a composite byte \
result: 64 is subtracted from the lookup result, the difference is \
multiplied by RAM8[ffff10bf], divided by 128 with truncation toward zero, \
and offset again by 64; the resulting multiplier scales a base from maps \
00009eda and 00012432 before being written to RAM8[ffff15de]. Flat value 64 \
defines a neutral multiplier."""
note = [
    """
The lookup by uint8 ffff106f is converted to \
64+trunc0((x-64)*uint8[ffff10bf]/128) and scales the base from 00009eda and \
00012432 before the write to ffff15de. Operations -64/+64 belong to the \
consumer, so the map is retained as raw identity. Value 64 is neutral; the \
implicit RAM axis is not emitted separately.""",
]
