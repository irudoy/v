summary = """
Multiplicative correction: interpolated uint16 M from ffff402a multiplies a \
quotient in an internal calculation; the product is saturated to 0xffff or \
divided by 64 and written to ffff8c74."""
note = [
    """
Result disposition: consumer. No physical quantity is asserted beyond narrow \
operational semantics. Code confirms the operational role but not the \
physical purpose of input RAM registers and ffff8c74. Shifting the result by \
6 after multiplication applies to a product with a multiplier of unknown \
scale and does not define a separate map scale, so raw identity is retained. \
Map 0001454a and sink ffff402c belong to an adjacent independent path.""",
]
