summary = """
Raw table of a target level and upper bound for a linear transition: the \
lookup result is multiplied by a relative difference, divided by signed \
32/32, then the original table value acts as the result's upper bound before \
it is written to ffff15ec."""
note = [
    """
Code proves only raw semantics of the target level and upper bound for a \
linear transition, not the physical quantity. The 16 values of 0xff do not \
prove that the function is disabled. The target map executes on the branch \
where (RAM[ffff2466] & 0x40) == 0; unreachability of this branch has not \
been proven. ffff15ee has no external readers, but the value is consumed \
inside 0004bbee, so this is not dead control flow. Result disposition: \
inline_comparison.""",
]
