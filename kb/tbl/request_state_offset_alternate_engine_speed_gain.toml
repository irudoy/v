summary = """
Implicit byte gain in the gated alternate branch of 8fd6c, indexed by \
min(u16[ffff11a6],0x8c0)/10 from the engine-speed word. It scales the \
alternate centered state word with a seven-bit shift before signed-word \
clamping, separately from the two-gain primary product."""
