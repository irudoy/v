summary = """
Implicit 8x8 byte surface of fuel_cut_parameter_pair_builder for the first \
byte of the fuel-cut parameter pair once the selector ratio reaches its \
threshold; fuel_cut_pair_primary_surface serves below it. The inputs, the \
pair and the fuel-cut entry sequence that loads this byte into its first \
countdown are those of fuel_cut_pair_primary_surface."""
note = [
    """
Selector: bit 1 of ffff4525 (1ND bit 2 of fffeb83f, 1ME3B bit 3 of fffeb9a4) \
is set while the word ffff447e (1ND fffeb784, 1ME3B fffeb8da) has reached \
0x8000 and has not fallen below 0x7300, the stock threshold and release on \
every image. Its physical quantity is unresolved.""",
    """
Native editor class (issue #129): active on 1ND and 1ME3B. Reader 1ND \
0007765c / 1ME3B 0007bf3c runs from fuel_cut_coordinator 000760cc / \
0007a740, every stock image passes the ROM8 gate of its surface path, and a \
run-time bit selects between the two surfaces. The surfaces set the entry \
countdown of the deceleration fuel cut, not an ignition-timing or limiter \
role, and stay out of the editor.""",
]
