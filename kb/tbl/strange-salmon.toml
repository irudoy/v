summary = """
Dimensionless coefficient on the param_1=0 branch of function 000c0d90: two \
centered uint8 quantities form a difference scaled as trunc0((A-B)*x/100)."""
note = [
    """
With param_1=0, 000123f2 is selected. Two bytes loaded at 000c0db6 and \
000c0dc4 are centered by subtracting 128; code calculates (r14-r12)*x/100. \
Raw x is written to ffff128c+0x34a+0, or ffff15d6. The derived result is \
returned to center 128 and saturated to uint8. All cells are zero; the \
physical domain of the quantities is unknown.""",
]
