title = "Operating gate context word window"
summary = """
Inclusive upper/lower word bounds for uint16[ffff22bc]. When \
uint16[ffff11e0] is at least 32, a value outside \
[ROM16[00008d9e],ROM16[00008d9c]] sets failure latch ffffa647. The first and \
second words are the upper and lower bounds respectively. The input \
quantities remain unresolved."""
note = [
