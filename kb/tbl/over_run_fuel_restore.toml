summary = """
Coolant-indexed lower/full-restore RPM threshold in FUN 00050018. At speed \
count below 4 it is the lower boundary for class 3. At speed count 4 or \
above every branch reachable under the stock compile-time flags returns \
class 3 at or below the effective lower threshold and class 0 only strictly \
above it."""
note = [
    """
The adjusted result is stored in ffff16aa after coolant floors, runtime \
offsets, and a conditional minimum of 48 counts or 1200 RPM. Exact stock \
moving branches ignore upper/intermediate table 0001298c. The target-vehicle \
capture selected only moving samples, retained stock 000126e4/00012718, \
changed both restore tables, and eliminated the full 0x3f inhibit mask below \
5000 RPM. Because 0001298c is not compared on that branch, this hardware \
result isolates 00012818 as the operational moving veto. Equality remains \
class 3, so a raw value of 200 vetoes through exactly 5000 RPM in the \
quantized coordinate and class 0 begins only above it. Result disposition: \
inline_comparison.""",
]
level = "code"
role = "table"
access = "explicit"
unit = "RPM"
scale = "x*25"
to_raw = "x/25"
scale_level = "code"

