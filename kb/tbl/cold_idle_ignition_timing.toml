summary = """
Default/post-transition eight-point timing-state addend in FUN 0004afdc. It \
is selected whenever the stock-inert feature path and warm transition path \
are not selected and the separate state-3/bit-7 constant bypass is not \
active. The interpolated result enters ffff1511 through the exact x-128 \
transform."""
note = [
    """
The separate constant path selects raw 0x9e, or +30 counts, when ffff22ff=3 \
and ffff2458.bit7=1. Target-vehicle A/B evidence isolates 00012196 during \
matched warm deceleration: a 16-count slot difference at 4000..4400 RPM \
produced the same 16-count median final-coordinate shift with no \
corresponding fuel-word shift. This proves one-for-one software-coordinate \
propagation and makes the catalog Cold Idle qualifier nonexclusive. The \
alternate compositor branch of 0004bdc2 forms \
ffff1830=clamp_s8(ffff1a7d+ffff23ee-ffff23c5-64) at 0004be82 and shares the \
ffff2404 -> ffff2378 -> ffff12d6 -> ffff11da -> ffff11d4 chain of \
coefficient 1 with the low-seven surfaces, and J1979 PID 0x0E publishes \
ffff11d4 as A/2-64 degBTDC, so one count of this map is one crank degree of \
the declared coordinate. Index: implicit 1D-8 over ffff11b2 with nodes \
0,32,...224 and saturation at element 7. Result disposition: writes (RAM \
ffff1511, site 0004b0d0).""",
]
level = "code"
role = "table"
access = "explicit"
unit = "deg"
scale = "x-128"
to_raw = "x+128"
scale_level = "code"

