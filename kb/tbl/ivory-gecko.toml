summary = """
Bank 2 MAF sensor transfer curve. FUN 0003a904 looks it up from the low 12 \
bits of bank-2 preprocessed sample ffff1e4a, writes uint16 output B to \
ffff1056, and copies it to working value ffff105a. The same value enters \
total-MAF producer 0003b27e and the paired contribution calculation in \
0003b520."""
note = [
    """
Exact code traces SH7058 AN15 through ffff1d64, diagnostic word ffff101e, \
preprocessing ffff1e4a, this curve, and total-MAF DID 0x1209. Exact DID \
0x1205 names the channel MAS A/F SE-B2. The implicit code axis advances by \
16 input counts per cell; homologous profiles convert one count to 0.005 V, \
yielding the cataloged 0.00..5.04 V axis at candidate scale. Stock outputs \
are strictly positive, so the contribution denominator A+B is nonzero. This \
branch does not produce ffff3a76. Result disposition: consumer. One count of \
the output is 105/25600 g/s: the bank outputs sum through ffff1df4 into \
ffff105c, and J1979 Mode 01 PID 0x10 declares ROM8[0x83ec]*ffff105c/256 as \
g/s*100 with the stock factor 105; a changed factor changes the declared \
conversion.""",
    """
On 7mfk, the independently assembled stock lookup executes 64 unsigned word \
cells with step 256, unsigned argument truncation, last-cell clamping, and \
both caller word stores. The source input advances one cell per 16 raw \
counts. The last word returns sign-extended before the caller word store. \
This executable contract supplies no additional hardware validation of the \
voltage axis or g/s conversion.""",
]
