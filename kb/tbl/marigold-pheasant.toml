summary = """
Dimensionless coefficient K for the high-ffff102c fallback branch of the \
intake-cam-deviation correction. Code calculates \
d0=max(0,64+trunc0(K*(u8[ffff1a8d]-128)/256)) and \
d1=max(0,64+trunc0(K*(u8[ffff1a8c]-128)/256)); min(d0,d1,64) enters centered \
output ffff1a7d."""
note = [
    """
FUN 0004d2a6 evaluates the 16x16 map by RPM/50 and uint8[ffff102c]>>3. The \
interpolated byte is stored at ffff15ef but remains live in r6 and r3 until \
both multiplications. Negative products add 255 before the arithmetic right \
shift by 8, proving signed division by 256 rounded toward zero. This branch \
is used when ffff2458.bit5 is clear and uint8[ffff102c] exceeds threshold \
map 000124b2. Code proves the narrow operational role in a centered \
intake-cam-deviation correction consumed by ignition-angle calculations; the \
engineering degree scale is unresolved. Result disposition: consumer.""",
]
