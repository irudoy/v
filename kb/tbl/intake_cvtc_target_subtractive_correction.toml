summary = """
Conditional intake-cam target correction. When ffff2466.bit6 is set, FUN \
000bda64 calculates clamp_u8(output_0000b43a - output_0000ab5a + 128); when \
the bit is clear, it bypasses this map. The corrected target is written to \
ffff1c5c and enters the intake CVTC target path."""
note = [
    """
Code proves the conditional intake-cam correction path and centered raw \
arithmetic. The target-vehicle capture contains zero samples with \
ffff2466.bit6 set, so this branch has no dynamic validation. The correction \
is subtracted from the 0000b43a output count for count, so it carries the \
intake edge-phase unit of 0.5 crank degrees per count. The high-detonation \
meaning of the selector and the Cylinder Filling axis name remain catalog \
candidates. Result disposition: consumer.""",
]
level = "code"
role = "table"
access = "explicit"
unit = "degCA"
scale = "(x-128)*0.5"
to_raw = "x*2+128"
scale_level = "code"

