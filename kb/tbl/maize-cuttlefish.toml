summary = """
Unsigned interpolated eight-point table whose result is a byte addend: it is \
written to ffff15b0, represented in parallel as x<<8, added with uint16 \
saturation to the result of 0001234a in the same representation, and the \
high byte of the sum is written to ffff15b1."""
note = [
    """
The lookup by uint8 ffff1070 is written to ffff15b0, represented as x<<8, \
and added with saturation to the result of 0001234a; the high byte of the \
sum is written to ffff15b1. Direct sink ffff15b0 has no external readers, \
but the value continues through registers. The physical quantity is \
unknown.""",
]
