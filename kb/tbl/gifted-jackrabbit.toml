summary = """
Stationary rev-limiter fuel-cut/restore hysteresis. Entry requires coarse \
vehicle speed ffff110e to equal zero. With readiness bit 4 of ffff247f set \
and state bit 5 clear, engine speed ffff11ae reaching cell 0 sets fuel cut. \
While bit 5 is set, speed below cell 1 restores fueling. FUN 0004ed88 \
includes the Boolean result in the aggregate fuel-output inhibit path."""
note = [
    """
The stored bytes are 36 and 30, or 1800 and 1500 RPM. Readiness requires \
accumulator ffff16a6 to reach ROM16[0000911c]. Exact firmware traces CAN \
0x280 vehicle speed through ffff113c, ffff115e, ffff118e, and the scheduler \
snapshot ffff110e; the required zero value establishes the stationary role. \
Additional entry gates ffff244f bit 2 and ffff2458 bit 5 remain physically \
unnamed.""",
]
