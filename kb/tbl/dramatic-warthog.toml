summary = """
1D step coefficient for saturating reduction of 16-bit state ffff1866: \
interpolated uint8 is multiplied by uint8 from ffff3373, the product reaches \
ffff13dc, and on the corresponding branch it is subtracted from nonzero \
ffff1866 with lower saturation at 0."""
note = [
    """
The physical quantity of ffff3373 and the purpose of state ffff1866 are \
unknown. All eight cells equal 0, so the current calibration contributes \
zero for every input. The lookup result has no direct RAM sink: it is first \
consumed by multiplication, and ffff13dc receives the derived 16-bit \
product. This multiplication is runtime consumption, not a map scale. Index: \
implicit_1d_8_u8; input=clamp(((uint16(ffff40c6)*0x2d0e)>>15)-0x20,0,255); \
for input<0xe0, the kernel linearly interpolates adjacent uint8 points of \
the implicit grid; for input>=0xe0, element[7] is returned. Result \
disposition: consumer (ffff13dc).""",
]
