summary = """
Eight-point implicit table of an unsigned UQ0.16 coefficient. The lookup \
result scales the lookup result of map 00015062; rounded product/65536 forms \
a local 16-bit comparison threshold."""
note = [
    """
All 8 cells equal 0xffff, but constant content is not used as semantic \
evidence. The claim is based on trace lookup -> fixed-point multiplication \
-> derived threshold -> comparison. The physical names of the indexing \
quantity and compared parameter are not proven. The inverse pair is exact in \
the raw domain: for r=0..65535, round((r/65536)*65536)=r. Index: v is \
selected by branching before the lookup: with bit 0x80 at 00008b3f clear, \
U16_BE[ffff10d2] is selected; on the other branch, v is formed from \
U16_BE[ffff1016] by multiplication by 0x280 and byte swapping at \
0007316e..00073196. At 00073198..000731aa, q=sat_u16(v<<7) is calculated. \
For q<0xe000, wrapper 000263d8 transfers control to implicit kernel 00026a60 \
for linear interpolation of 8 adjacent U16 cells through 00026740; for \
q>=0xe000, the wrapper returns the last cell map[7] at offset +0x0e. There \
is no separate axis array in ROM. Output trace: On the path that reaches \
000731b2: BE U16 cells of map 00015082 -> wrapper 000263d8 -> implicit \
kernel 00026a60 -> linear finisher 00026740 -> r0; 000731b6 zero-extends the \
result, 000731b8 multiplies it by the zero-extended lookup result of map \
00015062 in r14, 000731be adds 0x8000, and 000731c0 extracts the high 16 \
bits into r4. 000731c8 writes the derived threshold to ffff1734, then \
000731ee compares the current value in r5 with r4; the comparison result \
participates in updating bit 0x04 at ffff2488. The direct lookup result from \
00015082 has no separate RAM sink. Result disposition: inline_comparison; \
Result target: 000731b8 (direct arithmetic consumer) -> ffff1734 (derived \
threshold) -> 000731ee (comparison).""",
]
