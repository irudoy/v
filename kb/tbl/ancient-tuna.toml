summary = """
Interpolated 8x8 uint8 table with output in the range 4..37. Its output is a \
separate correction term: uint8 from ffff1071 is added, the sum is centered \
by subtracting 0x32, and the result is multiplied by uint8 from ffff3502. \
ffff3502 carries the output of adjacent map 0000b23a, which contains only \
value 27, rather than the target map's output. The resulting product \
conditionally participates in updating 32-bit ffff2d20; code does not \
establish a physical name or unit."""
note = [
    """
Interpolated 8x8 uint8 table with output in the range 4..37. Its output is a \
separate correction term: uint8 from ffff1071 is added, the sum is centered \
by subtracting 0x32, and the result is multiplied by uint8 from ffff3502. \
ffff3502 carries the output of adjacent map 0000b23a, which contains only \
value 27, rather than the target map's output. The resulting product \
conditionally participates in updating 32-bit ffff2d20; code does not \
establish a physical name or unit. Result disposition: consumer. Result \
target: FUN_000befb0@000befb0: when bit 3 in ffff41bc is set and \
uint8@ffff3502 is nonzero, expression (uint8@ffff1071 + map_output - 0x32) * \
uint8@ffff3502 participates through sign-dependent arithmetic in forming the \
32-bit value written to ffff2d20. Machine trace: 0000ab0a (8x8 uint8, values \
4..37) -> base load into r4 at 000befe0, axes 000120ae/000120b6 and raw \
inputs from the high byte of ffff1024 and byte ffff11ae -> call 00026140 at \
000beff4 -> kernel passes 00026944 and raw-cell selection in 00026770 -> \
unsigned linear interpolation 00026740, which keeps the result between \
adjacent uint8 values -> r0 -> r6 -> byte write to ffff3219 at 000beffe. \
This result remains separate from the previous call's result: the previous \
call interpolates adjacent map 0000b23a and writes its output to ffff3502. \
Then, when (ffff41bc & 8) != 0, code reads ffff3502 at 000bf024 and, if it \
is nonzero after the check at 000bf02a, calculates (uint8@ffff1071 + \
map_output - 0x32) * uint8@ffff3502. The resulting term is combined with a \
quantity derived from ffff2d24 relative to 0x32000000, including signed \
branches and bounds, and the result is written to ffff2d20. When bit 3 is \
clear, only initialization of ffff2d20 from ffff106e occurs; when ffff3502 \
is zero, the arithmetic branch is skipped.""",
]
