summary = """
On path 00045564, the map defines table threshold \
y=14*min(floor(max(u8[ffff22e4]-u8[ffff11b2],0)/4),7) raw. At 000455a2, y is \
compared with current byte ffff13f7, and accessor code preserves \
max(ffff13f7,y), so the map defines a lower boundary for the retained \
maximum."""
note = [
    """
RAM ffff11b2 is saturated engine speed in RPM/12.5; the physical quantities \
of ffff22e4 and ffff13f7 remain unresolved. Direct association of the result \
is visible in the listing: r0 is stored in ffff1722 at 00045570 and read at \
0004559e before comparison 000455a2. Index: Implicit 1D-8 indexing with no \
separate axis. d=max(u8[ffff22e4]-u8[ffff11b2],0); q=min(d*8,255)&224; \
q=32*i, so i=min(floor(d/4),7). Call 00045564 supplies only node values q, \
while wrapper 00026370 returns cell 7 for q>=224. Output trace: 00012944 -> \
0004555c -> 00045564 -> 00026370 -> 00026a80 -> 00026aac -> 00026aae -> \
00026740 -> 00045570 -> ffff1722 -> 0004559e -> 000455a2. Result \
disposition: inline_comparison; Result target: site 000455a2.""",
]
