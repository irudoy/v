summary = """
8x8 uint8 table of an unsigned coefficient: the returned byte multiplies the \
uint16 lookup result of map 00014ed2; the product is divided by 128 through \
a logical shift, saturated to 0xffff, and written as a derived quantity to \
ffff1652."""
note = [
    """
ffff1652 receives floor(lookup_00014ed2*x/128), saturated to 0xffff, rather \
than the direct map result; readers 000525d8 and 0004e59c are therefore not \
direct consumers of the target map's output. Numeric scale round trip: 21 -> \
0.1640625 -> 21; 132 -> 1.03125 -> 132. Saturation applies to the derived \
product rather than the map's inverse conversion. Index: implicit-2d 8x8: r5 \
receives uint8 from ffff106f and r6 receives uint8 from ffff10f0; index \
calculation in 00026040 is not shown. Output trace: 0000a8ea -> \
site:00052584 -> site:0005258c -> 00026040 -> site:00052590 -> site:000525b0 \
-> site:000525b8 -> site:000525ba -> site:000525bc -> site:000525be -> \
site:000525cc -> ffff1652. Result disposition: consumer; Result target: \
site:000525b0. Evidence boundary: The listing and contract of 00026040 are \
absent; the machine trace breaks between reading cell 0000a8ea and the r0 \
return captured at site:00052590. The link from the cell to the proven x/128 \
coefficient therefore remains candidate, and the exact transformation of \
both indices is unknown.""",
]
