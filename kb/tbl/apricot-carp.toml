summary = """
Engine-speed ceiling of the standstill exhaust-VTC override. Hysteresis \
comparator 000259d0 sets ffff24ab bit 1 while engine-speed byte ffff11ae is \
at or below this value and clears it above the value plus ROM8[0x86e1]=4; \
FUN 000bfe88 stores the flag at 000bff14."""
note = [
    """
Stock value 80 is 4000 RPM with release above 4200 RPM. The flag is one \
input of override predicate ffff246c bit 1.""",
]
