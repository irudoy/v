summary = """
One of two unsigned 8-bit table multipliers: the interpolated output is \
multiplied by the output of map 00012a22, after which the product is \
lower-capped at 0x4000 and written to RAM ffff19a4."""
note = [
    """
All 8 cells in the current image equal 128, so the lookup returns byte 128 \
for every q. Code proves only the operational multiplier role: the result is \
stored in ffff17c8, read again, and multiplied by the output of adjacent map \
00012a22; the product is lower-capped at 0x4000 and written to ffff19a4. The \
physical subsystem and a nontrivial scale do not follow from the artifact. \
Index: q = min(max((u8[ffff10f4] - 80)*2, 0), 255); for q < 224, wrapper \
00026370 passes q to the linear-interpolation kernel for adjacent uint8 \
cells in the implicit 1D-8 grid; for q >= 224, it returns cell 7. Output \
trace: 000716c0 -> 000716c2 -> 00026370 -> 00026a80 -> 00026aac -> 00026aae \
-> 00026740 -> 000716c4 -> 000716ca -> ffff17c8 -> 0007170c -> 00071710 -> \
00071718 -> 00071722 -> ffff19a4 -> 000718d8/00071a10/00071b7e. Result \
disposition: consumer; Result target: site 00071710.""",
]
