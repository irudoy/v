summary = """
Interpolated unsigned byte multiplier from a 4x4 table. Its result is the \
third factor in a product with bytes ffff14db and ffff14d8; the product is \
shifted right by 14, saturated to 255, and written to ffff14d9."""
note = [
    """
The claim is limited to operational semantics. Code proves use of the \
interpolated value as a multiplier but does not establish a physical name, \
units, or a nontrivial scale. ffff14da has no external readers; the same \
result associated with the write remains live in r6 and is consumed by \
instruction 0004ad64. The catalog was not used for identification. Result \
disposition: writes.""",
]
