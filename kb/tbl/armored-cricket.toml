summary = """
Unsigned Q16 new-sample weight: the signed high word of current*k + \
previous*(65536-k) updates signed ffff199e; a result below current and equal \
to previous increments by 1. The coefficient is also stored in ffff1608. The \
physical filtered quantity is unresolved."""
note = [
    """
Identity confidence: candidate. Load 00064a32, RPM byte shifted by 8, and \
call 00064a40 bind 00014e52 to implicit uint16 wrapper 000263f4; 00064a44 \
zero-extends its result and 00064a4a stores ffff1608. The implicit kernel \
reaches finisher 00026740. \
current=min(32767,s16(ffff19c6)+u16(ffff2408)+u16(ffff2410)); \
previous=s16(ffff199e). Region 00064a6c..00064a94 extracts the signed high \
word of the weighted sum, stores it in the branch delay slot, and \
conditionally adds 1 for progress. The regression gate covers this prefix \
and weighted update; history copies after 00064a96 are outside it. Scale \
confidence: code. k/65536 and (65536-k)/65536 are the new and previous \
shares; stock k is 8000.""",
]
