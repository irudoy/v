summary = """
Four-point Boolean inhibit table for publication of the filtered positive \
RPM-drop class while the upstream mode bit is set."""
note = [
    """
When ffff2459.bit5 is clear, FUN 0003e1da indexes this map by \
q=clamp(uint16[ffff114a]-96,0,255), stores the result in ffff1ee0 and \
ffff257a, and forces ffff1072 to zero. The implicit nodes q=0,64,128,192 \
correspond to 1200,2000,2800,3600 RPM because ffff114a is RPM/12.5. When \
ffff2459.bit5 is set, the retained ffff257a byte is tested: a nonzero result \
with ffff2451.bit7 clear forces ffff1072 to zero; a zero result or set bit7 \
publishes high8(ffff1e50). All four stock cells equal 200, and byte \
magnitude is otherwise unused, so every nonzero value is operationally \
equivalent. ffff2451.bit7 directly mirrors SH7058 PHDR bit 1 (PH1DR); FUN \
0002e0d4 publishes that bit as DID 0x1305 bit 2, which a structured Nissan \
profile names BRAKE SW. The address-free Initial Retard Quantity catalog \
match is contradicted by this machine path. Result disposition: inline \
Boolean gate before ffff1072 and scheduled snapshot ffff106a.""",
]
level = "code"
role = "table"
access = "explicit"
unit = "raw Boolean"
scale = "x"
to_raw = "x"

