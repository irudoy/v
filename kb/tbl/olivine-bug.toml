summary = """
Flat 1D calibration of a nonzero control value: raw value 5 is loaded into \
ffff2566, and 000bec52 tests this sink for zero before conditionally \
clearing bit 0x08 in ffff248d; the purpose of the control state is unknown."""
note = [
    """
ROM byte at 00008616 is 0x01, so tst 0x01 leaves branch 00012e32 reachable \
and does not select alternative 00012e3a. 000bcd44 writes the result with \
instruction 000bcdd6. 000bec52 may conditionally write the same result to \
ffff2566 and then tests the sink for zero. Both accessors return void. The \
warning about unreachable block 0002ccf4 in the caller does not apply to \
target-map access. The catalog contains 22 1D-8 variants and does not \
identify the purpose. Result disposition: inline_comparison. Blocking \
condition: The trace stops in 000bec52 at conditional clearing of bit 0x08 \
at ffff248d after testing ffff2566 == 0. The artifact does not reveal the \
purpose of this bit and contains no operation that distinguishes 5 from any \
other nonzero value; exact stopping address: ffff248d.""",
]
