summary = """
Offset-binary Engine Torque surface. FUN 00065928 indexes rows by current \
rotational-speed coordinate ffff11b6 and columns by \
q=min(65535,trunc(u16[ffff1024]*40960/ROM16[00009534])), then writes signed \
result lookup-32768 to ffff18ca."""
note = [
    """
FUN 000659ae adds ffff2408 to the signed map result, applies two calibrated \
multipliers, saturates to int16, and writes ffff18cc; FUN 000655b4 and FUN \
00065b08 consume that state in two nonlinear channels. Stock \
ROM8[000087ee]=0 and flat-zero map 0001245a make both multipliers unity, so \
stock ffff18cc=sat_s16(ffff2408+ffff18ca). The column axis is copied from \
ROM 0002378c to a stack buffer before interpolation. Multiplying its runtime \
coordinate by 100/40960 gives the exact normalized ratio \
100*BFS/ROM16[00009534]; stored points 0..0xf000 therefore represent 0..150 \
percent of the fixed BFS reference. The VQ35HR JK00D homolog uses the \
byte-identical function shape with map 00012922, row axis 00016f3c, column \
axis 00023884, and scaler 000095f6; its larger scaler and torque range \
provide independent family evidence. The Cylinder Filling physical name and \
x*0.1 Nm output scale match the HR A2L Engine Torque Map and require \
hardware validation; the normalized column scale itself is code-proven. \
Result disposition: consumer.""",
]
