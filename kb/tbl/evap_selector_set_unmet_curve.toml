title = "Selector-bit-set counterpart of glittering-raven in EVAP reader d6d3a"
summary = """
Explicit 8-point uint8 curve of 000d6d3a on axis 00013f40 through \
brilliant-ibis. The reader uses it in place of 00013b60 when the calibration \
selector bit is set and uint8[ffff10e2] < ROM8[000084de] at 000d6dd0; the \
lookup coordinate is the high byte of the word ffff2686. 7mfk 000b2096 has \
no selector-bit-set curves."""
