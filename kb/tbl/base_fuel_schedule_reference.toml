summary = """
Fixed Base Fuel Schedule normalization reference shared by the internal Q7 \
load coordinate and engine-torque filling calculations. FUN 0003b75c writes \
ffff1048=min(255,floor(uint16[ffff1026]*128/scaler)); scheduler 00020dfe \
snapshots it to ffff102c. FUN 00065928 forms the Engine Torque Map \
coordinate min(65535,floor(uint16[ffff1024]*40960/scaler)), and FUN 00065c26 \
uses the same divisor in its torque base term."""
note = [
    """
Stock scaler is 0x6a5a, or 27226. The exact arithmetic proves its common \
fixed-reference role and makes internal raw 128 equal Base Fuel Schedule \
divided by this reference at ratio 1. The HR A2L calls the calibration \
Cylinder Filling Up Efficiency Scaler and describes it as the BFS at maximum \
airflow. That physical name and the raw/2048 BFS conversion remain \
source-derived candidates. Editing this scalar shifts ignition, CVTC, \
candidate AFR, and torque coordinates together.""",
    """
The 7mfk normalization consumer reads this one-cell uint16 scalar directly \
at fixed ROM address 00009534 for both divisions; the BFS word is the \
numerator and does not index its address. A nonzero denominator gives the \
stated Q7 ratio with the stock coherent cached numerator. A zero denominator \
returns zero and writes fault code 0x44e to ffff9818; controlled \
reference-word cases establish this alternative without a stock calibration \
or hardware claim.""",
]
level = "code"
role = "table"
access = "direct-scalar"
cols = 1
storage = "uint16"
unit = "BFS"
scale = "x/2048"
to_raw = "x*2048"
scale_level = "candidate"

