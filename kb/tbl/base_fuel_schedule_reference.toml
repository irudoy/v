note = """
The unsigned reference word divides the latest FFFE8032 BFS word multiplied \
by 128 in FUN_000495C8. The normalized byte saturates at 255 and is copied \
from FFFE8068 to FFFE8050. Service 0x22 DID 0x1208 reads FFFE8032 directly. \
