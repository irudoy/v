summary = """
Conditional source of an internal ratio: when initial r6 == 0, interpolated \
uint16 M is converted to 255*M, written to ffff405c, and used to calculate \
min(255, floor((255*M)/20000))."""
note = [
    """
The map is called only on the branch with initial r6 == 0. The result is \
extended as uint16 and converted to 255*x before a 32-bit write to ffff405c. \
In the common accessor tail, a register copy passes through division \
00021ce0 and comparison 000608cc, but this is not a read of ffff405c and \
reveals no physical semantics. FUN_0006062c returns void; branch \
unreachability is unproven. Eight zero cells do not make the map dead. Scale \
x*255 describes only the sink's internal raw value, not physical units. \
Result disposition: consumer. No physical quantity is asserted beyond narrow \
operational semantics.""",
]
