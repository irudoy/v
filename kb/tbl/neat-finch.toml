summary = """
1D table of an unsigned normalized coefficient selected by byte ffff106f. \
Interpolated value t is stored in ffff1a1f, then multiplied within 0004ac7a \
by the result of constant map 000129ca and by a quantity in r14 previously \
constrained to uint16; after a right shift of 14, ffff14dc is formed. For \
this ROM, the target map's effective coefficient is t/128."""
note = [
    """
The physical subsystem is unknown. ffff1a1f has no external readers, but the \
value is not dead: it is read in the same function at site 0004ae32 and \
first consumed by multiplication at site 0004ae36. Adjacent map 000129ca is \
constant and returns 128, so the expression with a common shift of 14 gives \
effective target-map coefficient t/128. Numeric round trip: \
102/128=0.796875, 0.796875*128=102; 128/128=1, 1*128=128. For t=102..128 and \
r14<=65535, downstream uint16 saturation does not alter the result. Index: \
Implicit eight-point uint8 axis. The unsigned selector is read from ffff106f \
and passed in r5; for value >=224, the wrapper returns element 7; for a \
lower value, linear interpolation in kernel 00026a80 is used. The selector's \
physical unit is unknown. Output trace: 00012dca -> site 0004ae16 -> site \
0004ae18 -> 00026370 -> site 00026aac -> site 00026ab6 -> 00026740 -> site \
0004ae1c -> site 0004ae26 -> ffff1a1f -> site 0004ae32 -> site 0004ae36 -> \
site 0004ae3e -> site 0004ae42 -> site 0004ae44 -> site 0004ae46 -> site \
0004ae48 -> site 0004ae52 -> ffff14dc. Result disposition: consumer; Result \
target: site 0004ae36.""",
]
