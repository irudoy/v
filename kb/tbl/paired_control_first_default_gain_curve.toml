title = "Paired control first default gain curve"
summary = """
Explicit eight-point uint16 first-channel coefficient on 00016fd4 through \
000282f4 in 0007f0f4. This default curve is selected when the compound \
caller-byte gate is false. Primary curve 000145f8 requires the common caller \
byte and the first-channel enable byte to be nonzero, all three \
first-channel blocking bytes to be zero, and the final first-channel \
selector byte to be nonzero. The selected unsigned result multiplies a \
signed intermediate before the common signed16 saturation or Q12 conversion \
path."""
note = [
    """
The 7mfk first-channel path 000617ea uses 00015580 without this additional \
curve selection. The caller-byte identity and physical control quantity \
remain unresolved.""",
]
