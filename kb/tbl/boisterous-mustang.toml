summary = """
Lower threshold for a raw difference of two bytes: 00056d0e tests \
int(uint8(ffff1071) - uint8(ffff106e)) >= int(lookup(00012c12, \
uint8(ffff106e))). This is the second term in the condition that sets bit 0 \
at ffff4205."""
note = [
    """
All 8 cells equal 0, so in this image the comparison reduces to \
int(uint8(ffff1071) - uint8(ffff106e)) >= 0 and subsequent test uVar10 == 0 \
is true. ffff340b has no external readers, but after the write the same \
value remains live in r2 and is consumed inside the accessor. It is not \
returned from 00056bd0; no evidence proves the path unreachable. The \
physical quantity is unknown, so only exact code semantics in a raw \
representation are claimed.""",
]
