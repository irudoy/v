summary = """
Normalized Q0.7 blend coefficient for the result of map 000122ea: \
interpolated output 000122f2 multiplies the deviation of output 000122ea \
from 128; after division by 128, the deviation is added back to 128. The \
derived value is intake idle source byte ffff1553; while ffff24a7 bit 1 is \
set, FUN 000bdc66 conditions it into intake target ffff2326 in place of the \
coolant-selected map byte."""
note = [
    """
The claim is limited to functional semantics proven by code. Index ffff106f \
is the scheduler copy of coolant index ffff1077, and ffff2326 is the common \
intake-cam target reference (JK08A.cvtc.md). For raw x=0, the centered \
result is 128; for x=128, it equals the output of 000122ea. The numeric \
scale round trip over raw range 0..128 is exact: (x/128)*128=x. Result \
disposition: consumer.""",
]
