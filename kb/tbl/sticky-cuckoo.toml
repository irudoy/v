summary = """
Unsigned eight-point coefficient table K for a calculated expression in \
000532ae: interpolated K is written to ffff1601 and conditionally \
participates both in term 256*K and in difference K - 2*C before ffff1600 is \
formed."""
note = [
    """
The physical name of the coefficient is unknown. On a conditional branch in \
000532ae, value K from ffff1601 enters expression iVar12 = 256*K - B*(K - \
2*C) + 2*(D*E + F), where B = uint8 ffff15df, C = int8 ffff1660, D = uint8 \
ffff193d, E = uint8 ffff1680, and F = uint16 ffff2ff0. The sign of iVar12 \
and subsequent scaling determine the byte written to ffff1600 with \
saturation to 255. Index: Implicit uniform 1D-8 axis over uint8 from \
ffff106f: raw points 0, 32, 64, 96, 128, 160, 192, 224; adjacent cells are \
linearly interpolated, and input >= 224 selects the last cell. Output trace: \
00012a82 -> 00052f1e -> 00052f28 -> 00026370 -> 00026a80 -> 00026740 -> \
00052f30 -> ffff1601 -> 000532ae -> ffff1600. Result disposition: consumer; \
Result target: 000532ae.""",
]
