summary = """
Stock-inert trim of the alternate warm DFCO-transition timing-state addend \
0x000137F0. When ROM8[0x8966].bit0 is set, FUN_000644D0 adds this \
eight-point curve, centered at 0x80 and looked up by the byte 0xFFFF11A3 \
over the axis 0x00013C6A, and the high byte of the word 0xFFFF233E to the \
centered alternate addend and saturates the sum to a signed byte. Stock \
ROM8[0x8966] = 0x50 keeps bit 0 clear, and every stock cell holds 0x80."""
note = """
JK08A FUN_0004AFDC has no counterpart of this trim. The curve carries no \
editor entry because the stock configuration never reads it."""
