summary = """
Wide-open-throttle threshold for throttle-opening byte ffff3528, flat 200 on \
ffff11b3: RAM ffff2468 bit 3 is set when ffff3528 >= the interpolated value \
and, once set, is cleared only when ffff3528 + 8 < the value. The latch \
forces the maximum load column of target mixture map 0000a9aa."""
note = [
    """
Code confidence covers the threshold role and the consumer. ffff3528 is \
min(255, ffff40c6 * 0x505b >> 16) from 00054eb8, so the flat 200 is 78.4 \
percent of throttle opening on the code scale of axis 000155a0: the latch \
turns on at ffff3528 >= 200, remains on at ffff3528 >= 192, and clears below \
192. ffff14ef has no external readers, but after the write the same value \
remains in r6 and participates without overwrite in comparison 00055982. The \
implicit map has no explicit Axis claim, so axes are empty. Result \
disposition: inline_comparison.""",
]
