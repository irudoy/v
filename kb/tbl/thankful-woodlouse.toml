summary = """
Centered offset-binary table: its output is converted as d=x-128, multiplied \
by unsigned weight 000122f2, divided by 128 with truncation toward zero, \
returned to center 128, and saturated to uint8."""
note = [
    """
The output is stored in ffff1554 and read again inside 000bdb66. A negative \
product receives +127 before the arithmetic shift, so the final division by \
128 truncates toward zero. Map range 128..168 represents centered values \
0..40. Weighting and clamping belong to the consumer and do not break \
invertibility of x-128/x+128. The weighted result is intake idle source byte \
ffff1553, which FUN 000bdc66 conditions into intake target ffff2326 in place \
of the coolant-selected map byte while ffff24a7 bit 1 is set \
(JK08A.cvtc.md).""",
]
