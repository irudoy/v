summary = """
Conditionally selected raw threshold 30 for saturating byte counter \
ffff19aa: the interpolated byte is written to ffff17f0, and condition \
ffff19aa > ffff17f0 is tested at site:000bd3c8."""
note = [
    """
The map is flat: every byte equals 30, so interpolation returns raw 30 for \
any index. The map branch is selected by testing bit 0 at address 00008616 \
at site:000bd2ec/site:000bd2f0; the alternate branch uses an adjacent map. \
ffff19aa is reset at site:000bd2e6, incremented with saturation at \
site:000bd3b6/site:000bd3b8, and compared with ffff17f0. ffff17f0 has no \
external readers; the counter period and physical unit are unknown.""",
]
