summary = """
Threshold of the hot-intake idle latch in FUN_00059C2C, looked up by the \
coolant byte 0xFFFF1069 while the knock state 0xFFFF23C6.bit6 is clear. The \
interpolated value goes to 0xFFFF34FA, and 0xFFFF4569.bit5 sets when \
0xFFFF268C, plus ROM8[0x85D6] = 3 while the bit is set, reaches it. \
0xFFFF455B.bit7, the hot-intake idle request of the VVEL modes 12 and 13, \
requires this latch. Stock 255, 255, 255, 255, 255, 130, 110, 90."""
