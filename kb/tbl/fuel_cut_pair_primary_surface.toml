summary = """
Implicit 8x8 byte surface of fuel_cut_parameter_pair_builder for the first \
byte of the fuel-cut parameter pair while the selector ratio stays below its \
threshold. Its inputs are min(2*x, 0xe0) of a scheduler snapshot byte x and \
min(2*normalized_load, 0xe0), so both reach the last of the eight points at \
0x70. fuel_cut_coordinator passes the pair to the fuel-cut entry sequence \
0006c444, which loads this byte into the countdown of its first stage."""
note = [
    """
Selector: the builder sets bit 1 of ffff4525 when the word ffff447e reaches \
ROM8[00008503] << 8 and keeps it set until the word falls below that \
threshold minus ROM8[00008504] << 8. Stock 0x80 and 0x0d set the threshold \
at 0x8000, a ratio of 1.0 in the scale of the word, and the release at \
0x7300. A clear bit selects fuel_cut_pair_primary_surface and a set bit \
fuel_cut_pair_primary_alternate_surface. Function 0004678c clamps a float \
ratio to 0..2 and stores it times 32768 in the word; its physical quantity \
is unresolved. Timing functions 000644d0 and 00067122 read the same \
threshold bytes.""",
    """
The surface path runs when no earlier branch of the builder supplies the \
pair. Stock 0x00 in ROM8[00008a80] (1ND 00008b5b, 1ME3B 00008bac) passes its \
gate on byte ffff1069 (1ND and 1ME3B fffe8073) on every image, so bit 1 of \
ffff2425 (1ND bit 6 of fffe94ed, 1ME3B bit 6 of fffe94be) and the earlier \
branches decide at run time. The late pair of the builder still replaces the \
surface result under two run-time bits. The second byte of the pair comes \
from fuel_cut_pair_secondary_curve, whose stock bytes are zero on every \
image.""",
    """
fuel_cut_coordinator 0006a9b0 calls the builder at 0006aa5c, stores the pair \
at ffffade8 and in ffff1490/ffff1491, and passes it to 0006c444 with the cut \
request of 0006b980, which holds overrun_cut_lookup, and the restore request \
of 0006c0a8, which holds overrun_restore_lookup. From state 0, a cut request \
without a restore request loads the first byte into a countdown and enters \
stage 1; when that countdown is zero, stage 2 loads the second byte; when it \
is zero, the sequence enters state 3. A restore request returns the earlier \
states to 0. The task that decrements the countdowns, their time unit and \
the physical meaning of the stages are unresolved.""",
    """
The x input is byte ffff119d of a scheduler snapshot on JK78C, fffe81a8 on \
1ND and fffe818e on 1ME3B; its quantity is unresolved. The y input is \
normalized_load. Which input selects the stored row is unresolved.""",
    """
Native editor class (issue #129): active on 1ND and 1ME3B. Reader 1ND \
0007765c / 1ME3B 0007bf3c runs from fuel_cut_coordinator 000760cc / \
0007a740, every stock image passes the ROM8 gate of its surface path, and a \
run-time bit selects between the two surfaces. The surfaces set the entry \
countdown of the deceleration fuel cut, not an ignition-timing or limiter \
role, and stay out of the editor.""",
]
