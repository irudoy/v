summary = """
Dimensionless 1D attenuation coefficient T selected by byte ffff106f. The \
interpolated result is read from ffff14db and serves as a multiplier in \
ffff14d9 = min(255, (T*A*B) >> 14), where A is in ffff14d8 and B is in \
ffff14da."""
note = [
    """
The physical subsystem and the physical unit of input ffff106f are unknown. \
Quantity T is traced separately through ffff14db. In the current ROM, \
adjacent multiplier A from 0001211e is always 128, so the overall \
calculation reduces to floor(B*T/128), where B comes from 00009d2a. \
Saturation to 255 applies to the overall product. Numeric scale round trip: \
102/128=0.796875, 0.796875*128=102; 128/128=1, 1*128=128. The implicit map \
has no explicit ROM axis, so axes is empty. Index: implicit 1D-8: \
u=uint8(ffff106f); for u<224, index i=floor(u/32), fraction f=(u mod 32)/32, \
and cells i and i+1 are linearly interpolated; for u>=224, cell 7 is \
returned. Result disposition: consumer (0004ad60).""",
]
