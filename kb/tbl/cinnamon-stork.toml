note = [
    """
First-order lag-filter smoothing coefficient, meaning the weight of the new \
sample: new = old*(65536-K)/65536 + target*K/65536. K=0 disables updating; \
the physical quantity is unknown. Result disposition: consumer. Result \
target: FUN_000befb0@000bf024, final write to RAM ffff2d20. Machine trace: \
0000b23a -> 000befc4/000befd8 -> 00026140 -> 00026944/00026c78 -> \
00026770/00026740 -> 000befe2 -> ffff3502 -> 000bf024/000bf028/000bf02a -> \
FUN_000befb0 -> ffff2d20. Scale confidence: code. Scale: x/65536; inverse \
encoding: x*65536; units: new-sample fraction (0..255/65536). Scale trace: \
0000b23a -> 000befd8 -> 00026140 -> 00026944/00026c78 -> 00026770/00026740 \
-> r0 -> 000befe2(ffff3502) -> 000bf024 -> FUN_000befb0 arithmetic: u=uint8; \
with u=0 the update is skipped, otherwise the old Q8.24 deviation is \
multiplied by (0x10000-u)/0x10000 and the byte input deviation is multiplied \
by u*0x100. Signed branches add or subtract these parts, restore the value \
relative to 0x32000000, and saturate the result -> ffff2d20/ffff2d24 -> high \
byte ffff359c.""",
]
