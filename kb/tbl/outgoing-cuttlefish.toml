summary = """
Dimensionless raw/128 coefficient that scales a positive 32-bit Q16 quantity \
on the positive branch of 000c1dec."""
note = [
    """
The decompiled expression splits the positive Q16 quantity into high and low \
16-bit words and calculates floor(value * factor / 128) exactly. Raw 128 \
represents coefficient 1; map range 102..128 represents 0.796875..1. Limit \
0x04000000 applies to the derived result and not to the map scale. ffff143a \
stores a copy of the interpolated byte; a local copy is consumed inside \
000c1dec.""",
]
level = "code"
role = "table"
access = "explicit"
unit = "1"
scale = "x/128"
to_raw = "x*128"
scale_level = "code"

