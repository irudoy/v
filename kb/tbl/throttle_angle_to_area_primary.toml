summary = """
Primary target-throttle angle-to-opening-area table. Paired \
throttle-position paths convert both angle-domain channels through 00013202, \
average or combine them in the opening-area domain, and use 000155a0 in \
reverse to recover an angle coordinate."""
note = [
    """
The 32 values are monotonic and byte-identical to trustful table 00018766; \
axis 000155a0 is byte-identical to trustful axis 000190d0. This exact \
duplicated pair matches the two A2L Target Throttle Valve Opening entries \
and distinguishes it from the single Throttle Body Opening Area Calibration \
Table entry. Exact DIDs and preprocessing bind the exposed source path to \
paired throttle-position feedback. Physical units and scale require hardware \
validation.""",
]
