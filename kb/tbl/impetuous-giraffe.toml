summary = """
Unsigned current/prior-cycle coefficient surface in signed fixed-point state \
calculation 000a5a06. The lookup uses Base Fuel Schedule and engine speed, \
writes current C to ffff3080, and combines C with the prior-cycle value \
retained at ffff9ab0."""
note = [
    """
Result disposition: consumer. Current raw result C[n] is zero-extended at \
000a5de2; retained C[n-1] is read from ffff9ab0 and zero-extended at \
000a5de4-000a5dec. Their signed-product terms are each shifted right by one, \
summed, and shifted right by two at 000a5df8-000a5e02. The result is \
combined with signed terms shifted by one and 13, saturated, decomposed \
through an arithmetic right shift by 12, and then adjusted by map 00013ce8 \
before bounded output ffff3106. At 000a6328-000a632a, current ffff3080 \
becomes the retained coefficient for the next invocation. A whole-program \
p-code scan finds no reader of ffff3080 or ffff3106 outside FUN 000a5a06. \
The coefficient's physical quantity and fixed-point scale are unresolved.""",
]
level = "code"
role = "table"
access = "explicit"

