summary = """
On the enabled branch, the unsigned 1D-8 lookup result is used as one of two \
8-bit factors: it is written to ffff17c7, zero-extended, and multiplied by \
byte ffff17c8, after which max(product, 0x4000) is written as uint16 to \
ffff19a4."""
note = [
    """
The physical quantity and subsystem are not established: ffff17c7 has no \
external readers, while code proves the local multiplicative role. All 8 \
cells equal 128; this is not used as independent semantic evidence. There is \
no stored axis. Index: implicit 1D-8: \
z=min(floor(max(u16[ffff4524]-0x4600,0)/160),255). For z<224, index \
i=floor(z/32), Q0.16 fraction equals (z mod 32)*2048; for z>=224, element 7 \
is selected. Output trace: 000716f8(map 00012a22) -> 000716fc(lookup) -> \
00026370 -> [00026aac/00026aae -> 00026740 for z<224; element 7 for z>=224] \
-> 00071700(r0->r2) -> 00071706(ffff17c7) -> 00071708(r2 unsigned) -> \
00071710(MACL) -> 00071716(r2) -> 00071718 -> 0007171c/0007171e -> \
00071722(ffff19a4). Result disposition: writes; Result target: ffff17c7.""",
]
