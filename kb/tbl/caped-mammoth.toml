summary = """
Bypass-relative multiplier selected by the numerically lower centered \
intake-cam timing byte of the two banks. With ffff246b.bit6 set, FUN \
00055098 interpolates 00012ede on axis 00011bfb using \
min(u8[ffff2442],u8[ffff2443]); otherwise it substitutes raw 64. The \
selected factor is written to ffff1b14 and enters the four-byte product in \
ffff15ce and a later composite term in FUN 00054ee0."""
note = [
    """
Raw 64 is identity relative to the bypass branch, and raw 18 applies 0.28125 \
of that factor. This scale describes only the ratio of this input to the \
substituted bypass constant; it does not assign an absolute fixed-point \
scale to the four-factor product or physical units to ffff15ce. FUN 00055098 \
calculates \
ffff15ce=min(65535,u16(ffff2ff0)+((u8(ffff1680)*u8(ffff193d)*u8(ffff1955)*u8(ffff1b14))>>12)). \
FUN 00052f00 and FUN 000532ae carry ffff15ce into derived 32-bit state \
ffff15f8; FUN 0004afdc and FUN 000554ae consume that state, but the exact \
physical subsystem remains unresolved. JK03A has byte-identical axis and map \
values at the same addresses. VQ35HR JK00D independently preserves the \
312-byte algorithm, the same axis points, min-bank selection, bypass 64, and \
product arithmetic at FUN 00056fc8; its homologous map 0001528b contains \
64/0/64 regions and uses a different gate bit. Result disposition: \
consumer.""",
]
