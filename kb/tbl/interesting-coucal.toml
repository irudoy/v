confirmed."""
note = [
    """
ROM values are 82..134. Code proves an interpolated table result and its \
byte write without further conversion, but does not select a physical \
quantity or any catalog class. scale_expr=x records only raw identity and is \
not a scale claim. Result disposition: writes. Blocking condition: The trace \
stops at the 0003c2b6 write to RAM ffff115b, which has no readers; after the \
write, the value is not used in an inline comparison and is not returned \
from root void function 0003bd74. Code therefore does not connect the result \
to physical semantics, and the seven catalog classes with 4x4 geometry do \
not resolve it.""",
]
