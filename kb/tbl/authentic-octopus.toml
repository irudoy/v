summary = """
Temperature-difference-weighted coefficient curve in the P0128 thermostat \
model. FUN 000b7768 looks up uint16 L by the upstream raw coordinate from \
curve 00015c40, derives \
d=clamp(trunc0(P0128_model_microdegC/10000)-100*IAT_raw+5000,0,32767), and \
writes floor(d*floor(L*ROM8[00008543]/256)/256) to ffff2d08."""
note = [
    """
Exact DID 0x1106 maps the IAT source byte to ffff2837, and scheduler FUN \
00020dfe snapshots it to ffff2733. The homologous diagnostic conversion \
IAT_degC=raw-50 makes d the nonnegative model-temperature-minus-IAT \
difference in 0.01 deg C units. FUN 000b6b5a forms \
ffff3220=sat_u32(ffff2d00+ffff2d08), so this term contributes to the \
subtractive side of the P0128 balance. Every cell of 00014b0a and every \
point of axis 00013ff4 is zero; upstream coordinate curve 00015c40 is also \
zero. Therefore L and ffff2d08 are always zero in stock JK03A and JK08A, \
while the caller and downstream balance remain live. The coefficient's \
physical heat-transfer interpretation and engineering scale are unresolved. \
Result disposition: consumer.""",
]
