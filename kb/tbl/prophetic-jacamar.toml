summary = """
Eight-point uint8 multiplier table: after the byte lookup result is written \
to ffff144d, it is read again, multiplied by zero_extend16(r12), and then \
multiplied by the lookup result of map 00012096; the 32-bit product is \
divided as signed by 81920, the quotient is compared as unsigned with 255, \
values above 255 are replaced with 255, and the final byte is written to \
ffff1875."""
note = [
    """
The physical name of the quantity and the unit of input ffff144c are \
unknown. Divisor 81920 applies to the composite expression and does not \
define an independent physical scale for this map. Index: implicit 1D-8 by \
uint8 input from ffff144c; input >= 224 returns element 7, while for input < \
224 kernel 00026a80 selects adjacent uint8 cells and 00026740 performs \
linear interpolation with a Q0.16 fraction. Result disposition: consumer \
(site 0004c346).""",
]
