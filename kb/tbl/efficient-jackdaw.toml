summary = """
Coefficient on branches with a nonnegative signed input: the interpolated \
byte scales the corresponding result of map 00015306, after which the \
product is saturated and divided by 128."""
note = [
    """
The 00012a1a result is stored separately from the following lookup and, on \
branches with a nonnegative signed input, multiplies the corresponding \
00015306 result. The product is saturated and divided by 128, defining Q7 \
scale x/128. The physical quantity is unknown.""",
]
