summary = """
When unsigned uint8[ffff10f9] >= ROM byte[000085c1], the branch selects base \
000125a2, indexes the map by the high byte of uint16[ffff272a], and writes \
the interpolated byte to ffff2f94."""
note = [
    """
Branch uint8[ffff10f9] >= ROM[000085c1]=0x55 loads base 000125a2 without \
adding 8. The map is indexed by the high byte of uint16[ffff272a], and the \
result is written to ffff2f94. Identical contents do not merge this \
calibration with 0001259a.""",
]
