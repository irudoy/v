to = "7mfk:000125aa"
note = """
JK78C 000d6d3a corresponds to 7mfk 000b2096 (classic-pelican): both select \
one of three explicit 8-point byte curves on one axis by two comparisons, \
read two implicit 16-point byte curves, and look up a word curve through \
eminent-lynx. JK78C adds a second set of three curves and an axis, selected \
by a calibration bit. MOV.L 000d6e06 loads this default curve of the \
selector-bit-clear set for the lookup through brilliant-ibis on axis \
00013f38; 7mfk 000b2096 forms 000125aa from 000125a2 for the same default \
branch on axis 00012a5a."""

