summary = """
Forward half of a reciprocal nonlinear coordinate pair. \
F(z)=interp_u8(00011d24 over axis 0001199e,z) maps raw breakpoints 0..40 to \
a convex raw sequence 0..179. Four consumers use F for nonlinear weighting; \
two of them subsequently return through inverse table 0001199e."""
note = [
    """
When ROM8[00008710].bit5 is clear, FUN 000655b4 and FUN 00065b08 calculate \
trunc0(K*(256-F(x1))/(256-F(x0))) with K=s16[ffff18cc] and channel-specific \
signed-byte increments, then write saturated signed results to ffff18d4 and \
ffff18ce. Their bit5-set paths apply trunc0(K*(256-F(x))/256), with a direct \
ffff18ce copy on one equality branch in FUN 000655b4. FUN 00063f30 and FUN \
0006469c use the same F output before inverse lookup through 0001199e. The \
near-square node shape is descriptive and is not used to assign physical \
semantics. Result disposition: consumer and forward coordinate source.""",
]
