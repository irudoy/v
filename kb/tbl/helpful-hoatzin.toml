summary = """
Interpolated unsigned lower threshold for raw coolant snapshot ffff1071 in \
the P030 counting-readiness condition. The lookup coordinate is derived from \
start-latched normalized coolant snapshot ffff1070; the comparison \
contributes to ffff41d2.bit0."""
note = [
    """
The full unsigned condition is ffff1071 < ROM8[0x8cff] = 150, ffff1071 >= \
lookup(0x12de2,min(2*ffff1070,255)), ffff106e >= ROM8[0x8d01] = 40, and \
ffff2736 >= ROM8[0x8b50] = 40. ffff106e/ffff1070 are raw/normalized coolant \
latched at engine start. A start temperature of at least -10 deg C gives q \
>= 96, where stock cells ff ff ff 2b 2b 2b 2b 2b return 43, so the first \
three conditions reduce exactly to start coolant of at least -10 deg C and \
current raw coolant 43..149, or -7 <= coolant deg C < 100. Below a start \
temperature of -20 deg C the lookup returns 255 and the threshold cannot be \
met. The separate ffff2736 derived-source gate has no assigned engineering \
scale. The lookup result is consumed once at 00083950 and is not written to \
RAM. Index: q=min(2*uint8(RAM[ffff1070]),255); implicit nodes q=32*k for \
k=0..7, linear interpolation between adjacent cells for q<224, q>=224 \
selects cell[7]. Output trace: 00012de2 -> 00083934 -> 00083936 -> 00026370 \
-> (q<224: 00026a80 -> 00026aac/00026aae -> 00026ab6 -> 00026740; q>=224: \
cell[7] in 00026370) -> 0008393c -> 00083950 -> 00083952 -> \
00083972/00083976 -> 00083978 -> ffff41d2. Result disposition: \
inline_comparison; Result target: site:00083950.""",
]
