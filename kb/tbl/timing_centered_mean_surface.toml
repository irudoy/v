note = """
Target function 0007323e runs the program of JK78C 000644d0 \
(signed_timing_state_accumulator): the same lookups of the gated addend \
curves, the centered-mean surface and the two multiplier curves, and the \
same two divided-term branches: one reads a base curve and then a subtracted \
or an added curve, the other reads one curve. The targets omit the two \
limit-offset lookups that JK78C reads when ROM byte 00008966 bit 0 is set, \
and they place the one-curve branch before the three-curve branch. It is the \
centered-mean surface. MOV.L 000736dc loads this table, which reaches the \
call at 000736e0 (helper 00028ff0) in r4, as MOV.L jk78c:00064a5a loads \
00009b9a, which reaches the call at jk78c:00064a68 (helper 00027f18) in r4. \
Its 64 stock bytes equal JK78C."""

