summary = """
Implicit 1D-8 table of an unsigned byte over normalized coolant ffff1077. \
The result is stored in ffff1fab and ffff24e1; in computed START SIGNAL \
coordinator 00038d44, saved ffff24e1 is tested for zero while ffff4185.bit6 \
is set, and a true test is one condition for setting ffff24bc.bit1."""
note = [
    """
The consumer belongs to the computed START SIGNAL state machine, but the \
physical quantity and engineering scale of this table remain unresolved. The \
map is updated while START SIGNAL is clear, while the zero test of the saved \
byte acts when START SIGNAL is set, so the dependence crosses calls through \
RAM. All eight cells equal 90: the stock lookup always yields 90, and target \
disjunct ffff24e1 == 0 is false after the map write. This does not prove \
that the entire branch is unreachable because the bit-setting condition has \
other disjuncts. Index: Implicit uniform eight-point axis over x = u8 RAM \
ffff1077: for x < 224, index i = floor(x/32), fraction = (x-i*32)/32, and \
map[i]..map[i+1] are linearly interpolated; for x >= 224, map[7] is \
selected. Output trace: 00012a9a -> 00038e6e -> 00038e74 -> 00026370 -> \
(00026a80 -> 00026740 for x < 224; map[7] for x >= 224) -> 00038e78 -> \
00038e84 -> ffff24e1 -> FUN_00038d44: (ffff4185 & 0x40) != 0 && ffff24e1 == \
0 -> ffff24bc |= 0x02. The same RAM copy is populated by path 00012a9a -> \
0002cfc0 -> 0002cfd2 -> ffff24e1. Result disposition: inline_comparison; \
Result target: RAM ffff24e1 in FUN_00038d44. A mirrored result write is in \
RAM ffff1fab.""",
]
