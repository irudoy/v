summary = """
Zero-centered additive correction. Two interpolated samples of one 8x8 \
surface are averaged with truncation toward zero in an x-128 representation; \
the result is encoded back with an offset of 128 in ffff1514 and enters the \
calculation of ffff23ee as a term."""
note = [
    """
Code confidence applies to the narrow operational semantics; the physical \
quantity is unknown. Result disposition: consumer.""",
]
