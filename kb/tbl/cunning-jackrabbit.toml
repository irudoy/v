summary = """
Cold intake-cam target surface. FUN 000bda64 interpolates it by RPM/50 byte \
ffff11ae and Q7 normalized-BFS scheduler snapshot ffff102c and writes \
ffff1c5e. FUN 000bdc66 uses it at raw coolant <=106 and blends it with \
warm/main target 0000b43a between raw coolant 106 and 131 before the result \
enters the intake CVTC target path."""
note = [
    """
Code proves the cold intake-cam target role, raw coolant selection, centered \
byte representation, and column coordinate at raw*100/128 percent of the \
fixed BFS reference. The target-vehicle capture stays above the warm \
threshold. The cold-start replays in JK08A.cvtc.md validate this surface \
through the coolant blend and by direct lookup in the cold band of the \
moving cold start; the stationary cold band follows idle source byte \
ffff1553. The output conversion (x-128)*0.5 crank degrees follows the intake \
edge-phase unit shared with 0000b43a: the cold target enters the same \
ffff2326 path that FUN 0004d2a6 compares with actual bytes \
ffff2442/ffff2443. The Cylinder Filling physical name remains a \
source-derived candidate. Result disposition: consumer.""",
]
