summary = """
Engine-oil-temperature thermistor transfer curve: interpolated uint8 code \
deg C+50 of input byte ffff117b, byte-identical to shared table 00012dea \
over all 32 points. FUN 0003eb84 stores the code in ffff1f94 at 0003ec18 and \
publishes DID 0x111f byte ffff2876 from it: the code directly while ffff4183 \
bit 7 is set, otherwise a higher code at once, the previous byte while code \
+ 2 exceeds it, and min(code + 2, 255) after a larger drop."""
note = [
    """
The curve and table 00012dea hold the same 32 bytes and are read through the \
same implicit-axis primitive, so the deg C+50 code that the ECU declares for \
00012dea through J1979 Mode 01 PIDs 0x05 and 0x0F applies to this output. At \
20 mV per input count the curve gives -8.5, 20.5, 52, 94, and 113.5 deg C at \
the factory engine oil temperature sensor reference voltages of 4.4, 3.5, \
2.2, 0.9, and 0.6 V, listed for -10, 20, 50, 90, and 110 deg C. The +2 \
offset and the clamp belong to the published state rather than to the curve. \
The implicit map has no explicit axis. Result disposition: \
inline_comparison.""",
]
level = "code"
