summary = """
The interpolated byte is centered as x-128 and scales working \
uint16[ffff1754], derived from map 00012808, as trunc0(ffff1754*(x-128)/64) \
before correction ffff17dc is formed."""
note = [
    """
The byte is centered by subtracting 128 and scales ffff1754 as \
trunc0(ffff1754*(x-128)/64). The derived correction enters ffff17de and \
combined ffff17dc. The pair (x-128)/64 and x*64+128 is confirmed by code; \
the physical domain is unknown.""",
]
