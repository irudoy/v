summary = """
Primary QH0/torque conversion surface. Forward lookups convert RPM and a QH0 \
coordinate into offset-binary requested torque; FUN 00073432 interpolates a \
complete row at current RPM and reverses the relation to recover the QH0 \
coordinate from a centered signed request."""
note = [
    """
All forward consumers subtract 0x8000 from the uint16 result before signed \
arithmetic. The stock 16x16 contents, RPM axis, and QH0 coordinate table are \
byte-identical to trustful family 000175c8/00018716/00018ac6. The exact \
duplicate pair and bidirectional code topology select the A2L \
primary/trustful concept; the physical units and multiplier require hardware \
validation. Result disposition: consumer and inverse coordinate source.""",
]
