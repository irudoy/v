summary = """
Coolant-indexed rising-edge DFCO entry RPM threshold in FUN 0004fbe2. The \
stock path selects it when current upstream mode ffff2458.bit5 is set and \
previous snapshot ffff245a.bit5 is clear; coarse vehicle speed ffff110e must \
be at least ROM8[000085fa]=4."""
note = [
    """
The comparison is strict RPM/25 > threshold. Exact JK08A code interpolates \
both cut tables on every evaluation and selects this one for the rising mode \
edge. Target-vehicle A/B evidence in patches/hardware-results.toml shows \
that retaining this stock entry threshold does not force DFCO entry when the \
restore classifier returns a nonzero class. Result disposition: \
inline_comparison.""",
]
level = "code"
role = "table"
access = "explicit"
unit = "RPM"
scale = "x*25"
to_raw = "x/25"
scale_level = "code"

