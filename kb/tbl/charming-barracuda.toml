summary = """
Unsigned table-derived multiplier in the calculation of ffff134a: min(255, \
floor(interp_u8(00011f02) * uint16[ffff1900] * min(255, \
interp_u16(0000c50e)) / 500000))."""
note = [
    """
The 00011f02 result is written to ffff134c and read again before two \
multiplications and unsigned division by 500000. All eight cells equal 100, \
so the current image uses constant raw multiplier 100. The artifact contains \
neither consumers of derived ffff134a nor the map's physical identity. \
Identity x is not a physical-scale claim.""",
]
