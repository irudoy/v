title = "Request transition rate for current < target + 2"
summary = """
Selected rate surface when the special branch is inactive and the latched \
current-gear index uint8[ffff1076] < min(target-gear index \
uint8[ffff1077]+2,255). Coordinates are min(uint16[ffff10be]>>3,255) and the \
target-gear index uint8[ffff1077] of defs/JK78C.vvel.md, section \"Data \
flow\". The byte result is multiplied by ten before the signed \
request-update calculation."""
note = [
