title = "Operating gate coolant mode windows"
summary = """
Two inclusive coolant intervals encoded as upper/lower byte pairs at offsets \
0/1 and 2/3. Their union is used when ffff23b9.bit6 is set. The bounds share \
the coolant/ram conversion degC = raw-50 of uint8[ffff106f]; both stock \
intervals define 5..40 degC. Leaving the union clears the held \
coolant-window latch."""
note = [
    """
Known BFS, coolant, battery-voltage and final-timing inputs retain their \
tracked conversions. The enclosing physical subsystem, invocation period and \
other input quantities remain unresolved under issue #110. Curve-output \
conversions, editor publication and later-layout counterparts require \
separate qualification.""",
]
