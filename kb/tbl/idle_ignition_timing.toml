summary = """
Warm DFCO-transition eight-point timing-state addend. FUN 0004afdc selects \
it only when ffff244f.bit2 is clear, warm latch ffff41de.bit5 is set, \
upstream DFCO mode ffff2458.bit5 is set, and transition timer ffff2590 is \
nonzero."""
note = [
    """
The warm latch sets at raw coolant 110 and remains set down to raw 106, \
corresponding to 60 and 56 deg C under the exact diagnostic conversion. \
While ffff2458.bit5 is clear, ffff2590 reloads to 85; once the bit is set, \
the periodic scheduler decrements it. Selection therefore lasts for at most \
85 scheduler counts, or 870.4 ms at the target-measured 10.24 ms period. A2L \
homology identifies the historical Idle Ignition Timing name. The alternate \
compositor branch of 0004bdc2 forms \
ffff1830=clamp_s8(ffff1a7d+ffff23ee-ffff23c5-64) at 0004be82 and shares the \
ffff2404 -> ffff2378 -> ffff12d6 -> ffff11da -> ffff11d4 chain of \
coefficient 1 with the low-seven surfaces, and J1979 PID 0x0E publishes \
ffff11d4 as A/2-64 degBTDC, so one count of this map is one crank degree of \
the declared coordinate. Index: implicit eight-point axis over ffff11b2 with \
saturation at element 7. Result disposition: writes (RAM ffff1511, site \
0004b0d0).""",
]
