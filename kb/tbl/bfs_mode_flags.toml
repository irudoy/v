summary = """
Fixed-address JK08A BFS mode byte ROM8[0x8d92]=0x7a. Bit3 enables the \
diagnostic-query timer and monitor updates. Bit4 enables selected \
working-word publication and selects that word for corrected normal-mode \
limiting; a clear bit4 selects the unblended word in the limiter and \
preserves the selected word. The rate and limit slices bind its stock reads \
and exercise explicit alternative calibration contexts."""
note = [
    """
The symbol and exact byte evidence apply to JK08A. JK00A shares layout 7mfk \
but holds 0x7e at this address; its value and other bits are not inherited \
from this record. The independent rate and limiting slices cover the \
specified timer, monitor, correction, blend, and limiting selectors. They do \
not execute the complete producer, preceding state writers, scheduler, or \
hardware behavior.""",
]
block = "airflow_load/block"
