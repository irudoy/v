summary = """
Intermediate 1D table of an unsigned multiplier for two branches of one \
calculation: the interpolated uint16 result is multiplied by a separate \
uint8 result and normalized by a right shift of 7; the multiplier's physical \
quantity is unknown."""
note = [
    """
All eight cells equal 32768. After interpolation, code multiplies the result \
by a separate quantity, applies conditional saturation, and shifts right by \
7. This chain combines two maps and defines no separate invertible scale for \
00014c9a, so raw identity is retained. Result disposition: writes. Blocking \
condition: At 0005feae and 0005ff6c, only multiplication of the target-map \
result by an anonymous uint8 result is proven. Direct RAM bindings at \
0005fea4 and 0005ff62 lead to ffff8bee and ffff8bec, which have no external \
readers. The physical consumer and quantity unit are unknown.""",
]
