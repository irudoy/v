summary = """
Conditional source of an internal upper value: interpolated uint8 x is \
converted to clamp(x*13, 908, 2908) and written to ffff3508 when ffff417e \
bit 0x20 is clear; the physical quantity is unknown."""
note = [
    """
Result disposition: consumer. No physical quantity is asserted beyond narrow \
operational semantics. The candidate matches two indistinguishable catalog \
variants of TVO Upper Limit Table. When register ffff417e bit 0x20 is clear, \
branch 0006f596 interpolates the map; 0006f5ba multiplies the raw result by \
13, 0006f5c6 and 0006f5d8 implement clamp(raw*13, 908, 2908), and 0006f5e6 \
writes uint16 to ffff3508. When the bit is set, the map branch is bypassed. \
The noninvertible clamp is described only here and is excluded from the \
scale pair.""",
]
