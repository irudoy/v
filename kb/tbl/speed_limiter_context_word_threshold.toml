title = "Speed limiter context word threshold"
summary = """
Unsigned context threshold compared with uint16[ffff10a8]. The gated byte \
curve is eligible only when that input is at or below this word. An input \
above the word disables the curve and publishes 65535 at ffff16c0. With mode \
bit7 clear, ffff23af.bit0 or raw mode ffff2608=4 admits the comparison; mode \
bit7 set requires ffff23af.bit0."""
note = [
    """
