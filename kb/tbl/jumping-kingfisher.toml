summary = """
Indexed minimum threshold for unsigned 16-bit RAM value ffff1814. \
FUN_000b5c36 continues the branch through 000b5f54 only when RAM[ffff1814] \
>= lookup(00015640); for a lower value, it branches through 000b5f50 to \
000b627c. All 8 nodes equal 65535, so in the current calibration the \
continuation condition is equivalent to RAM[ffff1814] == 65535."""
note = [
    """
There is no separate ROM axis, so axes is empty. Write ffff344e is an \
associated copy of the result, but the comparison uses the same r5 directly. \
ffff344e has no external readers. The physical quantity of ffff1814 is \
unknown; code does not prove that value 65535 is unreachable, so the branch \
is not classified as dead. Index: 1D-8 with an implicit uniform axis and Q8 \
coordinate q. For s=uint8(RAM[ffff2736]): q=0 when s<31; \
q=floor((s-30)*32/10)*256 when 31<=s<100; q=65280 when s>=100. q is passed \
in r5; wrapper 000263d8 selects the last node for q>=57344. Output trace: \
00015640 -> 000b5f30:r4 -> 000b5f38:call 000263d8 -> 00026a60 -> 00026740 -> \
r0 -> 000b5f3c:r5; r5 -> 000b5f42:RAM[ffff344e], with no external readers; \
same r5 -> 000b5f44:extu.w -> 000b5f4c:cmp/ge with r6, loaded from ffff1814 \
at 000b5f48 and extended at 000b5f4a -> 000b5f4e/000b5f50. Result \
disposition: inline_comparison; Result target: site 000b5f4c.""",
]
