summary = """
16x16 word surface of vvel_load_coordinate_publisher over engine speed \
ffff11a6 and the VVEL load coordinate. The publisher stores its value at the \
operating point at ffff3526 and its values at the four corners of the \
enclosing grid cell at ffff3520, ffff351e, ffff3524 and ffff3522, which \
000518e6 reads with the cell bounds. Stock values are 0..1433. Its physical \
quantity remains unresolved."""
note = [
    """
ROM byte 0000896c bit 6 replaces the operating-point value at ffff3526 by \
ffff5a7a or the ROM word 00008e14, as ROM byte 000085f6 bit 1 selects; no l0 \
load of ffff3526 exists.""",
]
