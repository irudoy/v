reaches the call at 000734b6 (helper 0002a9f4) in r4, as MOV.L \
jk78c:00064974 loads 00013610, which reaches the call at jk78c:00064976 \
(helper 00028198) in r4. Its 8 stock bytes differ from JK78C in 6 bytes."""

