original lookup. Index: Implicit 1D-8 grid by uint8 ffff106f: nodes 0, 32, \
64, 96, 128, 160, 192, 224; unsigned linear interpolation is performed \
between adjacent uint8 cells, while input >=224 returns cell 7. Result \
disposition: inline_comparison (site 0004b2c4).""",
