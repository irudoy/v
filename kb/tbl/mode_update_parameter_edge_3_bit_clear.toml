note = """
Target function 00095f8c runs the program of JK78C 000826d2 (daring-koala): \
the same branch tree behind the ROM gate that JK78C reads at 00008968 bit 4 \
(1ND 00008a2e, 1ME3B 00008a7f): the mode-selected curves by the mode byte \
(JK78C ffff1077, targets fffe8081) and the bank bit, read over one axis, and \
the mode-update curves of the edge and normal branches by the mode byte and \
the bank bit. The bank bit is knock_surface_state bit 6 on JK78C and 1ND and \
bit 7 on 1ME3B. The targets read the update curves first and the selected \
curves last; JK78C reads them in the other order. It is the edge-branch \
update curve for mode 3 with the bank bit clear. MOV.L 0009608c loads this \
table, which reaches the call at 000960bc (helper 0002a9f4) in r4, as MOV.L \
jk78c:00082886 loads 00014044, which reaches the call at jk78c:000828d0 \
(helper 00028198) in r4. Its 8 stock bytes differ from JK78C in 7 bytes."""

