Shared 16-point response curve C for three derived cam coordinates. FUN \
0004d2a6 evaluates T0=C(max(u8[ffff1c87]-64,0)), \
T1=C(max(u8[ffff1c86]-64,0)), and T2=C(max(u8[ffff1c8f]-64,0)); coefficient \
map 0000a4aa scales differences T0-T2 and T1-T2."""
note = [
    """
The coordinate bytes combine common intake target ffff2326 and common \
exhaust target ffff2327 with actual intake bytes ffff2442/ffff2443 and \
actual exhaust bytes ffff2324/ffff2325. Exact UDS bindings establish those \
target and actual identities. Results are stored in ffff1636, ffff1635, and \
ffff1638 and consumed before centered correction ffff1a7d reaches \
ignition-angle calculations. Code proves the response-curve role and raw \
representation; the high-level valve-overlap interpretation and degree scale \
remain physical candidates. Result disposition: consumer.""",
]
