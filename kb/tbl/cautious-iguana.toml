summary = """
Shared thermistor transfer table: interpolated uint8 code deg C+50 of input \
byte uint8(sample >> 2). In the coolant acquisition path, lookup by ffff1186 \
writes exact raw coolant response byte ffff1079; FUN 0008092e repeats that \
lookup and writes max(output-10,0) to coolant snapshot byte ffff3fa4. Lookup \
by ffff1178 writes fuel-temperature code ffff1f89 behind DID 0x1104 byte \
ffff1074. In the separate AN1 path, FUN 0003d2dc converts filtered phase \
samples to ffff2838/ffff2839, FUN 0003d4a8 publishes the unfiltered lane \
codes minus 10, and FUN 0003d45c folds the outputs into running minima whose \
element 0 reaches the P030 readiness gate. Other consumers use the same \
output as lower bound t of a [t, t+2] byte limiter."""
note = [
    """
J1979 Mode 01 PIDs 0x05 and 0x0F publish the table output minus 10 under the \
standard definition A-40 deg C, so the ECU declares the output code as deg \
C+50 for every consumer of the table. The ffff1186 invocation is the coolant \
channel of DID 0x1101, the ffff1178 invocation the fuel-temperature channel \
of DID 0x1104, and AN1 lane 0 the intake-air channel. At 20 mV per input \
count the table reproduces the factory thermistor reference points within 4 \
deg C: 3.5 V gives 20.5 deg C and 2.2 V gives 52 deg C. The AN1 MCU channel \
is exact, while its ECM terminal remains a hardware item. ffff1179 is \
written from 0003995a, but the complete consumer list contains no reader. \
The implicit map has no explicit axis, and accessors supply several \
different RAM sources, so axes remain empty. Result disposition: consumer.""",
]
