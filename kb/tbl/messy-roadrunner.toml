summary = """
Table-derived correction to 16-bit base quantity ffff8e08: \
sat_u16(uint16[ffff8e08] + floor(interp_u8(00011f3a) * 64 / 125) + 0x7fbe) \
is calculated and written to ffff8fde."""
note = [
    """
Result disposition: consumer. The 00011f3a result is zero-extended, \
multiplied by 64, and divided by 125 through 00021bbc. The quotient is added \
to uint16 from ffff8e08 and offset 0x7fbe; threshold 0x8041 implements \
uint16 saturation before the ffff8fde write. An external reader of ffff8fde \
is not required to prove the local arithmetic. The physical quantity is \
unknown.""",
]
level = "code"
role = "table"
access = "explicit"

