summary = """
Unsigned multiplier k interpolated along 0001460a. Code calculates k = \
min(255, interp_u16(000147ca, ffff10ca)), writes byte(k) to ffff1347, then \
includes k in product ffff1900 * ffff134b * k, divides it unsigned by \
500000, limits the result to 255, and writes a byte to ffff1349."""
note = [
    """
RAM ffff1347 has no consumers outside 0004afdc. After the write to ffff1347, \
the same live value r6 is used in mul.l at site:0004b46c. The physical \
quantities of registers ffff10ca, ffff1347, and ffff1349 are unknown; the \
claim is limited to the proven operational multiplier role. Limiting the map \
result to 255 is a conditional conversion and is not claimed as a scale. \
Result disposition: consumer.""",
]
