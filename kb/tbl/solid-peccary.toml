summary = """
Dimensionless 1D correction multiplier: the interpolated map value scales \
iVar6 in FUN_000474a4 together with coefficients from ffff2fc0 and ffff2fc1 \
before limiting and writing the result to ffff122a."""
note = [
    """
FUN_000474a4 multiplies three byte map outputs and iVar6 with a total shift \
of 21 bits. Decomposition 2^21 = 128^3 assigns seven fractional bits to each \
byte coefficient; for the target map, 128 -> 1, and pair x/128 with x*128 \
gives an exact numeric round trip. The artifact does not establish the \
physical quantity corrected by the product or the physical meaning of input \
ffff106f; no catalog name is claimed. Result disposition: consumer.""",
]
