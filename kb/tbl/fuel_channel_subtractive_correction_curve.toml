summary = """
1D table of a subtracted correction: interpolated uint8 passes through \
ffff14fc to 0004e614 and 000224f8; the result of an arithmetic right shift \
by 7 is subtracted from ((sVar3-sVar2)>>2) before weighted multiplication, \
limiting, and writing a per-channel result."""
note = [
    """
The physical subsystem and physical unit are not established by code. All \
eight bytes equal 0, so the current content gives a zero correction; flat \
content is not used as semantic evidence. The implicit family has no \
separate Axis claim, so axes is empty. Index: Implicit uniform 1D axis of 8 \
points: x=uint8(ffff11b3). For x<224, index i=x>>5, Q0.16 fraction equals \
(x&31)*2048, and uint8[i] and uint8[i+1] are interpolated. For x>=224, \
element 7 is returned. Result disposition: consumer (RAM ffff14fc; consumer \
0004e614; shift service 000224f8).""",
]
