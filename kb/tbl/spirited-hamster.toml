summary = """
Unsigned 8-bit table-derived divisor y for calculating ffff2c74: y=0 selects \
0xffff; otherwise min(0xffff, floor(200 * uint16[ffff2c78] / y)) is \
written."""
note = [
    """
The result is written to ffff2be4 in a delay slot and tested for zero \
immediately. All map cells equal 0, so the current image always selects the \
0xffff branch. The call and comparison execute, so the map is not dead. The \
physical quantities of the divisor and result are unknown.""",
]
level = "code"
role = "table"
access = "explicit"

