summary = """
EVAP negative-pressure leak transfer evaluated at baseline-relative \
coordinate ffff2c92 and corrected coordinate ffff2c98. The two lookup \
results form ffff3240 and ffff3242; their positive difference feeds the \
normalized leak-result calculation that writes ffff301c."""
note = [
    """
The stored axis is \
[0,64,128,192,256,320,384,512,768,1280,2048,3072,4608,7168,10752,16384], and \
the map is [0,28,40,49,57,64,70,81,99,128,162,198,242,302,370,457]. At the \
stored knots, the map differs from sqrt(12.75*x) by less than 0.566 raw, so \
its measured shape is square-root-like without proving an exact formula. The \
same map and axis byte sequences occur in the registered VQ37VHR, VQ35HR, \
and VQ25HR ROMs at family-specific addresses. Factory ESM pages EC-274 and \
EC-316 define P0442 and P0456 as negative-pressure leak tests. EC-529 gives \
Service 06 leak-area conversion 1/128 mm2, but no code trace binds that \
publication conversion to this internal map or ffff301c; internal units \
remain raw. Result disposition: consumer.""",
]
