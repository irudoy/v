summary = """
A 1D lookup defines a lower raw limit: the result indexed by u8[ffff1077] is \
written to u8[ffff1f24], extended as x<<8, and participates in selecting the \
maximum with value u16[ffff1e5c] inside the accessor."""
note = [
    """
The lookup by uint8 ffff1077 writes raw x to ffff1f24 and x<<8 to ffff1e54. \
At 0003c4a0, value x<<8 forms a maximum with uint16 ffff1e5c, so the map \
defines a lower raw boundary. The shift belongs to the state representation, \
not the map scale; the implicit RAM axis is not emitted separately.""",
]
