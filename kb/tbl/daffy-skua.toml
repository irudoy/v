summary = """
Coolant-indexed rise reload table of the intake idle target, selected while \
ROM8[00008616] bit 0 is clear. FUN 000bdc66 looks it up by coolant index \
ffff106f and writes the result to ffff1a1e and countdown ffff25ee; with \
ffff247b bit 1 set and ffff1a1e nonzero, it raises intake target ffff2326 \
toward idle source byte ffff1553 by one count each time the countdown reads \
zero and reloads the pair (JK08A.cvtc.md)."""
note = [
    """
On the update branch in 000bdc66, previous values ffff1a1e != 0 and ffff25ee \
== 0 enter the gate before the lookup. The selector chooses 00012f06 instead \
of 00012efe; all eight cells in 00012f06 equal 5, so the current calibration \
returns 5 regardless of index. Stock ROM8[00008616] is 0x01, so the stock \
image never reads this table. The routine that counts ffff25ee down is not \
identified, so the time base of the rise is not established. Index: implicit \
1D-8 by uint8 ffff106f: linear interpolation of adjacent bytes for x<224, \
element[7] for x>=224. Output trace: 00012f06 -> 000bde7a/000bde82 -> \
00026370 -> 00026a80 -> 00026aac/00026aae -> 00026740 -> 000bde86 -> \
000bde8c/000bde94 -> ffff1a1e/ffff25ee; before the next write, previous \
values ffff1a1e and ffff25ee are tested in the 000bdc66 gate. Result \
disposition: consumer; Result target: RAM ffff1a1e and ffff25ee; consumer \
function 000bdc66.""",
]
