summary = """
Dimensionless normalization coefficient for the result of selected map \
0001459a or 000145ca: Q = floor(U * K / 50000), saturated to uint16."""
note = [
    """
Base 0001495a is loaded at 000627a6, lookup is called at 000627aa, and \
result K is written to ffff2b68 at 000627b6. Branch 000627c0 selects U from \
0001459a or 000145ca; 000627dc multiplies U by K, and call 00021ce0 at \
000627e0 divides the product by ROM constant 50000. All K points equal \
50000, so the current calibration gives a unity multiplier. The physical \
quantity U is unknown.""",
]
