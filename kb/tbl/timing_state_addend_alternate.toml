summary = """
Alternate warm DFCO-transition eight-point timing-state addend. It shares \
the index byte and the interpolator of the projected default table \
0x00013A26 and is selected when the transition-completion latch is set."""
note = """
Read by the coordinator FUN_0007323E at callsite 0x73378 through the \
implicit eight-point uint8 leaf 0x2A9F4 with the index byte 0xFFFE8194, the \
byte that indexes the default table 0x00013A26 at 0x73334, so neither branch \
carries an engine-bank identity. The selector is the latch 0xFFFEB9A4.bit2: \
it sets when the progress word 0xFFFEB8DA reaches ROM8[0x854E] * 256 = \
0x8000 and releases below 0x8000 - ROM8[0x854F] * 256 = 0x7300. Stock bytes \
are identical to JK78C 0x000137F0."""

