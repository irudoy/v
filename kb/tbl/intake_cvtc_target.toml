summary = """
Warm/main intake-cam target surface. FUN 000bda64 interpolates it by RPM/50 \
byte ffff11ae and a load coordinate selected as uint8(ffff102c) with \
ffff2468.bit3 clear or 255 with that bit set (the stock 00008615 bit 0 is \
set), optionally applies conditional correction 0000ab5a around raw center \
128, and writes ffff1c5c. FUN 000bdc66 uses it above raw coolant 131 and \
blends it with cold target 0000b53a between raw coolant 106 and 131 before \
the result enters the intake CVTC target path."""
note = [
    """
The intake-cam target identity is code-proven by its placement in \
two-channel CVTC dispatcher 000bd170, the coolant target selector, and the \
consumer that compares common reference ffff2326 with both intake-cam timing \
channels. A 35,808-sample target-vehicle replay validates the exact warm raw \
lookup, normalized-BFS coordinate, byte-interpolation order, and scheduler \
alignment. With downstream neutralization excluded, prior-snapshot alignment \
is exact for 32,256 of 33,839 comparisons and within one raw for 33,122. One \
count is 0.5 crank degrees: channel-1A capture handlers 0002a5cc and \
0002a36a form the intake edge phases ffff22cc/ffff22cd as 20*ffff13b2 + \
floor(20*interval/ffff22bc) minus 60 or 20 through signed divider 00021bbc, \
where ffff22bc is 10 crank degrees; FUN 000bd9f0 publishes the actual bytes \
ffff2442/ffff2443 as 128 + rest edge - edge phase, and FUN 0004d2a6 \
subtracts them from common target ffff2326 in the same raw units. The \
2026-09-17 dashboard recordings keep both actual intake bytes within two \
counts of a target unchanged for 100 records in 95 to 100 percent of 13,202 \
to 43,264 samples per bank. The Cylinder Filling physical name and the \
crank-wheel origin of the absolute angle remain open. Result disposition: \
consumer.""",
]
