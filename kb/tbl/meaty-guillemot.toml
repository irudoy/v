summary = """
Cold/fallback exhaust-CVTC target surface. FUN 000bfdc0 writes its centered \
uint8 result to ffff1c5f; FUN 000bfe88 selects or blends it with warm/main \
result ffff1c5d and conditions the result into exhaust target ffff2327."""
note = [
    """
The code path proves the exhaust-target subsystem and centered \
representation. The conversion follows from monitor 0008f168, which compares \
target ffff2327 in raw units with the actual bytes ffff2324/ffff2325 that \
FUN 000bfc2e writes in counts of 0.5 crank degrees relative to the learned \
rest edge. The precise cold/fallback operating-mode name remains a \
homologous candidate. Stock cells are all 128, so this surface requests \
neutral exhaust timing wherever selected. Result disposition: consumer.""",
]
