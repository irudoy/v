layout = "1ek7a"
state = "absent"
note = """
The 1EK7A stock catalog carries the intake timing and solenoid pairs only \
for these subsystems. The exhaust target reader shape has no target match. \
The uniform neutral source cells repeat elsewhere in 1EK7A. The three \
aligned ROM pool values that name a matching block feed non-exhaust \
consumers at 00074d18, 0007ff3a and 000801d6."""

[[status.evidence]]
kind = "rom-bytes"
supports = "identity"
at = "1ek7a:0001d2ec"
value = "370300000000001100000000370200000000002100000000380306000000045200000000"
note = """
The complete group 0x37 contains P0011 and P0021, followed by group 0x38. \
The stock catalog has no P0014 or P0024 descriptor."""

