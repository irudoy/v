note = """
Target function 0007448c runs the program of JK78C 000657e4 \
(timing_vvel_state_compositor): it dispatches the state code with the same \
1/3, 2/8, 4, 5 and 6/7 compares, tests knock_surface_state fffe945b bit 7 as \
the bank bit where JK78C tests ffff23c6 bit 6, tests fffe945d bit 6 as the \
centered-code flag bit where JK78C tests ffff23cb bit 7, and calls its own \
lookup helpers at the JK78C wrapper positions. Its call sites do not align \
one to one with the JK78C call sites, so the binding rests on the helper, \
the argument register and the selecting branch, as on 1ND 00070514. The \
table reads are the 16x16 centered-code lookups for codes 2/8 and 1/3, each \
selected among four surfaces by the bank bit and the flag bit. It is the 1/3 \
lookup on the bank-bit-clear, flag-bit-set branch. MOV.L 000754a8 loads this \
table, which reaches the call at 00075526 (fuel_compensation_lookup) in r4, \
as MOV.L jk78c:000669ae loads 0000abca, which reaches the call at 000669b6 \
(fuel_compensation_lookup) in r4. Its 256 stock bytes equal JK78C."""

