title = """
Blend start curve of the selector-bit-clear branch of the request-mode \
coefficient"""
summary = """
Implicit 8-point uint16 curve of 00090664 over the engine-speed coordinate \
min(ffff11a6, 0x1c0) shifted left by seven. When bit 7 of ffff455b is set \
and bit 6 of ffff23c6 is clear, the builder returns (this*(255-g) + \
request_upper_limit_curve*g)/255 capped at 0x7fff, where g is \
request_mode_selected_gain_curve_b at the high byte of ffff33ae. Physical \
units remain unresolved."""
home = "jk78c"
role = "table"
access = "explicit"
cols = 8
rows = 1
storage = "uint16"

[[symbol]]
layout = "1me3b"
address = "00016bc6"
level = "code"

[[symbol.evidence]]
kind = "l0"
supports = "homology"
at = "1me3b:000a84ae"
to = "jk78c:00016544"
note = """
1ME3B 000a8470 repeats JK78C 00090664 with gate bit 0 of fffeb9e2, the \
coordinate min(fffe8198, 0x1c0) << 7 and selector bit 7 of fffe945b. MOV.L \
000a84ae loads this curve as the first lookup of the selector-bit-clear \
branch, which blends it with request_upper_limit_curve 00017076 by \
request_mode_selected_gain_curve_b. Every stock gain cell is 255 and this \
curve equals 00017076, so it carries no weight in the stock image."""

[[symbol]]
layout = "jk78c"
address = "00016544"
level = "code"

[[symbol.evidence]]
kind = "l0"
supports = "identity"
at = "jk78c:000906a4"
note = """
MOV.L 000906a4 loads this curve for the implicit 8-point word wrapper \
00028200 in the branch where bit 6 of ffff23c6 is clear."""

[[status]]
layout = "1nd"
state = "absent"
note = """
1ND has no blend stage: the selector-bit-clear branch reads \
request_upper_limit_curve alone."""

[[status.evidence]]
kind = "l0"
supports = "identity"
at = "1nd:000a25e8"
note = """
1ND 000a254a reads one implicit word curve per branch of bit 6 of fffe9488 \
through 0002881c: 00016ff2 at 000a25e8 when the bit is clear and 00016fe2 at \
000a25f6 when it is set. It caps the result at 0x7fff without a second curve \
or a byte gain lookup."""
