summary = """
Largest increase of the corrected VVEL duration above the reference duration \
of FUN_00055E78. FUN_00055FF2 looks up this curve by engine speed over the \
axis 0x0001512C, scales it by 0.005, and writes max(reference, min(reference \
+ limit, corrected duration)) to 0xFFFFA0FC, the first output of \
FUN_00055E78. The stock ratio bounds ROM16[0x9222] = ROM16[0x9224] = 65535 \
fix the ratio at 65535 / 8192, and every stock cell holds 65535 = 327.675, \
so the stock limit never binds."""
note = [
    """
Native editor class (issue #129): stock-inactive on JK78C and absent on 1ND \
and 1ME3B. The reader FUN_00055FF2 is reachable without a calibration gate \
through FUN_000557B2, FUN_00055A30, FUN_00055C46 and FUN_00055E78, and its \
output is consumed: FUN_00055D72 takes it. The stock cells 65535 = 327.675 \
leave the clamp non-binding: 65535 is the calibration value that removes the \
limit, and a lower value bounds the increase. On 1ND and 1ME3B the duration \
characteristic has no ratio-correction reader, as the layout statuses \
state.""",
]
