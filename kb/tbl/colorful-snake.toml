summary = """
The unsigned Base Fuel Schedule lookup result is the lower threshold of \
code-3 range and code-4 threshold for high byte ffff1024: input >= threshold \
permits code 3 after the upper-bound check, while input < threshold writes 4 \
to ffff2b4b."""
note = [
    """
All 16 cells equal 252, so the index does not change the effective \
threshold. Exact DID 0x1208 establishes the Base Fuel Schedule input \
identity; x/8 ms is profile-derived and requires hardware validation. Index: \
implicit 1D-16 with q=min(2*max(u8[ffff11ae]-8,0),255), interpolation below \
240, and cell 15 at or above 240. Result disposition: inline_comparison; \
target sites 0008368e and 0008369a; code 4 is written at 000836a4.""",
]
