branches, the map result is written to ffff97a4/ffff97a6 and then added to \
signed 16-bit channel value ffff45a0/ffff45a2; the unsigned down step in \
ffff97a0/ffff97a2, which adjacent map 0001463a supplies on selector == 2 \
branches, is then subtracted, and the result is limited to signed 16-bit \
range and bounded to -500..500 by signed min/max."""
