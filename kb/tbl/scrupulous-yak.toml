summary = """
Eight-point table of a raw unsigned multiplier. The result interpolated by \
byte ffff106f forms ffff1766 directly or after conditional normalization; \
0006e490 uses this byte as a multiplier of ROM_u16[000093c8] in a \
constrained fixed-point calculation for ffff1300, while 0006e442 uses it in \
a division conversion with addition of 0x32 and saturation to 0xff for \
ffff1f86."""
note = [
    """
The physical subsystem and physical unit are unknown. When RAM[ffff244f]&2 \
!= 0, the lookup result reaches ffff1766 directly. When the bit is zero and \
RAM[ffff16b1] != 0, min(255, floor(lookup*RAM[ffff16ae]/RAM[ffff16b1])) is \
written; when the divisor is zero, 255 is written regardless of the map. \
0006e490 calculates min(65535, \
(1250*min(4*ROM_u16[000093c8]*RAM_u8[ffff1766], 0x00346dc5)) >> 16) and \
writes the result to ffff1300. The claim relies on associated sink \
0006e3d8/ffff1766 rather than other accessor registers. Index: x = \
uint8(RAM[ffff106f]); 8 implicit nodes 0,32,64,96,128,160,192,224; linear \
interpolation of adjacent uint8 cells for x < 224, and cell 7 is returned \
for x >= 224. Output trace: 0001296c -> site 0006e3ec -> 00026370 -> \
(00026a80 -> 00026740 for x < 0xe0; 00012973 for x >= 0xe0) -> site 0006e3f2 \
-> site 0006e440 -> RAM ffff1766 -> {0006e490 -> RAM ffff1300; 0006e442 -> \
RAM ffff1f86}. Alternate normalization branch: 0001296c -> site 0006e40a -> \
00026370 -> 00026a80 -> 00026740 -> site 0006e41a -> site 0006e426/00021bbc \
-> site 0006e440 -> RAM ffff1766. Result disposition: consumer; Result \
target: RAM ffff1766 at site 0006e440; consumers 0006e490 and 0006e442; \
downstream RAM ffff1300 and ffff1f86.""",
]
