summary = """
Conditional stage-1 DFCO entry-delay table. FUN 0004fe9c interpolates it \
from clamp(max(vehicle-speed snapshot ffff110e - 6,0)*8,0,255), places the \
result in the high byte of its returned delay word, and FUN 000503e0 loads \
that byte into countdown timer ffff2571."""
note = [
    """
All 16 cells equal 60. Stock ROM8[0000870c].bit7 is clear, so this table is \
selected only by the non-stock bit7 branch with ffff2468.bit7 set, warm \
coolant, and RPM below 3000. The timer decrements once per DFCO scheduler \
event. Its exact period is 204800/Pphi seconds; passive target-CAN \
timestamps establish 10.24 ms/count on JK08A. Result disposition: \
state_timer.""",
]
level = "code"
role = "table"
access = "explicit"
unit = "DFCO scheduler counts"
scale = "x"
to_raw = "x"

