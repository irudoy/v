summary = """
Q1.7 coefficient selected when ffff420b.bit4 is clear. FUN 00069374 \
interpolates it by uint8[ffff10f0] over axis 00023814, writes K to ffff90d0, \
and calculates out=min(65535,floor(K*floor(14*d/64)/128)), where \
d=(u16[ffff1040]-u16[ffff8dc8]) mod 65536. The result is written to \
ffff8f0a."""
note = [
