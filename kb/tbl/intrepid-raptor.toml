summary = """
Primary-channel endpoint A of the Q16 two-surface crossfade in FUN 00070e4c. \
The function interpolates this surface by ffff1210 and ffff10d2, stores the \
result in ffff133a, and blends it with endpoint B 0001070e into ffff1212."""
note = [
    """
Every stock cell is zero. The lookup executes, but ROM8[000089fb]=0x20 has \
bit 3 clear and therefore forces final ffff1332 to copy original source \
ffff1210 instead of processed word ffff1330. ffff1212 and ffff1330 have no \
external readers. Result disposition: dead_control_flow. Result target: \
ffff1332 receives ffff1210 in unmodified JK08A. The physical quantity and \
engineering unit remain unresolved.""",
]
