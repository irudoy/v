summary = """
DSTR, the ATU-II channel-8 down-count start register. Channel initialization \
0002718a clears it. Scheduler 0002c13c sets bit i to start the one-shot for \
injector channel i; a bit that is still set marks a pulse in flight, in \
which case the scheduler first subtracts injector opening time ffff23aa from \
the new duration."""
note = [
    """
Bits 0 to 5 correspond to DCNT8A through DCNT8F. The physical terminal order \
of the six outputs requires hardware validation.""",
]
level = "code"
unit = "bitfield"

