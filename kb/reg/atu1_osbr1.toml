summary = """
ATU-II channel-1 offset base register OSBR1. This read-only 16-bit capture \
register uses the TI0A trigger also used by channel-0 ICR0A and captures the \
channel-1 counter. The normal ICI0A prologue reads its word through the \
signed base fffff440 plus 0x16 and stores it in ffff158a before computing \
the tooth-period difference. The separate 32-bit ICR0A root is fffff434."""
width = 16
signed = false
unit = "timer counts"

