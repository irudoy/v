summary = """
BFR7B, the ATU-II channel-7B buffer register for the second intake-VTC \
output. FUN 000beace writes the converted value of ffff23b4, or fixed 825 \
counts on the hardware-control path."""
note = [
    """
Fixed 825 counts is 20 percent of cycle register fffff58a. The fixed values \
apply only while saturated engine-speed byte ffff11ea is positive; otherwise \
both channels are driven to zero.""",
]
level = "code"
unit = "timer counts"

