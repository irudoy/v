title = "SH7059 HCAN1 bit configuration register 1"
summary = """
Application initialization writes 0xf210, selecting 16 Tq for TSEG1, 3 Tq \
for TSEG2, 2 Tq for SJW, and one sample. With the fixed sync segment the \
nominal bit is 20 Tq. Low-ROM initialization writes 0xf220, selecting 3 Tq \
for SJW with the same nominal bit length."""
