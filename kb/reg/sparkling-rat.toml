summary = """
TCR8, the ATU-II channel-8 timer control register. Channel initialization \
0002718a writes 0x55, so CKSELA in bits 2:0 selects phi'/32 for \
DCNT8A..DCNT8H and CKSELB in bits 6:4 selects the same rate for \
DCNT8I..DCNT8P."""
note = [
    """
With PSCR1 = 1 the injector down-counters run at Pphi/64. The value is a \
single exact byte write on the initialization path.""",
]
