title = "SH7059 HCAN1 bit configuration register 0"
summary = """
Application initialization writes 1, selecting 2 peripheral-clock cycles per \
time quantum. With the programmed BCR1 this gives Pphi / 40 for the nominal \
CAN bit rate. Low-ROM initialization uses the same divider and nominal bit \
rate."""
