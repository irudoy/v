summary = """
BFR7A, the ATU-II channel-7A buffer register that carries the intake-VTC \
duty into DTR7A at the cycle boundary. FUN 000beace writes the converted \
value of ffff23b5, or fixed 1238 counts on the hardware-control path."""
note = ["Fixed 1238 counts is 30 percent of cycle register fffff588."]
level = "code"
unit = "timer counts"

