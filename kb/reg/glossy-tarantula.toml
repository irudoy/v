summary = """
DCNT8A, the first of the sixteen ATU-II channel-8 one-shot down-counters. \
Channel initialization 0002718a clears DCNT8A through DCNT8P. Scheduler \
0002c13c adds sat_u16(800*duration/256) to DCNT8A+2*i for injector channel i \
with interrupts masked around the read-modify-write."""
note = [
    """
With PSCR1 = 1 and TCR8 = 0x55 the counters run at Pphi/64 = 312.5 kHz, so \
one step is 3.2 us and one duration count of 10 us is 3.125 steps.""",
]
level = "code"
unit = "timer counts"

