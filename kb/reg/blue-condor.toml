summary = """
SH7058 A/D data register 0 (ADDR0), containing the left-aligned 10-bit \
conversion result for analog channel AN0. JK08A connects this MCU input to \
an external analog multiplexer selected through PFDR bits PF13..PF15."""
note = [
    """
The hardware manual maps AN0 to MCU pin 86/H17. Exact firmware and \
diagnostic paths bind mux codes 000, 001, and 111 to coolant, battery \
voltage, and fuel temperature respectively; the ECM-side mux circuit and \
remaining positions are not assigned.""",
]
level = "code"
unit = "aligned ADC register"

