summary = """
POPCR, the 16-bit Advanced Pulse Controller register. Bits 7:0 enable output \
1 on the corresponding PULS pin at GR11A compare; bits 15:8 enable output 0 \
at GR11B compare. Current-cylinder masks ffff13bd and ffff13d1 select the \
low-byte and high-byte actions."""
note = [
    """
Register behavior is silicon-documentation ground truth. External driver \
polarity and the physical spark edge are not established.""",
]
level = "code"
unit = "bitfield"

