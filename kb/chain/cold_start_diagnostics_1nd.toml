title = "1ND cold-start DTC dispatch"
summary = """
The periodic diagnostic task calls the P1421 coordinator. The stock \
configuration inhibits the index-276 DTC transfers."""
quantity = "Runtime DTC report activity"
output = "dtc_report_activity_sh7059/ram"
specs = ["defs/analysis/diagnostics/stock-thermal-diagnostics.md"]
home = "1nd"
layouts = ["1nd"]

[[step]]
from = "thermal_diagnostic_task_1nd/fn"
to = "cold_start_diagnostic_coordinator_1nd/fn"
effect = "schedules"
sign = "none"

[[step]]
from = "cold_start_diagnostic_coordinator_1nd/fn"
to = "dtc_report_dispatch_sh7059/fn"
effect = "gates"
sign = "none"

[[step]]
from = "dtc_report_dispatch_sh7059/fn"
to = "dtc_report_mark_sh7059/fn"
effect = "feeds"
sign = "none"

[[step]]
from = "dtc_report_mark_sh7059/fn"
to = "dtc_report_activity_sh7059/ram"
effect = "stores"
sign = "none"
