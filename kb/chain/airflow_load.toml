title = "Airflow and load"
summary = """
Samples the AN4/AN15 MAF voltages, converts them through the bank transfer \
curves, filters, and the combined aggregate into Base Fuel Schedule ffff1026 \
with Fuel Compensation Main, and normalizes the schedule to the Q7 load byte \
ffff102c read by the fuel and ignition maps."""
quantity = """
Normalized Base Fuel Schedule load, percent of the ROM16[0x9534] reference \
(raw*100/128)"""
output = "normalized_load/ram"
specs = ["defs/JK08A.fuel.md", "defs/JK08A.load.md"]
home = "7mfk"
order = 3

[[step]]
from = "real-sawfish/reg"
to = "enthusiastic-pillbug/ram"
effect = "receives"
sign = "positive"
via = ["fuzzy-parakeet/fn"]
note = "ffff1d62 = uint16(fffff808) >> 6"

[[step]]
from = "zircon-stallion/reg"
to = "hairy-dalmatian/ram"
effect = "receives"
sign = "positive"
via = ["fuzzy-parakeet/fn"]
note = "ffff1d64 = uint16(fffff826) >> 6"

[[step]]
from = "enthusiastic-pillbug/ram"
to = "maf_b1/ram"
effect = "scales"
sign = "positive"
via = ["outstanding-penguin/fn", "optimistic-bobcat/fn"]
note = "ffff101c = min(65535, floor(uint16(ffff1d62)*uint16(ffff4970)/32768))"

[[step]]
from = "hairy-dalmatian/ram"
to = "maf_b2/ram"
effect = "scales"
sign = "positive"
via = ["outstanding-penguin/fn", "optimistic-bobcat/fn"]
note = "ffff101e = min(65535, floor(uint16(ffff1d64)*uint16(ffff4970)/32768))"

[[step]]
from = "maf_b1/ram"
to = "ginger-stingray/ram"
effect = "subtracts"
sign = "positive"
via = ["enchanted-cricket/fn", "unsigned_divide/fn"]
note = """
prev = uint16(ffff1e48); K = uint32(ffff3998); c = \
floor(floor(K*335/65536)/min(65535,prev+80)); ffff1e48 = \
uint16(uint16(ffff101c)-c)"""

[[step]]
from = "maf_b2/ram"
to = "careful-penguin/ram"
effect = "subtracts"
sign = "positive"
via = ["enchanted-cricket/fn", "unsigned_divide/fn"]
note = """
prev = uint16(ffff1e4a); K = uint32(ffff399c); c = \
floor(floor(K*335/65536)/min(65535,prev+80)); ffff1e4a = \
uint16(uint16(ffff101e)-c)"""

[[step]]
from = "ginger-stingray/ram"
to = "wealthy-woodlouse/tbl"
effect = "indexes"
sign = "none"
via = ["dual_bank_maf_coordinator/fn", "xanthic-kagu/fn", "precise-koala/fn"]
note = "x = uint16(ffff1e48<<4); to = min(63,x>>8); frac = uint16(x<<8)"

[[step]]
from = "careful-penguin/ram"
to = "ivory-gecko/tbl"
effect = "indexes"
sign = "none"
via = ["dual_bank_maf_coordinator/fn", "xanthic-kagu/fn", "precise-koala/fn"]
note = "x = uint16(ffff1e4a<<4); to = min(63,x>>8); frac = uint16(x<<8)"

[[step]]
from = "wealthy-woodlouse/tbl"
to = "vague-pony/ram"
effect = "looks-up"
sign = "positive"
via = [
    "dual_bank_maf_coordinator/fn",
    "xanthic-kagu/fn",
    "precise-koala/fn",
    "didactic-civet/fn",
]
note = "ffff1054 = uint16(lookup(0x00014274,uint16(ffff1e48<<4)))"

[[step]]
from = "ivory-gecko/tbl"
to = "opalescent-pronghorn/ram"
effect = "looks-up"
sign = "positive"
via = [
    "dual_bank_maf_coordinator/fn",
    "xanthic-kagu/fn",
    "precise-koala/fn",
    "didactic-civet/fn",
]
note = "ffff1056 = uint16(lookup(0x000141f4,uint16(ffff1e4a<<4)))"

[[step]]
from = "vague-pony/ram"
to = "vegan-polecat/ram"
effect = "filters"
sign = "positive"
via = [
    "dual_bank_maf_coordinator/fn",
    "brass-ammonite/fn",
    "sandy-chameleon/fn",
]
note = """
ffff1058 = uint16(ffff1054); prev = uint16(ffff1df0); k = ROM8[0x0000870a]; \
f = floor((k*ffff1058+(256-k)*prev)/256); ffff1df0 = uint16(f)"""

[[step]]
from = "opalescent-pronghorn/ram"
to = "spiked-dalmatian/ram"
effect = "filters"
sign = "positive"
via = [
    "dual_bank_maf_coordinator/fn",
    "brass-ammonite/fn",
    "sandy-chameleon/fn",
]
note = """
ffff105a = uint16(ffff1056); prev = uint16(ffff1df2); k = ROM8[0x0000870a]; \
f = floor((k*ffff105a+(256-k)*prev)/256); ffff1df2 = uint16(f)"""

[[step]]
from = "vegan-polecat/ram"
to = "jasper-walrus/ram"
effect = "converts"
sign = "positive"
via = ["mustard-squid/fn"]
note = """
Signed 32-bit bank-1 contribution with bounded stateful corrections; fuel.md \
reproduces BFS from Q = A + B, which fixes the sign."""

[[step]]
from = "spiked-dalmatian/ram"
to = "imposing-auk/ram"
effect = "converts"
sign = "positive"
via = ["mustard-squid/fn"]
note = """
Signed 32-bit bank-2 contribution; the correction terms of 0003af42 are \
unresolved."""

[[step]]
from = "jasper-walrus/ram"
to = "polar-viper/ram"
effect = "adds"
sign = "positive"
via = ["combined_maf_aggregate/fn"]
note = """
ffff1e38 = max(0, ffff1df8 + ffff1dfc + ffff1e2a + ffff2368); stock ffff1e2a \
is zero and ffff2368 has no application writer."""

[[step]]
from = "imposing-auk/ram"
to = "polar-viper/ram"
effect = "adds"
sign = "positive"
via = ["combined_maf_aggregate/fn"]
note = "The bank-2 contribution enters the combined nonnegative MAF aggregate."

[[step]]
from = "polar-viper/ram"
to = "voracious-oarfish/ram"
effect = "scales"
sign = "positive"
via = ["base_fuel_schedule_producer/fn"]
note = """
Primary branch: fixed = min(floor(floor(F*K*Q/256)/(E*N)), 0x726f9), \
ffff1e40 = floor(fixed*9163/65536), a quarter BFS."""

[[step]]
from = "active-caracal/tbl"
to = "voracious-oarfish/ram"
effect = "scales"
sign = "positive"
via = ["base_fuel_schedule_producer/fn"]
note = "Base Fuel Schedule K-Value K = 26806 multiplies aggregate Q."

[[step]]
from = "spectral-corgi/tbl"
to = "voracious-oarfish/ram"
effect = "scales"
sign = "positive"
via = ["base_fuel_schedule_producer/fn"]
note = "MAF Factor F = 109 multiplies aggregate Q."

[[step]]
from = "vigorous-horse/ram"
to = "voracious-oarfish/ram"
effect = "scales"
sign = "negative"
via = ["base_fuel_schedule_producer/fn"]
note = """
N is ffff11e8 (1.5625 rpm per count) or ffff11dc, lower-bounded at 64; E*N \
divides F*K*Q with E = ROM8[0x88fb] = 3."""

[[step]]
from = "voracious-oarfish/ram"
to = "tall-quoll/ram"
effect = "multiplies"
sign = "positive"
via = ["base_fuel_schedule_producer/fn"]
note = "ffff1062 = min(65535, floor(ffff1e40*ffff1160/128))."

[[step]]
from = "fuel_compensation_main/tbl"
to = "majestic-jackrabbit/ram"
effect = "looks-up"
sign = "positive"
via = ["fuel_compensation_coordinator/fn"]
note = """
Fuel Compensation Main, Q7 with 128 = 100 percent, on RPM/12.5 ffff11f4 and \
alpha-N byte ffff1170; runtime gates can write a bounded bypass."""

[[step]]
from = "majestic-jackrabbit/ram"
to = "tall-quoll/ram"
effect = "multiplies"
sign = "positive"
via = ["base_fuel_schedule_producer/fn"]
note = """
The Q7 Fuel Compensation Main byte multiplies the quarter-BFS source \
ffff1e40."""

[[step]]
from = "tall-quoll/ram"
to = "bfs/ram"
effect = "filters"
sign = "positive"
via = ["base_fuel_schedule_producer/fn"]
note = """
Rate stage on T = 4*ffff1062*ffff115c and P = ffff1f30*ffff1e06 into \
ffff1dee, blend, ffff1060; fuel.md replays steady BFS from the primary \
branch."""

[[step]]
from = "lilac-magpie/tbl"
to = "bfs/ram"
effect = "limits"
sign = "positive"
via = ["base_fuel_schedule_producer/fn"]
note = """
Upper-limit curve on RPM/25 byte ffff11eb, cell << 8, caps the corrected \
schedule while ffff2449.bit7 is clear."""

[[step]]
from = "bfs/ram"
to = "benign-cassowary/ram"
effect = "scales"
sign = "positive"
via = ["base_fuel_schedule_producer/fn"]
note = """
ffff1048 = min(255, floor(ffff1026*128/ROM16[0x9534])); raw 128 is 100 \
percent of the reference."""

[[step]]
from = "precise-nuthatch/tbl"
to = "benign-cassowary/ram"
effect = "scales"
sign = "negative"
via = ["base_fuel_schedule_producer/fn"]
note = """
Internal Load Normalization Reference 0x6a5a = 27226 divides the schedule; \
it also scales the torque filling coordinate."""

[[step]]
from = "benign-cassowary/ram"
to = "normalized_load/ram"
effect = "copies"
sign = "positive"
via = ["coherent_snapshot/fn"]
note = """
00020dfe copies ffff1048..ffff1063 to ffff102c..ffff1047 before the periodic \
tasks; the maps of that pass read ffff102c."""
