target mixture and the base terms, the transient term, and the common gain \
into bank precursors, adds the battery-dependent opening time, and applies \
the channel multiplier and minimum-pulse floor to the durations that \
0002c13c loads into ATU-II channel 8."""
quantity = """
Injector pulse duration after the minimum-pulse floor, 10 us counts (ms = \
raw/100)"""
output = "handsome-spaniel/ram"
specs = ["defs/analysis/fuel/JK08A.fuel.md"]
home = "7mfk"
order = 4

