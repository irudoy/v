title = "Exhaust CVTC"
summary = """
RPM/50 ffff11ae and normalized BFS ffff102c index the exhaust main, \
cold/fallback, and correction surfaces; coolant selection, the standstill \
override, the limiter, the slew, and the demand gate form common target \
ffff2327. Per bank, the error against the filtered cam position feeds the \
gain-scaled controller and the battery-compensated duty words \
ffff1aac/ffff1aae, which drive ATU-II channels 7D/7C."""
quantity = """
Exhaust cam retard target, crank degrees ((raw-128)*0.5, retard positive)"""
output = "exhaust_cvtc_target/ram"
specs = ["defs/analysis/valve-timing/JK08A.cvtc.md"]
