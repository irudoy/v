title = "Independent intake CVTC diagnostics"
summary = """
Use the battery and target gates and both capture-derived phase bytes to \
reach independent bank timing reports."""
quantity = "Runtime DTC report-activity byte"
output = "dtc_report_activity_sh7059/ram"
specs = ["defs/analysis/diagnostics/stock-cam-timing-diagnostics.md"]
home = "1nd"
layouts = ["1nd"]

[[step]]
from = "thermal_diagnostic_task_1nd/fn"
to = "intake_cvtc_secondary_wrapper_1nd/fn"
effect = "schedules"
sign = "none"

[[step]]
from = "intake_cvtc_secondary_wrapper_1nd/fn"
to = "intake_cvtc_secondary_timing_reports_sh7059/fn"
effect = "gates"
sign = "none"

[[step]]
from = "intake_cvtc_diag_target_word_sh7059/ram"
to = "intake_cvtc_secondary_timing_reports_sh7059/fn"
effect = "gates"
sign = "none"

[[step]]
from = "wild-markhor/ram"
to = "intake_cvtc_secondary_timing_reports_sh7059/fn"
effect = "gates"
sign = "none"

[[step]]
from = "intake_cvtc_diag_phase_b1_sh7059/ram"
to = "intake_cvtc_secondary_timing_reports_sh7059/fn"
effect = "feeds"
sign = "none"

[[step]]
from = "intake_cvtc_diag_phase_b2_sh7059/ram"
to = "intake_cvtc_secondary_timing_reports_sh7059/fn"
effect = "feeds"
sign = "none"

[[step]]
from = "intake_cvtc_secondary_timing_reports_sh7059/fn"
