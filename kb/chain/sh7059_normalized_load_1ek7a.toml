title = "Normalized load publication (1EK7A)"
summary = """
Scales the unsigned base-fuel word against the stock reference and copies \
the saturated byte to the scheduler snapshot."""
quantity = "Q7 normalized base-fuel schedule"
output = "normalized_load/ram"
specs = ["defs/analysis/airflow/SH7059.input-state.md"]
home = "1ek7a"
layouts = ["1ek7a"]

[[step]]
from = "bfs/ram"
to = "benign-cassowary/ram"
effect = "scales"
sign = "positive"
via = ["base_fuel_schedule_producer/fn"]

[[step]]
from = "benign-cassowary/ram"
to = "normalized_load/ram"
effect = "copies"
sign = "positive"
via = ["sh7059_periodic_snapshot_1ek7a/fn"]
