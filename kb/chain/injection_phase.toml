RPM/25 byte ffff11b3 indexes End of Injection Angle Base 0x12302 or \
Conditional 0x1230A into injection-end delay ffff192e. FUN_000521A8 \
subtracts the pulse angle into lead ffff23f0 and start angle ffff23bf, which \
place the delayed start that FUN_0002C13C fires into DSTR and \
DCNT8A..DCNT8F."""
quantity = """
Injection-end delay from the reference tooth to the end of the pulse, 2 \
crank degrees per count; end of injection is 130 + 2*count degrees after \
intake TDC"""
output = "injection_end_angle/ram"
specs = ["defs/JK08A.fuel.md"]
home = "7mfk"
order = 6

