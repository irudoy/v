title = "Misfire detection"
summary = """
Tooth-9 crank intervals captured by ICR0A form offset-binary irregularity \
metrics that detection core 00085a70 compares with surface-derived threshold \
windows to count misfire events per cylinder. Per-cylinder counts at the \
threshold set the P0301..P0306 and P0300 records through reporter 00084cd0 \
and handler 0007dc32."""
quantity = """
Misfire event count: total element 0 of the ffff3806 array, with \
per-cylinder elements 1..6 at byte offset 2*cylinder"""
