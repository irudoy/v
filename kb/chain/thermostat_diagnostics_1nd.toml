title = "1ND thermostat decision"
summary = """
The periodic task reaches the P0128 model through two ROM gates. The stock \
group bit skips the model call."""
quantity = "Runtime DTC report activity"
output = "dtc_report_activity_sh7059/ram"
specs = ["defs/analysis/diagnostics/stock-thermal-diagnostics.md"]
home = "1nd"
layouts = ["1nd"]

[[step]]
from = "thermal_diagnostic_task_1nd/fn"
to = "thermostat_monitor_1nd/fn"
effect = "schedules"
sign = "none"

[[step]]
from = "thermostat_monitor_1nd/fn"
to = "thermostat_latched_temperature_input_1nd/ram"
effect = "stores"
sign = "none"

[[step]]
from = "thermostat_monitor_1nd/fn"
to = "thermostat_elapsed_counter_1nd/ram"
effect = "stores"
sign = "none"

[[step]]
from = "thermostat_monitor_1nd/fn"
to = "thermostat_event_counters_1nd/fn"
effect = "schedules"
sign = "none"

[[step]]
from = "thermostat_monitor_1nd/fn"
to = "thermostat_diagnostic_exclusion_1nd/fn"
effect = "schedules"
sign = "none"

[[step]]
from = "thermostat_monitor_1nd/fn"
to = "thermostat_model_1nd/fn"
effect = "schedules"
sign = "none"

[[step]]
from = "selected_coolant_coordinate_1nd/ram"
to = "thermostat_model_1nd/fn"
effect = "feeds"
sign = "none"

[[step]]
from = "thermostat_latched_temperature_input_1nd/ram"
to = "thermostat_model_1nd/fn"
effect = "feeds"
sign = "none"

[[step]]
from = "current_coolant_coordinate_sh7059/ram"
to = "thermostat_model_1nd/fn"
effect = "feeds"
sign = "none"

[[step]]
from = "thermostat_diagnostic_exclusion_1nd/fn"
to = "thermostat_model_1nd/fn"
effect = "gates"
sign = "none"

[[step]]
from = "thermostat_model_1nd/fn"
to = "dtc_report_dispatch_sh7059/fn"
effect = "gates"
sign = "none"

[[step]]
from = "dtc_report_dispatch_sh7059/fn"
to = "dtc_report_mark_sh7059/fn"
effect = "feeds"
sign = "none"

[[step]]
from = "dtc_report_mark_sh7059/fn"
to = "dtc_report_activity_sh7059/ram"
effect = "stores"
sign = "none"
