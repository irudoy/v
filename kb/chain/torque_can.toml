title = "Engine torque on CAN"
summary = """
Engine Torque Map 0x10B8E over ffff11b6 and load passes the base term, \
spark-efficiency table 0x11D24, cylinder scaling, and accessory loads to net \
torque ffff240c, which frames 0x180 and 0x160 carry; CAN 0x174 status and \
word B bound shared request ffff19c6."""
quantity = "Net engine torque after accessory loads, signed raw torque counts"
output = "fervent-bittern/ram"
specs = ["defs/JK08A.can.md", "defs/JK08A.limiters.md"]
home = "7mfk"
order = 14

[[step]]
from = "functional-jackrabbit/axis"
to = "lyrical-dragon/tbl"
effect = "indexes"
sign = "none"
note = """
Row axis 0x14B4A selects Engine Torque Map rows at RPM/3.125 coordinate \
ffff11b6, 16 points from 400 to 7600 RPM."""

[[step]]
from = "capable-buffalo/axis"
to = "lyrical-dragon/tbl"
effect = "indexes"
sign = "none"
note = """
Column axis 0x2378C selects columns at q = min(65535, \
floor(ffff1024*40960/ROM16[0x9534])), which 00065928 stores in ffff15c4."""

[[step]]
from = "lyrical-dragon/tbl"
to = "engine_torque_state/ram"
effect = "looks-up"
sign = "positive"
via = ["primitive-lizard/fn", "white-malkoha/fn"]
note = """
00065928 writes ffff18ca = lookup - 32768; 000659ae writes ffff18cc = \
sat_s16 of ffff18ca + ffff2408 times a Q14 and a Q8 (256 - 0x1245A) factor."""

[[step]]
from = "pink-vulture/ram"
to = "engine_torque_state/ram"
effect = "adds"
sign = "positive"
via = ["white-malkoha/fn"]
note = """
Base term ffff2408 = sat_u16(lookup(0x154A0) - D + C) of 00065c26 enters the \
sum with the centered map result before the factors."""

[[step]]
from = "engine_torque_state/ram"
to = "chubby-snake/ram"
effect = "multiplies"
sign = "positive"
via = ["silky-vulture/fn"]
note = """
On the stock ROM8[0x8710].bit5 branch ffff18ce = trunc0(ffff18cc*(256 - \
F)/256); F <= 179 keeps the factor positive."""

[[step]]
from = "carmine-potoo/tbl"
to = "chubby-snake/ram"
effect = "multiplies"
sign = "negative"
via = ["silky-vulture/fn"]
note = """
F = table 0x11D24 at clamp_u8(ffff23f1 - ffff11a2), base ignition angle \
minus latched timing sum; a larger F lowers a positive state."""

[[step]]
from = "chubby-snake/ram"
to = "unbiased-pug/ram"
effect = "scales"
sign = "positive"
via = ["messy-perch/fn"]
note = """
ffff18d0 = sat_i16(trunc0(ffff18ce*(6 - n)/6) - ffff2408 - ffff14e2), n = \
inhibited-cylinder count of 00065d42."""

[[step]]
from = "pink-vulture/ram"
to = "unbiased-pug/ram"
effect = "subtracts"
sign = "negative"
via = ["messy-perch/fn"]
note = """
00065cd8 subtracts the unscaled base term ffff2408 after the efficiency and \
cylinder scaling."""

[[step]]
from = "intelligent-chipmunk/tbl"
to = "voracious-stingray/ram"
effect = "multiplies"
sign = "positive"
via = ["augmented-limpet/fn"]
note = """
000658a4 writes ffff14e2 = lookup(0x14C1A) times a nonnegative byte \
difference selected by ffff4181.bit7, divided by 256."""

[[step]]
from = "voracious-stingray/ram"
to = "unbiased-pug/ram"
effect = "subtracts"
sign = "negative"
via = ["messy-perch/fn"]
note = "00065cd8 subtracts RPM-curve correction ffff14e2 from the scaled state."

[[step]]
from = "unbiased-pug/ram"
to = "fascinating-crow/ram"
effect = "filters"
sign = "positive"
via = ["flashy-clam/fn"]
note = """
First-order filter ffff18d2 = trunc0((ffff18d0*w + ffff18d2*(256 - w))/256) \
with stock w = ROM8[0x87ED] = 255."""

[[step]]
from = "fascinating-crow/ram"
to = "fervent-bittern/ram"
effect = "feeds"
sign = "positive"
via = ["terrestrial-nuthatch/fn"]
note = """
00065e2c writes net engine torque ffff240c = sat_i16(ffff18d2 - ffff2410), \
the torque that CAN frame 0x180 carries."""

[[step]]
from = "cobalt-groundhog/ram"
to = "fervent-bittern/ram"
effect = "subtracts"
sign = "negative"
via = ["terrestrial-nuthatch/fn"]
note = """
Accessory-load sum ffff2410 = sat_u16(ffff1818 + ffff196e + ffff1838) of \
00065f9c, or zero while ffff11b3 is zero."""

[[step]]
from = "fervent-bittern/ram"
to = "adaptable-orangutan/ram"
effect = "converts"
sign = "positive"
via = ["coherent_snapshot/fn", "lyrical-pronghorn/fn"]
note = """
00020dfe latches ffff240c as ffff2380; 00079e70 writes \
clamp(trunc0(ffff2380/5) + 800, 0, 4094), or 4095 while ffff4221.bit2 is \
set."""

[[step]]
from = "adaptable-orangutan/ram"
to = "feedback_payload_base/ram"
effect = "stores"
sign = "none"
via = ["space-puma/fn", "kind-booby/fn"]
note = """
Coordinator 000c3de4 runs serializer 000c577a, which puts ffff3f96 into \
0x180 byte 2 and byte 3 bits 7..4 of record 7 at ffff3ab5 + 70."""

[[step]]
from = "feedback_payload_base/ram"
to = "unyielding-bullfinch/reg"
effect = "transmits"
sign = "none"
via = ["bright-octopus/fn", "free-coot/fn"]
note = """
000c38de calls submitter 000c3746, which copies record i into mailbox i + 1, \
then writes TXPR0/TXPR1; mailboxes 8 and 9 lie in TXPR0."""

[[step]]
from = "engine_torque_state/ram"
to = "sepia-armadillo/ram"
effect = "feeds"
sign = "positive"
via = ["vigorous-saluki/fn", "adorable-kudu/fn"]
note = """
Parallel channel 00065860 repeats stages 3 to 6 with F at latched \
timing-state byte ffff2404 and writes ffff240e = sat_i16(ffff18d8 - \
ffff2410)."""

[[step]]
from = "sepia-armadillo/ram"
to = "great-fulmar/ram"
effect = "converts"
sign = "positive"
via = ["coherent_snapshot/fn", "lyrical-pronghorn/fn"]
note = """
00020dfe latches ffff240e as ffff2382; 00079e70 packs max(min(ffff23a8, \
ffff2382), ffff2374) like ffff3f96, 4095 while ffff4221.bit2 is set."""

[[step]]
from = "great-fulmar/ram"
to = "feedback_payload_base/ram"
effect = "stores"
sign = "none"
via = ["shapeless-eagle/fn", "kind-booby/fn"]
note = """
Serializer 000c590e puts ffff3f98 into 0x160 byte 1 bits 3..0 and byte 2 of \
record 8 at ffff3ab5 + 80."""

[[step]]
from = "can_174_transmission_payload_decoder/fn"
to = "prehistoric-horse/ram"
effect = "receives"
sign = "none"
via = [
    "hcan1_receive_payload_dispatch/fn",
    "psychedelic-lizard/fn",
    "coherent_snapshot/fn",
]
note = """
000c3b14 calls 000c47ea for CAN 0x174, which publishes status ffff3a2e; \
0007724c sets ffff419b bits 3, 4 for value 3; 00020dfe latches ffff418f."""

[[step]]
from = "prehistoric-horse/ram"
to = "accomplished-cockle/ram"
effect = "gates"
sign = "none"
via = ["automatic_transmission_request_coordinator/fn"]
note = """
ffff4252.bit1 = ffff418f.bit4 with ffff1082 != ffff1083 and ffff4253.bit6 \
clear; ffff41a6.bit3 is set while bit 1 or hold byte ffff4413 is set."""

[[step]]
from = "can_174_transmission_payload_decoder/fn"
to = "notorious-malamute/ram"
effect = "receives"
sign = "none"
via = ["psychedelic-lizard/fn", "coherent_snapshot/fn"]
note = """
000c47ea stores 0x174 word B in ffff3f8e; 0007724c writes min(5*B - 4000, \
0x7FFF) to ffff2874; 00020dfe latches it as ffff2770."""

[[step]]
from = "notorious-malamute/ram"
to = "manipulative-coati/ram"
effect = "limits"
sign = "positive"
via = ["automatic_transmission_request_coordinator/fn"]
note = """
On a ffff4252.bit1 pass ffff4162 = max(floor ffff34da, target term) limited \
by ffff4138 and ffff2770; otherwise min(ffff34a4, ffff2770)."""

[[step]]
from = "accomplished-cockle/ram"
to = "spicy-smilodon/ram"
effect = "gates"
sign = "none"
via = ["transmission_request_bound_publisher/fn"]
note = """
While ffff41a6.bit3 is set, 000777fa publishes candidate ffff4162 as upper \
bound ffff3480 under ROM8[0x89C5].bit0; otherwise ffff3488."""

[[step]]
from = "manipulative-coati/ram"
to = "spicy-smilodon/ram"
effect = "selects"
sign = "positive"
via = ["transmission_request_bound_publisher/fn"]
note = """
Upper bound ffff3480 equals candidate ffff4162 while ffff41a6.bit3 is set; \
lower bound ffff3484 is min(ffff34c8, ffff4162)."""

[[step]]
from = "spicy-smilodon/ram"
to = "throttle_request_bounded/ram"
effect = "limits"
sign = "positive"
via = ["signed_request_boundary/fn"]
note = """
00079030 caps its working request, duplicated selection ffff2438, at upper \
bound ffff3480 before its other bounds and the store to ffff19c6."""
