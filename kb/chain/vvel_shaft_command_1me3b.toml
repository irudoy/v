title = "VVEL target shaft word (1ME3B)"
summary = """
The VVEL resolver evaluates candidates from the engine-speed and temperature \
coordinates. The working mode selects the applicable target. The task \
converts the result to the shaft-coordinate domain and stores the bounded \
word."""
quantity = "Bounded VVEL target shaft word"
output = "vvel_bounded_shaft_word_1me3b/ram"
specs = [
    "defs/analysis/valve-timing/SH7059.vvel-command.md",
    "defs/analysis/valve-timing/VQ37.running-rpm-axis-scale.md",
    "defs/analysis/valve-timing/VQ37.temperature-axis-scale.md",
    "defs/analysis/valve-timing/VQ37.command-count-scales.md",
    "defs/analysis/valve-timing/VQ37.ramp-delay-scale.md",
]
home = "1me3b"
order = 18

