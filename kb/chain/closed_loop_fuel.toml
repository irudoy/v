0xC10E, and A/F adjustment state ffff45a0, runs the 0005cbec feedback into \
STFT ffff22dc, learns it into LTFT grid ffff4b90, and multiplies precursor \
ffff18c0 by the trim sum into pulse base ffff191c. Bank 2 mirrors it through \
ffff29e4, ffff40ae, ffff22de, ffff4b10, ffff2304, and ffff191e."""
