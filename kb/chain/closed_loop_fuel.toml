title = "Closed-loop fuel trim"
summary = """
Forms bank-1 conversion word ffff29e2 from curve 0x148FA, correction map \
0xC10E, and A/F adjustment state ffff45a0, runs the 0005cbec feedback into \
STFT ffff22dc, learns it into LTFT grid ffff4b90, and multiplies precursor \
ffff18c0 by the trim sum into pulse base ffff191c. Bank 2 mirrors it through \
ffff29e4, ffff40ae, ffff22de, ffff4b10, ffff2304, and ffff191e."""
quantity = """
Bank-1 trimmed pulse base, 10 us counts: precursor ffff18c0 times the STFT, \
LTFT, and third-trim sum plus opening time"""
output = "enlightened-mastodon/ram"
specs = ["defs/JK08A.fuel.md"]
home = "7mfk"
order = 5

