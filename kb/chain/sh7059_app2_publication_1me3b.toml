title = "Accelerator pedal channel 2 (1ME3B)"
summary = """
Carries the acquired pedal ADC sample through the live diagnostic word to \
the scheduler snapshot."""
quantity = "APP2 diagnostic snapshot"
output = "app2/ram"
specs = ["defs/analysis/airflow/SH7059.input-state.md"]
home = "1me3b"
layouts = ["1me3b"]

[[step]]
from = "sh7059_adc_addr23/reg"
to = "sh7059_app2_adc_sample/ram"
effect = "scales"
sign = "positive"
via = ["sh7059_app_adc_sampler/fn"]

[[step]]
from = "sh7059_app2_adc_sample/ram"
to = "sh7059_app2_live/ram"
effect = "scales"
sign = "positive"
via = ["sh7059_app2_live_publication/fn"]

[[step]]
from = "sh7059_app2_live/ram"
to = "app2/ram"
effect = "copies"
sign = "positive"
via = ["canram_enable_commit/fn"]
