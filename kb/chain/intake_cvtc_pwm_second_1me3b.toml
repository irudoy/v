title = "Intake CVTC PWM second output (1ME3B)"
summary = """
The stock scheme uses the full duty word. The alternate scheme selects the \
byte command and uses its own scaling."""
quantity = "ATU-II PWM buffer FFFFF590"
output = "outrageous-pug/reg"
specs = ["defs/analysis/valve-timing/JK78C.cvtc.md"]
home = "1me3b"
layouts = ["1me3b"]
order = 25

[[step]]
from = "intake_cvtc_second_duty_word_1me3b/ram"
to = "outrageous-pug/reg"
effect = "drives"
sign = "none"
via = ["intake_cvtc_pwm_programmer_1me3b/fn"]

[[step]]
from = "intake_cvtc_duty_command_b2/ram"
to = "outrageous-pug/reg"
effect = "drives"
sign = "none"
via = ["intake_cvtc_pwm_programmer_1me3b/fn"]
