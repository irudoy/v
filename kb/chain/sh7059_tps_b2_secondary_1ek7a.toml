title = "Bank-2 secondary throttle position (1EK7A)"
summary = """
Processes the bank-2 secondary throttle ADC channel and copies the measured \
halfword into the diagnostic snapshot."""
quantity = "Bank-2 secondary throttle-position snapshot"
output = "sh7059_tps_b2_secondary_snapshot/ram"
specs = ["defs/analysis/airflow/SH7059.input-state.md"]
home = "1ek7a"
layouts = ["1ek7a"]

[[step]]
from = "sh7059_adc_addr18/reg"
to = "attractive-magpie/ram"
effect = "scales"
sign = "positive"
via = ["sh7059_maf_adc_capture/fn"]

[[step]]
from = "attractive-magpie/ram"
to = "secondary_tps_b2/ram"
effect = "converts"
sign = "negative"
via = ["tall-chipmunk/fn"]

[[step]]
from = "secondary_tps_b2/ram"
to = "sh7059_tps_b2_secondary_snapshot/ram"
effect = "copies"
sign = "positive"
via = ["sh7059_periodic_snapshot_1ek7a/fn"]
