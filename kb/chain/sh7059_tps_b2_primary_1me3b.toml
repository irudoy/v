title = "Bank-2 primary throttle position (1ME3B)"
summary = """
Processes the bank-2 primary throttle ADC channel and copies the measured \
halfword into the diagnostic snapshot."""
quantity = "Bank-2 primary throttle-position snapshot"
output = "sh7059_tps_b2_primary_snapshot/ram"
specs = ["defs/analysis/airflow/SH7059.input-state.md"]
home = "1me3b"
layouts = ["1me3b", "1nd"]

[[step]]
from = "sh7059_adc_addr7/reg"
to = "tps_b2/ram"
effect = "converts"
sign = "positive"
via = ["sh7059_throttle_paired_adc_measurement/fn"]

[[step]]
from = "tps_b2/ram"
to = "sh7059_tps_b2_primary_snapshot/ram"
effect = "copies"
sign = "positive"
via = ["canram_enable_commit/fn"]
