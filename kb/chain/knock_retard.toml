title = "Knock retard"
summary = """
Samples ADC2 in a 50-degree window per cylinder, compares the rise over a \
learned per-channel reference with the RPM threshold from 0x1108E, and \
integrates the event count into Q8 knock timing state ffff121a, whose degree \
byte ffff22fa enters event correction ffff11d6 of the advance sum."""
quantity = """
Knock timing-state correction, crank degrees; negative values retard the \
spark"""
output = "steady-lionfish/ram"
specs = ["defs/JK08A.knock-detection.md", "defs/JK08A.ignition-state.md"]
home = "7mfk"
order = 8

[[step]]
from = "vehement-hare/reg"
to = "knock_metric_base/ram"
effect = "detects"
sign = "none"
via = [
    "bold-hummingbird/fn",
    "meteoric-raptor/fn",
    "knock_slice_evaluator/fn",
]
note = """
Tooth 7 opens and tooth 0 closes the window; DMAC 2 reads ADDR24 (AN24/AN25 \
scan); metric = sum of the 3 largest rises over the reference."""

[[step]]
from = "vehement-hare/reg"
to = "gigantic-goshawk/ram"
effect = "learns"
sign = "none"
via = [
    "bold-hummingbird/fn",
    "meteoric-raptor/fn",
    "knock_slice_evaluator/fn",
]
note = """
Per-channel reference update ref = (224 * v + 31 * ref) >> 8, plus 1 when \
below the old value; weight ROM8[0x884B] = 0xE0."""

[[step]]
from = "gigantic-goshawk/ram"
to = "knock_metric_base/ram"
effect = "subtracts"
sign = "negative"
via = ["knock_slice_evaluator/fn"]
note = """
d[i] = v[i] - reference[c][i] with the reference at 0xFFFF2178 + 16 * (c - \
1); a higher reference lowers the metric."""

[[step]]
from = "knock_channel_primary/ram"
to = "knock_threshold_base/ram"
effect = "selects"
sign = "none"
via = ["knock_slice_threshold_lookup/fn"]
note = """
D = (ROM8[0x00008b3d]>>3)&1; c = (1-D)*uint8(ffff11de)+D*uint8(ffff2143); \
row = 0x0001108e+32*(c-1); slot = 0xffff2144+2*(c-1)"""

[[step]]
from = "authentic-wasp/ram"
to = "knock_threshold_base/ram"
effect = "indexes"
sign = "none"
via = ["knock_slice_threshold_lookup/fn"]
note = """
x = uint16(ffff11f4); i = min(15,max(0,floor(x/32)-1)); f = \
min(1,max(0,512-x))*max(0,x-32*(i+1))*2048"""

[[step]]
from = "amorphous-bird/tbl"
to = "knock_threshold_base/ram"
effect = "looks-up"
sign = "positive"
via = ["knock_slice_threshold_lookup/fn"]
note = """
D = (ROM8[0x00008b3d]>>3)&1; c = (1-D)*uint8(ffff11de)+D*uint8(ffff2143); \
row = 0x0001108e+32*(c-1); slot = 0xffff2144+2*(c-1); x = uint16(ffff11f4); \
i = min(15,max(0,floor(x/32)-1)); f = \
min(1,max(0,512-x))*max(0,x-32*(i+1))*2048; a = ROM16[row+2*i]; b = \
ROM16[row+2*i+2]; to = \
a+floor(max(0,b-a)*f/65536)-floor(max(0,a-b)*f/65536)"""

[[step]]
from = "knock_threshold_base/ram"
to = "knock_count/ram"
effect = "compares"
sign = "negative"
via = ["knock_slice_evaluator/fn"]
note = """
D = (ROM8[0x00008b3d]>>3)&1; c = (1-D)*uint8(ffff11de)+D*uint8(ffff2143); T \
= RAM16[0xffff2144+2*(c-1)]; M = RAM32[0xffff21d8+4*(c-1)]; E = \
min(1,max(0,uint32(M)-0x80000000-uint16(T))); C = uint8(ffff2142); ffff2142 \
= min(255,C+E)"""

[[step]]
from = "knock_metric_base/ram"
to = "knock_count/ram"
effect = "compares"
sign = "positive"
via = ["knock_slice_evaluator/fn"]
note = """
D = (ROM8[0x00008b3d]>>3)&1; c = (1-D)*uint8(ffff11de)+D*uint8(ffff2143); T \
= RAM16[0xffff2144+2*(c-1)]; M = RAM32[0xffff21d8+4*(c-1)]; E = \
min(1,max(0,uint32(M)-0x80000000-uint16(T))); C = uint8(ffff2142); S = \
uint8(ffff24c2); B = uint8(ffff2150); H = 1<<(c-1); ffff2142 = min(255,C+E); \
ffff24c2 = (S&191)|(E<<6); ffff2150 = (B&uint8(~H))|(E*H)"""

[[step]]
from = "knock_count/ram"
to = "curious-mustang/ram"
effect = "integrates"
sign = "negative"
via = ["knock_function/fn"]
note = """
n = uint8(x); ffff1380 = \
max(-32768,min(32767,int16(ffff1258)-ROM16[0x00008eae]*n)); ffff2142 = 0"""

[[step]]
from = "thick-dalmatian/ram"
to = "curious-mustang/ram"
effect = "adds"
sign = "positive"
via = ["knock_function/fn"]
note = """
ffff1380 = max(-32768,min(32767,int16(ffff1258)+ROM16[0x00008eaa])); \
ffff2142 = 0"""

[[step]]
from = "curious-mustang/ram"
to = "knock_timing_state/ram"
effect = "adds"
sign = "positive"
via = ["knock_function/fn"]
note = """
Direct branch adds (low7 0x9A1A - low7 0x9B1A) << 8; otherwise ffff121a \
slews from ffff1258 toward ffff1380 by ROM16[0x9078] = 0x500, clamped to <= \
0."""

[[step]]
from = "high_octane_timing_state/tbl"
to = "knock_timing_state/ram"
effect = "looks-up"
sign = "positive"
via = ["knock_function/fn"]
note = """
Direct branch (ffff2469 bit 7 clear, ffff2467 bit 6 set): the high-octane \
low 7 bits enter with weight +256."""

[[step]]
from = "high_detonation_timing_state/tbl"
to = "knock_timing_state/ram"
effect = "looks-up"
sign = "negative"
via = ["knock_function/fn"]
note = "Direct branch: the high-detonation low 7 bits enter with weight -256."

[[step]]
from = "knock_timing_state/ram"
to = "steady-lionfish/ram"
effect = "scales"
sign = "positive"
via = ["knock_function/fn"]
note = "ffff22fa = trunc0(int16(ffff121a)/256)"

[[step]]
from = "steady-lionfish/ram"
to = "eccentric-badger/ram"
effect = "adds"
sign = "positive"
via = ["event_timing_correction_builder/fn"]
note = """
With ffff24c5 bit 5 or ffff24cb bit 2 set and ROM8[0x8710] bit 5: ffff11d6 = \
min(ffff22fa - hi(ffff23c2), -ffff11fa)."""

[[step]]
from = "eccentric-badger/ram"
to = "viridian-koel/ram"
effect = "adds"
sign = "positive"
via = ["event_timing_correction_builder/fn"]
note = """
ffff12d6 = clamp_s8(ffff2378 + ffff11d6 + ffff2356 - ffff1ff6); 0004dbe8 \
carries it into advance ffff11d4."""
