title = "Knock retard"
summary = """
Consumes post-acquisition software sample words, compares their signed rise \
over a learned per-channel reference with the RPM threshold from 0x1108E, \
and integrates the event count into Q8 knock timing state ffff121a, whose \
degree byte ffff22fa enters event correction ffff11d6 of the advance sum. \
Acquisition and physical cadence have separate evidence."""
quantity = """
Knock timing-state correction, crank degrees; negative values retard the \
spark"""
output = "steady-lionfish/ram"
specs = ["defs/JK08A.knock-detection.md", "defs/JK08A.ignition-state.md"]
home = "7mfk"
order = 8

