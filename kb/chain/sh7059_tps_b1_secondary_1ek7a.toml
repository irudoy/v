title = "Bank-1 secondary throttle position (1EK7A)"
summary = """
Processes the bank-1 secondary throttle ADC channel and copies the measured \
halfword into the diagnostic snapshot."""
quantity = "Bank-1 secondary throttle-position snapshot"
output = "secondary_tps_b1/ram"
specs = ["defs/analysis/airflow/SH7059.input-state.md"]
home = "1ek7a"
layouts = ["1ek7a"]

[[step]]
from = "sh7059_adc_addr6/reg"
to = "sh7059_tps_b1_secondary_adc_sample/ram"
effect = "scales"
sign = "positive"
via = ["sh7059_maf_adc_capture/fn"]

[[step]]
from = "sh7059_tps_b1_secondary_adc_sample/ram"
to = "sh7059_tps_b1_secondary_live/ram"
effect = "converts"
sign = "negative"
via = ["throttle_bank2_sensor_conditioner/fn"]

[[step]]
from = "sh7059_tps_b1_secondary_live/ram"
to = "secondary_tps_b1/ram"
effect = "copies"
sign = "positive"
via = ["sh7059_periodic_snapshot_1ek7a/fn"]
