title = "Ignition secondary compare scheduling"
summary = """
The event task combines the APC byte and interval offset. The secondary \
scheduler programs immediate comparisons or alternating tooth slots for \
ICI0A. GR11B and the high-byte POPCR mask select the falling PULS action."""
quantity = "Secondary APC timing"
output = "steadfast-yak/reg"
specs = ["defs/analysis/runtime/SH7059.actuation.md"]
home = "1me3b"
layouts = ["1me3b", "1ek7a"]

