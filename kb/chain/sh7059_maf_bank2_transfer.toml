title = "Bank-2 MAF transfer"
summary = """
Carries the bank-2 ADC sample through voltage publication and conditioning \
to the flow curve."""
quantity = "Bank-2 MAF curve output word"
output = "sh7059_maf_bank2_transfer_output/ram"
specs = ["defs/analysis/airflow/SH7059.input-state.md"]
home = "1me3b"
layouts = ["1me3b", "1ek7a"]

[[step]]
from = "sh7059_adc_addr3/reg"
to = "sh7059_maf_bank2_adc_sample/ram"
effect = "scales"
sign = "none"
via = ["sh7059_maf_adc_capture/fn"]

[[step]]
from = "sh7059_maf_bank2_adc_sample/ram"
to = "maf_b2/ram"
effect = "scales"
sign = "none"
via = ["sh7059_airflow_publication/fn"]

[[step]]
from = "maf_b2/ram"
to = "sh7059_maf_bank2_transfer_input/ram"
effect = "converts"
sign = "none"
via = ["sh7059_dual_bank_maf_transfer/fn"]

[[step]]
from = "sh7059_maf_bank2_transfer_input/ram"
to = "sh7059_maf_bank2_transfer_output/ram"
effect = "looks-up"
sign = "none"
via = ["sh7059_dual_bank_maf_transfer/fn"]
