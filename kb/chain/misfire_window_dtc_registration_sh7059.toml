title = "Misfire window decisions and DTC registration"
summary = """
Connects the verified input refresh and pending event through window \
counting and report selection to the runtime DTC activity store."""
quantity = "Runtime DTC report-activity byte"
output = "dtc_report_activity_sh7059/ram"
specs = [
    "defs/analysis/diagnostics/SH7059.misfire.md",
    "defs/analysis/diagnostics/SH7059.native-monitors.md",
]
home = "1me3b"
layouts = ["1me3b", "1ek7a"]

[[step]]
from = "pastel-yak/fn"
to = "gorgeous-sawfish/ram"
effect = "stores"
sign = "none"
specs = ["defs/analysis/diagnostics/SH7059.misfire.md"]

[[step]]
from = "gorgeous-sawfish/ram"
to = "misfire_window_count_producer_sh7059/fn"
