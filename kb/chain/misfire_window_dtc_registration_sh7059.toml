sign = "none"
specs = ["defs/analysis/diagnostics/SH7059.misfire.md"]

[[step]]
from = "sh7059_periodic_diagnostic_task/fn"
to = "misfire_periodic_decision_sh7059/fn"
effect = "schedules"
sign = "none"

[[step]]
from = "misfire_interval_refresh_sh7059/fn"
to = "misfire_timing_input_words_sh7059/ram"
effect = "stores"
sign = "none"

[[step]]
from = "misfire_pending_event_sh7059/ram"
to = "misfire_window_count_producer_sh7059/fn"
effect = "gates"
sign = "none"

[[step]]
from = "misfire_timing_input_words_sh7059/ram"
