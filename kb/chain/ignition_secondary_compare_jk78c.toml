title = "JK78C ignition secondary compare"
summary = """
The launcher runs the secondary builder after APC publication. The secondary \
scheduler combines the APC byte and offset, stages alternating tooth slots, \
and also programs explicit fallback compares. ICI0A writes GR11B when either \
slot expires."""
