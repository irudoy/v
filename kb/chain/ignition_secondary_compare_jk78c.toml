title = "JK78C ignition secondary compare"
summary = """
The secondary scheduler and ICI0A program GR11B. IMI11B acknowledges the \
match, clears the high POPCR action, and can rearm it on the fallback path. \
It assigns a dwell timeout to GR5A or GR5B. The corresponding timeout \
interrupt can force the pending spark through GR11A and the low POPCR \
action."""
quantity = "Secondary APC timing"
output = "steadfast-yak/reg"
specs = ["defs/analysis/ignition/SH7058.ignition-compare.md"]
home = "jk78c"
layouts = ["jk78c"]

