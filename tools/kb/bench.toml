# Benchmark questions, required content, budgets and comparison baselines.

[[question]]
id = 1
question = "What is at an address of another layout"
command = "kb at jk00d:ffff1034"
budget = 600
expect = [
    '^normalized_load/ram/jk00d-ffff1034\s+ram 8-bit\s+code$',
    '^  scale\s+x\*100/128$',
    'normalized_load_raw/field',
]
baseline = [
    { run = ["rg", "-n", "-i", "--no-ignore", "ffff1034", "defs", "patches", "tools/ghidra/symbols", "l0/jk00d"] },
]

[[question]]
id = 2
question = "Where a meaning is on every layout"
command = "kb where normalized_load/ram"
budget = 400
expect = [
    '^7mfk\s+ffff102c',
    '^jk00d\s+ffff1034',
    '^jk78c\s+ffff1032',
    '^1nd\s+fffe8034\s+code\s+l0\s',
    '^1me3b\s+fffe8034\s+code\s+l0\s',
]
baseline = [
    { run = ["rg", "-n", "-i", "--no-ignore", "-e", "normalized_load_raw", "-e", "ffff102c", "patches", "defs"] },
]

[[question]]
id = 3
question = "What depends on a table"
command = "kb impact 7mfk:0000a4aa"
budget = 1500
expect = [
    '^impact of .*7mfk-0000a4aa:',
    '7mfk-ffff1636 computed from .*7mfk-0000a4aa',
    '7mfk-ffff1a7d lookup of .*7mfk-0000a4aa',
    '^  .*7mfk-0004d2a6 reads .*7mfk-0000a4aa',
]
baseline = [
    { run = ["rg", "-n", "-i", "--no-ignore", "0000a4aa", "defs", "patches"] },
]

[[question]]
id = 4
question = "How coolant temperature reaches the intake-cam target"
command = "kb path 7mfk:ffff1079 7mfk:ffff2326"
budget = 1500
expect = [
    '^path coolant/ram/7mfk-ffff1079 -> intake_cvtc_target/ram/7mfk-ffff2326: .*dataflow',
    '^path 1$',
    'intake_cvtc_target/ram/7mfk-ffff2326 computed from',
    '\(unverified\)',
]
baseline = [
    { run = ["rg", "-n", "-i", "--no-ignore", "-e", "ffff1079", "-e", "ffff2326", "defs/registries/JK08A.vars.csv", "defs/registries/JK08A.funcs.csv", "defs/registries/JK08A.findings.csv", "defs/registries/JK08A.architecture.toml"] },
]

[[question]]
id = 5
question = "Which telemetry sources lack a symbol on a layout"
command = "kb gaps --feature can_telemetry --layout 1me3b"
budget = 1000
expect = [
    '^can_telemetry on 1me3b: [1-9][0-9]* required meanings unavailable$',
    '^absent: [1-9][0-9]*$',
    'knock_branch_state_raw/field\s+masked-inchworm/ram\s+l0\s+1me3b:00071d64',
    'knock_timing_state_raw/field\s+knock_timing_state/ram\s+l0\s+1me3b:00071d64',
]
baseline = [
    { run = ["rg", "-n", "--no-ignore", "^telemetry,.*,unsupported,", "patches/1me3b-runtime-correspondence.csv"] },
]

[[question]]
id = 6
question = "Candidates for a producer on another family"
command = "kb suggest 7mfk:0004aad0 --layout jk78c"
budget = 1500
expect = [
    '^7mfk:0004aad0 bounded_mode_state_source/fn: candidates on jk78c$',
    '^\[candidate\] function-match: [1-9][0-9]* candidates',
    '^\[candidate\] masked-match: [1-9][0-9]* candidates',
    '^  jk78c:000643ac votes [1-9][0-9]*',
    '^Suggestions do not bind symbols or change knowledge levels\.$',
]
baseline = [
    { run = ["rg", "-n", "-i", "--no-ignore", "0004aad0", "defs", "patches"] },
]

[[question]]
id = 7
question = "Find entities by words"
command = "kb find knock threshold"
budget = 800
expect = ['knock_threshold_base/ram', 'knock_slice_threshold_lookup/fn', 'knock_margin/signal']
baseline = [
    { run = ["rg", "-n", "-i", "--no-ignore", "knock[^,]*threshold|threshold[^,]*knock", "defs", "patches", "tools/ghidra/symbols"] },
]

[[question]]
id = 8
question = "The code of a function"
command = "kb code jk78c:000564a4"
budget = 4000
# The decompiler reads the pinned Ghidra installation and the JK78C project or
# its verified decompilation cache, which the Verify workflow does not provide.
needs = ["ghidra"]
expect = [
    '^jk78c:000564a4\s+fn\s+\[l0\]',
    'void FUN_000564a4\(',
    'FUN_00056baa\(',
    'DAT_0005680a',
]
baseline = [
    { run = ["tools/ghidra/decompile.sh", "-r", "JK78C", "-l", "000564a4"], read = true },
]

[[question]]
id = 9
question = "The history of a symbol through its corrections"
command = "kb log apc_output"
budget = 800
expect = [
    '^apc_output/ram$',
    'former\s+meaning name apc_command',
    '904ce7e.*jk00d.*ffff206c -> ffff11f5',
]
baseline = [
    { run = ["git", "log", "--oneline", "-G", "apc_output", "--", "patches", "defs"] },
]

[[question]]
id = 10
question = "The state of the knowledge base"
command = "kb brief"
# The answer lists every fact owner of the registry table, which grows with
# the registries.
budget = 2500
expect = [
    '^graph .*fingerprint .*commit',
    '^fact owners$',
    '^open gaps: [1-9][0-9]* required meanings unavailable',
    '^  by feature: .*can_telemetry [1-9][0-9]*.*definitions [1-9][0-9]*',
    '^  by state: .*absent [1-9][0-9]*.*unsupported [1-9][0-9]*',
    '^priority gaps: affected features, fields, then link degree$',
    '^stale searches: [0-9]+; pending candidates: [0-9]+$',
]
baseline = [
    { run = ["cat", "AGENTS.md", "tools/kb/README.md"] },
]

[[question]]
id = 11
question = "Why telemetry fields are unavailable on a layout"
command = "kb gaps --feature can_telemetry --layout jk00c"
budget = 1000
expect = [
    '^can_telemetry on jk00c: [1-9][0-9]* required meanings unavailable$',
    '^unsupported: [1-9][0-9]*$',
    'ltft_publication_neutral_control_raw/field\s+ltft_publication_neutral_control/ram\s+Bit 1 of FFFF4353 carries the neutralization pulse',
]
baseline = [
    { run = ["rg", "-n", "--no-ignore", "telemetry_unavailable|ltft_publication_neutral_control", "patches/rom-address-profiles.toml"] },
    { run = ["rg", "-n", "--no-ignore", "-A", "4", "target.unsupported", "kb/feature/can_telemetry.toml"] },
]

[[question]]
id = 12
question = "The block and chain steps of a function"
command = "kb show 7mfk:0003deec"
budget = 1200
expect = [
    '7mfk-0003deec',
    '^  block\s+engine_speed/block\s+stage estimation/stage$',
    '^  step\s+engine_speed/chain #4 .*ffff114a = floor\(0xA2C2\s*/\s*ffff22bc\)',
]
baseline = [
    { run = ["rg", "-n", "-i", "--no-ignore", "0003deec", "defs/registries/JK08A.funcs.csv"] },
    { run = ["rg", "-n", "-i", "--no-ignore", "-B", "30", "-A", "8", "0003deec", "defs/registries/JK08A.architecture.toml"] },
]

[[question]]
id = 13
question = "The reviewed function facts of a JK08A ledger address"
command = "kb show 7mfk:0003c3ac"
budget = 2400
expect = [
    '^dual_bank_maf_diagnostic_coordinator/fn/7mfk-0003c3ac',
    'MASS AIRFLOW word ffff3852=min\(65535,floor\(ROM8\[0x83ec\]\*ffff105c/256\)\)',
    '^  writes\s+.*maf_total/ram/7mfk-ffff3852',
    'rom-bytes.*value ffff3852.*at 7mfk:000228c0',
    'Engineering conversions require hardware validation\.',
]
baseline = [
    { run = ["rg", "-n", "-i", "--no-ignore", "0003c3ac", "defs/registries/JK08A.funcs.csv", "defs/registries/JK08A.vars.csv", "defs/registries/JK08A.findings.csv", "defs/registries/JK08A.axes.csv", "defs/registries/JK08A.dtc.csv", "defs/registries/JK08A.diagnostic-bindings.csv", "tools/ghidra/symbols/7mfk.csv"] },
]
