[project]
name = "kb"
version = "0.1.0"
description = "Knowledge model and entry point of the VQ HR ECU repository"
requires-python = ">=3.11,<3.12"
dependencies = [
    "coolname>=2.2,<3",
    "neo4j>=5.28,<7",
    "rapidfuzz>=3.9,<4",
]

[project.scripts]
kb = "kb.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
