# Machine-owned KB command and ownership contracts.
version = 1

[table."### 12.1 Invocation"]
rows = [
  ["`--budget <tokens>`", "Output budget; the default per command is in `tools/kb/config.toml`"],
  ["`--full`", "No budget"],
  ["`--json`", "Structured output for programs, without a budget"],
  ["`--no-sync`", "Fail instead of syncing a stale graph"],
]

[table."### 12.2 Read commands"]
rows = [
  ["`kb brief [<read options>]`", "Graph state, layouts with symbol and status counts, current fact owners, required binding gaps with the same totals as `kb gaps` by feature, layout, and state and a sample ranked by affected project features, fields, then link degree, stale searches, pending candidates, and the table of questions and commands"],
  ["`kb show <ref> [--layout <l>] [<read options>]`", "The entity: identity and shape, symbols per layout with the images and overrides each states, statuses, links in both directions grouped by type, evidence, analogs, and citations; the block of a meaning with its stage and the chain steps it takes part in; the feature roles that a symbol of the meaning fills, and those of its name that a symbol of another meaning fills; for a designed entity its keys and relationships, for a chain its steps in order, and for a signal the DIDs that return an observed meaning"],
  ["`kb at <location> [--layout <l>] [--literal] [<read options>]`", "The symbol at a location `<layout>:<address>`, or at an address on `--layout`, or else the feature allocations, function, or table that contain it, and the L0 facts at that address; `--literal` separately lists exact exported 32-bit ROM load values with their function, instruction, pool, width, raw bytes, and reference type, without classifying their use; zero matches do not establish absence of runtime access"],
  ["`kb where <ref> [<read options>]`", "The symbol or status of a meaning on every layout"],
  ["`kb impact <ref> [--layout <l>] [--expand <ref>]... [<read options>]`", "Every entity that depends on the reference through links, chains, fields, and features, with the insertion points per layout of a change to it; `--expand` expands a hub"],
  ["`kb path <a> <b> [--layout <l>] [--expand <ref>]... [--limit <n>] [<read options>]`", "The shortest typed paths between two entities, at most `--limit` of them; `--expand` expands a hub"],
  ["`kb gaps [--feature <f>] [--layout <l>] [<read options>]`", "Required meanings without a symbol, grouped by status"],
  ["`kb gaps --catalog [<read options>]`", "The features of the parity catalog with their acceptance criteria and their status per layout"],
  ["`kb suggest <ref> --layout <l> [<read options>]`", "Candidate symbols of a meaning on a layout, one line per channel with the evidence kind it would record"],
  ["`kb suggest --blocks --layout <l> [<read options>]`", "Block candidates for the unplaced functions of a layout ([Graph algorithms](#16-graph-algorithms))"],
  ["`kb find <text>... [--limit <n>] [<read options>]`", "Meanings and designed entities ranked by name or slug, former name, title, and summary, at most `--limit` of them"],
  ["`kb code <ref> [--layout <l>] [--listing] [--force] [--budget <tokens>] [--full] [--no-sync]`", "The decompilation of a function through `tools/ghidra/decompile.sh` and its cache, with `--listing` its listing, and with `--force` from a new run of Ghidra: the function whose body holds a location `<layout>:<address>`, the function symbol that the reference names, or the symbol of a meaning on `--layout` or else on its home layout"],
  ["`kb log <ref> [<read options>]`", "Full former references of the entity's symbol entries and recorded profile address corrections, with their Git commits"],
  ["`kb raw <ref> [<read options>]`", "The records of the entity: its canonical file under `kb/`, for a symbol the file of its meaning, and applicable registry rows, `kb/names.csv` included"],
  ["`kb cypher <query> [--param <name>=<value>]... [<read options>]`", "A read-only Cypher query over the working tree's instance after the fingerprint check"],
  ["`kb audit [--section <s>]...`", "Disagreements of one fact between registries, the names that lose to a name of higher precedence, and legacy evidence without the keys of its kind under the registry that states it; the `levels` check ([Levels](#71-levels)); `chain-notes` outside the configured arithmetic grammar; `research` lists source-bound unresolved semantic statements separately. `--section` restricts the audit to the named sections, which it alone computes"],
  ["`kb bench [--only <id>]...`", "The benchmark questions against their required content, budgets, and baselines ([Acceptance questions](#18-acceptance-questions))"],
  ["`kb check [--changed] [--only <check>]...`", "The gates of [Checks](#13-checks), or those that `--only` names; `--changed` runs those whose inputs differ from those of their last pass"],
]

[table."### 12.3 Write commands"]
rows = [
  ["`kb guard on|off|status --session <id> [--json]`", "Saves or reads the project-local maintenance override of one root session; `status` writes nothing and reports `null` without a valid override"],
  ["`kb new <kind> <layout>:<address> --evidence <item>... [--name <semantic-name>] [--level <level>] [--note <text>] [--dry-run]`", "A meaning with the symbol at a location that holds none and the evidence of its identity, named or with a generated name"],
  ["`kb new <kind> <slug> [--dry-run]`", "A designed entity of a kind that the store holds"],
  ["`kb set <ref> [--layout <l>] <key>=<value>... [--dry-run]`", "Keys of an entity, a symbol, or a feature target"],
  ["`kb bind <meaning> <layout>:<address> [--evidence <item>]... [--from <l>] [--level <level>] [--note <text>] [--dry-run]`", "A symbol of an existing meaning on another layout, with evidence"],
  ["`kb absent <meaning> --layout <l> --evidence <item>... [--note <text>] [--dry-run]`", "Status `absent` with the evidence that removes the mechanism"],
  ["`kb unresolved <meaning> --layout <l> [--from <l>] [--method <kind> --target <ref> --count <n>] [--candidate <l>:<address>] [--note <text>] [--dry-run]`", "Status `unresolved` with the method and target of the search, and its one unbindable candidate"],
  ["`kb link <from> <type> <to> [<key>=<value>]... [--evidence <item>]... [--dry-run]`", "A typed link with its keys and evidence"],
  ["`kb unlink <from> <type> <to> [<key>=<value>]... [--dry-run]`", "Removes a typed link of the file of a meaning"],
  ["`kb set-link <from> <type> <to> <key>=<value>... [--slot <slot>] [--offset <offset>] [--dry-run]`", "Replaces mutable properties of one existing owned native link"],
  ["`kb select <meaning> <registry> <order> <key>=<value>... [--dry-run]`", "Selects one existing native relation and claim in an existing owned ledger row"],
  ["`kb merge <meaning> <other> [--evidence <item>]... [--from <l>] [--dry-run]`", "Joins another meaning, or another file of one meaning, into a meaning ([Renames, merges, and moves](#55-renames-merges-and-moves))"],
  ["`kb rename <meaning> <semantic-name> [--dry-run]`", "Names a meaning ([Renames, merges, and moves](#55-renames-merges-and-moves))"],
  ["`kb move <symbol> <layout>:<address> [--evidence <item>]... [--from <l>] [--level <level>] [--note <text>] [--dry-run]`", "Corrects the address of a symbol on its layout ([Renames, merges, and moves](#55-renames-merges-and-moves))"],
  ["`kb move <symbol> <meaning> [--evidence <item>]... [--from <l>] [--level <level>] [--note <text>] [--dry-run]`", "Corrects a wrong homology ([Renames, merges, and moves](#55-renames-merges-and-moves))"],
  ["`kb move <symbol> <to> --legacy-reservation [--dry-run]`", "Preserves one generated-name reservation after an accepted registered legacy/L0 entry repair, without entity adoption"],
  ["`kb retire <ref> [--withdraw-ledger <registry>:<order>]... [--dry-run]`", "Retires a meaning or designed entity; an explicit complete selector list can withdraw ledger projections of vanished L0 function entries, while the inactive owner and its names remain reserved"],
  ["`kb rebase-reviews --layout <l> --from-l0 <digest> [--reasons-reviewed] [--dry-run]`", "Rebinds exact unresolved access and width reviews to a validated export; custom reasons require explicit review, and unmatched or new differences remain unreviewed"],
  ["`kb family new <family> --image <image> --layout <layout> --census <path> --mcu <mcu> --flash-size <size> --software-id <id>... [--kind <kind>] [--calibration-region <range>] [--exact-range <range>]... [--dry-run]`", "Starts a family from a stock-bound census, explicit image identity and exported L0"],
  ["`kb family add <family> --image <image> --census <path> [--layout <layout>] [--dry-run]`", "Adds a stock-bound image; exact-code inheritance retains the layout, and other families require a new layout"],
  ["`kb apply <batch> [--dry-run]`", "A batch of the operations above as one change"],
  ["`kb fmt [<path>...]`", "Rewrites entity files in canonical form after a merge"],
  ["`kb project [--check] [<path>...]`", "Renders under the lock the projections of `kb` functions, or those of the paths; `--check` writes nothing and exits with 1 when a projection differs from its rendering ([Projections](#14-projections))"],
  ["`kb sync [--full]`", "Compiles and loads the graph"],
  ["`kb instance up|down|status|prune`", "[Instances](#11-instances)"],
  ["`kb mcp`", "Serves the read commands and `kb apply` over MCP ([MCP](#126-mcp))"],
]

[table."### 12.5 Exit codes"]
rows = [
  ["0", "Success"],
  ["1", "A check failed"],
  ["2", "Usage error"],
  ["3", "Write refused"],
  ["4", "Ambiguous reference"],
  ["5", "Reference not found"],
  ["6", "Graph unavailable or stale"],
  ["7", "Lock timeout"],
]

