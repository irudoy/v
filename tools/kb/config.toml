[l0]
scripts = [
    "ExportFunctionSignatures.java",
    "ExportFunctionTokens.java",
    "ExportGraph.java",
    "ExportXrefs.java",
    "ProgramSha256.java",
    "ResolveAccessors.java",
]

[l0.census.1me3b]
interp = "defs/1ME3B.interp.csv"

[l0.census.1nd]
interp = "defs/1ND0A.interp.csv"

[l0.census.7mfk]
interp = "defs/JK08A.interp.csv"
copy_helpers = ["00022558"]

[l0.census.jk00c]
interp = "defs/JK00D.interp.csv"
copy_helpers = ["000225e4"]

[l0.census.jk00d]
interp = "defs/JK00D.interp.csv"
copy_helpers = ["000225e4"]

[l0.census.jk78c]
interp = "defs/JK78C.interp.csv"

# Memgraph instances of this repository that run at once, the main instance
# included. The limit follows from the resident memory of a graph with the L0
# of every layout and from its peak during a load, against the memory of the
# container host beside the main graph and one load at a time in each instance.
[instances]
max_running = 3
# Loopback host ports of the linked working trees' instances, start inclusive
# and end exclusive, and the idle time after which `kb instance prune` stops
# an instance.
ports = [17687, 17787]
idle_days = 7

# Seconds a sync or a write waits for `.kb/lock` before it exits with code 7.
[lock]
timeout = 300

# The access guard (tools/kb/SPEC.md, section 15): the trees whose knowledge
# `kb` answers, and the git subcommands that may name them, so that diffs of
# the trees stay reviewable. `tools/kb/hook.py` reads both.
[guard]
trees = ["kb/", "l0/"]
git = ["add", "checkout", "commit", "diff", "log", "merge", "mv", "rebase", "restore", "rm",
       "show --stat", "stash", "status", "switch"]

# Default output budgets of the read commands in tokens (UTF-8 bytes / 3).
[budget]
at = 600
brief = 2000
code = 4000
cypher = 2000
find = 800
impact = 1500
log = 800
path = 1500
raw = 3000
show = 1500
where = 400

# Address spaces of each MCU from its hardware manual: on-chip flash, on-chip
# RAM, and the on-chip peripheral registers with the HCAN mailboxes.
[mcu.SH7058]
rom = ["00000000", "00100000"]
ram = ["ffff0000", "ffffc000"]
io = ["ffffc000", "100000000"]

[mcu.SH7059]
rom = ["00000000", "00180000"]
ram = ["fffe8000", "ffffc000"]
io = ["ffffc000", "100000000"]

# Legacy evidence tokens `spec:<id>` whose id starts with one of these
# prefixes cite a vehicle or MCU manual of the source packs.
[tokens]
manual = ["esm-", "sh7058-hw-", "sh7058-hardware-manual", "SH7058S-HW-"]

# Evidence kinds of the function kinds that the definition address
# correspondences name (tools/kb/SPEC.md, section 20.3): exact bytes and exact
# storage compare bytes; shape, sequence, and reference hashes and mutual-best
# accessor pairs match functions; call orders, call signatures, operands,
# branch orders, and the homologous consumers that preserve an operand match
# call ordinals; target literals and instruction-aligned loads match pool
# literals; shared contracts match interpolation contracts.
[function_kinds]
coordinator-call-order = "call-ordinal"
exact-bytes = "byte-identical"
exact-normalized-function-shape = "function-match"
exact-storage = "byte-identical"
homologous-accessor-operand = "call-ordinal"
homologous-base-fuel-consumer = "call-ordinal"
homologous-coordinator = "call-ordinal"
homologous-request-limiter = "call-ordinal"
homologous-state-machine = "call-ordinal"
homologous-torque-consumer = "call-ordinal"
instruction-aligned-homolog = "literal-pool"
mutual-best-accessor-pair = "function-match"
normalized-function-reference = "function-match"
normalized-function-sequence = "function-match"
normalized-shape = "function-match"
ordered-exact-map-storage-anchor = "byte-identical"
ordered-normalized-shape = "function-match"
ordered-structural-accessor = "call-ordinal"
ordered-unique-interpolation-call-signature = "call-ordinal"
ordered-unique-mapped-neighbor-fingerprint = "call-ordinal"
paired-consumer = "call-ordinal"
paired-threshold-loads = "call-ordinal"
selector-branch-order = "call-ordinal"
shared-explicit-contract = "interp-contract"
shared-implicit-contract = "interp-contract"
shared-scalar-operand-set = "call-ordinal"
target-literal = "literal-pool"
unique-same-contract-accessor = "interp-contract"

[vocab]
quantity = ["angle", "count", "load", "percent", "pressure", "raw", "rpm", "speed",
            "temp", "time", "voltage"]
# Engineering units that the scale of a telemetry field may state after its
# arithmetic in `raw`.
unit = ["cm2", "deg", "degBTDC", "degC", "degCA", "g/s", "ms", "Nm", "percent", "V"]

[names]
attempts = 1000
