[l0]
scripts = [
    "ExportFunctionSignatures.java",
    "ExportFunctionTokens.java",
    "ExportGraph.java",
    "ExportXrefs.java",
    "ProgramSha256.java",
    "ResolveAccessors.java",
]

[l0.census.1ek7a]
interp = "defs/registries/1EK7A.interp.csv"

[l0.census.1me3b]
interp = "defs/registries/1ME3B.interp.csv"

[l0.census.1nd]
interp = "defs/registries/1ND0A.interp.csv"

[l0.census.7mfk]
interp = "defs/registries/JK08A.interp.csv"
copy_helpers = ["00022558"]

[l0.census.jk00c]
interp = "defs/registries/JK00D.interp.csv"
copy_helpers = ["000225e4"]

[l0.census.jk00d]
interp = "defs/registries/JK00D.interp.csv"
copy_helpers = ["000225e4"]

[l0.census.jk78c]
interp = "defs/registries/JK78C.interp.csv"

# Memgraph instances of this repository that run at once, the main instance
# included. The limit follows from the resident memory of a graph with the L0
# of every layout and from its peak during a load, against the memory of the
# container host beside the main graph and one load at a time in each instance.
[instances]
max_running = 3
# Loopback host ports of the linked working trees' instances, start inclusive
# and end exclusive, and the idle time after which `kb instance prune` stops
# an instance.
ports = [17687, 17787]
idle_days = 7

# Seconds a command waits for `.kb/lock` without new graph-sync progress
# before it exits with code 7; ordinary holders retain the total wait limit.
[lock]
timeout = 300

# The access guard (tools/kb/SPEC.md, section 15): the trees whose knowledge
# `kb` answers, and the git subcommands that may name them, so that diffs of
# the trees stay reviewable. `tools/kb/hook.py` reads both.
[guard]
trees = ["kb/", "l0/"]
git = ["add", "checkout", "commit", "diff", "log", "merge", "mv", "rebase", "restore", "rm",
       "show", "stash", "status", "switch"]

# Default output budgets of the read commands in tokens (UTF-8 bytes / 3).
[budget]
at = 600
brief = 2000
code = 4000
cypher = 2000
find = 800
gaps = 1000
impact = 1500
log = 800
path = 1500
raw = 3000
show = 1500
suggest = 1500
where = 400

# Address spaces of each MCU from its hardware manual: on-chip flash, on-chip
# RAM, and the on-chip peripheral registers with the HCAN mailboxes.
[mcu.SH7058]
rom = ["00000000", "00100000"]
ram = ["ffff0000", "ffffc000"]
io = ["ffffc000", "100000000"]

[mcu.SH7059]
rom = ["00000000", "00180000"]
ram = ["fffe8000", "ffffc000"]
io = ["ffffc000", "100000000"]

# Legacy evidence tokens `spec:<id>` whose id starts with one of these
# prefixes cite a vehicle or MCU manual of the source packs.
[tokens]
manual = ["esm-", "sh7058-hw-", "sh7058-hardware-manual", "SH7058S-HW-"]

# Keys of `manual` evidence that start with one of these prefixes cite the
# SH7059/SH7058S hardware manual (tools/kb/SPEC.md, section 7.6). `vectors` is
# the key of its exception vector table, which places each vector at its
# offset from VBR; a slot of the table on every layout is one vector.
[manual]
mcu = ["sh7058-hw-", "sh7058-hardware-manual", "SH7058S-HW-"]
vectors = "SH7058S-HW-7.2.6"

[vocab]
quantity = ["angle", "count", "load", "percent", "pressure", "raw", "rpm", "speed",
            "temp", "time", "voltage"]
# Engineering units that the scale of a telemetry field may state after its
# arithmetic in `raw`.
unit = ["cm2", "deg", "degBTDC", "degC", "degCA", "g/s", "ms", "Nm", "percent", "ratio", "V"]

[names]
attempts = 1000

# Homology matchers (tools/kb/SPEC.md, section 7.6): the least number of equal
# masked instruction words of a region that matches, and the most bytes below
# a symbol that the placement of an `indirect` base item searches for its base.
[match]
words = 12
base = 1024

# Contradictions of the writer gate that await review, each the symbol and the
# store site on its layout. The gate fails on every other contradiction and on
# an entry that no longer reproduces.
[writers]
review = [
    # 1me3b:0002e8c2 writes coolant ADC (mux phase 5, cmp/eq #5 at 0002e8ae,
    # mov.w r0,@(0x30,gbr) c118). Its masked window aligns with 1nd:0002b90e
    # (mux phase 2, cmp/eq #2, fffe8d7e) because the ADC shift sequence repeats
    # per mux phase; the actual 1nd phase-5 store is at 1nd:0002bad4 (c118 -> fffe8d74).
    "sh7059_coolant_adc_sample/ram/1nd 1me3b:0002e8c2",
]

# Arithmetic notation of chain notes. Binary groups run from the lowest
# precedence to the highest. A function declares its exact operand count.
# Other variable names require an earlier assignment in the same note.
[chains.arithmetic]
address = '[0-9a-f]{8}'
number = '0[xX][0-9a-fA-F]+|(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)'
name = '[A-Za-z_][A-Za-z0-9_]*'
variables = ['from', 'to', 'x', 'prev']
readers = ['ROM8', 'ROM16', 'ROM32', 'RAM8', 'RAM16', 'RAM32']
unary = ['+', '-', '~']
binary = [['|'], ['^'], ['&'], ['<<', '>>'], ['+', '-'], ['*', '/', '%']]

[chains.arithmetic.functions]
floor = 1
trunc0 = 1
abs = 1
min = 2
max = 2
clamp = 3
median = 3
uint8 = 1
uint16 = 1
uint32 = 1
int8 = 1
int16 = 1
int32 = 1
sat_u8 = 1
sat_u16 = 1
sat_s8 = 1
sat_s16 = 1
lookup = 2
interpolate = 3
