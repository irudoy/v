# Projections: the generated files of the repository (tools/kb/SPEC.md,
# section 14).
#
# `path` is a repository path, a pattern whose `*`, `?`, and `[...]` match
# within one path segment and whose `{a,b}` lists alternatives, or
# `<file>#<name>` for the section between `<!-- <name>:begin -->` and
# `<!-- <name>:end -->`. `generator` is a function `kb.<module>:<function>`
# that `uv run kb project` renders, or the command of the current generator,
# whose gate compares its files. `stage` is the transition stage from which a
# projection applies; before it the registry owns the file. `inputs` are the
# paths whose change requires regeneration, `consumers` the programs that
# read the files, and `read` states whether agents read the file (`open`) or
# ask `kb` (`guarded`). `tools/kb/hook.py` refuses edits of every applying
# projection and reads of the guarded ones; the `projections` check requires
# each entry to hold and each file whose first lines declare it generated to
# be registered.

[[projection]]
path = "tools/sh-elf-run/{harness-closed-loop-coolant-paths.c,harness-maf-record.c,harness-rpm-remaining-inhibit-paths.c,harness-exhaust-cvtc-paths.c,harness-register-only-helper-paths.c,harness-scalar-ram-leaf-paths.c}"
generator = "uv run python tools/sh-elf-run/generate_proof_adapters.py --write"
check = ["uv", "run", "python", "tools/sh-elf-run/generate_proof_adapters.py", "--check"]
inputs = [
    "defs/JK08A.closed-loop-coolant-accesses.toml", "defs/JK08A.maf-record-readers.toml",
    "defs/JK08A.rpm-remaining-inhibit.toml", "defs/JK08A.exhaust-cvtc-accesses.toml",
    "defs/JK08A.register-only-helpers.toml",
    "defs/JK08A.scalar-ram-leaves.toml",
    "tools/kb/src/kb/proof_adapter.py", "tools/sh-elf-run/generate_proof_adapters.py",
]
consumers = ["tools/sh-elf-run/closed_loop_coolant_capture.py", "tools/sh-elf-run/maf_record_capture.py", "tools/sh-elf-run/rpm_remaining_inhibit_capture.py", "tools/sh-elf-run/exhaust_cvtc_capture.py", "tools/sh-elf-run/register_only_helpers_capture.py", "tools/sh-elf-run/scalar_ram_leaf_capture.py"]
read = "open"

[[projection]]
path = "tools/kb/tests/{test_coolant_adapter_generated.py,test_maf_record_adapter_generated.py,test_rpm_remaining_adapter_generated.py,test_exhaust_cvtc_adapter_generated.py,test_register_only_helpers_adapter_generated.py,test_scalar_ram_leaf_adapter_generated.py}"
generator = "uv run python tools/sh-elf-run/generate_proof_adapters.py --write"
