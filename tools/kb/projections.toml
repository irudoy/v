# Projections: the generated files of the repository (tools/kb/SPEC.md,
# section 14).
#
# `path` is a repository path, a pattern whose `*`, `?`, and `[...]` match
# within one path segment and whose `{a,b}` lists alternatives, or
# `<file>#<name>` for the section between `<!-- <name>:begin -->` and
# `<!-- <name>:end -->`. `generator` is a function `kb.<module>:<function>`
# that `uv run kb project` renders, or the command of the current generator,
# whose gate compares its files. `stage` is the transition stage from which a
# projection applies; before it the registry owns the file. `inputs` are the
# paths whose change requires regeneration, `consumers` the programs that
# read the files, and `read` states whether agents read the file (`open`) or
# ask `kb` (`guarded`). `tools/kb/hook.py` refuses edits of every applying
# projection and reads of the guarded ones; the `projections` check requires
# each entry to hold and each file whose first lines declare it generated to
# be registered.

[[projection]]
path = "AGENTS.md#kb"
generator = "kb.project:agents"
stage = 2
inputs = ["tools/kb/SPEC.md", "tools/kb/bench.toml"]
consumers = ["Claude Code", "Codex"]
read = "open"

[[projection]]
path = "defs/*.interp.csv"
generator = "kb.adapters.interp:registries"
stage = 3
inputs = ["kb/fn/", "tools/kb/src/kb/adapters/interp.py"]
consumers = [
    "tools/census_homology.py",
    "tools/rom_correspondence.py",
    "tools/rom_sources.py",
    "tools/memgraph/load_maps.py",
    "tools/romviz/model.py",
    "tools/kb/src/kb/l0.py",
    "tools/kb/src/kb/match.py",
    "tools/kb/tests/test_l0.py",
    "tools/mapkit/tests/",
    "tools/memgraph/tests/",
    "tools/tests/test_rom_correspondence.py",
]
read = "guarded"

