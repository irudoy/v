[[group]]
id = "qualified_receipt_protocol"
category = "evidence_and_acceptance"
property = "Accepting incomplete or non-production observations, wrong owner/claim/width/slot/layout, stale inputs, forged or failed terminals, changed streams or an unexecuted candidate."
repeat_triggers = ["Receipt schema, validator, source provenance, owning claim context, consumer rank/graph/reconciliation logic, or stored terminal/streams change."]
overlap = "GNU provides actual execution observations. Negative Python contracts check whether invalid evidence is refused; a successful positive GNU run does not test refusal of production=false."
minimum_boundary = "Affected negative protocol/consumer tests plus fresh qualification of the exact original executed evidence. Repeat GNU only when consumed execution inputs or required observations change; current finalizers still require the global full terminal."
minimality = "scoped_contract_identified"
source_anchors = ["tools/kb/src/kb/sid22_witness.py", "tools/kb/src/kb/copy_witness.py", "tools/kb/tests/test_sid22_receipts.py"]
regions = []
limits = ["Controlled test receipts prove refusal logic, not production execution. Broad provenance currently couples semantic changes to the full protocol."]

[[group]]
id = "registered_python_test_evidence"
category = "evidence_and_acceptance"
property = "Reusing a deleted or changed test, a different nodeid or parameters, incomplete setup/call/teardown reports, failed terminal or changed image/source context."
repeat_triggers = ["Registered test source, collection/nodeid/parameters, fixture/dependency inputs, TEST protocol or subject claim context change."]
overlap = "Receipt integrity overlaps the previous group. GNU does not prove that a Python function was collected and actually executed."
minimum_boundary = "TEST protocol negative contracts and one actual registered test invocation when its execution inputs change. Reuse must validate current source/collection/context and original terminal; it must not launch GNU implicitly."
minimality = "scoped_contract_identified"
source_anchors = ["tools/kb/src/kb/test_evidence.py", "tools/kb/tests/test_test_execution.py", "tools/kb/src/kb/test_contract.py", "tools/kb/src/kb/test_witness.py", "tools/kb/src/kb/passes.py"]
regions = []
limits = ["Registered cases require independent fact adapters and actual qualified execution. Other native TEST attachments require complete semantic and execution qualification under issue #53."]

[[group]]
id = "native_publication_and_reuse"
category = "evidence_and_acceptance"
property = "Adding, deleting or duplicating unrelated claims; changing canonical properties or widths; retiring unrelated reviews; publishing unqualified evidence; silently executing producers during ordinary reads."
repeat_triggers = ["Batch operations, writer/atomic link API, canonical identity/digest rules, owning source facts, qualified consumers or graph projection change."]
overlap = "Unit refusal tests cover controlled mutations. Native BEFORE/AFTER comparison checks the actual publication; GNU does not validate preservation of unrelated knowledge claims."
minimum_boundary = "Primary dry-run/apply with exact native identity Counters, source-bound original claim/review/width comparison and no-child qualified reuse. Simulator execution does not establish preservation of unrelated knowledge claims."
minimality = "scoped_contract_identified"
source_anchors = ["tools/kb/src/kb/write.py", "tools/kb/src/kb/reconciliation.py", "tools/kb/src/kb/graph.py", "tools/kb/tests/test_write.py", "tools/kb/tests/test_reader.py", "tools/kb/src/kb/width_compatibility.py", "tools/kb/src/kb/packed_width.py", "tools/kb/src/kb/width_view_resolution.py", "defs/JK08A.width-dispositions.toml", "tools/kb/tests/test_width_view_resolution.py", "tools/kb/tests/test_width_resolution_writer.py"]
regions = []
limits = ["Publication inventory counts belong to their exact source-bound task; they are not universal constants."]

[[group]]
id = "generated_projection_contracts"
category = "evidence_and_acceptance"
property = "A generated output disagrees with its declared source, lacks a registered generator/check recipe, or publishes inconsistent counts, identities or addresses."
repeat_triggers = ["Declared source data, generator, projection registry, consumer contract or relevant shared generation logic changes."]
overlap = "Python projection tests exercise refusal behavior. Read-only generator checks compare real outputs. Executing a present but unregistered header does not prove its generation/ownership contract."
minimum_boundary = "Read-only checks for every affected registered output and projection ownership. Shared generator changes can affect many outputs. The repository's current pre-commit make check requirement remains in force."
minimality = "affected_output_boundary_identified_aggregate_minimum_unproven"
source_anchors = ["Makefile", "tools/kb/projections.toml", "tools/tests/test_projection_contract.py"]
regions = []
limits = ["The minimal aggregate subset of all make check consumers has not been established; passing this group is not machine-execution evidence."]
