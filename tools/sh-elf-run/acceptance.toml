limits = ["Counter decrement and physical injector suppression are not established by one state-update invocation. Main JK08A third threshold-pair path is identity-only in its stock configuration. ASCD slice is not whole cruise-control behavior."]

[[group]]
id = "can_copy"
category = "stock"
property = "Detects wrong caller arguments/delay-slot length, source/destination reversal, offset-seven confusion, sign-byte effects, live-register/frame corruption and writes outside the 12-byte destination. Full matrix executes 732 ordered caller/helper cases with independent byte/register expectations."
repeat_triggers = ["Changed exact caller/helper bytes or pools, descriptor/member/width scope, case/header/oracle, ABI observer, ROM/L0 or current shared execution-input closure."]
overlap = "Static descriptor/CAS and protocol tests prove bindings and fail-closed acceptance, not actual copying. GNU supplies the actual ordered observations. The 140-byte injection snapshot proves a different call context."
minimum_boundary = "Public --can-copy-early is 27 non-production cases only. Existing full qualification CLI is tools/sh-elf-run/run.sh --can-copy-witness and executes all registered stock regions plus the primary pipeline; it is not a region-only command."
minimality = "unproved"
source_anchors = ["defs/JK08A.can-latch-copy.toml", "tools/kb/src/kb/copy_matrix.py", "tools/kb/src/kb/copy_witness.py", "tools/sh-elf-run/can_latch_copy.py", "tools/sh-elf-run/README.md"]
regions = ["jk08a-can-latch-copy"]
