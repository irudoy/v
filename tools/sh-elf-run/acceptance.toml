[[group]]
id = "sid22_pointer"
category = "stock"
property = "Detects wrong DID table stride/selector, distinct paired-pointer order, sequential byte order, response-ring wrap and incorrect transport/error arguments. Natural return, callee-saved state, frame and admitted RAM footprint are checked. Family13 loads the first pointer before its bound; families11/12 have no invented general bound."
repeat_triggers = ["Changed publisher ranges/pools/tables, 50 reader claim identities, 55 source bindings, exact widths, descriptor/matrix/header/stubs, actual ROM or current interpreter/executor closure."]
overlap = "Five inventory tests and static ownership/protocol tests lock bytes, pointer placement and refusals. They do not execute the publisher. The early packet establishes only five representative positive DIDs and four refusal contexts."
minimum_boundary = "Public --sid22-early is nine non-production cases. The prepared full protocol requires all 1700 cases via tools/sh-elf-run/run.sh --can-copy-witness --sid22-witness plus independent finalization; no public SID-only full qualification CLI exists."
minimality = "unproved"
source_anchors = ["defs/JK08A.sid22-pointer-read.toml", "tools/kb/src/kb/sid22_matrix.py", "tools/kb/src/kb/sid22_witness.py", "tools/diagnostics/tests/test_sid22_inventory.py", "tools/sh-elf-run/README.md"]
regions = ["jk08a-sid22-pointer-read"]
limits = ["Full 1700-case execution is not established by the saved early9 result. Exact oracle covers R0/R8..R14 and SR outside T, not volatile-register/T equivalence. No acceptance of 120B, families14..16, four ROM claims, width debt, physical units or hardware."]

