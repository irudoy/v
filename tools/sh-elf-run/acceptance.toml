property = "Detects activation versus release equality, arm/delay/active transitions, unrelated-bit damage and incorrect counter decrement. ASCD distinguishes button and alternate-state MAIN sources plus the coolant-threshold flag. RPM and vehicle-speed cut have different state/control gates and are not one interchangeable limiter."
repeat_triggers = ["Changed layout-specific threshold/configuration bytes, state/counter addresses, actual branch/store instructions, feature masks or common fixture/invoker inputs."]
overlap = "Python fuel-cut/state and meaning/scale tests overlap transition equations and address/byte checks. GNU adds natural return and exact selected-bit/state stores in each layout."
minimum_boundary = "Affected layout-specific state entry with activation/release neighbors and arm/counter/control combinations; ASCD requires its own source-select contexts. No public group selector."
minimality = "unproved"
source_anchors = ["tools/sh-elf-run/stock_rpm_fuel_cut_harness.c", "tools/sh-elf-run/stock_ascd_main_harness.c", "tools/sh-elf-run/README.md", "tools/kb/tests/test_main_rpm_fuel_cut_chain.py", "tools/kb/tests/test_vehicle_speed_fuel_cut_chain.py"]
