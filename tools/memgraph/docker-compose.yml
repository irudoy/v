# Memgraph (MAGE) + Lab for the VQ HR ECU reverse-engineering stack.
# Firmware structure graph (functions and call/xref relationships), community detection
# (Louvain), and graph diff for homologous firmware. See "RE stack" in ../../AGENTS.md.
#
# Context: run ONLY in Docker Desktop (docker context use desktop-linux).
#   Running concurrently in another context (Lima/colima) starts a second stack that
#   captures localhost over IPv4/IPv6 and splits the data. Verify with:
#   docker context show  ->  desktop-linux
#
# Start:  docker compose -f tools/memgraph/docker-compose.yml up -d
# Stop:   docker compose -f tools/memgraph/docker-compose.yml down
# Lab UI: http://localhost:3100   Bolt: bolt://localhost:7687 (empty authentication)
#
# Persistence: data (snapshots + WAL) lives in bind mount ./data
#   (= tools/memgraph/data, ignored by git). It survives container recreation and does not
#   depend on the VM context, unlike a named volume that lives inside the VM and is lost
#   when contexts change. Startup recovery: --data-recovery-on-startup=true.
services:
  memgraph:
    image: memgraph/memgraph-mage:3.11.0   # multi-architecture with native arm64
    container_name: vq-memgraph-mage
    ports:
      - "127.0.0.1:7687:7687"   # Bolt: drivers (neo4j) and Lab; explicit IPv4 loopback
      - "127.0.0.1:7444:7444"   # log stream -> Lab
    command:
      - "--storage-snapshot-interval-sec=300"   # periodic snapshot (5 minutes)
      - "--storage-snapshot-on-exit=true"       # snapshot on shutdown
      - "--storage-snapshot-retention-count=3"
      - "--storage-wal-enabled=true"            # WAL between snapshots
      - "--data-recovery-on-startup=true"       # graph recovery on startup
      - "--schema-info-enabled=true"            # runtime schema introspection for MCP agents
      - "--log-level=WARNING"
    volumes:
      - ./data/lib:/var/lib/memgraph   # snapshots + WAL (graph persistence)
      - ./data/log:/var/log/memgraph
    restart: unless-stopped

  lab:
    image: memgraph/lab:latest
    container_name: vq-memgraph-lab
    ports:
      - "127.0.0.1:3100:3000"   # web UI: http://localhost:3100
    depends_on:
      - memgraph
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph   # service name in the Docker network
      - QUICK_CONNECT_MG_PORT=7687
    restart: unless-stopped
