[rom]
xmlid = "JK08A"
internalidaddress = "8205"
internalidstring = "JK08A"
ecuid = "1JK08A"
caseid = "7MFKAVN86"
make = "Nissan"
model = "Skyline V36 250GT"
submodel = "VQ25HR"
market = "JDM"
transmission = "AT"
memmodel = "SH7058"
endian = "big"
filesize = "1024kb"
author = "VQ HR ECU project"
version = "WIP"

[rom.comment]
text = """
Analysis and method: defs/JK08A.notes.md. Each table's confidence is recorded
in its comment. Maps that pass the definition gate are visible by default.
Internal, diagnostic-internal, internal-coordinate, and unidentified research
maps carry an explicit emit=false decision and remain in the canonical ledger.
Categories follow the functional organization used by commercial Nissan tuning
suites and do not encode confidence. Units ending in [cand] use a multiplier
from the A2L catalog or data shape that has not been confirmed by code. The
common definition exposes Map 1 through Map 5 storage from
patches/map-switching-layout.toml. Map 2 through Map 5 are erased and inactive
in stock firmware; they require the project map-switching patch before runtime
use.
"""

[[checksum]]
type = "alt"
start = "0x2040C"
end = "0x2259C"
sumloc = "0x20404"
xorloc = "0x20408"
comment = """
Checksum B. Native RomRaider alt handler. Must run before checksum A.
"""

[[checksum]]
type = "alt2"
start = "0x8200"
end = "0x100000"
skiploc = "0x20000"
sumloc = "0x96DC"
xorloc = "0x96D4"
comment = """
Checksum A. Native RomRaider alt2 handler excluding 0x20000. B -> A ordering is
mandatory because the checksum B fields are inside domain A.
"""

[[switch]]
name = "Developer Immobilizer"
category = "NATS / Immobilizer"
storageaddress = "0x08725"
storagetype = "uint8"
sizex = "1"
endian = "big"
userlevel = "5"
description = "Exact {target_rom} only. Bit 0 enables ECM immobilizer enforcement; clearing it bypasses the Developer Immobilizer transitions and releases the engine inhibit. NATS DTC suppression is independent. Hardware evidence covers a JK08A-derived image on a 23710-JK00D ECU; no other image carries a hardware result."
state = [
  { name = "Enabled (Stock)", data = "01" },
  { name = "Disabled (IMMO OFF)", data = "00" },
]

[[switch]]
name = "CAN Telemetry at Startup"
category = "Logging / CAN Telemetry"
storageaddress = "0xD4E03"
storagetype = "uint8"
sizex = "1"
endian = "big"
userlevel = "5"
description = "Exact {target_rom} producer configuration. Disabled is the default. A validated START command on the derived control CAN ID overrides this byte until reset; STOP forces streaming off until reset. Requires the project CAN telemetry runtime."
state = [
  { name = "Disabled (Default)", data = "00" },
  { name = "Enabled", data = "01" },
]

[[switch]]
name = "Cruise Control Switch"
category = "Cruise Control / Steering Switch"
storageaddress = "0x08B28"
storagetype = "uint8"
sizex = "1"
endian = "big"
userlevel = "5"
description = "Exact {target_rom} only. Selects the cruise control steering switch that the ECM decodes. Not Installed: the ECM ignores the steering switch buttons, so the Map Switching gestures and the Rolling Launch CANCEL hold have no input. ICC Switch (5 Buttons): the ECM decodes the five-button ICC steering switch with DISTANCE, as stock JK08A does. The switch changes only this byte: cruise control itself also needs an ICC unit and the ICC CAN mailboxes of JK08A, which this byte does not configure. Hardware evidence covers stock JK08A only."
state = [
  { name = "Not Installed", data = "00" },
  { name = "ICC Switch (5 Buttons)", data = "2B" },
]

