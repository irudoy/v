# Презентационный слой дефа JK08A: имена, категории, порядок, шаги редактора и блок
# опознавателя ROM. Факты (адреса, форма, элемент, оси, шкала, уровень) сюда не идут -
# их несёт граф, а расходятся источники ровно тогда, когда один факт объявлен дважды.
#
# Читает tools/mapkit/emit_def.py; ключ слияния - адрес карты либо оси, как в графе
# (8 hex-цифр, нижний регистр).

[rom]
xmlid = "JK08A"
internalidaddress = "8205"
internalidstring = "JK08A"
ecuid = "1JK08A"
caseid = "7MFKAVN86"
make = "Nissan"
model = "Skyline V36 250GT"
submodel = "VQ25HR"
market = "JDM"
transmission = "AT"
memmodel = "SH7058"
endian = "big"
flashmethod = "Nisprog"
filesize = "1024kb"
author = "VQ HR ECU project"
version = "WIP"

# Целевой дамп:
# rom-images/23710-JK08A/1JK08A-20260726-stock.bin,
# sha256 ab60f18793fb121e4f55f626246117a6c69d9a900c0307ab1f4fc5f6ac718b23.
# Кодовые факты перенесены из exact-code донора JK03A. Значения карт и осей измеряются
# загрузчиком по собственному дампу JK08A. Донор структуры EV18A (350Z HR, тот же
# SH7058/1MB non-VVEL) имеет другой layout калибровки.
[rom.comment]
text = """
Разбор и метод - defs/JK08A.notes.md. Уровень каждой таблицы - в её комментарии.
Категория с суффиксом (candidate) - карта опознана, но не трейсом; единицы с
суффиксом [cand] - множитель взят из каталога A2L либо по форме данных и кодом
не закреплён.
"""

[[checksum]]
type = "alt"
start = "0x2040C"
end = "0x2259C"
sumloc = "0x20404"
xorloc = "0x20408"
comment = """
Checksum B. Нативный обработчик RomRaider alt. Должен выполняться раньше checksum A.
"""

[[checksum]]
type = "alt2"
start = "0x8200"
end = "0x100000"
skiploc = "0x20000"
sumloc = "0x96DC"
xorloc = "0x96D4"
comment = """
Checksum A. Нативный обработчик RomRaider alt2 с исключением 0x20000. Порядок B -> A
обязателен, поскольку поля checksum B входят в домен A.
"""

[[switch]]
name = "Developer Immobilizer"
category = "NATS / Immobilizer"
storageaddress = "0x08725"
storagetype = "uint8"
sizex = "1"
endian = "big"
userlevel = "5"
description = "Exact JK08A only. Bit 0 enables ECM immobilizer enforcement. Code path verified; vehicle test pending. NATS DTC suppression is independent."
state = [
  { name = "Enabled (Stock)", data = "01" },
  { name = "Disabled (IMMO OFF)", data = "00" },
]

