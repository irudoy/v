# JK08A definition presentation layer: names, categories, ordering, editor steps,
# and the ROM identification block. Facts such as address, shape, element, axes,
# scaling, and confidence do not belong here. The graph carries them, and sources
# diverge precisely when one fact is declared twice.
#
# Read by tools/mapkit/emit_def.py for both RomRaider XML and TunerPro XDF. The
# merge key is the graph map or axis address: eight lowercase hexadecimal digits.

[presentation]
# Maps that pass the definition gate are visible by default. Internal,
# diagnostic-internal, internal-coordinate, and unidentified research maps use
# an explicit emit = false decision in their own table records.
default_emit = true

[map_switching]
# The common JK08A XML/XDF expose all five storage slots. Map 1 uses stock
# storage. Map 2 through Map 5 point into the allocated project layout and are
# runtime-active only when the map-switching patch is present.
enabled = true

[rolling_launch]
# Direct tables expose the validated activation thresholds, bounded-retard ramp
# width, RPM offset, and RPM hysteresis. Five independent masked controls edit
# bits 0 through 4 of the enable_mask byte and preserve every other map-enable
# bit.
enabled = true

[rom]
xmlid = "JK08A"
internalidaddress = "8205"
internalidstring = "JK08A"
ecuid = "1JK08A"
caseid = "7MFKAVN86"
make = "Nissan"
model = "Skyline V36 250GT"
submodel = "VQ25HR"
market = "JDM"
transmission = "AT"
memmodel = "SH7058"
endian = "big"
flashmethod = "Nisprog"
filesize = "1024kb"
author = "VQ HR ECU project"
version = "WIP"

# Target dump:
# rom-images/23710-JK08A/1JK08A-20260726-stock.bin,
# sha256 ab60f18793fb121e4f55f626246117a6c69d9a900c0307ab1f4fc5f6ac718b23.
# Code facts are inherited from exact-code donor JK03A. The loader measures map
# and axis values from the owned JK08A dump. Structural donor EV18A (350Z HR,
# the same SH7058/1MB non-VVEL class) has a different calibration layout.
[rom.comment]
text = """
Analysis and method: defs/JK08A.notes.md. Each table's confidence is recorded in
its comment. Maps that pass the definition gate are visible by default. Internal,
diagnostic-internal, internal-coordinate, and unidentified research maps carry an
explicit emit=false decision and remain in the canonical ledger. Categories follow
the functional organization used by commercial Nissan tuning suites and do not encode
confidence. Units ending in [cand] use a multiplier from the A2L catalog or data shape
that has not been confirmed by code. The common definition exposes
Map 1 through Map 5 storage from patches/map-switching-layout.toml. Map 2 through
Map 5 are erased and inactive in stock firmware; they require the project
map-switching patch before runtime use.
"""

[[checksum]]
type = "alt"
start = "0x2040C"
end = "0x2259C"
sumloc = "0x20404"
xorloc = "0x20408"
comment = """
Checksum B. Native RomRaider alt handler. Must run before checksum A.
"""

[[checksum]]
type = "alt2"
start = "0x8200"
end = "0x100000"
skiploc = "0x20000"
sumloc = "0x96DC"
xorloc = "0x96D4"
comment = """
Checksum A. Native RomRaider alt2 handler excluding 0x20000. B -> A ordering is
mandatory because the checksum B fields are inside domain A.
"""

[[switch]]
name = "Developer Immobilizer"
category = "NATS / Immobilizer"
storageaddress = "0x08725"
storagetype = "uint8"
sizex = "1"
endian = "big"
userlevel = "5"
description = "Exact JK08A only. Bit 0 enables ECM immobilizer enforcement. Vehicle start and operation verified. NATS DTC suppression is independent."
state = [
  { name = "Enabled (Stock)", data = "01" },
  { name = "Disabled (IMMO OFF)", data = "00" },
]

# Calibration axes remain embedded in their tables. Canonical axis facts stay in
# the graph and defs/JK08A.axes.csv without separate editable reference views.

