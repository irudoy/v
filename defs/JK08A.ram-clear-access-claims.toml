 diagnostic status byte. In the P030 component, bit 0 is recalculated on every coordinator pass and is set exactly when ffff1071 < 150, ffff1071 >= lookup_u8(0x12DE2,min(2*ffff1070,255)), ffff106e >= 40, and ffff2736 >= 40. Bit 1 is the inter-cycle ffff42a8 qualification controlled by ffff244f.bit5. Under the stock application-code lifecycle, ffff42a8 remains zero, so the normal coordinator update clears bit 1 while ffff244f.bit5 is clear and sets it while that phase bit is set. Bits 0 and 1 must both be set in every external low-bit consumer: operating-point matcher 000847dc, auxiliary service 00085020, detection core 00085a70, six-bucket updater 00086d2a, and revolution-window producer 000872d0. Bit 2 is a coordinator-local event latch set at 00083848 and cleared at 00084552.\",\"symbol\":[{\"address\":\"ffff41d2\",\"evidence\":[{\"at\":\"7mfk:00027af0\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"00012026\",\"00012de2\",\"00027ac0\",\"0002fc24\",\"00034b70\",\"00082c8a\",\"000847dc\",\"00085020\",\"00085a70\",\"00086d2a\",\"000872d0\",\"ffff106e\",\"ffff1071\",\"ffff244f\",\"ffff2736\",\"ffff41d2\",\"ffff42a8\"],\"span\":1}},{\"at\":\"7mfk:0002fc98\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"00012026\",\"00012de2\",\"00027ac0\",\"0002fc24\",\"00034b70\",\"00082c8a\",\"000847dc\",\"00085020\",\"00085a70\",\"00086d2a\",\"000872d0\",\"ffff106e\",\"ffff1071\",\"ffff244f\",\"ffff2736\",\"ffff41d2\",\"ffff42a8\"],\"span\":1}},{\"at\":\"7mfk:00034c04\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"00012026\",\"00012de2\",\"00027ac0\",\"0002fc24\",\"00034b70\",\"00082c8a\",\"000847dc\",\"00085020\",\"00085a70\",\"00086d2a\",\"000872d0\",\"ffff106e\",\"ffff1071\",\"ffff244f\",\"ffff2736\",\"ffff41d2\",\"ffff42a8\"],\"span\":1}},{\"at\":\"7mfk:00082efa\",\"key\":\"reference\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\"