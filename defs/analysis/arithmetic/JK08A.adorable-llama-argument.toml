proposed_claim_json = "{\"evidence\":[],\"layout\":\"7mfk\",\"offset\":null,\"owner\":\"adorable-llama/tbl\",\"props\":{\"layouts\":[\"7mfk\"],\"note\":\"The explicit bounded 000413CC entry obtains A(q), B(q), A(128) and B(128) from paired natural 00026388 byte curves 00012798 and 000127D8. When A(q)>B(q) and A(128)>B(128), signed call 0004168A receives R1=(A(q)-B(q))*256 and R0=A(128)-B(128) after subtraction in delay slot 0004168C. A nonpositive first difference publishes zero; a nonpositive anchor difference bypasses division and retains the shifted first difference. The bounded result is clamped to 255 and stored at FFFF2236. Independent changes only to B must vary both actual differences and the final output while A and all other input state remain fixed. The conditional dependency supplies no physical ROM reader on the arithmetic callee, units, scale, complete parent reachability, later brake/mode behavior, scheduling or hardware inference.\",\"relies\":\"contract\",\"supports\":\"identity\",\"via\":[\"SymbolKey(layout='7mfk', kind='fn', address=267212)\",\"SymbolKey(layout='7mfk', kind='fn', address=156552)\"]},\"roles\":[\"arithmetic-argument\"],\"slot\":null,\"sources\":[\"kb/tbl/adorable-llama.toml\"],\"stated\":[\"7mfk\"],\"to\":\"pompous-firefly/fn\",\"type\":\"depends\"}"
