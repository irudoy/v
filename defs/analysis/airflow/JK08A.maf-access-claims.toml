onized validation.\",\"priority\":100,\"scope\":\"exact-code\"}],\"ledger\":[{\"binding\":\"mass-airflow-sensor-bank-2-did-1205\",\"order\":15,\"registry\":\"diagnostic-bindings\"},{\"dependency\":[{\"end\":\"owner\",\"relies\":\"structure\",\"role\":\"consumer\",\"supports\":\"identity\",\"to\":\"enchanted-cricket/fn\",\"type\":\"reader\"},{\"end\":\"owner\",\"relies\":\"level\",\"role\":\"consumer\",\"supports\":\"identity\",\"to\":\"married-moth/fn\",\"type\":\"reader\"},{\"end\":\"owner\",\"relies\":\"structure\",\"role\":\"indexed_by\",\"supports\":\"identity\",\"to\":\"hairy-dalmatian/ram\",\"type\":\"input\"},{\"end\":\"owner\",\"relies\":\"structure\",\"role\":\"writes\",\"supports\":\"identity\",\"to\":\"outstanding-penguin/fn\",\"type\":\"writer\"}],\"fields\":[\"semantics\",\"units\",\"confidence\"],\"identity\":[0,1,2,3,4,5],\"notes\":[0],\"order\":471,\"registry\":\"vars\",\"storage_description\":\"V*200\"}],\"level\":\"code\",\"link\":[{\"evidence\":[{\"at\":\"7mfk:0003c420\",\"kind\":\"l0\"},{\"key\":\"test_maf_scaling_guard_and_order_match_stock\",\"kind\":\"test\",\"path\":\"tools/kb/tests/test_airflow_scaling.py\"}],\"layouts\":[\"7mfk\"],\"note\":\"Unsigned raw word ffff1d64 is scaled by unsigned coefficient ffff4970, shifted logically right by 15, and capped at 65535 before the publisher tests the original raw word.\",\"relies\":\"structure\",\"supports\":\"identity\",\"to\":\"hairy-dalmatian/ram\",\"type\":\"input\",\"via\":[\"outstanding-penguin/fn\",\"optimistic-bobcat/fn\"]},{\"evidence\":[{\"at\":\"7mfk:000671e0\",\"kind\":\"l0\"},{\"key\":\"test_maf_scaling_guard_and_order_match_stock\",\"kind\":\"test\",\"path\":\"tools/kb/tests/test_airflow_scaling.py\"}],\"layouts\":[\"7mfk\"],\"note\":\"The post-guard unsigned coefficient word multiplies the unsigned raw sample. Neither the mode byte nor coefficient is sign extended into the product.\",\"relies\":\"structure\",\"supports\":\"identity\",\"to\":\"satisfied-oarfish/ram\",\"type\":\"input\",\"via\":[\"outstanding-penguin/fn\",\"optimistic-bobcat/fn\"]},{\"layouts\":[\"7mfk\"],\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"role\":\"indexed_by\",\"to\":\"dual_bank_maf_coordinator/fn\",\"type\":\"reader\"},{\"layouts\":[\"7mfk\"],\"relies\":\"structure\",\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"role\":\"indexed_by\",\"supports\":\"identity\",\"to\":\"enchanted-cricket/fn\",\"type\":\"reader\"},{\"evidence\":[{\"at\":\"7mfk:0003235c\",\"key\":\"sid22-v1:jk08a-pointer-read\",\"kind\":\"indirect\",\"mode\":\"did-pointer\",\"path\":\"defs/analysis/diagnostics/JK08A.sid22-pointer-read.toml\",\"supports\":\"identity\",\"to\":\"married-moth/fn/7mfk\",\"value\":{\"reader\":\"maf_b2/ram\"}}],\"layouts\":[\"7mfk\"],\"relies\":\"level\",\"supports\":\"identity\",\"to\":\"married-moth/fn\",\"type\":\"reader\"},{\"evidence\":[{\"at\":\"7mfk:0003c432\",\"kind\":\"l0\"},{\"key\":\"test_maf_scaling_guard_and_order_match_stock\",\"kind\":\"test\",\"path\":\"tools/kb/tests/test_airflow_scaling.py\"}],\"layouts\":[\"7mfk\"],\"note\":\"Original raw word ffff1d64 == 0x03ff selects ffff101e = floor(1023*uint16(ffff4970)/32768) + 1 after the scaler returns. Other raw words select the saturated scaler result without increment. For the ten-bit ADC domain, even coefficient 0xffff produces at most 2046 after increment.\",\"relies\":\"structure\",\"supports\":\"identity\",\"to\":\"hairy-dalmatian/ram\",\"type\":\"selector\",\"via\":[\"outstanding-penguin/fn\"]},{\"layouts\":[\"7mfk\"],\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"to\":\"dual_bank_maf_diagnostic_coordinator/fn\",\"type\":\"writer\"},{\"layouts\":[\"7mfk\"],\"relies\":\"structure\",\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"supports\":\"identity\",\"to\":\"outstanding-penguin/fn\",\"type\":\"writer\"}],\"note\":[\"With ffff4252.bit3 clear, coefficient values outside inclusive 0x7900..0x8700 reset to 0x8000; bit3 set lea