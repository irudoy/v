symbol\":[{\"address\":\"ffff1df2\",\"evidence\":[{\"at\":\"7mfk:0003a9ae\",\"kind\":\"indirect\",\"mode\":\"base\",\"supports\":\"identity\",\"value\":6},{\"key\":\"test_maf_indexed_state_path\",\"kind\":\"test\",\"path\":\"tools/kb/tests/test_ram_structure.py\",\"supports\":\"identity\"},{\"at\":\"7mfk:0003a9ce\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003a9aa\",\"0003a9ae\",\"0003af42\",\"ffff105a\",\"ffff1df2\"],\"span\":1}},{\"at\":\"7mfk:0003aa06\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003a9aa\",\"0003a9ae\",\"0003af42\",\"ffff105a\",\"ffff1df2\"],\"span\":1}},{\"at\":\"7mfk:0003aa0a\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003a9aa\",\"0003a9ae\",\"0003af42\",\"ffff105a\",\"ffff1df2\"],\"span\":1}},{\"at\":\"7mfk:0003af68\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003a9aa\",\"0003a9ae\",\"0003af42\",\"ffff105a\",\"ffff1df2\"],\"span\":1}}],\"layout\":\"7mfk\",\"name\":\"spiked-dalmatian\",\"signed\":false,\"width\":16}],\"unit\":\"raw MAF quantity\"}"
