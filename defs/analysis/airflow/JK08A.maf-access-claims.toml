tructure\",\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"supports\":\"identity\",\"to\":\"helpful-swine/fn\",\"type\":\"reader\"}],\"note\":[\"Exact code traces SH7058 AN15 through ffff1d64, diagnostic word ffff101e, preprocessing ffff1e4a, this curve, and total-MAF DID 0x1209. Exact DID 0x1205 names the channel MAS A/F SE-B2. The implicit code axis advances by 16 input counts per cell; homologous profiles convert one count to 0.005 V, yielding the cataloged 0.00..5.04 V axis at candidate scale. Stock outputs are strictly positive, so the contribution denominator A+B is nonzero. This branch does not produce ffff3a76. Result disposition: consumer. One count of the output is 105/25600 g/s: the bank outputs sum through ffff1df4 into ffff105c, and J1979 Mode 01 PID 0x10 declares ROM8[0x83ec]*ffff105c/256 as g/s*100 with the stock factor 105; a changed factor changes the declared conversion.\",\"On 7mfk, the independently assembled stock lookup executes 64 unsigned word cells with step 256, unsigned argument truncation, last-cell clamping, and both caller word stores. The source input advances one cell per 16 raw counts. The last word returns sign-extended before the caller word store. This executable contract supplies no additional hardware validation of the voltage axis or g/s conversion.\"],\"role\":\"table\",\"scale\":\"x*0.0041015625\",\"scale_level\":\"code\",\"summary\":\"Bank 2 MAF sensor transfer curve. FUN 0003a904 looks it up from the low 12 bits of bank-2 preprocessed sample ffff1e4a, writes uint16 output B to ffff1056, and copies it to working value ffff105a. The same value enters total-MAF producer 0003b27e and the paired contribution calculation in 0003b520.\",\"symbol\":[{\"address\":\"00015916\",\"evidence\":[{\"at\":\"1me3b:00046608\",\"kind\":\"l0\",\"note\":\"the target 0004656a of 550 bytes as 1ND0A 00042f50 reads the exact 64-point table first and 00015996 second through the 64-point implicit leaf 0002abec\",\"supports\":\"homology\",\"to\":\"7mfk:000141f4\"}],\"layout\":\"1me3b\",\"name\":\"crazy-bustard\"},{\"address\":\"00015ac2\",\"evidence\":[{\"at\":\"1nd:00042fee\",\"kind\":\"l0\",\"note\":\"unique structural pair preserves interpolation-call order\",\"supports\":\"homology\",\"to\":\"7mfk:000141f4\"}],\"layout\":\"1nd\",\"name\":\"devout-axolotl\"},{\"address\":\"000141f4\",\"evidence\":[{\"at\":\"7mfk:000228b0\",\"kind\":\"rom-bytes\",\"supports\":\"identity\",\"value\":\"ffff101e\"},{\"at\":\"7mfk:00026aa0\",\"kind\":\"unverified-site\",\"supports\":\"identity\"},{\"at\":\"7mfk:00026aa2\",\"kind\":\"unverified-site\",\"supports\":\"identity\"},{\"at\":\"7mfk:0003a936\",\"key\":\"reference\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"000083ec\",\"000093ce\",\"000141f4\",\"00021bbc\",\"000228b0\",\"00026410\",\"00035856\",\"0003a904\",\"0003ae8a\",\"0003b27e\",\"0003b520\",\"0003c3ac\",\"ffff101e\",\"ffff1056\",\"ffff105a\",\"ffff1e4a\"],\"span\":1}},{\"at\":\"7mfk:0003a93c\",\"key\":\"reference\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"000083ec\",\"000093ce\",\"000141f4\",\"00021bbc\",\"000228b0\",\"00026410\",\"00035856\",\"0003a904\",\"0003ae8a\",\"0003b27e\",\"0003b520\",\"0003c3ac\",\"ffff101e\",\"ffff1056\",\"ffff105a\",\"ffff1e4a\"],\"span\":1}},{\"at\":\"7mfk:0003a946\",\"key\":\"reference\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"000083ec\",\"000093ce\",\"000141f4\",\"00021bbc\",\"000228b0\",\"00026410\",\"00035856\",\"0003a904\",\"0003ae8a\",\"0003b27e\",\"0003b520\",\"0003c3ac\",\"ffff101e\",\"ffff1056\",\"ffff105a\",\"ffff1e4a\"],\"span\":1}},{\"at\":\"7mfk:0003a94e\",\"key\":\"reference\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"000083ec\",\"000093ce\",\"000141f4\",\"00021bbc\",\"000228b0\",\"00026410\",\"00035856\",\"0003a904\",\"0003ae8a\",\"0003b27e\",\"0003b520\",\"0003c3ac\",\"ffff101e\",\"ffff1056\",\"ffff105a\",\"ffff1e4a\"],\"spa