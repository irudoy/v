ence\":[{\"at\":\"7mfk:0003af68\",\"key\":\"maf-access-v1:jk08a:contribution-spiked-dalmatian-reader\",\"kind\":\"indirect\",\"mode\":\"maf-access\",\"note\":\"Exact natural bank-1 MAF access with independent physical, complete-state and numeric equations; original semantic width, signedness, native facts and evidence positions remain fixed.\",\"path\":\"defs/analysis/airflow/JK08A.maf-access-claims.toml\",\"supports\":\"identity\",\"value\":{\"component\":\"maf_extended_paths\",\"direction\":\"reader\",\"function\":\"7mfk:0003af42\",\"hardware_qualification\":false,\"native_address\":4294909426,\"natural_scheduling_inference\":false,\"original_claim_sha256\":\"b3dfed53b2069841254a1c3738a1cf1c00134d0c0f11ee3f56b1fcd0c651d520\",\"owner\":\"spiked-dalmatian/ram\",\"scale_admission\":false,\"scope\":\"exact-natural-bank1-maf-transfer\",\"units_admission\":false,\"width_bytes\":2}}],\"layouts\":[\"7mfk\"],\"relies\":\"structure\",\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"role\":\"indexed_by\",\"supports\":\"identity\",\"to\":\"mustard-squid/fn\",\"type\":\"reader\"},{\"evidence\":[{\"at\":\"7mfk:0003a9c4\",\"kind\":\"l0\"},{\"key\":\"test_maf_working_copy_mode_previous_word_weight_and_anti_stall_match_stock\",\"kind\":\"test\",\"path\":\"tools/kb/tests/test_airflow_filter.py\"}],\"layouts\":[\"7mfk\"],\"note\":\"On 7mfk, bit5 clear selects an unsigned word copy; bit5 set selects the stock 26/256 weighted update from the previous output plus the conditional one-count rule. Other bits do not select this mode; the byte is read-only in the filter.\",\"relies\":\"structure\",\"slot\":\"bit5\",\"supports\":\"identity\",\"to\":\"satisfied-bulldog/ram\",\"type\":\"selector\",\"via\":[\"sandy-chameleon/fn\"]},{\"evidence\":[{\"at\":\"7mfk:0003aa08\",\"key\":\"maf-access-v1:jk08a:filtered-write\",\"kind\":\"indirect\",\"mode\":\"maf-access\",\"note\":\"Exact natural bank-1 MAF access with independent physical, complete-state and numeric equations; original semantic width, signedness, native facts and evidence positions remain fixed.\",\"path\":\"defs/analysis/airflow/JK08A.maf-access-claims.toml\",\"supports\":\"identity\",\"value\":{\"component\":\"maf_copy_filter_paths\",\"direction\":\"writer\",\"function\":\"7mfk:0003a9aa\",\"hardware_qualification\":false,\"native_address\":4294909426,\"natural_scheduling_inference\":false,\"original_claim_sha256\":\"7cbccd9dda9359fa412fd5b4969c60da78de8eb9334c9590a5d8cc25a066563d\",\"owner\":\"spiked-dalmatian/ram\",\"scale_admission\":false,\"scope\":\"exact-natural-bank1-maf-transfer\",\"units_admission\":false,\"width_bytes\":2}}],\"layouts\":[\"7mfk\"],\"relies\":\"structure\",\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"supports\":\"identity\",\"to\":\"sandy-chameleon/fn\",\"type\":\"writer\"}],\"note\":[\"At input 1000 and previous output zero, five stock weighted calls produce 101, 192, 274, 347, 413. With the positive stock coefficient 26, a lower input gives a weighted result strictly below the previous word, making the downward anti-stall branch unreachable from function entry. Explicit post-arithmetic entry supplies input, previous, and weighted words plus saved GBR/MACL to execute both correction directions without changing instructions. The physical bit5 state, scheduler timing, and coefficient time constant remain unresolved.\"],\"summary\":\"Filtered bank 2 MAF word ffff1df2 on 7mfk. With ffff2461.bit5 clear, FUN 0003a9aa copies unsigned working word ffff105a. With bit5 set, f=floor((ROM8[0x870a]*uint16(ffff105a)+(256-ROM8[0x870a])*uint16(previous output))/256); stock ROM8[0x870a]=26. If f equals the previous output but differs from the input, the function moves one count toward the input before storing the word.\",\"symbol\":[{\"address\":\"ffff1df2\",\"evidence\":[{\"at\":\"7mfk:0003a9ae\",\"kind\":\"indirect\",\"mode\":\"base\",\"supports\":\"identity\",\"value\":6},{\"key\":\"test_maf_indexed_state_path\",\"kind\":\"test\",\"path\":\"tools/kb/tests/test_ram_structure.py\",\"supports\":\"identity\"},{\"at\":\"7mfk:0003a9ce\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003a9aa\",\"0003a9ae\",\"0003af42\",\"ffff105a\",\"ffff1df2\"],\"span\":1}},{\"at\":\"7mfk:0003aa06\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003a9aa\",\"0003a9ae\",\"0003af42\",\"ffff105a\",\"ffff1df2\"],\"span\":1}},{\"at\":\"7mfk:0003aa0a\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003a9aa\",\"0003a9ae\",\"0003af42\",\"ffff105a\",\"ffff1df2\"],\"span\":1}},{\"at\":\"7mfk:0003af68\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003a9aa\",\"0003a9ae\",\"0003af42\",\"ffff105a\",\"ffff1df2\"],\"span\":1}}],\"layout\":\"7mfk\",\"name\":\"spiked-dalmatian\",\"signed\":false,\"width\":16}],\"unit\":\"raw MAF quantity\"}"

