original_native_json = "{\"diagnostic\":[{\"applicability\":\"homologous_community\",\"claim\":{\"id\":\"370z-can-logger-2025-07-05:candata-extended-pids-csv:l0115-l0115:source-row-extended-pids:parameter:0x1205-004ea21e\",\"label\":\"ParameterDefinition\"},\"evidence\":[{\"kind\":\"trace\",\"note\":\"consumer\",\"relies\":\"level\",\"to\":\"married-moth/fn/7mfk\"},{\"kind\":\"trace\",\"note\":\"indexed_by\",\"relies\":\"structure\",\"to\":\"hairy-dalmatian/ram/7mfk\"},{\"at\":\"7mfk:000092be\",\"kind\":\"rom-bytes\",\"value\":\"0x8000\"},{\"at\":\"7mfk:000228b0\",\"kind\":\"rom-bytes\",\"value\":\"ffff101e\"},{\"at\":\"7mfk:000228b0\",\"key\":\"pointer\",\"kind\":\"l0-context\",\"value\":{\"named\":[\"000092be\",\"0003235c\",\"0003c408\",\"004ea21e\",\"ffff101e\",\"ffff1d64\"],\"span\":1}},{\"at\":\"7mfk:000280d6\",\"key\":\"reference\",\"kind\":\"l0-context\",\"value\":{\"named\":[\"000092be\",\"0003235c\",\"0003c408\",\"004ea21e\",\"ffff101e\",\"ffff1d64\"],\"span\":1}},{\"at\":\"7mfk:0003c420\",\"key\":\"body\",\"kind\":\"l0-context\",\"value\":{\"named\":[\"000092be\",\"0003235c\",\"0003c408\",\"004ea21e\",\"ffff101e\",\"ffff1d64\"],\"span\":1}},{\"at\":\"7mfk:0003c450\",\"key\":\"body\",\"kind\":\"l0-context\",\"value\":{\"named\":[\"000092be\",\"0003235c\",\"0003c408\",\"004ea21e\",\"ffff101e\",\"ffff1d64\"],\"span\":1}},{\"kind\":\"trace\",\"note\":\"writes\",\"relies\":\"structure\",\"to\":\"outstanding-penguin/fn/7mfk\"}],\"id\":\"mass-airflow-sensor-bank-2-did-1205\",\"key\":\"diagnostic-parameter:request:221205\",\"kind\":\"runtime_value\",\"label\":\"DiagnosticParameter\",\"level\":\"code\",\"note\":\"The exact JK08A UDS table maps DID 0x1205 to big-endian word ffff101e. The sole whole-program writer path scales SH7058 AN15 sample ffff1d64 through 000671d8 and writes this word. The diagnostic identity and bank assignment are exact for JK08A. Near-adjacent target readings are consistent with the homologous raw/200 V conversion but do not provide a synchronized validation.\",\"priority\":100,\"scope\":\"exact-code\"}],\"ledger\":[{\"binding\":\"mass-airflow-sensor-bank-2-did-1205\",\"order\":15,\"registry\":\"diagnostic-bindings\"},{\"dependency\":[{\"end\":\"owner\",\"relies\":\"structure\",\"role\":\"consumer\",\"supports\":\"identity\",\"to\":\"enchanted-cricket/fn\",\"type\":\"reader\"},{\"end\":\"owner\",\"relies\":\"level\",\"role\":\"consumer\",\"supports\":\"identity\",\"to\":\"married-moth/fn\",\"type\":\"reader\"},{\"end\":\"owner\",\"relies\":\"structure\",\"role\":\"indexed_by\",\"supports\":\"identity\",\"to\":\"hairy-dalmatian/ram\",\"type\":\"input\"},{\"end\":\"owner\",\"relies\":\"structure\",\"role\":\"writes\",\"supports\":\"identity\",\"to\":\"outstanding-penguin/fn\",\"type\":\"writer\"}],\"fields\":[\"semantics\",\"units\",\"confidence\"],\"identity\":[0,1,2,3,4,5],\"notes\":[0],\"order\":471,\"registry\":\"vars\",\"storage_description\":\"V*200\"}],\"level\":\"code\",\"link\":[{\"evidence\":[{\"at\":\"7mfk:0003c420\",\"kind\":\"l0\"},{\"key\":\"test_maf_scaling_guard_and_order_match_stock\",\"kind\":\"test\",\"path\":\"tools/kb/tests/test_airflow_scaling.py\"}],\"layouts\":[\"7mfk\"],\"note\":\"Unsigned raw word ffff1d64 is scaled by unsigned coefficient ffff4970, shifted logically right by 15, and capped at 65535 before the publisher tests the original raw word.\",\"relies\":\"structure\",\"supports\":\"identity\",\"to\":\"hairy-dalmatian/ram\",\"type\":\"input\",\"via\":[\"outstanding-penguin/fn\",\"optimistic-bobcat/fn\"]},{\"evidence\":[{\"at\":\"7mfk:000671e0\",\"kind\":\"l0\"},{\"key\":\"test_maf_scaling_guard_and_order_match_stock\",\"kind\":\"test\",\"path\":\"tools/kb/tests/test_airflow_scaling.py\"}],\"layouts\":[\"7mfk\"],\"note\":\"The post-guard unsigned coefficient word multiplies the unsigned raw sample. Neither the mode byte nor coefficient is sign extended into the product.\",\"relies\":\"structure\",\"supports\":\"identity\",\"to\":\"satisfied-oarfish/ram\",\"type\":\"input\",\"via\":[\"outstanding-penguin/fn\",\"optimistic-bobcat/fn\"]},{\"layouts\":[\"7mfk\"],\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"role\":\"indexed_by\",\"to\":\"dual_bank_maf_coordinator/fn\",\"type\":\"reader\"},{\"layouts\":[\"7mfk\"],\"relies\":\"structure\",\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"role\":\"indexed_by\",\"supports\":\"identity\",\"to\":\"enchanted-cricket/fn\",\"type\":\"reader\"},{\"evidence\":[{\"at\":\"7mfk:0003235c\",\"key\":\"sid22-v1:jk08a-pointer-read\",\"kind\":\"indirect\",\"mode\":\"did-pointer\",\"path\":\"defs/analysis/diagnostics/JK08A.sid22-pointer-read.toml\",\"supports\":\"identity\",\"to\":\"married-moth/fn/7mfk\",\"value\":{\"reader\":\"maf_b2/ram\"}}],\"layouts\":[\"7mfk\"],\"relies\":\"level\",\"supports\":\"identity\",\"to\":\"married-moth/fn\",\"type\":\"reader\"},{\"evidence\":[{\"at\":\"7mfk:0003c432\",\"kind\":\"l0\"},{\"key\":\"test_maf_scaling_guard_and_order_match_stock\",\"kind\":\"test\",\"path\":\"tools/kb/tests/test_airflow_scaling.py\"}],\"layouts\":[\"7mfk\"],\"note\":\"Original raw word ffff1d64 == 0x03ff selects ffff101e = floor(1023*uint16(ffff4970)/32768) + 1 after the scaler returns. Other raw words select the saturated scaler result without increment. For the ten-bit ADC domain, even coefficient 0xffff produces at most 2046 after increment.\",\"relies\":\"structure\",\"supports\":\"identity\",\"to\":\"hairy-dalmatian/ram\",\"type\":\"selector\",\"via\":[\"outstanding-penguin/fn\"]},{\"layouts\":[\"7mfk\"],\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"to\":\"dual_bank_maf_diagnostic_coordinator/fn\",\"type\":\"writer\"},{\"layouts\":[\"7mfk\"],\"relies\":\"structure\",\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"supports\":\"identity\",\"to\":\"outstanding-penguin/fn\",\"type\":\"writer\"}],\"note\":[\"With ffff4252.bit3 clear, coefficient values outside inclusive 0x7900..0x8700 reset to 0x8000; bit3 set leaves any word unchanged. At 0x8000, samples 0..1022 are unchanged and 1023 produces 1024. The diagnostic display scale is raw/200 V at 5 mV per count; the homologous display conversion lacks synchronized live validation.\"],\"scale\":\"x/200\",\"summary\":\"Bank 2 MAF sensor diagnostic word. On 7mfk, FUN 0003c408 checks or bypasses coefficient ffff4970 according to ffff4252.bit3, scales unsigned sample ffff1d64 through 000671d8, and adds one after scaling when the original raw word equals 0x03ff. UDS DID 0x1205 returns word ffff101e in big-endian order.\",\"symbol\":[{\"address\":\"fffe8026\",\"evidence\":[{\"at\":\"1me3b:fffe8026\",\"kind\":\"byte-identical\",\"note\":\"Aligned diagnostic pointer tables of 1ND0A and 1ME3B hold this cell at every index of the 1ND source\",\"sha256\":\"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855\",\"supports\":\"homology\",\"to\":\"7mfk:ffff101e\"}],\"layout\":\"1me3b\"},{\"address\":\"fffe8026\",\"evidence\":[{\"at\":\"1nd:fffe8026\",\"kind\":\"byte-identical\",\"note\":\"Aligned diagnostic pointer table and direct references agree\",\"sha256\":\"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855\",\"supports\":\"homology\",\"to\":\"7mfk:ffff101e\"}],\"layout\":\"1nd\"},{\"address\":\"ffff101e\",\"evidence\":[{\"at\":\"7mfk:000228b0\",\"kind\":\"rom-bytes\",\"supports\":\"identity\",\"value\":\"ffff101e\"},{\"at\":\"7mfk:000228b0\",\"key\":\"pointer\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003235c\",\"0003ae8a\",\"0003c408\",\"ffff101e\",\"ffff1d64\"],\"span\":1}},{\"at\":\"7mfk:0003c420\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003235c\",\"0003ae8a\",\"0003c408\",\"ffff101e\",\"ffff1d64\"],\"span\":1}},{\"at\":\"7mfk:0003c450\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003235c\",\"0003ae8a\",\"0003c408\",\"ffff101e\",\"ffff1d64\"],\"span\":1}},{\"key\":\"1024-counts-5.12v\",\"kind\":\"spec\",\"supports\":\"identity\"},{\"key\":\"esm-ec163-maf-display-idle-0.8-1.1v\",\"kind\":\"manual\",\"supports\":\"identity\"}],\"former\":[\"happy-potoo/ram/7mfk-ffff101e\"],\"layout\":\"7mfk\",\"signed\":false,\"width\":16},{\"address\":\"ffff1026\",\"evidence\":[{\"at\":\"jk00c:00086d7a\",\"count\":1,\"kind\":\"function-match\",\"supports\":\"homology\",\"to\":\"7mfk:0008286a\",\"value\":\"mnemonic\"}],\"layout\":\"jk00c\"},{\"address\":\"ffff1026\",\"evidence\":[{\"at\":\"jk00d:00086d7a\",\"count\":1,\"kind\":\"function-match\",\"supports\":\"homology\",\"to\":\"7mfk:0008286a\",\"value\":\"mnemonic\"}],\"layout\":\"jk00d\"},{\"address\":\"ffff1026\",\"evidence\":[{\"at\":\"jk78c:ffff1026\",\"kind\":\"byte-identical\",\"note\":\"Aligned diagnostic pointer table and direct references agree\",\"sha256\":\"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855\",\"supports\":\"homology\",\"to\":\"7mfk:ffff101e\"}],\"layout\":\"jk78c\"}],\"unit\":\"V\",\"width\":16}"
