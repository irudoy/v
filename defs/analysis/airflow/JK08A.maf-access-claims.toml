\"at\":\"7mfk:0003a926\",\"kind\":\"l0\"},{\"key\":\"test_maf_coordinate_word_curve_and_both_publications_match_stock\",\"kind\":\"test\",\"path\":\"tools/kb/tests/test_airflow_transfer.py\"}],\"layouts\":[\"7mfk\"],\"note\":\"On 7mfk, uint16(uint16(ffff1e48)<<4) is the unsigned word argument. This retains the low 12 input bits, selects one of 64 cells with step 256, and supplies 16 input counts per cell. At coordinate >=0x3f00, cell 63 is returned without interpolation; below it the fraction is (argument&255)*256.\",\"relies\":\"structure\",\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"supports\":\"identity\",\"to\":\"ginger-stingray/ram\",\"type\":\"index\",\"via\":[\"dual_bank_maf_coordinator/fn\",\"xanthic-kagu/fn\",\"precise-koala/fn\"]},{\"layouts\":[\"7mfk\"],\"relies\":\"level\",\"supports\":\"scale\",\"to\":\"dazzling-ladybug/fn\",\"type\":\"reader\"},{\"evidence\":[{\"at\":\"7mfk:00026aa0\",\"key\":\"maf-access-v1:jk08a:curve-attribution-00014274-reader\",\"kind\":\"indirect\",\"mode\":\"maf-access\",\"note\":\"Exact bounded dual-bank word-curve read through the existing coordinator and real wrapper/interpolation helpers; no complete caller, correction publisher, universal no-read, scale, units or hardware admission.\",\"path\":\"defs/analysis/airflow/JK08A.maf-access-claims.toml\",\"supports\":\"identity\",\"value\":{\"component\":\"maf_transfer_paths\",\"direction\":\"reader\",\"function\":\"7mfk:0003a904\",\"hardware_qualification\":false,\"native_address\":82548,\"natural_scheduling_inference\":false,\"original_claim_sha256\":\"dad443c04ad68fac2f161b492fcf6a7774dfcfd1b41e3ef1a8c3c592bde62e8d\",\"owner\":\"wealthy-woodlouse/tbl\",\"scale_admission\":false,\"scope\":\"exact-natural-bank1-maf-transfer\",\"units_admission\":false,\"width_bytes\":2}}],\"layouts\":[\"7mfk\"],\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"to\":\"dual_bank_maf_coordinator/fn\",\"type\":\"reader\"},{\"layouts\":[\"7mfk\"],\"relies\":