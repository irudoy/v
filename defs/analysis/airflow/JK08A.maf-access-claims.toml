ovide a synchronized validation.\",\"priority\":100,\"scope\":\"exact-code\"}],\"ledger\":[{\"binding\":\"mass-airflow-sensor-bank-1-did-1204\",\"order\":14,\"registry\":\"diagnostic-bindings\"},{\"dependency\":[{\"end\":\"owner\",\"relies\":\"structure\",\"role\":\"consumer\",\"supports\":\"identity\",\"to\":\"enchanted-cricket/fn\",\"type\":\"reader\"},{\"end\":\"owner\",\"relies\":\"level\",\"role\":\"consumer\",\"supports\":\"identity\",\"to\":\"married-moth/fn\",\"type\":\"reader\"},{\"end\":\"owner\",\"relies\":\"structure\",\"role\":\"indexed_by\",\"supports\":\"identity\",\"to\":\"enthusiastic-pillbug/ram\",\"type\":\"input\"},{\"end\":\"owner\",\"relies\":\"structure\",\"role\":\"writes\",\"supports\":\"identity\",\"to\":\"outstanding-penguin/fn\",\"type\":\"writer\"}],\"fields\":[\"semantics\",\"units\",\"confidence\"],\"identity\":[0,1,2,3,4,5],\"notes\":[0],\"order\":470,\"registry\":\"vars\",\"storage_description\":\"V*200\"}],\"level\":\"code\",\"link\":[{\"evidence\":[{\"at\":\"7mfk:0003c420\",\"kind\":\"l0\"},{\"key\":\"test_maf_scaling_guard_and_order_match_stock\",\"kind\":\"test\",\"path\":\"tools/kb/tests/test_airflow_scaling.py\"}],\"layouts\":[\"7mfk\"],\"note\":\"Unsigned raw word ffff1d62 is scaled by unsigned coefficient ffff4970, shifted logically right by 15, and capped at 65535 before the publisher tests the original raw word.\",\"relies\":\"structure\",\"supports\":\"identity\",\"to\":\"enthusiastic-pillbug/ram\",\"type\":\"input\",\"via\":[\"outstanding-penguin/fn\",\"optimistic-bobcat/fn\"]},{\"evidence\":[{\"at\":\"7mfk:000671e0\",\"kind\":\"l0\"},{\"key\":\"test_maf_scaling_guard_and_order_match_stock\",\"kind\":\"test\",\"path\":\"tools/kb/tests/test_airflow_scaling.py\"}],\"layouts\":[\"7mfk\"],\"note\":\"The post-guard unsigned coefficient word multiplies the unsigned raw sample. Neither the mode byte nor coefficient is sign extended into the product.\",\"relies\":\"structure\",\"supports\":\"identity\",\"to\":\"satisfied-oarfish/ram\",\"type\":\"input\",\"via\":[\"outstanding-penguin/fn\",\"optimistic-bobcat/fn\"]},{\"layouts\":[\"7mfk\"],\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"role\":\"indexed_by\",\"to\":\"dual_bank_maf_coordinator/fn\",\"type\":\"reader\"},{\"layouts\":[\"7mfk\"],\"relies\":\"structure\",\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"role\":\"indexed_by\",\"supports\":\"identity\",\"to\":\"enchanted-cricket/fn\",\"type\":\"reader\"},{\"layouts\":[\"7mfk\"],\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"role\":\"indexed_by\",\"to\":\"kind-millipede/fn\",\"type\":\"reader\"},{\"evidence\":[{\"at\":\"7mfk:0003235c\",\"key\":\"sid22-v1:jk08a-pointer-read\",\"kind\":\"indirect\",\"mode\":\"did-pointer\",\"path\":\"defs/analysis/diagnostics/JK08A.sid22-pointer-read.toml\",\"supports\":\"identity\",\"to\":\"married-moth/fn/7mfk\",\"value\":{\"reader\":\"maf_b1/ram\"}}],\"layouts\":[\"7mfk\"],\"relies\":\"level\",\"supports\":\"identity\",\"to\":\"married-moth/fn\",\"type\":\"reader\"},{\"evidence\":[{\"at\":\"7mfk:0003c432\",\"kind\":\"l0\"},{\"key\":\"test_maf_scaling_guard_and_order_match_stock\",\"kind\":\"test\",\"path\":\"tools/kb/tests/test_airflow_scaling.py\"}],\"layouts\":[\"7mfk\"],\"note\":\"Original raw word ffff1d62 == 0x03ff selects ffff101c = floor(1023*uint16(ffff4970)/32768) + 1 after the scaler returns. Other raw words select the saturated scaler result without increment. For the ten-bit ADC domain, even coefficient 0xffff produces at most 2046 after increment.\",\"relies\":\"structure\",\"supports\":\"identity\",\"to\":\"enthusiastic-pillbug/ram\",\"type\":\"selector\",\"via\":[\"outstanding-penguin/fn\"]},{\"layouts\":[\"7mfk\"],\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"to\":\"dual_bank_maf_diagnostic_coordinator/fn\",\"type\":\"writer\"},{\"layouts\":[\"7mfk\"],\"relies\":\"structure\",\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"supports\":\"identity\",\"to\":\"outstanding-penguin/fn\",\"type\":\"writer\"}],\"note\":[\"With ffff4252.bit3 clear, coefficient values outside inclusive 0x7900..0x8700 reset to 0x8000; bit3 set leaves any word unchanged. At 0x8000, samples 0..1022 are unchanged and 1023 produces 1024. The diagnostic display scale is raw/200 V at 5 mV per count; the homologous display conversion lacks synchronized live validation.\"],\"scale\":\"x/200\",\"summary\":\"Bank 1 MAF sensor diagnostic word. On 7mfk, FUN 0003c408 checks or bypasses coefficient ffff4970 according to ffff4252.bit3, scales unsigned sample ffff1d62 through 000671d8, and adds one after scaling when the original raw word equals 0x03ff. UDS DID 0x1204 returns word ffff101c in big-endian order.\",\"symbol\":[{\"address\":\"fffe8024\",\"evidence\":[{\"at\":\"1me3b:fffe8024\",\"kind\":\"byte-identical\",\"note\":\"Aligned diagnostic pointer tables of 1ND0A and 1ME3B hold this cell at every index of the 1ND source\",\"sha256\":\"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855\",\"supports\":\"homology\",\"to\":\"7mfk:ffff101c\"}],\"layout\":\"1me3b\"},{\"address\":\"fffe8024\",\"evidence\":[{\"at\":\"1nd:fffe8024\",\"kind\":\"byte-identical\",\"note\":\"Aligned diagnostic pointer table and direct references agree\",\"sha256\":\"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855\",\"supports\":\"homology\",\"to\":\"7mfk:ffff101c\"}],\"layout\":\"1nd\"},{\"address\":\"ffff101c\",\"evidence\":[{\"at\":\"7mfk:000228ac\",\"kind\":\"rom-bytes\",\"supports\":\"identity\",\"value\":\"ffff101c\"},{\"at\":\"7mfk:000228ac\",\"key\":\"pointer\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003235c\",\"0003ae8a\",\"0003c408\",\"ffff101c\",\"ffff1d62\"],\"span\":1}},{\"at\":\"7mfk:0003c420\",\"key\":\"reference\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003235c\",\"0003ae8a\",\"0003c408\",\"ffff101c\",\"ffff1d62\"],\"span\":1}},{\"at\":\"7mfk