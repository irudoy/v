flow_contribution.py\"}],\"layouts\":[\"7mfk\"],\"note\":\"Any nonzero selected latch selects fallback. The producer does not decrement or clear the byte.\",\"relies\":\"level\",\"supports\":\"identity\",\"to\":\"maf_fallback_latch_b2/ram\",\"type\":\"selector\",\"via\":[\"mustard-squid/fn\"]},{\"evidence\":[{\"at\":\"7mfk:0003af60\",\"kind\":\"l0\"},{\"key\":\"test_maf_contribution_modes_signed_rounding_state_caps_and_natural_return_match_stock\",\"kind\":\"test\",\"path\":\"tools/kb/tests/test_airflow_contribution.py\"}],\"layouts\":[\"7mfk\"],\"note\":\"Bit 7 set selects fallback and writes 3 to the selected latch. Its clear state permits active calculation under the other conditions.\",\"relies\":\"structure\",\"slot\":\"bit7\",\"supports\":\"identity\",\"to\":\"slick-bullfinch/ram\",\"type\":\"selector\",\"via\":[\"mustard-squid/fn\"]},{\"evidence\":[{\"at\":\"7mfk:0003af76\",\"kind\":\"l0\"},{\"key\":\"test_maf_contribution_modes_signed_rounding_state_caps_and_natural_return_match_stock\",\"kind\":\"test\",\"path\":\"tools/kb/tests/test_airflow_contribution.py\"}],\"layouts\":[\"7mfk\"],\"note\":\"Bit 3 set selects fallback and writes 3 to the selected latch. Other bits are preserved and do not select this condition.\",\"relies\":\"structure\",\"slot\":\"bit3\",\"supports\":\"identity\",\"to\":\"splendid-cheetah/ram\",\"type\":\"selector\",\"via\":[\"mustard-squid/fn\"]},{\"evidence\":[{\"at\":\"7mfk:0003b172\",\"key\":\"maf-access-v1:jk08a:contribution-imposing-auk-writer\",\"kind\":\"indirect\",\"mode\":\"maf-access\",\"note\":\"Exact natural bank-1 MAF access with independent physical, complete-state and numeric equations; original semantic width, signedness, native facts and evidence positions remain fixed.\",\"path\":\"defs/analysis/airflow/JK08A.maf-access-claims.toml\",\"supports\":\"identity\",\"value\":{\"component\":\"maf_extended_paths\",\"direction\":\"writer\",\"function\":\"7mfk:0003af42\",\"hardware_qualification\":false,\"native_address\":4294909436,\"natural_scheduling_inference\":false,\"original_claim_sha256\":\"cace53a58cd8759a617d7fcf2c65fe92d5b76af57abe98be6f6cd971333a7859\",\"owner\":\"imposing-auk/ram\",\"scale_admission\":false,\"scope\":\"exact-natural-bank1-maf-transfer\",\"units_admission\":false,\"width_bytes\":4}}],\"layouts\":[\"7mfk\"],\"relies\":\"structure\",\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"supports\":\"identity\",\"to\":\"mustard-squid/fn\",\"type\":\"writer\"}],\"note\":[\"The MAF and bank identity are code-proven; the individual correction terms and engineering scale remain unresolved.\",\"The active formula in the chain applies with ffff2462.bit0 set, both inhibitor bits clear, selected latch zero, and base plus scaled correction v>=0. If v<0 the output is zero even when v+e is positive; otherwise a negative v+e also selects zero. Those zero paths carry v+e as the residual. A nonnegative v+e clears the residual even if the output is capped. The final magnitude is capped at 65535, with zero represented as nonnegative. Intermediate signed 24-bit clamps and the active output cap execute through explicit post-base contexts, not a claim that ordinary word inputs reach them. Full-entry wide fallback references and changed fixture weights similarly establish software boundaries without live reachability.\"],\"summary\":\"Bank 2 MAF contribution longword ffff1dfc on 7mfk. Active mode stores a nonnegative result capped at 0xffffff from unsigned filtered input ffff1df2, a clamped word base, signed correction state, and carried residual. Fallback mode uses a low-32-bit weighted product of reference ffff1e14, publishes a capped contribution and base word, and preserves correction and residual states. The combined-MAF consumer interprets the longword as signed.\",\"symbol\":[{\"address\":\"ffff1dfc\",\"evidence\":[{\"at\":\"7mfk:0003b170\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003af42\",\"0003b252\",\"ffff1df2\",\"ffff1dfc\"],\"span\":1}},{\"at\":\"7mfk:0003b190\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003af42\",\"0003b252\",\"ffff1df2\",\"ffff1dfc\"],\"span\":1}},{\"at\":\"7mfk:0003b202\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003af42\",\"0003b252\",\"ffff1df2\",\"ffff1dfc\"],\"span\":1}},{\"at\":\"7mfk:0003b262\",\"key\":\"reference\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003af42\",\"0003b252\",\"ffff1df2\",\"ffff1dfc\"],\"span\":1}}],\"layout\":\"7mfk\",\"name\":\"imposing-auk\",\"signed\":true,\"width\":32}],\"unit\":\"raw MAF contribution\"}"

