:\"identity\",\"value\":{\"named\":[\"000092be\",\"00039a9e\",\"0003c408\",\"00067188\",\"000671d8\",\"ffff4970\"],\"span\":1}}],\"layout\":\"7mfk\",\"name\":\"satisfied-oarfish\",\"signed\":false,\"width\":16}],\"unit\":\"Q1.15 coefficient\"}"

