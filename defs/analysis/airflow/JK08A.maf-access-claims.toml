original_native_json = "{\"ledger\":[{\"dependency\":[{\"end\":\"owner\",\"relies\":\"structure\",\"role\":\"consumer\",\"supports\":\"identity\",\"to\":\"mustard-squid/fn\",\"type\":\"reader\"},{\"end\":\"owner\",\"relies\":\"structure\",\"role\":\"indexed_by\",\"supports\":\"identity\",\"to\":\"dancing-hippo/ram\",\"type\":\"input\"},{\"end\":\"owner\",\"relies\":\"structure\",\"role\":\"writes\",\"supports\":\"identity\",\"to\":\"sandy-chameleon/fn\",\"type\":\"writer\"}],\"fields\":[\"semantics\",\"units\",\"confidence\"],\"identity\":[0,2,3,4,5,1],\"offset\":[{\"evidence\":0,\"text\":\"6\"}],\"order\":477,\"registry\":\"vars\"}],\"level\":\"code\",\"link\":[{\"evidence\":[{\"at\":\"7mfk:0003aa0a\",\"kind\":\"l0\"},{\"key\":\"test_maf_working_copy_mode_previous_word_weight_and_anti_stall_match_stock\",\"kind\":\"test\",\"path\":\"tools/kb/tests/test_airflow_filter.py\"}],\"layouts\":[\"7mfk\"],\"note\":\"With ffff2461.bit5 clear, the selected unsigned word ffff105a is copied directly into ffff1df2, without reading the previous output or applying the weighted update. Other flag bits and the sibling bank remain unchanged.\",\"relies\":\"structure\",\"supports\":\"identity\",\"to\":\"dancing-hippo/ram\",\"type\":\"copy\",\"via\":[\"sandy-chameleon/fn\"]},{\"evidence\":[{\"at\":\"7mfk:0003a9be\",\"kind\":\"l0\"},{\"key\":\"test_maf_working_copy_mode_previous_word_weight_and_anti_stall_match_stock\",\"kind\":\"test\",\"path\":\"tools/kb/tests/test_airflow_filter.py\"}],\"layouts\":[\"7mfk\"],\"note\":\"The selected unsigned working word ffff105a is read before the bit5 mode branch. A clear bit selects direct copy; a set bit supplies its weight ROM8[0x870a]=26 in a 256-denominator update with the previous output. The one-count rule prevents a changing higher input from leaving the stored word unchanged through floor truncation.\",\"relies\":\"structure\",\"supports\":\"identity\",\"to\":\"dancing-hippo/ram\",\"type\":\"input\",\"via\":[\"sandy-chameleon/fn\"]},{\"layouts\":[\"7mfk\"],\"relies\":\"structure\",\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"role\":\"indexed_by\",\"supports\":\"identity\",\"to\":\"mustard-squid/fn\",\"type\":\"reader\"},{\"evidence\":[{\"at\":\"7mfk:0003a9c4\",\"kind\":\"l0\"},{\"key\":\"test_maf_working_copy_mode_previous_word_weight_and_anti_stall_match_stock\",\"kind\":\"test\",\"path\":\"tools/kb/tests/test_airflow_filter.py\"}],\"layouts\":[\"7mfk\"],\"note\":\"On 7mfk, bit5 clear selects an unsigned word copy; bit5 set selects the stock 26/256 weighted update from the previous output plus the conditional one-count rule. Other bits do not select this mode; the byte is read-only in the filter.\",\"relies\":\"structure\",\"slot\":\"bit5\",\"supports\":\"identity\",\"to\":\"satisfied-bulldog/ram\",\"type\":\"selector\",\"via\":[\"sandy-chameleon/fn\"]},{\"layouts\":[\"7mfk\"],\"relies\":\"structure\",\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"supports\":\"identity\",\"to\":\"sandy-chameleon/fn\",\"type\":\"writer\"}],\"note\":[\"At input 1000 and previous output zero, five stock weighted calls produce 101, 192, 274, 347, 413. With the positive stock coefficient 26, a lower input gives a weighted result strictly below the previous word, making the downward anti-stall branch unreachable from function entry. Explicit post-arithmetic entry supplies input, previous, and weighted words plus saved GBR/MACL to execute both correction directions without changing instructions. The physical bit5 state, scheduler timing, and coefficient time constant remain unresolved.\"],\"summary\":\"Filtered bank 2 MAF word ffff1df2 on 7mfk. With ffff2461.bit5 clear, FUN 0003a9aa copies unsigned working word ffff105a. With bit5 set, f=floor((ROM8[0x870a]*uint16(ffff105a)+(256-ROM8[0x870a])*uint16(previous output))/256); stock ROM8[0x870a]=26. If f equals the previous output but differs from the input, the function moves one count toward the input before storing the word.\",\"symbol\":[{\"address\":\"ffff1df2\",\"evidence\":[{\"at\":\"7mfk:0003a9ae\",\"kind\":\"indirect\",\"mode\":\"base\",\"supports\":\"identity\",\"value\":6},{\"key\":\"test_maf_indexed_state_path\",\"kind\":\"test\",\"path\":\"tools/kb/tests/test_ram_structure.py\",\"supports\":\"identity\"},{\"at\":\"7mfk:0003a9ce\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003a9aa\",\"0003a9ae\",\"0003af42\",\"ffff105a\",\"ffff1df2\"],\"span\":1}},{\"at\":\"7mfk:0003aa06\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003a9aa\",\"0003a9ae\",\"0003af42\",\"ffff105a\",\"ffff1df2\"],\"span\":1}},{\"at\":\"7mfk:0003aa0a\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003a9aa\",\"0003a9ae\",\"0003af42\",\"ffff105a\",\"ffff1df2\"],\"span\":1}},{\"at\":\"7mfk:0003af68\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003a9aa\",\"0003a9ae\",\"0003af42\",\"ffff105a\",\"ffff1df2\"],\"span\":1}}],\"layout\":\"7mfk\",\"name\":\"spiked-dalmatian\",\"signed\":false,\"width\":16}],\"unit\":\"raw MAF quantity\"}"
