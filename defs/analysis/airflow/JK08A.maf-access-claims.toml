original_native_json = "{\"ledger\":[{\"dependency\":[{\"end\":\"owner\",\"relies\":\"structure\",\"role\":\"consumer\",\"supports\":\"identity\",\"to\":\"brass-ammonite/fn\",\"type\":\"reader\"},{\"end\":\"owner\",\"relies\":\"level\",\"role\":\"consumer\",\"supports\":\"identity\",\"to\":\"helpful-swine/fn\",\"type\":\"reader\"},{\"end\":\"owner\",\"relies\":\"structure\",\"role\":\"from_map\",\"supports\":\"identity\",\"to\":\"ivory-gecko/tbl\",\"type\":\"lookup\"},{\"end\":\"owner\",\"relies\":\"level\",\"role\":\"writes\",\"supports\":\"identity\",\"to\":\"dual_bank_maf_coordinator/fn\",\"type\":\"writer\"}],\"fields\":[\"semantics\",\"units\",\"confidence\"],\"identity\":[0,1,2],\"notes\":[0],\"order\":47,\"registry\":\"vars\"}],\"level\":\"code\",\"link\":[{\"evidence\":[{\"at\":\"7mfk:0003a93c\",\"kind\":\"l0\"},{\"key\":\"test_maf_coordinate_word_curve_and_both_publications_match_stock\",\"kind\":\"test\",\"path\":\"tools/kb/tests/test_airflow_transfer.py\"}],\"layouts\":[\"7mfk\"],\"note\":\"The caller reads unsigned word ffff1e4a, shifts it left four bits, and passes only the low word. Thus high input nibbles wrap rather than saturate. The implicit index is min(63,(uint16(ffff1e4a<<4)>>8)); below the last-cell boundary the fraction is uint16(uint16(ffff1e4a<<4)<<8).\",\"relies\":\"structure\",\"supports\":\"identity\",\"to\":\"careful-penguin/ram\",\"type\":\"input\",\"via\":[\"dual_bank_maf_coordinator/fn\",\"xanthic-kagu/fn\",\"precise-koala/fn\",\"didactic-civet/fn\"]},{\"evidence\":[{\"at\":\"7mfk:0003a94e\",\"kind\":\"l0\"},{\"key\":\"test_maf_coordinate_word_curve_and_both_publications_match_stock\",\"kind\":\"test\",\"path\":\"tools/kb/tests/test_airflow_transfer.py\"}],\"layouts\":[\"7mfk\"],\"note\":\"The 64 unsigned word cells at 0x000141f4 have implicit coordinate step 256. Adjacent ascending cells give y0+floor((y1-y0)*frac/65536), and descending cells give y0-floor((y0-y1)*frac/65536). Coordinate >=0x3f00 returns signed ROM16[base+126]; the caller stores only its low word. Bank 2 publication is in the BSR 0003b320 delay slot.\",\"relies\":\"structure\",\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"supports\":\"identity\",\"to\":\"ivory-gecko/tbl\",\"type\":\"lookup\",\"via\":[\"dual_bank_maf_coordinator/fn\",\"xanthic-kagu/fn\",\"precise-koala/fn\",\"didactic-civet/fn\"]},{\"layouts\":[\"7mfk\"],\"relies\":\"structure\",\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"role\":\"indexed_by\",\"supports\":\"identity\",\"to\":\"brass-ammonite/fn\",\"type\":\"reader\"},{\"layouts\":[\"7mfk\"],\"relies\":\"level\",\"supports\":\"identity\",\"to\":\"helpful-swine/fn\",\"type\":\"reader\"},{\"layouts\":[\"7mfk\"],\"relies\":\"level\",\"reverse_relies\":\"structure\",\"reverse_supports\":\"identity\",\"supports\":\"identity\",\"to\":\"dual_bank_maf_coordinator/fn\",\"type\":\"writer\"}],\"note\":[\"Exact DID 0x1205 and the continuous AN15-to-DID-to-map-to-DID 0x1209 trace establish the MAF and bank-2 identity.\",\"The input retains only the low 12 bits before lookup. Each implicit cell spans 16 input counts; its low four input bits form a Q0.16 fraction in multiples of 4096. Last-cell sign extension affects the function return register, not the unsigned published word. Software execution preserves the existing engineering-unit interpretation without validating it on hardware.\"],\"summary\":\"Bank 2 MAF transfer output from the 64-point word curve 0x000141f4 on 7mfk. FUN 0003a904 passes uint16(uint16(ffff1e4a)<<4) to wrapper 00026410 and stores its low word in ffff1056. The wrapper interpolates adjacent unsigned words below coordinate 0x3f00 and returns the sign-extended last word at or above it. FUN 0003a982 copies the stored unsigned output to the working filtering input; FUN 0003b520 uses the two bank outputs for contribution fractions.\",\"symbol\":[{\"address\":\"ffff1056\",\"evidence\":[{\"at\":\"7mfk:0003a94e\",\"key\":\"reference\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"000141f4\",\"0003a904\",\"0003a982\",\"0003b520\",\"ffff1056\"],\"span\":1}},{\"at\":\"7mfk:0003a998\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"000141f4\",\"0003a904\",\"0003a982\",\"0003b520\",\"ffff1056\"],\"span\":1}},{\"at\":\"7mfk:0003b542\",\"key\":\"reference\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"000141f4\",\"0003a904\",\"0003a982\",\"0003b520\",\"ffff1056\"],\"span\":1}}],\"layout\":\"7mfk\",\"name\":\"opalescent-pronghorn\",\"signed\":false,\"width\":16}],\"unit\":\"raw MAF quantity\"}"
