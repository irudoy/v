d as signed.\",\"symbol\":[{\"address\":\"ffff1dfc\",\"evidence\":[{\"at\":\"7mfk:0003b170\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003af42\",\"0003b252\",\"ffff1df2\",\"ffff1dfc\"],\"span\":1}},{\"at\":\"7mfk:0003b190\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003af42\",\"0003b252\",\"ffff1df2\",\"ffff1dfc\"],\"span\":1}},{\"at\":\"7mfk:0003b202\",\"key\":\"body\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003af42\",\"0003b252\",\"ffff1df2\",\"ffff1dfc\"],\"span\":1}},{\"at\":\"7mfk:0003b262\",\"key\":\"reference\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"0003af42\",\"0003b252\",\"ffff1df2\",\"ffff1dfc\"],\"span\":1}}],\"layout\":\"7mfk\",\"name\":\"imposing-auk\",\"signed\":true,\"width\":32}],\"unit\":\"raw MAF contribution\"}"
