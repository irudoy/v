 PID 0x10 declares ROM8[0x83ec]*ffff105c/256 as g/s*100 with the stock factor 105; a changed factor changes the declared conversion.\",\"On 7mfk, the independently assembled stock lookup executes 64 unsigned word cells with step 256, unsigned argument truncation, last-cell clamping, and both caller word stores. The source input advances one cell per 16 raw counts. The last word returns sign-extended before the caller word store. This executable contract supplies no additional hardware validation of the voltage axis or g/s conversion.\"],\"role\":\"table\",\"scale\":\"x*0.0041015625\",\"scale_level\":\"code\",\"summary\":\"Bank 1 MAF sensor transfer curve. FUN 0003a904 looks it up from the low 12 bits of bank-1 preprocessed sample ffff1e48, writes uint16 output A to ffff1054, and copies it to working value ffff1058. The same value enters total-MAF producer 0003b27e and the paired contribution calculation in 0003b520.\",\"symbol\":[{\"address\":\"00015996\",\"evidence\":[{\"at\":\"1me3b:000465f6\",\"kind\":\"l0\",\"note\":\"the target 0004656a of 550 bytes as 1ND0A 00042f50 reads the exact 64-point table second after 00015916 through the 64-point implicit leaf 0002abec\",\"supports\":\"homology\",\"to\":\"7mfk:00014274\"}],\"layout\":\"1me3b\",\"name\":\"radical-oryx\"},{\"address\":\"00015b42\",\"evidence\":[{\"at\":\"1nd:00042fdc\",\"kind\":\"l0\",\"note\":\"unique structural pair preserves interpolation-call order\",\"supports\":\"homology\",\"to\":\"7mfk:00014274\"}],\"layout\":\"1nd\",\"name\":\"nippy-porcupine\"},{\"address\":\"00014274\",\"evidence\":[{\"at\":\"7mfk:000228ac\",\"kind\":\"rom-bytes\",\"supports\":\"identity\",\"value\":\"ffff101c\"},{\"at\":\"7mfk:00026aa0\",\"kind\":\"unverified-site\",\"supports\":\"identity\"},{\"at\":\"7mfk:00026aa2\",\"kind\":\"unverified-site\",\"supports\":\"identity\"},{\"at\":\"7mfk:0003a924\",\"key\":\"reference\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"000083ec\",\"000093ce\",\"000142