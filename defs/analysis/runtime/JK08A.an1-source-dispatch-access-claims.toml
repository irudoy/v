role\":\"threshold\",\"scale\":\"x-50\",\"scale_level\":\"code\",\"summary\":\"Shared thermistor transfer table: interpolated uint8 code deg C+50 of input byte uint8(sample >> 2). In the coolant acquisition path, lookup by ffff1186 writes exact raw coolant response byte ffff1079; FUN 0008092e repeats that lookup and writes max(output-10,0) to coolant snapshot byte ffff3fa4. Lookup by ffff1178 writes fuel-temperature code ffff1f89 behind DID 0x1104 byte ffff1074. In the separate AN1 path, FUN 0003d2dc converts filtered phase samples to ffff2838/ffff2839, FUN 0003d4a8 publishes the unfiltered lane codes minus 10, and FUN 0003d45c folds the outputs into running minima whose element 0 reaches the P030 readiness gate. Other consumers use the same output as lower bound t of a [t, t+2] byte limiter.\",\"symbol\":[{\"address\":\"00012dea\",\"evidence\":[{\"at\":\"7mfk:00026aac\",\"kind\":\"unverified-site\",\"supports\":\"identity\"},{\"at\":\"7mfk:00026aae\",\"kind\":\"unverified-site\",\"supports\":\"identity\"},{\"at\":\"7mfk:0002c52a\",\"key\":\"reference\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"00012dea\",\"000263a0\",\"00026740\",\"0002c4f8\",\"00035856\",\"00039588\",\"00039874\",\"0003d2dc\",\"0003d45c\",\"0003d4a8\",\"0003d832\",\"0008092e\",\"ffff1079\",\"ffff1179\",\"ffff1186\",\"ffff1187\",\"ffff1f89\",\"ffff2832\",\"ffff2838\",\"ffff3f4c\",\"ffff3fa4\"],\"span\":1}},{\"at\":\"7mfk:0002c52e\",\"key\":\"reference\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"00012dea\",\"000263a0\",\"00026740\",\"0002c4f8\",\"00035856\",\"00039588\",\"00039874\",\"0003d2dc\",\"0003d45c\",\"0003d4a8\",\"0003d832\",\"0008092e\",\"ffff1079\",\"ffff1179\",\"ffff1186\",\"ffff1187\",\"ffff1f89\",\"ffff2832\",\"ffff2838\",\"ffff3f4c\",\"ffff3fa4\"],\"span\":1}},{\"at\":\"7mfk:0002c55c\",\"key\":\"reference\",\"kind\":\"l0-context\",\"supports\":\"identity\",\"value\":{\"named\":[\"00012dea\",\"000263a0\",\"00026740\",\"000