 the bit whenever 0xFFFE94CC.bit4 is clear. The stability flag requires 0xFFFE948D.bit6, the word 0xFFFE9328 at or above 0x8000 + ROM8[0x8C2E] - 0x80 = 0x8006, and a filtered deviation word (0xFFFE8B2E, 0xFFFE8B30) within ROM8[0x8C5A] = 14 of its reference (0xFFFE8CA2, 0xFFFE8CA4) on at least one bank. The window opens with the stability flag and 0xFFFE947A.bit6 set, the delay counter 0xFFFE958E at zero, and bits 0 and 1 of 0xFFFEA9EA and 0xFFFEA9EC clear, and runs for the curve 0x146D6 over the engine-oil-temperature axis 0x1372C, 5 at every node. The gate seeds the filter and loads the hold counter from the curve 0x1451E over the axis 0x13618. JK78C writes no value 14 to its mode byte."
