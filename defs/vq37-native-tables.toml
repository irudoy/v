semantics = "Alternate multiplicative fuel correction with raw 128 = 100% as neutral. It shares the index byte, both axes, and the interpolator of the projected default surface, and the downstream state selector reads it in place of that surface."
note = "The two 16x16 surfaces are read with the same index byte, the same axis pair, and the same interpolator in both accessors, so neither surface carries an engine-bank identity. The accessors publish four parallel compensation channels and the consumer selects one by a state code, then crossfades the value of the current state with the value of the previous state by a normalized progress weight where 0x8000 is 1.0. The default arm of that selector reads the projected canonical surface; this table is the arm the state code selects instead."

