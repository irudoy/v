coarse = 4
units = "Timing-state count"
confidence = "code"
scale_conf = "code"
scale_expr = "x-128"
to_byte = "x+128"
static_axis_name = "Engine Speed [RPM]"
static_axis = [0, 400, 800, 1200, 1600, 2000, 2400, 2800]
semantics = "Alternate warm DFCO-transition eight-point timing-state addend. It shares the index byte and the interpolator of the projected default table and is selected when the transition-completion latch is set."
note = "Both eight-point branches read the same index byte, so neither carries an engine-bank identity. The selector is the transition-completion latch: it sets when the normalized transition progress reaches 1.0 and releases at 0.891, and the default arm is the branch taken while the latch is clear."

