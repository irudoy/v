# VQ37 calibration tables and axes that have no VQ35HR canonical source. Two
# tables are the alternate arms of state selectors whose default arms carry the
# projected canonical role. The VVEL target surfaces, curves, and axes are the
# stock inputs of the VVEL selector modelled in JK78C.vvel.md. Every address,
# geometry, stock value block, and accessor literal-pool binding below is
# verified against the exact stock image before the entity reaches an editor
# definition. A pointer binding with an offset names a base literal that the
# accessor displaces; a role that a target does not carry is declared under
# its absent table with the code fact that removes it.

[target.JK78C]
stock_sha256 = "86387d1de1daa8bf5f98e071eb899be462b7a466cb43f88a96e4dc8b87892b8d"

