schema_version = 1

# VQ37 registers two calibration tables that have no VQ35HR canonical source.
# Each is the alternate arm of a state selector whose default arm carries the
# projected canonical role, so neither table is a per-bank duplicate. Every
# address, geometry, stock value block, and accessor literal-pool binding below
# is verified against the exact stock image before the table reaches an editor
# definition.

[target.JK78C]
stock_sha256 = "86387d1de1daa8bf5f98e071eb899be462b7a466cb43f88a96e4dc8b87892b8d"

[[target.JK78C.table]]
id = "fuel_compensation_alternate"
address = 0x00009FBA
width = 16
height = 16
storagetype = "uint8"
values_sha256 = "53d88e8d171f5202d75375b237dce6208fb307a195d269608f9683580eaad255"
pointer_bindings = [{ site = 0x0002FEBC, accessor = 0x0002F596 }, { site = 0x00040F70, accessor = 0x00040958 }]
axis_x = 0x00013AF8
axis_y = 0x00013B18
name = "Fuel Compensation - Main - Alternate"
category = "Fuelling / Compensation"
order = 21
format = "0.00"
fine = 0.78125
coarse = 3.125
units = "%"
confidence = "code"
scale_conf = "candidate"
scale_expr = "x*0.78125"
to_byte = "x/0.78125"
semantics = "Alternate multiplicative fuel correction with raw 128 = 100% as neutral. It shares the index byte, both axes, and the interpolator of the projected default surface, and the downstream state selector reads it in place of that surface."
note = "The two 16x16 surfaces are read with the same index byte, the same axis pair, and the same interpolator in both accessors, so neither surface carries an engine-bank identity. The accessors publish four parallel compensation channels and the consumer selects one by a state code, then crossfades the value of the current state with the value of the previous state by a normalized progress weight where 0x8000 is 1.0. The default arm of that selector reads the projected canonical surface; this table is the arm the state code selects instead."

