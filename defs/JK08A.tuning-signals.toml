# Canonical observation coverage for JK08A tuning work.
#
# This catalog distinguishes signals already carried by the custom CAN profile,
# values available in stock RAM or service 0x22, stock CAN context, and
# measurements that need new firmware instrumentation or external equipment.
# It does not assign a physical conversion where exact code and target evidence
# do not establish one.

schema_version = 1
rom = "JK08A"
telemetry_profile = "tuning"
full_rate_hz = 97.65625
rotating_divisor = 5

[[signal]]
id = "engine_speed"
domain = "engine"
label = "Engine speed"
priority = "core"
coverage = "stock-can"
current_fields = []
sources = [0xFFFF11F4]
widths = [2]
dids = [0x1201]
evidence = "exact-code"
note = "FUN 000384FE writes 0xFFFF11EE = 0xFFFF1196 >> 4 and the RPM/12.5 coordinate 0xFFFF11F4 = 0xFFFF1196 >> 6 in one pass, and FUN 000C577A serializes stock CAN 0x180 bytes 0..1 as sat_u16(0xFFFF11EE * 25), so (word // 25) >> 2 of the frame word is the coordinate while the product does not saturate, below 8193.75 RPM. The frame is sampled at another instant of the scheduler cycle than a snapshot; registry entry can_telemetry.stock_speed_bracket_2026_09_22 bounds the difference, and the custom stream does not carry the coordinate."

