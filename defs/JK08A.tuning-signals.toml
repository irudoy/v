note = "The ECM has no fuel-pressure input. The complete DTC descriptor tables at JK08A 0x19360 to 0x1A14C, JK78C 0x1B7AC to 0x1C5EC, and 1ND0A 0x1BE00 to 0x1CD84 declare 227, 217, and 237 distinct codes and none of P0087, P0088, P0190 to P0194, P0230 to P0232, or P0627 to P0629. Each table runs from P0183 straight to P0196. The service-0x22 pointer table declares manifold, atmospheric, and EVAP pressure DIDs but no fuel-pressure DID, and fuel-side sensing is limited to tank temperature through DID 0x1104 with codes P0181 to P0183. The factory VQ35HR manual treats fuel pressure as a gauge measurement during service rather than an ECM signal."

[[signal]]
id = "knock_margin"
domain = "knock"
label = "Minimum knock threshold margin per evaluator channel"
priority = "high"
coverage = "rotating"
current_fields = ["knock_margin_min_ch1_raw", "knock_margin_min_ch2_raw", "knock_margin_min_ch3_raw", "knock_margin_min_ch4_raw", "knock_margin_min_ch5_raw", "knock_margin_min_ch6_raw"]
sources = [0xFFFF5E10, 0xFFFF5E12, 0xFFFF5E14, 0xFFFF5E16, 0xFFFF5E18, 0xFFFF5E1A]
widths = [2, 2, 2, 2, 2, 2]
dids = []
evidence = "patch-design"
note = "Slice evaluator 0x0004A238 leaves the offset-binary metric of the evaluated channel at int32[0xFFFF21D8 + 4 * (channel - 1)] and its threshold at uint16[0xFFFF2144 + 2 * (channel - 1)], but each evaluation overwrites the pair of its channel, so a sampled pointer misses the evaluations between two snapshots. The wrapper behind the only literal of the evaluator at 0x0004A9C0 repeats the stock comparison after every evaluation and keeps the per-channel minimum of threshold minus metric as a signed word; an exceedance yields a negative margin limited at -32768. Context tag 4 publishes the six minimums and rearms them with the idle value 32767, which also stands for a margin of 32767 or more. Every channel is evaluated once per engine cycle; stock threshold rows 3 and 5 hold 0xFFFF, so those channels publish 32767 unless the metric exceeds 32768. The fields are named by evaluator channel: the channel index is the cylinder number of the event that opens the window, and the combustion event a window observes is not measured."

