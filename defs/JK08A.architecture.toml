[[chain]]
id = "ici0a-ratio-cell"
name = "ICI0A bounded ratio-cell action"
summary = """
The bounded input-capture handler window conditionally writes or retains an \
unsigned ratio byte and a separate reader window strictly compares it with a \
stock ROM scalar. At writer entry 0002909a, prev denotes independent \
incoming R12 and x denotes independent incoming R13, both narrowed to \
unsigned16. G samples gate bit 7 before skip-tail arming, and C denotes the \
incoming retained cell byte. The measuring producers, full ISR execution, \
physical units, timing, and hardware behavior are outside this proof."""
quantity = "Unsigned ratio byte, previous/current * 64"
output = "ffff196c"
specs = ["defs/JK08A.ici0a-ratio.md"]

