# Functional architecture of the exact JK08A family.
# Generated from architecture entities and meaning placements by kb project.
schema_version = 1
rom = "JK08A"
summary = """
Hitachi SH7058 engine control of the VQ25HR: sensor capture, engine-state \
estimation, control calculations, protection, and ATU-II actuator output, \
with diagnostic, communication, and platform support lanes."""

[sources]
functions = "defs/JK08A.funcs.csv"
variables = "defs/JK08A.vars.csv"
findings = "defs/JK08A.findings.csv"
maps = "defs/JK08A.maps.csv"
axes = "defs/JK08A.axes.csv"
presentation = "defs/JK08A.overrides.toml"

[[stage]]
id = "acquisition"
name = "Acquisition"
lane = "flow"
summary = """
Peripheral capture of crank and cam edges, analog and discrete inputs, and \
throttle position sensors."""

[[stage]]
id = "estimation"
name = "Engine state"
lane = "flow"
summary = """
Engine speed, airflow and load, temperatures, vehicle speed, accelerator \
pedal, engine torque, and knock estimates."""

[[stage]]
id = "control"
name = "Control calculations"
lane = "flow"
summary = """
Fuel quantity and phase, closed-loop fuel, ignition timing, valve timing, \
idle air, torque request, and throttle target."""

[[stage]]
id = "arbitration"
name = "Protection and arbitration"
lane = "flow"
summary = """
Fuel-output inhibit, deceleration fuel cut, request limiters, and the \
immobilizer."""

[[stage]]
id = "actuation"
name = "Actuator output"
lane = "flow"
summary = """
Injector, ignition, throttle, and output-driver scheduling onto the ATU-II \
timer unit."""

[[stage]]
id = "diagnostics"
name = "On-board diagnostics"
lane = "support"
summary = """
Monitors that qualify faults and the runtime DTC records they report into."""

[[stage]]
id = "communication"
name = "Communication"
lane = "support"
summary = "Diagnostic services, the HCAN1 network, and work-support adjustments."

[[stage]]
id = "platform"
name = "Platform"
lane = "support"
summary = """
Scheduler, startup, memory integrity, serial EEPROM access, and shared \
interpolation kernels."""

[[stage]]
id = "unattributed"
name = "Unattributed"
lane = "support"
summary = """
Reviewed components whose functional role the ledgers do not establish yet."""

[[block]]
id = "crank-cam"
name = "Crank and cam capture"
stage = "acquisition"
summary = """
ATU-II input-capture handlers for crank teeth and the four cam sensors, \
event-interval snapshots, cam edge-count monitors, and the crank and cam \
fault predicates."""
