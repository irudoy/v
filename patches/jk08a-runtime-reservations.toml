# Canonical cross-runtime ownership and future-growth budget for the exact
# 7MFKAVN86 family.
#
# Active ROM writes remain authoritative in each runtime composition model.
# This ledger assigns exclusive erased reserves and active RAM ownership across
# all installed runtimes. The map-switching claimed ROM envelope is a legacy
# compatibility boundary, not exclusive ownership.

schema_version = 1
rom = "JK08A"
ram_proven_free_start = 0xFFFF5D00
ram_proven_free_end = 0xFFFF7000

[[active_ram]]
owner = "map_switching"
start = 0xFFFF5D00
end = 0xFFFF5D3C
purpose = "Selector state, fuel-cut shadows, and throttle shadows."

[[active_ram]]
owner = "map_switching"
start = 0xFFFF6000
end = 0xFFFF6060
purpose = "Cruise-free stationary 0x284 latch, dual-APP selector state, tachometer hold state, and two-copy EEPROM persistence state."

[[active_ram]]
owner = "rolling_launch"
start = 0xFFFF5D40
end = 0xFFFF5D6C
purpose = "Rolling Launch state record."

[[active_ram]]
owner = "rolling_launch"
start = 0xFFFF6100
end = 0xFFFF6120
purpose = "Rolling Launch controller inputs, actuation diagnostics, and event integrals."

[[active_ram]]
owner = "can_telemetry"
start = 0xFFFF5E00
end = 0xFFFF5F90
purpose = "Queue state, two snapshot banks, event data, active slack, and the dynamic page configuration."

[[future_rom]]
owner = "can_telemetry"
start = 0x000D5000
end = 0x000D6000
purpose = "CAN telemetry executable and table expansion."

[[future_rom]]
owner = "rolling_launch"
start = 0x000D67F0
end = 0x000D6800
purpose = "Rolling Launch executable and configuration expansion."

[[future_rom]]
owner = "map_switching"
start = 0x000D6D80
end = 0x000D6E20
purpose = "Map Switching executable and table expansion."

[[future_rom]]
owner = "map_switching"
start = 0x000D7A00
end = 0x000D8000
purpose = "Map Switching EEPROM persistence and selector expansion."

[[future_ram]]
owner = "can_telemetry"
start = 0xFFFF5F90
end = 0xFFFF6000
purpose = "CAN telemetry queue or signal expansion."

[[future_ram]]
owner = "map_switching"
start = 0xFFFF6060
end = 0xFFFF6100
purpose = "Map Switching state or shadow expansion."

[[future_ram]]
owner = "rolling_launch"
start = 0xFFFF6120
end = 0xFFFF6160
purpose = "Rolling Launch veto-delivery scratch budget."

[[future_ram]]
owner = "rolling_launch"
start = 0xFFFF6160
end = 0xFFFF6200
purpose = "Rolling Launch state or controller expansion."
