# Authoritative in-memory composition contract for exact JK08A Rolling Launch.
#
# The composition extends the complete SHA-locked map-switching runtime. It is
# a verification fixture only: checksum fields are not recalculated and no
# output-file operation is exposed.
#
# Retired records and removed executable spans remain claimed and erased in
# the current write set. Historical endpoints use independent address books.
# The schema 6 ABI reserves code budgets; payloads_ready prevents image
# composition until the matching executable payloads are assembled and locked.
#
# hold_actuator states whether a payload consumes the torque fraction. While it
# is false, preflash refuses an image that enables a map in hold mode.

