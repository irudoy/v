# Authoritative wire schema and exact JK08A producer binding.
#
# The generator expands every multi-byte field to byte-source pointers used by
# the SH-2E capture loop and emits a ROM-neutral host decoder schema. Producer
# addresses, mailbox ownership, and ROM identity are not part of the host
# contract. The profile CRC covers the wire layout alone: protocol version,
# profile ID, page count, and the placement, width, and signedness of every
# slot. Names and scale strings are outside it, and a slot that carries a
# different quantity takes a new profile ID. The host contract of every
# retired profile ID stays frozen in can-telemetry-retired-profiles.json, so
# recordings of that ID remain decodable. Runtime arbitrary-address
# interpretation is intentionally unsupported.

schema_version = 2
rom = "JK08A"
protocol_version = 2
byte_order = "big"
mailbox = 26
candidate_can_id = 0x6F0
candidate_tick_divisor = 1
base_tick_numerator = 204800
pphi_hz = 20000000
fixed_page_count = 9
context_pages = [9, 10]
context_count = 5
header_sequence_bits = 4
table_address = 0x000D4C00
table_end = 0x000D4E00
configuration_address = 0x000D4E00
state_address = 0xFFFF5E00

