[profile.JK78C.evidence]
free_rom = "The 0x0001caac..0x0001ffff envelope is erased; recovered stock references at 0x0001e30c and in the final reserve remain outside every runtime write range."
free_ram = "TraceRamAccesses PASS for 0xffff0c00..0xffff0fff across 2,969 recovered functions: zero accesses, calls, candidates, or decompiler failures."
maps = "Reviewed JK08A-to-JK78C interpolation contracts, target call topology, bank-local storage, and the native 190-byte fuel-cut state machine bind fourteen supported VQ37 families. The two ignition families are the 16x16 surfaces of the coordinator half that stock ROM8[0x8965] bit 5 executes; the three equal-byte surfaces of the gated half pass through the adapter."
can = "HCAN1 D800 initialization, the SLE1 vector, exact serializer, mailbox records, payload binding, and knock-event path bind the transport runtime."
telemetry = "ECU-RAM fields use per-layout source symbols, whose records own each address qualification. A source with an unresolved layout status or an explicitly unsupported wire role is encoded from cleared reserved RAM and remains unavailable in metadata. The exhaust CVTC candidates require independently reviewed target producer-consumer bindings before their fields can be exposed. The intake solenoid duty fields decode their x*25/64 percent source cells with the x*39/100 wire scale, within 0.16 percentage points. A one-bit source that the layout keeps in another bit than 7mfk moves into the wire bit that the contract decodes, and the other bits of its wire byte are cleared; a source of the dynamic page moves only while the page carries its default row."
