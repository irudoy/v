[profile.1EK7A.evidence]
free_rom = "The stock image has an erased flash window from 0x00162000 through 0x00165FFF. The application checksums cover it. The runtime starts at 0x00162108."
free_ram = "The periodic-access and boot-initialization audits place the runtime within 0xFFFF5600 through 0xFFFF59FF. Service 0xA0 mode 0x01 briefly tests each word with ordinary interrupts masked and restores it before unmasking. The runtime claims the first 0x300 bytes. The asynchronous diagnostic cases require bench validation."
maps = "Reviewed exact 1EK7A call pools, calibration storage, native limiter consumers, and the ASCD selector and feedback dispatch bind the relocated five-slot runtime."
can = "The main-loop snapshot call, both HCAN1 init calls, SLE1 vector, serializer dispatch, payload binding, and knock event path bind the transport runtime. The stock HCAN1 initializer reads 36 records at 0x9944. The mailbox 26 and 31 records at 0x99A8 and 0x99BC are inactive, mailbox 28 at 0x99B0 remains stock, and the A3 feedback record at 0x99C4 aliases mailbox 1. Completion tail-chains the stock SLE1 ISR."
telemetry = "Exact matched accessors and stock diagnostic table offsets bind the ECU-RAM fields. The knock surface source tests bit 7 at 0xAC3DC; the LTFT neutral control tests and sets bit 5 at 0x86D04 and 0x86D24. Capture moves those bits into their respective wire positions. The P0014 and P0024 descriptors are absent, and the data slots of DIDs 0x1164 to 0x1166 have no active exhaust CVTC publisher. Scheduler 0x21274 copies the adjacent state bytes without snapshotting the knock surface byte; coordinator 0x73348 has no direct Q8 timing-map difference, inhibit-history update, or separate signed timing state. The corresponding fields use cleared reserved RAM."

