schema_version = 1

# Pairwise measurements use fixed-address comparison plus exact code-window
# matching at any even target address. The window metric excludes low-information
# blocks so erased flash and long fill runs do not inflate code similarity.
[analysis]
code_start = 0x020000
window_size = 64
source_stride = 64
target_stride = 2
page_size = 256
min_distinct_bytes = 8
max_dominant_fraction = 0.75

[family.sh7058_7mfkavn86]
kind = "exact-code"
members = ["JK00A", "JK03A", "JK03B", "JK08A"]
canonical = "JK08A"
mcu = "SH7058"
flash_size = 0x100000
software_ids = ["7MFKAVN86"]
same_address_inheritance = true
calibration_region = "0x008200:0x020000"
exact_ranges = ["0x000000:0x008200", "0x020000:0x100000"]
evidence = "All declared exact ranges and 2,312 confirmed JK08A executable function ranges are byte-identical. Differences are confined to calibration, identity, diagnostic, and checksum storage below 0x020000."

[family.sh7059_1nd]
kind = "exact-code"
members = ["1ND0A", "1ND3B"]
canonical = "1ND0A"
mcu = "SH7059"
flash_size = 0x180000
software_ids = ["8FZ35NEE6"]
same_address_inheritance = true
calibration_region = "0x008200:0x020000"
exact_ranges = ["0x000000:0x008200", "0x020000:0x180000"]
evidence = "The complete 1ND0A Ghidra function census and all bytes outside the lower calibration window are identical in 1ND3B. The two images differ at 5,251 byte positions from 0x008200 through 0x01bdfb."

[family.sh7059_1me3b]
kind = "distinct-code"
members = ["1ME3B"]
canonical = "1ME3B"
mcu = "SH7059"
flash_size = 0x180000
software_ids = ["9FZ3V5DD1"]
same_address_inheritance = false
evidence = "No other image in the collection reaches near-code similarity. Address-independent exact 64-byte code windows cover 18.96 percent symmetrically against the SH7059 1ND pair, and radiff2 6.1.6 reports Myers similarity 0.815 with edit distance 581,292. The same metric reads 0.790 for the declared divergent JK08A and JK00D pair and 0.979 for the near-code JK00C and JK00D pair, so 1ME3B sits in the divergent band. Programmed content reaches 0x139dc3 against 0x12c98f in 1ND, so the application is larger and independently laid out."

[family.sh7058_8mfk]
kind = "near-code"
members = ["JK00C", "JK00D"]
canonical = "JK00D"
mcu = "SH7058"
flash_size = 0x100000
software_ids = ["8MFKPCN14", "8MFK36N15"]
same_address_inheritance = false
evidence = "The images have 97.9 percent Myers edit similarity with distance 43,104 in radiff2 6.1.6. Address-independent exact 64-byte code windows confirm the common lineage, while insertions and relocations make direct address inheritance invalid."

[family.sh7058_jk78c]
kind = "distinct-code"
members = ["JK78C"]
canonical = "JK78C"
mcu = "SH7058"
flash_size = 0x100000
software_ids = ["7MFVH3NM1", "7MFV68NV"]
same_address_inheritance = false
evidence = "No second image in the current collection has exact-code or near-code similarity. The image occupies almost the complete one-MiB flash and uses addresses distinct from the other SH7058 families."

[[relationship]]
left_family = "sh7058_7mfkavn86"
right_family = "sh7058_8mfk"
kind = "same-generation-divergent-code"
direct_address_inheritance = false
evidence = "Both families use SH7058 and retain exact common routines, but only about 15 percent of meaningful 64-byte code windows match conservatively in both directions. Reviewed homologs confirm relocated algorithms rather than common addresses."

[[relationship]]
left_family = "sh7058_jk78c"
right_family = "sh7059_1nd"
kind = "cross-generation-engine-homolog"
direct_address_inheritance = false
evidence = "Both applications are VQ37VHR. Exact relocated anchors exist, including long blocks shifted from the JK78C 0x0e2xxx area to the 1ND0A 0x10axxx area, but whole-image and code-window similarity are low. Semantic transfer requires independent structure recovery."

[[relationship]]
left_family = "sh7059_1me3b"
right_family = "sh7059_1nd"
kind = "same-generation-divergent-code"
direct_address_inheritance = false
evidence = "Both families are SH7059 1.5 MiB images that share the boot and vector blocks. Below 0x008200 1ME3B differs from 1ND0A at only 14 byte positions: a four-byte value at 0x005fe0, the stored SUM16 fields at 0x005ffe and 0x006efe, and the software identifier at 0x006f09. The four 1ND SUM16 domains reproduce exactly in 1ME3B at the same field addresses, while the runtime XOR and SUM fields move from 0x009610 and 0x009618 to 0x0096f4 and 0x0096fc. The diagnostic descriptor region is byte-identical across 1,936 bytes at a constant +0x164 relocation, placing 1ND0A 0x01c558:0x01cce8 at 0x01c6bc:0x01ce4c. Code windows and Myers similarity place the executable regions in separate layouts."

[[relationship]]
left_family = "sh7059_1me3b"
right_family = "sh7058_jk78c"
kind = "cross-generation-engine-homolog"
direct_address_inheritance = false
evidence = "Both applications carry the VQ37 diagnostic descriptor layout without the exhaust camshaft records. Exact relocated anchors exist, the longest being 1,387 bytes from 1ME3B 0x025464 to JK78C 0x024c98, but symmetric code-window coverage is 1.17 percent. Semantic transfer requires independent structure recovery."
