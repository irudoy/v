[project]
name = "vq-hr-ecu-tuning"
version = "0.1.0"
description = "Reverse-engineering and firmware verification tools for Nissan and Infiniti HR-series ECUs"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
    "neo4j>=5.28,<7",
    "pytest>=9,<10",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = [
    "patches/tests",
    "tools/tests",
    "tools/mapkit/tests",
    "tools/maps/tests",
    "tools/memgraph/tests",
    "tools/diagnostics/tests",
    "tools/logs/tests",
    "tools/can_dashboard/tests",
    "tools/romviz/tests",
]
python_files = ["test_*.py"]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
