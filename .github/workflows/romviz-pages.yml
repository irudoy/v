name: Publish ROM atlas

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [master]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  package:
    name: Package the verified atlas
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pages: read
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v8
        with:
          name: rom-atlas
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: tmp/romviz/artifact
      - name: Stage the Pages index
        run: |
          mkdir -p tmp/romviz/pages
          cp tmp/romviz/artifact/rom-atlas.html tmp/romviz/pages/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: tmp/romviz/pages

  deploy:
    name: Deploy ROM atlas
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
