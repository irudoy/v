name: Publish ROM atlas

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build ROM atlas
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Set up the analysis workspace
        run: make setup
      - name: Build the Pages index
        run: make romviz ROMVIZ_OUTPUT=tmp/romviz/pages/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: tmp/romviz/pages

  deploy:
    name: Deploy ROM atlas
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
